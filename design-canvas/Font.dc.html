<div lang="ko" style="width: 1180px; height: 980px; box-sizing: border-box; background: #DDE7F2; padding: 28px 30px;
            display: flex; flex-direction: column; gap: 18px; font-family: inherit; color: #333D4B;">

  <span style="display: flex; align-items: baseline; gap: 12px;">
    <b style="font-weight: 820; font-size: 19px; line-height: 1.2; letter-spacing: -.035em; color: #191F28;
              font-family: inherit;">서체 시안 · 점토에 무엇이 맞나</b>
    <span style="font-weight: 750; font-size: 11.5px; line-height: 1.4; color: #4E5968; font-family: inherit;">같은 카드를 서체만 바꿔 그렸습니다. 견본이 아니라 실제 물건으로 봅니다</span>
  </span>

  <div style="flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, 1fr);
              grid-template-rows: 1fr 1fr; gap: 18px;">

    <sc-for list="{{fonts}}" as="f" hint-placeholder-count="6">
      <div style="display: flex; flex-direction: column; gap: 12px; min-width: 0; padding: 16px 18px 18px;
                  border-radius: 26px; background: {{f.panelBg}}; box-shadow: {{f.panelShadow}};">

        <span style="display: flex; align-items: baseline; gap: 8px;">
          <b style="font-weight: 820; font-size: 14px; line-height: 1.2; letter-spacing: -.03em; color: #191F28;
                    font-family: inherit;">{{f.name}}</b>
          <span style="font-weight: 750; font-size: 10.5px; line-height: 1; color: #4E5968; font-family: inherit;
                       font-variant-numeric: tabular-nums;">{{f.weights}}</span>
        </span>

        <div style="display: flex; gap: 14px; min-width: 0;">

          <!-- 실제 물건: 공유 카드 4:5 -->
          <div style="width: 168px; height: 210px; flex: none; box-sizing: border-box; border-radius: 20px;
                      overflow: hidden; padding: 13px 12px 12px; display: flex; flex-direction: column;
                      font-family: {{f.stack}};
                      background: linear-gradient(178deg, #FDF7EF 0%, #F5F7F0 44%, #E7F2EE 100%);
                      box-shadow: 0 18px 32px -16px rgba(25,31,40,.4), inset 0 0 0 2px rgba(243,216,203,.9);">
            <b style="font-weight: {{f.wBold}}; font-size: 8px; line-height: 1; letter-spacing: .17em;
                      color: #0B6156;">DESKFIT</b>
            <span style="flex: 1; min-height: 0; display: grid; place-items: center; position: relative;">
              <span style="position: absolute; width: 104px; height: 104px; border-radius: 50%;
                           background: radial-gradient(circle at 50% 42%, #EAF6F0 0%, #D8EEE4 58%, rgba(216,238,228,0) 100%);"></span>
              <img src="./turtle.png" alt="" style="position: relative; height: 106px; display: block;">
            </span>
            <span style="display: flex; align-items: flex-end; justify-content: space-between; gap: 8px;">
              <span style="min-width: 0;">
                <span style="display: block; font-weight: {{f.wMid}}; font-size: 8.5px; line-height: 1;
                             color: #4E5968;">회복</span>
                <b style="display: block; margin-top: 5px; font-weight: {{f.wBold}}; font-size: 30px;
                          line-height: .84; letter-spacing: -.05em; color: #191F28;
                          font-variant-numeric: tabular-nums;">4<span style="font-size: 12px; margin-left: 2px; color: #333D4B;">번</span></b>
              </span>
              <span style="text-align: right; flex: none;">
                <b style="display: block; font-weight: {{f.wBold}}; font-size: 11.5px; line-height: 1;
                          letter-spacing: -.03em; color: #191F28; font-variant-numeric: tabular-nums;">46분 집중</b>
                <span style="display: block; margin-top: 4px; font-weight: {{f.wMid}}; font-size: 8.5px;
                             line-height: 1; color: #4E5968; font-variant-numeric: tabular-nums;">8월 26일</span>
              </span>
            </span>
            <span style="display: flex; gap: 3px; margin-top: 10px; height: 8px;">
              <sc-for list="{{band}}" as="b" hint-placeholder-count="9">
                <span style="flex: {{b.w}}; border-radius: 99px; background: {{b.hue}};"></span>
              </sc-for>
            </span>
          </div>

          <!-- 같은 서체로 화면 안 위계 네 단 -->
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 9px;
                       font-family: {{f.stack}};">
            <b style="font-weight: {{f.wBold}}; font-size: 19px; line-height: 1.25; letter-spacing: -.035em;
                      color: #191F28;">학교 랭킹전</b>
            <b style="font-weight: {{f.wBold}}; font-size: 30px; line-height: 1; letter-spacing: -.04em;
                      color: #191F28; font-variant-numeric: tabular-nums;">4시간 42분</b>
            <span style="font-weight: {{f.wMid}}; font-size: 12px; line-height: 1.6; color: #333D4B;">기준보다 무너지면 알려 줘요</span>
            <span style="font-weight: {{f.wMid}}; font-size: 10.5px; line-height: 1; letter-spacing: .04em;
                         color: #4E5968;">시즌 종료까지 4일 18시간</span>
          </span>
        </div>

        <span style="display: flex; align-items: flex-start; gap: 8px; margin-top: auto;">
          <span style="margin-top: 4px; width: 7px; height: 7px; flex: none; border-radius: 50%;
                       background: {{f.verdictHue}};"></span>
          <span style="font-weight: 750; font-size: 11px; line-height: 1.6; color: #333D4B;
                       font-family: inherit;">{{f.note}}</span>
        </span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    const OK = '#3FD9C0', WARN = '#F5C451';
    const seq = [[20, OK], [4, WARN], [17, OK], [4, WARN], [23, OK], [4, WARN], [13, OK], [4, WARN], [11, OK]];
    const plain = {
      panelBg: '#F2F7FD',
      panelShadow: '0 20px 36px -18px rgba(25,31,40,.36), inset 0 6px 12px rgba(255,255,255,.96), inset 0 -7px 13px rgba(86,110,146,.16)'
    };
    const now = {
      panelBg: 'linear-gradient(165deg, #E4F5F0, #DCEBF7)',
      panelShadow: '0 22px 40px -18px rgba(18,134,122,.38), inset 0 0 0 2px #3FE0C9, inset 0 6px 12px rgba(255,255,255,.9)'
    };
    const GOOD = '#21C4AE', SO = '#F5C451', NO = '#E07A66';
    return {
      band: seq.map(([w, hue]) => ({ w, hue })),
      fonts: [
        { ...now, name: 'Wanted Sans', weights: '400–1000 가변', stack: "'Wanted Sans Variable', sans-serif",
          wBold: 820, wMid: 750, verdictHue: GOOD,
          note: '지금 쓰는 것. 자간이 좁고 끝이 각져서 화면은 또렷한데, 점토의 둥근 면과는 성격이 어긋납니다.' },
        { ...plain, name: 'Pretendard', weights: '400–800', stack: "'Pretendard Spec', sans-serif",
          wBold: 800, wMid: 500, verdictHue: GOOD,
          note: '속공간이 넓고 획 끝이 덜 날카롭습니다. 같은 크기에서 더 부드럽게 읽혀 점토와 붙습니다.' },
        { ...plain, name: 'Noto Sans KR', weights: '100–900', stack: "'Noto Sans KR', sans-serif",
          wBold: 800, wMid: 500, verdictHue: SO,
          note: '굵기가 아홉 단이라 위계는 제일 자유롭습니다. 다만 표정이 없어 카드가 시스템 화면처럼 보입니다.' },
        { ...plain, name: 'IBM Plex Sans KR', weights: '400–700', stack: "'IBM Plex Sans KR', sans-serif",
          wBold: 700, wMid: 500, verdictHue: SO,
          note: '획이 곧고 기계적입니다. 대시보드에는 맞지만 점토 캐릭터 옆에서는 차갑습니다.' },
        { ...plain, name: 'Gowun Dodum', weights: '400 한 단', stack: "'Gowun Dodum', sans-serif",
          wBold: 400, wMid: 400, verdictHue: NO,
          note: '가장 부드럽지만 굵기가 하나뿐입니다. 큰 숫자를 굵게 못 만들어 위계가 크기와 색으로만 남습니다.' },
        { ...plain, name: 'Jua', weights: '400 한 단', stack: "'Jua', sans-serif",
          wBold: 400, wMid: 400, verdictHue: NO,
          note: '둥글기는 점토와 가장 닮았습니다. 그런데 본문에 쓰면 금방 피곤하고, 숫자가 장난스러워집니다.' }
      ]
    };
  }
}
