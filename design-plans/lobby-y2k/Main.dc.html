<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Gothic+A1:wght@400;500;700;800;900&display=swap">
  <style>
    body { margin: 0; background: #F2FAF8; }
    a { color: #0D7769; } a:hover { color: #0C5A4F; }
    * { box-sizing: border-box; }
    /* Y2K 눌림 — 누를 때 요소는 3px 내려가고 그림자 오프셋은 3px 줄어듭니다.
       그림자의 절대 위치가 그대로라 간격만 닫히며 종이에 붙습니다.
       :active 한 순간만 칠해지므로 연속 애니메이션이 아닙니다. */
    .y2k-btn { cursor: pointer; box-shadow: 6px 6px 0 #2B3230, inset 0 2px 0 rgba(255,255,255,.45); transition: transform .09s linear, box-shadow .09s linear; }
    .y2k-btn:active { transform: translate(3px, 3px); box-shadow: 3px 3px 0 #2B3230, inset 0 2px 0 rgba(255,255,255,.45); }
    .y2k-btn.plain { box-shadow: 6px 6px 0 #2B3230; }
    .y2k-btn.plain:active { box-shadow: 3px 3px 0 #2B3230; }
    .y2k-btn.sm { box-shadow: 4px 4px 0 #2B3230, inset 0 2px 0 rgba(255,255,255,.45); }
    .y2k-btn.sm:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #2B3230, inset 0 2px 0 rgba(255,255,255,.45); }
  </style>
</helmet>

<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #F2FAF8; font-family: 'Gothic A1', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;">

  <img src="campus.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 74%;">
  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, #F2FAF8 0%, rgba(242,250,248,0.94) 26%, rgba(242,250,248,0.52) 46%, rgba(242,250,248,0.14) 66%, rgba(242,250,248,0.30) 100%);"></div>
  <div style="position: absolute; inset: 0; opacity: 0.5; background-image: repeating-linear-gradient(0deg, rgba(43,50,48,0.05) 0 1px, transparent 1px 3px);"></div>

  <div style="position: relative; display: flex; flex-direction: column; align-items: center; height: 100%; padding: 26px 0 0;">

    <div style="display: flex; gap: 44px; align-items: center;">
      <a href="#" style="font-size: 14px; font-weight: 800; letter-spacing: 0.14em; color: {{ink}}; text-decoration: none;">홈</a>
      <a href="#" style="font-size: 14px; font-weight: 500; letter-spacing: 0.14em; color: {{ink2}}; text-decoration: none;">랭킹전</a>
      <a href="#" style="font-size: 14px; font-weight: 500; letter-spacing: 0.14em; color: {{ink2}}; text-decoration: none;">마이페이지</a>
    </div>

    <sc-if value="{{lobby}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 76px;">
        <div style="font-family: 'Archivo Black', 'Arial Black', sans-serif; font-size: 96px; line-height: 0.9; letter-spacing: 0.02em; color: {{accent}}; text-shadow: 6px 6px 0 rgba(43,50,48,0.22);">DESKFIT</div>
        <div style="font-size: 15px; font-weight: 700; letter-spacing: 0.34em; color: {{ink}}; padding-left: 0.34em;">자세교정과 공부를 한자리에서</div>
      </div>
    </sc-if>

    <sc-if value="{{lobby}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 18px; margin-top: 92px;">
        <button class="y2k-btn" type="button" onClick="{{open}}" style="font-family: inherit; font-size: 22px; font-weight: 900; letter-spacing: 0.1em; color: {{ink}}; background: {{accent}}; border: 2px solid {{ink}}; border-radius: 0; padding: 20px 78px; cursor: pointer; box-shadow: inset 0 2px 0 rgba(255,255,255,0.45);">세션 시작</button>
        <div style="font-size: 13px; font-weight: 500; color: {{ink2}}; letter-spacing: 0.02em;">누르면 혼자 앉을지 같이 앉을지 고를 수 있어요</div>
      </div>
    </sc-if>

    <sc-if value="{{choose}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; align-items: center; margin-top: 46px;">
        <dc-import name="Chooser" accent="{{accent}}" hint-size="1120px,760px"></dc-import>
      </div>
    </sc-if>

    <div style="margin-top: auto; width: 100%; display: flex; align-items: center; gap: 0; border-top: 2px solid {{ink}}; background: rgba(255,255,255,0.9); box-shadow: inset 0 2px 0 rgba(255,255,255,0.6);">
      <div style="padding: 9px 22px; font-size: 12px; font-weight: 800; letter-spacing: 0.12em; color: {{ink}}; border-right: 2px solid {{ink}};">명지대학교</div>
      <div style="padding: 9px 22px; font-size: 12px; font-weight: 500; letter-spacing: 0.04em; color: {{ink2}}; border-right: 2px solid {{ink}};">지금 {{live}}명이 앉아 있어요</div>
      <div style="margin-left: auto; padding: 9px 22px; font-size: 12px; font-weight: 500; letter-spacing: 0.04em; color: {{ink2}};">카메라는 내 기기에서만 돌아가요</div>
    </div>

  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#2DD4BF","options":["#2DD4BF","#56DCCA","#12A592","#0D7769"]},"start":{"editor":"enum","default":"lobby","options":["lobby","choose"]}}'>
class Component extends DCLogic {
  renderVals() {
    const start = this.props.start ?? 'lobby';
    const open = this.state && this.state.open !== undefined ? this.state.open : start === 'choose';
    return {
      accent: this.props.accent ?? '#2DD4BF',
      ink: '#2B3230',
      ink2: '#5C6663',
      live: 23,
      lobby: !open,
      choose: open,
      open: () => this.setState({ open: true }),
      back: () => this.setState({ open: false }),
    };
  }
}
</script>
</body>
</html>
