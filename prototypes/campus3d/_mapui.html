<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>M 지도 · 클레이 마커 검수</title>
<!-- 지도 위 마커를 눈으로 맞춰 보는 판입니다. 여기서 좌표와 모양을
     확정한 뒤 index.html 의 M 지도에 그대로 옮깁니다.
     `_` 로 시작해 배포본에서 빠집니다. -->
<link rel="stylesheet" href="../../public/fonts/wanted-sans/WantedSansVariable.css">
<style>
  :root{
    --ff:'Wanted Sans Variable','Wanted Sans',Pretendard,'Apple SD Gothic Neo',sans-serif;
    --clay:#F6F9FD; --clay2:#EAF0F8; --clay3:#DAE3EF;
    --clayUp:0 10px 22px -8px rgba(58,80,112,.30), 0 -4px 12px -6px rgba(255,255,255,.95),
             inset 0 2px 0 rgba(255,255,255,.96), inset 0 -3px 0 rgba(86,110,146,.13);
    --clayUp2:0 5px 12px -5px rgba(58,80,112,.26), inset 0 1.5px 0 rgba(255,255,255,.95),
             inset 0 -2px 0 rgba(86,110,146,.12);
    --clayIn:inset 0 3px 7px rgba(62,84,118,.22), inset 0 -1.5px 0 rgba(255,255,255,.75);
    --cInk:#22303F; --cInk2:#3F4E60; --cInk3:#79879A;
    --mint:#B7EBE1; --mintD:#12867A;
  }
  html,body{margin:0;height:100%;background:#7FB2DD;font-family:var(--ff);
    -webkit-font-smoothing:antialiased}
  .wrap{height:100%;display:grid;place-items:center;padding:24px;box-sizing:border-box}

  /* 지도 판 — 찰흙 액자 */
  .board{position:relative;padding:14px;border-radius:30px;background:var(--clay);
    box-shadow:0 30px 70px -24px rgba(40,58,84,.44), inset 0 3px 0 rgba(255,255,255,.95),
      inset 0 -5px 0 rgba(86,110,146,.13)}
  .cap{display:flex;align-items:center;gap:10px;margin:2px 6px 12px}
  .cap b{font:700 15px/1 var(--ff);letter-spacing:-.012em;color:var(--cInk)}
  .cap i{font-style:normal;font:500 12px/1 var(--ff);color:var(--cInk2)}
  .cap span{margin-left:auto;font:500 12px/1 var(--ff);color:var(--cInk2)}
  .cap kbd{background:var(--clay2);box-shadow:var(--clayIn);border:0;border-radius:7px;
    padding:3px 7px;font:700 11px/1 var(--ff);color:var(--cInk2)}

  .map{position:relative;width:min(720px,78vmin);aspect-ratio:1;border-radius:20px;
    overflow:hidden;box-shadow:var(--clayIn)}
  .map img{width:100%;height:100%;display:block;object-fit:cover}

  /* ── 마커 ──
     솟은 찰흙 알약 + 아래로 뻗은 짧은 목. 목이 있어야 "이 건물"을
     가리키는 것이 되고, 없으면 그냥 떠 있는 이름표가 됩니다. */
  .pin{position:absolute;transform:translate(-50%,-100%);
    display:flex;flex-direction:column;align-items:center;gap:0;
    border:0;background:none;padding:0;cursor:pointer;
    transition:transform .14s cubic-bezier(.2,.9,.3,1)}
  .pin:hover{transform:translate(-50%,-100%) translateY(-3px)}
  .pin:active{transform:translate(-50%,-100%) translateY(0)}
  .pin .body{display:flex;align-items:center;gap:7px;
    padding:6px 10px 6px 7px;border-radius:14px;
    background:var(--clay);box-shadow:var(--clayUp);white-space:nowrap}
  .pin .ic{flex:none;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;
    background:var(--clay2);box-shadow:var(--clayIn);color:var(--cInk2)}
  .pin .ic svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.4;
    stroke-linecap:round;stroke-linejoin:round}
  .pin .t{font:700 13px/1 var(--ff);letter-spacing:-.012em;color:var(--cInk)}
  .pin .n{flex:none;width:19px;height:19px;border-radius:6px;display:grid;place-items:center;
    background:var(--clay3);box-shadow:var(--clayIn);
    font:700 11px/1 var(--ff);color:var(--cInk2);font-variant-numeric:tabular-nums}
  /* 목 — 알약 아래에서 건물까지 */
  .pin .stem{width:3px;height:var(--stem,16px);border-radius:0 0 3px 3px;background:var(--clay);
    box-shadow:0 3px 6px -2px rgba(58,80,112,.4)}
  .pin .dot{width:11px;height:11px;border-radius:50%;background:var(--clay);
    box-shadow:var(--clayUp2), 0 0 0 3px rgba(255,255,255,.55);margin-top:-2px}

  /* 지금 있는 곳 — 눌린 자리 + 민트. 색을 못 가려도 눌림으로 읽힙니다 */
  .pin.here .body{background:var(--mint);box-shadow:var(--clayIn)}
  .pin.here .t{color:var(--mintD)}
  .pin.here .ic{background:rgba(255,255,255,.6);color:var(--mintD);box-shadow:none}
  .pin.here .n{background:rgba(255,255,255,.55);color:var(--mintD)}
  .pin.here .dot{background:var(--mint)}

  @media (prefers-reduced-motion:reduce){ .pin{transition:none} }
</style>
</head>
<body>
<div class="wrap">
  <div class="board">
    <div class="cap"><b>Deskfit</b><i>캠퍼스 전체</i>
      <span>누르거나 <kbd>1</kbd>~<kbd>7</kbd> 로 이동 · <kbd>M</kbd> 닫기</span></div>
    <div class="map" id="map">
      <img src="assets/campus-map-v2-1920.png" alt="캠퍼스 지도">
    </div>
  </div>
</div>

<script>
/* 그림 위 자리는 0~1 비율로 적습니다. 지도를 다시 뽑아도 이 표만
   고치면 되고, 판 크기가 바뀌어도 따라옵니다. */
const SPOT = [
  /* 자리는 plan.js 의 월드 좌표를 그림 위에 옮긴 것입니다.
     본관(0,-42) 북 · 도서관(-40,-6) 정서 · 학생회관(40,-6) 정동 ·
     기숙사(36,-62) 본관 우측 뒤 · 미니게임관(88,30) · 상점(118,30) 동쪽 끝.
     그림에서 건물을 찾는 단서는 **지붕색**입니다 — campus.js 의
     dressEntrance() 가 쓰는 색과 그림이 그대로 맞아떨어집니다. */
  { n: 1, key: 'mainhall', ko: '본관',      x: .500, y: .330, ic: 'hall' },   // 파란 지붕
  { n: 2, key: 'library',  ko: '도서관',    x: .360, y: .420, ic: 'book' },   // 청록 돔, 광장 바로 서쪽
  { n: 3, key: 'union',    ko: '학생회관',  x: .620, y: .460, ic: 'board' },  // 초록 둥근 지붕, 광장 바로 동쪽
  /* 미니게임관과 상점은 나란히 붙어 있어 이름표가 겹칩니다.
     4번 목을 길게 빼서 위로 올리고 5번은 그대로 둬 어긋냅니다. */
  { n: 4, key: 'arcade',   ko: '미니게임관', x: .800, y: .530, ic: 'dice', stem: 48 },  // 보라 지붕
  { n: 5, key: 'shop',     ko: '동아리 상점', x: .900, y: .520, ic: 'shirt' },          // 주홍 지붕
  { n: 6, key: 'dorm',     ko: '기숙사',    x: .610, y: .260, ic: 'bed' },    // 주황 지붕, 본관 우측 뒤
  /* 7번은 정문이 아니라 **광장** 입니다. 분수 바로 아래를 찍어야
     3번 이름표와 안 겹칩니다(둘 다 y .46 이면 나란히 붙습니다). */
  { n: 7, key: 'plaza',    ko: '광장',      x: .470, y: .520, ic: 'fount' },
];
const ICON = {
  hall:  '<path d="M3 20h18M5 20V9l7-5 7 5v11M9 20v-6h6v6"/>',
  book:  '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M8 7h7"/>',
  board: '<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>',
  dice:  '<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8.5 8.5h.01M15.5 15.5h.01M12 12h.01"/>',
  shirt: '<path d="M8 3 5 5v5h3v11h8V10h3V5l-3-2-4 2z"/>',
  bed:   '<path d="M3 18v-8h13a4 4 0 0 1 4 4v4M3 14h17M6 10V7h5v3"/>',
  fount: '<path d="M12 3v7M9 6.5a3 3 0 0 1 6 0"/><path d="M5 12h14l-1.3 8H6.3z"/>',
};
/* 지금 있는 곳 — 실제로는 window.__room() 이 줍니다 */
const HERE = 'library';

const map = document.getElementById('map');
for (const s of SPOT) {
  const b = document.createElement('button');
  b.className = 'pin' + (s.key === HERE ? ' here' : '');
  b.style.left = (s.x * 100) + '%';
  b.style.top = (s.y * 100) + '%';
  if (s.stem) b.style.setProperty('--stem', s.stem + 'px');
  b.innerHTML =
    `<span class="body"><span class="ic"><svg viewBox="0 0 24 24">${ICON[s.ic]}</svg></span>`
    + `<span class="t">${s.ko}</span><span class="n">${s.n}</span></span>`
    + '<span class="stem"></span><span class="dot"></span>';
  map.appendChild(b);
}
</script>
</body>
</html>
