<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Deskfit">
  <!-- 가로 막대 셋. 세로로 쌓인 것을 가로 덩어리로 말합니다 — 척추가 선다는
       뜻을 글자 없이 내는 자리입니다.

       가운데만 청록이고 제일 깁니다. 셋 다 같은 색이면 눈금표가 되고, 가운데가
       길어야 "가운데가 중심" 이라는 말이 남습니다.

       16px 에서도 셋이 갈라져야 하므로 막대 10 · 사이 5 로 두었습니다 —
       16px 로 줄면 막대 2.5px, 사이 1.25px 입니다. -->
  <rect x="14" y="12" width="36" height="10" rx="5" fill="#101312"/>
  <rect x="6"  y="27" width="52" height="10" rx="5" fill="#2DD4BF"/>
  <rect x="14" y="42" width="36" height="10" rx="5" fill="#101312"/>
</svg>
