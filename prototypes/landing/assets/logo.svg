<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 112" role="img" aria-label="Deskfit">
  <!--
    거북이 심볼. 앞의 한 획 소문자 d 를 대체합니다.

    왜 거북이인가 — 알에서 나오는 여덟 종 중 첫 캐릭터가 거북이이고,
    "느려도 끝까지" 가 이 제품이 파는 것입니다. 오래 앉아 있는 것을
    빠르기가 아니라 꾸준함으로 말합니다.

    등딱지와 몸 사이의 선은 흰 칠이 아니라 **뚫린 곳** 입니다(mask).
    어떤 바탕에 올려도 그 바탕이 그대로 지나가므로, 흰 배경에서만 맞는
    로고가 되지 않습니다.

    색이 #2DD4BF 가 아닌 이유 — 원안의 밝은 청록은 크림(#F7F8F8) 위에서
    1.63:1 이라 26px 로 줄이면 사라집니다. 이 체계가 "밝은 위에 올리는
    청록" 으로 이미 정해 둔 teal-700 을 씁니다(크림 위 5.44:1).
    어두운 면에 올릴 판본이 필요해지면 그때 파일을 하나 더 만듭니다.
  -->
  <mask id="dfShellGap">
    <rect width="190" height="112" fill="#fff"/>
    <path d="M 20 62 C 46 72, 88 73, 114 68" stroke="#000" stroke-width="6.5"
          stroke-linecap="round" fill="none"/>
  </mask>
  <g fill="#0D7769" mask="url(#dfShellGap)">
    <ellipse cx="54" cy="88" rx="11" ry="22"  transform="rotate(-11 54 88)"/>
    <ellipse cx="114" cy="88" rx="11" ry="22" transform="rotate(11 114 88)"/>
    <path d="M 40 61 C 28 63, 18 67, 10 73 C 20 78, 30 80, 40 80 Z"/>
    <rect x="30" y="58" width="108" height="26" rx="13"/>
    <path d="M 28 66 A 48 46 0 0 1 124 66 Z"/>
    <ellipse cx="150" cy="50" rx="25" ry="23"/>
  </g>
  <circle cx="158" cy="41" r="5" fill="#fff"/>
</svg>
