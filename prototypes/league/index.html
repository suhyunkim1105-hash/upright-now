<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deskfit — 학교 랭킹전</title>
<link rel="icon" href="../landing/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../landing/assets/favicon.ico" sizes="48x48">
<link rel="stylesheet" href="../../public/fonts/wanted-sans/WantedSansVariable.css">
<link rel="stylesheet" href="../shared/clay.css">

<style>
/* ==================================================================
   Deskfit 학교 랭킹전

   정보 구조는 KartRider Rush+ 의 Race rank 에서 가져왔습니다 — 왼쪽에
   압축된 전체 순위, 오른쪽에 월드와 이어진 Top 3 포디움, 그리고 내
   소속을 남과 구분해 항상 보이게 두는 방식. 파란 HUD·헬멧·타이어 단상
   같은 그쪽 껍데기는 하나도 안 가져왔습니다.

   재질만 클레이입니다. 그리고 **네 곳에만** 씁니다 —
     1) Top 3 포디움  2) 우리 학교 고정 영역
     3) 고른 기간 탭  4) 주 CTA
   나머지(배경·일반 순위 행·내비·본문·보조 통계·구분선)는 평면입니다.
   전부 부풀리면 어느 것이 눌러야 하는 것인지 사라집니다.

   메달 색을 안 씁니다. 금·은·동은 새 색 셋을 들여오는 일이고, 색맹인
   사람에게는 아무 말도 못 합니다. 1~3위는 **크기·높이·숫자**로만
   구분합니다.
   ================================================================== */

:root {
  --teal:      #2DD4BF;
  --teal-50:   #EFFBF9;
  --teal-100:  #CFF2ED;
  --teal-200:  #ADEBE2;
  --teal-700:  #0D7769;
  --ink:       #17201E;
  --ink-2:     #55605D;
  --ink-3:     #646E6B;
  --paper:     #FFFFFF;
  --wash:      #F4F7F6;
  --cream:     #FBFAF6;
  --line:      #E3E8E7;
  --line-2:    #EDF1F0;

  /* 마이페이지와 **같은 값** 입니다. 두 화면이 같은 창 문법을 쓰므로
     여백 계단이 2px 씩 어긋나면 창을 오갈 때 안쪽이 미세하게 흔들립니다. */
  --s-1: 8px;  --s-2: 14px; --s-3: 22px;
  --s-4: 34px; --s-5: 52px;

  /* 창 28 · 주요 판 20 · 버튼 14 · 순위 행 8 — 마이페이지와 같습니다. */
  --r-win:   28px;
  --r-panel: 20px;
  --r-btn:   14px;
  --r-row:   8px;
  --r-pill:  999px;

  /* ---- 클레이 ---- 로비·마이페이지와 같은 값입니다.
     광원은 화면 전체에서 좌상단 하나입니다. 요소마다 그림자 방향이
     다르면 물건들이 서로 다른 방에 있는 것처럼 보입니다. */

  /* 이 화면이 들고 있던 클레이 다섯을 공용(shared/clay.css)으로 넘겼습니다.
     값은 세 화면이 똑같이 복사해 둔 것이었고, 그런데도 **월드와는 달랐습니다** —
     그늘이 청록 계열이라 같은 빛 아래 있는 것으로 안 보였습니다.
     옛 이름을 새 값에 이어 두어, 이 이름을 쓰던 자리를 한꺼번에 안 고쳐도
     됩니다. 남은 이름은 옮기면서 하나씩 지웁니다. */
  --sh:       var(--clayUp);
  --sh-lift:  var(--clayUp);
  --sh-press: var(--clayIn);
  --sh-sm:    var(--clayUp2);
  --sh-well:  var(--clayIn);


  --ease: cubic-bezier(.16, 1, .3, 1);
}

* { box-sizing: border-box; }

/* 마이페이지와 같은 자리·같은 바탕입니다. 랭킹전도 로비 위에 뜬 창
   하나로 다룹니다 — 한쪽만 전체 화면이면 같은 제품의 두 화면이
   아니라 다른 제품처럼 보입니다.
   좌우 100px 은 모서리 아이콘이 앉을 골입니다. */
body {
  margin: 0;
  background: var(--wash);
  color: var(--ink);
  font: 500 15px/1.7 'Wanted Sans Variable', 'Wanted Sans', 'Pretendard Variable',
        -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.008em;
  display: grid; place-items: start center;
  padding: var(--s-4) 100px var(--s-5);
}

button, a { font: inherit; color: inherit; }
/* 초점 링은 그림자와 헷갈리면 안 됩니다. 클레이 그림자는 흐리고 색이
   없고, 이건 또렷한 청록 2px 입니다. */
:focus-visible { outline: 3px solid var(--teal-700); outline-offset: 3px; border-radius: 6px; }

/* ---------------- 창 ---------------- */
.win {
  width: min(1140px, 100%);
  background: var(--paper);
  border: 0; border-radius: var(--r-win);
  box-shadow: var(--sh);
  overflow: hidden;
}

.titlebar {
  display: flex; align-items: center; gap: var(--s-2);
  padding: 16px var(--s-3);
  /* 위에서 빛이 들어와 아래로 갈수록 짙어집니다. 평평한 한 색은
     스티커고, 이 기울기가 있어야 띠가 부푼 것으로 보입니다. */
  background: linear-gradient(180deg, #46DCC9 0%, var(--teal) 58%, #23C4B0 100%);
  box-shadow: inset 0 -3px 6px rgba(12,90,79,.16);
}
.titlebar h1 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -0.025em; }
/* 청록 위에서 회색 계열은 전부 4.5:1 밑으로 떨어집니다. 부제도 먹입니다 —
   위계는 색이 아니라 크기와 무게가 냅니다. */
.titlebar .sub {
  font-size: 12px; font-weight: 600; color: var(--ink); opacity: .72;
  letter-spacing: 0.12em;
}
.titlebar .x {
  position: relative;
  margin-left: auto; width: 30px; height: 30px; display: grid; place-items: center;
  background: var(--paper); border: 0; border-radius: 50%;
  cursor: pointer; box-shadow: var(--sh-sm);
  transition: background .14s var(--ease), transform .14s var(--ease), box-shadow .14s var(--ease);
}
/* 보이는 것은 30px 그대로 두고 누르는 자리만 40px 로 넓힙니다. */
.titlebar .x::after {
  content: ""; position: absolute; top: 50%; left: 50%;
  width: 40px; height: 40px; transform: translate(-50%, -50%);
}
.titlebar .x:hover { background: var(--teal-50); transform: translateY(-1px); }
.titlebar .x:active { transform: translateY(1px); box-shadow: var(--sh-press); }

.body { padding: var(--s-4) var(--s-4) var(--s-5); }

/* ---------------- 상단 내비 ----------------
   로비·마이페이지와 같은 줄입니다. 이 화면만 다른 메뉴를 세우지 않습니다. */
/* 가로줄 내비는 없앴습니다. 오른쪽 위·아래 모서리 둘이 내비게이션입니다
   (shared/corner-nav.js) — 이 화면에서는 학생증(마이페이지)과 집(로비).
   그 아이콘이 고정으로 떠 있어서 오른쪽에 빈 골을 남겨야 합니다.
   판 너비를 1240 에서 1140 으로 줄여 그 골을 만들었습니다. */

/* ---------------- 머리 ----------------
   제목과 시즌 표기는 제목줄로 올라갔습니다. 여기에는 "이 순위가
   무엇으로 정해지는가" 만 남깁니다 — 창 안에서 제목을 한 번 더
   크게 반복하면 같은 말이 두 번 나옵니다. */
.head { margin-bottom: var(--s-3); }
.head .desc { margin: 0; font-size: 15px; font-weight: 500; color: var(--ink-2); }
.head .meta {
  display: flex; flex-wrap: wrap; gap: var(--s-3); margin: var(--s-1) 0 0;
  font-size: 13.5px; font-weight: 500; color: var(--ink-2);
}
.head .meta b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }

/* ---------------- 12열 ---------------- */
/* 좌우로 갈라 놓았더니 눈이 두 곳으로 흩어졌습니다 — 왼쪽 목록을
   읽다가 오른쪽 단상을 보고 다시 왼쪽으로 돌아와야 했습니다.
   위에서 아래로 한 줄로 폅니다.

     Top 3 무대 → 기간 탭 → 순위 목록 → 우리 학교 → 시작하기

   읽는 길이 하나면 "우리가 몇 위인가" 까지 눈이 한 번만 움직입니다. */
.grid { display: grid; gap: var(--s-3); }

/* ================= 왼쪽: 순위 =================
   판 하나만 두고 그 안은 평면입니다. 행마다 카드를 만들면 일곱 개의
   부푼 덩어리가 생겨서 어느 것이 눌러야 하는 것인지 사라집니다. */
/* 테두리 1px 을 걷고 마이페이지의 판과 같은 점토 그림자를 씁니다.
   선으로 만든 깊이와 그림자로 만든 깊이가 한 화면에 섞이면 두 개가
   다른 층에 있는 것으로 보입니다. */
.panel {
  height: 100%; min-height: 0;
  display: flex; flex-direction: column;
  background: var(--paper); border: 0;
  border-radius: var(--r-panel); overflow: hidden;
  box-shadow: var(--sh);
}
/* 목록만 구릅니다. 머리글과 기간 탭, 우리 학교 줄은 늘 제자리입니다. */
/* 목록이 안에서 구릅니다. 구르는 상자는 tabindex 를 줘야 키보드가
   닿습니다 — 없으면 마우스 없이는 4위 아래를 볼 방법이 없습니다. */
/* 창이 화면 높이에 안 매이므로 목록이 스스로 높이를 정합니다. 네 줄쯤
   보이고 나머지는 안에서 구릅니다 — 일곱 줄을 다 펴면 오른쪽 단상보다
   판이 길어져서 격자가 한쪽으로 늘어집니다. */
/* 무대가 격자 행 높이를 정하고, 목록은 남는 만큼 채운 뒤 안에서
   구릅니다. 높이를 따로 못 박으면 "우리 학교" 아래에 빈 자리가 남습니다. */
/* 한 줄로 펴면서 목록이 스스로 높이를 정합니다. 네 줄쯤 보이고
   나머지는 안에서 구릅니다 — 일곱 줄을 다 펴면 아래 CTA 가 화면
   밖으로 나갑니다. */
#rank-body {
  max-height: 236px;
  overflow-y: auto; overscroll-behavior: contain;
}
#rank-body:focus-visible { outline: 3px solid var(--teal-700); outline-offset: -3px; border-radius: 8px; }
.panel > header {
  flex: none;
  display: flex; align-items: center; gap: var(--s-2);
  padding: var(--s-3) var(--s-3) var(--s-2);
}
.panel > header h2 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -0.02em; }
.panel > header .ago { margin-left: auto; font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

/* 기간 탭 — 고른 쪽만 아주 낮게 도드라집니다. 안 고른 쪽은 평면 흰색. */
/* 마이페이지 탭과 같습니다 — 파인 홈에 고른 칸만 솟습니다. */
.seg {
  flex: none;
  display: flex; gap: 4px; margin: 0 var(--s-3) var(--s-2);
  padding: 5px; border-radius: var(--r-pill); background: var(--wash);
  box-shadow: var(--sh-well);
}
.seg button {
  flex: 1 1 0; min-height: 44px; padding: 0 var(--s-2);
  border: 0; border-radius: var(--r-pill); background: transparent;
  font-size: 14px; font-weight: 500; color: var(--ink-2); cursor: pointer;
  transition: background .18s var(--ease), color .18s var(--ease), box-shadow .18s var(--ease);
}
.seg button:hover { color: var(--ink); background: rgba(255,255,255,.72); }
.seg button[aria-selected="true"] {
  background: var(--teal-100); color: var(--ink); font-weight: 700;
  /* 아주 약하게 — 2~3px 떠 있는 정도입니다. */
  box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 2px 5px rgba(13,60,52,.13);
}
.seg button[aria-selected="true"]:hover { background: var(--teal-100); }
.seg button:active { box-shadow: var(--sh-press); }

/* ---- 순위 행 ---- */
/* 표를 **줄**로 바꿨습니다. 밑줄로 칸을 가르던 것을 월드 창과 같은
   문법으로 옮깁니다 — 각 줄이 솟은 판이고, 그 사이는 여백이 가릅니다.
   선으로 나누면 줄이 많아질수록 화면이 격자로 보이고, 판으로 나누면
   줄 하나가 하나의 것으로 읽힙니다. */
.rows { list-style: none; margin: 0; padding: 0 var(--s-3) var(--s-2);
  display: grid; gap: 7px; }
.row {
  display: grid; grid-template-columns: 34px 30px minmax(0, 1fr) auto;
  align-items: center; gap: var(--s-2);
  min-height: 52px; padding: 9px 13px; border-radius: var(--cr-rw);
  background: var(--clay2); box-shadow: var(--clayUp2);
}
.rank { font-size: 15px; font-weight: 800; color: var(--cInk3); font-variant-numeric: tabular-nums; }
/* 1~3위는 숫자 크기와 굵기만 다릅니다. 배경도 메달색도 없습니다 —
   순위는 이미 순서로 말하고 있어서, 색을 더하면 같은 말을 두 번 합니다. */
.row.top .rank { font-size: 19px; color: var(--cInk); }
.row.top .name { font-weight: 800; }
/* 실제 대학 로고는 상표라 못 씁니다. 대신 학교마다 **가상의 엠블럼**을
   그려서 씁니다 — 방패 안에 두 글자, 색은 청록 계열에서 학교 이름으로
   정해집니다. 같은 학교는 어느 화면에서든 같은 엠블럼이 나옵니다. */
.emb { flex: none; width: 30px; height: 34px; display: block; }
.row .emb { width: 26px; height: 30px; }
.sym {
  width: 30px; height: 30px; border-radius: 9px; flex: none;
  background: var(--teal-50); border: 1px solid var(--teal-100);
  display: grid; place-items: center;
  font-size: 12.5px; font-weight: 700; color: var(--teal-700);
}
.name { font-size: 15px; font-weight: 700; color: var(--cInk2);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mins {
  display: flex; align-items: baseline; gap: 10px;
  font-size: 14.5px; font-weight: 600; font-variant-numeric: tabular-nums;
}
/* 순위 변화는 색만으로 말하지 않습니다. 화살표와 글자를 같이 둡니다. */
/* 주간↔누적을 오갈 때 자릿수가 바뀝니다. 고정폭이 아니면 화살표와
   글자가 매번 다른 자리에서 시작합니다. */
.delta { display: inline-flex; align-items: center; gap: 3px; font-size: 12.5px; font-weight: 500; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.delta svg { flex: none; }
.delta.up { color: var(--teal-700); }
.delta.down { color: #9A5B14; }

/* ---- 우리 학교 고정 ----
   목록을 아무리 스크롤해도 이 줄은 남습니다. 내 소속이 화면 밖으로
   나가면 이 화면이 답해야 할 질문 하나가 사라집니다. */
.mine {
  flex: none;
  margin: 0; padding: var(--s-3);
  background: var(--teal-50);
  border-top: 1px solid var(--teal-200);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.95), 0 -6px 16px rgba(13,60,52,.10);
}
.mine .cap { font-size: 12px; font-weight: 500; letter-spacing: 0.1em; color: var(--teal-700); }
.mine .who { margin-top: 4px; display: flex; align-items: center; gap: 9px;
             font-size: 19px; font-weight: 700; letter-spacing: -0.02em;
             font-variant-numeric: tabular-nums; }
.mine .facts {
  display: flex; flex-wrap: wrap; gap: var(--s-2) var(--s-3); margin-top: 10px;
  font-size: 13.5px; color: var(--ink-2);
}
.mine .facts b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

/* ================= 오른쪽: Top 3 =================
   포디움만 진짜 클레이입니다. 이 화면에서 만질 수 없는 유일한 것이자
   가장 입체적인 것 — 월드 안의 장면이라 그렇습니다. */
.stage {
  position: relative; overflow: hidden;
  /* 가로를 다 쓰므로 세로는 낮춥니다. 위아래로 긴 무대는 아래 목록을
     화면 밖으로 밀어냅니다. */
  min-height: clamp(216px, 25vh, 248px);
  border-radius: var(--r-panel); border: 0;
  background: var(--wash);
  box-shadow: var(--sh);
  display: flex; align-items: flex-end; justify-content: center;
  padding: var(--s-3) var(--s-3) var(--s-2);
}
.stage .far {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; object-position: center 62%;
}
/* 배경이 Top 3 를 방해하지 않게 위에서 옅은 막을 덮습니다. */
.stage::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(251,250,246,.86) 0%, rgba(251,250,246,.42) 46%, rgba(251,250,246,.14) 100%);
}

.podium { position: relative; display: flex; align-items: flex-end; gap: clamp(10px, 2vw, 26px); }
.spot { display: flex; flex-direction: column; align-items: center; width: clamp(110px, 15vw, 156px); }
.spot .who {
  position: relative; display: flex; flex-direction: column;
  align-items: center; justify-content: flex-end;
  min-height: clamp(78px, 9.6vh, 92px);
}
.spot img { width: clamp(50px, 6vw, 72px); height: auto; display: block; }
/* 깃발 — 왕관도 트로피도 아닙니다. 작은 학교 표시 하나면 충분합니다. */
.flag { display: inline-flex; align-items: center; gap: 5px;
  margin-bottom: 6px; padding: 3px 10px; border-radius: 6px;
  background: var(--paper); border: 1px solid var(--line);
  font-size: 12px; font-weight: 600; color: var(--ink-2);
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* 단상 — 숫자를 새긴 점토 덩어리입니다. 높이 차이로 순위를 말합니다. */
.block {
  width: 100%; border-radius: 16px 16px 10px 10px;
  background: var(--teal-100);
  box-shadow: var(--sh);
  display: grid; place-items: center;
  font-size: 26px; font-weight: 700; color: var(--teal-700);
  font-variant-numeric: tabular-nums;
}
/* 1·2·3 의 차이는 높이입니다. 금·은·동 색을 쓰지 않으므로 이 세
   숫자만이 순위를 말합니다 — 비율은 유지한 채 화면 높이에 맞춰
   같이 줄어듭니다. */
.spot.p1 .block { height: clamp(56px, 7.4vh, 70px); background: var(--teal); color: var(--ink); font-size: clamp(26px, 3.6vh, 32px); }
.spot.p2 .block { height: clamp(40px, 5.3vh, 50px); }
.spot.p3 .block { height: clamp(32px, 4.2vh, 40px); }
.spot.p1 img { width: clamp(58px, 7vw, 84px); }

.plate { margin-top: 10px; text-align: center; }
.plate .t {
  font-variant-numeric: tabular-nums;
  font-size: 13.5px; font-weight: 700;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%;
}
.plate .v { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* ---- 보조 통계 ---- 카드 없이 라벨과 숫자만. */
.stats {
  flex: none;
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--s-3); margin-top: var(--s-3);
  padding: var(--s-3) var(--s-1);
  border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
}
.stats div { min-width: 0; }
.stats .k { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; color: var(--ink-3); }
.stats .n { margin-top: 3px; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.stats svg { flex: none; color: var(--teal-700); }

/* ---- CTA ---- */
.cta {
  position: sticky; bottom: var(--s-3); z-index: 2;
  flex: none;
  display: block; width: 100%; margin-top: var(--s-3);
  min-height: 56px; padding: 17px 24px;
  border: 0; border-radius: var(--r-btn);
  background: var(--teal); color: var(--ink);
  font-size: 16px; font-weight: 700; letter-spacing: -0.01em; cursor: pointer;
  box-shadow: var(--sh);

}
.cta:hover { transform: translateY(-1px); box-shadow: var(--sh-lift); }
.cta:active { transform: translateY(1px); box-shadow: var(--sh-press); }

/* ---------------- 상태 ---------------- */
.skel { background: var(--line-2); border-radius: 6px; animation: pulse 1.5s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
.blank { padding: var(--s-5) var(--s-3); text-align: center; color: var(--ink-2); }
.blank b { display: block; color: var(--ink); font-size: 15.5px; font-weight: 700; margin-bottom: 6px; }
.blank .btn {
  margin-top: var(--s-3); min-height: 44px; padding: 11px 22px;
  border: 1px solid var(--line); border-radius: var(--r-btn);
  background: var(--paper); font-size: 14px; font-weight: 600; cursor: pointer;
}
.blank .btn:hover { background: var(--wash); }

@media (max-width: 1300px) {
  .shell { padding-left: 40px; padding-right: 40px; }
}
/* 1280 에서도 Top 3 · 우리 학교 · CTA 가 한 화면에 남아야 합니다.
   열 비율은 그대로 두고 여백과 글자만 한 단 줄입니다. */
/* 1280×768 에서도 CTA 까지 한 화면에 있어야 합니다. */
@media (max-height: 820px) {
  body { padding-top: var(--s-3); padding-bottom: var(--s-3); }
  .body { padding: var(--s-3) var(--s-3) var(--s-4); }
  .head { margin-bottom: var(--s-2); }
  .head .desc { font-size: 14px; }
  .stats { padding: var(--s-2) var(--s-1); }
  /* 짧은 화면에서는 무대 위 여백을 줄여 단상이 들어갈 자리를 만듭니다. */

}

@media (max-width: 1120px) {
  .shell { padding-left: 24px; padding-right: 24px; }
  .grid { gap: var(--s-3); }
  .head h1 { font-size: 29px; }
  .stage { min-height: 330px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: .001ms !important; animation-duration: .001ms !important;
      animation-iteration-count: 1 !important; }
}

<body>

<div class="win">

  <header class="titlebar">
    <h1>학교 랭킹전</h1>
    <span class="sub">2026 CAMPUS FOCUS LEAGUE</span>
    <button class="x" type="button" id="close" aria-label="로비로 돌아가기">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </header>

  <main class="body">

  <header class="head">
    <p class="desc">함께 집중한 시간이 우리 학교의 기록이 돼요.</p>
    <p class="meta">
      <span>이번 시즌 종료까지 <b>4일 18시간</b></span>
      <span>이번 주 참여자 <b>1인당 유효 집중시간</b> 기준</span>
    </p>
  </header>

  <div class="grid">

    <!-- 1. 이번 주 상위 셋 — 화면에서 가장 먼저 보이는 것 -->
    <section class="stage" aria-label="이번 주 상위 세 학교">
      <img class="far" src="assets/campus-far.jpg" alt="" aria-hidden="true">
      <div class="podium" id="podium"></div>
    </section>

    <!-- 2. 순위 목록 -->
    <section class="panel" aria-labelledby="rank-h">
      <header>
        <h2 id="rank-h">이번 주 학교 순위</h2>
        <span class="ago" id="ago">10분 전</span>
      </header>

      <div class="seg" role="tablist" aria-label="집계 기간">
        <button role="tab" id="t-week" aria-selected="true"  type="button">주간</button>
        <button role="tab" id="t-all"  aria-selected="false" type="button">누적</button>
      </div>

      <div id="rank-body" tabindex="0" role="group"
           aria-label="학교 순위 목록, 위아래 화살표로 넘겨 보세요"></div>

      <div class="mine" id="mine"></div>

    <!-- 3. 보조 통계 -->

    <!-- 4. 시작하기 -->

  </div>

  </div>
  </main>

<script>
/* ==================================================================
   화면은 세 가지 상태를 실제로 가집니다 — 불러오는 중 · 비어 있음 ·
   실패. 주소에 ?state=loading|empty|error 를 붙이면 그 상태를 그대로
   볼 수 있습니다. 상태를 만들어만 두고 볼 길이 없으면 다음 사람이
   고칠 때 존재를 모릅니다.
   ================================================================== */
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const MY_SCHOOL = '명지대학교';

/* 실제 지원 대학 이름으로 바꿨습니다 — 목록은 shared/school-auth.js 의
   SCHOOLS 와 같은 이름을 씁니다(가상 학교 이름 대신 실제 학교, 순위는
   여전히 예시 수치입니다). */
const WEEK = [
  { name: '서울대학교',   min: 282, was: 1 },
  { name: '연세대학교',   min: 268, was: 3 },
  { name: '고려대학교',   min: 251, was: 2 },
  { name: '한양대학교',   min: 238, was: 4 },
  { name: '성균관대학교', min: 224, was: 6 },
  { name: '중앙대학교',   min: 215, was: 5 },
  { name: '명지대학교',   min: 206, was: 9 },
];
/* 누적은 같은 학교들의 다른 줄 세우기입니다 — 주간에서 앞선 학교가
   누적에서도 앞서면 탭이 있을 이유가 없습니다. */
const ALL = [
  { name: '연세대학교',   min: 4126, was: 1 },
  { name: '서울대학교',   min: 4011, was: 2 },
  { name: '한양대학교',   min: 3894, was: 4 },
  { name: '고려대학교',   min: 3720, was: 3 },
  { name: '명지대학교',   min: 3402, was: 7 },
  { name: '중앙대학교',   min: 3288, was: 5 },
  { name: '성균관대학교', min: 3140, was: 6 },
];

const hm = (m) => Math.floor(m / 60) + '시간 ' + (m % 60) + '분';
const sym = (n) => n.replace(/대학교$/, '').slice(0, 2);

/* ---------------- 학교 엠블럼 ----------------
   실제 대학 로고는 상표입니다. 허락 없이 화면에 붙이면 그 학교가
   이 서비스를 인정한 것처럼 보이고, 그건 사실이 아닙니다. 그래서
   **가상의 엠블럼**을 그려서 씁니다 — 방패 하나, 그 안에 두 글자.

   색은 학교 이름에서 정해집니다. 같은 이름이면 어느 화면에서든 같은
   엠블럼이 나오고, 서버에 그림을 둘 필요도 없습니다. 청록 계열 안에서
   색상만 ±26도 돌려서, 일곱 학교가 서로 구분되면서도 한 제품으로
   보이게 했습니다. */
function hue(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
  /* 청록(174도) 둘레 ±26도. 밖으로 나가면 상태색(호박·빨강)과 부딪힙니다. */
  return 174 + ((h % 53) - 26);
}

function shieldEmblem(name) {
  const t = esc(sym(name));
  const H = hue(name);
  const face = 'hsl(' + H + ' 46% 92%)';
  const edge = 'hsl(' + H + ' 38% 74%)';
  const ink  = 'hsl(' + H + ' 58% 26%)';
  /* 방패 — 위는 각지고 아래는 뾰족합니다. 원으로 두면 프로필 사진으로
     읽히고, 네모로 두면 앱 아이콘으로 읽힙니다. */
  return '<svg class="emb" viewBox="0 0 30 34" aria-hidden="true">'
    + '<path d="M2 4.4a1.6 1.6 0 0 1 1.6-1.6h22.8A1.6 1.6 0 0 1 28 4.4V19c0 6.2-4.6 10.4-13 13.4C6.6 29.4 2 25.2 2 19Z" '
    + 'fill="' + face + '" stroke="' + edge + '" stroke-width="1.6"/>'
    + '<text x="15" y="19.4" text-anchor="middle" fill="' + ink + '" '
    + 'font-family="Wanted Sans Variable, Wanted Sans, sans-serif" font-size="11.5" font-weight="800">'
    + t + '</text></svg>';
}

/* 학교 CI(로고) 파일을 마련한 학교만 이 표에 슬러그를 올려 둡니다.
   shared/school-auth.js 의 도메인 앞부분과 같은 이름을 씁니다 — 학교
   하나를 어디서나 같은 슬러그로 찾기 위해서입니다.

   실제 로고 파일은 허가받았거나 자유이용 범위(CI)인 것만 여기 걸어
   두세요 — assets/logos/<슬러그>.png. 파일이 없거나 아직 안 올렸으면
   <img> 가 못 불러오는 순간(onerror) 지금까지 쓰던 가상 엠블럼으로
   조용히 돌아갑니다. 화면이 깨진 이미지 아이콘을 보여 주는 일은 없습니다. */
const SCHOOL_LOGO_SLUG = {
  '서울대학교': 'snu', '연세대학교': 'yonsei', '고려대학교': 'korea',
  '한양대학교': 'hanyang', '성균관대학교': 'skku', '중앙대학교': 'cau',
  '경희대학교': 'khu', '명지대학교': 'mju', '서강대학교': 'sogang',
  '이화여자대학교': 'ewha', '건국대학교': 'konkuk', '단국대학교': 'dankook',
  '인하대학교': 'inha', 'KAIST': 'kaist', 'POSTECH': 'postech',
};

function emblem(name) {
  const slug = SCHOOL_LOGO_SLUG[name];
  if (!slug) return shieldEmblem(name);
  return '<img class="emb" src="assets/logos/' + slug + '.png" alt="' + esc(name) + ' 로고" '
    + 'onerror="this.outerHTML=this.dataset.fallback" data-fallback="' + esc(shieldEmblem(name)) + '">';
}

const UP = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>';
const DOWN = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
const SAME = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 12h12"/></svg>';

/** 순위 변화를 화살표 + 글자로 같이 말합니다. 색만으로는 안 됩니다. */
function delta(now, was) {
  const d = was - now;
  if (d > 0) return `<span class="delta up">${UP}${d}계단</span>`;
  if (d < 0) return `<span class="delta down">${DOWN}${-d}계단</span>`;
  return `<span class="delta">${SAME}그대로</span>`;
}

function rows(list) {
  return '<ol class="rows">' + list.map((s, i) => {
    const n = i + 1;
    return `<li class="row${n <= 3 ? ' top' : ''}">
      <span class="rank">${n}</span>
      ${emblem(s.name)}
      <span class="name" title="${esc(s.name)}">${esc(s.name)}</span>
      <span class="mins">${esc(hm(s.min))}${delta(n, s.was)}</span>
    </li>`;
  }).join('') + '</ol>';
}

function skeleton() {
  return '<ol class="rows">' + Array.from({ length: 7 }, () => `
    <li class="row" aria-hidden="true">
      <span class="skel" style="height:14px;width:16px"></span>
      <span class="skel" style="height:30px;width:30px;border-radius:9px"></span>
      <span class="skel" style="height:14px;width:62%"></span>
      <span class="skel" style="height:14px;width:74px"></span>
    </li>`).join('') + '</ol>';
}

function podium(list) {
  const order = [[1, 'p2'], [0, 'p1'], [2, 'p3']];
  const art = ['assets/char-turtle.png', 'assets/char-penguin.png', 'assets/char-frog.png'];
  return order.map(([i, cls]) => {
    const s = list[i];
    if (!s) return '';
    return `<div class="spot ${cls}">
      <div class="who">
        <span class="flag" title="${esc(s.name)}">${esc(s.name)}</span>
        <img src="${art[i]}" alt="">
      </div>
      <div class="block">${i + 1}</div>
      <div class="plate">
        <div class="t" title="${esc(s.name)}">${i + 1}위 ${esc(s.name)}</div>
        <div class="v">${esc(hm(s.min))}</div>
      </div>
    </div>`;
  }).join('');
}

const ICON = {
  school: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V8l7-5 7 5v13"/><path d="M10 21v-6h4v6"/></svg>',
  clock: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  me: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>',
};

function render(state) {
  const list = $('t-all').getAttribute('aria-selected') === 'true' ? ALL : WEEK;

  if (state === 'loading') {
    $('rank-body').innerHTML = skeleton();
    $('podium').innerHTML = '';
    $('mine').innerHTML = '<span class="cap">우리 학교</span><div class="who">불러오는 중</div>';
    $('stats').innerHTML = '';
    return;
  }
  if (state === 'empty') {
    $('rank-body').innerHTML =
      '<div class="blank"><b>아직 참여한 학교가 없어요</b>이번 시즌 첫 세션을 시작하면 우리 학교가 첫 줄에 올라가요.</div>';
    $('podium').innerHTML = '';
    $('mine').innerHTML = '<span class="cap">우리 학교</span><div class="who">' + esc(MY_SCHOOL) + '</div>'
      + '<div class="facts"><span>아직 이번 주 기록이 없어요</span></div>';
    $('stats').innerHTML = '';
    return;
  }
  if (state === 'error') {
    $('rank-body').innerHTML =
      '<div class="blank" role="alert"><b>순위를 불러오지 못했어요</b>잠시 뒤에 다시 시도해 주세요.'
      + '<br><button class="btn" type="button" id="retry">다시 시도</button></div>';
    $('podium').innerHTML = '';
    $('mine').innerHTML = '<span class="cap">우리 학교</span><div class="who">' + esc(MY_SCHOOL) + '</div>';
    $('stats').innerHTML = '';
    $('retry').addEventListener('click', () => go('loading', 900));
    return;
  }

  $('rank-body').innerHTML = rows(list);
  $('podium').innerHTML = podium(list);

  const i = list.findIndex((s) => s.name === MY_SCHOOL);
  const me = list[i];
  $('mine').innerHTML = `
    <span class="cap">우리 학교</span>
    <div class="who">${emblem(me.name)}<span>${i + 1}위 · ${esc(me.name)}</span></div>
    <div class="facts">
      <span>이번 주 평균 <b>${esc(hm(me.min))}</b></span>
      <span>${delta(i + 1, me.was)} 지난주보다</span>
      <span>나의 기여 <b>84분</b></span>
    </div>`;

  $('stats').innerHTML = `
    <div><span class="k">${ICON.school}참여 학교</span><span class="n">42개</span></div>
    <div><span class="k">${ICON.clock}이번 주 누적 집중</span><span class="n">12,804시간</span></div>
    <div><span class="k">${ICON.me}나의 학교 기여</span><span class="n">84분</span></div>`;
}

function go(state, wait) {
  render(state);
  if (wait) setTimeout(() => render('ok'), wait);
}

/* ---- 기간 탭 ---- */
const TABS = ['t-week', 't-all'];
function pick(id) {
  TABS.forEach((t) => $(t).setAttribute('aria-selected', String(t === id)));
  $('rank-h').textContent = id === 't-all' ? '누적 학교 순위' : '이번 주 학교 순위';
  render('ok');
}
TABS.forEach((t) => $(t).addEventListener('click', () => pick(t)));
document.querySelector('.seg').addEventListener('keydown', (e) => {
  const i = TABS.indexOf(document.activeElement.id);
  if (i < 0) return;
  let n = i;
  if (e.key === 'ArrowRight') n = (i + 1) % TABS.length;
  else if (e.key === 'ArrowLeft') n = (i - 1 + TABS.length) % TABS.length;
  else return;
  e.preventDefault();
  $(TABS[n]).focus();
  pick(TABS[n]);
});

$('cta').addEventListener('click', () => { location.href = '../lobby/index.html'; });

render(new URLSearchParams(location.search).get('state') || 'ok');

/* 창을 닫으면 로비로 돌아갑니다 — 마이페이지와 같은 동작입니다. */
