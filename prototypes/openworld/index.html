function wornColor(cat) {
  const it = SHOP_BY_ID[ROOM.worn[cat]];
  return it ? itemColor(it) : null;
}
/* 16px 예비 그림 — 종 시트가 아직 안 왔을 때만 씁니다. Kenney 사람의
   몸통 줄만 지금 입은 상의 색(없으면 학교 과잠 색)으로 갈아입힙니다. */
const CHAR_SHEET_COL = 23, CHAR_SHEET_W = 4, CHAR_SHEET_H = 3;
/* 과잠 한 장을 구워 두는 자리.
   병합 정리: 선언이 민철 판본 쪽으로 덮이면서 사라졌습니다. 아래에서
   `if (jacketCanvas)` 로 **읽으므로** 없으면 그 줄에서 바로 터집니다. */
let jacketCanvas = null;

function playerSheet() {
  if (jacketCanvas) return jacketCanvas;
  const c = canvasOf(CHAR_SHEET_W, CHAR_SHEET_H), g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.drawImage(urban, CHAR_SHEET_COL * T, 0, c.width, c.height, 0, 0, c.width, c.height);
  g.globalCompositeOperation = 'source-atop';
  /* 몸통 줄 하나만 갈아입힙니다. 모자·하의·신발 줄까지 색으로 덮어 봤지만
     16px 안에서 다리 두 짝과 발이 한 덩어리가 되어 원본보다 나빠집니다 —
     머리와 다리는 Kenney 가 그린 대로 두는 편이 사람으로 읽힙니다.
     아무것도 안 입었으면 예전처럼 학교 과잠을 기본으로 입습니다. */
  const col = wornColor('top') || schoolColor();
  for (let r = 0; r < CHAR_SHEET_H; r++) {
    px(g, 0, r * T + 8, c.width, 5, col);
    px(g, 0, r * T + 8, c.width, 1, 'rgba(255,255,255,.28)');   // 어깨선
    px(g, 0, r * T + 12, c.width, 1, 'rgba(0,0,0,.22)');        // 밑단 그늘
  }
  g.globalCompositeOperation = 'source-over';
  jacketCanvas = c;
  return c;
}

function paintItemCanvases() {
  for (const c of panelBody.querySelectorAll('canvas[data-doll]')) {
    const g = c.getContext('2d');
    g.clearRect(0, 0, c.width, c.height);
    drawDoll(g, ROOM.worn, c.dataset.doll || 'down', Number(c.dataset.zoom) || 1);
  }
  for (const c of panelBody.querySelectorAll('canvas[data-item]')) {
    const it = SHOP_BY_ID[c.dataset.item];
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    g.clearRect(0, 0, c.width, c.height);
    const sheet = it && itemSheet(it);
    if (sheet) {
      const zoom = Number(c.dataset.zoom) || 1;
      g.drawImage(sheet, ITEM_DIR.down * ITEM_W, 0, ITEM_W, ITEM_H, 0, 0, ITEM_W * zoom, ITEM_H * zoom);
    } else if (it && it.cat === 'egg') {
      drawEggThumb(g, c.width, c.height, itemColor(it) || '#C9C4BE');
    } else if (it) {
      /* 아직 안 뜬 그림 — 색 블록으로 자리를 지킵니다 */
      g.fillStyle = itemColor(it) || '#C9C4BE';

}
/* 알에는 스프라이트가 없습니다(까 봐야 아는 것이라 그림이 없는 게 맞습니다).
   그렇다고 네모난 색 블록을 두면 옆 칸의 옷 그림과 결이 안 맞아 **미완성으로
   보입니다.** 알 모양을 픽셀로 찍고 통째로 확대합니다 — 벡터 타원으로
   그리면 매끈해져서 이 화면에서 혼자 다른 그림체가 됩니다. */
const EGG_ART = [
  '....XXXX....', '..XXXXXXXX..', '.XXXXXXXXXX.', '.XXXXXXXXXX.',
  'XXXXXXXXXXXX', 'XXXXXXXXXXXX', 'XXXXXXXXXXXX', 'XXXXXXXXXXXX',
  'XXXXXXXXXXXX', 'XXXXXXXXXXXX', 'XXXXXXXXXXXX', '.XXXXXXXXXX.',
  '.XXXXXXXXXX.', '..XXXXXXXX..', '....XXXX....',
];
/** #RRGGBB 를 k 배 밝게(>1)·어둡게(<1). 알 색이 종마다 달라 무늬 색을
    표로 또 두면 종이 늘 때마다 손볼 곳이 하나 더 생깁니다. */
function shade(hex, k) {
  const n = parseInt(String(hex).replace('#', ''), 16);
  const c = (v) => Math.max(0, Math.min(255, Math.round(v * k)));
  return 'rgb(' + c((n >> 16) & 255) + ',' + c((n >> 8) & 255) + ',' + c(n & 255) + ')';
}
function drawEggThumb(g, W, H, color) {
  const w = EGG_ART[0].length, h = EGG_ART.length;
  const z = Math.max(1, Math.floor(Math.min(W / (w + 2), H / (h + 2))));
  const ox = Math.round((W - w * z) / 2), oy = Math.round((H - h * z) / 2);
  const put = (x, y, c) => { g.fillStyle = c; g.fillRect(ox + x * z, oy + y * z, z, z); };
  const line = shade(color, 0.55), spot = shade(color, 0.78), lit = shade(color, 1.22);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (EGG_ART[y][x] !== 'X') continue;
    /* 테두리 = 네 이웃 중 하나라도 알이 아닌 칸. 따로 표를 두지 않습니다 */
    const edge = y === 0 || y === h - 1 || x === 0 || x === w - 1
      || EGG_ART[y - 1][x] !== 'X' || EGG_ART[y + 1][x] !== 'X'
      || EGG_ART[y][x - 1] !== 'X' || EGG_ART[y][x + 1] !== 'X';
    put(x, y, edge ? line : color);
  }
  [[4, 6], [5, 6], [7, 9], [8, 9], [3, 10], [6, 12]].forEach(([x, y]) => put(x, y, spot));
  [[3, 3], [4, 3], [3, 4]].forEach(([x, y]) => put(x, y, lit));      // 광택
}

const repaintOpenPanel = () => { if (panelOpen) paintItemCanvases(); };

/** 창 내용을 갈아 끼울 때는 **늘 이 문을 지납니다.** 캔버스는 innerHTML
    로 안 그려지므로, 넣은 다음 한 번 칠해 줘야 합니다. innerHTML 을
    직접 쓰면 인형과 아이템 칸이 빈 채로 남습니다. */

/* ==================================================================
   미니게임 4 — 거북이 등껍질 슬라이드 퍼즐

   MIT License로 공개된 javascript-games의 Sliding Puzzle 구조를 참고해
   현재 프로토타입의 패널/보상 흐름에 맞게 독립적으로 작성했습니다.
   ================================================================== */
const SHELL_SLIDE = {
  active: false, timer: 60, timerId: null, board: [], blank: 8, moves: 0, rewarded: false,
};
const SHELL_SOLVED = [0, 1, 2, 3, 4, 5, 6, 7, 8];
function shellSlideNeighbors(blank) {
  const row = Math.floor(blank / 3), col = blank % 3;
  const result = [];
  if (row > 0) result.push(blank - 3);
  if (row < 2) result.push(blank + 3);
  if (col > 0) result.push(blank - 1);
  if (col < 2) result.push(blank + 1);
  return result;
}
function shellSlideShuffle() {
  const board = SHELL_SOLVED.slice();
  let blank = 8;
  let previousBlank = -1;
  for (let i = 0; i < 80; i++) {
    const choices = shellSlideNeighbors(blank).filter((index) => index !== previousBlank);
    const target = choices[Math.floor(Math.random() * choices.length)];
    [board[blank], board[target]] = [board[target], board[blank]];
    previousBlank = blank;
    blank = target;
  }
  if (board.every((value, index) => value === SHELL_SOLVED[index])) return shellSlideShuffle();
  SHELL_SLIDE.blank = blank;
  return board;
}
function shellSlideIsSolved() {
  return SHELL_SLIDE.board.every((value, index) => value === SHELL_SOLVED[index]);
}
function shellSlideDirectionTarget(direction) {
  const row = Math.floor(SHELL_SLIDE.blank / 3), col = SHELL_SLIDE.blank % 3;
  if (direction === 'arrowup' && row < 2) return SHELL_SLIDE.blank + 3;
  if (direction === 'arrowdown' && row > 0) return SHELL_SLIDE.blank - 3;
  if (direction === 'arrowleft' && col < 2) return SHELL_SLIDE.blank + 1;
  if (direction === 'arrowright' && col > 0) return SHELL_SLIDE.blank - 1;
  return -1;
}
function moveShellSlide(input) {
  if (!SHELL_SLIDE.active) return false;
  const target = typeof input === 'number' ? input : shellSlideDirectionTarget(input);
  if (!shellSlideNeighbors(SHELL_SLIDE.blank).includes(target)) return false;
  [SHELL_SLIDE.board[SHELL_SLIDE.blank], SHELL_SLIDE.board[target]] = [SHELL_SLIDE.board[target], SHELL_SLIDE.board[SHELL_SLIDE.blank]];
  SHELL_SLIDE.blank = target;

  if (shellSlideIsSolved()) finishShellSlide(true);
  return true;
}

/* ==================================================================
   미니게임 4 — 거북이 미로 탈출

   MIT License로 공개된 javascript-games의 Maze Game 구조를 참고해
   등껍질 퍼즐 슬롯에 맞는 독립 미로 게임으로 교체했습니다.
   ================================================================== */
const TURTLE_MAZE = {
  active: false, timer: 30, timerId: null, grid: [], player: { r: 0, c: 0 },
  goal: { r: 9, c: 9 }, moves: 0, rewarded: false,
};
function mazePathExists(grid) {
  const queue = [{ r: 0, c: 0 }], seen = new Set(['0,0']);
  while (queue.length) {
    const current = queue.shift();
    if (current.r === 9 && current.c === 9) return true;
    [[-1,0],[1,0],[0,-1],[0,1]].forEach(([dr, dc]) => {
      const r = current.r + dr, c = current.c + dc, key = `${r},${c}`;
      if (r >= 0 && r < 10 && c >= 0 && c < 10 && grid[r][c] === 0 && !seen.has(key)) {
        seen.add(key); queue.push({ r, c });
      }
    });
  }
  return false;
}
function createTurtleMaze() {
  const grid = Array.from({ length: 10 }, () => Array(10).fill(0));
  const candidates = [];
  for (let r = 0; r < 10; r++) for (let c = 0; c < 10; c++) {
    if ((r === 0 && c === 0) || (r === 9 && c === 9)) continue;
    candidates.push({ r, c });
  }
  for (let i = candidates.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
  }
  let walls = 0;
  for (const cell of candidates) {
    if (walls >= 36) break;
    grid[cell.r][cell.c] = 1;
    if (!mazePathExists(grid)) grid[cell.r][cell.c] = 0;
    else walls++;
  }
  return grid;
}

/* ================== 지난 세션 요약 ==================
   업라이트 결과 화면의 보고서 형식을 **줄여서** 옮깁니다. 그쪽에는 목표 ·
   진행도 · 다음 할 일 · 몬스터 피해량까지 있었는데, 여기에는 목표도 전투도
   없으므로 숫자 판과 자세 띠만 남깁니다. 남긴 것은 셋입니다 —
   언제 · 얼마나 앉았나 · 그 시간이 어땠나. 자세 띠가 재는 구간은
   착석이 아니라 세션 전체입니다(카메라가 세션 내내 돕니다).

   ponytail: 나중에 AI 리포트를 붙일 자리가 여기입니다. 지금은 저장된
   숫자를 그대로 보여 주기만 하고, 해석은 한 줄도 쓰지 않습니다. */
const SESS_LIST_MAX = 12;

function dateKo(key) {
  const p = String(key || '').split('-');
  return p.length === 3 ? Number(p[1]) + '월 ' + Number(p[2]) + '일' : '날짜 없음';
}

/** 세션이 시작한 시각 — 같은 날 세션을 두 번 했을 때 둘을 구분해 줍니다. */
function sessAt(r) {
  if (!r.at) return '';
  const h = new Date(r.at).getHours();
  return (h < 12 ? '오전 ' : '오후 ') + (h % 12 || 12) + '시';
}

/** 좋음·주의·굽음을 시간 비율 그대로 늘어놓은 띠. 판정이 없으면 빈 문자열. */
function postureBar(r) {
  const t = (r.goodMs || 0) + (r.warnMs || 0) + (r.badMs || 0);
  if (t <= 0) return '';
  const w = (v) => ((v / t) * 100).toFixed(2) + '%';
  return '<div class="bar">'
    + '<i style="width:' + w(r.goodMs || 0) + ';background:var(--good)"></i>'
    + '<i style="width:' + w(r.warnMs || 0) + ';background:var(--warn)"></i>'
    + '<i style="width:' + w(r.badMs || 0) + ';background:var(--bad)"></i>'
    + '</div>';
}

function sessLine(r) {
  const t = (r.goodMs || 0) + (r.warnMs || 0) + (r.badMs || 0);
  const when = [ZONE_KO[r.zone] || r.zone || '캠퍼스', sessAt(r)].filter(Boolean).join(' · ');
  const sub = t > 0
    ? '편안 <b>' + Math.round(((r.goodMs || 0) / t) * 100) + '%</b>'
      + ' · 회복 <b>' + (r.recoveries || 0) + '</b>회'
      + (r.coins ? ' · 코인 <b>' + r.coins + '</b>' : '')
    : '판정이 돌지 않은 세션이에요';
  return '<div class="sess">'
    + '<div class="top"><b>' + dateKo(r.date) + '</b><em>' + when + '</em>'
    + '<span class="val">' + (r.minutes || 0) + '분</span></div>'
    + postureBar(r)
    + '<div class="sub">' + sub + '</div>'
    + '</div>';
}

    : '';

  return '<div class="stats">'
    + '<div class="stat"><u>세션</u><b>' + s.count + '</b></div>'

}

const SEED_RANKING = [

];
/* 역대 1위 — **바로 앞 세 시즌**입니다. 번호를 1·2·3 으로 박아 두면
   시즌이 넘어갈 때마다 뒤로 밀려서, 지금이 6시즌인데 액자는 3시즌까지만
   있는 화면이 됩니다. 학교와 시간은 예시 값이고 그 사실을 창 아래에
   적어 두었습니다 — 번호만 그때그때 셉니다. */
const PAST_WINNERS = [
  { school: '고려대학교', hours: 14210 },
  { school: '연세대학교', hours: 13050 },
  { school: '서울대학교', hours: 11480 },
];
const PAST_SEASONS = () => PAST_WINNERS.map((w, i) =>
  Object.assign({ no: seasonInfo().no - 1 - i }, w)).filter((p) => p.no >= 1);

/** 시즌은 90일. 남은 날이 보여야 "이번 시즌 안에" 라는 말이 성립합니다. */
function seasonInfo() {
  const LEN = 90, START = Date.UTC(2026, 0, 5);       // 시즌 4 시작
  const days = Math.floor((Date.now() - START) / 86400000);
  const no = 4 + Math.floor(days / LEN);
  const into = ((days % LEN) + LEN) % LEN;
  const from = new Date(START + (no - 4) * LEN * 86400000);
  const to = new Date(from.getTime() + (LEN - 1) * 86400000);
  const fmt = (d) => (d.getUTCMonth() + 1) + '월 ' + d.getUTCDate() + '일';
  return { no, daysLeft: LEN - into, progress: into / LEN, from: fmt(from), to: fmt(to) };
}

/** 예시 값에 이 기기의 진짜 기록을 얹어 정렬합니다. */
function schoolRanking() {
  const s = myStats();
  const rows = SEED_RANKING.map((r) => Object.assign({}, r));
  const mine = rows.find((r) => r.school === ROOM.school);
  if (mine) {
    mine.hours += Math.round(s.total / 60);
    mine.recoveries += s.recov;
  } else if (ROOM.school) {
    rows.push({ school: ROOM.school, hours: Math.round(s.total / 60), recoveries: s.recov });
  }
  return rows.sort((a, b) => b.hours - a.hours || b.recoveries - a.recoveries);
}

function renderAnimalMatch3() {
  const board = panelBody.querySelector('#animal-match3-board');
  const score = panelBody.querySelector('#animal-match3-score');
  const moves = panelBody.querySelector('#animal-match3-moves');
  const highScore = panelBody.querySelector('#animal-match3-high-score');
  if (!board || !score || !moves || !highScore) return;
  const types = animalMatch3Types();
  board.innerHTML = ANIMAL_MATCH3.grid.map((type, index) => {
    const animal = types[type];
    const selected = ANIMAL_MATCH3.selected === index;
    const special = ANIMAL_MATCH3.specials.get(index);
    const effectSize = ANIMAL_MATCH3.effect && ANIMAL_MATCH3.effect.indices.includes(index) ? ANIMAL_MATCH3.effect.size : 0;
    const swapStyle = ANIMAL_MATCH3.swap && ANIMAL_MATCH3.swap.indices.includes(index)
      ? `animation:animalMatch3Cross .22s ease both;--swap-x:${ANIMAL_MATCH3.swap.x[index] || '0px'};--swap-y:${ANIMAL_MATCH3.swap.y[index] || '0px'};`
      : '';
    const effectStyle = effectSize >= 5 ? 'animation:animalMatch3Clear5 .3s ease both;'
      : effectSize === 4 ? 'animation:animalMatch3Clear4 .3s ease both;'
      : effectSize === 3 ? 'animation:animalMatch3Clear3 .24s ease both;' : '';
    return `<button type="button" data-animal-index="${index}" aria-label="${animal.name} 타일"
      style="position:relative;display:grid;place-items:center;min-width:0;aspect-ratio:1;border:0;border-radius:11px;background:${animal.color};font-size:clamp(22px,7vw,38px);cursor:pointer;box-shadow:${selected ? '0 0 0 4px #2d8f83, inset 0 -4px 0 rgba(0,0,0,.12)' : 'inset 0 -4px 0 rgba(0,0,0,.12)'};transform:${selected ? 'scale(.92)' : 'scale(1)'};transition:transform .12s ease,box-shadow .12s ease;${swapStyle}${effectStyle}">${animal.emoji}${special ? `<i class="animal-match3-special ${special.kind}" aria-label="${special.kind === 'rainbow' ? '무지개 블록' : '라인 제거 블록'}"></i>` : ''}</button>`;
  }).join('');
  score.textContent = `${ANIMAL_MATCH3.score}`;
  moves.textContent = `${ANIMAL_MATCH3.moves}`;
  highScore.textContent = `${ANIMAL_MATCH3.highScore}`;
  const message = panelBody.querySelector('#animal-match3-message');
  if (message && ANIMAL_MATCH3.lastResult) message.textContent = ANIMAL_MATCH3.lastResult;
}
function finishAnimalMatch3(success) {
  ANIMAL_MATCH3.active = false; ANIMAL_MATCH3.state = 'GAME_OVER';
  ANIMAL_MATCH3.lastResult = success ? '게임 종료! 멋진 점수예요.' : 'Move를 모두 사용했어요.';
  ANIMAL_MATCH3.highScore = Math.max(ANIMAL_MATCH3.highScore, ANIMAL_MATCH3.score);
  try { localStorage.setItem('girin.match3.highScore', String(ANIMAL_MATCH3.highScore)); } catch { /* private mode */ }
  renderAnimalMatch3();
  const message = panelBody.querySelector('#animal-match3-message');
  if (message) message.innerHTML = `<strong>${success ? '게임 종료!' : '게임 종료'}</strong> 최종 점수 ${ANIMAL_MATCH3.score}점`;
}
function swapAnimalMatch3(first, second) {
  const engine = animalMatch3Engine();
  if (!engine || ANIMAL_MATCH3.state !== 'PLAYING' || !animalMatch3Adjacent(first, second)) return false;
  ANIMAL_MATCH3.state = 'PROCESSING';
  const firstRow = Math.floor(first / ANIMAL_MATCH3_SIZE), firstCol = first % ANIMAL_MATCH3_SIZE;
  const secondRow = Math.floor(second / ANIMAL_MATCH3_SIZE), secondCol = second % ANIMAL_MATCH3_SIZE;
  const dx = `${(secondCol - firstCol) * 100}%`, dy = `${(secondRow - firstRow) * 100}%`;
  ANIMAL_MATCH3.swap = { indices: [first, second], x: { [first]: dx, [second]: `-${(secondCol - firstCol) * 100}%` }, y: { [first]: dy, [second]: `-${(secondRow - firstRow) * 100}%` } };
  renderAnimalMatch3();
  setTimeout(() => {
    ANIMAL_MATCH3.swap = null;
    const result = engine.swapIfMatches(ANIMAL_MATCH3.grid, first, second, Math.random, ANIMAL_MATCH3.specials);
    if (!result.valid) {
      ANIMAL_MATCH3.state = 'PLAYING';
      ANIMAL_MATCH3.lastResult = '매치가 되지 않아 원래 자리로 돌아왔어요.';
      renderAnimalMatch3();
      return;
    }
    ANIMAL_MATCH3.moves -= 1;
    ANIMAL_MATCH3.combo = result.chains;
    ANIMAL_MATCH3.score += result.score;
    ANIMAL_MATCH3.effect = { indices: result.matches.flatMap((size) => Array.from({ length: Math.min(size, 5) }, (_, i) => (first + i) % ANIMAL_MATCH3.grid.length)), size: result.specialCreated?.kind === 'rainbow' ? 5 : result.specialCreated?.kind === 'line' ? 4 : 3 };
    ANIMAL_MATCH3.lastResult = result.specialActivated === 'rainbow' ? '무지개 블록 발동!'
      : result.specialActivated === 'line' ? '라인 제거 블록 발동!'
      : result.specialCreated?.kind === 'rainbow' ? '5개 매치! 무지개 블록이 생겼어요.'
      : result.specialCreated?.kind === 'line' ? '4개 매치! 라인 블록이 생겼어요.'
      : result.chains > 1 ? `${result.chains}연쇄! +${result.score}점` : `+${result.score}점`;
    ANIMAL_MATCH3.state = ANIMAL_MATCH3.moves <= 0 ? 'GAME_OVER' : 'PLAYING';
    renderAnimalMatch3();
    setTimeout(() => { ANIMAL_MATCH3.effect = null; renderAnimalMatch3(); }, 360);
    if (ANIMAL_MATCH3.moves <= 0) finishAnimalMatch3(false);
  }, 240);
  return true;
}
function startAnimalMatch3() {
  panelBody.innerHTML = animalMatch3Html();
  const engine = animalMatch3Engine();
  ANIMAL_MATCH3.active = true; ANIMAL_MATCH3.state = 'PLAYING'; ANIMAL_MATCH3.selected = -1;
  ANIMAL_MATCH3.score = 0; ANIMAL_MATCH3.moves = 24; ANIMAL_MATCH3.combo = 0; ANIMAL_MATCH3.lastResult = null;
  ANIMAL_MATCH3.specials = new Map(); ANIMAL_MATCH3.swap = null; ANIMAL_MATCH3.effect = null;
  try { ANIMAL_MATCH3.highScore = Number(localStorage.getItem('girin.match3.highScore')) || 0; } catch { ANIMAL_MATCH3.highScore = 0; }
  ANIMAL_MATCH3.grid = engine ? engine.createBoard() : [];
  renderAnimalMatch3();
}

function openEdit(key, row) {

    ROOM[group] = chip.dataset.v; saveRoom();
    /* 값이 바뀌면 그 자리에서 듣습니다. 저장만 하고 다음 켤 때 듣게
       하면, 눌러도 아무 일이 없는 설정이 됩니다. */
    if (group === 'sfxOn') SFX.muted = ROOM.sfxOn !== 'on';
    /* 고른 그 자리에서 바뀝니다. 저장만 하고 다음 장소에서 바뀌게 하면
       무엇을 고른 건지 귀로 확인할 수 없습니다. */
    if (group === 'bgmTrack') setMusic(zoneId);
    if (group === 'bgm') { SOUND.bgm = ROOM.bgm === 'on'; saveSound(); syncSound(); }
    if (group === 'camPeek') syncCamPeek();
    if (group === 'chatOn') syncChat();
    if (group === 'sayOn' && ROOM.sayOn === 'off') { sayEl.classList.remove('on'); clearTimeout(SAY.timer); }
    /* 학교를 고르면 과잠·강조색이 그 자리에서 바뀝니다. 인증 여부는
       건드리지 않습니다 — 고르는 것과 인증은 다른 일입니다. */
    if (group === 'school') applySchoolColor();
    return;
  }

  /* ---- 상점 ---- */
  const buy = e.target.closest('[data-buy]');
  if (buy) {
    const it = SHOP_BY_ID[buy.dataset.buy];
    if (!it) return;
    if (!spend(it.price)) { SFX.deny && SFX.deny(); return; }
    ROOM.owned.push(it.id);
    equip(it.id);                        // 산 것은 바로 입혀 줍니다
    saveRoom(); reopenShop();
    return;
  }
  const on = e.target.closest('[data-on]');
  if (on) { equip(on.dataset.on); saveRoom(); reopenShop(); return; }
  const off = e.target.closest('[data-off]');
  if (off) { unequip(off.dataset.off); saveRoom(); reopenShop(); return; }
  const tap = e.target.closest('.row.tap');
  if (tap) return openEdit(tap.dataset.edit, tap);
  const act = e.target.closest('[data-do]');
  if (!act) return;
  const what = act.dataset.do;
  if (what === 'edit-save' || what === 'edit-cancel') {
    const box = act.closest('.edit');
    if (what === 'edit-save') {
      const spec = EDITS[box.dataset.key];
      const v = box.querySelector('input').value;
      if (!spec.validate(v)) return;
      spec.apply(v); saveRoom();
    }
    /* 값이 여러 탭에 걸쳐 있으므로 탭 전체를 다시 그립니다 */
    const tabs = panelTabs.querySelectorAll('button');
    const active = [...tabs].findIndex((b) => b.getAttribute('aria-selected') === 'true');
    openPanel('settings');
    if (active > 0) panelTabs.querySelectorAll('button')[active].click();
    return;
  }
  if (what === 'close') closePanel();
  else if (what === 'calibrate') {
    /* 옛날에는 사람을 첫 의자로 옮겨 앉혔습니다 — 기준은 앉아야 잡는
       것이 아니라 카메라만 있으면 그 자리에서 잡는 것입니다. */
    closePanel();
    startCalibrate();
  } else if (what === 'new-session') { newSession();
  } else if (what === 'open-retro') {
    /* 세션이 도는 중이면 "지난 세션" 탭으로 엽니다. 이번 세션 숫자를
       도중에 들여다보게 하지 않는다는 원칙은 그대로 두고, 지난 기록만
       열어 줍니다. */
    openPanel('retro', SESSION.ended ? 0 : 1);
  } else if (what === 'copy') {
    navigator.clipboard?.writeText(ROOM.invite);
    act.textContent = '복사됨';
    setTimeout(() => { act.textContent = '복사'; }, 1400);
  } else if (what === 'regen') {
    ROOM.invite = null; saveRoom(); openPanel('mailbox');
  }
});

/* ==================================================================
   장소별 앰비언트 — 병합에서 서버저장 판본을 살렸습니다

   이 판본의 enterZone 에는 소리가 전혀 없었습니다. 공간마다 백색소음이
   다른 것은 "공간이 곧 모드" 라는 이 제품의 뼈대이고, 코인에서 공간별
   차등(본관3/도서관2)을 뺀 이유가 바로 "공간을 다르게 느끼게 하는 일은
   소리·NPC·분위기가 맡는다" 였습니다. 소리를 빼면 공간이 전부 같아집니다.

   효과음(SFX)과 달리 여기는 지속음이라 오디오 그래프를 따로 둡니다.
   음소거는 SOUND.bgm 이 맡고, 효과음 음소거는 SFX.muted 가 맡습니다.
   ================================================================== */
const SOUND = Object.assign({ bgm: true, sfx: true }, loadJSON('girin.sound', {}));
function saveSound() { saveJSON('girin.sound', { bgm: SOUND.bgm, sfx: SOUND.sfx }); }

const AUDIO = { ctx: null, master: null, bgmGain: null, amb: null, ambId: null, noise: null };

/** 분홍잡음 한 벌. 흰잡음은 이 크기에서 쉬익 소리가 세서 귀가 아픕니다. */
function noiseBuffer(ctx) {
  if (AUDIO.noise) return AUDIO.noise;
  const len = ctx.sampleRate * 4;                 // 4초를 이어 붙여 씁니다
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  /* Voss-McCartney 를 줄인 판. 옥타브마다 값을 드물게 바꿔 더하면
     저음이 두터운 분홍잡음이 납니다. */
  let b0 = 0, b1 = 0, b2 = 0;
  for (let i = 0; i < len; i++) {
    const w = Math.random() * 2 - 1;
    b0 = 0.99765 * b0 + w * 0.0990460;
    b1 = 0.96300 * b1 + w * 0.2965164;
    b2 = 0.57000 * b2 + w * 1.0526913;
    d[i] = (b0 + b1 + b2 + w * 0.1848) * 0.16;
  }
  AUDIO.noise = buf;
  return buf;
}

function audioCtx() {
  if (AUDIO.ctx) return AUDIO.ctx;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  const ctx = new AC();
  AUDIO.ctx = ctx;
  AUDIO.master = ctx.createGain();
  AUDIO.master.gain.value = 0.5;
  AUDIO.master.connect(ctx.destination);
  AUDIO.bgmGain = ctx.createGain();
  AUDIO.bgmGain.gain.value = 0;
  AUDIO.bgmGain.connect(AUDIO.master);
  return ctx;
}

/* 같은 칸의 다른 옷을 입으면 앞엣것은 자동으로 벗겨집니다 —
   상의를 두 벌 겹쳐 입을 일이 없습니다. */
function equip(id) {
  const it = SHOP_BY_ID[id];
  if (!it || !owns(id)) return;
  if (it.cat === 'egg') ROOM.character = EGG_CHARACTER[id] || ROOM.character;
  else ROOM.worn[it.cat] = id;
  jacketCanvas = null; dressedCache = null;                   // 월드 캐릭터를 다시 굽습니다
  drawCamAvatar();                                            // 얼굴 끈 사람의 PIP 도 갈아입습니다
}
function unequip(id) {
  const it = SHOP_BY_ID[id];
  if (!it || it.cat === 'egg') return;   // 알은 벗을 수 없습니다. 다른 알로 바꿀 뿐입니다
  if (ROOM.worn[it.cat] === id) delete ROOM.worn[it.cat];
  jacketCanvas = null; dressedCache = null;
}

/* ---- 장소별 앰비언트 ----
   같은 잡음을 필터로 다르게 깎습니다. 도서관은 위를 잘라 조용하게,
   본관은 아주 낮은 곳만 남겨 웅웅거리게, 기숙사는 그보다 더 낮고
   따뜻하게. 광장만 잡음 대신 화음을 얹어 밝게 둡니다. */
const AMBIENCE = {
  library: { cut: 900,  q: 0.6, gain: 0.16, tone: null },
  mainhall:{ cut: 220,  q: 1.2, gain: 0.22, tone: [72, 108] },
  dorm:    { cut: 160,  q: 1.0, gain: 0.20, tone: [64, 96] },
  union:   { cut: 1400, q: 0.5, gain: 0.12, tone: [196, 294] },
  campus:  { cut: 2600, q: 0.4, gain: 0.07, tone: [294, 392, 494] },
};

function syncSound() {
  if (!AUDIO.ctx) return;
  const g = AUDIO.bgmGain.gain, t = AUDIO.ctx.currentTime;
  g.cancelScheduledValues(t);
  g.setValueAtTime(g.value, t);
  g.linearRampToValueAtTime(SOUND.bgm ? 1 : 0, t + 0.25);
}

function stopAmbience() {
  if (!AUDIO.amb) return;
  const ctx = AUDIO.ctx, t = ctx.currentTime;
  const dying = AUDIO.amb;
  dying.gain.gain.cancelScheduledValues(t);
  dying.gain.gain.setValueAtTime(dying.gain.gain.value, t);
  dying.gain.gain.linearRampToValueAtTime(0, t + 0.5);
  setTimeout(() => dying.nodes.forEach((n) => { try { n.stop(); } catch { /* 이미 멈춤 */ } }), 700);
  AUDIO.amb = null; AUDIO.ambId = null;
}

/* ================== 배경 음악 ==================
   이 저장소의 소리는 전부 코드로 만듭니다 — 오디오 파일이 한 장도 없습니다.
   음악도 같은 자리에서 만듭니다. 파일을 넣으면 라이선스와 용량이 따라오고,
   무엇보다 앰비언트와 음색이 따로 놀게 됩니다.

   곡은 넷입니다. 장소마다 기본 곡이 정해져 있고(auto), 사람이 하나를 고르면
   어디를 가도 그 곡입니다. 장소 색을 소리로 옮긴 것이라 음계가 다릅니다 —
   조용한 곳은 단조·느리게, 밝은 곳은 장조·빠르게.

   앰비언트를 끄지 않습니다. 앰비언트는 "그 공간의 소음"이고 음악은 그 위에
   얹는 것이라, 둘이 같이 있어야 도서관이 도서관으로 들립니다. */
const MUSIC = {
  calm:   { name: '조용한 오후', bpm: 60, wave: 'sine',     root: 220.00,
            steps: [0, 7, 11, 7, 4, 7], pad: [0, 7],     gain: 0.055, len: 1.9 },
  bright: { name: '볕 드는 마당', bpm: 92, wave: 'triangle', root: 293.66,
            steps: [0, 4, 7, 9, 7, 4, 2, 4], pad: [0, 4, 7], gain: 0.042, len: 0.9 },
  warm:   { name: '저녁 방',     bpm: 54, wave: 'sine',     root: 174.61,
            steps: [0, 3, 7, 10, 7, 3], pad: [0, 3, 7], gain: 0.060, len: 2.2 },
  night:  { name: '늦은 밤',     bpm: 46, wave: 'sine',     root: 146.83,
            steps: [0, 5, 7, 12, 7, 5], pad: [0, 7],     gain: 0.055, len: 2.6 },
};
/* 장소별 기본 곡. 본관은 도서관과 같은 곡을 씁니다 — 둘 다 "집중하는 곳"
   이라 음악까지 다르면 공간이 아니라 곡이 기억에 남습니다. */
const ZONE_TRACK = {
  library: 'calm', mainhall: 'calm', dorm: 'warm', union: 'bright', campus: 'bright',
};
const semi = (root, n) => root * Math.pow(2, n / 12);

const BGM = { id: null, timer: 0, step: 0, next: 0, out: null, pad: null };

/** 지금 울려야 할 곡. 사람이 고른 게 있으면 그것, 아니면 장소 기본. */
function trackFor(zone) {
  const pick = ROOM.bgmTrack || 'auto';
  if (pick === 'off') return null;
  if (pick !== 'auto') return MUSIC[pick] ? pick : null;
  return ZONE_TRACK[zone] || null;
}

function stopMusic() {
  clearTimeout(BGM.timer); BGM.timer = 0;
  if (!AUDIO.ctx) { BGM.id = null; return; }
  const t = AUDIO.ctx.currentTime;
  for (const node of [BGM.out, BGM.pad]) {
    if (!node) continue;
    node.gain.cancelScheduledValues(t);
    node.gain.setValueAtTime(node.gain.value, t);
    node.gain.linearRampToValueAtTime(0, t + 0.6);
  }
  const dying = BGM.padOsc || [];
  setTimeout(() => dying.forEach((o) => { try { o.stop(); } catch { /* 이미 멈춤 */ } }), 800);
  BGM.out = null; BGM.pad = null; BGM.padOsc = null; BGM.id = null;
}

/** 음 하나. 붙였다 떼는 소리라 감쇠가 길어야 방에 남습니다. */
function pluck(ctx, freq, at, spec) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = spec.wave; o.frequency.value = freq;
  g.gain.setValueAtTime(0, at);
  g.gain.linearRampToValueAtTime(spec.gain, at + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, at + spec.len);
  o.connect(g); g.connect(BGM.out);
  o.start(at); o.stop(at + spec.len + 0.05);
}

/* 앞을 내다보며 예약합니다. requestAnimationFrame 으로 음을 내면 탭이
   가려질 때 프레임이 멈춰 음악도 끊깁니다 — 그러면 다른 탭에서 일하는
   동안 소리가 사라집니다. WebAudio 시계에 미리 꽂아 둡니다. */
function pumpMusic() {
  const ctx = AUDIO.ctx, spec = MUSIC[BGM.id];
  if (!ctx || !spec) return;
  const beat = 60 / spec.bpm;
  while (BGM.next < ctx.currentTime + 0.6) {
    const n = spec.steps[BGM.step % spec.steps.length];
    pluck(ctx, semi(spec.root, n), Math.max(BGM.next, ctx.currentTime + 0.02), spec);
    BGM.step++; BGM.next += beat;
  }
  BGM.timer = setTimeout(pumpMusic, 250);
}

function setMusic(zone) {
  const want = trackFor(zone);
  if (BGM.id === want) return;
  stopMusic();
  if (!want) return;
  const ctx = audioCtx();
  if (!ctx) return;
  const spec = MUSIC[want];

  BGM.out = ctx.createGain(); BGM.out.gain.value = 1; BGM.out.connect(AUDIO.bgmGain);
  /* 화음 한 겹 — 음만 있으면 방이 비어 들립니다. 아주 작게 깔아 둡니다. */
  BGM.pad = ctx.createGain(); BGM.pad.gain.value = 0;
  BGM.pad.connect(AUDIO.bgmGain);
  BGM.padOsc = spec.pad.map((n) => {
    const o = ctx.createOscillator();
    o.type = 'sine'; o.frequency.value = semi(spec.root / 2, n);
    o.connect(BGM.pad); o.start();
    return o;
  });
  BGM.pad.gain.linearRampToValueAtTime(spec.gain * 0.5, ctx.currentTime + 1.2);

  BGM.id = want; BGM.step = 0; BGM.next = ctx.currentTime + 0.15;
  pumpMusic();
}

/** 장소가 바뀌면 앞엣것을 접고 새로 답니다. 뚝 끊으면 문을 지날 때마다
    딸깍 소리가 납니다 — 0.5초씩 겹쳐 넘깁니다. */
function setAmbience(id) {
  if (AUDIO.ambId === id) return;
  const spec = AMBIENCE[id];
  const ctx = audioCtx();
  if (!ctx || !spec) { stopAmbience(); return; }
  stopAmbience();

  const gain = ctx.createGain();
  gain.gain.value = 0;
  gain.connect(AUDIO.bgmGain);
  const nodes = [];

  const src = ctx.createBufferSource();
  src.buffer = noiseBuffer(ctx);
  src.loop = true;
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = spec.cut; lp.Q.value = spec.q;
  src.connect(lp); lp.connect(gain);
  src.start(); nodes.push(src);

  /* 화음 — 잡음만이면 환풍기입니다. 아주 작게 깐 지속음이 있어야
     "여기 있다" 는 느낌이 납니다. */
  (spec.tone || []).forEach((hz, i) => {
    const o = ctx.createOscillator();
    o.type = i === 0 ? 'sine' : 'triangle';
    o.frequency.value = hz;
    const og = ctx.createGain();
    og.gain.value = 0.035 / (i + 1);
    /* 아주 느린 흔들림. 고정된 사인파는 몇 초만 지나도 기계음이 됩니다. */
    const lfo = ctx.createOscillator(), lg = ctx.createGain();
    lfo.frequency.value = 0.05 + i * 0.03; lg.gain.value = 0.012;
    lfo.connect(lg); lg.connect(og.gain);
    o.connect(og); og.connect(gain);
    o.start(); lfo.start();
    nodes.push(o, lfo);
  });

  gain.gain.linearRampToValueAtTime(spec.gain, ctx.currentTime + 0.6);
  AUDIO.amb = { gain, nodes }; AUDIO.ambId = id;
  syncSound();
}

/* 브라우저는 사용자가 건드리기 전에 소리를 못 내게 합니다. 첫 입력에서
   깨우고, 그때 지금 있는 장소의 앰비언트를 답니다.
   효과음 모듈(SFX)도 같은 순간에 함께 깨웁니다 — 따로 두면 앰비언트는
   나오는데 발소리는 안 나는 상태가 됩니다. */
let audioWoken = false;
function wakeAudio() {
  if (audioWoken) return;
  const ctx = audioCtx();
  if (!ctx) return;
  audioWoken = true;
  ctx.resume?.();
  SFX.unlock();
  setAmbience(zoneId);
  setMusic(zoneId);
}
addEventListener('keydown', wakeAudio, { once: false });
addEventListener('pointerdown', wakeAudio, { once: false });

/* ================== 지도 ==================
   캠퍼스는 46×42 라 한 화면에 안 들어옵니다. 어디에 무엇이 있는지
   외워야 하는 월드는 처음 온 사람에게 미로입니다. */
const MINI = { on: false, scale: 10, canvas: null, base: null };
const MINI_MATERIAL_COLORS = {
  [M.PLAZA]: '#AAA9BA',
  [M.BEIGE]: '#DCE5D8',
  [M.GRAY]: '#C5CCCE',
  [M.WATER]: '#62C4DE',
  [M.GRASS]: '#72B36A',
};

/* 좌표는 지도 위 자리(x,y)와 실제로 갈 곳(to)이 따로입니다 — 건물
   아이콘은 지붕 가운데에 찍고, 도착은 문 앞이어야 하기 때문입니다. */
const PLACES = [
  { id: 'dorm',     to: ['dorm', 3, 5],       x: 22, y: 6,  name: '기숙사',    key: '1' },
  { id: 'mainhall', to: ['mainhall', 18, 25], x: 7,  y: 19, name: '본관',      key: '2' },
  { id: 'library',  to: ['library', 18, 25],  x: 38, y: 19, name: '도서관',    key: '3' },
  { id: 'union',    to: ['union', 16, 21],    x: 23, y: 33, name: '학생회관',  key: '4' },
  { id: 'campus',   to: ['campus', 22, 25],   x: 22, y: 21, name: '중앙 광장', key: '5' },
  { id: 'field',    to: ['campus', 8, 8],     x: 8,  y: 7,  name: '운동장',    key: '6' },
  { id: 'arcade',   to: ['campus', 38, 8],    x: 38, y: 7,  name: '미니게임존', key: '7' },
  { id: 'lake',     to: ['campus', 6, 29],    x: 6,  y: 35, name: '호수',      key: '8' },
  { id: 'clubs',    to: ['campus', 40, 29],   x: 40, y: 35, name: '동아리 거리', key: '9' },
];

/** 캠퍼스 바닥을 줄여 한 장으로 굽습니다. 한 번만 합니다. */
function bakeMinimap() {
  const m = ZONES.campus;
  const S = MINI.scale;
  const c = document.createElement('canvas');
  c.width = m.w * S; c.height = m.h * S;
  const g = c.getContext('2d');
  /* 여기서만 부드럽게 줄입니다. 월드는 픽셀을 지켜야 하지만 지도는
     축소판이라, 각 잡힌 픽셀보다 형태가 뭉개지지 않는 쪽이 낫습니다. */
  g.imageSmoothingEnabled = true;
  /* 구워 둔 야외 바닥을 그대로 줄입니다 — 지도와 세계가 어긋나지 않습니다 */
  if (m.ground) g.drawImage(m.ground, 0, 0, c.width, c.height);
  g.imageSmoothingEnabled = false;

  /* ground 는 잔디와 운동장처럼 한 장으로 구운 그림만 담습니다. 일반
     길은 실제 시트의 보라색 타일을 그대로 줄이지 않고, 사진처럼 하나의
     회색 포장면으로 통일합니다. 호수는 별도 파란 영역으로 그려 경계와
     물 그림이 미니맵에서도 분명하게 보이게 합니다. */
  for (let y = 0; y < m.h; y++) for (let x = 0; x < m.w; x++) {
    const mat = m.over[at(m, x, y)];
    if (!mat) continue;
    g.fillStyle = MINI_MATERIAL_COLORS[mat] || '#AAA9BA';
    g.fillRect(x * S, y * S, S, S);

    /* 재질이 바뀌는 가장자리에만 선을 그려 길은 매끈하게 유지하고,
       호수·건물 주변은 지도처럼 또렷하게 구분합니다. */
    const same = (nx, ny) => inMap(m, nx, ny) && m.over[at(m, nx, ny)] === mat;
    g.strokeStyle = mat === M.WATER ? '#8CA5AD' : 'rgba(255,255,255,.42)';
    g.lineWidth = 1;
    if (!same(x, y - 1)) { g.beginPath(); g.moveTo(x * S, y * S + .5); g.lineTo((x + 1) * S, y * S + .5); g.stroke(); }
    if (!same(x + 1, y)) { g.beginPath(); g.moveTo((x + 1) * S - .5, y * S); g.lineTo((x + 1) * S - .5, (y + 1) * S); g.stroke(); }
    if (!same(x, y + 1)) { g.beginPath(); g.moveTo(x * S, (y + 1) * S - .5); g.lineTo((x + 1) * S, (y + 1) * S - .5); g.stroke(); }
    if (!same(x - 1, y)) { g.beginPath(); g.moveTo(x * S + .5, y * S); g.lineTo(x * S + .5, (y + 1) * S); g.stroke(); }

    if (mat === M.WATER) {
      g.fillStyle = 'rgba(224,249,255,.42)';
      g.fillRect(x * S + 2, y * S + 2, Math.max(2, S - 5), 1);
    }
  }

  /* 건물은 축약 사각형이 아니라 월드에서 쓰는 완성 캔버스를 축소합니다.
     그래야 지붕 모양·창문·돔·색 구분이 지도에서도 살아납니다. 작은
     소품은 기존처럼 생략해 장소 건물의 실루엣을 우선합니다. */
  for (const p of m.props) {
    const d = PROP[p.kind];
    if (!d || d.w < 6) continue;                   // 건물만
    const X = p.x * S, Y = p.y * S, W = d.w * S, H = (d.h - 1) * S;
    if (d.canvas) {
      g.imageSmoothingEnabled = true;
      g.drawImage(d.canvas, X, Y, W, d.h * S);
      g.imageSmoothingEnabled = false;
    } else {
      g.fillStyle = 'rgba(255,255,255,.62)'; g.fillRect(X, Y, W, H);
      g.fillStyle = 'rgba(43,50,48,.55)'; g.fillRect(X, Y + H, W, S);
      g.strokeStyle = 'rgba(43,50,48,.45)'; g.lineWidth = 1;
      g.strokeRect(X + .5, Y + .5, W - 1, H + S - 1);
    }
  }
  MINI.base = c;
}

function toggleMinimap(force) {
  MINI.on = force === undefined ? !MINI.on : force;
  document.getElementById('minimap').classList.toggle('on', MINI.on);
  if (MINI.on) drawMinimap();
}

function drawMinimap() {
  if (!MINI.base) bakeMinimap();
  const cvs = MINI.canvas;
  const g = cvs.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.clearRect(0, 0, cvs.width, cvs.height);
  g.drawImage(MINI.base, 0, 0);

  const S = MINI.scale;
  /* 지금 보고 있는 만큼을 상자로 표시합니다. 캠퍼스 밖(실내)일 때는
     상자가 뜻이 없으므로 건너뜁니다. */
  if (zoneId === 'campus') {
    g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 1;
    g.strokeRect(Math.round(camX / T * S) + .5, Math.round(camY / T * S) + .5,
                 Math.round(VIEW_W / T * S), Math.round(VIEW_H / T * S));
    g.fillStyle = '#2DD4BF';
    g.fillRect(Math.round(player.x / T * S) - 2, Math.round(player.y / T * S) - 2, 4, 4);
    g.fillStyle = '#FFF';
    g.fillRect(Math.round(player.x / T * S) - 1, Math.round(player.y / T * S) - 1, 2, 2);
  }
}

const minimapEl = document.getElementById('minimap');
MINI.canvas = document.getElementById('minimap-cv');
{

/** 지도에서 고른 곳으로 갑니다.
    이름이 travel 이 아닌 이유 — 그 이름은 이미 존 전환 페이드의 상태

/* ================== 리워드 ==================
   잔액(ROOM.coins)과 지급 이력(girin.reward)을 분리합니다. 랭킹 지표가
   서버로 가는 날 이력 검증만 서버로 옮기면 됩니다.

   원칙 — 코인은 **행동**으로만 쌓입니다. 자세가 좋다고 주지 않고(자세
   점수 금지), 오래 앉기 자체도 착석 상한(일 60분)이 막습니다.

   초대 200×5 · 피초대 50 · 학교 개척자 100 은 "피초대자가 인증하고 첫
   유효 세션을 마쳤는가" 를 서버가 확인해야 지급할 수 있어 여기에는
   없습니다 — 가입만으로 주면 봇 농사가 됩니다.

   로컬이라 콘솔로 잔액을 고칠 수 있습니다. 받아들입니다 — 개인 재화라
   피해자가 없고, 랭킹 지표(앉은 시간·회복)와는 분리돼 있습니다. */
/* 시즌은 **한 곳에서만** 셉니다 — seasonInfo() (90일, 2026-01-05 부터).
   전에는 여기에 42일짜리 창이 따로 있어서, 명예의 전당은 "시즌 4" 를
   보여 주는데 코인 장부는 "시즌 1" 을 세고 있었습니다. 두 화면이 같은
   낱말로 다른 것을 가리키면 둘 다 못 믿습니다. */
const seasonNow = () => seasonInfo().no;
function dayKey(t) {
  const d = t ? new Date(t) : new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
/* ---- 팀 확정 규칙 (연우안 + 민철안) ----
   `upright-now/src/constants/coin.ts` 와 서버 마이그레이션이 **같은 값**을
   씁니다. 셋 중 하나를 바꾸면 셋 다 바꿔야 합니다.

   누적형(10분마다 얼마씩)을 버리고 완주 구간제로 왔습니다. 누적형은
   켜 두기만 해도 쌓이고, 캠퍼스 체류 코인은 걸어다니기만 해도 줬습니다 —
   멘토가 지적한 어뷰징이 정확히 그것입니다.

   그리고 **분모가 앉은 시간이 아니라 판정이 돌아간 시간**입니다. 앉혀
   두고 자리를 비우면 의자 시계는 흐르지만 판정은 안 돕니다. 이 월드는
   세션 내내 카메라가 도므로(sit 이 아니라 세션이 카메라를 켭니다) 걸어
   다닌 시간도 판정이 돌면 인정됩니다. */
const COMPLETION_TIERS = [
  { min: 50, points: 60 },
  { min: 30, points: 40 },
  { min: 15, points: 30 },
  { min: 5,  points: 10 },
];
const STREAK_MILESTONES = [
  { days: 3,  points: 10 },
  { days: 7,  points: 25 },
  { days: 14, points: 50 },
  { days: 30, points: 100 },
  { days: 60, points: 180 },
];
const DAILY_CAP = 300;             // 모든 원천 합산. 어뷰징 방지
const COIN_RECOVERY = 5;           // 회복 성공 1회 · 세션당 5회까지
const COIN_MINIGAME = 10;          // 게임별 하루 1회

const completionCoins = (min) => (COMPLETION_TIERS.find((t) => min >= t.min) || { points: 0 }).points;
const streakMilestone = (days) => STREAK_MILESTONES.find((m) => m.days === days) || null;

const RW_DAY = () => ({ got: 0, attended: false, games: [] });
let RW = {
  day: dayKey(),
  daily: RW_DAY(),
  session: { recov: 0, completed: false },
  streak: { days: 0, last: '', claimed: [] },
  once: {},
  season: { id: seasonNow(), first: false, attend: [] },
};
try { Object.assign(RW, JSON.parse(localStorage.getItem('girin.reward') || '{}')); } catch { /* 기본값 */ }
function saveRW() { try { localStorage.setItem('girin.reward', JSON.stringify(RW)); } catch { /* 무시 */ } }

/** 날짜·시즌이 넘어갔으면 그 자리에서 접습니다. 모든 지급 앞에서 돕니다. */
function rwRoll() {
  if (RW.day !== dayKey()) { RW.day = dayKey(); RW.daily = RW_DAY(); }
  const sid = seasonNow();
  if (RW.season.id !== sid) {
    /* 지난 시즌 참여 보상 — 출석 7일 이상. 순위가 아니라 참여에 겁니다 */
    if ((RW.season.attend || []).length >= 7) grant(30, '시즌 참여');
    RW.season = { id: sid, first: false, attend: [] };
  }
}

/** 실제 지급 — 잔액·튕김·사유 칩.
    **하루 상한 300 은 여기서** 겁니다. 축마다 걸면 새 축이 생길 때마다
    빠뜨리게 되고, 그게 두 장부가 서로의 상한을 무시하던 이유입니다.
    상한에 걸리면 걸린 만큼만 주고 조용히 넘어갑니다 — "더 못 받는다" 를
    광고하면 상한이 목표가 됩니다. */
const coinNote = document.getElementById('coinNote');
let noteTimer = 0;
function grant(v, label) {
  rwRoll();
  v = Math.max(0, Math.min(v, DAILY_CAP - (RW.daily.got || 0)));
  if (v <= 0) return 0;
  ROOM.coins += v; saveRoom(); paintCoins(true);
  if (SESSION.startedAt && !SESSION.ended) SESSION.coins += v;
  RW.daily.got = (RW.daily.got || 0) + v;
  coinNote.textContent = '+' + v + ' · ' + label;
  coinNote.classList.add('on');
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => coinNote.classList.remove('on'), 1600);
  return v;
}

/** 쓰기 — 모자라면 아무것도 안 하고 false. 하루 상한은 **버는 쪽에만**
    겁니다. 쓴 액수를 오늘 번 것에서 빼면 상한이 늘어납니다.
    ponytail: 서버에는 아직 소비 RPC 가 없어 잔액 차감이 로컬입니다.
    상점을 실서버에 붙일 때 world_spend 를 만들어 여기서 부릅니다. */
function spend(amount) {
  if (ROOM.coins < amount) return false;
  ROOM.coins -= amount; saveRoom(); paintCoins(true);
  return true;
}

/** 모든 축이 이 문으로만 들어옵니다. 상한에 걸리면 조용히 무시합니다 —
    "더 못 받는다" 를 광고하면 상한이 목표가 됩니다. */
function award(kind, label, amount) {
  rwRoll();
  const D = RW.daily, S = RW.session;
  let v = 0;
  /* 완주 — 세션이 끝날 때 한 번. amount 는 **판정이 돌아간 분**입니다. */
  if (kind === 'complete') {
    if (S.completed) return;
    v = completionCoins(amount || 0);
    if (v <= 0) return;
    S.completed = true;
    label = (amount || 0) + '분 세션 완주';
  }
  else if (kind === 'recov') {
    if (S.recov >= 5) return;
    S.recov += 1; v = COIN_RECOVERY;
    if (!RW.once.firstRecov) { RW.once.firstRecov = true; v += 10; label = '첫 회복'; }
  }
  else if (kind === 'attend') {
    if (D.attended) return;
    D.attended = true;
    /* 어제 출석했으면 이어지고, 아니면 1일차부터. 기기 날짜를 되돌리면
       last 가 미래가 되는데, 그때는 리셋만 합니다. */
    RW.streak.days = RW.streak.last === dayKey(Date.now() - 86400000) ? RW.streak.days + 1 : 1;
    RW.streak.last = RW.day;
    if (!RW.season.attend.includes(RW.day)) RW.season.attend.push(RW.day);
    if (!RW.season.first) { RW.season.first = true; grant(10, '시즌 첫 세션'); }
    if (!RW.once.firstSession) { RW.once.firstSession = true; grant(30, '첫 세션'); }
    /* 연속 출석은 **마일스톤에서만** 줍니다 — 매일 조금씩 주면 그것도
       누적형이고, 30일차 하루가 다른 축 전부를 압도했습니다.
       각 마일스톤은 평생 한 번입니다(연속이 끊겼다 3일을 다시 채워도
       또 주지 않습니다). */
    RW.streak.claimed = RW.streak.claimed || [];
    const ms = streakMilestone(RW.streak.days);
    if (!ms || RW.streak.claimed.includes(ms.days)) { saveRW(); return; }
    RW.streak.claimed.push(ms.days);
    v = ms.points;
    label = RW.streak.days + '일 연속 출석';
  }
  else if (kind.indexOf('once:') === 0) {
    const k = kind.slice(5);
    if (RW.once[k]) return;
    RW.once[k] = true;
    v = k.indexOf('decorate') === 0 ? 10 : 5;
  }
  else return;
  saveRW();
  grant(v, label);
}

/* ---- 주기 작업 ----
   프레임 dt 로 돕니다. 탭이 가려지면 rAF 가 멈추고, 복귀 첫 프레임의
   점프(수 분)는 버립니다. */
let rwLast = 0, rwSaveAt = 0, sessSaveAt = 0, lastActivity = Date.now();
function rwTick(now) {
  if (!rwLast) { rwLast = now; return; }
  const ms = now - rwLast; rwLast = now;
  if (ms <= 0 || ms > 2000) return;
  rwRoll();
  /* 여기서는 **아무것도 지급하지 않습니다.** 시간이 흐른다는 이유로 주는
     축은 전부 없앴습니다 — 켜 두기만 해도 쌓이던 것이 어뷰징의 전부였고,
     캠퍼스 체류 코인은 걸어다니기만 해도 줬습니다.
     완주 코인은 세션이 끝날 때 한 번, 판정이 돌아간 시간으로 줍니다.

     출석만 여기서 봅니다. 그날 판정이 10분을 넘긴 순간이 "왔다" 는
     사실이고, 세션을 안 끝내고 탭을 닫아도 그건 사실이기 때문입니다. */
  if (judgedMinutes() >= 10) award('attend', '출석');
  /* 운동장 첫 방문 — 존이 아니라 캠퍼스 북서 구역이라 여기서 봅니다 */
  if (zoneId === 'campus' && player.x < 15 * T && player.y < 13 * T) award('once:visit_track', '운동장 첫 방문');
  if (now - rwSaveAt > 10000) { rwSaveAt = now; saveRW(); }
  /* 1분마다 진행 중인 세션을 갈무리합니다. 탭을 그냥 닫으면 endSession
     이 안 불리는데, 그때 한 시간짜리 세션이 통째로 사라졌습니다. */
  if (SESSION.startedAt && !SESSION.ended && now - sessSaveAt > 60000) {
    sessSaveAt = now; saveSession();
  }
}

/* 세션 종료 — 카메라를 내리고 회고를 엽니다. 다시 시작하려면 명시적으로
   눌러야 합니다: 끝냈다는 감각이 있어야 다음 세션이 새로 시작됩니다. */
const sessEnd = document.getElementById('sess-end');
const sessBox = document.getElementById('hud-session');
const sessTime = document.getElementById('sess-time');
function endSession() {
  if (SESSION.ended) return;
  if (player.sitting) stand();
  /* 완주 코인은 카메라를 내리기 **전에** 셉니다 — stopCamera 뒤에 세면
     판정 누적이 이미 멎은 뒤라 마지막 구간이 빠집니다. */
  const judged = judgedMinutes();
  award('complete', '', judged);
  stopCamera();                 // 세션 끝 = 촬영 끝. 서 있어도 꺼집니다.
  SESSION.ended = true;
  saveSession();
  /* 서버에도 보냅니다. 코인은 서버가 다시 계산하고 돌아온 잔액이
     정답입니다 — 로컬 잔액은 표시용이에요. 오프라인이면 save.js 큐에
     쌓였다가 다음 접속에 갑니다. 설정이 없으면 조용히 넘어갑니다. */
  if (window.WORLD_SAVE && WORLD_SAVE.configured) {
    WORLD_SAVE.finishSession({
      school: ROOM.school,
      seatedMinutes: judged,          // 서버의 분모도 판정 시간입니다
      campusMinutes: Math.round(sessionMinutes()),
      recoveries: LIVE.recoveries,
      startedAt: SESSION.startedAt || Date.now(),
      endedAt: Date.now(),
    }).then(applyServerBalance);
  }
  sessBox.classList.add('done');
  sessEnd.textContent = '회고 보기';
  openPanel('retro');
}

/** 서버가 아는 잔액이 정답입니다. 오프라인이면 null 이 와서 그냥 둡니다. */
function applyServerBalance(balance) {
  if (typeof balance !== 'number') return;
  ROOM.coins = balance; saveRoom(); paintCoins(true);
}
function newSession() {
  /* 마이페이지 경유로 회고가 세션 도중에도 열리므로, 이 버튼도 도중에
     눌릴 수 있게 됐습니다. 돌던 세션을 저장 없이 덮으면 마지막 자동저장
     이후 최대 1분이 사라집니다. */
  if (SESSION.startedAt && !SESSION.ended) saveSession();
  RW.session = { recov: 0, completed: false }; saveRW();
  resetSay();
  SESSION.startedAt = Date.now();
  SESSION.seatedMs = 0; SESSION.seatedAt = 0; SESSION.ended = false; SESSION.coins = 0;
  LIVE.goodMs = 0; LIVE.warnMs = 0; LIVE.badMs = 0;
  LIVE.recoveries = 0; LIVE.wasBad = false;
  resetAxis();          // 축별 누적도 같이 비웁니다 — 안 비우면 처방이 지난 세션 것을 물고 옵니다
  /* enterZone 을 거치지 않는 유일한 세션 시작 경로라 여기서도 켭니다.
     안 켜면 "종료 → 새 세션" 이 카메라 없는 세션이 됩니다. */
  startCamera();
  sessBox.classList.remove('done');
  sessEnd.textContent = '세션 종료';
  closePanel();
}
sessEnd.addEventListener('click', () => (SESSION.ended ? openPanel('retro') : endSession()));

const gearBtn = document.getElementById('gear');
gearBtn.addEventListener('click', () => openPanel('settings'));

/* ================== 루프 ================== */
let last = performance.now(), gameFrames = 0, gameFps = 0, fpsClock = last, drawCount = 0;

function update(dt) {
  if (portalCooldown > 0) portalCooldown -= dt;
  /* 화면이 가장 어두운 순간에 방을 갈아탑니다. 걷는 것은 그동안 멈춥니다 -
     안 멈추면 어둠 속에서 벽에 박힌 채로 새 방에 도착합니다. */
  if (travel) {
    travel.t += dt;
    if (!travel.done && travel.t >= TRAVEL_OUT) {
      travel.done = true;
      enterZone(travel.to.id, travel.to.sx, travel.to.sy);
    }
    if (travel.t >= TRAVEL_OUT + TRAVEL_IN) travel = null;
  }
  if (!player.sitting && !dialogOpen && !panelOpen && !travel) {
    const run = keys.has('shift');
    const speed = (run ? 92 : 54) * dt;
    let dx = 0, dy = 0;
    if (keys.has('w') || keys.has('arrowup')) dy -= 1;
    if (keys.has('s') || keys.has('arrowdown')) dy += 1;
    if (keys.has('a') || keys.has('arrowleft')) dx -= 1;
    if (keys.has('d') || keys.has('arrowright')) dx += 1;
    player.moving = dx !== 0 || dy !== 0;
    if (player.moving) {
      const len = Math.hypot(dx, dy);
      dx = dx / len * speed; dy = dy / len * speed;
      if (canStand(player.x + dx, player.y)) player.x += dx;
      if (canStand(player.x, player.y + dy)) player.y += dy;
      if (Math.abs(dx) > Math.abs(dy)) { player.dir = 'side'; player.flip = dx < 0; }
      else if (dy !== 0) player.dir = dy < 0 ? 'up' : 'down';
      /* 다리도 거리로 넘깁니다. 한 보폭에 두 칸씩 - 네 칸이 한 바퀴이니
         한 바퀴에 두 걸음, 사람이 걷는 것과 같습니다. */
      const stride = run ? STRIDE_RUN : STRIDE;
      const step = Math.hypot(dx, dy);
      player.anim += step / (stride / 2);
      player.frame = Math.floor(player.anim);

      /* ---- 발밑 ----
         한 걸음마다 소리 하나와 자국 하나. 표면이 바뀌는 순간에도 한
         걸음을 냅니다 - 잔디에서 포석으로 올라서는 그 발이 가장 잘
         들립니다. 다만 반 보폭은 지나야 합니다. 경계에 서서 앞뒤로
         비비면 소리가 연발로 터집니다. */
      const surf = surfaceAt(player.x, player.y);
      walked += step;
      if (walked >= stride || (lastSurf >= 0 && surf !== lastSurf && walked >= stride * 0.5)) {
        walked = 0;
        SFX.step(surf, run);
        if (surf === SURF.GRASS) FX.press(player.x, player.y);
        if (run && surf !== SURF.WATER) FX.dust(player.x, player.y, dx, dy);
        /* 물가를 지나면 그쪽 물이 흔들립니다 */
        const w = waterNear(player.x, player.y);
        if (w) FX.ripple(w.x, w.y);
      }
      lastSurf = surf;
    } else { player.anim = 0; player.frame = 0; walked = STRIDE; lastSurf = -1; }

    if (portalCooldown <= 0) {
      const tx = Math.floor(player.x / T), ty = Math.floor((player.y - 1) / T);
      for (const p of zone.portals)
        if (tx >= p.x && tx < p.x + p.w && ty >= p.y && ty < p.y + p.h) {
          SFX.door();
          /* 바로 옮기지 않고 화면을 먼저 재웁니다. 실제 이동은 가장
             어두운 순간에 일어나므로 갈아타는 장면이 안 보입니다. */
          travel = { t: 0, to: { id: p.to, sx: p.sx, sy: p.sy }, done: false };
          player.moving = false; player.anim = 0; player.frame = 0;
          break;
        }
    }
  }
  FX.update(dt);
  WIND.update(dt);
  PRECIP.update(dt, WEATHER.kind(), WEATHER.strength());
  nearby = findNearby();

  const maxX = zone.w * T - VIEW_W, maxY = zone.h * T - VIEW_H;
  const tx = player.x - VIEW_W / 2, ty = player.y - VIEW_H / 2 - T;
  camX = Math.round(maxX <= 0 ? maxX / 2 : Math.max(0, Math.min(maxX, tx)));
  camY = Math.round(maxY <= 0 ? maxY / 2 : Math.max(0, Math.min(maxY, ty)));
}

/** y 정렬 키. 발 위치가 먼저, 같으면 x 로 갈라 순서를 고정합니다.
    동점을 그대로 두면 sort 가 불안정해 매 프레임 순서가 뒤집힙니다. */
function sortKey(foot, x) { return foot * 4096 + x; }

function draw() {
  drawCount = 0;
  /* 지도 밖 여백. 페이지가 밝아졌으니 여기도 밝아야 액자가 안 생깁니다. */
  ctx.fillStyle = '#EFF1F1'; ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  const x0 = Math.max(0, Math.floor(camX / T)), y0 = Math.max(0, Math.floor(camY / T));
  const x1 = Math.min(zone.w - 1, Math.ceil((camX + VIEW_W) / T));
  const y1 = Math.min(zone.h - 1, Math.ceil((camY + VIEW_H) / T));

  if (zone.floor) {
    /* 실내는 방 전체가 한 장입니다. 타일을 반복하면 격자가 눈에 띄고,
       널판 이음새를 어긋나게 놓을 수도 없습니다. */
    ctx.drawImage(zone.floor, -camX, -camY);
    drawCount++;
  } else {
    /* 캠퍼스도 바닥은 한 장입니다. 그 위에 포장 오토타일만 얹으면
       길 가장자리는 시트가 그려 주고 잔디는 격자 없이 이어집니다. */
    if (zone.ground) { ctx.drawImage(zone.ground, -camX, -camY); drawCount++; }
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const dx = x * T - camX, dy = y * T - camY;
      if (!zone.ground) blitU(zone.base[at(zone, x, y)], dx, dy);
      const mat = zone.over[at(zone, x, y)];
      /* painted 로 표시한 칸은 바닥 그림에 이미 그려져 있습니다. 여기서
         타일을 또 얹으면 손으로 그린 곧은 모서리 위에 시트의 둥근
         모서리가 덮입니다. */
      if (mat && !zone.painted[at(zone, x, y)]) blitU(autoTile(zone, x, y, mat), dx, dy);
      drawCount += mat ? 2 : 1;
      /* 물낯. 가로로 긴 반짝임이 천천히 흘러가며 떴다 가라앉습니다.
         세로 무늬를 넣으면 흐르는 강이 되는데, 여기는 고인 호수입니다.
         가장자리 칸은 건너뜁니다 - 둑에 반짝임이 걸리면 물이 뭍으로
         올라온 것처럼 보입니다. */
      if (mat === M.WATER && !FX.reduced && waterInner(zone, x, y)) {
        const v = Math.sin(WIND.t * 0.55 + x * 0.9 + y * 0.35)
                + Math.sin(WIND.t * 0.23 - x * 0.31 + y * 1.1) * 0.7;
        if (v > 0.62) {
          const a = hash1(x * 13.7 + y * 29.1);
          ctx.globalAlpha = Math.min(0.42, (v - 0.62) * 0.5);
          ctx.fillStyle = '#DCF1F6';
          ctx.fillRect(dx + Math.floor(a * 6) + 2, dy + Math.floor(a * 11) + 3,
                       4 + Math.floor(a * 4), 1);
          ctx.globalAlpha = 1;
          drawCount++;
        }
      }
    }
    /* 풀포기. 잔디 위, 자국 아래 - 밟은 자리에도 풀은 서 있습니다. */
    TUFT.draw(ctx, zone, camX, camY);
  }

  /* 발밑 자국. 바닥 바로 위, 벽보다 아래입니다 - 벽 위에 깔면 실내에서
     자국이 벽을 타고 올라갑니다. */
  FX.draw(ctx, camX, camY);

  /* 손으로 그린 실내 벽. 바닥 위, 소품 아래에 깝니다 — Kenney 벽돌
     위를 덮어 겉과 속의 결을 맞춥니다. */
  if (zone.walls) {
    for (const w of zone.walls) {
      ctx.drawImage(w.c, w.x * T - camX, w.y * T - camY);
      drawCount++;
    }
    /* 창밖. 벽 다음에 하늘을 칠하고 창을 한 장 더 덮습니다 - 유리만
       비치고 틀과 창살은 가립니다. 도서관 백색소음이 빗소리인 날에는
       실제로 창밖에 비가 옵니다. 소리와 창이 같은 말을 해야 합니다. */
    drawWindows(ctx, zone, camX, camY);
  }

  /* 문턱. 청록은 잔디·포석·흙 어느 바닥과도 1.2~1.9 밖에 안 갈라져서
     혼자서는 안 보입니다. 어두운 테두리가 형태를 책임지고, 밝은 청록은
     그 안에서 숨만 쉽니다 - 코랄일 때는 색이 어두워 넘어갔던 문제입니다. */
  ctx.save();
  for (const p of zone.portals) {
    const x = p.x * T - camX, y = p.y * T - camY, w = p.w * T, h = p.h * T;
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#0C5A4F';
    ctx.fillRect(x, y, w, h);
    ctx.globalAlpha = 0.26 + Math.sin(performance.now() / 400) * 0.09;
    ctx.fillStyle = '#2DD4BF';
    ctx.fillRect(x + 1, y + 1, w - 2, h - 2);
  }
  ctx.globalAlpha = 1;

  /* 방금 지나온 문. 아직 닫히는 중이라 바깥 빛이 새어 듭니다.
     문이 열리고 닫히는 것을 프레임으로 그리는 대신 빛으로 말합니다 -
     문짝을 여는 그림은 방향마다 다시 그려야 하고, 빛은 한 번이면 됩니다. */
  if (doorFlash) {
    doorFlash.t += 1 / 60;
    if (doorFlash.t > 0.42) doorFlash = null;
    else {
      const k = 1 - doorFlash.t / 0.42;
      ctx.globalAlpha = 0.5 * k * k;
      ctx.fillStyle = '#FFF3DC';
      const dx = doorFlash.x * T - camX, dy = doorFlash.y * T - camY;
      /* 아래로 갈수록 좁아지는 빛 - 문틈에서 바닥으로 쏟아지는 모양 */
      const w = doorFlash.w * T, h = doorFlash.h * T;
      for (let i = 0; i < h + 10; i++) {
        const t = i / (h + 10);
        const iw = Math.round(w * (1 - t * 0.45));
        ctx.globalAlpha = 0.5 * k * k * (1 - t);
        ctx.fillRect(Math.round(dx + (w - iw) / 2), dy + i, iw, 1);
      }
    }
  }
  ctx.restore();

  /* y 로 정렬해 겹칩니다. 없으면 캐릭터가 건물 앞에 붙어 평면이 됩니다. */
  const items = [];
  for (const p of zone.props) {
    const d = PROP[p.kind];
    if (p.x > x1 + 3 || p.x + d.w < x0 - 1 || p.y > y1 + 3 || p.y + d.h < y0 - 1) continue;
    /* 정렬 기준은 **바닥에 닿는 줄**입니다. d.anchor 를 주면 그 줄을,
       없으면 맨 아랫줄을 씁니다 — 가로등처럼 위가 튀어나온 물건은
       스프라이트 높이와 발 위치가 다릅니다. */
    items.push({ sort: sortKey((p.y + (d.anchor ?? d.h)) * T, p.x * T), kind: 'prop', p, d });
  }
  for (const n of zone.npcs) items.push({ sort: sortKey((n.y + 1) * T, n.x * T), kind: 'npc', n });
  /* 같은 줄에 섰을 때는 플레이어가 앞에 옵니다. 동점이면 정렬이 프레임마다
     뒤바뀌어 캐릭터가 물건 앞뒤로 깜빡였습니다. */
  items.push({ sort: sortKey(player.y, player.x) + 0.5, kind: 'player' });
  /* 다른 사람·봇을 같은 정렬 목록에 넣습니다 — multiplayer.js.
     병합에서 이 줄이 빠져 있었습니다. 없으면 multiplayer.js 가 사람을
     다 만들어 두고도 **한 명도 그려지지 않습니다.**
     따로 그리면 안 됩니다. 나무 뒤에 선 사람이 나무 앞에 뜹니다. */
  if (window.MP) MP.collect(items);
  items.sort((a, b) => a.sort - b.sort);

  for (const it of items) {
    if (it.kind === 'prop') {
      const { p, d } = it;
      if (d.s === 'img') {
        /* 직접 그린 건물은 한 장이라 drawImage 한 번이면 끝납니다.
           타일로 쌓으면 큰 건물 하나에 100 번이 넘게 듭니다.
           천막은 바람 세기에 맞는 자세를 골라 씁니다 - 미리 구워 뒀으니
           여기서도 한 번입니다. */
        const fl = FLUTTER[p.kind];
        const img = fl
          ? fl[Math.max(0, Math.min(4, Math.round(WIND.at(p.x * T, p.y * T) * 2) + 2))]
          : d.canvas;
        ctx.drawImage(img, p.x * T - camX, p.y * T - camY);
        drawCount++;
      } else {
        const blit = BLIT[d.s];
        for (let j = 0; j < d.h; j++) for (let i = 0; i < d.w; i++) {
          blit(d.t[j][i], (p.x + i) * T - camX, (p.y + j) * T - camY);
          drawCount++;
        }
      }
    } else if (it.kind === 'npc') {
      blitU(it.n.sprite, it.n.x * T - camX, it.n.y * T - camY);
      drawCount++;
      if (nearby?.kind === 'talk' && nearby.npc === it.n) {
        /* 말 걸 수 있다는 느낌표. 머리 위 하늘에도 벽에도 뜨므로 어두운
           획을 한 겹 깔고 그 위에 청록을 얹습니다. 2px 짜리 표시가
           바탕에 묻히면 아무도 말을 못 겁니다. */
        const bx = it.n.x * T - camX + 7, by = it.n.y * T - camY;
        const bob = Math.sin(performance.now() / 200) * 1.5;
        ctx.fillStyle = '#0C5A4F';
        ctx.fillRect(bx - 1, by - 7 + bob, 4, 6);
        ctx.fillRect(bx - 1, by - 2 + bob, 4, 4);
        ctx.fillStyle = '#2DD4BF';
        ctx.fillRect(bx, by - 6 + bob, 2, 4);
        ctx.fillRect(bx, by - 1 + bob, 2, 2);
      }
    } else if (it.kind === 'mp') { MP.drawOne(it.rp); drawCount++;
    } else { drawPlayer(); drawCount++; }
  }

  /* 벽시계 바늘 — 진짜 시각. 방에 있는 동안 분침이 움직입니다. */
  if (zone.clock) {
    const now = new Date();
    const cx = zone.clock.x * T + 8 - camX;
    const cy = zone.clock.y * T + 22 - camY;
    const mm = (now.getMinutes() + now.getSeconds() / 60) / 60 * Math.PI * 2;
    const hh = ((now.getHours() % 12) + now.getMinutes() / 60) / 12 * Math.PI * 2;
    ctx.strokeStyle = '#2A3440'; ctx.lineCap = 'butt';
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.sin(hh) * 4.2, cy - Math.cos(hh) * 4.2); ctx.stroke();
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.sin(mm) * 6.4, cy - Math.cos(mm) * 6.4); ctx.stroke();
    ctx.fillStyle = '#C2412C';
    ctx.fillRect(cx - 1, cy - 1, 2, 2);
    drawCount++;
  }

  /* 구름 그림자는 사람 위로도 지나갑니다. 땅에만 깔면 구름이 건물
     뒤에서만 흐르는 것이 되고, 실제로는 지나가는 자리를 다 덮습니다. */
  CLOUDS.draw(ctx, zone, camX, camY);

  /* 밖에 서 있을 때만 비를 맞습니다. 실내에서는 창에만 내립니다. */
  if (!zone.floor) PRECIP.draw(ctx, WEATHER.kind());

  /* 조명은 맨 마지막입니다. 땅도 건물도 사람도 같은 빛을 받아야
     한 공간에 있는 것으로 보입니다. HUD 는 캔버스 밖이라 안 어두워집니다. */
  LIGHTMAP.apply(ctx, zone, camX, camY, VIEW_W, VIEW_H);

  /* 존 전환. 조명보다도 나중입니다 - 화면을 덮는 것이지 공간 안의
     빛이 아닙니다. 새까만 대신 따뜻한 어둠을 씁니다. 순검정은 전원이
     꺼진 느낌이고, 이건 문을 지나는 동안입니다. */
  if (travel) {
    const k = travel.t < TRAVEL_OUT
      ? travel.t / TRAVEL_OUT                                  // 어두워지는 중
      : 1 - (travel.t - TRAVEL_OUT) / TRAVEL_IN;               // 밝아지는 중
    ctx.fillStyle = '#17110E';
    ctx.globalAlpha = Math.max(0, Math.min(1, k));
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.globalAlpha = 1;
  }
}

/* 캐릭터 — 종 시트 32x48 에 산 옷을 겹쳐 구운 한 장을 얹습니다.
   타일이 16px 인데 캐릭터는 가로 두 칸 세로 세 칸입니다. 발바닥은 프레임
   안 y45 이고(y46-47 은 예전 그림자 자리), 그래서 발 위치에서 45 를 빼고
   그립니다. 정렬은 예전처럼 발 줄로 하므로 기물 앞뒤가 그대로입니다.

   시트가 아직 안 왔으면 예전 16px 사람으로 물러납니다 — 빈 화면보다
   낫고, 시트가 도착하면 다음 프레임부터 저절로 바뀝니다. */
function drawPlayer() {
  const sheet = dressedSheet();
  const bob = player.moving && !player.sitting ? (Math.floor(player.anim * 2) % 2 ? -1 : 0) : 0;

  /* 그림자는 시트에 굽지 않고 여기서 그립니다 — 종마다 발 폭이 달라도
     같은 타원이 깔려야 다 같은 바닥에 서 있는 것으로 보입니다. */
  const fx = Math.round(player.x - camX), fy = Math.round(player.y - camY);
  ctx.save();
  ctx.globalAlpha = 0.22; ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(fx, fy - 1, 6, 2.4, 0, 0, 7); ctx.fill();
  ctx.restore();

  /* 앉고 일어설 때 한 번 눌립니다. 세로만 줄이고 발끝을 바닥에 붙여
     둬야 눌린 것으로 보입니다 - 가운데를 기준으로 줄이면 떠오릅니다.
     0.18 초. 이보다 길면 물컹해지고 짧으면 안 보입니다. */
  if (sitSquash > 0) sitSquash = Math.max(0, sitSquash - 1 / 60 / 0.18);
  const sq = sitSquash > 0 ? 1 - Math.sin(sitSquash * Math.PI) * 0.16 : 1;

  if (!sheet) {
    const col = DIR_COL[player.dir];
    const rowI = player.moving ? WALK_ROW[player.frame & 3] : 0;
    const idx = CHAR_BASE + rowI * U_COLS + col;
    const old = playerSheet();
    const ox = (idx % U_COLS - CHAR_SHEET_COL) * T, oy = ((idx / U_COLS) | 0) * T;
    ctx.save();
    if (sq !== 1) { ctx.translate(fx, fy); ctx.scale(1, sq); ctx.translate(-fx, -fy); }
    if (player.dir === 'side' && player.flip) {
      ctx.translate(fx + T / 2, fy - T + bob); ctx.scale(-1, 1);
      ctx.drawImage(old, ox, oy, T, T, 0, 0, T, T);
    } else {
      ctx.drawImage(old, ox, oy, T, T, fx - T / 2, fy - T + bob, T, T);
    }
    ctx.restore();
    return;
  }

  /* 방향 — 시트 순서는 right, up, left, down 이고 아이템과 같습니다.
     player.dir 의 'side' 는 좌우를 flip 으로 만들던 16px 시절 표현이라
     여기서 left/right 로 풀어 줍니다. 시트에 양쪽이 다 들어 있어
     뒤집을 필요가 없고, 뒤집으면 옷의 단추가 반대편으로 갑니다. */
  const dirName = player.dir === 'side' ? (player.flip ? 'left' : 'right')
    : player.dir === 'up' ? 'up' : 'down';
  const sx = ITEM_DIR[dirName] * CHAR_W;

  ctx.save();
  if (sq !== 1) { ctx.translate(fx, fy); ctx.scale(1, sq); ctx.translate(-fx, -fy); }
  ctx.drawImage(sheet, sx, 0, CHAR_W, CHAR_H,
                fx - CHAR_W / 2, fy - CHAR_GROUND_Y + bob, CHAR_W, CHAR_H);
  ctx.restore();
}

const promptEl = document.getElementById('prompt');
const headTimerEl = document.getElementById('headTimer');
const headTimerVal = headTimerEl.querySelector('b');
function syncPrompt() {
  const r = cv.getBoundingClientRect();
  const hx = r.left + (player.x - camX) * SCALE;
  /* 발에서 프레임 맨 위까지 올립니다. 예전엔 T(16)만큼만 올렸는데,
     캐릭터가 32x48 이 되면서 그 높이가 배꼽입니다 — multiplayer.js 의
     이름표가 groundY(45)를 쓰는 것과 같은 이유입니다. */
  const lift = (window.GIRIN_CHAR && GIRIN_CHAR.groundY) || T;
  const hy = r.top + (player.y - lift - camY) * SCALE;
  /* 타이머가 먼저 머리 위에 앉고, 안내는 그 위로 비켜 섭니다.
     같은 자리에 두면 말 걸 때마다 시간이 가려집니다. */
  const live = SESSION.startedAt && !SESSION.ended;
  headTimerEl.classList.toggle('on', !!live && !dialogOpen);
  if (live) {
    headTimerVal.textContent = sessionText();
    headTimerEl.style.left = hx + 'px';
    headTimerEl.style.top = hy - 4 + 'px';
  }
  /* 자세 말풍선도 같은 머리 좌표를 씁니다. 타이머·안내보다 한 층 위에
     떠서 셋이 안 겹칩니다. */
  if (sayEl.classList.contains('on')) {
    sayEl.style.left = hx + 'px';
    sayEl.style.top = hy - (live ? 46 : 28) + 'px';
  }
  if (!nearby || dialogOpen) { promptEl.classList.remove('on'); return; }
  /* 키 이름은 안 붙입니다. 게시판마다 "Space · 미니게임 설명 보기" 처럼
     같은 낱말이 앞에 반복되면, 정작 읽어야 하는 뒷말이 뒤로 밀립니다.
     Space 는 첫 진입 안내가 한 번 알려 주고 설정의 조작 목록에 남아
     있으므로, 칩은 **무엇을 할 수 있는지**만 말합니다. */
  promptEl.textContent = nearby.kind === 'sit' ? '앉기'
    : nearby.kind === 'stand' ? '일어나기'
    : nearby.npc.name.split(' · ')[0];
  promptEl.style.left = hx + 'px';
  promptEl.style.top = hy - (live ? 24 : 6) + 'px';
  promptEl.classList.add('on');
}

const el = {
  fpsGame: document.getElementById('fps-game'),
  fpsPose: document.getElementById('fps-pose'),
  draws: document.getElementById('draw-count'),
  sitTime: document.getElementById('sit-time'),
  lm: document.getElementById('lm-count'),
};

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw(); syncPrompt();
  rwTick(now);
  gameFrames++;
  if (now - fpsClock >= 500) {
    gameFps = Math.round(gameFrames * 1000 / (now - fpsClock));
    poseFps = Math.round(poseFrames * 1000 / (now - fpsClock));
    gameFrames = 0; poseFrames = 0; fpsClock = now;
    el.fpsGame.textContent = gameFps;
    el.fpsGame.className = gameFps < 50 ? 'warn' : '';
    el.fpsPose.textContent = poseRunning ? poseFps : '–';
    el.fpsPose.className = poseRunning && poseFps < 12 ? 'warn' : '';   // 목표가 ~15fps 라 20이면 늘 빨갛습니다
    el.draws.textContent = drawCount + ' draws';
    el.lm.textContent = LIVE.recoveries;
  }
  if (SESSION.startedAt) {
    el.sitTime.textContent = sessionText();
    if (!SESSION.ended) sessTime.textContent = sessionText();
  }
  requestAnimationFrame(frame);
}

let ready = 0;
function maybeStart() {
  if (++ready < 3) return;
  document.getElementById('boot').classList.add('gone');
  enterZone('dorm', 3, 5);
  requestAnimationFrame(frame);
  /* 처음 온 사람에게만. 부팅 화면이 걷힌 뒤 한 박자 두고 띄웁니다 —
     같은 순간에 겹치면 둘 다 못 읽습니다. */
  try {
    if (localStorage.getItem('girin.tutorial') !== 'seen') setTimeout(startTutorial, 700);
  } catch { /* 저장소가 막혀 있으면 안 띄웁니다 */ }
}
function failed(name) {
  document.getElementById('boot').textContent =
    'assets/' + name + ' 을 못 읽었습니다. 이 파일과 같은 폴더에 assets/ 가 있어야 합니다.';
}
urban.onload = maybeStart;   urban.onerror = () => failed('urban.png');
city.onload = maybeStart;    city.onerror = () => failed('city.png');
school.onload = maybeStart;  school.onerror = () => failed('school16.png');
urban.src = 'assets/urban.png';
city.src = 'assets/city.png';
school.src = 'assets/school16.png';
</script>
