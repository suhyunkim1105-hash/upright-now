    <div class="note">틀려도 책은 그대로 있어요 — 시간만 <b>3초</b> 줄어듭니다.
    칸이 올라갈수록 권수가 늘고(4 · 5 · 6권), <b>2칸부터는 번호가 같은 책</b>이
    섞여요. 그때는 저자기호를 보셔야 해요. ${BOOK_ROUNDS}칸을 다 채우면
    오늘 몫 코인이 들어와요.</div>`;
}

/** 책등 하나. 제목은 **세로쓰기**입니다 — 실제 책등이 그렇고, 가로로
    쓰면 '기린의 목은 왜 길까' 같은 제목이 60px 안에서 뭉개집니다.
    아래 흰 딱지가 청구기호로, 도서관 라벨이 붙는 자리 그대로입니다.
    높이를 조금씩 다르게 주는 것은 책 여섯 권이 한 덩어리로 안 보이게
    하려는 것입니다. */
function bookSpine(b, i, inCart, justPlaced) {
  const h = 132 + (i % 3) * 10;
  const anim = justPlaced ? 'animation:bookIn .3s cubic-bezier(.2,.9,.3,1) both;' : '';
  return `<${inCart ? 'button type="button"' : 'div'} class="book-spine"${inCart ? ` data-book="${i}"` : ''}
    ${inCart ? `aria-label="${esc(b.t)} · 청구기호 ${esc(b.n)} ${esc(b.a)}"` : 'aria-hidden="true"'}
    style="height:${h}px;background:${b.col};${anim}">
    <span class="bt" style="max-height:${h - 44}px">${esc(b.t)}</span>
    <b class="bn">${esc(b.n)}<br>${esc(b.a)}</b>
  </${inCart ? 'button' : 'div'}>`;
}

function renderBookSort() {
  const B = BOOK_SORT;
  const shelf = panelBody.querySelector('#book-shelf');
  const cart = panelBody.querySelector('#book-cart');
  if (!shelf || !cart) return;
  /* 다 끝나면 round 가 3 이 되는데, 그대로 표에서 뽑으면 없는 칸(4칸)을
     읽습니다 — 끝낸 화면에 "책장 4칸" 이라고 적혀 있었습니다. */
  const ri = Math.min(B.round, BOOK_ROUNDS - 1);
  /* 빈 자리를 홈으로 그려 둡니다. 몇 권이 더 들어가는지가 보여야
     "이 칸이 얼마나 남았나" 를 세지 않고 압니다. */
  const slots = BOOK_PER_ROUND[ri] - B.shelf.length;
  shelf.innerHTML = B.shelf.map((b, i) => bookSpine(b, i, false, i === B.placed)).join('')
    + '<span class="book-slot"></span>'.repeat(Math.max(0, slots));
  cart.innerHTML = B.cart.map((b, i) => bookSpine(b, i, true)).join('')
    || '<span class="hint" style="color:#FFF6F3">카트가 비었어요.</span>';
  const r = panelBody.querySelector('#book-round');
  const w = panelBody.querySelector('#book-wrong');
  const lf = panelBody.querySelector('#book-left');
  const nm = panelBody.querySelector('#book-case-name');
  const st = panelBody.querySelector('#book-streak');
  if (r) r.textContent = B.round + ' / ' + BOOK_ROUNDS;
  if (w) w.textContent = B.wrong + '번';
  if (lf) lf.textContent = B.cart.length + '권';
  if (nm) nm.textContent = B.over && B.round >= BOOK_ROUNDS
    ? BOOK_ROUNDS + '칸 다 채움'
    : (ri + 1) + '칸 · ' + BOOK_PER_ROUND[ri] + '권';
  if (st) st.textContent = B.streak >= 3 ? B.streak + '권 연속 정답' : '';
}

function bookSay(t) {
  const el = panelBody.querySelector('#book-msg');
  if (el) el.textContent = t;
}

/** 카트에서 한 권 고르기. 남은 것 중 가장 작은 것이면 꽂히고, 아니면
    시간만 깎입니다 — 책을 뺏지는 않습니다. 못 고치는 벌은 안 줍니다. */
function pickBook(i) {
  const B = BOOK_SORT;
  if (!B.active || B.over) return;
  const b = B.cart[i];
  if (!b) return;
  const first = B.cart.slice().sort(bookOrder)[0];
  if (b !== first) {
    B.wrong++; B.roundWrong++; B.streak = 0; B.endAt -= BOOK_PENALTY;
    /* 처음 틀리면 방향만, 같은 칸에서 두 번째부터 답을 짚습니다.
       숫자 뒤에 이/가 를 붙이면 자릿수마다 받침이 달라 늘 틀리므로
       조사를 안 쓰는 쪽으로 씁니다. */
    bookSay(B.roundWrong >= 2
      ? '아직이에요 — ' + first.n + ' ' + first.a + ' 먼저!'
      : (Number(b.n) > Number(first.n)
          ? '더 작은 번호가 카트에 남아 있어요.'
          : '번호는 맞는데 저자기호가 뒤예요 — ' + first.a + ' 가 먼저예요.'));
    bookFlashTime();
    renderBookSort();
    const el = panelBody.querySelector(`[data-book="${i}"]`);
    if (el) el.style.animation = 'bookNo .22s ease';
    SFX.chair(false);
    return;
  }
  B.cart.splice(i, 1);
  B.shelf.push(b);
  B.placed = B.shelf.length - 1;
  B.streak++;
  SFX.step(SURF.WOOD, false);
  if (B.cart.length) {
    bookSay(B.streak >= 3 ? B.streak + '권 연속! 다음은?' : '좋아요. 다음은?');
    renderBookSort();
    return;
  }
  B.round++;
  if (B.round >= BOOK_ROUNDS) { renderBookSort(); return finishBookSort(true); }
  /* 칸이 끝나면 잠깐 초록으로 물들었다가 다음 칸이 옵니다. 바로
     갈아치우면 방금 다 채운 칸을 못 보고 넘어갑니다. */
  const box = panelBody.querySelector('#book-case');
  if (box) box.style.animation = 'bookDone .5s ease';
  SFX.door();
  bookSay((B.round) + '칸 끝! 다음 칸은 ' + BOOK_PER_ROUND[B.round] + '권이에요'
          + (B.round >= 1 ? ' — 번호가 같은 책이 섞여 있어요.' : '.'));
  B.roundWrong = 0;
  setTimeout(() => {
    if (!BOOK_SORT.active) return;
    BOOK_SORT.shelf = []; BOOK_SORT.cart = bookDeal(BOOK_SORT.round);
    BOOK_SORT.placed = -1;
    const bx = panelBody.querySelector('#book-case');
    if (bx) bx.style.animation = '';
    renderBookSort();
  }, 520);
  renderBookSort();
}

/** 틀렸을 때 시간 칸을 붉게 한 번. 3초가 깎인 것을 숫자로만 말하면
    깎이는 순간을 못 보고, 그러면 벌이 있는 줄도 모릅니다. */
function bookFlashTime() {
  const el = panelBody.querySelector('#book-time');
  if (!el) return;
  el.style.color = 'var(--bad)';
  el.animate([{ transform: 'scale(1.18)' }, { transform: 'none' }], 260);
  setTimeout(() => { if (el) el.style.color = ''; }, 420);
}

function bookSortTick() {
  const B = BOOK_SORT;
  if (!B.active) return;
  const left = B.endAt - Date.now();
  const el = panelBody.querySelector('#book-time');
  if (el) el.textContent = mmss(left);
  /* 10초 아래로 내려가면 숫자가 붉어집니다 */
  if (el) el.style.color = left <= 10000 ? 'var(--bad)' : el.style.color;
  if (left <= 0) finishBookSort(false);
}

function finishBookSort(won) {
  const B = BOOK_SORT;
  B.active = false; B.over = true;
  clearInterval(B.timer);
  const left = Math.max(0, B.endAt - Date.now());
  const el = panelBody.querySelector('#book-time');
  if (el) el.textContent = won ? mmss(left) : '0:00';
  if (won) {
    if (!B.rewarded) { B.rewarded = true; earn(COIN_MINIGAME, '책 정리 ' + BOOK_ROUNDS + '칸', 'bookSort'); }
    bookSay(gameWinMsg() + ' ' + (left / 1000).toFixed(1) + '초 남기고 · 틀린 횟수 ' + B.wrong + '번.');
    SFX.door();
    renderBookSort();
    const shelf = panelBody.querySelector('#book-shelf');
    if (shelf) shelf.innerHTML =
      '<div style="flex:1;align-self:stretch;min-height:158px;display:flex;flex-direction:column;'
      + 'align-items:center;justify-content:center;gap:6px;border-radius:10px;background:#2E9E5B;color:#fff">'
      + '<b style="font-size:30px;letter-spacing:-.03em">' + BOOK_ROUNDS + '칸 정리 끝!</b>'
      + '<span style="font-size:14px;font-weight:700">' + (left / 1000).toFixed(1)
      + '초 남김 · 틀린 횟수 ' + B.wrong + '번</span></div>';
    const cart = panelBody.querySelector('#book-cart');
    if (cart) cart.innerHTML = '<span class="hint" style="color:#FFF6F3">카트가 비었어요. 수고했어요!</span>';
  } else {
    bookSay('시간이 다 됐어요. 번호 앞자리부터 보면 훨씬 빨라요 — 같은 번호일 때만 저자기호를 봅니다.');
  }
}

function startBookSort() {
  const B = BOOK_SORT;
  clearInterval(B.timer);
  panelBody.innerHTML = bookSortHtml();
  B.active = true; B.over = false; B.round = 0; B.wrong = 0; B.roundWrong = 0;
  B.streak = 0; B.rewarded = false; B.placed = -1;
  B.shelf = []; B.cart = bookDeal(0);
  B.endAt = Date.now() + BOOK_MS;
  B.timer = setInterval(bookSortTick, 200);
  renderBookSort();
  bookSortTick();
}

/* ==================================================================
   바깥 서비스 세 가지

   개더처럼, 물건 앞에서 Space 를 누르면 창이 열립니다. 셋 다 **월드가
   이미 하던 일**에 붙습니다 — 새 기능을 얹는 것이 아니라, 여기 있던
   가짜를 진짜로 바꿉니다.

     창밖 날씨 (기숙사 창)   월드에는 이미 비·눈이 내립니다. 지금까지는
                             날짜·시각으로 정해지는 곡선이었습니다.
                             기상청 단기예보가 오면 **그 비가 진짜 비**가
                             됩니다.
     음악 (본관 강단)        본관 안내에 "대중음악이 나온다" 고 적혀
                             있는데 실제로는 합성음 화음뿐이었습니다.
     시간표 (기숙사 노트북)  세션을 시작할 이유는 대개 "오늘 뭐 있더라"
                             에서 옵니다. 그 화면이 방 안에 있어야 합니다.

   무엇을 안 붙였나 (일부러)
     카카오맵   진짜 지도가 이 제품이 하는 일을 돕지 않습니다. 여기는
                가상 캠퍼스이고, 실제 위치가 자세·집중과 이어지는 지점이
                없습니다. 키 발급 + 도메인 등록이라는 비용만 남습니다.
     디스코드   위젯 자체는 됩니다. 다만 이 월드에 동아리 부스는 그림일
                뿐 기능이 없고, 붙일 서버도 아직 없습니다. 들어갈 자리가
                생기면 그때 붙이는 것이 맞습니다.
     구글 문서  붙일 자리가 마땅치 않습니다. 도서관에 "공유 자료" 를
                만들면 그건 통합이 아니라 새 기능이고, 그건 회의 안건입니다.

   붙일 수 없다고 확인된 것: 노션 · 캔바 편집기 · 구글 미트 · 슬랙 ·
   에브리타임(2022년 크롤링 유죄 판례) · 링커리어 · RISS. 시도하지 않습니다.

   ---- 열쇠와 주소는 수현만 넣을 수 있습니다 ----
   날씨는 API 키가 필요하고(api/weather.ts 머리말), 음악·시간표는 어떤
   플레이리스트·어떤 달력인지를 사람이 정해야 합니다. 그래서 셋 다
   **비어 있는 상태가 기본**이고, 비어 있으면 창이 그 사실을 그대로
   말합니다. 있지도 않은 것을 그럴듯하게 채우지 않습니다.
   ================================================================== */

/* 사람이 붙여 넣는 주소들. 설정 화면이 아니라 **각 창 안**에 둡니다 —
   마이페이지·설정은 이 작업에서 건드리지 않기로 한 자리입니다. */
const LINKS = Object.assign(
  { spotify: '', calendar: '' },
  loadJSON('girin.links', {}),
);
function saveLinks() { saveJSON('girin.links', LINKS); }

/* ---- 진짜 날씨 ----
   /api/weather 는 이 저장소의 서버 함수입니다(api/weather.ts). 기상청은
   CORS 를 안 주고 키도 비밀이라 브라우저가 직접 못 부릅니다.

   못 받으면 **아무 일도 안 일어납니다.** WEATHER.real 이 null 로 남고,
   월드는 지금까지 쓰던 절차적 하늘을 그대로 씁니다. 못 받은 이유는
   WEATHER_WHY 에 담아 창에 그대로 적습니다 — "왜 안 되는지" 를 아는 것과
   모르는 것은 다릅니다.

   30분마다 다시 물어봅니다. 단기예보는 세 시간에 한 번 발표되므로 더
   자주 물어도 같은 답이고, 하루 10,000회를 나눠 써야 합니다. */
let WEATHER_WHY = '';
async function pullWeather() {
  try {
    const r = await fetch('/api/weather', { cache: 'no-store' });
    if (!r.ok) { WEATHER_WHY = '날씨 서버가 ' + r.status + ' 로 답했어요.'; return; }
    const d = await r.json();
    if (!d.configured) { WEATHER_WHY = '서버에 기상청 키가 아직 없어요.'; return; }
    if (!d.ok) { WEATHER_WHY = '기상청 응답: ' + (d.reason || '알 수 없음'); return; }
    WEATHER_WHY = '';
    WEATHER.real = { pty: d.pty, sky: d.sky, tempC: d.tempC, pop: d.pop, at: d.baseAt };
    /* 하늘이 바뀌었으니 화면에 지금 뭐가 내리는지 다시 정합니다.
       PRECIP 는 kind 가 바뀌면 알아서 방울을 새로 만듭니다. */
    if (panelOpen && activePanelKey === 'weather') openPanel('weather');
  } catch {
    /* 정적 서버로 열었거나(이 경로가 없음) 오프라인입니다. 둘 다 정상입니다. */
    WEATHER_WHY = '날씨 서버에 못 닿았어요. 정적 서버로 연 경우에는 원래 없는 주소예요.';
  }
}
pullWeather();
setInterval(pullWeather, 30 * 60 * 1000);

/* ---- 스포티파이 ----
   oEmbed 를 안 부릅니다. 붙여 넣은 주소에서 종류와 id 만 뽑아 embed 주소를
   바로 만듭니다. 요청이 하나도 안 나가므로 CORS 도, 키도, 실패할 왕복도
   없습니다 — oEmbed 로 얻는 것은 제목뿐인데 그 값에 왕복 하나를 걸 이유가
   없습니다.
   받아 주는 꼴: https://open.spotify.com/playlist/ID · spotify:track:ID ·
   ?si=... 붙은 공유 링크. */
function spotifyEmbed(raw) {
  const s = String(raw || '').trim();
  if (!s) return null;
  let m = /^spotify:(track|album|playlist|artist|show|episode):([A-Za-z0-9]+)/.exec(s);
  /* 호스트를 **맨 앞에** 못박습니다. 안 박으면
     https://evil.example/open.spotify.com/playlist/abc 같은 주소에서도 id 를
     뽑아 갑니다. 만들어지는 주소는 어차피 우리가 다시 짓지만, 잘못 붙여
     넣은 것을 말없이 "고쳐" 주면 사람은 자기가 맞게 넣은 줄 압니다. */
  if (!m) m = /^(?:https?:\/\/)?open\.spotify\.com\/(?:intl-[a-z-]+\/)?(track|album|playlist|artist|show|episode)\/([A-Za-z0-9]+)/.exec(s);
  if (!m) return null;
  return 'https://open.spotify.com/embed/' + m[1] + '/' + m[2];
}

/* 새 탭으로 열 주소. embed 주소에서 `/embed` 만 뺍니다 — spotifyEmbed 가
   이미 종류와 id 만 뽑아 우리 손으로 다시 지은 주소라, 여기 오는 것은
   언제나 https://open.spotify.com/… 입니다. javascript: 같은 것은 그
   앞에서 이미 null 이 되어 여기까지 못 옵니다. 이 갈림길이 없으면
   window.open 에 사람이 붙여 넣은 글자가 그대로 들어갑니다. */
function spotifyLink(raw) {
  const e = spotifyEmbed(raw);
  return e && e.replace('/embed/', '/');
}

/* ---- 구글 캘린더 ----
   "웹에 공개" 로 만든 달력만 embed 로 열립니다. 비공개 달력은 로그인
   화면이 뜨는데, iframe 안에서는 구글이 로그인을 막으므로 빈 칸이 됩니다.
   그래서 주소를 받을 때 그 조건을 화면에 적어 둡니다.
   붙여 넣는 것은 캘린더 ID(xxx@group.calendar.google.com) 또는 구글이
   주는 embed 주소 통째로 — 둘 다 받습니다. */
function calendarEmbed(raw) {
  const s = String(raw || '').trim();
  if (!s) return null;
  if (/^https:\/\/calendar\.google\.com\/calendar\/embed\?/.test(s)) return s;
  /* <iframe src="..."> 를 통째로 붙여 넣는 사람이 많아서 그것도 받습니다 */
  const inFrame = /src="(https:\/\/calendar\.google\.com\/calendar\/embed\?[^"]+)"/.exec(s);
  if (inFrame) return inFrame[1].replace(/&amp;/g, '&');
  /* **"공유 가능한 링크" 도 받습니다.**
     구글 캘린더 설정의 "공유 가능한 내 캘린더 링크" 는
       https://calendar.google.com/calendar/u/0?cid=<base64>
     꼴이고, cid 는 캘린더 ID 를 base64 로 감싼 것입니다. 사람들이 가장
     쉽게 찾는 링크가 이것인데 여태 통째로 거절당했습니다 — 형식이 틀린
     것이 아니라 **우리가 못 읽은 것**이라, 풀어서 받습니다.

     다만 이 링크는 "내 캘린더에 추가" 용이라, 그 달력이 비공개면 풀어도
     iframe 은 여전히 빈 칸입니다. 그 경우는 아래 안내 문구가 맡습니다 —
     주소를 못 읽는 것과 달력이 비공개인 것은 다른 문제이고, 둘을 같은
     오류로 뭉뚱그리면 사람이 주소만 계속 바꿔 넣게 됩니다. */
  const cid = /[?&]cid=([^&#\s]+)/.exec(s);
  if (cid) {
    try {
      /* base64url 로 오는 경우가 있어 -_ 를 +/ 로 되돌리고 padding 을 채웁니다 */
      const b = cid[1].replace(/-/g, '+').replace(/_/g, '/');
      const id = atob(b + '='.repeat((4 - b.length % 4) % 4));
      if (/^[\w.#+-]+@[\w.-]+$/.test(id))
        return 'https://calendar.google.com/calendar/embed?ctz=Asia%2FSeoul&mode=AGENDA&src='
          + encodeURIComponent(id);
    } catch { /* base64 가 아니면 아래 규칙으로 흘려보냅니다 */ }
  }
  /* 캘린더 ID 에는 # 이 들어갑니다 — 구글이 주는 공휴일 달력이
     ko.south_korea#holiday@group.v.calendar.google.com 꼴입니다.
     처음에 # 을 빼고 짰다가 그 달력이 통째로 거절됐습니다. */
  if (!/^[\w.#+-]+@[\w.-]+$/.test(s)) return null;
  return 'https://calendar.google.com/calendar/embed?ctz=Asia%2FSeoul&mode=AGENDA&src='
    + encodeURIComponent(s);
}

/* 창 안에 끼우는 바깥 화면 한 칸.

   **안 뜨는 것을 안 뜬다고 말하는 것**이 이 함수의 전부입니다. iframe 은
   교차 출처라 안에서 무슨 일이 났는지 알 수 없고, 차단당해도 onload 가
   그냥 뜨는 경우가 있습니다. 그래서 시간을 재고, 시간 안에 아무 일도 안
   일어나면 "지금은 못 불러옵니다" 로 바꿉니다. 흰 칸을 그냥 두면 사람은
   자기 인터넷을 의심하며 기다립니다. */
function embedHtml(src, label) {
  /* 인터넷이 꺼져 있는 줄 아는 경우에는 아예 안 만듭니다. 만들어 봐야
     6초 기다렸다 "못 불러왔어요" 가 되고, 그 사이 브라우저가 자기 오류
     페이지를 창 안에 띄웁니다.
     navigator.onLine 은 "랜선이 꽂혀 있나" 수준이라 false 일 때만 믿습니다 —
     true 인데 못 닿는 경우는 아래 watchEmbeds 가 시간으로 잡습니다. */
  if (navigator.onLine === false) {
    return `<div class="embed dead"><p class="embed-wait bad">인터넷이 꺼져 있어요.
      연결되면 다시 열어 주세요.</p></div>
      <p class="hint">주소: ${esc(src)}</p>`;
  }
  /* sandbox 를 안 겁니다. 두 가지 이유입니다.
     (1) 주소는 사람이 붙여 넣은 문자열이 아니라 **우리가 만든 것**입니다.
         spotifyEmbed·calendarEmbed 는 종류와 id 만 뽑아 주소를 다시 짓거나,
         calendar.google.com/calendar/embed 로 시작하는지 확인합니다. 그래서
         여기 들어오는 src 는 open.spotify.com 아니면 calendar.google.com
         둘 중 하나입니다 — 임의의 사이트를 띄우는 창구가 아닙니다.
     (2) sandbox 를 걸면 저장소 접근이 막혀서 두 서비스가 자기 안에서
         SecurityError 를 냅니다. 스포티파이는 로그인 상태를 저장소로
         확인하므로, 막으면 전곡 재생이 30초 미리듣기로 떨어집니다.
     대신 allow 는 필요한 것만 켭니다. */
  return `<div class="embed" data-embed="${esc(src)}">
    <iframe title="${esc(label)}" src="${esc(src)}" loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
      allow="autoplay; clipboard-write; encrypted-media; picture-in-picture"></iframe>
    <p class="embed-wait">불러오는 중…</p>
  </div>
  <p class="hint"><a href="${esc(src)}" target="_blank" rel="noopener">새 탭에서 열기</a></p>`;
}

/* 창을 그린 뒤에 부릅니다. 뜨면 안내를 지우고, 안 뜨면 **iframe 을 치우고**
   정직하게 씁니다.

   왜 load 이벤트만으로는 안 되나 — 실제로 겪은 일입니다
   ------------------------------------------------------
   처음에는 iframe.onload 로 성공을 판정했습니다. 그런데 주소에 못 닿으면
   크로미움이 그 자리에 **자기 오류 페이지**를 넣고, 그것도 load 로 셉니다.
   그래서 "다 떴다" 며 안내를 지우고 회색 빈 칸만 남았습니다 — 정확히
   하지 말자고 한 그 화면입니다. 교차 출처라 안을 들여다볼 수도 없습니다.

   그래서 **따로 두드려 봅니다.** mode:'no-cors' 로 fetch 하면 내용은 못
   읽지만(opaque), 호스트에 닿았는지는 알 수 있습니다 — 닿으면 resolve,
   못 닿으면 reject 입니다. 이 컨테이너에서 실측: 막힌 호스트는 reject,
   같은 서버는 resolve. */
function watchEmbeds() {
  for (const box of panelBody.querySelectorAll('.embed')) {
    const frame = box.querySelector('iframe');
    const wait = box.querySelector('.embed-wait');
    if (!frame || !wait) continue;
    let done = false;
    const fail = (text) => {
      if (done) return;
      done = true;
      /* 빈 칸을 남기지 않으려고 치웁니다. 남겨 두면 글자 뒤에 회색 판이
         계속 서 있어서 "곧 뜰 것" 처럼 보입니다. */
      frame.remove();
      wait.textContent = text;
      wait.classList.add('bad');
      box.classList.add('dead');
    };
    const good = () => { if (!done) { done = true; wait.remove(); } };

    fetch(frame.src, { mode: 'no-cors', cache: 'no-store' })
      .then(() => { /* 호스트가 답했습니다 — load 를 기다립니다 */ })
      .catch(() => fail('지금은 못 불러왔어요. 인터넷이 막혀 있거나 이 주소가 차단돼 있어요. 아래 “새 탭에서 열기” 로는 열릴 수 있어요.'));

    frame.addEventListener('load', () => setTimeout(good, 250));
    frame.addEventListener('error', () => fail('지금은 못 불러왔어요. 새 탭에서 열어 보세요.'));
    /* 6초. 느린 회선에서 성급하게 실패라고 하지 않을 만큼이면서,
       사람이 빈 칸을 보고 있기에는 이미 긴 시간입니다. */
    setTimeout(() => fail('지금은 못 불러왔어요. 주소가 공개가 아니거나 응답이 없어요.'), 6000);
  }
}

/** 안내소 목록. **MINIGAMES 를 그대로 훑습니다** — 손으로 적어 두면
    게임을 하나 옮기거나 더할 때 여기만 옛 이야기를 하고, 이 저장소에서
    이미 두 번 그랬습니다. 표에 한 줄을 더하면 여기도 같이 늘어납니다.

    오늘 코인이 남았는지는 지급하는 쪽(RW.daily.games)에 직접 물어봅니다.
    따로 세면 그 둘이 또 어긋납니다. 액수도 상수를 그대로 씁니다 —
    실제로 여기 '5' 와 COIN_MINIGAME(10) 이 어긋나 있었습니다. */
function minigameRows() {
  const done = RW.daily.games || [];
  const seen = [];
  let html = '';
  for (const g of MINIGAMES) {
    if (!seen.includes(g.where)) {
      seen.push(g.where);
      if (html) html += '</div>';
      html += `<p class="hint" style="margin:16px 0 0;font-weight:700;color:var(--ink-2)">${esc(g.where)}</p><div class="rows">`;
    }
    const got = done.includes(g.panel);
    html += `<div class="row"><span>${esc(g.name)} <em>${esc(g.how)}</em></span>`
      + `<span class="val"${got ? ' style="color:var(--ink-3)"' : ''}>${got ? '오늘 받음' : COIN_MINIGAME + '코인'}</span>`
      /* 흩어 놓은 배치를 쓸 수 있게 만드는 것이 이 단추입니다. 이게 없으면
         "호수 옆에 있대" 를 듣고 지도를 다시 펴야 합니다. */
      + `<button class="act ghost" data-goto="${esc(g.panel)}" style="margin-left:10px;flex:none">바로 가기</button></div>`;
  }
  return html + (html ? '</div>' : '');
}

   반드시 destroy() 해야 Phaser 캔버스가 뒤에 남아 계속 돌지 않습니다.
   ================================================================== */
let animalRunnerInstance = null;
let animalRunnerRewarded = false;

function mountAnimalRunner(options) {
  /* 모듈이 아직 안 붙었으면(파일 열기로 연 경우) 조용히 비웁니다.
     여기서 던지면 창이 아예 안 열립니다. */
  if (typeof window.MOUNT_ANIMAL_RUNNER !== 'function') return null;
  return window.MOUNT_ANIMAL_RUNNER(options);
}

function animalRunnerIntroHtml() {
  return `<div style="padding:8px 0 4px">
    <p>장애물을 피하고 코인을 모으며 3분 동안 달려보세요.</p>
    <div class="rows">
      <div class="row"><span>제한 시간</span><span class="val">3분</span></div>
      <div class="row"><span>조작</span><span class="val">← → 이동 · Space 점프</span></div>
      <div class="row"><span>보상</span><span class="val">${COIN_MINIGAME}코인</span></div>
    </div>
    <div class="note" style="margin-top:14px">휴대폰에서는 화면 아래 ← · → · JUMP 단추로 합니다.</div>
    <button class="act" data-do="animal-runner-start" style="width:100%;margin-top:16px">게임 시작</button>
  </div>`;
}

function animalRunnerHtml() {
  return '<div id="animal-runner-mount" style="position:relative;width:min(100%,390px);min-height:260px;margin:0 auto;border-radius:16px;overflow:hidden;background:#dff2f0;touch-action:none"></div>';
}

/** 지금 쓰는 캐릭터를 게임에 넘깁니다 — 광장에서 걷던 동물이 그대로
    달려야 "내가 달린다" 가 됩니다. */
function runnerCharacter() {
  const species = speciesOf(ROOM.character);
  return { id: species.slug, name: ROOM.character, image: window.GIRIN_CHAR?.mine?.() || null };
}

function renderAnimalRunnerResult(result) {
  /* 코인은 판이 아니라 **하루**에 한 번입니다. gameReward 가 그 판정을
     들고 있으므로 여기서 또 세지 않습니다. */
  let got = 0;
  if (!animalRunnerRewarded) {
    animalRunnerRewarded = true;
    got = gameReward('동물 달리기 성공');
  }
  const reward = got ? `+${got}P` : '오늘 보상 완료';
  panelBody.innerHTML = `<div style="padding:24px 4px;text-align:center">
    <strong style="display:block;font-size:32px;line-height:1">RUN COMPLETE!</strong>
    <p style="margin:12px 0 18px;color:var(--ink-2)">3분 달리기를 완료했어요.</p>
    <div class="rows" style="text-align:left">
      <div class="row"><span>최종 점수</span><span class="val">${result.score}</span></div>
      <div class="row"><span>획득 코인</span><span class="val">${result.coins}</span></div>
      <div class="row"><span>장애물 충돌</span><span class="val">${result.hitCount}회</span></div>
      <div class="row"><span>최대 Combo</span><span class="val">${result.maxCombo}</span></div>
    </div>
    <div class="note" style="margin-top:16px">보상: <b>${reward}</b></div>
    <button class="act" data-do="animal-runner-restart" style="width:100%;margin-top:16px">다시 하기</button>
  </div>`;
}

function startAnimalRunner() {
  animalRunnerInstance?.destroy();
  animalRunnerInstance = null;
  animalRunnerRewarded = false;
  panelBody.innerHTML = animalRunnerHtml();
  const container = panelBody.querySelector('#animal-runner-mount');
  if (!container) return;
  animalRunnerInstance = mountAnimalRunner({
    container,
    character: runnerCharacter(),
    onGameComplete: (result) => {
      animalRunnerInstance?.destroy();
      animalRunnerInstance = null;
      renderAnimalRunnerResult(result);
    },
  });
  if (!animalRunnerInstance) container.innerHTML = '<p class="hint" style="padding:24px">게임을 못 불러왔어요. 로컬 서버(npm run dev)로 다시 열어 주세요.</p>';
}

    label: '학교 이메일', hint: 'ac.kr 로 끝나는 학교 메일', max: 60,
    type: 'email',
    validate: (v) => /^[^@\s]+@[^@\s]+\.ac\.kr$/i.test(v.trim()),
    apply: (v) => {
      /* 도메인에서 학교를 읽습니다. 실제 인증은 서버가 메일을 보내야
         가능하므로, 지금은 입력을 받아 두기만 합니다. */
      const host = v.trim().split('@')[1].toLowerCase();
      ROOM.schoolDomain = host;
      ROOM.school = SCHOOL_BY_DOMAIN[host] || host.replace(/\.ac\.kr$/, '') + ' (미확인)';
      const d = new Date();
      ROOM.schoolVerifiedAt = d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월';
    },
    note: '인증 메일을 보내는 것은 서버가 붙은 뒤예요. 지금은 적어 두기만 합니다.',
  },
};

/* 도메인 → 학교. 늘려야 하는 표지만, 없으면 도메인을 그대로 보여 주고
   "(미확인)" 을 붙입니다 — 없는 학교를 지어내지 않습니다. */
/* SCHOOL_BY_DOMAIN 은 학교 색 쪽에서 SCHOOLS 로부터 만듭니다. 같은 열 곳을
   두 번 적어 두면 한쪽만 늘어납니다 — 색이 있는 쪽이 원본입니다. */

function openEdit(key, row) {
  const spec = EDITS[key];
  if (!spec || !row) return;
  const box = document.createElement('div');
  box.className = 'edit';
  box.innerHTML = '<input type="' + (spec.type || 'text') + '" maxlength="' + spec.max
    + '" placeholder="' + spec.hint + '" aria-label="' + spec.label + '">'
    + '<button class="act" data-do="edit-save">저장</button>'
    + '<button class="act ghost" data-do="edit-cancel">취소</button>';
  row.replaceWith(box);
  const input = box.querySelector('input');
  input.value = key === 'nickname' ? ROOM.nickname : '';
  if (spec.note) {
    const h = document.createElement('p');
    h.className = 'hint'; h.textContent = spec.note;
    box.after(h);
  }
  input.focus(); input.select();
  box.dataset.key = key;
  const save = box.querySelector('[data-do="edit-save"]');
  /* 왜 못 누르는지 그 자리에서 말합니다. 비속어로 막힌 경우 버튼만
     흐려지면 사람은 글자 수를 세다 포기합니다. 빈 칸일 때는 아직
     아무것도 안 쓴 것이니 조용히 둡니다. */
  let why = null;
  const sync = () => {
    const bad = spec.error ? spec.error(input.value) : '';
    save.disabled = spec.error ? bad !== '' : !spec.validate(input.value);
    save.style.opacity = save.disabled ? .45 : 1;
    const show = input.value.trim() ? bad : '';
    if (show && !why) {
      why = document.createElement('p');
      why.className = 'hint'; why.style.color = 'var(--bad)';
      why.setAttribute('role', 'alert');
      box.after(why);
    }
    if (why) { why.textContent = show; why.hidden = !show; }
  };
  input.addEventListener('input', sync);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !save.disabled) save.click();
    if (e.key === 'Escape') box.querySelector('[data-do="edit-cancel"]').click();
  });
  sync();
}

/* 바깥 서비스 주소를 붙여 넣는 줄. EDITS 를 안 쓰는 이유는 저장 뒤 흐름이
   다르기 때문입니다 — EDITS 의 저장은 ROOM 을 고치고 **마이페이지**를 다시
   엽니다. 여기는 LINKS 를 고치고 지금 보던 창을 다시 엽니다. */
const LINK_SPEC = {
  spotify: {
    label: '스포티파이 주소', hint: 'https://open.spotify.com/playlist/…',
    parse: spotifyEmbed, panel: 'radio',
    bad: '스포티파이 링크가 아니에요. 앱에서 공유 → 링크 복사로 받은 주소를 넣어 주세요.',
  },
  calendar: {
    label: '구글 캘린더', hint: '캘린더 ID 또는 삽입 주소',
    parse: calendarEmbed, panel: 'calendar',
    bad: '캘린더 ID(…@group.calendar.google.com) · embed 주소 · "공유 가능한 링크"(…?cid=…) 셋 다 됩니다. 셋 다 아니면 주소를 다시 확인해 주세요.',
  },
};
/* back — 저장한 뒤 돌아갈 창. 안 주면 LINK_SPEC 이 정한 창(라디오·노트북)
   으로 갑니다. 마이페이지에서 같은 줄을 열었을 때는 마이페이지로 돌아와야
   합니다 — 설정을 만지다가 갑자기 본관 강단에 서 있으면 안 됩니다. */
function openLinkEdit(key, row, back) {
  const spec = LINK_SPEC[key];
  if (!spec || !row) return;
  const box = document.createElement('div');
  box.className = 'edit';
  box.innerHTML = '<input type="text" maxlength="400" placeholder="' + spec.hint
    + '" aria-label="' + spec.label + '">'
    + '<button class="act" data-do="link-save">저장</button>'
    + '<button class="act ghost" data-do="link-clear">지우기</button>';
  row.replaceWith(box);
  box.dataset.key = key;
  if (back) box.dataset.back = back;
  const input = box.querySelector('input');
  input.value = LINKS[key] || '';
  input.focus(); input.select();
  const why = document.createElement('p');
  why.className = 'hint'; why.style.color = 'var(--bad)';
  why.setAttribute('role', 'alert'); why.hidden = true;
  box.after(why);
  const save = box.querySelector('[data-do="link-save"]');
  const sync = () => {
    const v = input.value.trim();
    const okNow = !v || !!spec.parse(v);
    save.disabled = !okNow;
    save.style.opacity = okNow ? 1 : .45;
    why.textContent = okNow ? '' : spec.bad;
    why.hidden = okNow;
  };
  input.addEventListener('input', sync);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !save.disabled) save.click();
    if (e.key === 'Escape') openPanel(spec.panel);
  });
  sync();
}

/* 음량 손잡이 — 창을 다시 그릴 때마다 새 element 라 위임으로 받습니다.
   input 은 끄는 동안 계속 오므로 그 자리에서 소리가 따라옵니다. 저장까지
   여기서 하는 것은, 손을 뗀 뒤에 저장하면 창을 닫고 나가는 사람의 값이
   안 남기 때문입니다(localStorage 는 싸고, 이 창은 자주 안 엽니다). */
panelBody.addEventListener('input', (e) => {
  const sl = e.target.closest('#musvol');
  if (!sl) return;
  MUSICCFG.vol = Math.max(0, Math.min(100, Math.round(Number(sl.value) || 0)));
  saveMusicCfg();
  syncMusicVolume();
  const out = panelBody.querySelector('#musvol-val');
  if (out) out.textContent = MUSICCFG.vol + '%';
});

/* 창 안의 조작 — 위임 하나로 받습니다 */
panelBody.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const tap = e.target.closest('.row.tap');
  if (!tap) return;
  e.preventDefault();
  /* 같은 .row.tap 이라도 바깥 서비스 주소 줄(스포티파이·캘린더)은 다른
     창구를 씁니다. 안 갈라 놓으면 EDITS[undefined] 로 떨어져서, 마우스로는
     열리는데 Enter 로는 아무 일도 안 일어나는 줄이 됩니다. */
  if (tap.dataset.link) openLinkEdit(tap.dataset.link, tap, tap.dataset.back);
  else openEdit(tap.dataset.edit, tap);
});
/* 미니게임 버튼. 기존 chip 핸들러보다 **먼저** 등록해야 목 쌓기의
   떨구기가 다른 핸들러에 먹히지 않습니다. */

panelBody.addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (chip) {
    const group = chip.closest('.chips').dataset.group;
    [...chip.parentNode.children].forEach((c) => c.setAttribute('aria-pressed', 'false'));
    chip.setAttribute('aria-pressed', 'true');
    ROOM[group] = chip.dataset.v; saveRoom();
    /* 값이 바뀌면 그 자리에서 듣습니다. 저장만 하고 다음 켤 때 듣게
       하면, 눌러도 아무 일이 없는 설정이 됩니다. */
    if (group === 'sfxOn') SFX.muted = ROOM.sfxOn !== 'on';
    /* 고른 그 자리에서 바뀝니다. 저장만 하고 다음 장소에서 바뀌게 하면
       무엇을 고른 건지 귀로 확인할 수 없습니다. */
    if (group === 'bgmTrack') setMusic(zoneId);
    if (group === 'bgm') { SOUND.bgm = ROOM.bgm === 'on'; saveSound(); syncSound(); }
    if (group === 'camPeek') syncCamPeek();
    if (group === 'chatOn') syncChat();
    if (group === 'sayOn' && ROOM.sayOn === 'off') { sayEl.classList.remove('on'); clearTimeout(SAY.timer); }
    /* 학교를 고르면 과잠·강조색이 그 자리에서 바뀝니다. 인증 여부는
       건드리지 않습니다 — 고르는 것과 인증은 다른 일입니다. */
    if (group === 'school') applySchoolColor();
    return;
  }

  /* ---- 상점 ----
     사는 것만 서버 왕복이라 async 로 빠집니다. 나머지 셋(입기·벗기·색)은
     잔액을 안 건드리므로 그 자리에서 화면을 바꾸고 서버에는 뒤따라 올립니다. */
  const buy = e.target.closest('[data-buy]');
  if (buy) { buyItem(buy.dataset.buy, buy); return; }
  const on = e.target.closest('[data-on]');
  if (on) { equip(on.dataset.on); saveRoom(); pushLoadout(); reopenShop(); return; }
  const off = e.target.closest('[data-off]');
  if (off) { unequip(off.dataset.off); saveRoom(); pushLoadout(); reopenShop(); return; }
  const sw = e.target.closest('[data-tint]');
  if (sw) { setTint(sw.dataset.tint, sw.dataset.hex); saveRoom(); pushLoadout(); reopenShop(); return; }

  /* ---- 방 꾸미기 ---- */
  /* 바깥 서비스 주소 줄이 먼저입니다 — 이것도 .row.tap 이라, 뒤에 두면
     아래 openEdit 이 먼저 잡아 EDITS[undefined] 로 조용히 아무 일도 안 합니다. */
  const link = e.target.closest('[data-link]');
  if (link) return openLinkEdit(link.dataset.link, link, link.dataset.back);
  const tap = e.target.closest('.row.tap');
  if (tap) return openEdit(tap.dataset.edit, tap);
  const act = e.target.closest('[data-do]');
  if (!act) return;
  const what = act.dataset.do;
  if (what === 'link-save' || what === 'link-clear') {
    const box = act.closest('.edit');
    const key = box.dataset.key;
    const spec = LINK_SPEC[key];
    LINKS[key] = what === 'link-clear' ? '' : box.querySelector('input').value.trim();
    saveLinks();
    /* 탭이 있는 창으로 돌아갈 때는 보던 탭을 들고 갑니다. 안 그러면
       설정에서 주소를 고쳤는데 "내 정보" 가 열립니다. */
    const back = box.dataset.back;
    if (back) {
      const tabs = [...panelTabs.querySelectorAll('button')];
      const at = tabs.findIndex((b) => b.getAttribute('aria-selected') === 'true');
      openPanel(back, at < 0 ? undefined : at);
    } else openPanel(spec.panel);
    return;
  }
  /* 스포티파이를 새 탭으로. 창 안에 iframe 으로 띄우지 않는 이유는 본관
     강단(radio)과 달리 여기는 "내 플레이리스트를 내 플레이어에서 튼다"
     이기 때문입니다. noopener 는 새 탭이 이 창을 되잡지 못하게 합니다. */
  if (what === 'spotify-open') {
    const url = spotifyLink(LINKS.spotify);
    if (url) window.open(url, '_blank', 'noopener,noreferrer');
    return;
  }
  if (what === 'edit-save' || what === 'edit-cancel') {
    const box = act.closest('.edit');
    if (what === 'edit-save') {
      const spec = EDITS[box.dataset.key];
      const v = box.querySelector('input').value;
      if (!spec.validate(v)) return;
      spec.apply(v); saveRoom();
    }
    /* 값이 여러 탭에 걸쳐 있으므로 탭 전체를 다시 그립니다 */
    const tabs = panelTabs.querySelectorAll('button');
    const active = [...tabs].findIndex((b) => b.getAttribute('aria-selected') === 'true');
    openPanel('settings');
    if (active > 0) panelTabs.querySelectorAll('button')[active].click();
    return;
  }
  if (what === 'close') closePanel();
  else if (what === 'calibrate') {
    /* 옛날에는 사람을 첫 의자로 옮겨 앉혔습니다 — 기준은 앉아야 잡는
       것이 아니라 카메라만 있으면 그 자리에서 잡는 것입니다. */
    closePanel();
    startCalibrate();
  } else if (what === 'new-session') { newSession();
  } else if (what === 'open-retro') {
    /* 세션이 도는 중이면 "지난 세션" 탭으로 엽니다. 이번 세션 숫자를
       도중에 들여다보게 하지 않는다는 원칙은 그대로 두고, 지난 기록만
       열어 줍니다. */
    openPanel('retro', SESSION.ended ? 0 : 1);
  }
  /* 초대 코드 복사·재발급 단추는 초대 탭과 같이 뺐습니다. 재발급 쪽은
     이미 `openPanel('mailbox')` 를 부르고 있었는데 그런 창이 없어서,
     눌렀으면 창이 닫히기만 했을 것입니다 — 아무도 안 눌러 본 자리입니다. */
});

/* ==================================================================
   장소별 앰비언트 — 병합에서 서버저장 판본을 살렸습니다

   이 판본의 enterZone 에는 소리가 전혀 없었습니다. 공간마다 백색소음이
   다른 것은 "공간이 곧 모드" 라는 이 제품의 뼈대이고, 코인에서 공간별
   차등(본관3/도서관2)을 뺀 이유가 바로 "공간을 다르게 느끼게 하는 일은
   소리·NPC·분위기가 맡는다" 였습니다. 소리를 빼면 공간이 전부 같아집니다.

   효과음(SFX)과 달리 여기는 지속음이라 오디오 그래프를 따로 둡니다.
   음소거는 SOUND.bgm 이 맡고, 효과음 음소거는 SFX.muted 가 맡습니다.
   ================================================================== */
const SOUND = Object.assign({ bgm: true, sfx: true }, loadJSON('girin.sound', {}));
function saveSound() { saveJSON('girin.sound', { bgm: SOUND.bgm, sfx: SOUND.sfx }); }

/* ---- 음악만의 설정 ----
   SOUND 에 얹지 않고 열쇠를 따로 뒀습니다. SOUND 는 "소리를 켤 것인가"
   이고 여기는 "음악을 얼마나 크게 깔 것인가" 라, 둘이 한 덩어리면
   음악을 0 으로 내렸을 때 공간의 소음까지 같이 사라집니다. 앰비언트는
   코인 설계에서 공간 차등을 뺀 자리를 메우기로 한 소리이므로, 음악
   손잡이가 그것까지 끌고 내려가면 안 됩니다.

   vol 은 0~100 입니다. 소수 0.25 를 그대로 저장하지 않는 것은, 나중에
   최대값(MUSIC_MAX)을 다시 맞추면 저장된 값의 뜻이 조용히 바뀌기
   때문입니다. 퍼센트로 두면 사람이 고른 것은 "절반쯤" 으로 남습니다. */
const MUSICCFG = Object.assign({ vol: 55 }, loadJSON('girin.music', {}));
function saveMusicCfg() { saveJSON('girin.music', { vol: MUSICCFG.vol }); }
/* 100% 일 때의 실제 이득. 음원은 모두 -20.0 LUFS 로 맞춰 두었고
   앰비언트는 bgmGain 에서 0.07~0.22 로 깔립니다. 0.45 를 꼭대기로 두면
   기본값 55% 가 0.25 근처가 되는데, 그 자리가 "도서관 소음 위에 음악이
   얹혀 있다" 로 들리는 지점입니다. 더 올리면 음악이 방을 덮습니다. */
const MUSIC_MAX = 0.45;
const musicGainValue = () => MUSIC_MAX * Math.max(0, Math.min(100, MUSICCFG.vol)) / 100;

const AUDIO = { ctx: null, master: null, bgmGain: null, musicGain: null, amb: null, ambId: null, noise: null };

/** 분홍잡음 한 벌. 흰잡음은 이 크기에서 쉬익 소리가 세서 귀가 아픕니다. */
function noiseBuffer(ctx) {
  if (AUDIO.noise) return AUDIO.noise;
  const len = ctx.sampleRate * 4;                 // 4초를 이어 붙여 씁니다
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  /* Voss-McCartney 를 줄인 판. 옥타브마다 값을 드물게 바꿔 더하면
     저음이 두터운 분홍잡음이 납니다. */
  let b0 = 0, b1 = 0, b2 = 0;
  for (let i = 0; i < len; i++) {
    const w = Math.random() * 2 - 1;
    b0 = 0.99765 * b0 + w * 0.0990460;
    b1 = 0.96300 * b1 + w * 0.2965164;
    b2 = 0.57000 * b2 + w * 1.0526913;
    d[i] = (b0 + b1 + b2 + w * 0.1848) * 0.16;
  }
  AUDIO.noise = buf;
  return buf;
}

function audioCtx() {
  if (AUDIO.ctx) return AUDIO.ctx;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  const ctx = new AC();
  AUDIO.ctx = ctx;
  AUDIO.master = ctx.createGain();
  AUDIO.master.gain.value = 0.5;
  AUDIO.master.connect(ctx.destination);
  AUDIO.bgmGain = ctx.createGain();
  AUDIO.bgmGain.gain.value = 0;
  AUDIO.bgmGain.connect(AUDIO.master);
  /* 음악만 한 단을 더 지납니다. 앰비언트는 bgmGain 에 바로 물리므로
     이 손잡이를 0 으로 내려도 공간의 소음은 그대로 남습니다 — 음악은
     "그 위에 얹는 것" 이라는 원칙이 그래프 모양으로 적혀 있는 셈입니다. */
  AUDIO.musicGain = ctx.createGain();
  AUDIO.musicGain.gain.value = musicGainValue();
  AUDIO.musicGain.connect(AUDIO.bgmGain);
  return ctx;
}

/* 같은 칸의 다른 옷을 입으면 앞엣것은 자동으로 벗겨집니다 —
   상의를 두 벌 겹쳐 입을 일이 없습니다. */
function equip(id) {
  const it = SHOP_BY_ID[id];
  if (!it || !owns(id)) return;
  /* 가구는 입는 것이 아닙니다. 이 갈림길이 없으면 ROOM.worn.furn 이
     생기고 종이인형이 옷 대신 옷장을 겹쳐 그리려 듭니다. */
  if (isFurniture(it)) return;
  if (it.cat === 'egg') ROOM.character = EGG_CHARACTER[id] || ROOM.character;
  else ROOM.worn[it.cat] = id;
  jacketCanvas = null; dressedCache = null;                   // 월드 캐릭터를 다시 굽습니다
  drawCamAvatar();                                            // 얼굴 끈 사람의 PIP 도 갈아입습니다
}
function unequip(id) {
  const it = SHOP_BY_ID[id];
  if (!it || it.cat === 'egg' || isFurniture(it)) return;   // 알은 벗을 수 없고 가구는 입지도 않습니다
  if (ROOM.worn[it.cat] === id) delete ROOM.worn[it.cat];
  jacketCanvas = null; dressedCache = null;
}

/* 고른 색은 아이템마다 남습니다 — 벗었다 다시 입어도 그 색 그대로입니다.
   빈 값(원래 색)은 저장하지 않고 지웁니다. 저장소에 '없음'을 남기면
   나중에 팔레트가 바뀌었을 때 지워야 할 것과 구분이 안 됩니다. */
function setTint(id, hex) {
  const it = SHOP_BY_ID[id];
  if (!tintable(it)) return;
  if (hex && TINT_BY_HEX[hex]) ROOM.tint[id] = hex;
  else delete ROOM.tint[id];
  dressedCache = null;
  drawCamAvatar();
}

/* ---- 장소별 앰비언트 ----
   같은 잡음을 필터로 다르게 깎습니다. 도서관은 위를 잘라 조용하게,
   본관은 아주 낮은 곳만 남겨 웅웅거리게, 기숙사는 그보다 더 낮고
   따뜻하게. 광장만 잡음 대신 화음을 얹어 밝게 둡니다. */
const AMBIENCE = {
  library: { cut: 900,  q: 0.6, gain: 0.16, tone: null },
  mainhall:{ cut: 220,  q: 1.2, gain: 0.22, tone: [72, 108] },
  dorm:    { cut: 160,  q: 1.0, gain: 0.20, tone: [64, 96] },
  union:   { cut: 1400, q: 0.5, gain: 0.12, tone: [196, 294] },
  campus:  { cut: 2600, q: 0.4, gain: 0.07, tone: [294, 392, 494] },
  /* 관문 넷이 웅웅거리는 방. 학생회관보다 낮고 두껍게 깝니다. */
  arcade:  { cut: 1000, q: 0.7, gain: 0.15, tone: [147, 220] },
};

function syncSound() {
  if (!AUDIO.ctx) return;
  const g = AUDIO.bgmGain.gain, t = AUDIO.ctx.currentTime;
  g.cancelScheduledValues(t);
  g.setValueAtTime(g.value, t);
  g.linearRampToValueAtTime(SOUND.bgm ? 1 : 0, t + 0.25);
}

function stopAmbience() {
  if (!AUDIO.amb) return;
  const ctx = AUDIO.ctx, t = ctx.currentTime;
  const dying = AUDIO.amb;
  dying.gain.gain.cancelScheduledValues(t);
  dying.gain.gain.setValueAtTime(dying.gain.gain.value, t);
  dying.gain.gain.linearRampToValueAtTime(0, t + 0.5);
  setTimeout(() => dying.nodes.forEach((n) => { try { n.stop(); } catch { /* 이미 멈춤 */ } }), 700);
  AUDIO.amb = null; AUDIO.ambId = null;
}

/* ================== 배경 음악 — 실제 음원으로 교체 ==================
   여기 있던 것은 오실레이터로 그 자리에서 찍어 내던 곡 넷이었습니다.
   파일이 0바이트이고 라이선스가 아예 없다는 것이 그 선택의 전부였는데,
   대신 얻은 소리가 "여섯 방에서 도는 네 개의 아르페지오" 였습니다.
   30분 앉아 있으면 방이 아니라 그 패턴이 기억에 남습니다. 그래서 실제
   음원으로 바꿉니다. 곡은 넷에서 **열**로 늘었고, 자리도 여섯에서
   일곱(동아리 상점 포함)으로 늘었습니다.

   ---- 라이선스: CC0 만 씁니다 ----
   열 곡 전부 freesound.org 에서 받은 **CC0 1.0**(퍼블릭 도메인 기증)
   입니다. 곡마다 원본 페이지를 열어 "Creative Commons 0" 이라고 적힌
   것만 골랐고, 제목·작가·주소·확인 날짜는 docs/audio/CREDITS.md 에
   한 줄씩 적어 두었습니다. 표기 의무가 없는 라이선스지만 적습니다 —
   나중에 "이건 어디서 났어요" 를 물었을 때 대답이 한 줄로 끝나야 합니다.

   확인하고 **뺀** 것들 —
     · Pixabay — 자체 라이선스라 CC0 이 아닙니다("standalone 재배포 금지"
       조항이 있어 CC0·CC-BY·PD 어느 쪽도 아닙니다).
     · FreePD — 17년 만에 문을 닫았습니다. 새로 받을 곳도 다시 확인할
       곳도 없어서 "예전엔 PD 였다" 말고는 댈 근거가 없습니다.
     · Incompetech(CC-BY 4.0) · Indie Meditations(CC-BY 4.0) — 쓸 수는
       있지만 저작물이 울리는 화면에서 표기가 닿아야 합니다. 그 자리를
       만들 계획이 없으므로 CC0 만 씁니다.
     · freesound 611050 "Electric Dream Ambient" — 곡은 맞는데 원본
       페이지가 **Attribution 4.0** 이었습니다. CC0 만 모아 놨다는 목록에
       섞여 있던 것이라, 목록을 믿지 말고 한 곡씩 열어 봐야 한다는 증거로
       CREDITS.md 에 남겼습니다.
     · freesound 652432 — 페이지가 404 입니다. 파일은 손에 있지만
       라이선스를 확인할 곳이 사라졌으므로 안 씁니다.

   ---- 파일 ----
   모노 Ogg Vorbis(q1 · 44.1kHz). 열 곡 합쳐 432.7초 · 2,544,399 바이트
   (2.4MiB), 평균 47.0kbps 입니다. 스테레오를 버린 이유는 이 음악이
   앰비언트 **아래에서** 깔리는 소리라 좌우 폭이 들릴 자리가 아니고,
   모노면 같은 품질에서 용량이 절반이기 때문입니다.

   음량은 열 곡 모두 **-20.0 LUFS** 로 맞췄습니다. 원본은 -17.1 에서
   -30.5 까지 13.4dB 이 벌어져 있어서, 그대로 얹으면 곡을 바꿀 때마다
   사람이 음량을 다시 만져야 합니다. 봉우리는 -2dBFS 리미터로만 눌렀고
   (통째로 줄이면 뮤직박스처럼 튀는 음이 있는 곡만 3dB 작게 들립니다),
   결과는 -20.0 ~ -20.4 LUFS · 피크 -1.5 ~ -8.7 dBFS 입니다.

   ---- 이음매 ----
   곡마다 스펙트럼 자기상관으로 되풀이 지점을 찾아 그 길이로 자르고,
   꼬리 0.4~2.0초를 머리 위에 겹쳐 접었습니다(예: play 는 50.85초에서
   상관 0.997, calm 은 87.96초에서 0.966). 코드로 만들던 음악은 원리상
   끊김이 없었으므로, 파일로 바꾸면서 1분마다 딸깍거리면 그건 **없던
   문제를 만든 것**입니다.

   ---- 앰비언트는 그대로 둡니다 ----
   앰비언트는 "그 공간의 소음"이고 음악은 그 위에 얹는 것이라, 둘이 같이
   있어야 도서관이 도서관으로 들립니다. 음악만 musicGain 을 한 단 더
   지나게 해서, 사람이 음량을 0 으로 내리거나 곡을 끔으로 두어도 공간의
   소음은 남습니다.

   ---- 아티팩트에서는 조용합니다 ----
   build-artifact.mjs 는 png·서체·옆 스크립트만 파일 안에 박고 오디오는
   안 박습니다. 아티팩트는 바깥 요청을 전부 막으므로 거기서는 fetch 가
   실패하고 음악이 빠집니다(앰비언트는 코드라 그대로 울립니다). 일부러
   그대로 둡니다 — 넣으면 base64 4/3 배가 붙어 5.1MB 짜리 단일 HTML 이
   8MB 를 넘고, 아티팩트의 존재 이유가 "링크 하나로 열리는 것" 이라
   그 값을 배경음악에 쓰지 않습니다. 실패는 조용히 삼키지 말고 왜
   안 나오는지를 MUSIC_WHY 에 담아 설정 화면이 그대로 말합니다. */
const MUSIC_DIR = 'assets/audio/';

/* 곡 표.

   id 는 저장된 값입니다 — 예전 판본에서 곡을 골라 둔 사람의
   girin.room.bgmTrack 에 calm · bright · warm · night 가 들어 있어서,
   그 넷은 이름을 그대로 지켰습니다. 저장소를 건드리는 이사 코드 없이
   그 사람의 선택이 새 파일을 가리킵니다. 나머지 여섯이 이번에 늘어난
   자리입니다.

   sec 는 실제 파일 길이입니다. 화면에 쓰지는 않지만, 파일만 갈아 끼우고
   표를 안 고친 경우를 scripts/openworld-music.test.mjs 가 이 값으로
   잡습니다. by 는 CREDITS.md 와 짝이 맞는지 보는 열쇠입니다. */
const MUSIC = {
  calm:   { name: '조용한 오후',  file: 'calm.ogg',   sec: 87.96, by: 'LightMister' },
  bright: { name: '볕 드는 마당', file: 'bright.ogg', sec: 66.80, by: 'SondreDrakensson' },
  warm:   { name: '저녁 방',      file: 'warm.ogg',   sec: 54.85, by: 'Erokia' },
  night:  { name: '늦은 밤',      file: 'night.ogg',  sec: 39.75, by: 'szegvari' },
  errand: { name: '볼일 보는 길', file: 'errand.ogg', sec: 15.98, by: 'Leszek_Szary' },
  play:   { name: '삼 분만',      file: 'play.ogg',   sec: 50.85, by: 'michorvath' },
  shop:   { name: '좌판 앞',      file: 'shop.ogg',   sec: 11.00, by: 'Rolly-SFX' },
  noon:   { name: '한낮의 마당',  file: 'noon.ogg',   sec: 12.00, by: 'pinkinblue' },
  study:  { name: '창가 자리',    file: 'study.ogg',  sec: 33.51, by: 'Hakren' },
  water:  { name: '물가',         file: 'water.ogg',  sec: 60.00, by: 'SondreDrakensson' },
};

/* 장소별 기본 곡.

   **본관은 도서관과 같은 곡을 씁니다.** 둘 다 "집중하는 곳" 이라 음악까지
   다르면 공간이 아니라 곡이 기억에 남습니다. 곡이 넷뿐이던 시절의 결정인데
   열 곡이 된 지금도 지킵니다 — 파일이 남아돈다고 해서 두 방을 갈라야 할
   이유가 생기는 것은 아니고, 이 둘은 애초에 "오래 앉는 자리" 하나입니다.

   대신 **미니게임관은 갈랐습니다.** 예전에는 학생회관과 같은 곡이었고
   그 이유가 "여기만 다른 곡을 깔면 3분 있다 나오는 방이 제일 기억에
   남는다" 였습니다. 그 걱정은 곡이 넷이라 미니게임관에 줄 것이 밝은
   아르페지오밖에 없을 때의 이야기입니다. 지금은 8비트 곡이 따로 있고,
   미니게임관은 "기억에 남는 것" 이 실패가 아니라 목적인 유일한 방입니다.

   **운동장과 호수에는 따로 안 답니다.** 둘은 존이 아니라 캠퍼스 안의
   좌표입니다(PLACES 의 field·lake 는 to 가 campus 입니다). 걸어 다니는
   동안 좌표로 곡을 바꾸면 잔디밭을 가로지를 때마다 음악이 두 번 넘어가고,
   그러면 공간이 아니라 전환이 들립니다. 물가에 어울리는 곡(water)은
   설정에서 직접 고를 수 있게 두는 것으로 갈음합니다. */
const ZONE_TRACK = {
  library: 'calm', mainhall: 'calm', dorm: 'warm', union: 'errand', campus: 'bright',
  arcade: 'play', clubshop: 'shop',
};
/* 어느 장소의 기본도 아닌 곡 넷 — night · noon · study · water 는 사람이
   설정에서 직접 골랐을 때만 나옵니다. 이 자리는 예전 night 하나가 하던
   일이고, "장소 따라" 를 안 쓰는 사람에게 고를 것을 주는 것이 이 곡들의
   쓸모입니다. */

const BGM = { id: null, want: undefined, src: null, out: null };
/* 받아 둔 곡. 같은 방을 다시 들어갈 때마다 다시 받으면 문을 지날 때마다
   네트워크가 도는데, 곡 하나가 60~470KB 라 열 곡을 다 들러도 2.4MB 입니다. */
const musicBuf = new Map();
/* 늦게 도착한 응답이 지금 곡을 덮지 않게 하는 번호표. 도서관 문을 열자마자
   기숙사로 뛰면 도서관 곡의 fetch 가 나중에 끝나는데, 그때 그대로 틀면
   기숙사에서 도서관 곡이 납니다. */
let musicSeq = 0;
let MUSIC_WHY = '';

/** 지금 울려야 할 곡. 사람이 고른 게 있으면 그것, 아니면 장소 기본. */
function trackFor(zone) {
  const pick = ROOM.bgmTrack || 'auto';
  if (pick === 'off') return null;
  if (pick !== 'auto') return MUSIC[pick] ? pick : null;
  return ZONE_TRACK[zone] || null;
}

/** 음악 손잡이를 지금 값으로 맞춥니다. 뚝 바꾸면 딸깍 소리가 납니다. */
function syncMusicVolume() {
  if (!AUDIO.musicGain) return;
  const g = AUDIO.musicGain.gain, t = AUDIO.ctx.currentTime;
  g.cancelScheduledValues(t);
  g.setValueAtTime(g.value, t);
  g.linearRampToValueAtTime(musicGainValue(), t + 0.15);
}

/** 파일 하나를 받아 디코드해 둡니다. 두 번째부터는 받아 둔 것을 씁니다. */
function loadTrack(id) {
  if (musicBuf.has(id)) return Promise.resolve(musicBuf.get(id));
  const ctx = audioCtx();
  const spec = MUSIC[id];
  if (!ctx || !spec) return Promise.resolve(null);
  const url = MUSIC_DIR + spec.file;
  return fetch(url)
    .then((r) => {
      if (!r.ok) throw new Error(url + ' → ' + r.status);
      return r.arrayBuffer();
    })
    /* decodeAudioData 를 프라미스로 씁니다. 사파리 옛 판은 콜백만 받는데,
       이 월드는 이미 다른 곳에서 프라미스 판을 쓰는 브라우저를 전제합니다. */
    .then((b) => ctx.decodeAudioData(b))
    .then((buf) => { musicBuf.set(id, buf); return buf; });
}

function stopMusic() {
  const src = BGM.src, out = BGM.out;
  BGM.id = null; BGM.src = null; BGM.out = null;
  if (!AUDIO.ctx || !src || !out) return;
  const t = AUDIO.ctx.currentTime;
  out.gain.cancelScheduledValues(t);
  out.gain.setValueAtTime(out.gain.value, t);
  out.gain.linearRampToValueAtTime(0, t + 0.6);
  /* 0.6초 페이드가 끝난 **뒤에** 끊습니다. 바로 stop() 하면 페이드가
     들리기 전에 소리가 잘려서, 문을 지날 때마다 뚝 끊깁니다. */
  setTimeout(() => {
    try { src.stop(); } catch { /* 이미 멈춤 */ }
    try { src.disconnect(); out.disconnect(); } catch { /* 이미 끊김 */ }
  }, 800);
}

function playTrack(id, buf) {
  const ctx = AUDIO.ctx;
  const out = ctx.createGain();
  out.gain.value = 0;
  out.connect(AUDIO.musicGain);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  /* 이음매를 미리 접어 두었으므로 loop 만 켜면 끝입니다. loopStart/End 를
     안 건드립니다 — 파일 전체가 곧 한 바퀴입니다. */
  src.loop = true;
  src.connect(out);
  src.start();
  /* 1.2초에 걸쳐 올립니다. 문을 열자마자 음악이 튀어나오면 방에 들어간
     것이 아니라 스피커를 켠 것이 됩니다. */
  out.gain.linearRampToValueAtTime(1, ctx.currentTime + 1.2);
  BGM.id = id; BGM.src = src; BGM.out = out;
}

function setMusic(zone) {
  const want = trackFor(zone);
  /* 같은 곡이면 이어서 틉니다. 도서관에서 본관으로 넘어갈 때 곡이 처음으로
     돌아가면, 두 방이 같은 곡이라는 결정이 오히려 눈에 띕니다. */
  if (want === BGM.want) return;
  BGM.want = want;
  const seq = ++musicSeq;
  stopMusic();
  if (!want || !audioCtx()) return;
  loadTrack(want).then((buf) => {
    if (!buf || seq !== musicSeq) return;   // 그새 다른 방으로 갔습니다
    MUSIC_WHY = '';
    playTrack(want, buf);
  }).catch((e) => {
    if (seq !== musicSeq) return;
    /* 정적 파일이 없거나(아티팩트·오프라인) 디코드가 막힌 경우입니다.
       조용히 삼키면 "음악이 원래 없는 줄" 알게 되므로 이유를 남깁니다. */
    MUSIC_WHY = '음악 파일을 못 읽었어요 (' + (e && e.message ? e.message : '알 수 없음') + ').';
    console.warn('[music]', e);
  });
}

/** 장소가 바뀌면 앞엣것을 접고 새로 답니다. 뚝 끊으면 문을 지날 때마다
    딸깍 소리가 납니다 — 0.5초씩 겹쳐 넘깁니다. */
function setAmbience(id) {
  if (AUDIO.ambId === id) return;
  const spec = AMBIENCE[id];
  const ctx = audioCtx();
  if (!ctx || !spec) { stopAmbience(); return; }
  stopAmbience();

  const gain = ctx.createGain();
  gain.gain.value = 0;
  gain.connect(AUDIO.bgmGain);
  const nodes = [];

  const src = ctx.createBufferSource();
  src.buffer = noiseBuffer(ctx);
  src.loop = true;
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = spec.cut; lp.Q.value = spec.q;
  src.connect(lp); lp.connect(gain);
  src.start(); nodes.push(src);

  /* 화음 — 잡음만이면 환풍기입니다. 아주 작게 깐 지속음이 있어야
     "여기 있다" 는 느낌이 납니다. */
  (spec.tone || []).forEach((hz, i) => {
    const o = ctx.createOscillator();
    o.type = i === 0 ? 'sine' : 'triangle';
    o.frequency.value = hz;
    const og = ctx.createGain();
    og.gain.value = 0.035 / (i + 1);
    /* 아주 느린 흔들림. 고정된 사인파는 몇 초만 지나도 기계음이 됩니다. */
    const lfo = ctx.createOscillator(), lg = ctx.createGain();
    lfo.frequency.value = 0.05 + i * 0.03; lg.gain.value = 0.012;
    lfo.connect(lg); lg.connect(og.gain);
    o.connect(og); og.connect(gain);
    o.start(); lfo.start();
    nodes.push(o, lfo);
  });

  gain.gain.linearRampToValueAtTime(spec.gain, ctx.currentTime + 0.6);
  AUDIO.amb = { gain, nodes }; AUDIO.ambId = id;
  syncSound();
}

/* 브라우저는 사용자가 건드리기 전에 소리를 못 내게 합니다. 첫 입력에서
   깨우고, 그때 지금 있는 장소의 앰비언트를 답니다.
   효과음 모듈(SFX)도 같은 순간에 함께 깨웁니다 — 따로 두면 앰비언트는
   나오는데 발소리는 안 나는 상태가 됩니다. */
let audioWoken = false;
function wakeAudio() {
  if (audioWoken) return;
  const ctx = audioCtx();
  if (!ctx) return;
  audioWoken = true;
  ctx.resume?.();
  SFX.unlock();
  setAmbience(zoneId);
  setMusic(zoneId);
}
addEventListener('keydown', wakeAudio, { once: false });
addEventListener('pointerdown', wakeAudio, { once: false });

/* ================== 지도 ==================
   캠퍼스는 46×42 라 한 화면에 안 들어옵니다. 어디에 무엇이 있는지
   외워야 하는 월드는 처음 온 사람에게 미로입니다. */
/* ==================================================================
   지도 배율 — 단추와 휠

   **정수 배율만** 씁니다. 1.5 배로 늘리면 16px 그림의 한 점이 어떤
   자리에서는 두 칸, 어떤 자리에서는 세 칸을 차지해 획 굵기가 들쭉날쭉
   해집니다. 픽셀 그림에서 그건 흐려지는 것보다 나쁩니다.

   세 단계인 이유 —
     ×1 (한 칸 32px) 캠퍼스 전체를 보는 배율. 46×42 짜리 캠퍼스에서
        건물 넷의 관계가 한 화면에 들어옵니다.
     ×2 기본. 사람 키가 96px 이라 옷과 표정이 보입니다.
     ×3 크게. 화면이 12칸 남짓이라 방 안에서 쓰기 좋습니다.
   ×4 는 화면에 아홉 칸 반만 남아 걸어 다닐 수가 없고, 0.5 단계는 위
   이유로 안 씁니다.

   화면 크기는 resize() 가 다시 잽니다 — 캔버스 픽셀은 VIEW_W 이고 CSS
   폭은 VIEW_W×SCALE 이라, 어느 배율에서도 한 점이 정확히 SCALE 칸입니다.
   ================================================================== */
/* ---- 배율을 **퍼센트**로 ----
   전에는 ×1 · ×2 · ×3 셋뿐이라, 한 단계 사이가 너무 벌어졌습니다 —
   ×2 가 답답해서 ×1 로 내리면 이번엔 캐릭터가 개미만 해집니다.

   기준(100%)은 **예전 ×2** 입니다. 지금까지 쓰던 화면이 100% 여야
   "얼마나 키운 건지" 가 몸으로 이해됩니다. 그래서 SCALE = 퍼센트 / 50.

     50%  = SCALE 1   (예전 ×1)
    100%  = SCALE 2   (예전 ×2 · 기본값)
    150%  = SCALE 3   (예전 ×3)
    200%  = SCALE 4   (새로 생긴 자리)

   10% 씩 열여섯 단계입니다. 0% 는 넣지 않았습니다 — 화면이 사라집니다.

   **정수가 아닌 배율은 픽셀이 살짝 고릅니다.** 캔버스 한 점이 화면
   2.4점이 되면 어떤 점은 2px, 어떤 점은 3px 로 그려집니다. 정수 배율
   (50·100·150·200%)에서는 딱 떨어지고, 그 사이는 아주 조금 어긋납니다.
   ZEP·게더도 같은 방식입니다 — 단계를 셋으로 묶어 두는 것보다 이쪽이
   쓰기 좋다고 봤습니다. */
const ZOOM_PCTS = [50, 60, 70, 80, 90, 100, 110, 120, 130, 140, 150, 160, 170, 180, 190, 200];
const ZOOM_MIN = ZOOM_PCTS[0], ZOOM_MAX = ZOOM_PCTS[ZOOM_PCTS.length - 1];
let zoomPct = 100;
const zoomNowEl = document.getElementById('zoom-now');
const zoomInEl = document.getElementById('zoom-in');
const zoomOutEl = document.getElementById('zoom-out');

/** 가장 가까운 단계로 붙입니다. 저장해 둔 옛 값(1·2·3)도 여기로 들어옵니다. */
function snapPct(pct) {
  let best = ZOOM_PCTS[0];
  for (const q of ZOOM_PCTS) if (Math.abs(q - pct) < Math.abs(best - pct)) best = q;
  return best;
}
/** pct 로 맞춥니다. step 을 주면 그 칸 수만큼 옆으로 옮깁니다. */
function setZoom(pct, save = true) {
  const next = snapPct(Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, pct)));
  const scale = next / 50;
  if (scale !== SCALE) {
    zoomPct = next;
    SCALE = scale;
    resize();
    /* 배율이 바뀌면 보이는 칸 수가 바뀝니다. 지도의 "지금 보는 자리"
       상자도 같이 다시 그려야 실제와 어긋나지 않습니다. */
    if (MINI.on) drawMinimap();
    if (save) saveJSON('girin.zoom', next);
  }
  zoomPct = next;
  zoomNowEl.textContent = next + '%';
  zoomInEl.disabled = next >= ZOOM_MAX;
  zoomOutEl.disabled = next <= ZOOM_MIN;
}
/** 단계 단위로 옮깁니다. 퍼센트에 10 을 더하는 것과 같지만, 단계 표가
    바뀌어도 여기가 안 깨집니다. */
function stepZoom(dir) {
  const i = ZOOM_PCTS.indexOf(zoomPct);
  const j = Math.max(0, Math.min(ZOOM_PCTS.length - 1, (i < 0 ? 5 : i) + dir));
  setZoom(ZOOM_PCTS[j]);
}
zoomInEl.addEventListener('click', () => stepZoom(1));
zoomOutEl.addEventListener('click', () => stepZoom(-1));
/* 휠 — 캔버스 위에서만. 트랙패드는 한 번 밀 때 이벤트를 수십 개 보내므로
   0.18초에 한 단계로 묶습니다. 안 묶으면 살짝 스쳐도 끝까지 갑니다. */
let zoomAt = 0;
cv.addEventListener('wheel', (e) => {
  if (panelOpen || MINI.on) return;
  e.preventDefault();
  const now = performance.now();
  if (now - zoomAt < 180) return;
  zoomAt = now;
  stepZoom(e.deltaY < 0 ? 1 : -1);
}, { passive: false });
/* 저장해 둔 배율을 되살리는 것은 **미니맵을 다 세운 뒤**입니다.
   setZoom 이 "지금 보는 자리" 상자를 다시 그리려고 MINI 를 보는데,
   여기서 부르면 아직 const MINI 가 초기화되기 전이라 스크립트가 통째로
   죽습니다(×2 로 저장된 사람은 조건이 안 걸려 안 죽고, ×1·×3 으로
   저장한 사람만 다음 방문에 흰 화면을 봅니다). 아래 미니맵 설정 뒤에
   한 줄로 부릅니다. */

const MINI = { on: false, scale: 10, canvas: null, base: null };
const MINI_MATERIAL_COLORS = {
  [M.PLAZA]: '#AAA9BA',
  [M.BEIGE]: '#DCE5D8',
  [M.GRAY]: '#C5CCCE',
  [M.WATER]: '#62C4DE',
  [M.GRASS]: '#72B36A',
};

/* 좌표는 지도 위 자리(x,y)와 실제로 갈 곳(to)이 따로입니다 — 건물
   아이콘은 지붕 가운데에 찍고, 도착은 문 앞이어야 하기 때문입니다. */
const PLACES = [
  { id: 'dorm',     to: ['dorm', 7, 8],       x: 22, y: 6,  name: '기숙사',    key: '1' },
  { id: 'mainhall', to: ['mainhall', 18, 25], x: 7,  y: 19, name: '본관',      key: '2' },
  { id: 'library',  to: ['library', 18, 25],  x: 38, y: 19, name: '도서관',    key: '3' },
  { id: 'union',    to: ['union', 12, 10],    x: 23, y: 33, name: '학생회관',  key: '4' },
  { id: 'campus',   to: ['campus', 22, 25],   x: 22, y: 21, name: '중앙 광장', key: '5' },
  { id: 'field',    to: ['campus', 8, 8],     x: 8,  y: 7,  name: '운동장',    key: '6' },
  { id: 'arcade',   to: ['arcade', 11, 10],   x: 37, y: 5,  name: '미니게임관', key: '7' },
  { id: 'lake',     to: ['campus', 6, 29],    x: 6,  y: 35, name: '호수',      key: '8' },
  /* 도착 칸을 천막 **앞**으로 내렸습니다. y29 는 시장 북쪽 잔디라,
     지도에서 눌렀는데 가게가 화면 아래로 밀려 안 보이는 자리였습니다. */
  { id: 'clubs',    to: ['clubshop', 11, 12], x: 40, y: 30, name: '동아리 상점', key: '9' },

/** 캠퍼스 바닥을 줄여 한 장으로 굽습니다. 한 번만 합니다. */
function bakeMinimap() {
  const m = ZONES.campus;
  const S = MINI.scale;
  const c = document.createElement('canvas');
  c.width = m.w * S; c.height = m.h * S;
  const g = c.getContext('2d');
  /* 여기서만 부드럽게 줄입니다. 월드는 픽셀을 지켜야 하지만 지도는
     축소판이라, 각 잡힌 픽셀보다 형태가 뭉개지지 않는 쪽이 낫습니다. */
  g.imageSmoothingEnabled = true;
  /* 구워 둔 야외 바닥을 그대로 줄입니다 — 지도와 세계가 어긋나지 않습니다 */
  if (m.ground) g.drawImage(m.ground, 0, 0, c.width, c.height);
  g.imageSmoothingEnabled = false;

  /* ground 는 잔디와 운동장처럼 한 장으로 구운 그림만 담습니다. 일반
     길은 실제 시트의 보라색 타일을 그대로 줄이지 않고, 사진처럼 하나의
     회색 포장면으로 통일합니다. 호수는 별도 파란 영역으로 그려 경계와
     물 그림이 미니맵에서도 분명하게 보이게 합니다. */
  for (let y = 0; y < m.h; y++) for (let x = 0; x < m.w; x++) {
    const mat = m.over[at(m, x, y)];
    if (!mat) continue;
    g.fillStyle = MINI_MATERIAL_COLORS[mat] || '#AAA9BA';
    g.fillRect(x * S, y * S, S, S);

    /* 재질이 바뀌는 가장자리에만 선을 그려 길은 매끈하게 유지하고,
       호수·건물 주변은 지도처럼 또렷하게 구분합니다. */
    const same = (nx, ny) => inMap(m, nx, ny) && m.over[at(m, nx, ny)] === mat;
    g.strokeStyle = mat === M.WATER ? '#8CA5AD' : 'rgba(255,255,255,.42)';
    g.lineWidth = 1;
    if (!same(x, y - 1)) { g.beginPath(); g.moveTo(x * S, y * S + .5); g.lineTo((x + 1) * S, y * S + .5); g.stroke(); }
    if (!same(x + 1, y)) { g.beginPath(); g.moveTo((x + 1) * S - .5, y * S); g.lineTo((x + 1) * S - .5, (y + 1) * S); g.stroke(); }
    if (!same(x, y + 1)) { g.beginPath(); g.moveTo(x * S, (y + 1) * S - .5); g.lineTo((x + 1) * S, (y + 1) * S - .5); g.stroke(); }
    if (!same(x - 1, y)) { g.beginPath(); g.moveTo(x * S + .5, y * S); g.lineTo(x * S + .5, (y + 1) * S); g.stroke(); }

    if (mat === M.WATER) {
      g.fillStyle = 'rgba(224,249,255,.42)';
      g.fillRect(x * S + 2, y * S + 2, Math.max(2, S - 5), 1);
    }
  }

  /* 건물은 축약 사각형이 아니라 월드에서 쓰는 완성 캔버스를 축소합니다.
     그래야 지붕 모양·창문·돔·색 구분이 지도에서도 살아납니다. 작은
     소품은 기존처럼 생략해 장소 건물의 실루엣을 우선합니다. */
  for (const p of m.props) {
    const d = PROP[p.kind];
    if (!d || d.w < 6) continue;                   // 건물만
    const X = p.x * S, Y = p.y * S, W = d.w * S, H = (d.h - 1) * S;
    if (d.canvas) {
      g.imageSmoothingEnabled = true;
      g.drawImage(d.canvas, X, Y, W, d.h * S);
      g.imageSmoothingEnabled = false;
    } else {
      g.fillStyle = 'rgba(255,255,255,.62)'; g.fillRect(X, Y, W, H);
      g.fillStyle = 'rgba(43,50,48,.55)'; g.fillRect(X, Y + H, W, S);
      g.strokeStyle = 'rgba(43,50,48,.45)'; g.lineWidth = 1;
      g.strokeRect(X + .5, Y + .5, W - 1, H + S - 1);
    }
  }
  MINI.base = c;
}

function toggleMinimap(force) {
  MINI.on = force === undefined ? !MINI.on : force;
  document.getElementById('minimap').classList.toggle('on', MINI.on);
  /* 지도를 펴는 것은 "어디로 갈지 다시 정하겠다" 는 뜻입니다. 아까 누른
     길을 들고 있으면 지도를 덮는 순간 그 길이 이어서 갑니다. */
  if (MINI.on) { pathClear(); drawMinimap(); }
}

function drawMinimap() {
  if (!MINI.base) bakeMinimap();
  const cvs = MINI.canvas;
  const g = cvs.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.clearRect(0, 0, cvs.width, cvs.height);
  g.drawImage(MINI.base, 0, 0);

  const S = MINI.scale;
  /* 지금 보고 있는 만큼을 상자로 표시합니다. 캠퍼스 밖(실내)일 때는
     상자가 뜻이 없으므로 건너뜁니다. */
  if (zoneId === 'campus') {
    g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 1;
    g.strokeRect(Math.round(camX / T * S) + .5, Math.round(camY / T * S) + .5,
                 Math.round(VIEW_W / T * S), Math.round(VIEW_H / T * S));
    g.fillStyle = '#2DD4BF';
    g.fillRect(Math.round(player.x / T * S) - 2, Math.round(player.y / T * S) - 2, 4, 4);
    g.fillStyle = '#FFF';
    g.fillRect(Math.round(player.x / T * S) - 1, Math.round(player.y / T * S) - 1, 2, 2);
  }
}

const minimapEl = document.getElementById('minimap');
MINI.canvas = document.getElementById('minimap-cv');
{
  const m = ZONES.campus;
  MINI.canvas.width = m.w * MINI.scale;
  MINI.canvas.height = m.h * MINI.scale;

     없고, 누를 수 없으면 지도가 아니라 그림입니다. */
