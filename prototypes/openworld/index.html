/* ==================================================================
   소리 - 전부 만들어 씁니다

   음원 파일을 받지 않습니다. 라이선스도 용량도 0 이고, 무엇보다 표면마다
   음색을 손으로 깎을 수 있습니다. 발소리 여섯 종을 사려면 팩을 사야
   하는데, 사도 잔디와 자갈이 우리 그림과 맞는다는 보장이 없습니다.

   전부 잡음(white noise)에 필터를 걸어 만듭니다. 발소리는 본래 넓은
   대역의 짧은 잡음이고, 재질은 **어느 대역이 남느냐** 로 갈립니다.
     잔디  낮은 대역만 남기고 부드럽게      1.4kHz 아래
     포석  가운데가 서고 꼬리가 짧게        2.6kHz 둘레
     마루  낮게 울리고 통이 있는 소리        700Hz + 공명
     타일  높고 아주 짧게                    3.5kHz 위
     자갈  넓게 부서지는 소리                길이를 두 배로
     물    낮게 떨어지는 소리                필터를 쓸어내림

   **조용해야 합니다.** 공부하는 도구라 소리가 존재를 주장하면 안 됩니다.
   기본 음량을 낮게 잡고, 끌 수 있게 두고, 브라우저 규칙대로 첫 입력
   전에는 아예 만들지 않습니다.
   ================================================================== */
const SFX = (function () {
  let ac = null, master = null;
  let muted = localStorage.getItem('girin.mute') === '1';
  let noiseBuf = null;

  /* 오디오는 사용자가 무언가를 누른 뒤에만 만들 수 있습니다. 미리 만들면
     브라우저가 정지 상태로 두고, 그 사실을 알려 주지도 않습니다. */
  function ctx() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ac = new AC();
      master = ac.createGain();
      master.gain.value = muted ? 0 : 0.5;
      master.connect(ac.destination);
      /* 2 초짜리 잡음 한 통을 만들어 두고 잘라 씁니다. 소리마다 새로
         만들면 발을 뗄 때마다 88,200 개를 채우게 됩니다. */
      const len = ac.sampleRate * 2;
      noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }

  /** 잡음 한 조각을 필터에 통과시켜 냅니다. 발소리는 전부 이 함수입니다. */
  function burst(o) {
    const c = ctx(); if (!c || muted) return;
    const src = c.createBufferSource();
    src.buffer = noiseBuf;
    src.playbackRate.value = o.rate || 1;
    /* 통 안의 아무 데서나 시작합니다 - 같은 자리를 쓰면 매번 똑같이
       들려서 기계가 됩니다. */
    const off = Math.random() * 1.5;

    const f = c.createBiquadFilter();
    f.type = o.type || 'lowpass';
    f.frequency.value = o.freq;
    f.Q.value = o.q || 1;

    const g = c.createGain();
    const t = c.currentTime;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(o.gain, t + (o.attack || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);

    src.connect(f); f.connect(g); g.connect(master);
    src.start(t, off, o.dur + 0.02);
    src.stop(t + o.dur + 0.02);

    /* 필터를 쓸어내리면 물이 됩니다 */
    if (o.sweepTo) f.frequency.exponentialRampToValueAtTime(o.sweepTo, t + o.dur);
  }

  /** 소리 나는 물체. 의자 삐걱과 문 여닫이가 여기서 나옵니다. */
  function tone(o) {
    const c = ctx(); if (!c || muted) return;
    const osc = c.createOscillator();
    osc.type = o.wave || 'sawtooth';
    const t = c.currentTime;
    osc.frequency.setValueAtTime(o.from, t);
    osc.frequency.exponentialRampToValueAtTime(o.to, t + o.dur);

    const f = c.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = o.cut || 900; f.Q.value = 2;

    const g = c.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(o.gain, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);

    osc.connect(f); f.connect(g); g.connect(master);
    osc.start(t); osc.stop(t + o.dur + 0.02);
  }

  /* 표면별 발소리. 같은 발이라도 왼발 오른발이 조금 다르게 들려야 하므로
     부를 때마다 음높이를 흔듭니다. */
  const STEP = {
    0: (v) => burst({ freq: 1400, type: 'lowpass', dur: 0.075, gain: 0.045 * v, rate: 0.9 + Math.random() * 0.25 }),
    1: (v) => burst({ freq: 2600, type: 'bandpass', q: 1.4, dur: 0.055, gain: 0.055 * v, rate: 0.95 + Math.random() * 0.2 }),
    2: (v) => burst({ freq: 700,  type: 'lowpass', q: 3, dur: 0.085, gain: 0.06 * v, rate: 0.85 + Math.random() * 0.2 }),
    3: (v) => burst({ freq: 3500, type: 'highpass', dur: 0.04, gain: 0.04 * v, rate: 1 + Math.random() * 0.25 }),
    4: (v) => burst({ freq: 1800, type: 'lowpass', dur: 0.22, gain: 0.07 * v, sweepTo: 300, rate: 0.8 + Math.random() * 0.2 }),
    5: (v) => burst({ freq: 3000, type: 'bandpass', q: 0.8, dur: 0.11, gain: 0.05 * v, rate: 0.9 + Math.random() * 0.3 }),
    6: (v) => burst({ freq: 1100, type: 'lowpass', q: 2, dur: 0.065, gain: 0.05 * v, rate: 0.9 + Math.random() * 0.2 }),
  };

  return {
    /** 첫 입력에서 부릅니다. 브라우저가 그때부터 소리를 허락합니다. */
    unlock() { ctx(); },
    step(surf, running) { (STEP[surf] || STEP[0])(running ? 1.25 : 1); },
    /* 문 - 걸쇠가 딸깍하고 경첩이 돌아갑니다. 둘을 겹쳐야 문이 됩니다. */
    door() {
      burst({ freq: 3200, type: 'bandpass', q: 3, dur: 0.03, gain: 0.06 });
      setTimeout(() => burst({ freq: 900, type: 'lowpass', dur: 0.18, gain: 0.05, sweepTo: 400 }), 40);
    },
    /* 의자 - 나무가 삐걱이는 건 음높이가 흔들리며 내려가는 소리입니다 */
    chair(up) {
      tone({ wave: 'sawtooth', from: up ? 210 : 150, to: up ? 120 : 190,
             dur: up ? 0.16 : 0.24, gain: 0.035, cut: 700 });
    },
    /* 물 첨벙 */
    splash() { burst({ freq: 2200, type: 'lowpass', dur: 0.3, gain: 0.05, sweepTo: 350 }); },
    get muted() { return muted; },
    set muted(v) {
      muted = !!v;
      localStorage.setItem('girin.mute', muted ? '1' : '0');
      if (master) master.gain.value = muted ? 0 : 0.5;
    },
  };
})();


/* ==================================================================
   발밑 자국 - 월드가 나를 알아본다는 유일한 신호

   스타듀에서 걷는 게 기분 좋은 이유의 절반이 여기 있습니다. 걸어도
   아무 일이 없으면 배경 위를 미끄러지는 것이고, 자국이 남으면 땅을
   밟는 것이 됩니다.

   셋을 한 목록으로 굴립니다. 종류마다 배열을 두면 갱신도 그리기도 세
   벌이 되고, 어느 하나를 지우는 걸 잊습니다.

   **모두 캐릭터 뒤, 소품 아래에 깔립니다.** 화면 가운데를 조용히 두는
   규칙이라, 발밑 자국이 캐릭터를 덮으면 안 됩니다.

   움직임을 줄이고 싶다는 설정이면 자국을 아예 만들지 않습니다.
   ================================================================== */
const FX = {
  list: [],
  reduced: matchMedia('(prefers-reduced-motion: reduce)').matches,

  /** 밟힌 잔디. 눌렸다 펴지는 데 0.8 초 - 걸음보다 느려야 자국이 이어집니다. */
  press(x, y) {
    if (this.reduced) return;
    this.list.push({ k: 'press', x, y, t: 0, life: 0.8, r: 5 + Math.random() * 2,
                     a: Math.random() * Math.PI });
  },

  /** 뛸 때 이는 먼지. 진행 반대쪽으로 밀려나며 떠오릅니다. */
  dust(x, y, dx, dy) {
    if (this.reduced) return;
    for (let i = 0; i < 2; i++) {
      this.list.push({ k: 'dust', x: x + (Math.random() - 0.5) * 5, y: y - Math.random() * 2,
                       vx: -dx * 7 + (Math.random() - 0.5) * 9,
                       vy: -dy * 7 - 5 - Math.random() * 6,
                       t: 0, life: 0.45 + Math.random() * 0.2, r: 1.6 + Math.random() * 1.4 });
    }
  },

  /** 물가 파문. 물칸 한가운데에서 고리가 퍼집니다. */
  ripple(tx, ty) {
    if (this.reduced) return;
    this.list.push({ k: 'ripple', x: tx * T + T / 2, y: ty * T + T / 2,
                     t: 0, life: 1.1, r: 2 });
  },

  update(dt) {
    const L = this.list;
    for (let i = L.length - 1; i >= 0; i--) {
      const f = L[i];
      f.t += dt;
      if (f.k === 'dust') {
        f.x += f.vx * dt; f.y += f.vy * dt;
        f.vy += 26 * dt;              // 떠오르다 가라앉습니다
        f.vx *= 0.94; f.vy *= 0.96;
      }
      if (f.t >= f.life) L.splice(i, 1);
    }
    /* 손을 놓아도 목록이 안 자라도록 - 프레임이 밀리면 자국이 쌓입니다 */
    if (L.length > 160) L.splice(0, L.length - 160);
  },

  /** 바닥 위, 소품 아래. camX/camY 는 그리는 쪽이 넘겨 줍니다. */
  draw(g, cx, cy) {
    for (const f of this.list) {
      const k = f.t / f.life;              // 0 -> 1
      const x = f.x - cx, y = f.y - cy;
      if (x < -30 || y < -30 || x > VIEW_W + 30 || y > VIEW_H + 30) continue;

      if (f.k === 'press') {
        /* 눌린 풀. 처음 0.15 는 눌린 채로 있다가 서서히 펴집니다 -
           바로 펴지기 시작하면 밟은 느낌이 안 납니다. */
        const hold = Math.min(1, k / 0.18);
        const back = k < 0.35 ? 1 : 1 - (k - 0.35) / 0.65;
        /* 잔디(#5B9E52)와 색이 가까우면 아무리 알파를 올려도 안 보입니다.
           한 단계 더 내려간 초록으로 눌러야 곁눈에 걸립니다. */
        g.globalAlpha = 0.46 * hold * back;
        g.fillStyle = '#2E6234';
        const rx = f.r, ry = f.r * 0.45;
        for (let dy = -ry; dy <= ry; dy++) {
          const w = Math.floor(rx * Math.sqrt(Math.max(0, 1 - (dy * dy) / (ry * ry))));
          g.fillRect(Math.round(x - w), Math.round(y + dy), w * 2 + 1, 1);
        }
        /* 눕는 풀잎 두 가닥 - 이게 있어야 "눌렸다" 로 읽힙니다 */
        g.globalAlpha = 0.6 * hold * back;
        g.fillStyle = '#24512A';
        const bx = Math.round(x + Math.cos(f.a) * 3), by = Math.round(y + Math.sin(f.a) * 1.5);
        g.fillRect(bx, by - 1, 2, 1);
        g.fillRect(bx - 3, by, 2, 1);

      } else if (f.k === 'dust') {
        g.globalAlpha = 0.36 * (1 - k);
        g.fillStyle = '#CFC4AB';
        const r = Math.max(1, Math.round(f.r * (1 + k)));
        g.fillRect(Math.round(x - r / 2), Math.round(y - r / 2), r, r);

      } else if (f.k === 'ripple') {
        /* 고리 하나가 퍼지며 옅어집니다. 원을 정수 격자로 그려야
           확대했을 때 흐려지지 않습니다. */
        g.globalAlpha = 0.5 * (1 - k);
        g.fillStyle = '#DCEEF5';
        const r = Math.round(f.r + k * 9);
        for (let dy = -r; dy <= r; dy++) {
          const w = Math.floor(Math.sqrt(Math.max(0, r * r - dy * dy)));
          const wi = Math.floor(Math.sqrt(Math.max(0, (r - 1) * (r - 1) - dy * dy)));
          if (w <= 0) continue;
          g.fillRect(Math.round(x - w), Math.round(y + dy * 0.55), w - wi, 1);
          g.fillRect(Math.round(x + wi), Math.round(y + dy * 0.55), w - wi, 1);
        }
      }
    }
    g.globalAlpha = 1;
  },

  clear() { this.list.length = 0; },
};


/* ==================================================================
   바람

   살아 있는 월드는 물건이 저마다 떨어서가 아니라 **같은 바람**을 함께
   받아서 살아 있습니다. 풀과 천막과 물결이 제각각 주기로 흔들리면
   화면이 시끄럽고, 하나의 시계를 나눠 쓰면 들판이 됩니다.

   그래서 파도 하나를 지도 위로 흘려보내고 위치마다 위상만 달리해
   읽습니다 - 왼쪽 풀이 눕고 잠시 뒤 오른쪽 풀이 눕습니다.
   ================================================================== */
const WIND = {
  t: 0,
  update(dt) { this.t += dt; },

  /** 세기 0.55 ~ 1. 40 초쯤에 한 번 크게 붑니다 - 세기가 일정하면
      바람이 아니라 선풍기입니다. */
  gust() {
    return 0.55 + 0.45 * (0.5 + 0.5 * Math.sin(this.t * 0.157) * Math.sin(this.t * 0.083 + 2.1));
  },

  /** 지도 위 한 점이 지금 받는 바람. -1 .. 1 */
  at(px, py) {
    if (FX.reduced) return 0;
    /* 사인 둘을 겹칩니다. 하나면 메트로놈이고, 주기가 어긋난 둘이면
       같은 모양이 돌아오는 데 한참 걸립니다. */
    const p = this.t * 0.9 - px * 0.055 - py * 0.028;
    return (Math.sin(p) * 0.66 + Math.sin(p * 2.37 + 1.7) * 0.34) * this.gust();
  },
};

const frac = (v) => v - Math.floor(v);
const hash1 = (n) => frac(Math.sin(n * 127.1 + 311.7) * 43758.5453);
const rgbOf = (c) => 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';

/* ==================================================================
   날씨

   창밖이 늘 같으면 창은 벽에 그린 그림입니다. 진짜 날씨 API 를 붙이면
   위치를 물어야 하고 오프라인에서 죽으므로, 날짜와 시각만으로 정해지는
   느린 곡선을 씁니다 - 같은 날 들어온 사람은 같은 하늘을 보고, 몇 시간
   앉아 있으면 한 번쯤 바뀝니다.

   비는 도서관 백색소음과 짝입니다. 소리와 창이 같은 말을 해야 합니다.
   ================================================================== */
const WX = { CLEAR: 0, RAIN: 1, SNOW: 2 };

const WEATHER = {
  override: null,           // 시험용 - 0..1 궂은 정도

  /** 정수 격자에서만 난수를 뽑고 사이를 부드럽게 잇습니다. 매 시각마다
      새로 뽑으면 날씨가 아니라 깜빡임이 됩니다. */
  noise(t) {
    const i = Math.floor(t), f = t - i, u = f * f * (3 - 2 * f);
    return hash1(i) * (1 - u) + hash1(i + 1) * u;
  },

  raw() {
    if (this.override !== null) return this.override;
    const day = Math.floor(Date.now() / 864e5);
    /* 6 시간에 한 칸. 한 세션 안에서 바뀔 수도, 안 바뀔 수도 있는
       속도입니다 - 그래야 바뀐 것이 사건이 됩니다. */
    return this.noise(day * 4.13 + TIME.hour() / 6);
  },

  /** 0(안 옴) ~ 1(퍼붓는 중). 가장자리가 부드러워야 뚝 켜지지 않습니다. */
  strength() {
    return Math.max(0, Math.min(1, (this.raw() - 0.58) / 0.26));
  },

  kind() {
    if (this.strength() <= 0) return WX.CLEAR;
    /* 12 · 1 · 2 월은 눈. 계절이 창밖에 있어야 1 년을 쓰는 월드가 됩니다. */
    const m = new Date().getMonth();
    return (m === 11 || m < 2) ? WX.SNOW : WX.RAIN;
  },
};

/* ---- 창밖 색 ----
   하늘 기본색에 지금 빛 색을 곱합니다. 정오엔 흰색을 곱하니 그냥 파랗고,
   노을엔 주황이 섞이고, 밤엔 가라앉습니다 - 하늘 표를 두 벌 만들 필요가
   없습니다. 궂으면 파란 기가 빠져 잿빛으로 갑니다. */
function outsideColor(ground) {
  const t = TIME.tint(), w = WEATHER.strength();
  let b = ground ? [96, 120, 86] : [152, 194, 230];
  if (w > 0) {
    const grey = ground ? [84, 90, 86] : [158, 164, 172];
    b = b.map((v, i) => v + (grey[i] - v) * w);
  }
  const dim = 1 - TIME.darkness() * 0.5 - w * 0.1;
  return b.map((v, i) => Math.max(0, Math.min(255, Math.round(v * t[i] / 255 * dim))));
}

/* ---- 화면 비 ----
   바깥에 서 있을 때 내리는 것. 화면 좌표로 굴립니다 - 탑다운이라 비는
   카메라 앞을 지나갑니다.

   방울마다 **떨어질 높이**를 따로 가집니다. 화면 아래까지 다 내려가게
   두면 위에서 아래로 흐르는 커튼이 되는데, 위에서 내려다보는 그림에서
   비는 화면 아무 데나 떨어져야 합니다. */
const PRECIP = {
  drops: [], splash: [], kind: -1,

  make(k, anywhere) {
    const snow = k === WX.SNOW;
    return {
      x: Math.random() * (VIEW_W + 80) - 40,
      y: anywhere ? Math.random() * VIEW_H : -14 - Math.random() * 40,
      land: snow ? VIEW_H + 40 : Math.random() * (VIEW_H + 16),
      /* 빠른 것과 느린 것을 섞습니다. 다 같은 속도면 벽지 무늬입니다. */
      z: 0.55 + Math.random() * 0.45,
      len: snow ? 1 + Math.round(Math.random()) : 5 + Math.random() * 7,
      ph: Math.random() * Math.PI * 2,
    };
  },

  update(dt, kind, strength) {
    const want = (kind === WX.CLEAR || FX.reduced) ? 0
      : Math.round((kind === WX.SNOW ? 52 : 150) * strength);
    if (kind !== this.kind) { this.drops.length = 0; this.splash.length = 0; this.kind = kind; }
    while (this.drops.length > want) this.drops.pop();
    while (this.drops.length < want) this.drops.push(this.make(kind, true));

    const snow = kind === WX.SNOW, w = WIND.gust();
    for (const d of this.drops) {
      if (snow) {
        d.y += (16 + d.z * 24) * dt;
        d.x += (Math.sin(WIND.t * 0.8 + d.ph) * 10 + w * 13) * dt;
      } else {
        d.y += (300 + d.z * 340) * dt;
        d.x += w * 42 * dt;
      }
      if (d.y >= d.land) {
        if (!snow && this.splash.length < 80) this.splash.push({ x: d.x, y: d.land, t: 0 });
        Object.assign(d, this.make(kind, false));
      }
      if (d.x < -44) d.x += VIEW_W + 80;
      else if (d.x > VIEW_W + 44) d.x -= VIEW_W + 80;
    }
    for (let i = this.splash.length - 1; i >= 0; i--) {
      if ((this.splash[i].t += dt) > 0.22) this.splash.splice(i, 1);
    }
  },

  draw(g, kind) {
    if (!this.drops.length) return;
    const snow = kind === WX.SNOW;
    g.save();
    if (snow) {
      g.fillStyle = '#FFFFFF';
      for (const d of this.drops) {
        g.globalAlpha = 0.4 + d.z * 0.5;
        g.fillRect(Math.round(d.x), Math.round(d.y), d.len, d.len);
      }
    } else {
      /* 빗줄기는 세로 사각형 둘입니다. 대각선을 그으면 16px 격자에서
         계단이 드러납니다. 아래 토막만 1px 밀어 기울기를 냅니다. */
      g.fillStyle = '#CBDCEE';
      const tilt = WIND.gust() > 0.78 ? 1 : 0;
      for (const d of this.drops) {
        g.globalAlpha = 0.22 + d.z * 0.28;
        const h = Math.max(2, Math.round(d.len * d.z)), a = h - (h >> 1);
        const x = Math.round(d.x), y = Math.round(d.y);
        g.fillRect(x, y, 1, a);
        g.fillRect(x + tilt, y + a, 1, h >> 1);
      }
      /* 떨어진 자리. 비가 아무것도 때리지 않으면 화면에 붙은 무늬로
         보입니다 - 땅에 닿는 순간이 있어야 비입니다. */
      g.fillStyle = '#E4EEF8';
      for (const s of this.splash) {
        const k = s.t / 0.22, r = 1 + k * 2;
        g.globalAlpha = 0.5 * (1 - k);
        g.fillRect(Math.round(s.x - r), Math.round(s.y), 1, 1);
        g.fillRect(Math.round(s.x + r), Math.round(s.y), 1, 1);
      }
    }
    g.restore();
    g.globalAlpha = 1;
  },
};

/* ---- 유리 뒤의 비 ----
   창은 10px 남짓입니다. 화면 비를 그대로 잘라 넣으면 한 방울도 안
   걸리므로, 창 안에서만 도는 촘촘한 벌을 따로 셈합니다. 목록을 두지
   않고 시각에서 바로 계산합니다 - 창마다 배열을 들고 있을 이유가 없고,
   존을 옮겨도 이어집니다. */
function paneWeather(g, x, y, w, h, kind, t) {
  const snow = kind === WX.SNOW;
  const n = snow ? 6 : 11;
  g.fillStyle = snow ? '#FFFFFF' : '#DCE9F6';
  for (let i = 0; i < n; i++) {
    const a = hash1(i * 3.1), b = hash1(i * 7.7 + 5);
    const sp = snow ? 6 + a * 6 : 34 + a * 38;
    const px0 = x + Math.floor(b * w);
    const py0 = y + frac((t * sp) / (h + 8) + a) * (h + 8) - 4;
    const len = snow ? 1 : Math.max(2, Math.round(2 + a * 3));
    if (py0 + len < y || py0 > y + h) continue;
    const top = Math.max(y, py0), bot = Math.min(y + h, py0 + len);
    g.globalAlpha = snow ? 0.85 : 0.5 + a * 0.3;
    g.fillRect(px0, Math.round(top), 1, Math.max(1, Math.round(bot - top)));
  }
  /* 유리에 맺혀 흘러내리는 물줄기. 뒤에서 내리는 비보다 훨씬 느리고
     밝습니다 - 이게 있어야 "유리 이쪽" 과 "유리 저쪽" 이 갈립니다. */
  if (!snow) {
    g.fillStyle = '#F2F8FF';
    for (let i = 0; i < 2; i++) {
      const a = hash1(i * 19.3 + 2);
      const px0 = x + 1 + Math.floor(a * Math.max(1, w - 2));
      const py0 = y + frac(t * 0.11 + a) * (h + 6) - 3;
      const top = Math.max(y, py0), bot = Math.min(y + h, py0 + 5);
      if (bot <= top) continue;
      g.globalAlpha = 0.32;
      g.fillRect(px0, Math.round(top), 1, Math.max(1, Math.round(bot - top)));
    }
  }
  g.globalAlpha = 1;
}

/* ---- 창밖 ----
   벽을 그린 뒤 유리 자리에 하늘과 땅을 칠하고, 창 한 장을 다시 덮어
   틀과 창살로 가립니다. 지평선을 그어야 색면이 아니라 **바깥**이 됩니다. */
function drawWindows(g, m, camX, camY) {
  if (!m.wins || !m.wins.length) return;
  const sky = rgbOf(outsideColor(false)), grd = rgbOf(outsideColor(true));
  const kind = WEATHER.kind(), dark = TIME.darkness();
  const t = WIND.t;
  for (const win of m.wins) {
    for (const r of win.glass) {
      const x = Math.round(r[0] - camX), y = Math.round(r[1] - camY);
      if (x > VIEW_W || y > VIEW_H || x + r[2] < 0 || y + r[3] < 0) continue;
      const hz = Math.max(1, Math.round(r[3] * 0.64));
      g.fillStyle = sky; g.fillRect(x, y, r[2], hz);
      g.fillStyle = grd; g.fillRect(x, y + hz, r[2], r[3] - hz);
      /* 밤이면 지평선 아래 먼 불빛 두엇. "밖에 학교가 있다" 는 말을
         가장 적은 픽셀로 하는 방법입니다. */
      if (dark > 0.35 && r[2] >= 6) {
        g.fillStyle = '#FFD98A';
        g.globalAlpha = Math.min(1, (dark - 0.35) / 0.4);
        for (let i = 0; i < 2; i++) {
          const a = hash1(r[0] * 3.7 + i * 11.1);
          g.fillRect(x + 1 + Math.floor(a * (r[2] - 2)), y + hz + (i % 2), 1, 1);
        }
        g.globalAlpha = 1;
      }
      if (kind !== WX.CLEAR && !FX.reduced) {
        g.save();
        g.beginPath(); g.rect(x, y, r[2], r[3]); g.clip();
        paneWeather(g, x, y, r[2], r[3], kind, t);
        g.restore();
      }
    }
  }
  for (const win of m.wins) g.drawImage(win.c, Math.round(win.x - camX), Math.round(-camY));
}

/* ==================================================================
   구름 그림자

   맑은 날에만 있습니다. 해가 없으면 그림자도 없고, 비 오는 날 구름
   그림자를 깔면 어디서 오는 빛인지 설명이 안 됩니다.

   지도 좌표로 흘러갑니다 - 화면에 붙여 두면 걸을 때 그림자가 따라와
   유리에 낀 얼룩이 됩니다.
   ================================================================== */
const CLOUDS = {
  blob: null,
  /* 여섯 장, 저마다 크기와 속도가 다릅니다. 같은 속도로 흐르면 한 장을
     여섯 번 복사한 것이 바로 보입니다. */
  set: [
    { x: 0.05, y: 0.14, s: 2.8, v: 7.0 }, { x: 0.31, y: 0.62, s: 4.1, v: 4.6 },
    { x: 0.52, y: 0.08, s: 3.3, v: 9.1 }, { x: 0.68, y: 0.44, s: 5.0, v: 3.4 },
    { x: 0.84, y: 0.78, s: 2.4, v: 11.0 }, { x: 0.18, y: 0.90, s: 3.7, v: 6.2 },
  ],

  /** 부드러운 덩어리 한 장. 원 하나면 접시라 세 개를 겹쳐 어긋뜨립니다. */
  make() {
    const R = 64, c = document.createElement('canvas');
    c.width = c.height = R * 2;
    const g = c.getContext('2d');
    for (const [ox, oy, rr] of [[0, 0, 1], [-0.42, -0.16, 0.66], [0.38, 0.2, 0.58]]) {
      const cx = R + ox * R, cy = R + oy * R, rad = R * rr;
      const grad = g.createRadialGradient(cx, cy, 0, cx, cy, rad);
      grad.addColorStop(0, 'rgba(0,0,0,0.9)');
      grad.addColorStop(0.5, 'rgba(0,0,0,0.45)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grad;
      g.fillRect(0, 0, R * 2, R * 2);
    }
    this.blob = c;
    return c;
  },

  draw(g, m, camX, camY) {
    if (FX.reduced || m.floor) return;      // 실내에는 해가 안 듭니다
    const sun = (1 - TIME.darkness() * 1.4) * (1 - WEATHER.strength());
    if (sun < 0.06) return;
    const b = this.blob || this.make();
    const span = m.w * T + 520;
    g.save();
    g.globalAlpha = 0.14 * sun;
    for (const c of this.set) {
      const r = 60 * c.s;
      const wx = frac(c.x + (WIND.t * c.v) / span) * span - 260;
      const wy = c.y * m.h * T;
      const sx = wx - camX - r, sy = wy - camY - r * 0.6;
      if (sx > VIEW_W || sy > VIEW_H || sx + r * 2 < 0 || sy + r * 1.2 < 0) continue;
      /* 세로로 눌러 그립니다. 위에서 내려다보면 그림자는 해가 기운
         만큼 늘어난 타원이지 원이 아닙니다. */
      g.drawImage(b, sx, sy, r * 2, r * 1.2);
    }
    g.restore();
    g.globalAlpha = 1;
  },
};

/* ==================================================================
   풀포기

   잔디는 한 장으로 구운 그림이라 흔들 수 없습니다. 그 위에 포기를
   흩뿌리고 포기만 눕힙니다.

   기울기 다섯을 미리 그려 두고 골라 씁니다 - 매 프레임 잘라 붙이면
   포기 하나에 drawImage 가 서넛씩 들고, 미리 구우면 하나면 됩니다.
   16px 에서는 어차피 1px 단위로만 눕습니다.
   ================================================================== */
const TUFT = {
  /* 세 모양 × 다섯 자세. 한 모양만 쓰면 잔디밭이 도장 찍은 것이 됩니다.
     [뿌리 x, 키, 색] - 뒤쪽 잎을 어둡게 두면 포기에 두께가 생깁니다. */
  shapes: [
    [[5, 5, '#3E7A3D'], [7, 7, '#5FA855'], [9, 4, '#4C8C46']],
    [[6, 4, '#4C8C46'], [8, 6, '#6FBA60'], [10, 5, '#3E7A3D'], [4, 3, '#5FA855']],
    [[7, 6, '#5FA855'], [9, 3, '#3E7A3D']],
  ],
  bake: null,

  make() {
    this.bake = this.shapes.map((blades) => BEND.map((b) => {
      const c = canvasOf(1, 1), g = c.getContext('2d');
      for (const [bx, h, col] of blades) {
        g.fillStyle = col;
        for (let i = 0; i < h; i++) {
          /* 뿌리는 붙어 있고 끝이 가장 많이 휩니다 - 제곱이라야
             풀이 눕지, 통째로 미끄러지지 않습니다. */
          const k = h > 1 ? i / (h - 1) : 0;
          g.fillRect(Math.round(bx + b * k * k), 14 - i, 1, 1);
        }
        g.fillStyle = 'rgba(38,74,40,.34)';   // 뿌리 그늘
        g.fillRect(bx, 15, 1, 1);
        g.fillStyle = col;
      }
      return c;
    }));
    return this.bake;
  },

  /** 존 하나의 포기 자리를 한 번만 정합니다. 잔디이고 못 밟는 칸이
      아니어야 합니다 - 건물 밑이나 물 위에 풀이 자라면 안 됩니다. */
  scatter(m) {
    if (m.floor || !m.surf) return [];
    const out = [];
    for (let y = 0; y < m.h; y++) for (let x = 0; x < m.w; x++) {
      const i = at(m, x, y);
      if (m.surf[i] !== SURF.GRASS || m.solid[i] || m.over[i]) continue;
      const r = hash1(x * 73.13 + y * 151.7);
      if (r > 0.24) continue;
      out.push({
        px: x * T + Math.floor(hash1(x * 5.1 + y * 9.3) * 12) + 2,
        py: y * T + Math.floor(hash1(x * 2.7 + y * 17.9) * 8),
        s: Math.floor(r * 12.5) % 3,
      });
    }
    return out;
  },

  /* 움직임을 줄이는 설정이면 포기는 그대로 두되 눕지 않습니다.
     지워 버리면 잔디밭이 밋밋해지고, 그건 접근성이 아니라 손해입니다. */
  draw(g, m, camX, camY) {
    if (!m.tufts || !m.tufts.length) return;
    const bake = this.bake || this.make();
    for (const t of m.tufts) {
      const x = t.px - camX, y = t.py - camY;
      if (x < -16 || y < -16 || x > VIEW_W || y > VIEW_H) continue;
      const b = Math.max(0, Math.min(4, Math.round(WIND.at(t.px, t.py) * 2) + 2));
      g.drawImage(bake[t.s][b], x, y);
      drawCount++;
    }
  },
};

/* 포기 자리는 존마다 한 번만 정합니다. 매번 다시 뿌리면 화면을 옮길
   때마다 풀이 다른 데서 자랍니다. */
Object.values(ZONES).forEach((m) => { m.tufts = TUFT.scatter(m); });


/* ==================================================================
   시각과 빛

   진짜 시계가 하늘을 움직입니다. 3 시에 앉아 고개를 드니 노을이면,
   월드가 "얼마나 앉아 있었는지" 를 숫자 없이 말해 줍니다. 학생은 밤에
   공부하니 제품 사실과도 맞습니다.

   ---- 색 ----
   밝기만 낮추면 회색이 됩니다. 픽셀아트의 기본은 **어두운 쪽을 파랑·
   보라로 식히고 채도를 낮추며, 밝은 쪽을 노랑으로 데우는** 것입니다.
   그래서 아래 표는 밝기 한 축이 아니라 색 그 자체를 적었습니다.

   값은 곱셈 합성에 그대로 들어갑니다. 정오가 흰색(255,255,255)이면
   아무것도 안 바뀌고, 밤이 (112,126,178)이면 빨강이 44%·파랑이 70%만
   남아 어둡고 푸르게 가라앉습니다.

   ---- 밤이 너무 어두우면 안 됩니다 ----
   공부하는 사람이 가장 많은 시간이 밤입니다. 분위기를 위해 안 보이게
   만들면 제품을 망칩니다. 그래서 가장 어두운 시각도 빨강 채널 기준
   38% 아래로 내려가지 않습니다.

   ---- 실내 ----
   실내는 사람이 불을 켜고 있습니다. 바깥이 밤이어도 방은 밝아야 하고,
   대신 색만 조금 따뜻해집니다.
   ================================================================== */
const SKY = [
  /* 시각, 곱할 색 [r,g,b] */
  [0,    [104, 118, 170]],   // 한밤 - 파랑
  [4,    [ 98, 110, 160]],   // 가장 어두운 때
  [6,    [138, 138, 178]],   // 여명이 번지기 시작
  [7,    [232, 190, 175]],   // 해 뜰 무렵 - 복숭아
  [9,    [250, 244, 236]],
  [12,   [255, 255, 255]],   // 정오 - 중립
  [16,   [252, 244, 228]],
  [18,   [250, 214, 178]],   // 금빛
  [19.5, [238, 168, 140]],   // 노을 - 코랄과 만나는 시각
  [21,   [150, 136, 180]],   // 땅거미 - 보라
  [23,   [112, 126, 178]],   // 밤
  [24,   [104, 118, 170]],   // 0시로 이어집니다
];

const TIME = {
  /** 시험용 고정 시각. null 이면 진짜 시계를 씁니다. */
  override: null,
  hour() {
    if (this.override !== null) return this.override;
    const d = new Date();
    return d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600;
  },
  /** 지금 하늘색. 두 구간 사이를 부드럽게 건너갑니다 - 계단으로 바뀌면
      1 분마다 화면이 툭툭 튑니다. */
  tint() {
    const h = this.hour();
    for (let i = 0; i < SKY.length - 1; i++) {
      const [h0, c0] = SKY[i], [h1, c1] = SKY[i + 1];
      if (h >= h0 && h <= h1) {
        const t = (h - h0) / (h1 - h0);
        return [
          Math.round(c0[0] + (c1[0] - c0[0]) * t),
          Math.round(c0[1] + (c1[1] - c0[1]) * t),
          Math.round(c0[2] + (c1[2] - c0[2]) * t),
        ];
      }
    }
    return [255, 255, 255];
  },
  /** 0(대낮) ~ 1(가장 어두움). 불을 켤지 정하는 데 씁니다. */
  darkness() {
    const c = this.tint();
    return Math.max(0, Math.min(1, (255 - (c[0] + c[1] + c[2]) / 3) / 120));
  },
};

/* ---------------- 광원 ----------------
   기물 종류에서 자동으로 뽑습니다. 존마다 손으로 적으면 기물을 옮길
   때마다 빛이 제자리에 남습니다.
   dx dy 는 기물 좌상단에서 빛이 나는 지점까지의 픽셀. */
const LAMPS = {
  lamp:      { dx: 8,  dy: 6,  r: 52, c: [255, 226, 172], i: 1.0 },
  floorLamp: { dx: 8,  dy: 8,  r: 40, c: [255, 224, 172], i: 0.9 },
  deskLamp:  { dx: 8,  dy: 6,  r: 30, c: [255, 232, 184], i: 0.8 },
  vending:   { dx: 8,  dy: 12, r: 26, c: [190, 226, 255], i: 0.7 },
  vending2:  { dx: 8,  dy: 12, r: 26, c: [190, 226, 255], i: 0.7 },
  gateEsc:   { dx: 32, dy: 42, r: 44, c: [255, 150, 120], i: 1.0 },
  gateA:     { dx: 32, dy: 42, r: 44, c: [130, 230, 215], i: 1.0 },
  gateB:     { dx: 32, dy: 42, r: 44, c: [255, 220, 130], i: 1.0 },
  gateC:     { dx: 32, dy: 42, r: 44, c: [190, 160, 255], i: 1.0 },
  signpost:  { dx: 24, dy: 20, r: 22, c: [255, 236, 200], i: 0.5 },
  /* 노트북·모니터 화면. 밤에 방에 광원이 하나도 없으면 평평해집니다.
     화면빛은 차갑고 좁습니다 - 등불과 색이 달라야 둘이 구분됩니다.
     live: false 는 안 떠는 불입니다. 모니터는 흔들리지 않습니다. */
  laptopN:   { dx: 8,  dy: 4,  r: 22, c: [176, 214, 255], i: 0.72, live: false },
  laptop:    { dx: 8,  dy: 4,  r: 22, c: [176, 214, 255], i: 0.72, live: false },
  monitor:   { dx: 8,  dy: 4,  r: 24, c: [176, 214, 255], i: 0.75, live: false },
  pc:        { dx: 8,  dy: 6,  r: 18, c: [176, 214, 255], i: 0.6,  live: false },
  tv:        { dx: 8,  dy: 6,  r: 26, c: [190, 210, 255], i: 0.7,  live: false },
};

/** 건물 창. 기물에서 못 뽑는 것들은 존이 직접 적습니다 -
    창은 건물 그림 안에 있어 좌표를 밖에서 알 수 없습니다. */
function windowLights(m) {
  const out = [];
  for (const p of m.props) {
    const d = PROP[p.kind];
    if (!d || !p.kind.startsWith('bld')) continue;
    /* 정면 창문 줄은 건물 아래에서 두 칸 위입니다. 건물 폭에 걸쳐
       고르게 놓습니다 - 창 하나하나를 따라가지 않고 벽면이 은은하게
       빛나게 하는 편이 16px 에서 더 깨끗합니다. */
    const y = (p.y + d.h - 2) * T + 8;
    for (let i = 1; i < d.w - 1; i += 3) out.push({ x: (p.x + i) * T + 8, y, r: 34, c: [255, 226, 170], i: 0.62 });
  }
  return out;
}

const LIGHTMAP = {
  buf: null, g: null,
  blobs: new Map(),        // 색마다 미리 그려 둔 빛 덩어리

  /** 빛 한 덩어리를 미리 그려 캐시합니다. 프레임마다 createRadialGradient
      를 부르면 광원 수만큼 그라디언트를 새로 만들게 됩니다. */
  blob(c) {
    const key = c.join(',');
    let b = this.blobs.get(key);
    if (b) return b;
    const R = 64;
    b = document.createElement('canvas');
    b.width = b.height = R * 2;
    const g = b.getContext('2d');
    const grad = g.createRadialGradient(R, R, 0, R, R, R);
    grad.addColorStop(0,    'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',1)');
    grad.addColorStop(0.45, 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0.42)');
    grad.addColorStop(1,    'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, R * 2, R * 2);
    this.blobs.set(key, b);
    return b;
  },

  /** 조명 층을 만들어 화면에 곱합니다. 곱셈이라 흰색은 아무 일도 하지
      않고, 어두운 색은 그만큼 가라앉힙니다. 빛은 그 위에 더해 올려
      되살립니다. */
  apply(ctx, m, camX, camY, vw, vh) {
    const dark = TIME.darkness();
    const wet = WEATHER.strength();
    /* 대낮에는 통째로 건너뜁니다. 흰색을 곱하는 건 아무 일도 아닌데
       화면 크기만 한 합성을 한 번 하는 셈이라 순수한 낭비입니다.
       궂은 날은 대낮에도 한 겹 내려앉으므로 건너뛰지 않습니다. */
    if (dark < 0.02 && wet < 0.05) return;

    let tint = TIME.tint();
    /* 구름이 끼면 빛이 줄고 색이 빠집니다. 어둡게만 하면 밤이 되고,
       잿빛으로 몰아야 흐린 낮이 됩니다. 최대 18% 까지만 - 비 오는 날
       글자가 안 읽히면 그건 분위기가 아니라 고장입니다. */
    if (wet > 0) {
      const grey = [132, 141, 152];
      tint = tint.map((v, i) => Math.round((v + (grey[i] - v) * wet * 0.55) * (1 - wet * 0.18)));
    }
    /* 실내는 사람이 불을 켜고 있습니다. 바깥만큼 어두워지면 안 되고,
       색만 조금 따뜻해집니다. */
    const inside = !!m.floor;
    if (inside) {
      const k = 0.30;                       // 바깥 어둠을 30% 만 들입니다
      tint = tint.map((v) => Math.round(255 - (255 - v) * k));
    }

    if (!this.buf || this.buf.width !== vw || this.buf.height !== vh) {
      this.buf = document.createElement('canvas');
      this.buf.width = vw; this.buf.height = vh;
      this.g = this.buf.getContext('2d');
    }
    const g = this.g;
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = 'rgb(' + tint[0] + ',' + tint[1] + ',' + tint[2] + ')';
    g.fillRect(0, 0, vw, vh);

    /* 불은 어두워질수록 밝아집니다. 대낮에 가로등이 켜져 있으면
       거짓말이고, 한밤에 꺼져 있으면 길이 안 보입니다. */
    /* 궂은 날은 낮에도 불을 켭니다. 흐린 오후에 가로등이 들어오는 건
       실제로 그러기도 하고, 어두워진 화면에 길잡이가 생깁니다. */
    const on = Math.max(0, (dark + wet * 0.22 - 0.18) / 0.82);
    if (on > 0) {
      g.globalCompositeOperation = 'lighter';
      const put = (L) => {
        const x = L.x - camX, y = L.y - camY, r = L.r;
        if (x < -r || y < -r || x > vw + r || y > vh + r) return;
        /* 등마다 다른 위상으로 아주 조금 떨립니다. 크게 떨면 고장 난
           형광등이고, 6% 면 곁눈으로만 걸립니다. 화면 불빛은 안 떱니다 -
           모니터는 흔들리지 않습니다. */
        const f = L.live === false ? 1
          : 1 - 0.06 * (0.5 + 0.5 * Math.sin(WIND.t * 3.1 + L.x * 0.7 + L.y * 0.31));
        g.globalAlpha = Math.min(1, on * (L.i ?? 1) * f);
        g.drawImage(this.blob(L.c), x - r, y - r, r * 2, r * 2);
      };
      for (const p of m.props) {
        const L = LAMPS[p.kind];
        if (!L) continue;
        put({ x: p.x * T + L.dx, y: p.y * T + L.dy, r: L.r, c: L.c, i: L.i, live: L.live });
      }
      if (m.winLights) for (const L of m.winLights) put(L);
      g.globalAlpha = 1;
    }

    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    ctx.drawImage(this.buf, 0, 0);
    ctx.restore();
  },
};

/* ================== 세션 ==================
   **월드에 들어온 순간이 세션의 시작입니다.** 따로 시작 화면을 두지
   않습니다 — 접속했다는 것 자체가 "오늘 여기서 시간을 쓰겠다" 이고,
   버튼을 하나 더 누르게 하면 그 사이에서 절반이 이탈합니다.

   카메라는 **월드에 들어온 순간**, 곧 세션이 시작될 때 켜지고 그 자리에서
   10초 기준을 잡습니다. 그 뒤로는 캠퍼스를 걸어 다니는 동안에도 판정이
   계속 돕니다 — 자세는 앉아 있을 때만 무너지지 않습니다. 카메라는
   세션을 끝낼 때 꺼집니다.

   의자에 앉는 것은 판정을 켜는 것이 아니라, 웹캠 화면을 한쪽에 작게
   띄워(PIP) 다른 탭에서 집중할 수 있게 하는 것입니다. 그 화면은
   **도서관과 본관의 자리에서만** 뜹니다 — 걷는 내내 자기 얼굴이 떠
   있으면 그건 집중 도구가 아니라 감시입니다. 두 건물에 자리를 만들고
   공간마다 다른 소리를 트는 이유도 판정이 아니라 **오래 앉을 이유**를
   만들기 위해서입니다.

   회고는 **세션을 끝내야** 볼 수 있습니다. 도중에 계속 들여다볼 수
   있으면 앉아 있는 동안 화면을 보게 되는데, 그건 이 앱이 막으려는
   행동입니다. */
const SESSION = {
  startedAt: 0,
  seatedMs: 0,      // 의자에 앉아 있던 시간. 판정은 세션 내내 도므로 판정 시간과 다릅니다
  seatedAt: 0,
  ended: false,
  coins: 0,         // 이번 세션에서 번 것 — 회고에 보여 줍니다
};
function sessionMinutes() {
  return SESSION.startedAt ? (Date.now() - SESSION.startedAt) / 60000 : 0;
}
/** 자세 판정이 **실제로 돌아간** 분. 코인의 분모입니다.
    의자 시계가 아니라 이것을 쓰는 이유 — 앉혀 두고 자리를 비우면 의자
    시계는 흐르지만 사람이 없으므로 판정은 안 돕니다. 카메라를 못 열었을
    때도 0 이라, 카메라 없이 시간만 흘려 코인을 받는 길이 막힙니다. */
function judgedMinutes() {
  return Math.floor((LIVE.goodMs + LIVE.warnMs + LIVE.badMs) / 60000);
}
function sessionText() {
  const sec = Math.floor((Date.now() - SESSION.startedAt) / 1000);
  return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
}
let camX = 0, camY = 0, portalCooldown = 0, sitStart = 0, nearby = null;

const keys = new Set();
/* 한글 자판 상태에서도 영문 단축키와 같은 동작을 유지합니다.
   두벌식 자판에서 ㅡ는 M 키 자리, ㅈ·ㅁ·ㄴ·ㅇ은 W·A·S·D 자리에
   대응하므로 keydown과 keyup 모두 같은 정규화를 거쳐야 키가 stuck되지
   않습니다. */
const KEY_ALIASES = { 'ㅡ': 'm', 'ㅈ': 'w', 'ㅁ': 'a', 'ㄴ': 's', 'ㅇ': 'd' };
function controlKey(key) {
  const lower = key.toLowerCase();
  return KEY_ALIASES[lower] || lower;
}
addEventListener('keydown', (e) => {
  /* 브라우저는 사용자가 누른 뒤에만 소리를 허락합니다. 미리 만들면
     정지 상태로 두고 그 사실을 알려 주지도 않습니다. */
  SFX.unlock();
  lastActivity = Date.now();      // 체류 보상의 활동 게이트
  const k = controlKey(e.key);
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  /* 스페이스가 상호작용입니다. 엄지가 이미 거기 있고, WASD 를 잡은 손을
     떼지 않아도 됩니다. E 는 왼손 검지를 W 에서 떼야 합니다. */
  /* 창이 열려 있으면 창이 키를 다 먹습니다. 게임 분기가 **먼저** 와야
     합니다 — 아래 있던 동안은 panelOpen 이 먼저 return 해서 죽은 코드였고,
     미니게임에서 Space 가 게임 대신 창을 닫았습니다. */
  if (panelOpen) {
    /* 게임이 켜져 있으면 게임이 먼저 먹습니다. typeof 로 감싸는 이유는
       게임 하나가 빠진 판본에서도 Esc 로 창을 닫을 수 있어야 하기
       때문입니다 — 없는 이름을 그냥 읽으면 여기서 던지고, 그러면
       아래 closePanel 까지 못 갑니다.
       preventDefault 는 스페이스로 화면이 밀려 내려가는 것을 막습니다.
       a/d/w/s 는 연우님이 넣은 별칭이라 화살표와 같이 받습니다. */
    if (typeof GIRAFFE_NECK !== 'undefined' && GIRAFFE_NECK.active && k === ' ') {
      e.preventDefault(); tapGiraffeNeck(); return;
    }
    if (typeof GIRAFFE_STACK !== 'undefined' && GIRAFFE_STACK.active && k === ' ') {
      e.preventDefault(); dropGiraffeStack(); return;
    }
    if (typeof EGG_MERGE !== 'undefined' && EGG_MERGE.active &&
        ['a', 'd', 'w', 's', 'arrowleft', 'arrowright', 'arrowup', 'arrowdown'].includes(k)) {
      e.preventDefault(); moveEggMerge(k); return;
    }
    /* 카드·매칭은 마우스로만 합니다. 스페이스만 삼켜서 창이 닫히는 것을
       막고, Esc 는 아래로 흘려 보냅니다 — 키로 못 닫는 창을 만들지
       않기 위해서입니다. */
    if (typeof ANIMAL_FIND !== 'undefined' && ANIMAL_FIND.active && k === ' ') {
      e.preventDefault(); return;
    }
    if (typeof ANIMAL_MATCH3 !== 'undefined' && ANIMAL_MATCH3.active && k === ' ') {
      e.preventDefault(); return;
    }
    /* Esc 는 언제나 닫습니다. Space 는 미니게임 창에서만 안 닫습니다 —
       알 합치기는 Space 를 쓰지 않아 위에서 안 걸리는데, 그렇다고 창을
       닫아 버리면 판을 짜다가 화면이 사라집니다. 위 주석의 "Space 가
       게임 대신 창을 닫았습니다" 가 이 줄까지 와야 없어집니다. */
    if (k === 'escape' ||
        (k === ' ' && !['giraffeNeck', 'eggMerge', 'giraffeStack', 'animalFind', 'animalMatch3'].includes(activePanelKey)))
      closePanel();
    return;
  }
  /* 지도가 열려 있으면 지도가 키를 먼저 먹습니다. 숫자로 바로 갑니다. */
  if (MINI.on) {
    if (k === 'escape' || k === 'm' || k === ' ') { toggleMinimap(false); return; }
    const p = PLACES.find((q) => q.key === k);
    if (p) { goPlace(p); return; }
    return;
  }
  if (k === 'm') { toggleMinimap(true); return; }
  if (k === ' ') { interact(); return; }
  keys.add(k);
});
addEventListener('keyup', (e) => keys.delete(controlKey(e.key)));
addEventListener('blur', () => keys.clear());
/* 탭을 닫거나 다른 곳으로 가면 마지막으로 한 번 더 남깁니다.
   pagehide 는 모바일에서 unload 대신 도는 것이지만, 데스크톱에서도
   새로고침·닫기에 불립니다. visibilitychange 는 탭 전환을 잡습니다. */
for (const ev of ['pagehide', 'visibilitychange']) {
  addEventListener(ev, () => {
    if (ev === 'visibilitychange' && document.visibilityState !== 'hidden') return;
    if (SESSION.startedAt && !SESSION.ended) saveSession();
  });
}

/** 발이 닿은 칸의 표면. 발은 몸통 아래라 y 에서 한 픽셀 올려 봅니다 -
    안 그러면 칸 경계에서 다음 칸 소리가 먼저 납니다. */
function surfaceAt(px, py) {
  const tx = Math.floor(px / T), ty = Math.floor((py - 1) / T);
  if (!inMap(zone, tx, ty) || !zone.surf) return SURF.GRASS;
  return zone.surf[at(zone, tx, ty)];
}

/** 둘레에 물이 있으면 그 칸을 돌려줍니다. 물가 파문이 어디에 생길지 */
function waterNear(px, py) {
  const tx = Math.floor(px / T), ty = Math.floor((py - 1) / T);
  for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
    const x = tx + i, y = ty + j;
    if (!inMap(zone, x, y)) continue;
    if (zone.surf[at(zone, x, y)] === SURF.WATER) return { x, y };
  }
  return null;
}

/** 사방이 다 물인 칸인가. 둑에 닿은 칸은 오토타일이 물가를 그리므로
    반짝임을 얹으면 물이 뭍으로 올라온 것처럼 보입니다. */
function waterInner(m, x, y) {
  for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
    if (!inMap(m, x + i, y + j) || m.over[at(m, x + i, y + j)] !== M.WATER) return false;
  }
  return true;
}

function solidAt(px, py) {
  const tx = Math.floor(px / T), ty = Math.floor(py / T);
  if (!inMap(zone, tx, ty)) return true;
  return zone.solid[at(zone, tx, ty)] === 1;
}
const BOX = { w: 9, h: 6 };
function canStand(px, py) {
  const l = px - BOX.w / 2, r = px + BOX.w / 2 - 1, t = py - BOX.h, b = py - 1;
  return !(solidAt(l, t) || solidAt(r, t) || solidAt(l, b) || solidAt(r, b));

function enterZone(id, sx, sy) {

  /* 세션은 여기서 한 번만 시작합니다. 존을 옮겨 다녀도 이어집니다 —
     캠퍼스 안에 있는 동안이 하나의 세션입니다.
     카메라도 이 순간 켭니다. 세션이 곧 촬영 구간입니다 — 앉기가 아니라. */
  if (!SESSION.startedAt) { SESSION.startedAt = Date.now(); startCamera(); }
  zoneId = id; zone = ZONES[id];
  player.x = sx * T + T / 2; player.y = sy * T + T;
  /* 짧게 둡니다. 문 바로 안쪽에 서므로, 돌아서면 곧바로 다시 나갈 수
     있어야 합니다. 길면 문이 잠긴 것처럼 느껴집니다. */
  portalCooldown = 0.35;
  FX.clear();                        // 이전 존의 자국을 들고 오지 않습니다
  walked = STRIDE; lastSurf = -1;
  /* 방금 지나온 문에서 빛이 새어 듭니다. 0.4 초면 뒤돌아볼 때쯤 닫힙니다.
     들어온 자리에서 가장 가까운 포탈을 찾습니다 - 문이 여럿인 방을
     대비한 것이고, 지금은 어느 방이든 하나뿐입니다. */
  {

    for (const q of zone.portals) {
      const d = Math.hypot(q.x + q.w / 2 - sx, q.y + q.h / 2 - sy);
      if (d < bd) { bd = d; best = q; }
    }
    doorFlash = best && bd < 6 ? { x: best.x, y: best.y, w: best.w, h: best.h, t: 0 } : null;
  }
  const b = document.getElementById('banner');
  b.querySelector('b').textContent = zone.name;
  b.querySelector('span').textContent = zone.sub;
  b.classList.remove('play'); void b.offsetWidth; b.classList.add('play');
  /* 존 배지를 없앴으므로 여기서 쓸 곳이 없습니다. 이름은 지도(M)와
     건물 안내판이 말합니다. */
  /* 설정은 미니룸에서만. 캠퍼스를 걷는 동안에는 월드를 가립니다.
     세션은 기숙사에서 시작하므로, 기준을 다시 잡는 것도 자기 방에서
     하는 일이 됩니다 — 설정과 기준이 한자리에 모입니다. */
  document.getElementById('gear').classList.toggle('on', id === 'dorm');
  document.getElementById('session-place').textContent = FOCUS[id] || zone.name;
  if (panelOpen) closePanel();
  closeDialog();
  if (player.sitting) stand();
  /* 공간이 곧 모드라면 소리도 공간을 따라야 합니다.

window.__teleport = enterZone;

function facingTile() {
  const tx = Math.floor(player.x / T), ty = Math.floor((player.y - 1) / T);
  if (player.dir === 'up') return { x: tx, y: ty - 1 };
  if (player.dir === 'down') return { x: tx, y: ty + 1 };
  return { x: tx + (player.flip ? -1 : 1), y: ty };
}
function findNearby() {
  if (player.sitting) return { kind: 'stand' };
  const f = facingTile();
  /* NPC 는 두 칸까지 — 계산대 뒤에 서 있어서 앞 칸만 보면 못 만납니다 */
  const d = { up: [0, -1], down: [0, 1], side: [player.flip ? -1 : 1, 0] }[player.dir];
  for (const step of [0, 1]) {
    const fx = f.x + d[0] * step, fy = f.y + d[1] * step;
    for (const n of zone.npcs) if (n.x === fx && n.y === fy) return { kind: 'talk', npc: n };
  }
  /* 물건 만지기. 방향이 아니라 **거리**로 잡습니다 — 미니룸은 물건이
     빽빽해서, 정확히 마주 봐야만 열리면 답답합니다. 여러 개가 걸리면
     가장 가까운 것을 고릅니다. */
  const ptx = Math.floor(player.x / T), pty = Math.floor((player.y - 1) / T);
  let best = null, bestD = 99;
  for (const t of zone.things || []) {
    const d2 = PROP[zone.props.find((q) => q.x === t.x && q.y === t.y)?.kind];
    const tw = d2 ? d2.w : 1, th = d2 ? d2.h : 1;
    const nx = Math.max(t.x - ptx, 0, ptx - (t.x + tw - 1));
    const ny = Math.max(t.y - pty, 0, pty - (t.y + th - 1));
    if (nx > 1 || ny > 1) continue;
    const dist = nx + ny;
    if (dist < bestD) { bestD = dist; best = t; }
  }
  if (best) return { kind: 'talk', npc: best };
  for (const s of zone.sitSpots) if (s.x === f.x && s.y === f.y) return { kind: 'sit', spot: s };
  return null;
}
function interact() {
  /* 대화창이 떠 있으면 스페이스는 **닫기**입니다.

     이걸 nearby 보다 먼저 보지 않으면 창이 영영 안 닫힙니다 — 대화를
     연 자리에 그대로 서 있으니 nearby 가 살아 있고, 스페이스를 누를
     때마다 같은 창이 다시 열립니다. 자리를 뜬 경우만 닫히던 이유입니다. */
  if (dialogOpen) return advanceDialog();
  const n = nearby;
  if (!n) return;
  if (n.kind === 'stand') return stand();
  if (n.kind === 'sit') return sit(n.spot);
  if (n.kind === 'talk') {
    /* 미니룸 물건은 설명이 아니라 **창**을 엽니다 */
    if (n.npc.panel) return openPanel(n.npc.panel);
    return talk(n.npc);
  }
}

let dialogOpen = false, talkingTo = null;

/** 한 줄짜리(line)든 여러 줄(lines)이든 배열로 봅니다. 부르는 쪽이 둘을
    구분하지 않아도 되게, 읽는 자리에서 한 번만 맞춥니다. */
const npcLines = (npc) => (npc.lines && npc.lines.length ? npc.lines : [npc.line]);

function talk(npc) {
  /* things 도 이 창을 쓰므로 진짜 NPC 만 셉니다 */
  if ((zone.npcs || []).includes(npc)) award('once:npc_' + npc.name, npc.name.split(' · ')[1] + ' 첫 만남');
  talkingTo = npc;
  npc.at = 0;

}

/** 스페이스 — 남은 줄이 있으면 넘기고, 없으면 닫습니다.
    **끝까지 들은 사람만** after 가 걸립니다(안내 나루 → 튜토리얼).
    중간에 걸어 나간 사람에게 안내를 밀어 넣지 않기 위해서입니다. */
function advanceDialog() {
  const npc = talkingTo;
  if (!npc || npc.at >= npcLines(npc).length - 1) {
    const after = npc && npc.after;
    closeDialog();
    if (after) after();
    return;
  }
  npc.at++;

}

function paintDialog() {
  const npc = talkingTo, lines = npcLines(npc);
  const d = document.getElementById('dialog');
  d.querySelector('b').textContent = npc.name;
  d.querySelector('p').textContent = lines[npc.at];
  const last = npc.at >= lines.length - 1;
  /* 몇 줄 남았는지 보여 줍니다. 안 보여 주면 스페이스를 누를 때마다
     이번이 마지막인지 아닌지 몰라 계속 누르게 됩니다. */
  d.querySelector('small').textContent = last
    ? 'Space 로 닫기'
    : 'Space 로 계속 · ' + (npc.at + 1) + '/' + lines.length;
  d.classList.add('on'); dialogOpen = true;
}

  document.getElementById('dialog').classList.remove('on');

}

const FOCUS = { library: '도서관 · 백색소음', mainhall: '본관 · 대중음악' };

/** 웹캠 PIP 를 띄우거나 치웁니다. 같은 모서리를 쓰는 코인 버튼과 지급

function showPip(on) {

/* 앉기 — 세션도 판정도 여기서 시작하지 않습니다. 둘 다 월드에 들어온

function sit(spot) {
  if (player.sitting) return;
  SFX.chair(false);
  sitSquash = 1;            // 앉는 순간 살짝 눌렸다 폅니다
  player.sitting = true;
  player.x = spot.x * T + T / 2; player.y = spot.y * T + T;
  player.dir = 'up'; player.moving = false;
  sitStart = performance.now();
  SESSION.seatedAt = Date.now();
  if (!FOCUS[zoneId]) return;
  showPip(true);
  /* 입장 때 기준을 못 잡았으면(걸어 들어오느라 10초를 놓쳤거나 첫

     함께 보이게" 같은 안내를 읽을 수 있습니다. */
  if (!LIVE.profile && camStream) startCalibrate();

function stand() {
  if (SESSION.seatedAt) {

  sitSquash = 1;
  player.sitting = false;
  player.y += T;
  if (!canStand(player.x, player.y)) player.y -= T;
  player.dir = 'down';

  showPip(false);
}
document.getElementById('stand').addEventListener('click', stand);
document.getElementById('calib').addEventListener('click', startCalibrate);

var POSE = (function () {

  /* lite 가 아니라 full 입니다.

     납니다. 하필 우리 판정축 중 earEyeRatio 와 shoulderSpan 이 그 점들을
     씁니다 — lite 로는 그 두 축이 계속 흔들립니다.

  function build(delegate) {
    return vision.FilesetResolver.forVisionTasks(WASM).then(function (fs) {
      return Promise.all([
        vision.PoseLandmarker.createFromOptions(fs, {
          baseOptions: { modelAssetPath: POSE_MODEL, delegate: delegate },
          runningMode: 'VIDEO',
          numPoses: 2   /* 2 로 두어 "두 명 이상" 을 감지합니다. 판정은 첫 사람만. */
        }),

          baseOptions: { modelAssetPath: FACE_MODEL, delegate: delegate },

      .catch(function (err) { loading = null; throw err; });

  }

  /* ---------------- One Euro Filter ----------------
     판정 축 중 거리에 가장 민감한 faceScaleRatio 의 분자(눈 사이 거리)는
     화면 폭의 4% 밖에 안 됩니다. 프레임당 몇 px 흔들림이 그대로 10%대
     잡음이 되어, 머리가 8cm 앞으로 나온 신호를 덮습니다.
     문턱을 낮춰 풀면 오탐이 같이 올라오므로 잡음을 먼저 줄입니다. */
  function LowPass() { this.y = null; }
  LowPass.prototype.filter = function (x, a) {
    this.y = this.y === null ? x : a * x + (1 - a) * this.y;
    return this.y;
  };
  function alphaOf(cut, rate) {
    var tau = 1 / (2 * Math.PI * cut), te = 1 / rate;
    return 1 / (1 + tau / te);
  }
  function OneEuro(minCut, beta, dCut) {
    this.minCut = minCut; this.beta = beta; this.dCut = dCut;
    this.x = new LowPass(); this.dx = new LowPass(); this.last = null;
  }
  OneEuro.prototype.filter = function (v, t) {
    var prev = this.x.y;
    var dt = this.last === null ? 0 : (t - this.last) / 1000;
    var rate = (dt > 0.001 && dt < 1) ? 1 / dt : 12;
    this.last = t;
    var speed = prev === null ? 0 : (v - prev) * rate;
    var sHat = this.dx.filter(speed, alphaOf(this.dCut, rate));
    return this.x.filter(v, alphaOf(this.minCut + this.beta * Math.abs(sHat), rate));
  };
  function Smoother() { this.ch = {}; }
  Smoother.prototype.reset = function () { this.ch = {}; };
  Smoother.prototype.smooth = function (lms, t) {
    if (!lms) return lms;
    var self = this;
    return lms.map(function (lm, i) {
      function c(k) {
        if (!self.ch[k]) self.ch[k] = new OneEuro(0.8, 0.01, 1);
        return self.ch[k];
      }
      return {
        x: c(i + 'x').filter(lm.x, t),
        y: c(i + 'y').filter(lm.y, t),
        z: c(i + 'z').filter(lm.z, t),
        visibility: lm.visibility
      };
    });
  };

  /* ---------------- 머리 6DoF ----------------
     478점을 표준 얼굴 모형에 맞춘 4x4 행렬입니다. 열 우선이라
     R[row][col] = data[col*4 + row].
     Pose 의 성긴 랜드마크로는 머리가 8cm 나온 것을 못 잡습니다 —
     1.6m 에서 8cm 는 배율 5% 변화라 지터에 묻힙니다. 여기서는 cm 로
     직접 나옵니다. */
  var HEAD_YAW_LIMIT = 25, HEAD_ROLL_LIMIT = 25;
  function headPose(data) {
    if (!data || data.length < 16) return null;
    var d = data, dist = Math.abs(d[14]);
    if (!isFinite(dist) || dist < 20 || dist > 150) return null;
    var deg = 180 / Math.PI;
    return {
      headDistanceCm: dist,
      /* 모형은 y 가 위입니다. 턱을 내리면 + 가 되도록 부호를 뒤집습니다. */
      headPitchDeg: -Math.atan2(d[6], d[10]) * deg,
      headYawDeg: Math.atan2(-d[2], Math.hypot(d[6], d[10])) * deg,
      headRollDeg: Math.atan2(d[1], d[0]) * deg
    };
  }
  function headUsable(h) {
    return Math.abs(h.headYawDeg) <= HEAD_YAW_LIMIT
        && Math.abs(h.headRollDeg) <= HEAD_ROLL_LIMIT;
  }

  /* ---------------- 랜드마크 분석 ---------------- */
  var IDX = { nose: 0, leftEyeOuter: 3, rightEyeOuter: 6, leftEar: 7, rightEar: 8,
              leftShoulder: 11, rightShoulder: 12, leftHip: 23, rightHip: 24 };
  var PRESENCE_MIN = 0.5, MIN_SHOULDER_WIDTH = 0.09;
  var YAW_SEVERE = 0.9, YAW_MODERATE = 0.5, FRAME_MARGIN = 0.06;

  var PRIMARY = ['faceScaleRatio', 'headHeightRatio', 'facePitchRatio', 'earEyeRatio',
                 'shoulderSpan', 'lateralOffsetRatio', 'shoulderTiltRatio', 'torsoLean',
                 'headDistanceCm', 'headPitchDeg'];
  var AUX = ['forwardDepthRatio'];

  function pt(lm) {
    if (!lm) return { x: 0, y: 0, z: 0, visibility: 0, present: false };
    var v = lm.visibility == null ? 0 : lm.visibility;
    return { x: lm.x, y: lm.y, z: lm.z, visibility: v, present: v >= PRESENCE_MIN };
  }
  function inFrame(p) {
    return p.x >= -FRAME_MARGIN && p.x <= 1 + FRAME_MARGIN
        && p.y >= -FRAME_MARGIN && p.y <= 1 + FRAME_MARGIN;
  }

  function analyze(lms, hp) {
    if (!lms || lms.length < 25) return null;
    var P = {};
    Object.keys(IDX).forEach(function (k) { P[k] = pt(lms[IDX[k]]); });

    var eyesOk = P.leftEyeOuter.present && P.rightEyeOuter.present;
    var shouldersOk = P.leftShoulder.present && P.rightShoulder.present;
    var earsOk = P.leftEar.present && P.rightEar.present;
    var hipsOk = P.leftHip.present && P.rightHip.present;

    var sw = Math.hypot(P.leftShoulder.x - P.rightShoulder.x,
                        P.leftShoulder.y - P.rightShoulder.y);
    var smx = (P.leftShoulder.x + P.rightShoulder.x) / 2;
    var smy = (P.leftShoulder.y + P.rightShoulder.y) / 2;
    var smz = (P.leftShoulder.z + P.rightShoulder.z) / 2;

    var eyeDist = eyesOk
      ? Math.hypot(P.leftEyeOuter.x - P.rightEyeOuter.x, P.leftEyeOuter.y - P.rightEyeOuter.y) : 0;
    var emx = (P.leftEyeOuter.x + P.rightEyeOuter.x) / 2;
    var emy = (P.leftEyeOuter.y + P.rightEyeOuter.y) / 2;

    /* 정면이면 코가 두 눈 중앙 근처에 있습니다. */
    var yaw = (eyesOk && P.nose.present && eyeDist > 0)
      ? Math.abs(P.nose.x - emx) / (eyeDist / 2) : 0;
    var severe = yaw > YAW_SEVERE, moderate = !severe && yaw > YAW_MODERATE;

    var core = [P.leftShoulder, P.rightShoulder]
      .concat(eyesOk ? [P.leftEyeOuter, P.rightEyeOuter] : [P.nose]);
    var vis = core.reduce(function (s, p) { return s + p.visibility; }, 0) / core.length;

    var f = {}, d = sw || 1;

    if (eyesOk && shouldersOk) {
      f.faceScaleRatio = eyeDist / d;
      f.headHeightRatio = (smy - emy) / d;
    }
    /* ---- 시상면(앞뒤) 축 ----
       faceScale·headHeight 는 shoulderWidth 로 정규화하는데, 거북목은 대개
       상체가 같이 앞으로 나와 어깨도 함께 커집니다 — 분자·분모가 같이
       커져 신호가 상쇄됩니다. 아래 두 축은 eyeDist 로만 정규화해 카메라
       거리와 무관하고, 고개 각도 자체를 잽니다. */
    if (eyesOk && P.nose.present && eyeDist > 0 && !moderate) {
      /* 코는 얼굴 평면보다 앞으로 나와 있어, 고개를 숙이면 눈-코 세로
         간격이 오히려 벌어집니다. 증가가 이탈 방향입니다. */
      f.facePitchRatio = (P.nose.y - emy) / eyeDist;
    }
    if (eyesOk && earsOk && eyeDist > 0 && !moderate) {
      /* 귀는 눈보다 뒤에 있어, 고개를 숙이면 눈보다 덜 내려갑니다. */
      f.earEyeRatio = ((P.leftEar.y + P.rightEar.y) / 2 - emy) / eyeDist;
    }
    if (P.nose.present && shouldersOk && !moderate) {
      f.lateralOffsetRatio = Math.abs(P.nose.x - smx) / d;
      f.forwardDepthRatio = smz - P.nose.z;
    }
    if (shouldersOk) {
      f.shoulderTiltRatio = Math.abs(P.leftShoulder.y - P.rightShoulder.y) / d;
      /* 유일하게 정규화하지 않는 축입니다. 어깨폭은 카메라까지의 거리에
         그대로 반비례하므로, 몸 전체가 화면으로 다가온 것을 잡아냅니다. */
      f.shoulderSpan = sw;
    }
    if (hipsOk && shouldersOk) {
      f.torsoLean = Math.abs(smx - (P.leftHip.x + P.rightHip.x) / 2) / d;
    }
    if (hp && headUsable(hp)) {
      f.headDistanceCm = hp.headDistanceCm;
      f.headPitchDeg = hp.headPitchDeg;
    }

    return {
      features: f, shoulderWidth: sw, yawRatio: yaw,
      severeRotation: severe, moderateRotation: moderate,
      inFrame: core.every(inFrame), meanVisibility: vis,
      bothShouldersOk: shouldersOk, faceCoreOk: P.nose.present || eyesOk
    };
  }

  /* ---------------- 투표 ---------------- */
  var DIRECTION = {
    faceScaleRatio: 1,      /* 얼굴이 커짐 = 카메라 쪽으로 접근 */
    headHeightRatio: -1,    /* 눈-어깨 거리 감소 = 고개 숙임·움츠림 */
    facePitchRatio: 1,      /* 눈-코 세로 간격 벌어짐 = 고개 숙임 */
    earEyeRatio: -1,        /* 귀가 눈보다 올라감 = 고개 숙임 */
    shoulderSpan: 1,        /* 어깨폭 넓어짐 = 몸 전체 접근 */
    lateralOffsetRatio: 1, shoulderTiltRatio: 1, torsoLean: 1,
    headDistanceCm: -1,     /* 얼굴이 가까워짐 = 머리 전방 이동 */
    headPitchDeg: 1,        /* 턱을 내림 */
    forwardDepthRatio: 1
  };
  var FLOOR = {
    faceScaleRatio: 0.03, headHeightRatio: 0.08,
    facePitchRatio: 0.06, earEyeRatio: 0.06, shoulderSpan: 0.012,
    lateralOffsetRatio: 0.1, shoulderTiltRatio: 0.08, torsoLean: 0.1,
    headDistanceCm: 4, headPitchDeg: 8,   /* cm·도 단위 */
    forwardDepthRatio: 0.35
  };
  var MAD_K = 8;
  var SENS = { gentle: 1.4, 'default': 1.0, sensitive: 0.75 };
  var WARNING_ENTER = 1.0, BAD_STRONG = 1.8, GOOD_EXIT = 0.8;

  function votes(f, profile, sens, qualityGood) {
    var mult = SENS[sens] || 1, details = [];
    PRIMARY.concat(AUX).forEach(function (k) {
      var v = f[k], st = profile.features[k];
      if (v === undefined || !st) return;
      var tol = mult * Math.max(FLOOR[k], st.mad * MAD_K);
      var dev = Math.max(0, (v - st.median) * DIRECTION[k]) / tol;
      details.push({ key: k, deviation: dev, primary: PRIMARY.indexOf(k) >= 0,
                     exceeded: dev > WARNING_ENTER });
    });
    var pri = details.filter(function (d) { return d.primary; });
    var over = pri.filter(function (d) { return d.exceeded; }).length;
    var max = pri.reduce(function (m, d) { return Math.max(m, d.deviation); }, 0);
    return {
      details: details, primaryExceedCount: over, maxPrimary: max,
      usedFeatureCount: details.length,
      /* z 는 표가 아닙니다: bad 의 두 번째 표도, good 복귀의 거부권도
         갖지 않습니다. 실카메라에서 z 는 조명·거리에 따라 흘러다닙니다. */
      voteWarning: over >= 1,
      voteBad: over >= 2 || (max > BAD_STRONG && qualityGood),
      voteGood: pri.every(function (d) { return d.deviation < GOOD_EXIT; })
    };
  }

  /* ---------------- 지속 시간으로 확정 ----------------
     한 프레임 튀었다고 상태를 바꾸지 않습니다. */
  var HOLD = { warning: 1500, bad: 5000, good: 2000 };
  function arbiter() { return { current: 'good', candidate: null, since: 0 }; }
  function step(s, v, now) {
    var target = v.voteBad ? 'bad' : v.voteWarning ? 'warning' : v.voteGood ? 'good' : null;
    if (target === null || target === s.current) {
      return { current: s.current, candidate: null, since: now };
    }
    if (s.candidate !== target) return { current: s.current, candidate: target, since: now };
    if (now - s.since >= HOLD[target]) return { current: target, candidate: null, since: now };
    return s;
  }

  /* ---------------- 통계 ---------------- */
  function median(a) {
    var s = a.slice().sort(function (x, y) { return x - y; }), m = Math.floor(s.length / 2);
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  }
  function mad(a, c) {
    if (c === undefined) c = median(a);
    return median(a.map(function (n) { return Math.abs(n - c); }));
  }

  /* ---------------- 프레임 루프 ----------------
     한 비디오에 대해 Pose 와 Face 를 같은 타임스탬프로 한 번씩 돌립니다. */
  function detect(video, t, smoother) {
    if (!poser) return null;
    var res;
    try { res = poser.detectForVideo(video, t); } catch (e) { return null; }
    var people = res.landmarks || [];
    var raw = people[0];
    if (!raw) { smoother.reset(); return { analysis: null, multi: false, landmarks: null }; }

    var hp = null;
    if (facer) {
      try {
        var fr = facer.detectForVideo(video, t);
        var m = fr.facialTransformationMatrixes && fr.facialTransformationMatrixes[0];
        hp = headPose(m && m.data);
      } catch (e) { hp = null; }
    }
    return {
      analysis: analyze(smoother.smooth(raw, t), hp),
      /* 기준을 맞출 때는 "기준 대비" 가 아직 없으므로 **절대값**이 필요합니다.
         머리 6DoF 는 도·cm 단위라 그대로 쓸 수 있어 밖으로 넘깁니다. */
      head: hp,
      /* 뼈대 그리기용 원본 좌표. 이 키가 빠져 있어 drawSkeleton 이
         한 번도 그려지지 않았습니다 — 호출부 아홉 곳 전부 out.landmarks. */
      landmarks: raw,
      multi: people.length > 1
    };
  }

  return {
    load: load, detect: detect, analyze: analyze, votes: votes,
    arbiter: arbiter, step: step, median: median, mad: mad,
    Smoother: Smoother,
    PRIMARY: PRIMARY, AUX: AUX,
    MIN_SHOULDER_WIDTH: MIN_SHOULDER_WIDTH,
    ready: function () { return !!poser; }
  };
})();

/* ==================================================================
   웹캠 자세 판정 — UpRight 엔진 이식

   여기 있는 POSE 블록은 `prototypes/room-flow/index.html` 의 것을 그대로
   옮긴 것입니다. 손대지 마세요 — 값 하나하나에 이유가 있고, 그 이유는
   `upright-now/docs/24_POSTURE_ENGINE.md` 에 있습니다.

   요약만 적어 둡니다.
   · 정면 카메라는 거북목이 움직이는 축(앞뒤)을 원래 못 봅니다. 그래서
     **정면에서 실제로 보이는 형태 변화**를 여러 개 모아 투표시킵니다 —
     facePitchRatio · earEyeRatio · shoulderSpan, 그리고 얼굴 메시가 주는
     머리 6DoF(headDistanceCm · headPitchDeg).
   · 랜드마크 z(forwardDepthRatio)를 주력으로 쓰면 안 됩니다. 조명과 거리에
     따라 흘러다녀 기준선이 세션 중에 바뀝니다. 보조(AUX)로만 둡니다.
   · One Euro 필터가 앞에 붙습니다. 새 축들은 값이 작아서(0.06 단위)
     원본 떨림에 그대로 묻힙니다.
   · 절대 임계값은 없습니다. 사람마다 캘리브레이션한 **자기 기준**과
     중앙값·MAD 로 비교합니다.
   ================================================================== */

/* ---- 판정 민감도 ----
   업라이트와 같은 표준값으로 고정합니다. 사용자가 느슨하게 바꿀 수
   있으면 학교 랭킹이 조용히 무너집니다 — 랭킹 지표가 "bad 를 겪고
   회복한 시간" 이라, 기준을 풀면 bad 자체가 안 나옵니다. */
const SENSITIVITY = 'default';

/* ---- 기준 프로필 ----
   세션을 시작할 때 10초로 한 번 잡아 그 세션 내내 씁니다. 존을 옮겨
   다녀도 같은 기준으로 봅니다 — 카메라와 사람의 관계는 존이 아니라
   책상이 정하고, 책상은 세션 동안 하나입니다. 이 기기에만 남고 서버로
   가지 않습니다. version 3 이 아니면 버립니다 — 축이 바뀐 옛 프로필은
   조용히 무시되어 사용자에게는 고장으로 보입니다. (존별로 잡던 옛
   저장본은 최상위에 version 이 없어 여기서 같이 걸러집니다.) */
let BASELINE = null;

function saveBaseline() {

}
