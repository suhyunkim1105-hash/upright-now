     네모난 책상 열여덟 장 뒤에 원이 둘 있으면, 그 원이 "여기서부터는
     수업이 아니다" 를 모양만으로 말합니다.

     의자는 탁자 위쪽에만 둡니다. 아래는 문으로 가는 길이라, 거기 앉으면
     나가는 사람 앞을 막고 앉는 셈입니다.
     짝은 이 방의 규칙 그대로 x ↔ 37-x 입니다(왼쪽 x4~5 ↔ 오른쪽 x32~33). */
  [4, 32].forEach((bx) => {
    floorInlay(m.floor, bx - 1, 23, 4, 4, 'rug');
    floorGlow(m.floor, bx + 1, 24.6, 3.4);
    prop(m, 'tableRound', bx, 24);
    prop(m, 'armchair', bx, 23); prop(m, 'armchair', bx + 1, 23);
  });

  /* 나가는 곳 — 네 건물이 전부 같은 문입니다. 건물마다 다르면
     "여기가 출구" 를 매번 새로 배워야 합니다. */
  prop(m, 'board', 20, 23);                 // 문(x17) 오른쪽, 아래벽 앞
  m.things = [
    { x: 20, y: 23, name: '본관 안내', panel: 'aboutMainhall' },
    /* 강단 위 노트북. 본관 안내에 "대중음악이 나온다" 고 적어 놓고 실제로는
       합성음 화음만 났습니다. 음악을 트는 자리가 화면 어딘가가 아니라
       강단이어야, 이 방이 왜 음악이 나오는 방인지가 설명됩니다. */
    { x: 18, y: 5, name: '강단 스피커', panel: 'radio' },
  ];

  prop(m, 'exitDoor', 17, m.h - 2);
  m.portals.push({ x: 17, y: m.h - 2, w: 3, h: 2, to: 'campus', sx: 6, sy: 25, label: '캠퍼스' });
}

/* ================== 기숙사 — 내 방 ==================
   8×8 이었습니다. 벽 테두리에 위쪽 두 줄이 더 벽이라 걸을 자리가
   x1~6 · y3~5, 곧 **여섯 칸 곱하기 세 줄**뿐이었습니다. 거기에 이미
   책상·노트북·의자·침대·응원기·방석·협탁·곰인형·캐리어·거울이 들어가
   있어서 바닥이 남지 않았습니다. "옷장과 화분까지 넣었더니 진열장이
   됐다" 는 것은 물건이 많아서가 아니라 **방이 작아서**였습니다.

   14×11 로 키웁니다. 걸을 자리는 x1~12 · y3~8, 12×6 = 72칸입니다(전 18칸).

   왜 이 치수인가 —
     · 세로 11 은 화면에 방이 통째로 들어가는 한계입니다. 화면은
       700/SCALE(2) = 350px = 10.9칸이고, 지도가 화면보다 작으면 카메라가
       가운데에 고정됩니다(draw 의 maxY <= 0 갈래). 12줄로 만들면 한 줄이
       넘쳐 스크롤이 생기고, 그러면 꾸며 놓은 **윗벽과 현관이 한 화면에
       안 들어옵니다.** 내 방은 통째로 보여야 방입니다.
     · 가로 14 는 화면 폭 19칸 안에 들어가면서, 벽을 따라 가구를 붙이고도
       가운데에 러그 깔 자리가 남는 최소치입니다. 12칸 walkable 에 벽쪽
       가구가 양쪽 두 줄씩 들어가면 가운데 두 줄이 통로로 남습니다.
     · 개더는 타일 32px 에 사람당 5×5칸을 잡습니다. 1인실 + 놀러 온 친구
       하나면 50칸이고, 가구를 뺀 자유 공간이 대략 그만큼 나옵니다.

   배치 원칙은 전과 같습니다 — **벽을 따라 붙입니다.** 가운데에 두면
   가구 카탈로그가 되고, 벽에 붙이면 사는 곳이 됩니다. */
{
  const m = makeMap(14, 11, F.beige);
  ZONES.dorm = m; m.name = '기숙사'; m.sub = '내 방 · 1인실';

  ring(m, 0, 0, m.w, m.h, F.brickO);
  fillBase(m, 1, 1, m.w - 2, 2, F.brickO);
  m.floor = paintFloor(m.w, m.h, 'laminate'); m.floorKind = SURF.WOOD;
  /* 러그는 비운 가운데(y5~6)에 깝니다. 가구를 전부 벽으로 밀었더니
     가운데가 넓어졌고, 넓은 빈 마루는 방이 아니라 복도로 보입니다.
     러그는 밟고 지나가는 그림이라 길을 한 칸도 안 먹습니다. */
  floorInlay(m.floor, 4, 5, 6, 2, 'rug');
  /* 윗벽 기능 줄 밑에 띠를 한 겹 깝니다. 다섯이 한 줄로 서 있다는 것을
     바닥이 한 번 더 말해 줍니다 — 물건 사이가 한 칸씩 떠 있어서, 띠가
     없으면 다섯 개가 각자 서 있는 것으로 보입니다. 이건 **바닥 그림**이라
     아래쪽 가구 놓는 자리(y5~8)는 한 칸도 안 건드립니다. */
  floorInlay(m.floor, 1, 3, 12, 2, 'runner', '208,122,76');
  /* 스탠드 밑과 창 밑에 빛 한 웅덩이씩. 내 방에 광원이 둘 있다는 사실이
     바닥에 보여야 밤에 방이 평평해지지 않습니다. */
  floorGlow(m.floor, 3.5, 4.6, 3);             // 책상 스탠드
  floorGlow(m.floor, 9.5, 4.4, 2.6);           // 창 밑 선반

  /* 벽이 넓어진 만큼 걸 것을 늘립니다. 벽은 이미 못 지나가므로 충돌은
     한 칸도 안 늘어납니다 — 방이 꽉 차 보이게 하는 가장 싼 방법입니다.
     간격은 그림 눈금으로 잽니다(x*16 이 왼쪽 끝). 겹치면 뒤에 그린 것이
     앞엣것을 자릅니다.

     벽 그림은 아래 기능 줄과 짝을 맞춥니다 — 책장 위에 책상, 창 밑에
     창가 선반. 벽에 붙였던 '안내' 판은 뺐습니다. 안내가 바닥 입간판으로
     내려왔는데 벽에도 같은 판이 있으면 같은 것이 둘이 됩니다. */
  dressRoom(m, IPAL.dorm, [
    { k: 'shelf', x: 1 },                       // 책상 위 벽 책장
    /* 책장과 시계 사이 세 칸이 비어 있었습니다. 내 방 벽에서 가장
       사람다운 것은 **붙여 놓은 포스터**입니다 — 남이 정해 준 것이
       하나도 없는 자리라, 여기 한 장이 걸리면 방이 내 방이 됩니다. */
    { k: 'art', x: 3, pic: 'poster', c: '#2DD4BF' },
    { k: 'clockFace', x: 6 },                   // 기능 둘 사이의 빈 칸 위
    /* 개인방 창. 이 월드에서 가장 값진 창입니다 — 내 방에서 밖을 보는
       자리입니다. 바로 밑(9,3)에 창가 선반이 서고, 그 선반이 창밖 날씨를
       엽니다. 창은 벽 그림이라 다가갈 칸이 없어 혼자서는 못 엽니다. */
    { k: 'win', x: 9, style: 'grid' },
    { k: 'cork', x: 11 },                       // 옷장 위 — 쪽지 붙이는 판
  ]);
  m.clock = { x: 6, y: 0 };

  /* ==================================================================
     ---- 북쪽 벽 (y3~4) : 기능 줄 ----

     방에서 할 수 있는 일이 다섯인데 책상·거울·협탁·옷장으로 사방에
     흩어져 있었습니다. 뭐가 되는 방인지 알려면 방을 한 바퀴 돌아야 했고,
     돌다 보면 그냥 가구인 것(냉장고·곰인형)도 하나씩 눌러 보게 됩니다.

     다섯을 **윗벽 한 줄로** 모읍니다. 윗벽인 이유 —
       · 들어오는 문이 아랫벽 가운데라, 방에 들어서면 정면으로 보는 벽이
         윗벽입니다. 첫 화면에 기능이 전부 들어옵니다.
       · 캐릭터가 절대 가리지 않는 유일한 벽입니다. 사람은 늘 물건보다
         아래(y가 큰 쪽)에 서서 위를 보므로, 아랫벽 물건은 등으로 가립니다.
       · 방이 화면에 통째로 들어오는 크기(14×11)라 한 줄이 곧 목록입니다.

     생김새가 곧 이름입니다 — 달력 켜진 노트북 · 안내 입간판 · 잠긴
     보관함 · 온도계 놓인 창가 선반 · 문 열린 옷장. 다섯 사이는 한 칸씩
     띄웁니다. 붙여 놓으면 어느 것 앞에 선 것인지 발끝으로 재게 됩니다.
     ================================================================== */
  prop(m, 'desk3', 1, 3);                       // 세 칸 책상. 1칸 책상은 책상으로 안 보입니다
  /* 윗벽 한 줄은 **기능**만 세웁니다. 민철님 판의 침대·곰인형·캐리어·
     냉장고는 이 방 아래쪽에 이미 서 있고, 윗줄에 가구를 얹으면 "여기서
     뭘 할 수 있나" 가 가구 사이에 숨습니다. 이 줄이 기숙사의 차림표입니다. */
  prop(m, 'laptopCal', 2, 3); prop(m, 'deskLamp', 3, 3);
  /* 의자는 뺐습니다. 세션 자리는 도서관·본관뿐이라, 앉을 수 없는 의자가
     책상 앞에 있으면 눌러 보고 아무 일도 안 일어나는 자리가 됩니다. */
  prop(m, 'noticeStand', 4, 3);                 // 안내
  prop(m, 'safeBox', 7, 3);                     // 개인정보
  prop(m, 'windowSill', 9, 3);                  // 창밖 날씨 — 창 바로 밑
  prop(m, 'wardrobe', 11, 3);                   // 방 꾸미기
  /* 학교 색이 닿는 응원기. 기능 둘 사이 빈 칸에 걸어 벽을 채웁니다 —
     밟고 지나갈 수 있어 다가서는 길은 안 막습니다. 바닥에 두면 벽걸이가
     방바닥에 떨어져 있는 것으로 보입니다. */
  prop(m, 'pennant', 8, 3);

  /* ==================================================================
     ---- 나머지 가구 : 벽에 붙이고 가운데를 비웁니다 ----

     방을 세 켜로 읽게 했습니다.
       y3~4  기능 줄 (위에서 고정)
       y5~6  **아무것도 없는 마루.** 러그 한 장만 깔려 있습니다.
       y7~8  가구 — 전부 아랫벽과 양옆 벽에 등을 붙입니다.

     가운데 두 줄을 통째로 비우는 것이 이 배치의 전부입니다. 지난 판은
     좌탁·방석·스탠드·화분이 y5~y7 한가운데에 흩어져 있어서, 문에서
     윗벽까지 가는 길이 가구 사이를 비집는 길이었습니다. 지금은 x2~x10
     두 줄이 통째로 뚫려 있어 어디서 어디로든 두 칸 폭으로 지나갑니다.

     러그는 그 빈 가운데에 깝니다. 빈 마루는 복도로 보이고, 러그가
     깔려야 거기가 "방의 가운데" 가 됩니다 — 밟고 지나가도 되는 것이라
     길을 하나도 안 먹습니다.

     문 앞 x6~x8 은 y5 까지 세 칸 폭으로 비웁니다. 들어와서 첫걸음에
     비켜설 것이 없어야 합니다.
     ================================================================== */

  /* ---- 방을 **비워 둡니다** ----
     소파 · 좌탁 · 방석 · 냉장고 · 침대 · 책장 · 협탁 · 빨래바구니 ·
     곰인형 · 거울을 전부 걷었습니다. 처음부터 꽉 찬 방을 주면 방 꾸미기가
     "빈 데를 찾는 일" 이 됩니다 — 놓을 자리가 남아야 꾸미는 것이고,
     상점의 가구가 팔릴 이유도 거기서 생깁니다.

     남기는 것은 셋뿐입니다.
       캐리어  이사 온 지 얼마 안 된 방이라는 표시. 책상 밑이라 길을 안 먹습니다
       스탠드  왼쪽 벽. 밤에 방을 밝히는 등이고, 빈 방에 광원이 하나는 있어야 합니다
       화분    오른쪽 벽. 스탠드와 마주 세워 좌우 균형을 잡습니다
     둘 다 y5 — 이 줄 아래로는 아무것도 없습니다. 거기가 꾸미는 자리입니다. */
  prop(m, 'suitcase', 1, 4);                    // 책상 밑으로 밀어 넣은 캐리어
  prop(m, 'floorLamp', 1, 5);                   // 왼쪽 벽 — 방을 밝히는 등
  prop(m, 'plantTall', 12, 5);                  // 오른쪽 벽 — 스탠드와 마주 봅니다

  /* 창을 여는 자리는 창가 선반, 안내는 입간판 — 전부 y3 한 줄입니다.
     머리 위 표시(drawMarks)가 같은 높이에 다섯 개 뜨고, 그 줄이 곧
     "이 방에서 할 수 있는 일" 목록이 됩니다. */
  m.things = [
    { x: 2, y: 3, name: '노트북 · 시간표', panel: 'calendar' },
    { x: 4, y: 3, name: '안내', panel: 'guide' },
    { x: 7, y: 3, name: '개인정보', panel: 'privacy' },
    { x: 9, y: 3, name: '창밖 보기', panel: 'weather' },
    { x: 11, y: 3, name: '방 꾸미기', panel: 'decor' },
  ];

  /* 문은 가운데입니다(x6~8). 방이 넓어졌으니 구석에 두면 들어와서
     어디로 가야 하는지가 한 번 더 생각할 일이 됩니다. */
  prop(m, 'exitDoor', 6, m.h - 2);
  m.portals.push({ x: 6, y: m.h - 2, w: 3, h: 2, to: 'campus', sx: 21, sy: 11, label: '캠퍼스' });

  /* 여기까지가 방을 지을 때 박아 둔 것입니다. 산 가구는 이 뒤에 붙였다
     뗐다 하므로, 원본을 한 벌 남겨 둡니다 — 안 남기면 가구를 치울 때
     무엇이 원래 있던 것인지 알 수 없습니다. */
  m.baseProps = m.props.slice();
}
/* 가구 코드가 여러 군데에서 이 지도를 찾습니다. ZONES.dorm 을 매번 쓰면
   오타가 조용히 undefined 가 되므로 이름을 하나 둡니다. */
const DORM = ZONES.dorm;
/* ================== 학생회관 ==================
   **볼일 보는 곳.** 다른 방은 시간을 벌고(도서관·본관), 여기는 그 시간을
   씁니다 — 코인을 쓰고(상점), 시즌 순위를 보고(랭킹전), 출석을 확인합니다.

   34×24(816칸) → 25×13(325칸), 60% 줄였습니다. 줄인 것은 **남쪽**입니다:
   전에는 문에서 창구까지 아홉 줄을 걸었는데 그 사이에 아무것도 없었습니다.
   지금은 다섯 걸음이고, 문을 열면 창구 셋이 바로 눈앞에 섭니다.

   **앉을 자리는 두지 않습니다.** 앉는 곳은 도서관과 본관입니다. 여기에
   의자를 놓으면 세션이 두 군데서 도는 방이 됩니다.

   **폭이 25(홀수)인 이유.** 24 로 했더니 문·책상이 3칸(홀수)이라 방 한가운데에
   놓을 수가 없었습니다 — 폭 24 의 기하 중심은 x12 인데 3칸 기물의 중심은 항상
   x.5 에 생겨 늘 0.5칸이 남았습니다. 25 면 내부가 1~23, 중심이 x12.5 라
   3칸 기물이 정확히 가운데 서고, 짝은 `cell x ↔ 24-x` 로 딱 떨어집니다. */
{
  const m = makeMap(25, 13, F.gray);
  ZONES.union = m; m.name = '학생회관'; m.sub = '볼일 보는 곳';

  ring(m, 0, 0, m.w, m.h, F.brickO);
  fillBase(m, 1, 1, m.w - 2, 2, F.brickO);
  m.floor = paintFloor(m.w, m.h, 'tile'); m.floorKind = SURF.TILE;
  /* 창구 셋이 각자 같은 크기의 깔개를 깔고 섭니다 — 상점 x3~5,
     출석 x11~13, 랭킹 x19~21. 짝은 x ↔ 24-x 로 정확히 맞습니다. */
  floorInlay(m.floor, 3, 3, 3, 4, 'runner');            // 상점
  floorInlay(m.floor, 11, 3, 3, 4, 'runner');           // 출석
  floorInlay(m.floor, 19, 3, 3, 4, 'runner');           // 랭킹전
  floorInlay(m.floor, 1, 3, m.w - 2, m.h - 5, 'border');
  /* 빛도 책상 한가운데. desk3 는 x·x+1·x+2 를 쓰므로 가운데가 x+1.5 입니다. */
  floorGlow(m.floor, 4.5, 6, 3.4);
  floorGlow(m.floor, 12.5, 6, 3.4);
  floorGlow(m.floor, 20.5, 6, 3.4);

  /* ---- 창구 셋 ----
     **NPC 하나에 책상 하나.** 전에는 상점과 랭킹전이 책상을 둘씩 쓰고
     뒤에 진열대·게시판까지 세워서, 창구가 아니라 부스처럼 보였습니다.
     NPC 뒤는 전부 비웁니다 — 사람이 주인공이고 책상은 그 앞에 하나면
     "여기서 말을 건다" 가 읽힙니다.

     책상 셋은 NPC 칸의 한가운데에 옵니다: 미르 x4(중심 4.5)에 책상 x3~5,
     도윤 x12(중심 12.5)에 x11~13, 하연 x20(중심 20.5)에 x19~21. */
  prop(m, 'desk3', 3, 5);      // 상점
  prop(m, 'desk3', 11, 5);     // 출석
  prop(m, 'desk3', 19, 5);     // 랭킹전

  /* NPC 는 책상 뒤(y4), 사람은 앞(y6~)에서 말을 겁니다 — 카운터 너머
     1칸 대화라는 문법을 셋이 똑같이 씁니다.
     미르 x4 ↔ 하연 x20 이 짝이고, 도윤 x12 는 중심 12.5 로 문과 한 축입니다. */
  m.npcs.push(
    /* 미르는 동아리 상점으로 옮겨 갔습니다(알 가게). 빈 창구를 그냥 두면
       "준비 중" 자리가 되므로, 캠퍼스 안내를 여기로 올립니다 — 건물이
       여섯이 되고 가게·미니게임이 흩어진 지금, "그건 어디서 하지" 에
       답하는 창구가 하나 필요합니다. */
    { x: 4, y: 4, sprite: 210, species: '백조', dir: 'down',
      worn: { top: 'top-shirt', bottom: 'bot-slacks', shoes: 'sho-dress' },
      name: '안내 · 세연', panel: 'aboutUnion',
      line: '처음이면 여기서 물어봐. 어디서 뭘 하는지는 내가 제일 잘 알아.' },
    /* 도윤에게는 창이 없어서 대사 한 줄만 뜨고 끝났습니다 — 창구 셋 중
       하나만 기능이 아니었습니다. 연속 출석과 오늘 획득은 코인 창이 이미
       세고 있으므로 새 창을 만들지 않고 그것을 엽니다. (민철님) */
    { x: 12, y: 4, sprite: 131, species: '개구리', dir: 'down',
      worn: { top: 'top-tee', bottom: 'bot-trainer', shoes: 'sho-sneaker', bag: 'bag-backpack' },
      name: '출석 · 도윤', panel: 'coins',
      line: '오늘 거 아직 안 찍혔는데. 도서관이든 본관이든 한 세션만 채우고 와.' },
    /* 남은 날은 대사에 안 적습니다 — 지도를 만들 때 굳어 버려서, 며칠이
       지나도 같은 숫자를 말하게 됩니다. 숫자는 창이 그때그때 셉니다. */
    { x: 20, y: 4, sprite: 185, species: '알파카', dir: 'down',
      worn: { top: 'top-shirt', bottom: 'bot-slacks', shoes: 'sho-dress', hat: 'hat-grad' },
      name: '랭킹전 · 하연', panel: 'hall',
      line: '이번 시즌 순위는 앉은 시간이랑 회복 횟수야. 자세에는 점수 안 매겨. 그건 안 하기로 했어.' },
  );

  /* ---- 북쪽 벽 ----
     한동안 창만 넷이었습니다("시계·현수막·공지를 걸어 봤는데 검수에서
     전부 빠졌습니다"). 그때 빠진 이유는 건 것이 **아무 데나 걸려
     있었기** 때문입니다 — 벽이 벽 얘기를 하고, 밑에 선 창구는 창구
     얘기를 따로 했습니다.

     이번에는 **창구 위에만** 겁니다. 벽에 걸린 것이 밑에 선 창구가
     무엇을 하는 자리인지 말합니다.
       안내 창구(x3~5) 위   게시판  — 어디서 뭘 하는지 붙어 있는 자리
       출석 창구(x11~13) 위 시계    — 오늘이 찍혔나를 묻는 자리
       랭킹전 창구(x19~21) 위 트로피 — 시즌 순위를 보는 자리
     짝도 그대로입니다: 게시판 x6 ↔ 트로피 x17 이 픽셀 기준으로 정확한
     좌우 대칭이고(94~130 ↔ 270~306), 시계는 방 한가운데(x12.5=200px)에
     정확히 옵니다 — 문·출석 창구와 한 축입니다. */
  dressRoom(m, IPAL.union, [
    { k: 'win', x: 3, style: 'shop' },
    { k: 'notice', x: 6 },
    { k: 'win', x: 9, style: 'shop' },
    { k: 'clockFace', x: 12 },
    { k: 'win', x: 15, style: 'shop' },
    { k: 'trophy', x: 17 },
    { k: 'win', x: 21, style: 'shop' },
  ]);
  /* 벽시계 바늘은 진짜 시각으로 매 프레임 덧그립니다. 이 줄이 없으면
     멈춘 시계가 걸립니다(dressRoom 의 clockFace 주석). */
  m.clock = { x: 12, y: 0 };

  /* ---- 문에서 창구까지 ----
     아랫절반(y7~10)이 통째로 빈 타일이었습니다. 문(x11~13)에서 가운데
     창구까지 띠를 이어 셋 중 어디로 가든 한 번은 밟는 길을 만듭니다 —
     창구 셋의 깔개와 같은 무늬라 넷이 한 벌로 읽힙니다. */
  floorInlay(m.floor, 11, 7, 3, 4, 'runner');
  /* 창빛 넷. 창구 빛웅덩이(y6)보다 위라 서로 안 겹칩니다. */
  [3.5, 9.5, 15.5, 21.5].forEach((wx) => floorGlow(m.floor, wx, 4.2, 2.8));

  /* ---- 기다리는 자리 ----
     이 방에 앉을 자리를 안 두기로 했던 이유는 "의자를 놓으면 세션이 두
     군데서 도는 방이 된다" 였습니다. 그 이유가 **없어졌습니다** — 세션과
     웹캠은 이제 FOCUS(도서관·본관)에서만 돌고, 나머지 자리는 그냥 앉는
     자리입니다(sit 참고). 볼일 보러 와서 차례를 기다리는 곳에 앉을 데가
     없는 것이 오히려 이상합니다.
     양옆 벽에 붙여 가운데는 그대로 비웁니다. 좌면이 막는 것은 벽 쪽
     네 칸뿐이고, 문에서 창구로 가는 x4~x15 는 통째로 뚫려 있습니다. */
  prop(m, 'bench', 2, 9); prop(m, 'bench', 21, 9);
  prop(m, 'plantTall', 1, 9); prop(m, 'plantTall', 23, 9);

  /* 안내는 문 오른쪽, 아래벽 앞 — 들어오는 사람 눈높이입니다.
     이것만 짝이 없습니다: 문(x11~13)이 가운데를 쓰므로 대칭 자리가 문 안에
     들어갑니다. 길잡이 한 장이라 대칭 구성에서 뺍니다. */
  prop(m, 'board', 16, 9);
  m.things = [
    { x: 16, y: 9, name: '학생회관 안내', panel: 'aboutUnion' },
    /* 랭킹전은 하연이 자리를 비워도 볼 수 있어야 합니다. 뒤 게시판을
       없앴으므로 창구 책상 자체가 그 입구를 겸합니다. */
    { x: 20, y: 5, name: '이번 시즌 랭킹전', panel: 'hall' },
  ];

  /* 나가는 곳 — 네 건물이 전부 같은 문입니다. 건물마다 다르면
     "여기가 출구" 를 매번 새로 배워야 합니다.
     문 세 칸 x11~13 의 중심이 x12.5 로 방 중심·출석 창구와 한 줄입니다. */
  prop(m, 'exitDoor', 11, m.h - 2);
  m.portals.push({ x: 11, y: m.h - 2, w: 3, h: 2, to: 'campus', sx: 21, sy: 39, label: '캠퍼스' });
}

/* ================== 미니게임관 ==================
   관문 넷이 광장 자갈마당에 흩어져 있었습니다. 넷을 다 보려면 마당을 한
   바퀴 돌아야 했고, 비가 오면 밖에 서서 골라야 했습니다. 한 방에 **한
   줄로** 세웁니다 — 문을 열고 서면 넷이 한눈에 들어오고, 고르는 데
   걸음이 필요 없습니다.

   방을 넓게 잡지 않았습니다(23x13). 여기는 3분 쉬고 나가는 방이라,
   가로지르는 데 시간이 드는 순간 쉬는 곳이 아니라 들르는 곳이 됩니다. */
{
  const m = makeMap(23, 13, F.gray);
  ZONES.arcade = m; m.name = '미니게임관'; m.sub = '3분만 놀고 가는 곳';

  ring(m, 0, 0, m.w, m.h, F.brickO);
  fillBase(m, 1, 1, m.w - 2, 2, F.brickO);
  m.floor = paintFloor(m.w, m.h, 'tile'); m.floorKind = SURF.TILE;
  floorInlay(m.floor, 1, 3, m.w - 2, m.h - 5, 'border');
  /* 관문 앞을 가로지르는 띠. 자주입니다 — 이 방은 청록이 한 번도 안
     나오는 유일한 실내이고, 그게 겉의 자주 지붕과 짝입니다. */
  floorInlay(m.floor, 1, 7, m.w - 2, 2, 'runner', '110,82,168');

  /* ---- 관문 넷, 한 줄 ----
     넷이 나란히 서고 좌우 여백이 한 칸씩 같습니다(x1, x21). 가운데로
     몰거나 한쪽에 붙이면 문이 다섯 개인데 하나가 빠진 것처럼 보입니다.
     순서는 왼쪽부터 **몸 · 머리 · 기억 · 손**입니다 — 같은 종류가 붙어
     있으면 둘 중 뭘 골랐는지 나중에 헷갈립니다.
     색은 자리에 붙은 것이라 넷이 서로 다릅니다(코랄·청록·노랑·보라).
     이름표를 못 읽는 거리에서도 "아까 그 노란 문" 으로 찾아집니다. */
  /* 문 안에 서서 Space. 자리는 관문 왼쪽 위 칸이고, 만지는 거리는
     bake 가 관문 크기(4x4)로 잡아 줍니다. 넷의 자리·이름·패널은
     전부 MINIGAMES 가 들고 있습니다. */
  placeMinigames(m, 'arcade');

  /* ---- 안내소 게시판 ----
     이 방은 이제 미니게임을 다 가진 방이 아니라, **어디에 무엇이 있는지
     알려 주는 방**입니다. 게임 넷은 그대로 두고, 밖에 흩어진 것들을
     여기서 찾습니다. 문에서 관문으로 가는 길 오른쪽 — 들어오면서
     지나치는 자리입니다. */
  prop(m, 'dirBoard', 18, 9);
  m.things.push({ x: 18, y: 9, name: '안내소', panel: 'arcade' });

  /* ---- 나머지는 벽 쪽으로 ----
     관문 아랫줄(y7~8)은 통째로 비웁니다. 넷 앞에 서는 자리이자 넷 사이를
     옮겨 다니는 길이라, 여기 물건을 두면 고르는 동안 걸립니다. */
  prop(m, 'vending', 1, 9); prop(m, 'vending2', 2, 9);
  prop(m, 'bench', 4, 9);
  prop(m, 'bench', 14, 9);
  prop(m, 'plantTall', 21, 9);
  prop(m, 'plant', 21, 3); prop(m, 'plantS', 1, 8);

  m.npcs.push(
    { x: 8, y: 9, sprite: 212, species: '기린', dir: 'down',
      worn: { top: 'top-tee', bottom: 'bot-shorts', shoes: 'sho-sneaker', hat: 'hat-cap' },
      name: '미니게임관 · 세아',
      lines: [
        '어서 와. 여기 문 넷은 바로 할 수 있고,',
        '나머지는 밖에 흩어져 있어. 운동장이랑 호수랑 도서관.',
        '저기 안내소 판 봐. 어디 있는지 다 적혀 있고 눌러서 바로 갈 수도 있어.',
        '코인은 게임마다 하루 한 번. 그 뒤로는 그냥 재미로 하는 거야.',
      ] },
  );

  /* 벽 — 관문 사이 빈 칸 위에만 창을 냅니다. 관문 뒤에 내면 아치에
     가려 반쪽만 보입니다. 가운데는 시계입니다 — 3분 놀고 돌아가는 방에
     시계가 없으면 그 3분을 잴 방법이 없습니다. */
  /* 창 둘과 시계 하나뿐이라 관문 넷 위가 텅 비어 있었습니다. 놀러 오는
     방인데 벽이 제일 조용했어요. 자주 현수막 둘을 양 끝에 걸고(관문 색
     넷 중 이 방을 대표하는 색), 창과 시계 사이에 액자 둘을 겁니다 —
     왼쪽은 기록판(chart), 오른쪽은 포스터입니다. 오락실 벽에 붙는 것이
     그 둘이고, 둘이 서로 달라야 좌우가 도장 찍은 것으로 안 보입니다.
     자리는 픽셀 기준 좌우 대칭입니다(방 폭 368px 기준
     현수막 48~64 ↔ 304~320 · 액자 131~157 ↔ 211~237). */
  dressRoom(m, IPAL.arcade, [
    { k: 'banner', x: 3, c: '#6E52A8' },
    { k: 'win', x: 6, style: 'round' },
    { k: 'art', x: 8, pic: 'chart' },
    { k: 'clockFace', x: 11 },
    { k: 'art', x: 13, pic: 'poster', c: '#E8C34A' },
    { k: 'win', x: 16, style: 'round' },
    { k: 'banner', x: 19, c: '#6E52A8' },
  ]);
  m.clock = { x: 11, y: 0 };
  /* 창빛 둘 — 관문 사이 통로(x6·x16)에 떨어집니다. 관문 앞에 서는
     자리라 여기가 밝아야 넷을 고르는 동안 방이 안 어둡습니다. */
  [6.5, 16.5].forEach((wx) => floorGlow(m.floor, wx, 4.4, 3.2));

  /* 나가는 곳 — 다섯 건물이 전부 같은 문입니다. */
  prop(m, 'exitDoor', 10, m.h - 2);
  m.portals.push({ x: 10, y: m.h - 2, w: 3, h: 2, to: 'campus', sx: 37, sy: 11, label: '캠퍼스' });
}

/* ================== 동아리 상점 ==================
   가게 셋이 한 지붕 아래 있습니다 — **옷 · 가구 · 알**.

   천막 셋으로 길에 늘어놓았다가 건물로 들였습니다. 길에 두면 셋이
   한눈에 보이는 대신, 파는 물건을 **진열할 자리**가 없습니다. 옷 가게에
   옷걸이가 없고 가구 가게에 가구가 안 놓여 있으면, 그건 가게가 아니라
   이름표가 붙은 천막입니다.

   방은 25×15. 학생회관(25×13)보다 두 줄 깊습니다 — 창구만 있는 방과
   달리 여기는 **진열대가 카운터 뒤에** 서야 하고, 그 한 켜가 가게와
   창구를 가릅니다.

   셋의 자리는 왼쪽부터 **옷 · 가구 · 알**입니다. 값이 싼 것에서 비싼
   것으로 갑니다(100~400 · 60~420 · 800). 들어오자마자 800짜리 알이
   눈앞에 있으면 그 방은 비싼 가게로 기억됩니다. */
{
  const m = makeMap(25, 15, F.gray);
  ZONES.clubshop = m; m.name = '동아리 상점'; m.sub = '옷 · 가구 · 알';

  ring(m, 0, 0, m.w, m.h, F.brickR);
  fillBase(m, 1, 1, m.w - 2, 2, F.brickR);
  m.floor = paintFloor(m.w, m.h, 'tile'); m.floorKind = SURF.TILE;
  /* 가게 셋이 각자 깔개를 깔고 섭니다. 학생회관 창구와 같은 치수(3×4)라
     "창구가 셋" 이라는 문법이 두 건물에서 같습니다. 짝은 x ↔ 24-x. */
  floorInlay(m.floor, 3, 4, 3, 4, 'runner', '196,84,74');
  floorInlay(m.floor, 11, 4, 3, 4, 'runner', '196,84,74');
  floorInlay(m.floor, 19, 4, 3, 4, 'runner', '196,84,74');
  floorInlay(m.floor, 1, 3, m.w - 2, m.h - 5, 'border');
  floorGlow(m.floor, 4.5, 7, 3.4);
  floorGlow(m.floor, 12.5, 7, 3.4);
  floorGlow(m.floor, 20.5, 7, 3.4);

  /* ---- 진열대 (y3) ----
     카운터 **뒤**입니다. 실제 상점 문법이고, 앞에 두면 손님이 진열대를
     넘어 말을 걸어야 합니다. 파는 것이 무엇인지 그림으로 먼저 말합니다.

     알 가게만 가게로 보였습니다 — 알 넷이 나란히 서 있었기 때문입니다.
     옷 가게는 옷장 하나와 거울 하나, 가구 가게는 책장 하나와 화분
     하나뿐이었고, 그 넷은 기숙사에도 도서관에도 있는 물건이라 뒤에
     서 있어도 무엇을 파는지 말해 주지 않았습니다.

     그래서 셋 다 **그 가게에서만 나올 물건**으로 뒷벽을 채웁니다.
     옷 가게는 x1~6, 가구 가게는 x8~16, 알 가게는 종전대로 x19~23.
     가구 가게는 방 한가운데 축(x12.5) 을 그대로 씁니다 — 벽 꾸미기와
     창구 셋이 이미 그 축을 쓰고 있어서, 진열만 어긋나면 방이 기울어

  prop(m, 'clothRack', 1, 3); prop(m, 'wardrobe', 3, 3);

  prop(m, 'eggTurtle', 19, 3); prop(m, 'eggGiraffe', 20, 3);

  /* ---- 창구 옆 진열 (y7) ----
     뒷벽만 채우면 진열이 전부 카운터 너머로 갑니다. 신어 보는 신발과

     카운터 앞 세 칸(x3~5 · x11~13 · x19~21)은 반드시 비워 둡니다 —

  prop(m, 'mirror', 1, 7); prop(m, 'shoeShelf', 6, 7);

  prop(m, 'desk3', 3, 6);      // 옷

  prop(m, 'desk3', 19, 6);     // 알

  m.npcs.push(
    { x: 4, y: 5, sprite: 92, species: '알파카', dir: 'down',

    { x: 12, y: 5, sprite: 44, species: '햄스터', dir: 'down',
      worn: { top: 'top-tee', bottom: 'bot-trainer', shoes: 'sho-sneaker', bag: 'bag-tote' },
      name: '가구 가게 · 우진', panel: 'shopFurn',
      line: '사면 보관함으로 들어가. 놓는 건 네 방 옷장 앞에서 해 — 여기서 놓으면 내 가게가 좁아지잖아.' },
    /* 미르는 학생회관 상점 창구에서 여기로 왔습니다. 알은 종을 바꾸는

    { x: 20, y: 5, sprite: 266, species: '고슴도치', dir: 'down',

      name: '알 가게 · 미르', panel: 'shopEgg',
      line: '알 하나 깨고 나온 얼굴이네. 나머지 일곱도 여기 있어. 안 싸.' },
  );

  /* ---- 벽 ----
     창 둘 사이에 코르크판. 가게 벽이라 시계는 안 답니다 — 물건 고르는

     현수막 16~32 ↔ 368~384 · 액자 51~77 ↔ 323~349 · 창 88~120 ↔ 280~312 ·
     코르크판 130~158 ↔ 242~270. 가운데 노란 천 한 장(192~208)이 축입니다.

  dressRoom(m, IPAL.clubshop, [

  /* 문에서 가운데 가게까지 띠 하나. 가게 셋의 깔개와 같은 붉은색이라

/* ==================================================================
   탈것 — 캠퍼스가 넓어져서 생긴 물건

   존이 일곱이 되고 미니게임이 흩어지면서, 광장에서 동아리 상점까지
   걸어가는 데 스무 걸음이 넘습니다. 지도(M)로 건너뛸 수는 있지만 그건
   **월드를 건너뛰는 것**이라 자주 쓰면 걸어 다닐 이유가 사라집니다.
   걷는 것을 빠르게 만드는 쪽이 맞습니다.

   옷과 같은 칸(worn)에 들어가지만 **그림은 옷과 다른 길로 갑니다.**
   옷은 종마다 몸 실루엣에 맞춰 자른 32×48 시트를 겹치는데, 탈것은
   종과 상관없이 **발밑에 한 장** 깔면 됩니다. 자전거는 거북이가 타나
   기린이 타나 같은 자전거입니다. 그래서 sprite 는 null 로 두고
   (종이인형 합성이 조용히 건너뜁니다) 여기서 따로 그립니다.

   속도는 곱입니다. 걷기 54 · 뛰기 92 에 곱하므로, 탈것을 타고 Shift 를
   누르면 둘이 겹칩니다 — 그게 맞습니다. 자전거로 언덕을 내려가는 것과
   같습니다. 다만 곱이 2 를 넘으면 한 프레임에 한 칸 넘게 움직여서
   벽 검사(canStand)를 뛰어넘습니다. 그래서 1.8 이 천장입니다.
   ================================================================== */
/* pose 는 **어떻게 타는가** 입니다. 서서 타는 것과 앉아서 타는 것을
   같은 그림으로 두면, 자전거 위에 사람이 **서 있는** 것으로 보입니다
   (실제로 그 지적을 받았습니다).
     stand  킥보드 · 롤러스케이트 — 실제로 서서 탑니다
     sit    자전거 · 구름 — 안장과 구름 위에 앉습니다
   seatY 는 앉은 몸을 안장 높이까지 더 올리는 값입니다. 앉기 자세는
   원래 의자(타일 바닥에서 12px) 기준으로 맞춰져 있어서, 안장이 그보다
   높으면 그 차이만큼 더 올려야 엉덩이가 안장에 닿습니다. */
const RIDES = {
  'ride-skate': { mult: 1.30, lift: 0, name: '롤러스케이트', pose: 'stand', seatY: 0 },
  'ride-kick':  { mult: 1.45, lift: 0, name: '킥보드',      pose: 'stand', seatY: 0 },
  'ride-bike':  { mult: 1.60, lift: 0, name: '자전거',      pose: 'sit',   seatY: 7 },
  'ride-cloud': { mult: 1.80, lift: 3, name: '구름',        pose: 'sit',   seatY: 2 },
};
const RIDE_ART = {};
/** 지금 탄 것. 안 탔으면 null. */
function myRide() {
  const id = (ROOM.worn || {}).ride;
  return id && RIDES[id] ? { id, ...RIDES[id] } : null;
}
/** 걷는 속도에 곱할 값. 앉아 있으면 1 — 앉아서 빨라질 것은 없습니다. */
function rideMult() {
  const r = myRide();
  return r && !player.sitting ? r.mult : 1;
}

/* 옆모습과 앞모습 두 장씩. 위에서 내려다보는 지도라 뒤에서 본 것과
   앞에서 본 것이 거의 같아, 앞모습 한 장을 위아래로 같이 씁니다. */
function paintRides() {
  const mk = () => { const c = canvasOf(2, 1); return [c, c.getContext('2d')]; };
  const TIRE = '#2A2320', RIM = '#B9C2C8', SPOKE = '#8A939B';

  /* ---- 자전거 ---- */
  {
    const [cs, gs] = mk();                       // 옆
    shadow(gs, 16, 15, 12, 2);
    const wheel = (cx) => {
      disc(gs, cx, 10, 5, TIRE); disc(gs, cx, 10, 3, RIM); disc(gs, cx, 10, 1, SPOKE);
    };
    wheel(7); wheel(25);
    px(gs, 9, 6, 14, 2, '#2DD4BF');              // 프레임 윗대
    px(gs, 11, 8, 10, 1, '#12A592');
    px(gs, 22, 3, 2, 4, '#5F6874');              // 안장 기둥
    px(gs, 20, 2, 6, 2, '#4A3323');              // 안장
    px(gs, 8, 2, 2, 5, '#5F6874');               // 핸들 기둥
    px(gs, 5, 1, 7, 2, '#2A2320');               // 핸들
    RIDE_ART['ride-bike'] = { side: cs };
    const [cf, gf] = mk();                       // 앞
    shadow(gf, 16, 15, 9, 2);
    disc(gf, 11, 11, 4, TIRE); disc(gf, 21, 11, 4, TIRE);
    disc(gf, 11, 11, 2, RIM);  disc(gf, 21, 11, 2, RIM);
    px(gf, 13, 6, 6, 5, '#2DD4BF');
    px(gf, 8, 3, 16, 2, '#2A2320');              // 핸들 가로대
    px(gf, 15, 1, 2, 3, '#5F6874');
    RIDE_ART['ride-bike'].front = cf;
  }

  /* ---- 킥보드 ---- */
  {
    const [cs, gs] = mk();
    shadow(gs, 16, 15, 10, 2);
    disc(gs, 9, 12, 3, TIRE); disc(gs, 24, 12, 3, TIRE);
    disc(gs, 9, 12, 1, RIM);  disc(gs, 24, 12, 1, RIM);
    px(gs, 8, 9, 18, 2, '#E8695A');              // 발판
    px(gs, 8, 9, 18, 1, '#FFA694');
    px(gs, 8, 3, 2, 7, '#B9C2C8');               // 기둥
    px(gs, 5, 2, 8, 2, '#2A2320');               // 손잡이
    RIDE_ART['ride-kick'] = { side: cs };
    const [cf, gf] = mk();
    shadow(gf, 16, 15, 7, 2);
    disc(gf, 16, 12, 3, TIRE); disc(gf, 16, 12, 1, RIM);
    px(gf, 12, 9, 9, 2, '#E8695A');
    px(gf, 15, 3, 2, 7, '#B9C2C8');
    px(gf, 10, 2, 12, 2, '#2A2320');
    RIDE_ART['ride-kick'].front = cf;
  }

  /* ---- 롤러스케이트 — 발에 신는 것이라 가장 작습니다 ---- */
  {
    const skate = (g, cx) => {
      px(g, cx - 4, 9, 8, 3, '#F0EBE2');          // 부츠
      px(g, cx - 4, 9, 8, 1, '#FFFFFF');
      px(g, cx - 4, 12, 8, 1, '#8A939B');         // 밑판
      disc(g, cx - 2, 14, 1, TIRE); disc(g, cx + 2, 14, 1, TIRE);
    };
    const [cs, gs] = mk(); shadow(gs, 16, 15, 8, 2); skate(gs, 12); skate(gs, 21);
    RIDE_ART['ride-skate'] = { side: cs };
    const [cf, gf] = mk(); shadow(gf, 16, 15, 8, 2); skate(gf, 11); skate(gf, 22);
    RIDE_ART['ride-skate'].front = cf;
  }

  /* ---- 구름 — 유일하게 바퀴가 없습니다. 그림자를 흐리게 깔아
         "떠 있다" 를 그림자로도 말합니다. ---- */
  {
    const [cs, gs] = mk();
    gs.globalAlpha = 0.5; shadow(gs, 16, 15, 10, 2); gs.globalAlpha = 1;
    disc(gs, 11, 10, 5, '#FFFFFF'); disc(gs, 20, 10, 6, '#FFFFFF');
    disc(gs, 16, 8, 6, '#FFFFFF');
    disc(gs, 11, 11, 4, '#E4EDF4'); disc(gs, 21, 11, 4, '#E4EDF4');
    px(gs, 6, 11, 20, 2, '#D2DEE8');
    RIDE_ART['ride-cloud'] = { side: cs, front: cs };
  }
}
paintRides();

/* ---------------- 충돌 굽기 ---------------- */
function bake(m) {
  m.solid = new Uint8Array(m.w * m.h);
  for (let y = 0; y < m.h; y++) for (let x = 0; x < m.w; x++) {
    const i = at(m, x, y);
    const b = m.base[i];
    if (b === F.brickR || b === F.brickO) m.solid[i] = 1;
    if (m.over[i] === M.WATER) m.solid[i] = 1;
    /* 표면은 존이 직접 칠한 자리(트랙·자갈)를 남기고 나머지만 유도합니다.
       실내는 바닥 한 장이 방 전체라 방의 재질이 곧 표면입니다. */
    if (!m.surf[i]) {
      if (m.over[i] === M.WATER) m.surf[i] = SURF.WATER;
      else if (m.over[i]) m.surf[i] = SURF.STONE;          // 포장·판석
      else if (m.floorKind) m.surf[i] = m.floorKind;
    }
  }
  m.sitSpots = [];
  /* 만질 수 있는 물건이 몇 칸을 차지하는지 여기서 한 번만 잽니다.
     예전에는 findNearby 가 프레임마다 props 를 훑어 같은 답을 냈습니다 —
     한 존에 소품이 이백 개가 넘고 그걸 60번 반복했습니다. */
  for (const t of m.things || []) {
    const d = PROP[(m.props.find((q) => q.x === t.x && q.y === t.y) || {}).kind];
    t.w = d ? d.w : 1; t.h = d ? d.h : 1;
    t.top = d && d.anchor === 0 ? 1 : 0;      // 밟고 지나가는 물건은 표시를 낮게
  }
  for (const p of m.props) {
    const d = PROP[p.kind];
    for (let j = 0; j < d.h; j++) for (let i = 0; i < d.w; i++) {
      if (!inMap(m, p.x + i, p.y + j)) continue;
      if (d.c[j][i]) m.solid[at(m, p.x + i, p.y + j)] = 1;
    }
    /* 앉는 칸은 기물마다 다릅니다 — 의자는 자기 칸 하나, 벤치는 좌면
       두 칸(PROP.bench 의 seats). 여기서 한 번에 펴 둡니다. */
    if (d.sit) for (const [sx, sy] of d.seats || [[0, 0]])
      if (inMap(m, p.x + sx, p.y + sy))
        m.sitSpots.push({ x: p.x + sx, y: p.y + sy, dir: d.sitDir || null });
  }
  /* ---- 어느 쪽을 보고 앉나 ----
     여태 앉으면 **무조건 위**를 봤습니다. 그래서 책상 아래쪽 줄에 앉은
     사람은 책상을 보는데, 위쪽 줄에 앉은 사람은 책상에 등을 지고
     허공을 봤습니다. 도서관 열람석은 여섯 명이 마주 앉는 자리라
     절반이 등을 돌리고 있던 셈입니다.

     자리마다 **책상이 어느 쪽에 있는지**를 보고 정합니다. 의자 종류
     (chair · chairC)로 정하지 않는 이유는, 본관에서는 둘 다 책상 아래에
     서 있어서 종류와 방향이 안 맞기 때문입니다. 책상은 옮겨도 규칙이
     따라옵니다 — 마주 보는 것이 규칙이지 의자 이름이 규칙이 아닙니다. */
  /* 새 책상·탁자를 여기 안 넣으면 그 앞에 앉은 사람이 전부 위를 봅니다
     (아래 기본값). 긴 열람대는 열두 명이 마주 앉는 자리라, 빠뜨리면
     여섯 명이 등을 돌린 채로 굳습니다 — 종전에 겪은 그대로입니다. */
  const DESKISH = new Set(['desk', 'desk2', 'desk3', 'carrel', 'tableLong', 'tableLong2', 'podium',
                           'deskShelf', 'tableStudy', 'tableStudy3', 'tableRound']);
  const deskAt = (x, y) => m.props.some((q) => {
    if (!DESKISH.has(q.kind)) return false;
    const d2 = PROP[q.kind];
    return x >= q.x && x < q.x + d2.w && y >= q.y && y < q.y + d2.h;
  });
  for (const sp of m.sitSpots) {
    /* 그림이 이미 방향을 정한 자리(벤치)는 책상 규칙에 안 맡깁니다.
       등받이가 어느 쪽인지는 기물이 아는 사실이고, 그 자리 옆에 우연히
       책상이 서 있다고 등받이가 옮겨 가지는 않습니다. */
    if (sp.dir) continue;
    sp.dir = deskAt(sp.x, sp.y - 1) ? 'up'
           : deskAt(sp.x, sp.y + 1) ? 'down'
           : 'up';                                   // 책상이 없으면 종전대로
  }
  for (const n of m.npcs) m.solid[at(m, n.x, n.y)] = 1;
  for (const po of m.portals)
    for (let j = 0; j < po.h; j++) for (let i = 0; i < po.w; i++)
      if (inMap(m, po.x + i, po.y + j)) m.solid[at(m, po.x + i, po.y + j)] = 0;
}
Object.values(ZONES).forEach(bake);

   drawImage 축소로 못 바꾸는 이유 - 다수결은 보간도 최근접도 아니라서
   결과가 달라집니다. school48.png 이 바뀌면 git 히스토리의 downscale3() 를

   32px 를 잘라 오므로 한 칸 아래·오른쪽 타일까지 딸려 나옵니다. */
function blitU(i, dx, dy) { ctx.drawImage(urban, (i % U_COLS) * TS, ((i / U_COLS) | 0) * TS, TS, TS, dx, dy, T, T); }
function blitC(i, dx, dy) { ctx.drawImage(city,  (i % C_COLS) * TS, ((i / C_COLS) | 0) * TS, TS, TS, dx, dy, T, T); }
function blitK(i, dx, dy) { ctx.drawImage(school,(i % K_COLS) * TS, ((i / K_COLS) | 0) * TS, TS, TS, dx, dy, T, T); }
const BLIT = { u: blitU, c: blitC, k: blitK };

/** 코드로 그린 그림 한 장을 월드에 얹습니다.

    캔버스마다 자기 눈금(__cell)을 적어 두므로, 나중에 프롭 하나를 32px
    원본으로 다시 그려 __cell 만 32 로 바꾸면 그 프롭만 확대 없이 1:1 로
    나옵니다. 16px 짜리와 섞여 있어도 됩니다. */
function blitArt(img, dx, dy) {
  const k = T / (img.__cell || TS);
  ctx.drawImage(img, dx, dy, img.width * k, img.height * k);
}

/** 이웃을 보고 테두리 타일을 고릅니다. 지도 밖은 같은 재질로 칩니다.
    모서리는 시트가 그린 대로 둥급니다 — 잔디 위 포장은 그게 맞습니다.
    직각이 필요한 못은 타일을 안 쓰고 바닥에 직접 그립니다(paintPond). */
function autoTile(m, x, y, mat) {
  const same = (i, j) => !inMap(m, i, j) || m.over[at(m, i, j)] === mat;
  const r = !same(x, y - 1) ? 0 : (!same(x, y + 1) ? 2 : 1);
  const c = !same(x - 1, y) ? 0 : (!same(x + 1, y) ? 2 : 1);
  return AUTO[mat].t[r * 3 + c];
}

/* ==================================================================
   소리 - 전부 만들어 씁니다

   음원 파일을 받지 않습니다. 라이선스도 용량도 0 이고, 무엇보다 표면마다
   음색을 손으로 깎을 수 있습니다. 발소리 여섯 종을 사려면 팩을 사야
   하는데, 사도 잔디와 자갈이 우리 그림과 맞는다는 보장이 없습니다.

   전부 잡음(white noise)에 필터를 걸어 만듭니다. 발소리는 본래 넓은
   대역의 짧은 잡음이고, 재질은 **어느 대역이 남느냐** 로 갈립니다.
     잔디  낮은 대역만 남기고 부드럽게      1.4kHz 아래
     포석  가운데가 서고 꼬리가 짧게        2.6kHz 둘레
     마루  낮게 울리고 통이 있는 소리        700Hz + 공명
     타일  높고 아주 짧게                    3.5kHz 위
     자갈  넓게 부서지는 소리                길이를 두 배로
     물    낮게 떨어지는 소리                필터를 쓸어내림

   **조용해야 합니다.** 공부하는 도구라 소리가 존재를 주장하면 안 됩니다.
   기본 음량을 낮게 잡고, 끌 수 있게 두고, 브라우저 규칙대로 첫 입력
   전에는 아예 만들지 않습니다.
   ================================================================== */
const SFX = (function () {
  let ac = null, master = null;
  let muted = localStorage.getItem('girin.mute') === '1';
  let noiseBuf = null;

  /* 오디오는 사용자가 무언가를 누른 뒤에만 만들 수 있습니다. 미리 만들면
     브라우저가 정지 상태로 두고, 그 사실을 알려 주지도 않습니다. */
  function ctx() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ac = new AC();
      master = ac.createGain();
      master.gain.value = muted ? 0 : 0.5;
      master.connect(ac.destination);
      /* 2 초짜리 잡음 한 통을 만들어 두고 잘라 씁니다. 소리마다 새로
         만들면 발을 뗄 때마다 88,200 개를 채우게 됩니다. */
      const len = ac.sampleRate * 2;
      noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }

  /** 잡음 한 조각을 필터에 통과시켜 냅니다. 발소리는 전부 이 함수입니다. */
  function burst(o) {
    const c = ctx(); if (!c || muted) return;
    const src = c.createBufferSource();
    src.buffer = noiseBuf;
    src.playbackRate.value = o.rate || 1;
    /* 통 안의 아무 데서나 시작합니다 - 같은 자리를 쓰면 매번 똑같이
       들려서 기계가 됩니다. */
    const off = Math.random() * 1.5;

    const f = c.createBiquadFilter();
    f.type = o.type || 'lowpass';
    f.frequency.value = o.freq;
    f.Q.value = o.q || 1;

    const g = c.createGain();
    const t = c.currentTime;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(o.gain, t + (o.attack || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);

    src.connect(f); f.connect(g); g.connect(master);
    src.start(t, off, o.dur + 0.02);
    src.stop(t + o.dur + 0.02);

    /* 필터를 쓸어내리면 물이 됩니다 */
    if (o.sweepTo) f.frequency.exponentialRampToValueAtTime(o.sweepTo, t + o.dur);
  }

  /** 소리 나는 물체. 의자 삐걱과 문 여닫이가 여기서 나옵니다. */
  function tone(o) {
    const c = ctx(); if (!c || muted) return;
    const osc = c.createOscillator();
    osc.type = o.wave || 'sawtooth';
    const t = c.currentTime;
    osc.frequency.setValueAtTime(o.from, t);
    osc.frequency.exponentialRampToValueAtTime(o.to, t + o.dur);

    const f = c.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = o.cut || 900; f.Q.value = 2;

    const g = c.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(o.gain, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);

    osc.connect(f); f.connect(g); g.connect(master);
    osc.start(t); osc.stop(t + o.dur + 0.02);
  }

  /* 표면별 발소리. 같은 발이라도 왼발 오른발이 조금 다르게 들려야 하므로
     부를 때마다 음높이를 흔듭니다. */
  const STEP = {
    0: (v) => burst({ freq: 1400, type: 'lowpass', dur: 0.075, gain: 0.045 * v, rate: 0.9 + Math.random() * 0.25 }),
    1: (v) => burst({ freq: 2600, type: 'bandpass', q: 1.4, dur: 0.055, gain: 0.055 * v, rate: 0.95 + Math.random() * 0.2 }),
    2: (v) => burst({ freq: 700,  type: 'lowpass', q: 3, dur: 0.085, gain: 0.06 * v, rate: 0.85 + Math.random() * 0.2 }),
    3: (v) => burst({ freq: 3500, type: 'highpass', dur: 0.04, gain: 0.04 * v, rate: 1 + Math.random() * 0.25 }),
    4: (v) => burst({ freq: 1800, type: 'lowpass', dur: 0.22, gain: 0.07 * v, sweepTo: 300, rate: 0.8 + Math.random() * 0.2 }),
    5: (v) => burst({ freq: 3000, type: 'bandpass', q: 0.8, dur: 0.11, gain: 0.05 * v, rate: 0.9 + Math.random() * 0.3 }),
    6: (v) => burst({ freq: 1100, type: 'lowpass', q: 2, dur: 0.065, gain: 0.05 * v, rate: 0.9 + Math.random() * 0.2 }),
  };

  return {
    /** 첫 입력에서 부릅니다. 브라우저가 그때부터 소리를 허락합니다. */
    unlock() { ctx(); },
    step(surf, running) { (STEP[surf] || STEP[0])(running ? 1.25 : 1); },
    /* 문 - 걸쇠가 딸깍하고 경첩이 돌아갑니다. 둘을 겹쳐야 문이 됩니다. */
    door() {
      burst({ freq: 3200, type: 'bandpass', q: 3, dur: 0.03, gain: 0.06 });
      setTimeout(() => burst({ freq: 900, type: 'lowpass', dur: 0.18, gain: 0.05, sweepTo: 400 }), 40);
    },
    /* 의자 - 나무가 삐걱이는 건 음높이가 흔들리며 내려가는 소리입니다 */
    chair(up) {

             dur: up ? 0.16 : 0.24, gain: 0.035, cut: 700 });
    },
    /* 물 첨벙 */
    splash() { burst({ freq: 2200, type: 'lowpass', dur: 0.3, gain: 0.05, sweepTo: 350 }); },
    get muted() { return muted; },
    set muted(v) {
      muted = !!v;
      localStorage.setItem('girin.mute', muted ? '1' : '0');

/* ==================================================================
   발밑 자국 - 월드가 나를 알아본다는 유일한 신호

   스타듀에서 걷는 게 기분 좋은 이유의 절반이 여기 있습니다. 걸어도
   아무 일이 없으면 배경 위를 미끄러지는 것이고, 자국이 남으면 땅을
   밟는 것이 됩니다.

   셋을 한 목록으로 굴립니다. 종류마다 배열을 두면 갱신도 그리기도 세
   벌이 되고, 어느 하나를 지우는 걸 잊습니다.

   **모두 캐릭터 뒤, 소품 아래에 깔립니다.** 화면 가운데를 조용히 두는
   규칙이라, 발밑 자국이 캐릭터를 덮으면 안 됩니다.

   움직임을 줄이고 싶다는 설정이면 자국을 아예 만들지 않습니다.

const FX = {
  list: [],
  reduced: matchMedia('(prefers-reduced-motion: reduce)').matches,

  /* 목록 안은 전부 **그림 눈금(TS)** 입니다. 월드 좌표로 받은 것은 들어올
     때 한 번 나누고, 그릴 때 한 번 곱합니다. 자국 크기를 정한 숫자들이
     전부 16px 격자에서 눈으로 맞춘 값이라, 여기서 단위를 바꾸면 눌린 풀
     한 포기까지 다시 눈대중해야 합니다. */

  /** 밟힌 잔디. 눌렸다 펴지는 데 0.8 초 - 걸음보다 느려야 자국이 이어집니다. */
  press(x, y) {
    if (this.reduced) return;
    this.list.push({ k: 'press', x: x / AS, y: y / AS, t: 0, life: 0.8,
                     r: 5 + Math.random() * 2, a: Math.random() * Math.PI });
  },

  /** 뛸 때 이는 먼지. 진행 반대쪽으로 밀려나며 떠오릅니다. */
  dust(x, y, dx, dy) {
    if (this.reduced) return;
    for (let i = 0; i < 2; i++) {
      this.list.push({ k: 'dust',
                       x: x / AS + (Math.random() - 0.5) * 5, y: y / AS - Math.random() * 2,
                       vx: -dx / AS * 7 + (Math.random() - 0.5) * 9,
                       vy: -dy / AS * 7 - 5 - Math.random() * 6,
                       t: 0, life: 0.45 + Math.random() * 0.2, r: 1.6 + Math.random() * 1.4 });
    }
  },

  /** 물가 파문. 물칸 한가운데에서 고리가 퍼집니다. */
  ripple(tx, ty) {
    if (this.reduced) return;
    this.list.push({ k: 'ripple', x: tx * TS + TS / 2, y: ty * TS + TS / 2,
                     t: 0, life: 1.1, r: 2 });
  },

  /** 클릭해서 걸어갈 칸. 0.4 초 동안 고리 하나가 오므라들며 옅어집니다.
      여기만 `reduced` 를 안 봅니다 - 나머지 셋은 월드를 살아 보이게 하는
      장식이지만 이 고리는 "눌렸다" 는 **답**이고, 답을 못 받으면 클릭이
      먹었는지 아닌지를 알 길이 없습니다. 대신 튀거나 흔들리지 않게
      제자리에서 오므라들기만 합니다. */
  goal(tx, ty) {
    /* 앞엣것을 지우고 새로 놓습니다. 빠르게 두 번 누르면 고리가 겹쳐
       뜨는데, 누른 사람은 마지막 한 번만 기억합니다 - 길도 마지막
       것으로 갈아타므로 표시도 같이 갈아타야 말이 맞습니다. */
    const L = this.list;
    for (let i = L.length - 1; i >= 0; i--) if (L[i].k === 'goal') L.splice(i, 1);
    L.push({ k: 'goal', x: tx * TS + TS / 2, y: ty * TS + TS / 2, t: 0, life: 0.4 });
  },

  update(dt) {
    const L = this.list;
    for (let i = L.length - 1; i >= 0; i--) {
      const f = L[i];
      f.t += dt;
      if (f.k === 'dust') {
        f.x += f.vx * dt; f.y += f.vy * dt;
        f.vy += 26 * dt;              // 떠오르다 가라앉습니다
        f.vx *= 0.94; f.vy *= 0.96;
      }
      if (f.t >= f.life) L.splice(i, 1);
    }
    /* 손을 놓아도 목록이 안 자라도록 - 프레임이 밀리면 자국이 쌓입니다 */
    if (L.length > 160) L.splice(0, L.length - 160);
  },

  /** 바닥 위, 소품 아래. camX/camY 는 그리는 쪽이 넘겨 줍니다. */
  draw(g, cx, cy) {
    /* 그림 눈금으로 그린 뒤 통째로 늘립니다. 정수로 반올림한 뒤 늘리므로
       자국이 반 픽셀에 걸리지 않습니다. */
    g.save();
    g.scale(AS, AS);
    cx /= AS; cy /= AS;
    const vw = VIEW_W / AS, vh = VIEW_H / AS;
    for (const f of this.list) {
      const k = f.t / f.life;              // 0 -> 1
      const x = f.x - cx, y = f.y - cy;
      if (x < -30 || y < -30 || x > vw + 30 || y > vh + 30) continue;

      if (f.k === 'press') {
        /* 눌린 풀. 처음 0.15 는 눌린 채로 있다가 서서히 펴집니다 -
           바로 펴지기 시작하면 밟은 느낌이 안 납니다. */
        const hold = Math.min(1, k / 0.18);
        const back = k < 0.35 ? 1 : 1 - (k - 0.35) / 0.65;
        /* 잔디(#5B9E52)와 색이 가까우면 아무리 알파를 올려도 안 보입니다.
           한 단계 더 내려간 초록으로 눌러야 곁눈에 걸립니다. */
        g.globalAlpha = 0.46 * hold * back;
        g.fillStyle = '#2E6234';
        const rx = f.r, ry = f.r * 0.45;
        for (let dy = -ry; dy <= ry; dy++) {
          const w = Math.floor(rx * Math.sqrt(Math.max(0, 1 - (dy * dy) / (ry * ry))));
          g.fillRect(Math.round(x - w), Math.round(y + dy), w * 2 + 1, 1);
        }
        /* 눕는 풀잎 두 가닥 - 이게 있어야 "눌렸다" 로 읽힙니다 */
        g.globalAlpha = 0.6 * hold * back;
        g.fillStyle = '#24512A';
        const bx = Math.round(x + Math.cos(f.a) * 3), by = Math.round(y + Math.sin(f.a) * 1.5);
        g.fillRect(bx, by - 1, 2, 1);
        g.fillRect(bx - 3, by, 2, 1);

      } else if (f.k === 'dust') {
        g.globalAlpha = 0.36 * (1 - k);
        g.fillStyle = '#CFC4AB';
        const r = Math.max(1, Math.round(f.r * (1 + k)));
        g.fillRect(Math.round(x - r / 2), Math.round(y - r / 2), r, r);

      } else if (f.k === 'ripple') {
        /* 고리 하나가 퍼지며 옅어집니다. 원을 정수 격자로 그려야
           확대했을 때 흐려지지 않습니다. */
        g.globalAlpha = 0.5 * (1 - k);
        g.fillStyle = '#DCEEF5';
        const r = Math.round(f.r + k * 9);
        for (let dy = -r; dy <= r; dy++) {
          const w = Math.floor(Math.sqrt(Math.max(0, r * r - dy * dy)));
          const wi = Math.floor(Math.sqrt(Math.max(0, (r - 1) * (r - 1) - dy * dy)));
          if (w <= 0) continue;
          g.fillRect(Math.round(x - w), Math.round(y + dy * 0.55), w - wi, 1);
          g.fillRect(Math.round(x + wi), Math.round(y + dy * 0.55), w - wi, 1);
        }

      } else if (f.k === 'goal') {
        /* 파문은 퍼지고 이 고리는 **오므라듭니다** - 퍼지는 고리는 무엇이
           떨어진 자리이고, 오므라드는 고리는 가리키는 자리입니다. 7 에서
           4 로(그림 눈금), 칸 하나가 16 이니 고리가 칸 밖으로 안 나갑니다.
           두 겹으로 그립니다. 청록 한 색으로는 잔디(#5B9E52) 위에서
           묻힙니다 - 문턱을 코랄에서 청록으로 바꿀 때 겪은 그대로라 같은
           처방(어두운 테가 형태를 맡고 밝은 색이 그 안에서 숨만 쉽니다)을
           씁니다. */
        const r = 7 - k * 3;
        g.globalAlpha = 0.55 * (1 - k); g.fillStyle = '#0C5A4F';
        this.ring(g, x, y, r + 1, r - 2);
        g.globalAlpha = 0.92 * (1 - k); g.fillStyle = '#2DD4BF';
        this.ring(g, x, y, r, r - 1.6);
      }
    }
    g.globalAlpha = 1;
    g.restore();
  },

  /** 바닥에 놓인 타원 고리 한 겹. ro/ri 는 가로 반지름이고 세로는 그
      절반입니다 - 정원으로 그리면 바닥이 아니라 공중에 뜬 표적으로
      보입니다(파문과 같은 규칙).
      파문처럼 원을 그린 뒤 y 를 눌러 찍지 않고 **찍을 줄부터** 세는
      이유는, 눌러서 찍으면 두 줄이 같은 자리에 겹쳐 그 줄만 두 배로
      진해지기 때문입니다. 알파를 쓰는 그림에서는 그 줄이 눈에 띕니다. */
  ring(g, x, y, ro, ri) {
    const oy = ro * 0.5, iy = ri * 0.5;
    const cx = Math.round(x), cy = Math.round(y);
    for (let dy = -Math.round(oy); dy <= Math.round(oy); dy++) {
      const u = 1 - (dy * dy) / (oy * oy);
      if (u <= 0) continue;
      const wo = Math.round(ro * Math.sqrt(u));
      const v = iy > 0 ? 1 - (dy * dy) / (iy * iy) : -1;
      const wi = v > 0 ? Math.round(ri * Math.sqrt(v)) : 0;
      if (wi <= 0) { g.fillRect(cx - wo, cy + dy, wo * 2 + 1, 1); continue; }
      g.fillRect(cx - wo, cy + dy, wo - wi + 1, 1);
      g.fillRect(cx + wi, cy + dy, wo - wi + 1, 1);
    }
  },

  clear() { this.list.length = 0; },
};


/* ==================================================================
   바람

   살아 있는 월드는 물건이 저마다 떨어서가 아니라 **같은 바람**을 함께
   받아서 살아 있습니다. 풀과 천막과 물결이 제각각 주기로 흔들리면
   화면이 시끄럽고, 하나의 시계를 나눠 쓰면 들판이 됩니다.

   그래서 파도 하나를 지도 위로 흘려보내고 위치마다 위상만 달리해
   읽습니다 - 왼쪽 풀이 눕고 잠시 뒤 오른쪽 풀이 눕습니다.
   ================================================================== */
const WIND = {
  t: 0,
  update(dt) { this.t += dt; },

  /** 세기 0.55 ~ 1. 40 초쯤에 한 번 크게 붑니다 - 세기가 일정하면
      바람이 아니라 선풍기입니다. */
  gust() {
    return 0.55 + 0.45 * (0.5 + 0.5 * Math.sin(this.t * 0.157) * Math.sin(this.t * 0.083 + 2.1));
  },

  /** 지도 위 한 점이 지금 받는 바람. -1 .. 1 */
  at(px, py) {
    if (FX.reduced) return 0;
    /* 사인 둘을 겹칩니다. 하나면 메트로놈이고, 주기가 어긋난 둘이면
       같은 모양이 돌아오는 데 한참 걸립니다. */
    const p = this.t * 0.9 - px * 0.055 - py * 0.028;
    return (Math.sin(p) * 0.66 + Math.sin(p * 2.37 + 1.7) * 0.34) * this.gust();
  },
};

const frac = (v) => v - Math.floor(v);
const hash1 = (n) => frac(Math.sin(n * 127.1 + 311.7) * 43758.5453);
const rgbOf = (c) => 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';

/* ==================================================================
   날씨

   창밖이 늘 같으면 창은 벽에 그린 그림입니다. 진짜 날씨 API 를 붙이면
   위치를 물어야 하고 오프라인에서 죽으므로, 날짜와 시각만으로 정해지는
   느린 곡선을 씁니다 - 같은 날 들어온 사람은 같은 하늘을 보고, 몇 시간
   앉아 있으면 한 번쯤 바뀝니다.

   비는 도서관 백색소음과 짝입니다. 소리와 창이 같은 말을 해야 합니다.
   ================================================================== */
const WX = { CLEAR: 0, RAIN: 1, SNOW: 2 };

const WEATHER = {
  override: null,           // 시험용 - 0..1 궂은 정도

  /* 기상청 단기예보를 받아 왔으면 여기 들어갑니다(setRealWeather).
     못 받았으면 null 이고, 그러면 아래 절차적 곡선을 그대로 씁니다 —
     **가짜 예보를 지어내지 않습니다.** 창밖은 둘 중 하나입니다:
     진짜 서울 하늘이거나, 원래 쓰던 "날짜와 시각으로 정해지는 하늘".
     자세한 것은 아래 REAL_WEATHER 묶음에 적었습니다. */
  real: null,               // { pty, sky, tempC, pop, at }

  /** 정수 격자에서만 난수를 뽑고 사이를 부드럽게 잇습니다. 매 시각마다
      새로 뽑으면 날씨가 아니라 깜빡임이 됩니다. */
  noise(t) {
    const i = Math.floor(t), f = t - i, u = f * f * (3 - 2 * f);
    return hash1(i) * (1 - u) + hash1(i + 1) * u;
  },

  raw() {
    if (this.override !== null) return this.override;
    const day = Math.floor(Date.now() / 864e5);
    /* 6 시간에 한 칸. 한 세션 안에서 바뀔 수도, 안 바뀔 수도 있는
       속도입니다 - 그래야 바뀐 것이 사건이 됩니다. */
    return this.noise(day * 4.13 + TIME.hour() / 6);
  },

  /** 0(안 옴) ~ 1(퍼붓는 중). 가장자리가 부드러워야 뚝 켜지지 않습니다. */
  strength() {
    /* override 는 **0~1 숫자**입니다. 'clear' 같은 글자를 넣으면 아래
       tint 계산이 통째로 NaN 이 되고, 캔버스는 rgb(NaN,...) 을 조용히
       무시해서 **직전 프레임 색이 그대로 남습니다** — 화면이 흐리게
       번진 것처럼 보이는데 오류는 한 줄도 안 납니다. 시험 스크립트에서
       실제로 겪었습니다. 숫자가 아니면 없는 것으로 봅니다. */
    if (this.override !== null && Number.isFinite(+this.override))
      return Math.max(0, Math.min(1, +this.override));
    if (this.real) {
      /* 안 오면 0. 오면 강수확률을 세기로 씁니다.
         바닥을 0.3 으로 두는 이유: 확률 20% 짜리 비도 "오긴 오는" 것이라
         창밖에 한 방울도 안 지나가면 예보와 화면이 다른 말을 합니다. */
      if (!this.real.pty) return 0;
      return Math.max(0.3, Math.min(1, (this.real.pop || 0) / 100));
    }
    return Math.max(0, Math.min(1, (this.raw() - 0.58) / 0.26));
  },

  kind() {
    if (this.strength() <= 0) return WX.CLEAR;
    /* 진짜 예보가 있으면 눈인지 비인지도 예보가 정합니다.
       PTY 2 비/눈 · 3 눈 · 6 빗방울눈날림 · 7 눈날림 */
    if (this.real && this.override === null) {
      return [2, 3, 6, 7].includes(this.real.pty) ? WX.SNOW : WX.RAIN;
    }
    /* 12 · 1 · 2 월은 눈. 계절이 창밖에 있어야 1 년을 쓰는 월드가 됩니다. */
    const m = new Date().getMonth();
    return (m === 11 || m < 2) ? WX.SNOW : WX.RAIN;
  },
};

/* ---- 창밖 색 ----
   하늘 기본색에 지금 빛 색을 곱합니다. 정오엔 흰색을 곱하니 그냥 파랗고,
   노을엔 주황이 섞이고, 밤엔 가라앉습니다 - 하늘 표를 두 벌 만들 필요가
   없습니다. 궂으면 파란 기가 빠져 잿빛으로 갑니다. */
function outsideColor(ground) {
  const t = TIME.tint(), w = WEATHER.strength();
  let b = ground ? [96, 120, 86] : [152, 194, 230];
  if (w > 0) {
    const grey = ground ? [84, 90, 86] : [158, 164, 172];
    b = b.map((v, i) => v + (grey[i] - v) * w);
  }
  const dim = 1 - TIME.darkness() * 0.5 - w * 0.1;
  return b.map((v, i) => Math.max(0, Math.min(255, Math.round(v * t[i] / 255 * dim))));
}

/* ---- 화면 비 ----
   바깥에 서 있을 때 내리는 것. 화면 좌표로 굴립니다 - 탑다운이라 비는
   카메라 앞을 지나갑니다.

   방울마다 **떨어질 높이**를 따로 가집니다. 화면 아래까지 다 내려가게
   두면 위에서 아래로 흐르는 커튼이 되는데, 위에서 내려다보는 그림에서
   비는 화면 아무 데나 떨어져야 합니다.

   눈금은 그림 눈금(TS)입니다. 캔버스가 몇 픽셀이든 방울 굵기가 사람과
   같은 비로 보여야 합니다 — 캔버스 픽셀로 두면 SCALE 을 내린 만큼
   빗줄기가 가늘어지고 수도 성기어집니다. 그릴 때 통째로 늘립니다. */
const PRECIP = {
  drops: [], splash: [], kind: -1,

  /** 그림 눈금으로 잰 화면 크기 */
  vw() { return VIEW_W / AS; },
  vh() { return VIEW_H / AS; },

  make(k, anywhere) {
    const snow = k === WX.SNOW;
    const VIEW_W = this.vw(), VIEW_H = this.vh();
    return {
      x: Math.random() * (VIEW_W + 80) - 40,
      y: anywhere ? Math.random() * VIEW_H : -14 - Math.random() * 40,
      land: snow ? VIEW_H + 40 : Math.random() * (VIEW_H + 16),
      /* 빠른 것과 느린 것을 섞습니다. 다 같은 속도면 벽지 무늬입니다. */
      z: 0.55 + Math.random() * 0.45,
      len: snow ? 1 + Math.round(Math.random()) : 5 + Math.random() * 7,
      ph: Math.random() * Math.PI * 2,
    };
  },

  update(dt, kind, strength) {
    const VIEW_W = this.vw();
    const want = (kind === WX.CLEAR || FX.reduced) ? 0
      : Math.round((kind === WX.SNOW ? 52 : 150) * strength);
    if (kind !== this.kind) { this.drops.length = 0; this.splash.length = 0; this.kind = kind; }
    while (this.drops.length > want) this.drops.pop();
    while (this.drops.length < want) this.drops.push(this.make(kind, true));

    const snow = kind === WX.SNOW, w = WIND.gust();
    for (const d of this.drops) {
      if (snow) {
        d.y += (16 + d.z * 24) * dt;
        d.x += (Math.sin(WIND.t * 0.8 + d.ph) * 10 + w * 13) * dt;
      } else {
        d.y += (300 + d.z * 340) * dt;
        d.x += w * 42 * dt;
      }
      if (d.y >= d.land) {
        if (!snow && this.splash.length < 80) this.splash.push({ x: d.x, y: d.land, t: 0 });
        Object.assign(d, this.make(kind, false));
      }
      if (d.x < -44) d.x += VIEW_W + 80;
      else if (d.x > VIEW_W + 44) d.x -= VIEW_W + 80;
    }
    for (let i = this.splash.length - 1; i >= 0; i--) {
      if ((this.splash[i].t += dt) > 0.22) this.splash.splice(i, 1);
    }
  },

  draw(g, kind) {
    if (!this.drops.length) return;
    const snow = kind === WX.SNOW;
    g.save();
    g.scale(AS, AS);
    if (snow) {
      g.fillStyle = '#FFFFFF';
      for (const d of this.drops) {
        g.globalAlpha = 0.4 + d.z * 0.5;
        g.fillRect(Math.round(d.x), Math.round(d.y), d.len, d.len);
      }
    } else {
      /* 빗줄기는 세로 사각형 둘입니다. 대각선을 그으면 16px 격자에서
         계단이 드러납니다. 아래 토막만 1px 밀어 기울기를 냅니다. */
      g.fillStyle = '#CBDCEE';
      const tilt = WIND.gust() > 0.78 ? 1 : 0;
      for (const d of this.drops) {
        g.globalAlpha = 0.22 + d.z * 0.28;
        const h = Math.max(2, Math.round(d.len * d.z)), a = h - (h >> 1);
        const x = Math.round(d.x), y = Math.round(d.y);
        g.fillRect(x, y, 1, a);
        g.fillRect(x + tilt, y + a, 1, h >> 1);
      }
      /* 떨어진 자리. 비가 아무것도 때리지 않으면 화면에 붙은 무늬로
         보입니다 - 땅에 닿는 순간이 있어야 비입니다. */
      g.fillStyle = '#E4EEF8';
      for (const s of this.splash) {
        const k = s.t / 0.22, r = 1 + k * 2;
        g.globalAlpha = 0.5 * (1 - k);
        g.fillRect(Math.round(s.x - r), Math.round(s.y), 1, 1);
        g.fillRect(Math.round(s.x + r), Math.round(s.y), 1, 1);
      }
    }
    g.restore();
    g.globalAlpha = 1;
  },
};

/* ---- 유리 뒤의 비 ----
   창은 10px 남짓입니다. 화면 비를 그대로 잘라 넣으면 한 방울도 안
   걸리므로, 창 안에서만 도는 촘촘한 벌을 따로 셈합니다. 목록을 두지
   않고 시각에서 바로 계산합니다 - 창마다 배열을 들고 있을 이유가 없고,
   존을 옮겨도 이어집니다. */
function paneWeather(g, x, y, w, h, kind, t) {
  const snow = kind === WX.SNOW;
  const n = snow ? 6 : 11;
  g.fillStyle = snow ? '#FFFFFF' : '#DCE9F6';
  for (let i = 0; i < n; i++) {
    const a = hash1(i * 3.1), b = hash1(i * 7.7 + 5);
    const sp = snow ? 6 + a * 6 : 34 + a * 38;
    const px0 = x + Math.floor(b * w);
    const py0 = y + frac((t * sp) / (h + 8) + a) * (h + 8) - 4;
    const len = snow ? 1 : Math.max(2, Math.round(2 + a * 3));
    if (py0 + len < y || py0 > y + h) continue;
    const top = Math.max(y, py0), bot = Math.min(y + h, py0 + len);
    g.globalAlpha = snow ? 0.85 : 0.5 + a * 0.3;
    g.fillRect(px0, Math.round(top), 1, Math.max(1, Math.round(bot - top)));
  }
  /* 유리에 맺혀 흘러내리는 물줄기. 뒤에서 내리는 비보다 훨씬 느리고
     밝습니다 - 이게 있어야 "유리 이쪽" 과 "유리 저쪽" 이 갈립니다. */
  if (!snow) {
    g.fillStyle = '#F2F8FF';
    for (let i = 0; i < 2; i++) {
      const a = hash1(i * 19.3 + 2);
      const px0 = x + 1 + Math.floor(a * Math.max(1, w - 2));
      const py0 = y + frac(t * 0.11 + a) * (h + 6) - 3;
      const top = Math.max(y, py0), bot = Math.min(y + h, py0 + 5);
      if (bot <= top) continue;
      g.globalAlpha = 0.32;
      g.fillRect(px0, Math.round(top), 1, Math.max(1, Math.round(bot - top)));
    }
  }
  g.globalAlpha = 1;
}

/* ---- 창밖 ----
   벽을 그린 뒤 유리 자리에 하늘과 땅을 칠하고, 창 한 장을 다시 덮어
   틀과 창살로 가립니다. 지평선을 그어야 색면이 아니라 **바깥**이 됩니다. */
function drawWindows(g, m, camX, camY) {
  if (!m.wins || !m.wins.length) return;
  const sky = rgbOf(outsideColor(false)), grd = rgbOf(outsideColor(true));
  const kind = WEATHER.kind(), dark = TIME.darkness();
  const t = WIND.t;
  /* 창틀·유리 좌표는 벽 그림(TS 눈금) 안에서 잰 값입니다. 벽과 같은
     배율로 늘려야 하늘이 유리 자리에 정확히 들어갑니다. */
  g.save();
  g.scale(AS, AS);
  camX /= AS; camY /= AS;
  const vw = VIEW_W / AS, vh = VIEW_H / AS;
  for (const win of m.wins) {
    for (const r of win.glass) {
      const x = Math.round(r[0] - camX), y = Math.round(r[1] - camY);
      if (x > vw || y > vh || x + r[2] < 0 || y + r[3] < 0) continue;
      const hz = Math.max(1, Math.round(r[3] * 0.64));
      g.fillStyle = sky; g.fillRect(x, y, r[2], hz);
      g.fillStyle = grd; g.fillRect(x, y + hz, r[2], r[3] - hz);
      /* 밤이면 지평선 아래 먼 불빛 두엇. "밖에 학교가 있다" 는 말을
         가장 적은 픽셀로 하는 방법입니다. */
      if (dark > 0.35 && r[2] >= 6) {
        g.fillStyle = '#FFD98A';
        g.globalAlpha = Math.min(1, (dark - 0.35) / 0.4);
        for (let i = 0; i < 2; i++) {
          const a = hash1(r[0] * 3.7 + i * 11.1);
          g.fillRect(x + 1 + Math.floor(a * (r[2] - 2)), y + hz + (i % 2), 1, 1);
        }
        g.globalAlpha = 1;
      }
      if (kind !== WX.CLEAR && !FX.reduced) {
        g.save();
        g.beginPath(); g.rect(x, y, r[2], r[3]); g.clip();
        paneWeather(g, x, y, r[2], r[3], kind, t);
        g.restore();
      }
    }
  }
  for (const win of m.wins) g.drawImage(win.c, Math.round(win.x - camX), Math.round(-camY));
  g.restore();
}

/* ==================================================================
   구름 그림자

   맑은 날에만 있습니다. 해가 없으면 그림자도 없고, 비 오는 날 구름
   그림자를 깔면 어디서 오는 빛인지 설명이 안 됩니다.

   지도 좌표로 흘러갑니다 - 화면에 붙여 두면 걸을 때 그림자가 따라와
   유리에 낀 얼룩이 됩니다.
   ================================================================== */
const CLOUDS = {
  blob: null,
  /* 여섯 장, 저마다 크기와 속도가 다릅니다. 같은 속도로 흐르면 한 장을
     여섯 번 복사한 것이 바로 보입니다. */
  set: [
    { x: 0.05, y: 0.14, s: 2.8, v: 7.0 }, { x: 0.31, y: 0.62, s: 4.1, v: 4.6 },
    { x: 0.52, y: 0.08, s: 3.3, v: 9.1 }, { x: 0.68, y: 0.44, s: 5.0, v: 3.4 },
    { x: 0.84, y: 0.78, s: 2.4, v: 11.0 }, { x: 0.18, y: 0.90, s: 3.7, v: 6.2 },
  ],

  /** 부드러운 덩어리 한 장. 원 하나면 접시라 세 개를 겹쳐 어긋뜨립니다. */
  make() {
    const R = 64, c = document.createElement('canvas');
    c.width = c.height = R * 2;
    const g = c.getContext('2d');
    for (const [ox, oy, rr] of [[0, 0, 1], [-0.42, -0.16, 0.66], [0.38, 0.2, 0.58]]) {
      const cx = R + ox * R, cy = R + oy * R, rad = R * rr;
      const grad = g.createRadialGradient(cx, cy, 0, cx, cy, rad);
      grad.addColorStop(0, 'rgba(0,0,0,0.9)');
      grad.addColorStop(0.5, 'rgba(0,0,0,0.45)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grad;
      g.fillRect(0, 0, R * 2, R * 2);
    }
    this.blob = c;
    return c;
  },

  draw(g, m, camX, camY) {
    if (FX.reduced || m.floor) return;      // 실내에는 해가 안 듭니다
    const sun = (1 - TIME.darkness() * 1.4) * (1 - WEATHER.strength());
    if (sun < 0.06) return;
    const b = this.blob || this.make();
    /* 구름은 지도 위를 흐르므로 크기도 지도 눈금입니다 — 타일이 커지면
       그림자도 같이 커져야 같은 크기의 구름이 지나갑니다. */
    const pad = 260 * AS;
    const span = m.w * T + pad * 2;
    g.save();
    g.globalAlpha = 0.14 * sun;
    for (const c of this.set) {
      const r = 60 * AS * c.s;
      /* 흐르는 속도도 지도 눈금입니다 — c.v 를 그대로 두면 지도가 두 배가
         된 만큼 구름이 느려 보입니다. */
      const wx = frac(c.x + (WIND.t * c.v * AS) / span) * span - pad;
      const wy = c.y * m.h * T;
      const sx = wx - camX - r, sy = wy - camY - r * 0.6;
      if (sx > VIEW_W || sy > VIEW_H || sx + r * 2 < 0 || sy + r * 1.2 < 0) continue;
      /* 세로로 눌러 그립니다. 위에서 내려다보면 그림자는 해가 기운
         만큼 늘어난 타원이지 원이 아닙니다. */
      g.drawImage(b, sx, sy, r * 2, r * 1.2);
    }
    g.restore();
    g.globalAlpha = 1;
  },
};

/* ==================================================================
   풀포기

   잔디는 한 장으로 구운 그림이라 흔들 수 없습니다. 그 위에 포기를
   흩뿌리고 포기만 눕힙니다.

   기울기 다섯을 미리 그려 두고 골라 씁니다 - 매 프레임 잘라 붙이면
   포기 하나에 drawImage 가 서넛씩 들고, 미리 구우면 하나면 됩니다.
   16px 에서는 어차피 1px 단위로만 눕습니다.
   ================================================================== */
const TUFT = {
  /* 세 모양 × 다섯 자세. 한 모양만 쓰면 잔디밭이 도장 찍은 것이 됩니다.
     [뿌리 x, 키, 색] - 뒤쪽 잎을 어둡게 두면 포기에 두께가 생깁니다. */
  shapes: [
    [[5, 5, '#3E7A3D'], [7, 7, '#5FA855'], [9, 4, '#4C8C46']],
    [[6, 4, '#4C8C46'], [8, 6, '#6FBA60'], [10, 5, '#3E7A3D'], [4, 3, '#5FA855']],
    [[7, 6, '#5FA855'], [9, 3, '#3E7A3D']],
  ],
  bake: null,

  make() {
    this.bake = this.shapes.map((blades) => BEND.map((b) => {
      const c = canvasOf(1, 1), g = c.getContext('2d');
      for (const [bx, h, col] of blades) {
        g.fillStyle = col;
        for (let i = 0; i < h; i++) {
          /* 뿌리는 붙어 있고 끝이 가장 많이 휩니다 - 제곱이라야
             풀이 눕지, 통째로 미끄러지지 않습니다. */
          const k = h > 1 ? i / (h - 1) : 0;
          g.fillRect(Math.round(bx + b * k * k), 14 - i, 1, 1);
        }
        g.fillStyle = 'rgba(38,74,40,.34)';   // 뿌리 그늘
        g.fillRect(bx, 15, 1, 1);
        g.fillStyle = col;
      }
      return c;
    }));
    return this.bake;
  },

  /** 존 하나의 포기 자리를 한 번만 정합니다. 잔디이고 못 밟는 칸이
      아니어야 합니다 - 건물 밑이나 물 위에 풀이 자라면 안 됩니다. */
  scatter(m) {
    if (m.floor || !m.surf) return [];
    const out = [];
    for (let y = 0; y < m.h; y++) for (let x = 0; x < m.w; x++) {
      const i = at(m, x, y);
      if (m.surf[i] !== SURF.GRASS || m.solid[i] || m.over[i]) continue;
      const r = hash1(x * 73.13 + y * 151.7);
      if (r > 0.24) continue;
      out.push({
        px: x * T + (Math.floor(hash1(x * 5.1 + y * 9.3) * 12) + 2) * AS,
        py: y * T + Math.floor(hash1(x * 2.7 + y * 17.9) * 8) * AS,
        s: Math.floor(r * 12.5) % 3,
      });
    }
    return out;
  },

  /* 움직임을 줄이는 설정이면 포기는 그대로 두되 눕지 않습니다.
     지워 버리면 잔디밭이 밋밋해지고, 그건 접근성이 아니라 손해입니다. */
  draw(g, m, camX, camY) {
    if (!m.tufts || !m.tufts.length) return;
    const bake = this.bake || this.make();
    for (const t of m.tufts) {
      const x = t.px - camX, y = t.py - camY;
      if (x < -T || y < -T || x > VIEW_W || y > VIEW_H) continue;
      const b = Math.max(0, Math.min(4, Math.round(WIND.at(t.px, t.py) * 2) + 2));
      blitArt(bake[t.s][b], x, y);
      drawCount++;
    }
  },
};

/* 포기 자리는 존마다 한 번만 정합니다. 매번 다시 뿌리면 화면을 옮길
   때마다 풀이 다른 데서 자랍니다. */
Object.values(ZONES).forEach((m) => { m.tufts = TUFT.scatter(m); });


/* ==================================================================
   시각과 빛

   진짜 시계가 하늘을 움직입니다. 3 시에 앉아 고개를 드니 노을이면,
   월드가 "얼마나 앉아 있었는지" 를 숫자 없이 말해 줍니다. 학생은 밤에
   공부하니 제품 사실과도 맞습니다.

   ---- 색 ----
   밝기만 낮추면 회색이 됩니다. 픽셀아트의 기본은 **어두운 쪽을 파랑·
   보라로 식히고 채도를 낮추며, 밝은 쪽을 노랑으로 데우는** 것입니다.
   그래서 아래 표는 밝기 한 축이 아니라 색 그 자체를 적었습니다.

   값은 곱셈 합성에 그대로 들어갑니다. 정오가 흰색(255,255,255)이면
   아무것도 안 바뀌고, 밤이 (112,126,178)이면 빨강이 44%·파랑이 70%만
   남아 어둡고 푸르게 가라앉습니다.

   ---- 밤이 너무 어두우면 안 됩니다 ----
   공부하는 사람이 가장 많은 시간이 밤입니다. 분위기를 위해 안 보이게
   만들면 제품을 망칩니다. 그래서 가장 어두운 시각도 빨강 채널 기준
   38% 아래로 내려가지 않습니다.

   ---- 실내 ----
   실내는 사람이 불을 켜고 있습니다. 바깥이 밤이어도 방은 밝아야 하고,
   대신 색만 조금 따뜻해집니다.
   ================================================================== */
const SKY = [
  /* 시각, 곱할 색 [r,g,b] */
  [0,    [104, 118, 170]],   // 한밤 - 파랑
  [4,    [ 98, 110, 160]],   // 가장 어두운 때
  [6,    [138, 138, 178]],   // 여명이 번지기 시작
  [7,    [232, 190, 175]],   // 해 뜰 무렵 - 복숭아
  [9,    [250, 244, 236]],
  [12,   [255, 255, 255]],   // 정오 - 중립
  [16,   [252, 244, 228]],
  [18,   [250, 214, 178]],   // 금빛
  [19.5, [238, 168, 140]],   // 노을 - 코랄과 만나는 시각
  [21,   [150, 136, 180]],   // 땅거미 - 보라
  [23,   [112, 126, 178]],   // 밤
  [24,   [104, 118, 170]],   // 0시로 이어집니다
];

const TIME = {
  /** 시험용 고정 시각. null 이면 진짜 시계를 씁니다. */
  override: null,
  hour() {
    if (this.override !== null) return this.override;
    const d = new Date();
    return d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600;
  },
  /** 지금 하늘색. 두 구간 사이를 부드럽게 건너갑니다 - 계단으로 바뀌면
      1 분마다 화면이 툭툭 튑니다. */
  tint() {
    const h = this.hour();
    for (let i = 0; i < SKY.length - 1; i++) {
      const [h0, c0] = SKY[i], [h1, c1] = SKY[i + 1];
      if (h >= h0 && h <= h1) {
        const t = (h - h0) / (h1 - h0);
        return [
          Math.round(c0[0] + (c1[0] - c0[0]) * t),
          Math.round(c0[1] + (c1[1] - c0[1]) * t),
          Math.round(c0[2] + (c1[2] - c0[2]) * t),
        ];
      }
    }
    return [255, 255, 255];
  },
  /** 0(대낮) ~ 1(가장 어두움). 불을 켤지 정하는 데 씁니다. */
  darkness() {
    const c = this.tint();
    return Math.max(0, Math.min(1, (255 - (c[0] + c[1] + c[2]) / 3) / 120));
  },
};

/* ---------------- 광원 ----------------
   기물 종류에서 자동으로 뽑습니다. 존마다 손으로 적으면 기물을 옮길
   때마다 빛이 제자리에 남습니다.
   dx dy 는 기물 좌상단에서 빛이 나는 지점까지의 픽셀, r 은 빛이 닿는
   반지름입니다. 셋 다 **그림 눈금(TS)** 입니다 — 기물 그림 위에서 잰
   값이라, 월드에 얹는 자리에서 AS 를 곱합니다. */
const LAMPS = {
  /* 실내 등 셋은 반지름과 세기를 올렸습니다. 가구를 걷어낸 기숙사처럼
     빈 방에서는 등이 방 분위기를 혼자 만듭니다 — 예전 값은 등 발치만
     겨우 밝히고 끝나서, 켜 놓고도 방이 어두웠습니다. */
  lamp:      { dx: 8,  dy: 6,  r: 64, c: [255, 226, 172], i: 1.0 },
  floorLamp: { dx: 8,  dy: 8,  r: 58, c: [255, 224, 172], i: 1.0 },
  deskLamp:  { dx: 8,  dy: 6,  r: 40, c: [255, 232, 184], i: 0.9 },
  vending:   { dx: 8,  dy: 12, r: 26, c: [190, 226, 255], i: 0.7 },
  vending2:  { dx: 8,  dy: 12, r: 26, c: [190, 226, 255], i: 0.7 },
  /* 등불 색은 그 문의 천 색과 같아야 합니다. 청록 문(gateEsc)에 코랄
     불이, 코랄 문(gateA)에 청록 불이 켜져 있어 둘이 서로 바뀌어
     있었습니다 — 멀리서 색으로 문을 찾는 것이 이 넷의 요점입니다. */
  gateEsc:   { dx: 32, dy: 42, r: 44, c: [130, 230, 215], i: 1.0 },
  gateA:     { dx: 32, dy: 42, r: 44, c: [255, 150, 120], i: 1.0 },
  gateB:     { dx: 32, dy: 42, r: 44, c: [255, 220, 130], i: 1.0 },
  gateC:     { dx: 32, dy: 42, r: 44, c: [190, 160, 255], i: 1.0 },
  signpost:  { dx: 40, dy: 2,  r: 30, c: [255, 236, 200], i: 0.7 },
  /* 노트북·모니터 화면. 밤에 방에 광원이 하나도 없으면 평평해집니다.
     화면빛은 차갑고 좁습니다 - 등불과 색이 달라야 둘이 구분됩니다.
     live: false 는 안 떠는 불입니다. 모니터는 흔들리지 않습니다. */
  laptopN:   { dx: 8,  dy: 4,  r: 22, c: [176, 214, 255], i: 0.72, live: false },
  laptopCal: { dx: 8,  dy: 4,  r: 22, c: [200, 226, 255], i: 0.72, live: false },
  laptop:    { dx: 8,  dy: 4,  r: 22, c: [176, 214, 255], i: 0.72, live: false },
  monitor:   { dx: 8,  dy: 4,  r: 24, c: [176, 214, 255], i: 0.75, live: false },
  pc:        { dx: 8,  dy: 6,  r: 18, c: [176, 214, 255], i: 0.6,  live: false },
  tv:        { dx: 8,  dy: 6,  r: 26, c: [190, 210, 255], i: 0.7,  live: false },
};

/** 건물 창. 기물에서 못 뽑는 것들은 존이 직접 적습니다 -
    창은 건물 그림 안에 있어 좌표를 밖에서 알 수 없습니다. */
function windowLights(m) {
  const out = [];
  for (const p of m.props) {
    const d = PROP[p.kind];
    if (!d || !p.kind.startsWith('bld')) continue;
    /* 정면 창문 줄은 건물 아래에서 두 칸 위입니다. 건물 폭에 걸쳐
       고르게 놓습니다 - 창 하나하나를 따라가지 않고 벽면이 은은하게
       빛나게 하는 편이 16px 에서 더 깨끗합니다. */
    /* 여기 나오는 값은 곧바로 월드 좌표로 쓰이므로 미리 AS 를 곱해 둡니다 */
    const y = (p.y + d.h - 2) * T + 8 * AS;
    for (let i = 1; i < d.w - 1; i += 3)
      out.push({ x: (p.x + i) * T + 8 * AS, y, r: 34 * AS, c: [255, 226, 170], i: 0.62 });
    /* 전구 간판은 창보다 세고 넓습니다. 밤에 "저기는 아직 열려 있다" 를

  blobs: new Map(),        // 색마다 미리 그려 둔 빛 덩어리

  blob(c) {

       곱셈이 아니라 덧셈(lighter)이라 색이 뜨지 않고 공기만 밝아집니다. */
    const inside0 = !!m.floor;

      if (!inside0) return;

      const ga = this.g;
      ga.globalCompositeOperation = 'source-over';
      ga.fillStyle = 'rgb(255,255,255)';
      ga.fillRect(0, 0, vw, vh);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.04;                 // 4% — 곁눈으로만 걸리는 양
      ctx.drawImage(this.buf, 0, 0);
      ctx.restore();

    }

    let tint = TIME.tint();
    /* 구름이 끼면 빛이 줄고 색이 빠집니다. 어둡게만 하면 밤이 되고,
       잿빛으로 몰아야 흐린 낮이 됩니다. 최대 18% 까지만 - 비 오는 날
       글자가 안 읽히면 그건 분위기가 아니라 고장입니다. */
    if (wet > 0) {
      const grey = [132, 141, 152];
      tint = tint.map((v, i) => Math.round((v + (grey[i] - v) * wet * 0.55) * (1 - wet * 0.18)));
    }
    /* 실내는 사람이 불을 켜고 있습니다. 바깥만큼 어두워지면 안 되고,
       색만 조금 따뜻해집니다.

       30% → 18% 로 내렸습니다. 방이 어둡다는 말이 계속 나왔는데, 재 보니
       한밤(가장 어두운 하늘 [98,110,160])에 30% 를 들이면 실내 곱하기 색이
       [208,212,226] 이었습니다. 벽·마루가 이미 중간 밝기라 거기에 한 번 더
       곱하면 눈에는 "해 지는 방" 으로 보입니다. 18% 면 [227,229,238] 로,
       색은 여전히 밤 쪽으로 기울지만 밝기는 낮에 가깝습니다.

       바닥값도 둡니다 — 어떤 시각·날씨가 와도 실내는 82% 아래로 안

       여기서 막습니다. */
    const inside = !!m.floor;
    if (inside) {
      const k = 0.18;
      tint = tint.map((v) => Math.max(209, Math.round(255 - (255 - v) * k)));
    }

    if (!this.buf || this.buf.width !== vw || this.buf.height !== vh) {
      this.buf = document.createElement('canvas');
      this.buf.width = vw; this.buf.height = vh;
      this.g = this.buf.getContext('2d');
    }
    const g = this.g;
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = 'rgb(' + tint[0] + ',' + tint[1] + ',' + tint[2] + ')';
    g.fillRect(0, 0, vw, vh);

    /* 불은 어두워질수록 밝아집니다. 대낮에 가로등이 켜져 있으면
       거짓말이고, 한밤에 꺼져 있으면 길이 안 보입니다. */
    /* 궂은 날은 낮에도 불을 켭니다. 흐린 오후에 가로등이 들어오는 건
       실제로 그러기도 하고, 어두워진 화면에 길잡이가 생깁니다. */
    let on = Math.max(0, (dark + wet * 0.22 - 0.18) / 0.82);
    /* **실내 등은 낮에도 켜 둡니다.** 방 안에서 스탠드가 꺼져 있으면
       그건 장식이고, 사람은 낮에도 방 불을 켭니다. 0.45 를 바닥으로 두면
       한낮에도 등 밑에 빛웅덩이가 생기고, 밤에는 위 식이 그것을 넘어섭니다.
       바깥(캠퍼스)은 그대로입니다 — 대낮에 가로등이 켜지면 거짓말입니다. */
    if (inside) on = Math.max(on, 0.45);
    if (on > 0) {
      g.globalCompositeOperation = 'lighter';
      const put = (L) => {
        const x = L.x - camX, y = L.y - camY, r = L.r;
        if (x < -r || y < -r || x > vw + r || y > vh + r) return;
        /* 등마다 다른 위상으로 아주 조금 떨립니다. 크게 떨면 고장 난
           형광등이고, 6% 면 곁눈으로만 걸립니다. 화면 불빛은 안 떱니다 -
           모니터는 흔들리지 않습니다. */
        const f = L.live === false ? 1
          : 1 - 0.06 * (0.5 + 0.5 * Math.sin(WIND.t * 3.1 + L.x * 0.7 + L.y * 0.31));
        g.globalAlpha = Math.min(1, on * (L.i ?? 1) * f);
        g.drawImage(this.blob(L.c), x - r, y - r, r * 2, r * 2);
      };
      for (const p of m.props) {
        const L = LAMPS[p.kind];
        if (!L) continue;
        put({ x: p.x * T + L.dx * AS, y: p.y * T + L.dy * AS, r: L.r * AS,
              c: L.c, i: L.i, live: L.live });
      }
      if (m.winLights) for (const L of m.winLights) put(L);
      g.globalAlpha = 1;
    }

    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    ctx.drawImage(this.buf, 0, 0);
    ctx.restore();
  },
};

   세션을 끝낼 때 꺼집니다.

   있으면 앉아 있는 동안 화면을 보게 되는데, 그건 이 앱이 막으려는
   행동입니다. */
const SESSION = {
  startedAt: 0,
  seatedMs: 0,      // 의자에 앉아 있던 시간. 판정은 세션 내내 도므로 판정 시간과 다릅니다
  seatedAt: 0,
  ended: false,
  coins: 0,         // 이번 세션에서 번 것 — 회고에 보여 줍니다
};
function sessionMinutes() {
  return SESSION.startedAt ? (Date.now() - SESSION.startedAt) / 60000 : 0;
}
/** 자세 판정이 **실제로 돌아간** 분. 코인의 분모입니다.
    의자 시계가 아니라 이것을 쓰는 이유 — 앉혀 두고 자리를 비우면 의자
    시계는 흐르지만 사람이 없으므로 판정은 안 돕니다. 카메라를 못 열었을
    때도 0 이라, 카메라 없이 시간만 흘려 코인을 받는 길이 막힙니다. */

  return Math.floor((LIVE.goodMs + LIVE.warnMs + LIVE.badMs) / 60000);
}
function sessionText() {
  const sec = Math.floor((Date.now() - SESSION.startedAt) / 1000);
  return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
}
