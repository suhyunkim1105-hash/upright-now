/* ================== 리워드 ==================
   잔액(ROOM.coins)과 지급 이력(girin.reward)을 분리합니다. 랭킹 지표가
   서버로 가는 날 이력 검증만 서버로 옮기면 됩니다.

   원칙 — 코인은 **행동**으로만 쌓입니다. 자세가 좋다고 주지 않고(자세
   점수 금지), 오래 앉기 자체도 착석 상한(일 60분)이 막습니다.

   초대 200×5 · 피초대 50 · 학교 개척자 100 은 "피초대자가 인증하고 첫
   유효 세션을 마쳤는가" 를 서버가 확인해야 지급할 수 있어 여기에는
   없습니다 — 가입만으로 주면 봇 농사가 됩니다.

   로컬이라 콘솔로 잔액을 고칠 수 있습니다. 받아들입니다 — 개인 재화라
   피해자가 없고, 랭킹 지표(앉은 시간·회복)와는 분리돼 있습니다. */
/* 시즌은 **한 곳에서만** 셉니다 — seasonInfo() (90일, 2026-01-05 부터).
   전에는 여기에 42일짜리 창이 따로 있어서, 명예의 전당은 "시즌 4" 를
   보여 주는데 코인 장부는 "시즌 1" 을 세고 있었습니다. 두 화면이 같은
   낱말로 다른 것을 가리키면 둘 다 못 믿습니다.

   서버의 world_school_ranking() 도 **같은 상수**로 같은 창을 셉니다.
   한쪽만 고치면 화면의 남은 날과 실제 집계 구간이 어긋납니다. 서버가
   답을 주면 그쪽이 이기고, 이 함수는 서버가 없을 때의 답입니다. */
function seasonInfo() {
  const LEN = 90;
  const START = Date.UTC(2026, 0, 5);
  const days = Math.floor((Date.now() - START) / 86400000);
  const no = 4 + Math.floor(days / LEN);
  const into = ((days % LEN) + LEN) % LEN;
  const from = new Date(START + (no - 4) * LEN * 86400000);
  const to = new Date(from.getTime() + (LEN - 1) * 86400000);
  const fmt = (d) => (d.getUTCMonth() + 1) + '월 ' + d.getUTCDate() + '일';
  return { no, daysLeft: LEN - into, progress: into / LEN, from: fmt(from), to: fmt(to) };
}
const seasonNow = () => seasonInfo().no;
function dayKey(t) {
  const d = t ? new Date(t) : new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
/* ---- 팀 확정 규칙 (연우안 + 민철안) ----
   `upright-now/src/constants/coin.ts` 와 서버 마이그레이션이 **같은 값**을
   씁니다. 셋 중 하나를 바꾸면 셋 다 바꿔야 합니다.

   누적형(10분마다 얼마씩)을 버리고 완주 구간제로 왔습니다. 누적형은
   켜 두기만 해도 쌓이고, 캠퍼스 체류 코인은 걸어다니기만 해도 줬습니다 —
   멘토가 지적한 어뷰징이 정확히 그것입니다.

   그리고 **분모가 앉은 시간이 아니라 판정이 돌아간 시간**입니다. 앉혀
   두고 자리를 비우면 의자 시계는 흐르지만 판정은 안 돕니다. 이 월드는
   세션 내내 카메라가 도므로(sit 이 아니라 세션이 카메라를 켭니다) 걸어
   다닌 시간도 판정이 돌면 인정됩니다. */
const COMPLETION_TIERS = [
  { min: 50, points: 60 },
  { min: 30, points: 40 },
  { min: 15, points: 30 },
  { min: 5,  points: 10 },
];
const STREAK_MILESTONES = [
  { days: 3,  points: 10 },
  { days: 7,  points: 25 },
  { days: 14, points: 50 },
  { days: 30, points: 100 },
  { days: 60, points: 180 },
];
const DAILY_CAP = 300;             // 모든 원천 합산. 어뷰징 방지
const COIN_RECOVERY = 5;           // 회복 성공 1회 · 세션당 5회까지
const COIN_MINIGAME = 10;          // 게임별 하루 1회

const completionCoins = (min) => (COMPLETION_TIERS.find((t) => min >= t.min) || { points: 0 }).points;
const streakMilestone = (days) => STREAK_MILESTONES.find((m) => m.days === days) || null;

const RW_DAY = () => ({ got: 0, attended: false, games: [] });
let RW = {
  day: dayKey(),
  daily: RW_DAY(),
  session: { recov: 0, completed: false },
  streak: { days: 0, last: '', claimed: [] },
  once: {},
  season: { id: seasonNow(), first: false, attend: [] },
};
try { Object.assign(RW, JSON.parse(localStorage.getItem('girin.reward') || '{}')); } catch { /* 기본값 */ }
function saveRW() { try { localStorage.setItem('girin.reward', JSON.stringify(RW)); } catch { /* 무시 */ } }

/** 날짜·시즌이 넘어갔으면 그 자리에서 접습니다. 모든 지급 앞에서 돕니다. */
function rwRoll() {
  if (RW.day !== dayKey()) { RW.day = dayKey(); RW.daily = RW_DAY(); }
  const sid = seasonNow();
  if (RW.season.id !== sid) {
    /* 지난 시즌 참여 보상 — 출석 7일 이상. 순위가 아니라 참여에 겁니다 */
    if ((RW.season.attend || []).length >= 7) grant(30, '시즌 참여');
    RW.season = { id: sid, first: false, attend: [] };
  }
}

/** 실제 지급 — 잔액·튕김·사유 칩.
    **하루 상한 300 은 여기서** 겁니다. 축마다 걸면 새 축이 생길 때마다
    빠뜨리게 되고, 그게 두 장부가 서로의 상한을 무시하던 이유입니다.
    상한에 걸리면 걸린 만큼만 주고 조용히 넘어갑니다 — "더 못 받는다" 를
    광고하면 상한이 목표가 됩니다. */
const coinNote = document.getElementById('coinNote');
let noteTimer = 0;
function grant(v, label) {
  rwRoll();
  v = Math.max(0, Math.min(v, DAILY_CAP - (RW.daily.got || 0)));
  if (v <= 0) return 0;
  ROOM.coins += v; saveRoom(); paintCoins(true);
  if (SESSION.startedAt && !SESSION.ended) SESSION.coins += v;
  RW.daily.got = (RW.daily.got || 0) + v;
  coinNote.textContent = '+' + v + ' · ' + label;
  coinNote.classList.add('on');
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => coinNote.classList.remove('on'), 1600);
  return v;
}

/** 쓰기 — 모자라면 아무것도 안 하고 false. 하루 상한은 **버는 쪽에만**
    겁니다. 쓴 액수를 오늘 번 것에서 빼면 상한이 늘어납니다.

    서버가 붙은 판본에서는 이 길로 안 옵니다. 상점은 world_buy_item 이
    값을 정하고 잔액을 깎습니다(buyItem 참고). 여기 남은 것은 서버가 아예
    없는 판본 — config.js 가 없거나 file:// 로 연 경우 — 몫입니다. */
function spend(amount) {
  if (ROOM.coins < amount) return false;
  ROOM.coins -= amount; saveRoom(); paintCoins(true);
  return true;
}

/** 모든 축이 이 문으로만 들어옵니다. 상한에 걸리면 조용히 무시합니다 —
    "더 못 받는다" 를 광고하면 상한이 목표가 됩니다. */
function award(kind, label, amount) {
  rwRoll();
  const D = RW.daily, S = RW.session;
  let v = 0;
  /* 완주 — 세션이 끝날 때 한 번. amount 는 **판정이 돌아간 분**입니다. */
  if (kind === 'complete') {
    if (S.completed) return;
    v = completionCoins(amount || 0);
    if (v <= 0) return;
    S.completed = true;
    label = (amount || 0) + '분 세션 완주';
  }
  else if (kind === 'recov') {
    if (S.recov >= 5) return;
    S.recov += 1; v = COIN_RECOVERY;
    if (!RW.once.firstRecov) { RW.once.firstRecov = true; v += 10; label = '첫 회복'; }
  }
  else if (kind === 'attend') {
    if (D.attended) return;
    D.attended = true;
    /* 어제 출석했으면 이어지고, 아니면 1일차부터. 기기 날짜를 되돌리면
       last 가 미래가 되는데, 그때는 리셋만 합니다. */
    RW.streak.days = RW.streak.last === dayKey(Date.now() - 86400000) ? RW.streak.days + 1 : 1;
    RW.streak.last = RW.day;
    if (!RW.season.attend.includes(RW.day)) RW.season.attend.push(RW.day);
    if (!RW.season.first) { RW.season.first = true; grant(10, '시즌 첫 세션'); }
    if (!RW.once.firstSession) { RW.once.firstSession = true; grant(30, '첫 세션'); }
    /* 연속 출석은 **마일스톤에서만** 줍니다 — 매일 조금씩 주면 그것도
       누적형이고, 30일차 하루가 다른 축 전부를 압도했습니다.
       각 마일스톤은 평생 한 번입니다(연속이 끊겼다 3일을 다시 채워도
       또 주지 않습니다). */
    RW.streak.claimed = RW.streak.claimed || [];
    const ms = streakMilestone(RW.streak.days);
    if (!ms || RW.streak.claimed.includes(ms.days)) { saveRW(); return; }
    RW.streak.claimed.push(ms.days);
    v = ms.points;
    label = RW.streak.days + '일 연속 출석';
  }
  else if (kind.indexOf('once:') === 0) {
    const k = kind.slice(5);
    if (RW.once[k]) return;
    RW.once[k] = true;
    v = k.indexOf('decorate') === 0 ? 10 : 5;
  }
  else return;
  saveRW();
  grant(v, label);
}

/* ---- 주기 작업 ----
   프레임 dt 로 돕니다. 탭이 가려지면 rAF 가 멈추고, 복귀 첫 프레임의
   점프(수 분)는 버립니다. */
let rwLast = 0, rwSaveAt = 0, sessSaveAt = 0, lastActivity = Date.now();
function rwTick(now) {
  if (!rwLast) { rwLast = now; return; }
  const ms = now - rwLast; rwLast = now;
  if (ms <= 0 || ms > 2000) return;
  rwRoll();
  /* 여기서는 **아무것도 지급하지 않습니다.** 시간이 흐른다는 이유로 주는
     축은 전부 없앴습니다 — 켜 두기만 해도 쌓이던 것이 어뷰징의 전부였고,
     캠퍼스 체류 코인은 걸어다니기만 해도 줬습니다.
     완주 코인은 세션이 끝날 때 한 번, 판정이 돌아간 시간으로 줍니다.

     출석만 여기서 봅니다. 그날 판정이 10분을 넘긴 순간이 "왔다" 는
     사실이고, 세션을 안 끝내고 탭을 닫아도 그건 사실이기 때문입니다. */
  if (judgedMinutes() >= 10) award('attend', '출석');
  /* 운동장 첫 방문 — 존이 아니라 캠퍼스 북서 구역이라 여기서 봅니다 */
  if (zoneId === 'campus' && player.x < 15 * T && player.y < 13 * T) award('once:visit_track', '운동장 첫 방문');
  if (now - rwSaveAt > 10000) { rwSaveAt = now; saveRW(); }
  /* 1분마다 진행 중인 세션을 갈무리합니다. 탭을 그냥 닫으면 endSession
     이 안 불리는데, 그때 한 시간짜리 세션이 통째로 사라졌습니다. */
  if (SESSION.startedAt && !SESSION.ended && now - sessSaveAt > 60000) {
    sessSaveAt = now; saveSession();
  }
}

/* 세션 종료 — 카메라를 내리고 회고를 엽니다. 다시 시작하려면 명시적으로
   눌러야 합니다: 끝냈다는 감각이 있어야 다음 세션이 새로 시작됩니다. */
const sessEnd = document.getElementById('sess-end');
const sessBox = document.getElementById('hud-session');
const sessTime = document.getElementById('sess-time');
function endSession() {
  if (SESSION.ended) return;
  if (player.sitting) stand();
  /* 완주 코인은 카메라를 내리기 **전에** 셉니다 — stopCamera 뒤에 세면
     판정 누적이 이미 멎은 뒤라 마지막 구간이 빠집니다. */
  const judged = judgedMinutes();
  award('complete', '', judged);
  stopCamera();                 // 세션 끝 = 촬영 끝. 서 있어도 꺼집니다.
  SESSION.ended = true;
  saveSession();
  /* 서버에도 보냅니다. 코인은 서버가 다시 계산하고 돌아온 잔액이
     정답입니다 — 로컬 잔액은 표시용이에요. 오프라인이면 save.js 큐에
     쌓였다가 다음 접속에 갑니다. 설정이 없으면 조용히 넘어갑니다. */
  if (window.WORLD_SAVE && WORLD_SAVE.configured) {
    WORLD_SAVE.finishSession({
      school: ROOM.school,
      seatedMinutes: judged,          // 서버의 분모도 판정 시간입니다
      campusMinutes: Math.round(sessionMinutes()),
      recoveries: LIVE.recoveries,
      startedAt: SESSION.startedAt || Date.now(),
      endedAt: Date.now(),
    }).then(applyServerBalance);
  }
  sessBox.classList.add('done');
  sessEnd.textContent = '회고 보기';
  openPanel('retro');
}

/** 서버가 아는 잔액이 정답입니다. 오프라인이면 null 이 와서 그냥 둡니다. */
function applyServerBalance(balance) {
  if (typeof balance !== 'number') return;
  ROOM.coins = balance; saveRoom(); paintCoins(true);
}

/* ==================================================================
   상점을 서버와 맞춥니다

   여기까지는 산 것·입은 것·놓은 것이 전부 이 브라우저에만 있었습니다.
   기기를 바꾸면 800코인짜리 알이 사라졌고, 콘솔에서 ROOM.owned 에 한 줄
   밀어 넣으면 공짜로 가질 수 있었습니다. spend() 에 달려 있던
   "서버에 아직 소비 RPC 가 없어…" 주석이 그 자리입니다.

   나눠 맡는 규칙은 코인과 같습니다 — **서버가 정하고 여기는 보여 줍니다.**
     · 값은 서버 값표에 있습니다. 여기서 보내는 것은 item_id 하나입니다.
     · 잔액을 깎는 것도 서버입니다. 돌아온 잔액이 정답입니다.
     · 산 목록도 서버 것이 정답입니다. 접속하면 서버 것으로 덮습니다 —
       **이 기기에만 있던 목록은 그때 사라집니다.** 남기려면 "로컬에 있던
       것은 서버에도 넣어 준다"를 해야 하는데, 그 순간 localStorage 를
       고쳐 공짜로 갖는 길이 다시 열립니다. 서버를 붙이는 목적 자체가
       그것을 막는 것이라 남기지 않습니다.

   서버가 아예 없는 판본(config.js 없음 · file:// 로 열기)은 예전처럼
   이 기기에서만 삽니다. "서버가 없는 것" 과 "서버가 있는데 못 닿는 것" 은
   다릅니다 — 후자에서 로컬로 깎으면 장부가 두 벌이 됩니다.
   ================================================================== */
/* function 선언인 이유: 상점 화면(shopStateHtml)과 가구 놓기(pushDecor)가
   이 파일에서 훨씬 위인데 둘 다 이걸 봅니다. const 로 두면 그 위에서
   부르는 순간 TDZ 입니다. */
function serverShop() { return !!(window.WORLD_SAVE && WORLD_SAVE.configured); }

/* 못 산 이유를 사람 말로. 서버가 주는 것은 'poor' 같은 낱말이라
   그대로 띄우면 아무 말도 안 한 것과 같습니다. */
const BUY_FAIL = {
  poor:        '코인이 모자라요.',
  already:     '이미 가지고 있어요.',
  unknownItem: '지금은 안 파는 물건이에요.',
  offline:     '인터넷이 끊겨서 못 샀어요. 연결되면 다시 눌러 주세요.',
  server:      '서버가 답을 안 해서 못 샀어요. 잠시 뒤에 다시 눌러 주세요.',
  unconfigured:'서버 설정이 없어서 못 샀어요.',
};

/** 서버가 돌려준 방 상태로 화면을 맞춥니다. */
function applyServerRoom(st) {
  if (!st || typeof st !== 'object') return;
  /* 값표가 먼저입니다. 화면에 220 이라 적어 놓고 250 이 빠지면 안 됩니다.
     어긋나면 **서버 쪽으로** 맞춥니다 — 실제로 빠지는 액수가 그것입니다. */
  if (st.prices) {
    for (const it of SHOP) {
      const p = st.prices[it.id];
      if (typeof p === 'number') it.price = p;
    }
  }
  if (Array.isArray(st.owned)) ROOM.owned = st.owned.slice();
  if (st.worn && typeof st.worn === 'object') ROOM.worn = Object.assign({}, st.worn);
  if (st.tint && typeof st.tint === 'object') ROOM.tint = Object.assign({}, st.tint);
  if (st.character) ROOM.character = st.character;
  if (Array.isArray(st.decor)) ROOM.decor = st.decor.map((d) => ({ id: d.id, x: d.x, y: d.y }));
  if (typeof st.balance === 'number') ROOM.coins = st.balance;

  /* 서버에 없는 상품·못 놓을 자리는 여기서 한 번 더 거릅니다. 값표가
     앞서 나가고 클라이언트가 아직 옛 판본일 때(배포 시차) 실제로 생깁니다. */
  pruneUnknownItems();
  saveRoom();
  applyDecor();
  invalidateDressed();
  jacketCanvas = null;
  drawCamAvatar();
  paintCoins(false);
  /* 상점이나 꾸미기를 열어 둔 채로 응답이 오면 그 화면도 새로 그립니다 */
  if (panelOpen && isShopPanel(activePanelKey)) reopenShop();
  if (DECOR.drawer) paintDrawer();
}
window.addEventListener('worldsave:room', (e) => applyServerRoom(e.detail));

/** 상점을 열 때 서버 잔액을 다시 물어봅니다.

    이 판본에는 서버가 모르는 지역 보상이 남아 있습니다 — 첫 방문·NPC 첫
    만남·첫 방 꾸미기(award('once:…')). 이것들은 코인 규칙 확정본
    (docs/economy/COIN_RULE_DECISION.md)의 표에 없는 축이라 서버가 안 줍니다.
    그래서 화면 잔액이 서버보다 클 수 있고, 그대로 두면 "살 수 있어 보이는데
    서버가 거절" 이 됩니다.

    ponytail: 그 보상들을 서버에 넣을지 없앨지는 **규칙을 고치는 일**이라
    여기서 임의로 정하지 않았습니다. 대신 값을 치르는 화면에서는 서버 숫자만
    보이게 맞춥니다 — 화면이 거짓말하지 않는 것이 먼저입니다.
    못 물어보면(오프라인) 그냥 둡니다. */
function refreshShopCoins() {
  if (!serverShop()) return;
  WORLD_SAVE.balance().then((b) => {
    if (typeof b !== 'number' || b === ROOM.coins) return;
    ROOM.coins = b; saveRoom(); paintCoins(false);
    if (panelOpen && isShopPanel(activePanelKey)) reopenShop();
  });
}

/** 입은 것·색·종을 서버에 올립니다. 오프라인이면 큐에 쌓였다가 나중에 갑니다 —
    입기는 잔액을 안 건드리므로 늦게 도착해도 결과가 같습니다. */
function pushLoadout() {
  if (serverShop()) WORLD_SAVE.setLoadout(ROOM.worn, ROOM.tint, ROOM.character);
}
/** 방에 놓은 가구 목록을 통째로 올립니다. 같은 이유로 큐를 씁니다. */
function pushDecor() {
  if (serverShop()) WORLD_SAVE.setDecor(ROOM.decor);
}

/* 누른 순간부터 답이 올 때까지 잠급니다. 안 잠그면 두 번 눌러 두 번
   보내는데, 서버는 두 번째를 'already' 로 막지만 화면이 두 번 깜빡입니다. */
let buying = false;
async function buyItem(id, btn) {
  const it = SHOP_BY_ID[id];
  if (!it || buying || owns(id)) return;

  if (!serverShop()) {
    /* 서버가 아예 없는 판본 — 예전 그대로 이 기기에서만 삽니다 */
    if (!spend(it.price)) { SFX.deny && SFX.deny(); return; }
    ROOM.owned.push(id);
    equip(id);
    saveRoom(); reopenShop();
    return;
  }

  buying = true;
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  const r = await WORLD_SAVE.buyItem(id);
  buying = false;

  /* 서버가 잔액을 알려 줬으면 성공이든 실패든 그것으로 맞춥니다.
     실패한 김에 화면 잔액도 바로잡는 것이라, 여기가 유일한 기회입니다. */
  if (typeof r.balance === 'number' && r.balance !== ROOM.coins) {
    ROOM.coins = r.balance; saveRoom(); paintCoins(false);
  }
  if (r.ok) {
    shopNote = '';
    ROOM.owned.push(id);
    equip(id);                          // 산 것은 바로 입혀 줍니다
    saveRoom(); paintCoins(true);
    pushLoadout();
  } else {
    SFX.deny && SFX.deny();
    shopNote = BUY_FAIL[r.reason] || '지금은 살 수 없어요.';
  }
  reopenShop();
}
function newSession() {
  /* 마이페이지 경유로 회고가 세션 도중에도 열리므로, 이 버튼도 도중에
     눌릴 수 있게 됐습니다. 돌던 세션을 저장 없이 덮으면 마지막 자동저장
     이후 최대 1분이 사라집니다. */
  if (SESSION.startedAt && !SESSION.ended) saveSession();
  RW.session = { recov: 0, completed: false }; saveRW();
  resetSay();
  SESSION.startedAt = Date.now();
  SESSION.seatedMs = 0; SESSION.seatedAt = 0; SESSION.ended = false; SESSION.coins = 0;
  LIVE.goodMs = 0; LIVE.warnMs = 0; LIVE.badMs = 0;
  LIVE.recoveries = 0; LIVE.wasBad = false;
  resetAxis();          // 축별 누적도 같이 비웁니다 — 안 비우면 처방이 지난 세션 것을 물고 옵니다
  /* enterZone 을 거치지 않는 유일한 세션 시작 경로라 여기서도 켭니다.
     안 켜면 "종료 → 새 세션" 이 카메라 없는 세션이 됩니다. */
  startCamera();
  sessBox.classList.remove('done');
  sessEnd.textContent = '세션 종료';
  closePanel();
}
sessEnd.addEventListener('click', () => (SESSION.ended ? openPanel('retro') : endSession()));

const gearBtn = document.getElementById('gear');
gearBtn.addEventListener('click', () => openPanel('settings'));

/* ================== 루프 ================== */
let last = performance.now(), gameFrames = 0, gameFps = 0, fpsClock = last, drawCount = 0;

function update(dt) {
  if (portalCooldown > 0) portalCooldown -= dt;
  /* 화면이 가장 어두운 순간에 방을 갈아탑니다. 걷는 것은 그동안 멈춥니다 -
     안 멈추면 어둠 속에서 벽에 박힌 채로 새 방에 도착합니다. */
  if (travel) {
    travel.t += dt;
    if (!travel.done && travel.t >= TRAVEL_OUT) {
      travel.done = true;
      enterZone(travel.to.id, travel.to.sx, travel.to.sy);
    }
    if (travel.t >= TRAVEL_OUT + TRAVEL_IN) travel = null;
  }
  /* 배치 모드에서는 사람이 안 걷습니다. 걸으면 유령과 사람이 같이
     움직여서 어느 쪽을 옮기는지 알 수 없습니다. */
  if (!player.sitting && !dialogOpen && !panelOpen && !travel && !DECOR.it) {
    const onPath = PATH.i < PATH.steps.length;
    /* 길을 따라갈 때는 **걷는 속도**로 못 박습니다. Shift 를 누른 채로
       클릭했다고 뛰게 하면 손을 뗀 순간 걸음으로 떨어지는데, 그 한
       순간에 보폭도 발소리 간격도 같이 갈립니다. 뛰는 것은 자판을 잡은
       손이 그때그때 정하는 일입니다. */
    const run = keys.has('shift') && !onPath;
    /* 속도도 지도 눈금입니다. 타일만 두 배로 하고 여기를 그대로 두면
       같은 거리를 두 배 걸어야 해서 월드가 갑자기 넓게 느껴집니다. */
    /* 탈것을 탔으면 곱합니다(rideMult). Shift 와 겹치는 것은 일부러입니다 —
       자전거로 내리막을 달리는 것과 같습니다. 곱 천장이 1.8 인 이유는
       RIDES 주석에 있습니다(한 프레임에 한 칸을 넘으면 벽을 뚫습니다). */
    const speed = (run ? 92 : 54) * rideMult() * AS * dt;
    let dx = 0, dy = 0;
    if (keys.has('w') || keys.has('arrowup')) dy -= 1;
    if (keys.has('s') || keys.has('arrowdown')) dy += 1;
    if (keys.has('a') || keys.has('arrowleft')) dx -= 1;
    if (keys.has('d') || keys.has('arrowright')) dx += 1;
    if (dx || dy) {
      const len = Math.hypot(dx, dy);
      dx = dx / len * speed; dy = dy / len * speed;
    } else if (onPath) {
      /* 자판이 비어 있을 때만 길이 몹니다. 키를 누르는 순간 keydown 이
         이미 길을 버리므로 둘이 겹쳐 오는 일은 없지만, 순서를 이렇게
         두면 어쩌다 겹쳐 와도 사람 손이 이깁니다. */
      const st = pathStep(speed);
      dx = st.dx; dy = st.dy;
    }
    const fromX = player.x, fromY = player.y;
    player.moving = dx !== 0 || dy !== 0;
    if (player.moving) {
      if (canStand(player.x + dx, player.y)) player.x += dx;
      if (canStand(player.x, player.y + dy)) player.y += dy;
      if (Math.abs(dx) > Math.abs(dy)) { player.dir = 'side'; player.flip = dx < 0; }
      else if (dy !== 0) player.dir = dy < 0 ? 'up' : 'down';
      /* 다리도 거리로 넘깁니다. 한 보폭에 두 칸씩 - 네 칸이 한 바퀴이니
         한 바퀴에 두 걸음, 사람이 걷는 것과 같습니다. */
      const stride = run ? STRIDE_RUN : STRIDE;
      const step = Math.hypot(dx, dy);
      player.anim += step / (stride / 2);
      player.frame = Math.floor(player.anim);

      /* ---- 발밑 ----
         한 걸음마다 소리 하나와 자국 하나. 표면이 바뀌는 순간에도 한
         걸음을 냅니다 - 잔디에서 포석으로 올라서는 그 발이 가장 잘
         들립니다. 다만 반 보폭은 지나야 합니다. 경계에 서서 앞뒤로
         비비면 소리가 연발로 터집니다. */
      const surf = surfaceAt(player.x, player.y);
      walked += step;
      if (walked >= stride || (lastSurf >= 0 && surf !== lastSurf && walked >= stride * 0.5)) {
        walked = 0;
        SFX.step(surf, run);
        if (surf === SURF.GRASS) FX.press(player.x, player.y);
        if (run && surf !== SURF.WATER) FX.dust(player.x, player.y, dx, dy);
        /* 물가를 지나면 그쪽 물이 흔들립니다 */
        const w = waterNear(player.x, player.y);
        if (w) FX.ripple(w.x, w.y);
      }
      lastSurf = surf;
    } else { player.anim = 0; player.frame = 0; walked = STRIDE; lastSurf = -1; }

    if (onPath) {
      if (PATH.i >= PATH.steps.length) pathClear();      // 다 왔습니다
      else {
        /* 길을 따라가다 벽에 밀려 제자리걸음이면 길을 버립니다. 걷는
           동안 방에 가구가 놓이거나(applyDecor) NPC 가 선 칸이 생기면
           길은 살아 있는데 한 칸이 막힙니다 - 그러면 벽에 붙어 다리만
           젓습니다. 0.35 초는 걸어서 한 칸 가는 시간(32px / 108px·초 =
           0.30 초)보다 조금 깁니다. 이보다 짧으면 모서리를 도는 정상적인
           걸음을 끊고, 길면 서 있는 것이 눈에 보입니다.
           모서리에서 두 칸을 이어 먹는 프레임도 실제 이동이 이번 몫의
           0.70 배 아래로는 안 내려가므로 0.4 를 문턱으로 둡니다. */
        const went = Math.hypot(player.x - fromX, player.y - fromY);
        PATH.stuck = went < speed * 0.4 ? PATH.stuck + dt : 0;
        if (PATH.stuck > 0.35) pathClear();
      }
    }

    if (portalCooldown <= 0) {
      const tx = Math.floor(player.x / T), ty = Math.floor((player.y - 1) / T);
      for (const p of zone.portals)
        if (tx >= p.x && tx < p.x + p.w && ty >= p.y && ty < p.y + p.h) {
          SFX.door();
          /* 바로 옮기지 않고 화면을 먼저 재웁니다. 실제 이동은 가장
             어두운 순간에 일어나므로 갈아타는 장면이 안 보입니다. */
          travel = { t: 0, to: { id: p.to, sx: p.sx, sy: p.sy }, done: false };
          player.moving = false; player.anim = 0; player.frame = 0;
          break;
        }
    }
  }
  FX.update(dt);
  WIND.update(dt);
  PRECIP.update(dt, WEATHER.kind(), WEATHER.strength());
  nearby = findNearby();

  const maxX = zone.w * T - VIEW_W, maxY = zone.h * T - VIEW_H;
  const tx = player.x - VIEW_W / 2, ty = player.y - VIEW_H / 2 - T;
  camX = Math.round(maxX <= 0 ? maxX / 2 : Math.max(0, Math.min(maxX, tx)));
  camY = Math.round(maxY <= 0 ? maxY / 2 : Math.max(0, Math.min(maxY, ty)));
}

/** y 정렬 키. 발 위치가 먼저, 같으면 x 로 갈라 순서를 고정합니다.
    동점을 그대로 두면 sort 가 불안정해 매 프레임 순서가 뒤집힙니다. */
function sortKey(foot, x) { return foot * 4096 + x; }

function draw() {
  drawCount = 0;
  /* 지도 밖 여백. 페이지가 밝아졌으니 여기도 밝아야 액자가 안 생깁니다. */
  ctx.fillStyle = '#EFF1F1'; ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  const x0 = Math.max(0, Math.floor(camX / T)), y0 = Math.max(0, Math.floor(camY / T));
  const x1 = Math.min(zone.w - 1, Math.ceil((camX + VIEW_W) / T));
  const y1 = Math.min(zone.h - 1, Math.ceil((camY + VIEW_H) / T));

  if (zone.floor) {
    /* 실내는 방 전체가 한 장입니다. 타일을 반복하면 격자가 눈에 띄고,
       널판 이음새를 어긋나게 놓을 수도 없습니다. */
    blitArt(zone.floor, -camX, -camY);
    drawCount++;
  } else {
    /* 캠퍼스도 바닥은 한 장입니다. 그 위에 포장 오토타일만 얹으면
       길 가장자리는 시트가 그려 주고 잔디는 격자 없이 이어집니다. */
    if (zone.ground) { blitArt(zone.ground, -camX, -camY); drawCount++; }
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const dx = x * T - camX, dy = y * T - camY;
      if (!zone.ground) blitU(zone.base[at(zone, x, y)], dx, dy);
      const mat = zone.over[at(zone, x, y)];
      /* painted 로 표시한 칸은 바닥 그림에 이미 그려져 있습니다. 여기서
         타일을 또 얹으면 손으로 그린 곧은 모서리 위에 시트의 둥근
         모서리가 덮입니다. */
      if (mat && !zone.painted[at(zone, x, y)]) blitU(autoTile(zone, x, y, mat), dx, dy);
      drawCount += mat ? 2 : 1;
      /* 물낯. 가로로 긴 반짝임이 천천히 흘러가며 떴다 가라앉습니다.
         세로 무늬를 넣으면 흐르는 강이 되는데, 여기는 고인 호수입니다.
         가장자리 칸은 건너뜁니다 - 둑에 반짝임이 걸리면 물이 뭍으로
         올라온 것처럼 보입니다. */
      if (mat === M.WATER && !FX.reduced && waterInner(zone, x, y)) {
        const v = Math.sin(WIND.t * 0.55 + x * 0.9 + y * 0.35)
                + Math.sin(WIND.t * 0.23 - x * 0.31 + y * 1.1) * 0.7;
        if (v > 0.62) {
          const a = hash1(x * 13.7 + y * 29.1);
          ctx.globalAlpha = Math.min(0.42, (v - 0.62) * 0.5);
          ctx.fillStyle = '#DCF1F6';
          /* 반짝임 치수는 타일 한 칸 안에서 정한 것이라 타일과 같이 큽니다 */
          ctx.fillRect(dx + Math.floor(a * 6 + 2) * AS, dy + Math.floor(a * 11 + 3) * AS,
                       (4 + Math.floor(a * 4)) * AS, AS);
          ctx.globalAlpha = 1;
          drawCount++;
        }
      }
    }
    /* 풀포기. 잔디 위, 자국 아래 - 밟은 자리에도 풀은 서 있습니다. */
    TUFT.draw(ctx, zone, camX, camY);
  }

  /* 발밑 자국. 바닥 바로 위, 벽보다 아래입니다 - 벽 위에 깔면 실내에서
     자국이 벽을 타고 올라갑니다. */
  FX.draw(ctx, camX, camY);

  /* 손으로 그린 실내 벽. 바닥 위, 소품 아래에 깝니다 — Kenney 벽돌
     위를 덮어 겉과 속의 결을 맞춥니다. */
  if (zone.walls) {
    for (const w of zone.walls) {
      blitArt(w.c, w.x * T - camX, w.y * T - camY);
      drawCount++;
    }
    /* 창밖. 벽 다음에 하늘을 칠하고 창을 한 장 더 덮습니다 - 유리만
       비치고 틀과 창살은 가립니다. 도서관 백색소음이 빗소리인 날에는
       실제로 창밖에 비가 옵니다. 소리와 창이 같은 말을 해야 합니다. */
    drawWindows(ctx, zone, camX, camY);
  }

  /* 문턱. 청록은 잔디·포석·흙 어느 바닥과도 1.2~1.9 밖에 안 갈라져서
     혼자서는 안 보입니다. 어두운 테두리가 형태를 책임지고, 밝은 청록은
     그 안에서 숨만 쉽니다 - 코랄일 때는 색이 어두워 넘어갔던 문제입니다. */
  ctx.save();
  for (const p of zone.portals) {
    const x = p.x * T - camX, y = p.y * T - camY, w = p.w * T, h = p.h * T;
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#0C5A4F';
    ctx.fillRect(x, y, w, h);
    ctx.globalAlpha = 0.26 + Math.sin(performance.now() / 400) * 0.09;
    ctx.fillStyle = '#2DD4BF';
    ctx.fillRect(x + AS, y + AS, w - 2 * AS, h - 2 * AS);
  }
  ctx.globalAlpha = 1;

  /* 방금 지나온 문. 아직 닫히는 중이라 바깥 빛이 새어 듭니다.
     문이 열리고 닫히는 것을 프레임으로 그리는 대신 빛으로 말합니다 -
     문짝을 여는 그림은 방향마다 다시 그려야 하고, 빛은 한 번이면 됩니다. */
  if (doorFlash) {
    doorFlash.t += 1 / 60;
    if (doorFlash.t > 0.42) doorFlash = null;
    else {
      const k = 1 - doorFlash.t / 0.42;
      ctx.globalAlpha = 0.5 * k * k;
      ctx.fillStyle = '#FFF3DC';
      const dx = doorFlash.x * T - camX, dy = doorFlash.y * T - camY;
      /* 아래로 갈수록 좁아지는 빛 - 문틈에서 바닥으로 쏟아지는 모양 */
      const w = doorFlash.w * T, h = doorFlash.h * T, tail = 10 * AS;
      for (let i = 0; i < h + tail; i++) {
        const t = i / (h + tail);
        const iw = Math.round(w * (1 - t * 0.45));
        ctx.globalAlpha = 0.5 * k * k * (1 - t);
        ctx.fillRect(Math.round(dx + (w - iw) / 2), dy + i, iw, 1);
      }
    }
  }
  ctx.restore();

  /* y 로 정렬해 겹칩니다. 없으면 캐릭터가 건물 앞에 붙어 평면이 됩니다. */
  const items = [];
  for (const p of zone.props) {
    const d = PROP[p.kind];
    if (p.x > x1 + 3 || p.x + d.w < x0 - 1 || p.y > y1 + 3 || p.y + d.h < y0 - 1) continue;
    /* 정렬 기준은 **바닥에 닿는 줄**입니다. d.anchor 를 주면 그 줄을,
       없으면 맨 아랫줄을 씁니다 — 가로등처럼 위가 튀어나온 물건은
       스프라이트 높이와 발 위치가 다릅니다. */
    items.push({ sort: sortKey((p.y + (d.anchor ?? d.h)) * T, p.x * T), kind: 'prop', p, d });
  }
  for (const n of zone.npcs) items.push({ sort: sortKey((n.y + 1) * T, n.x * T), kind: 'npc', n });
  /* 백조도 같은 목록에 넣습니다. 따로 그리면 물가에 선 사람 위로 새가
     뜨거나(뒤에 그리면) 연잎 밑으로 잠깁니다(앞에 그리면). 발 줄로
     정렬하는 규칙 하나에 다 맡기는 편이 언제나 맞습니다. */
  for (const s of zone.swans || []) {
    const q = LAKE.at(s);
    if (q.x < camX - T * 2 || q.y < camY - T * 2 || q.x > camX + VIEW_W || q.y > camY + VIEW_H) continue;
    items.push({ sort: sortKey(q.y + T, q.x), kind: 'swan', q });
  }
  /* 같은 줄에 섰을 때는 플레이어가 앞에 옵니다. 동점이면 정렬이 프레임마다
     뒤바뀌어 캐릭터가 물건 앞뒤로 깜빡였습니다. */
  items.push({ sort: sortKey(player.y, player.x) + 0.5, kind: 'player' });
  /* 다른 사람·봇을 같은 정렬 목록에 넣습니다 — multiplayer.js.
     병합에서 이 줄이 빠져 있었습니다. 없으면 multiplayer.js 가 사람을
     다 만들어 두고도 **한 명도 그려지지 않습니다.**
     따로 그리면 안 됩니다. 나무 뒤에 선 사람이 나무 앞에 뜹니다. */
  if (window.MP) MP.collect(items);
  items.sort((a, b) => a.sort - b.sort);

  for (const it of items) {
    if (it.kind === 'prop') {
      const { p, d } = it;
      if (d.s === 'draw') {
        if (p.kind === 'lotus') drawLakeLotus(p.x * T - camX, p.y * T - camY, p.x + p.y);
        if (p.kind === 'fish') drawLakeFish(p.x * T - camX, p.y * T - camY, p.x + p.y, 'left');
        if (p.kind === 'fishR') drawLakeFish(p.x * T - camX, p.y * T - camY, p.x + p.y, 'right');
        drawCount++;
      } else if (d.s === 'img') {
        /* 직접 그린 건물은 한 장이라 drawImage 한 번이면 끝납니다.
           타일로 쌓으면 큰 건물 하나에 100 번이 넘게 듭니다.
           천막은 바람 세기에 맞는 자세를 골라 씁니다 - 미리 구워 뒀으니
           여기서도 한 번입니다. */
        const fl = FLUTTER[p.kind];
        const img = fl
          ? fl[Math.max(0, Math.min(4, Math.round(WIND.at(p.x * T, p.y * T) * 2) + 2))]
          : d.canvas;
        blitArt(img, p.x * T - camX, p.y * T - camY);
        drawCount++;
      } else {
        const blit = BLIT[d.s];
        for (let j = 0; j < d.h; j++) for (let i = 0; i < d.w; i++) {
          blit(d.t[j][i], (p.x + i) * T - camX, (p.y + j) * T - camY);
          drawCount++;
        }
      }
    } else if (it.kind === 'npc') {
      /* 머리 위 표시는 여기서 안 그립니다 — 조명 뒤에 한 번에 그립니다
         (drawMarks). 여기서 그리면 뒤에 오는 소품이 표시를 덮습니다. */
      drawNpc(it.n);
      drawCount++;
    } else if (it.kind === 'swan') {
      drawLakeSwan(it.q.x - camX, it.q.y - camY, it.q.dir); drawCount++;
    } else if (it.kind === 'mp') { MP.drawOne(it.rp); drawCount++;
    } else { drawPlayer(); drawCount++; }
  }

  /* 끌고 있는 가구. 사람·기물 위에 얹습니다 — 어디에 놓이는지가 지금
     가장 중요한 정보이고, 침대 뒤에 반쯤 가린 유령은 못 읽습니다. */
  if (DECOR.it) {
    const d = PROP[DECOR.it.prop];
    const gx = DECOR.x * T - camX, gy = DECOR.y * T - camY;
    ctx.save();
    /* ---- 놓을 수 있는 칸 전부 ----
       커서 밑 한 칸만 색이 바뀌면 어디가 되는지 한 칸씩 찍어 봐야
       압니다. 되는 칸을 통째로 켜 두면 방을 한 번 훑는 것으로 끝납니다.
       천천히 숨 쉬게 하는 이유 — 바닥에 칠한 색은 가만히 있으면 방
       무늬로 읽히고, 움직이면 "지금 뜬 것" 으로 읽힙니다. */
    if (DECOR.spots) {
      const m = zone;
      const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 300);
      const on = (x, y) => x >= 0 && y >= 0 && x < m.w && y < m.h && DECOR.spots[at(m, x, y)];
      const x0 = Math.max(0, Math.floor(camX / T)), x1 = Math.min(m.w, Math.ceil((camX + VIEW_W) / T));
      const y0 = Math.max(0, Math.floor(camY / T)), y1 = Math.min(m.h, Math.ceil((camY + VIEW_H) / T));
      for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
        if (!DECOR.spots[at(m, x, y)]) continue;
        const px0 = x * T - camX, py0 = y * T - camY;
        ctx.globalAlpha = 0.26 + 0.12 * pulse;
        ctx.fillStyle = MINT;
        ctx.fillRect(px0 + 2, py0 + 2, T - 4, T - 4);
        /* 테두리는 **덩어리 바깥에만** 긋습니다. 칸마다 두르면 격자무늬가
           되고, 격자는 놓을 자리가 아니라 바닥 재질로 보입니다. */
        ctx.globalAlpha = 0.72 + 0.28 * pulse;
        const e = 2;
        if (!on(x, y - 1)) ctx.fillRect(px0, py0, T, e);
        if (!on(x, y + 1)) ctx.fillRect(px0, py0 + T - e, T, e);
        if (!on(x - 1, y)) ctx.fillRect(px0, py0, e, T);
        if (!on(x + 1, y)) ctx.fillRect(px0 + T - e, py0, e, T);
      }
    }
    /* ---- 지금 놓이는 자리 ----
       되면 민트, 안 되면 빨강. 그림만 반투명하게 얹으면 몇 칸을
       차지하는지 안 보입니다. */
    ctx.globalAlpha = 0.30;
    ctx.fillStyle = DECOR.ok ? MINT : '#E0483A';
    ctx.fillRect(gx, gy, d.w * T, d.h * T);
    ctx.globalAlpha = DECOR.ok ? 0.92 : 0.45;
    blitArt(d.canvas, gx, gy);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = DECOR.ok ? '#0C5A4F' : '#8E2A20';
    ctx.lineWidth = 2;
    ctx.strokeRect(gx + 1, gy + 1, d.w * T - 2, d.h * T - 2);
    /* 못 놓는 자리에는 가위표. 색만으로 알리면 색을 못 가르는 사람에게는
       아무 표시도 없는 것과 같습니다. */
    if (!DECOR.ok) {
      ctx.strokeStyle = '#8E2A20'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      const cx0 = gx + d.w * T / 2, cy0 = gy + d.h * T / 2, r = Math.min(d.w, d.h) * T * 0.28;
      ctx.beginPath();
      ctx.moveTo(cx0 - r, cy0 - r); ctx.lineTo(cx0 + r, cy0 + r);
      ctx.moveTo(cx0 + r, cy0 - r); ctx.lineTo(cx0 - r, cy0 + r);
      ctx.stroke();
    }
    ctx.restore();
    drawCount++;
  }

  /* 벽시계 바늘 — 진짜 시각. 방에 있는 동안 분침이 움직입니다. */
  if (zone.clock) {
    const now = new Date();
    /* 시계판은 벽 그림(TS 눈금)에 그려져 있습니다. 바늘만 여기서 얹으므로
       판 안 좌표에 AS 를 곱해야 바늘이 판 한가운데에 섭니다. */
    const cx = zone.clock.x * T + 8 * AS - camX;
    const cy = zone.clock.y * T + 22 * AS - camY;
    const mm = (now.getMinutes() + now.getSeconds() / 60) / 60 * Math.PI * 2;
    const hh = ((now.getHours() % 12) + now.getMinutes() / 60) / 12 * Math.PI * 2;
    ctx.strokeStyle = '#2A3440'; ctx.lineCap = 'butt';
    ctx.lineWidth = 1.6 * AS;
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.sin(hh) * 4.2 * AS, cy - Math.cos(hh) * 4.2 * AS); ctx.stroke();
    ctx.lineWidth = AS;
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.sin(mm) * 6.4 * AS, cy - Math.cos(mm) * 6.4 * AS); ctx.stroke();
    ctx.fillStyle = '#C2412C';
    ctx.fillRect(cx - AS, cy - AS, 2 * AS, 2 * AS);
    drawCount++;
  }

  /* 구름 그림자는 사람 위로도 지나갑니다. 땅에만 깔면 구름이 건물
     뒤에서만 흐르는 것이 되고, 실제로는 지나가는 자리를 다 덮습니다. */
  CLOUDS.draw(ctx, zone, camX, camY);

  /* 밖에 서 있을 때만 비를 맞습니다. 실내에서는 창에만 내립니다. */
  if (!zone.floor) PRECIP.draw(ctx, WEATHER.kind());

  /* 조명은 맨 마지막입니다. 땅도 건물도 사람도 같은 빛을 받아야
     한 공간에 있는 것으로 보입니다. HUD 는 캔버스 밖이라 안 어두워집니다. */
  LIGHTMAP.apply(ctx, zone, camX, camY, VIEW_W, VIEW_H);

  /* 만질 수 있다는 표시. 조명 뒤입니다 — 위 함수 주석 참고. */
  drawMarks();

  /* 존 전환. 조명보다도 나중입니다 - 화면을 덮는 것이지 공간 안의
     빛이 아닙니다. 새까만 대신 따뜻한 어둠을 씁니다. 순검정은 전원이
     꺼진 느낌이고, 이건 문을 지나는 동안입니다. */
  if (travel) {
    const k = travel.t < TRAVEL_OUT
      ? travel.t / TRAVEL_OUT                                  // 어두워지는 중
      : 1 - (travel.t - TRAVEL_OUT) / TRAVEL_IN;               // 밝아지는 중
    ctx.fillStyle = '#17110E';
    ctx.globalAlpha = Math.max(0, Math.min(1, k));
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.globalAlpha = 1;
  }
}

/* ==================================================================
   만질 수 있다는 표시 — 역삼각형 하나

   기호는 **아래를 가리키는 삼각형**입니다. 셋을 놓고 골랐습니다.

     · `!` — RPG 문법에서 "새 일감" 입니다. 여기 물건은 늘 만질 수 있어서
       항상 떠 있는 `!` 는 안 읽은 알림처럼 보이고, 며칠이면 눈이 지나칩니다.
       글자라서 크기를 줄이면 획이 먼저 무너지기도 합니다.
     · `✦` — 예쁘지만 무엇을 가리키는지는 안 말합니다.
     · `▼` — **가리키는 도구**입니다. 개더·ZEP 이 상호작용 물건 위에 띄우는
       것과 같고, 글꼴이 필요 없어 어떤 크기에서도 무너지지 않으며,
       언어가 없습니다. 밑변이 넓어 멀리서도 눈에 걸립니다.

   두 가지 상태로 말합니다 — 그냥 있으면 작고 청록, **스페이스가 닿는
   거리**면 커지고 밝아집니다. 크기와 밝기를 같이 바꾸는 이유는 어두운
   가구 위에서는 크기가, 밝은 벽 위에서는 밝기가 먼저 보이기 때문입니다.
   어느 바탕에서도 하나는 남습니다. 테두리는 늘 어두운 청록이라 흰 벽에
   흰 표시가 묻히는 일이 없습니다.

   조명(LIGHTMAP) **뒤에** 그립니다. 밤에 어두워지는 것은 공간이지
   "여기를 누르세요" 가 아닙니다. */
function drawMark(cx, baseY, active, phase) {
  if (cx < -40 || cx > VIEW_W + 40 || baseY < -40 || baseY > VIEW_H + 40) return;
  const wAS = active ? 12 : 8;                 // 밑변, 그림 눈금
  const rows = wAS / 2;
  const bob = Math.round(Math.sin(performance.now() / 420 + phase) * (active ? 2 : 1.4)) * AS;
  const y = Math.round(baseY - (rows + 3) * AS + bob);
  const x = Math.round(cx);

  ctx.fillStyle = active ? '#083B34' : '#0C5A4F';
  ctx.fillRect(x - (wAS / 2 + 1) * AS, y - AS, (wAS + 2) * AS, AS);
  for (let j = 0; j < rows; j++) {
    const w = (wAS - 2 * j) * AS;
    ctx.fillRect(x - w / 2 - AS, y + j * AS, w + 2 * AS, AS);
  }
  ctx.fillRect(x - AS, y + rows * AS, 2 * AS, AS);

  ctx.fillStyle = active ? '#A8FBF0' : '#2DD4BF';
  for (let j = 0; j < rows; j++) {
    const w = (wAS - 2 * j) * AS;
    ctx.fillRect(x - w / 2, y + j * AS, w, AS);
  }
  /* 윗면 한 줄만 더 밝게 — 삼각형이 판이 아니라 덩어리로 보입니다 */
  ctx.fillStyle = active ? '#FFFFFF' : 'rgba(255,255,255,.55)';
  ctx.fillRect(x - (wAS / 2 - 1) * AS, y, (wAS - 2) * AS, AS);
  drawCount++;
}

/** 이 존에서 만질 수 있는 것 위에 표시를 답니다. 사람도 물건도 같은 표시입니다 —
    둘이 다르면 "무엇을 누를 수 있는가" 를 두 번 배워야 합니다. */
function drawMarks() {
  /* 가구를 놓는 중이거나 대화 중에는 안 답니다. 지금 할 일이 하나로
     정해져 있는데 화면이 다른 것을 가리키면 방해입니다. */
  if (DECOR.it || dialogOpen) return;
  for (const t of zone.things || []) {
    const cx = (t.x + (t.w || 1) / 2) * T - camX;
    const top = (t.y + (t.top || 0)) * T - camY;
    drawMark(cx, top, nearby?.kind === 'talk' && nearby.npc === t, t.x * 0.6);
  }
  for (const n of zone.npcs) {
    const lift = n.species && n.sheet ? CHAR_GROUND_Y : T;
    drawMark(n.x * T + T / 2 - camX, (n.y + 1) * T - lift - camY,
             nearby?.kind === 'talk' && nearby.npc === n, n.x * 0.6);
  }
  /* 앉는 자리는 **지금 앞에 있는 하나만** 답니다. 도서관 의자가 쉰넷이라
     전부에 달면 표시가 아니라 무늬가 됩니다 — 개더도 의자에는 안 답니다. */
  if (nearby?.kind === 'sit')
    drawMark(nearby.spot.x * T + T / 2 - camX, nearby.spot.y * T - camY, true, 0);
}

/* 캐릭터 — 종 시트 32x48 에 산 옷을 겹쳐 구운 한 장을 얹습니다.
   타일이 32px 이므로 캐릭터는 가로 한 칸 세로 한 칸 반입니다. 발바닥은 프레임
   안 y45 이고(y46-47 은 예전 그림자 자리), 그래서 발 위치에서 45 를 빼고
   그립니다. 정렬은 예전처럼 발 줄로 하므로 기물 앞뒤가 그대로입니다.

   시트가 아직 안 왔으면 예전 16px 사람으로 물러납니다 — 빈 화면보다
   낫고, 시트가 도착하면 다음 프레임부터 저절로 바뀝니다. */
function drawPlayer() {
  const sheet = dressedSheet();
  /* 예비로 쓰는 16px 사람만 아직 통째로 흔들립니다 — 32x48 시트 쪽 흔들림은
     자세 시트(bakeStance)가 팔다리와 같이 만듭니다. */
  let bob = player.moving && !player.sitting ? (Math.floor(player.anim * 2) % 2 ? -1 : 0) : 0;

  /* 그림자는 시트에 굽지 않고 여기서 그립니다 — 종마다 발 폭이 달라도
     같은 타원이 깔려야 다 같은 바닥에 서 있는 것으로 보입니다.
     앉았을 때는 안 깝니다 — 발이 바닥에 없고, 의자가 제 그림자를 갖고 있습니다. */
  const fx = Math.round(player.x - camX), fy = Math.round(player.y - camY);
  /* 탈것을 탔으면 바닥 그림자를 안 깝니다 — 탈것이 제 그림자를 갖고
     있어서 둘이 겹치면 두 겹으로 보입니다(의자와 같은 이유). */
  const ride = player.sitting ? null : myRide();
  if (!player.sitting && !ride) {
    ctx.save();
    ctx.globalAlpha = 0.22; ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(fx, fy - 1, 6, 2.4, 0, 0, 7); ctx.fill();
    ctx.restore();
  }
  /* 탈것은 **사람보다 먼저** 그립니다. 사람이 그 위에 앉거나 서 있어야
     하고, 나중에 그리면 자전거가 사람 얼굴을 가립니다.
     구름만 위아래로 아주 조금 떠다닙니다 — 바퀴가 없는 것을 움직임으로
     한 번 더 말합니다. */
  if (ride && RIDE_ART[ride.id]) {
    const art = RIDE_ART[ride.id];
    const img = player.dir === 'side' ? art.side : (art.front || art.side);
    const w = img.width * AS, h = img.height * AS;
    const float = ride.lift ? Math.round(Math.sin(WIND.t * 2.2) * 1.5) : 0;
    /* 사람도 같이 뜹니다. 구름만 뜨고 사람이 제자리면 구름을 밟고 선
       것이 아니라 구름이 발밑을 지나가는 것으로 보입니다. */
    /* 앉아서 타면 안장까지 더 올립니다. pose 로 자세를 바꾸면 몸이
       짧아지므로, 그 짧아진 만큼을 seatY 가 되돌려 안장에 앉힙니다. */
    bob -= ride.lift + float + (ride.pose === 'sit' ? ride.seatY : 0);
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    /* 옆모습은 바라보는 쪽으로 뒤집습니다. 탈것은 좌우가 대칭이 아니라
       (핸들이 앞에 있습니다) 안 뒤집으면 뒤로 타고 갑니다. */
    if (player.dir === 'side' && !player.flip) {
      ctx.translate(fx + w / 2, 0); ctx.scale(-1, 1);
      ctx.drawImage(img, 0, fy - h + 3 + float, w, h);
    } else {
      ctx.drawImage(img, fx - w / 2, fy - h + 3 + float, w, h);
    }
    ctx.restore();
  }

  /* 앉고 일어설 때 한 번 눌립니다. 세로만 줄이고 발끝을 바닥에 붙여
     둬야 눌린 것으로 보입니다 - 가운데를 기준으로 줄이면 떠오릅니다.
     0.18 초. 이보다 길면 물컹해지고 짧으면 안 보입니다. */
  if (sitSquash > 0) sitSquash = Math.max(0, sitSquash - 1 / 60 / 0.18);
  const sq = sitSquash > 0 ? 1 - Math.sin(sitSquash * Math.PI) * 0.16 : 1;

  if (!sheet) {
    const col = DIR_COL[player.dir];
    const rowI = player.moving ? WALK_ROW[player.frame & 3] : 0;
    const idx = CHAR_BASE + rowI * U_COLS + col;
    const old = playerSheet();
    /* 자르는 자는 TS(옛 시트는 16px), 얹는 자는 T 입니다 — 예비 그림도
       한 칸을 채워야 종 시트가 왔을 때와 발 크기가 비슷하게 보입니다. */
    const ox = (idx % U_COLS - CHAR_SHEET_COL) * TS, oy = ((idx / U_COLS) | 0) * TS;
    ctx.save();
    if (sq !== 1) { ctx.translate(fx, fy); ctx.scale(1, sq); ctx.translate(-fx, -fy); }
    if (player.dir === 'side' && player.flip) {
      ctx.translate(fx + T / 2, fy - T + bob); ctx.scale(-1, 1);
      ctx.drawImage(old, ox, oy, TS, TS, 0, 0, T, T);
    } else {
      ctx.drawImage(old, ox, oy, TS, TS, fx - T / 2, fy - T + bob, T, T);
    }
    ctx.restore();
    return;
  }

  /* 방향 — 시트 순서는 right, up, left, down 이고 아이템과 같습니다.
     player.dir 의 'side' 는 좌우를 flip 으로 만들던 16px 시절 표현이라
     여기서 left/right 로 풀어 줍니다. 시트에 양쪽이 다 들어 있어
     뒤집을 필요가 없고, 뒤집으면 옷의 단추가 반대편으로 갑니다. */
  const dirName = player.dir === 'side' ? (player.flip ? 'left' : 'right')
    : player.dir === 'up' ? 'up' : 'down';

  /* 걷기 네 박자와 앉은 자세는 자세 시트에서 골라 옵니다. 자세 시트를 아직
     못 구우면(그림이 늦게 오거나 file:// 로 픽셀을 못 읽으면) pose 가 원래
     시트의 같은 자리를 돌려주므로, 서 있는 그림으로 그대로 나옵니다. */
  /* 앉아서 타는 탈것이면 **앉은 자세**를 씁니다. 걷기 네 박자를 그대로
     쓰면 자전거 위에서 다리를 저으며 걸어가는 그림이 됩니다. */
  const rideSit = !!(ride && ride.pose === 'sit');
  const P = GIRIN_CHAR.pose(sheet, speciesOf(ROOM.character).slug, dirName,
    { sitting: player.sitting || rideSit, moving: player.moving && !rideSit, frame: player.frame });

  ctx.save();
  if (sq !== 1) { ctx.translate(fx, fy); ctx.scale(1, sq); ctx.translate(-fx, -fy); }
  ctx.drawImage(P.img, P.sx, P.sy, CHAR_W, CHAR_H,
                fx - CHAR_W / 2, fy - CHAR_GROUND_Y - P.lift, CHAR_W, CHAR_H);
  ctx.restore();
}

/* NPC 도 나와 **같은 규격**입니다.

   전에는 urban.png 의 16px 사람을 오려 썼습니다. 타일이 16 이던 때는
   그럭저럭 맞았는데, 타일을 32 로 올리면서 나는 한 칸 반이 되고 NPC 는
   한 칸이 됐습니다 — 캠퍼스에 어른 하나와 아이 여섯이 서 있는 꼴입니다.

   그림을 새로 그리지 않고 우리 8종 파이프라인을 그대로 씁니다.
   sheetFor(종, 입은 것, 학교) 가 128x48 시트를 돌려주고, 굽는 것은
   종·옷 조합마다 한 번뿐이라(otherCache) 여섯 명이 여섯 장을 쓰지
   않습니다. 학교는 안 넘깁니다 — 우리 학교 사람들이니 내 과잠 색이 맞습니다.

   시트가 아직 안 왔으면 예전 16px 사람으로 물러납니다. 돌려주는 값은
   **발에서 머리끝까지의 높이**이고, 부르는 쪽이 느낌표를 그 위에 얹습니다. */
function drawNpc(n) {
  const fx = n.x * T + T / 2 - camX, fy = (n.y + 1) * T - camY;
  /* 시트는 사람마다 한 번만 찾습니다. sheetFor 는 캐시가 있어도 부를 때마다
     입은 것을 JSON 으로 찍어 열쇠를 만드는데, 그걸 여섯 명 × 60프레임 =
     초당 360번 합니다. 학교 색이 바뀌면 열쇠가 달라져 저절로 다시 찾습니다.
     아직 시트가 안 왔으면 열쇠를 안 남겨 다음 프레임에 또 시도합니다. */
  if (n.species && window.GIRIN_CHAR) {
    const tint = schoolColor();
    if (n.sheetKey !== tint) {
      n.sheet = GIRIN_CHAR.sheetFor(n.species, n.worn, null);
      n.sheetKey = n.sheet ? tint : null;
    }
  }
  const sheet = n.sheet;

  if (!sheet) {
    blitU(n.sprite, n.x * T - camX, n.y * T - camY);
    return T;
  }
  /* 그림자는 플레이어와 같은 타원입니다. 다르면 같은 바닥에 안 서 있는
     것으로 보입니다 — multiplayer.js 의 drawBig 과도 같은 값입니다. */
  ctx.save();
  ctx.globalAlpha = 0.22; ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(fx, fy - 1, 6, 2.4, 0, 0, 7); ctx.fill();
  ctx.restore();

  /* NPC 는 안 걷지만 자세 창구는 같이 씁니다 — 옆을 보고 선 NPC 도 먼 쪽
     팔다리가 죽어 있어야 나와 같은 몸으로 보입니다. */
  const P = GIRIN_CHAR.pose(sheet, speciesOf(n.species).slug, n.dir || 'down', null);
  ctx.drawImage(P.img, P.sx, P.sy, CHAR_W, CHAR_H,
                fx - CHAR_W / 2, fy - CHAR_GROUND_Y - P.lift, CHAR_W, CHAR_H);
  return CHAR_GROUND_Y;
}

const promptEl = document.getElementById('prompt');
const headTimerEl = document.getElementById('headTimer');
const headTimerVal = headTimerEl.querySelector('b');
const headWhoEl = document.getElementById('headWho');
/* "명지대학교" 를 그대로 쓰면 학교가 이름보다 깁니다. multiplayer.js 의
   이름표가 쓰는 규칙과 **같은 규칙**입니다 — 내 이름표와 남의 이름표가
   다른 규칙으로 줄면 같은 학교가 두 이름으로 보입니다. */
const shortSchoolName = (n) => String(n || '').replace('여자대학교', '여대').replace('대학교', '대');
let headWhoCache = '';
function syncHeadWho() {
  const sc = shortSchoolName(ROOM.school);
  const txt = ROOM.nickname ? (sc ? ROOM.nickname + ' / ' + sc : ROOM.nickname) : '';
  if (txt !== headWhoCache) { headWhoCache = txt; headWhoEl.textContent = txt; }
}
function syncPrompt() {
  const r = cv.getBoundingClientRect();
  const hx = r.left + (player.x - camX) * SCALE;
  /* 발에서 프레임 맨 위까지 올립니다. 예전엔 T(16)만큼만 올렸는데,
     캐릭터가 32x48 이 되면서 그 높이가 배꼽입니다 — multiplayer.js 의
     이름표가 groundY(45)를 쓰는 것과 같은 이유입니다. */
  /* 앉으면 몸이 의자 높이만큼 올라가므로 머리 위 자리도 같이 올립니다.
     안 올리면 세션 시계가 앉은 캐릭터 이마에 걸칩니다. */
  const lift = ((window.GIRIN_CHAR && GIRIN_CHAR.groundY) || T)
    + (player.sitting && window.GIRIN_CHAR ? (GIRIN_CHAR.sitLift || 0) : 0);
  const hy = r.top + (player.y - lift - camY) * SCALE;
  /* 타이머가 먼저 머리 위에 앉고, 안내는 그 위로 비켜 섭니다.
     같은 자리에 두면 말 걸 때마다 시간이 가려집니다. */
  const live = SESSION.startedAt && !SESSION.ended;
  headTimerEl.classList.toggle('on', !!live && !dialogOpen);
  if (live) {
    headTimerVal.textContent = sessionText();
    syncHeadWho();
    headTimerEl.style.left = hx + 'px';
    headTimerEl.style.top = hy - 4 + 'px';
  }
  /* 자세 말풍선도 같은 머리 좌표를 씁니다. 타이머·안내보다 한 층 위에
     떠서 셋이 안 겹칩니다. */
  if (sayEl.classList.contains('on')) {
    sayEl.style.left = hx + 'px';
    sayEl.style.top = hy - (live ? 46 : 28) + 'px';
  }
  if (!nearby || dialogOpen) { promptEl.classList.remove('on'); return; }
  /* 키 이름은 안 붙입니다. 게시판마다 "Space · 미니게임 설명 보기" 처럼
     같은 낱말이 앞에 반복되면, 정작 읽어야 하는 뒷말이 뒤로 밀립니다.
     Space 는 첫 진입 안내가 한 번 알려 주고 설정의 조작 목록에 남아
     있으므로, 칩은 **무엇을 할 수 있는지**만 말합니다. */
  promptEl.textContent = nearby.kind === 'sit' ? '앉기'
    : nearby.kind === 'stand' ? '일어나기'
    : nearby.npc.name.split(' · ')[0];
  promptEl.style.left = hx + 'px';
  promptEl.style.top = hy - (live ? 24 : 6) + 'px';
  promptEl.classList.add('on');
}

const el = {
  fpsGame: document.getElementById('fps-game'),
  fpsPose: document.getElementById('fps-pose'),
  draws: document.getElementById('draw-count'),
  sitTime: document.getElementById('sit-time'),
  lm: document.getElementById('lm-count'),
};

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw(); syncPrompt();
  rwTick(now);
  gameFrames++;
  if (now - fpsClock >= 500) {
    gameFps = Math.round(gameFrames * 1000 / (now - fpsClock));
    poseFps = Math.round(poseFrames * 1000 / (now - fpsClock));
    gameFrames = 0; poseFrames = 0; fpsClock = now;
    el.fpsGame.textContent = gameFps;
    el.fpsGame.className = gameFps < 50 ? 'warn' : '';
    el.fpsPose.textContent = poseRunning ? poseFps : '–';
    el.fpsPose.className = poseRunning && poseFps < 12 ? 'warn' : '';   // 목표가 ~15fps 라 20이면 늘 빨갛습니다
    el.draws.textContent = drawCount + ' draws';
    el.lm.textContent = LIVE.recoveries;
  }
  if (SESSION.startedAt) {
    el.sitTime.textContent = sessionText();
    if (!SESSION.ended) sessTime.textContent = sessionText();
  }
  requestAnimationFrame(frame);
}

/* 학교 색이 닿는 것을 한 번 칠하고 시작합니다.

   페넌트와 학교 방석은 canvasOf 로 **빈 캔버스만** 만들어 두고
   paintSchoolProps 가 채우는데, 그 함수를 부르는 곳이 학교 변경 ·
   친구 방 방문 · 내 방 복귀 셋뿐이었습니다. 그래서 처음 들어온 사람에게는
   두 기물이 투명한 채로 서 있었습니다 — 방에 놓여 있는데 화면에는 없습니다.
   여기서 부르는 이유는 ROOM 이 있어야 색을 알 수 있기 때문입니다. */
applySchoolColor();

let ready = 0;
function maybeStart() {
  if (++ready < 3) return;
  document.getElementById('boot').classList.add('gone');
  enterZone('dorm', 7, 8);
  requestAnimationFrame(frame);
  /* 첫 안내는 여기서 안 띄웁니다 — enterZone 이 기숙사에 들어올 때
     띄웁니다. 부팅 직후에도 결국 기숙사로 들어오므로 처음 온 사람은
     똑같이 보게 되고, 저장소를 지우고 다시 온 사람도 방에 들어서는
     순간에 봅니다. */
}
function failed(name) {
  document.getElementById('boot').textContent =
    'assets/' + name + ' 을 못 읽었습니다. 이 파일과 같은 폴더에 assets/ 가 있어야 합니다.';
}
urban.onload = maybeStart;   urban.onerror = () => failed('urban.png');
city.onload = maybeStart;    city.onerror = () => failed('city.png');
school.onload = maybeStart;  school.onerror = () => failed('school16.png');
urban.src = 'assets/urban.png';
city.src = 'assets/city.png';
school.src = 'assets/school16.png';
</script>
