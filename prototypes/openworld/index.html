/* ==================================================================
   미니게임 5 — 거북목 탈출 러너 · 운동장

   이 월드에서 자세를 **조작 장치로** 쓰는 유일한 게임입니다. 고개를
   살짝 들면 캐릭터가 뜁니다. 그것 하나뿐이라 규칙을 설명할 것이 없고,
   요구하는 동작이 마침 목에 좋은 쪽입니다.

   ---- 지켜야 하는 것 셋 ----

   1) **절대 각도로 판정하지 않습니다.** 판정과 똑같은 식을 씁니다:
        (v - median) * DIRECTION / tol,  tol = 감도 × max(FLOOR, MAD×8)
      부호만 뒤집어서 "기준보다 고개를 든 정도" 로 읽습니다. 원래
      고개가 앞으로 나와 있는 사람도 자기 기준에서 조금만 들면 뜁니다.
      절대값으로 잡으면 그 사람은 이 게임을 **아예 못 합니다.**

   2) **카메라 없이도 됩니다.** 축값이 안 오면 그 자리에서 Space 로
      바뀌고 화면에 그렇게 적습니다. 카메라를 켜 둔 사람도 Space 를
      같이 쓸 수 있습니다 — 조작을 카메라 뒤에 잠그지 않습니다.

   3) **자세에 점수를 매기지 않습니다**(AGENTS.md §2.2). 고개를 든
      횟수도 크기도 기록하지 않고 아무 데도 안 보냅니다. 성적은 달린
      거리로만 납니다. 그리고 나쁜 자세를 **요구하지 않습니다** —
      숙이라고 시키는 조작은 넣지 않았습니다. 한 바퀴(400m)로 끝나는
      것도 같은 이유입니다.
   ================================================================== */

/* 고개 각도를 말하는 축들. 넷 다 "숙임" 이 이탈 방향이라, 부호를 뒤집으면
   그대로 "듦" 이 됩니다. 한 축만 쓰면 그 축이 빠진 기준에서 게임이
   안 돌아가므로, 있는 것만 모아 **중앙값**을 씁니다 — 하나가 튀어도
   조작이 흔들리지 않습니다. */
const RUN_PITCH_AXES = ['headPitchDeg', 'facePitchRatio', 'earEyeRatio', 'headHeightRatio'];
/* 허용치(tol) 배수로 읽습니다. 판정이 "기준에서 벗어났다" 고 보기
   시작하는 값이 1.0 이므로, 0.7 은 그보다 작은 **분명하지만 가벼운**
   움직임입니다 — headPitchDeg 기준이면 약 5.6도. 여기를 더 올리면
   목을 크게 젖혀야 하고, 그건 이 게임이 시키면 안 되는 동작입니다. */
const RUN_JUMP_AT = 0.7;
const RUN_REARM_AT = 0.3;        // 여기까지 돌아와야 다시 뜁니다
const RUN_STALE_MS = 700;        // 이보다 오래된 축값은 안 씁니다

/** 기준선 대비 **고개를 든 정도**. 자세가 안 잡히면 null 을 돌려주고,
    부르는 쪽은 그때 자판으로 물러납니다. 양수 = 기준보다 들었음. */
function postureLift() {
  const f = LIVE.features;
  if (!f || !LIVE.featAt || performance.now() - LIVE.featAt > RUN_STALE_MS) return null;
  /* LIVE.profile 은 기준선 객체이고 축 표는 그 안 features 입니다.
     옛 저장본이 표를 바로 들고 있을 수 있어 두 모양을 다 받습니다. */
  const prof = (LIVE.profile && LIVE.profile.features) || LIVE.profile;
  if (!prof) return null;
  const mult = POSE.SENS[SENSITIVITY] || 1;
  const vals = [];
  for (const k of RUN_PITCH_AXES) {
    const v = f[k], st = prof[k];
    if (v === undefined || !st) continue;
    const tol = mult * Math.max(POSE.FLOOR[k], st.mad * POSE.MAD_K);
    if (!(tol > 0)) continue;
    vals.push(-((v - st.median) * POSE.DIRECTION[k]) / tol);
  }
  if (!vals.length) return null;
  vals.sort((a, b) => a - b);
  const mid = vals.length >> 1;
  return vals.length % 2 ? vals[mid] : (vals[mid - 1] + vals[mid]) / 2;
}

const RUN_LAP_M = 400;           // 트랙 한 바퀴. 이 이상은 목을 시키는 일이 됩니다
/* 그림 눈금. 판이 480px 에서 880px 로 넓어지면서 미터당 픽셀도 같이
   키웠습니다(16 -> 24). 안 키우면 같은 400m 가 두 배로 길게 보여서,
   한 바퀴가 두 바퀴처럼 느껴집니다. 대신 속도도 1.5배라 **걸리는 시간은
   그대로 24초쯤**입니다 — 재 보고 맞춘 값입니다. */
const RUN_PX_M = 24;             // 그림 픽셀 / 미터
const RUN_LIVES = 3;
/* 중력과 뛰는 힘도 같은 비율. 체공 시간 0.57초는 그대로 두고 높이만
   1.5배(62 -> 92px)가 되도록 둘 다 1.5배 했습니다. 체공이 길어지면
   "고개를 들고 기다리는" 조작이 되는데, 그건 이 게임이 시키면 안 되는
   자세입니다. */
const RUN_G = 2250;              // 중력 px/s²
const RUN_V0 = -645;             // 뛰는 힘 — 0.57초 떠 있습니다
const RUN_W = 880, RUN_H = 300, RUN_GY = 232, RUN_ME = 128;
const POSTURE_RUN = {
  active: false, raf: 0, last: 0, over: false, won: false, rewarded: false,
  dist: 0, spd: 0, y: 0, vy: 0, lives: RUN_LIVES, invuln: 0,
  obs: [], nextAt: 0, lift: null, armed: true, mode: 'key', jumps: 0, step: 0, rowsAt: 0,
  clear: 0, bestClear: 0, shake: 0, land: 0, overAt: 0, cloud: 0,
};

function postureRunHtml() {
  return `
    <p>고개를 살짝 들면 뛰어넘습니다. 트랙 <b>한 바퀴 400m</b>면 끝이에요.</p>
    <div class="rows">
      <div class="row"><span>조작</span><span class="val" id="run-mode">준비 중</span></div>
      <div class="row"><span>남은 거리</span><span class="val" id="run-dist">400m</span></div>
      <div class="row"><span>연속 통과</span><span class="val" id="run-clear">0개</span></div>
      <div class="row"><span>부딪힘</span><span class="val" id="run-life">0 / ${RUN_LIVES}</span></div>
    </div>
    <canvas id="run-cv" width="${RUN_W}" height="${RUN_H}" role="img"
      aria-label="운동장 트랙을 달리는 기린. 고개를 들거나 스페이스를 누르면 뜁니다."
      style="width:100%;aspect-ratio:${RUN_W}/${RUN_H};margin:12px 0 0;border-radius:14px;border:1px solid var(--line-2);display:block"></canvas>
    <div style="margin:10px 0 10px;height:12px;border-radius:999px;background:var(--surface-3);overflow:hidden;border:1px solid var(--line-2)">
      <i id="run-bar" style="display:block;width:0%;height:100%;background:var(--good);transition:width .1s linear"></i>
    </div>
    <p class="hint" id="run-msg" aria-live="polite">시작합니다. 고개를 들 준비!</p>
    <button class="act" data-do="run-restart">다시 하기</button>
    <div class="note">고개를 살짝 들었다가 <b>제자리로 돌아오면</b> 한 번 뜁니다.
    억지로 젖히지 않으셔도 되고, 카메라가 꺼져 있으면 Space 로 하시면 됩니다.
    이 게임은 자세에 점수를 매기지 않아요 — 고개 움직임을 조작으로만 씁니다.
    <b>${RUN_LIVES}번</b> 부딪히면 그 판은 끝이에요. 뒤로 갈수록 장애물이
    촘촘해지고, 200m 부터는 둘씩 붙어 나오기도 해요.</div>`;
}

/** 조작 갈래를 매 프레임 다시 정합니다. 세션 도중에 기준이 잡히면
    그 자리에서 고개 조작이 살아나야 합니다. */
function postureRunMode() {
  const lift = postureLift();
  POSTURE_RUN.lift = lift;
  POSTURE_RUN.mode = lift === null ? 'key' : 'pose';
  return POSTURE_RUN.mode;
}

function jumpPostureRun() {
  const R = POSTURE_RUN;
  if (!R.active || R.over || R.y > 0) return;
  R.vy = RUN_V0; R.y = 0.001; R.jumps++;
  SFX.chair(true);
  /* 발밑 먼지 — 뛴 자리에 흔적이 남아야 "내가 뛰었다" 가 됩니다 */
  JUICE.puff(RUN_ME + 14, RUN_GY - 2, 'rgba(232,206,180,.85)', 6);
}

function postureRunTick(now) {
  const R = POSTURE_RUN;
  if (!R.active) return;
  R.raf = requestAnimationFrame(postureRunTick);
  const dt = Math.min(0.05, (now - R.last) / 1000);
  R.last = now;
  if (dt <= 0) return;

  /* ---- 조작 ----
     여기는 웹캠 자세 엔진이 그대로 물려 있는 자리입니다. 손대지 않습니다. */
  const before = R.mode;
  const lift = postureRunMode() === 'pose' ? R.lift : null;
  if (lift !== null) {
    /* 한 번 들면 한 번만 뜁니다. 계속 들고 있는다고 연달아 뛰면 "든 채로
       버티기" 가 유리해지는데, 그건 이 게임이 시키면 안 되는 동작입니다. */
    if (R.armed && lift >= RUN_JUMP_AT) { R.armed = false; jumpPostureRun(); }
    else if (!R.armed && lift <= RUN_REARM_AT) R.armed = true;
  } else R.armed = true;
  if (before !== R.mode) postureRunPaintRows();

  /* ---- 달리기 ----
     조금씩 빨라집니다 — 한 바퀴 동안 300 -> 500(px/s). 끝에 가서 숨이
     차야 완주가 완주로 느껴집니다. */
  R.spd = Math.min(500, R.spd + 7.5 * dt);
  R.dist += R.spd * dt;
  R.step += R.spd * dt;
  R.cloud += dt;
  if (R.invuln > 0) R.invuln -= dt;
  R.shake = Math.max(0, R.shake - dt * 2.4);
  R.land = Math.max(0, R.land - dt * 5);
  JUICE.update(dt);
  /* y 는 땅에서 뜬 높이(위가 +), vy 는 화면 좌표 방향(위가 -)입니다. */
  if (R.y > 0 || R.vy !== 0) {
    const wasUp = R.y > 0;
    R.vy += RUN_G * dt;
    R.y = Math.max(0, R.y - R.vy * dt);
    if (R.y <= 0) {
      R.y = 0; R.vy = 0;
      if (wasUp) {
        /* 착지 — 눌렸다 펴집니다. 이게 없으면 공중에서 바닥으로
           순간이동하는 것으로 보입니다. */
        R.land = 1;
        JUICE.puff(RUN_ME + 14, RUN_GY - 2, 'rgba(232,206,180,.85)', 7);
        SFX.step(SURF.TRACK, true);
      }
    }
  }

  /* ---- 장애물 ----
     간격이 거리에 따라 좁아집니다(첫 100m 는 넉넉하게, 마지막 100m 는
     빠듯하게). 200m 부터는 둘이 붙어 나오기도 합니다 — 한 번 뛰어 둘을
     넘는 자리라, 뛰는 때를 고르는 재미가 생깁니다. */
  const lapPx = RUN_LAP_M * RUN_PX_M;
  if (R.dist >= R.nextAt && R.dist < lapPx - 600) {
    const kinds = ['book', 'monitor', 'chair'];
    const at = R.dist + RUN_W + 40;
    R.obs.push({ at, kind: kinds[(Math.random() * 3) | 0], hit: false });
    const prog = R.dist / lapPx;
    if (prog > 0.5 && Math.random() < 0.34) {
      /* 붙어 나오는 둘. 사람이 뛰는 높이(92px)와 폭을 재서, 한 번에
         넘을 수 있는 간격만 씁니다 — 못 넘는 벽을 세우면 그건 함정입니다. */
      R.obs.push({ at: at + 118, kind: kinds[(Math.random() * 3) | 0], hit: false });
    }
    R.nextAt = R.dist + (760 - prog * 260) + Math.random() * 300;
  }
  R.obs = R.obs.filter((o) => o.at - R.dist > -90);
  for (const o of R.obs) {
    const sx = o.at - R.dist;
    const h = o.kind === 'monitor' ? 45 : o.kind === 'chair' ? 39 : 30;
    if (sx < RUN_ME + 30 && sx > RUN_ME - 33 && R.y < h && R.invuln <= 0) {
      R.lives -= 1; R.invuln = 1.0; R.spd *= 0.75;
      R.clear = 0; R.shake = 1;
      SFX.step(2, false);
      JUICE.burst(RUN_ME + 20, RUN_GY - 26, '#E0483A', 14, 160);
      postureRunPaintRows();
      const msg = panelBody.querySelector('#run-msg');
      if (msg) msg.textContent = R.lives > 0 ? '부딪혔어요. ' + R.lives + '번 더 부딪히면 끝이에요.' : '';
      if (R.lives <= 0) return finishPostureRun(false);
    }
    /* 넘어간 것을 셉니다. 통과가 아무 표시도 없으면 뛰어넘은 보람이
       없고, 뛰어야 하는 이유도 안 배웁니다. */
    if (!o.hit && sx < RUN_ME - 33) {
      o.hit = true;
      R.clear++; R.bestClear = Math.max(R.bestClear, R.clear);
      if (R.clear % 5 === 0) {
        JUICE.say(RUN_ME + 30, RUN_GY - 90, R.clear + '개 연속 통과!', '#FFD98A', 22);
      }
      postureRunPaintRows();
    }
  }

  if (R.dist >= lapPx) return finishPostureRun(true);
  drawPostureRun();
  /* 숫자 줄은 초당 열 번이면 충분합니다. 프레임마다 고치면 60분의 1초마다
     DOM 을 네 번씩 만지는데, 눈은 그 차이를 못 봅니다. */
  if (now - R.rowsAt > 100) { R.rowsAt = now; postureRunPaintRows(); }
}

function postureRunPaintRows() {
  const R = POSTURE_RUN;
  const mode = panelBody.querySelector('#run-mode');
  const dist = panelBody.querySelector('#run-dist');
  const life = panelBody.querySelector('#run-life');
  const clear = panelBody.querySelector('#run-clear');
  const bar = panelBody.querySelector('#run-bar');
  if (!mode) return;
  mode.textContent = R.mode === 'pose' ? '고개 들기 · Space' : 'Space (카메라 꺼짐)';
  const left = Math.max(0, RUN_LAP_M - R.dist / RUN_PX_M);
  dist.textContent = Math.ceil(left) + 'm';
  if (clear) clear.textContent = R.clear + '개';
  /* 몇 번 부딪혔는지로 씁니다. 남은 목숨으로 쓰면 "1번 더 괜찮아요" 를
     띄운 다음 판이 끝나서, 화면이 거짓말을 합니다. */
  life.textContent = (RUN_LIVES - Math.max(0, R.lives)) + ' / ' + RUN_LIVES;
  bar.style.width = Math.min(100, (R.dist / (RUN_LAP_M * RUN_PX_M)) * 100) + '%';
}

/* ---- 그림 ----
   트랙은 붉은 우레탄, 안쪽은 잔디. 월드의 운동장과 같은 색이라 창을 열면
   방금 서 있던 자리가 옆에서 흘러갑니다.
   층은 다섯입니다 — 하늘 · 구름 · 관중석 · 잔디 인필드 · 트랙. 층마다
   흐르는 속도가 다르고(0.04 ~ 1.0), 그 차이가 곧 깊이입니다. 한 겹만
   흘리면 배경이 종이처럼 미끄러집니다. */
function drawPostureRun() {
  const cv = panelBody.querySelector('#run-cv');
  const g = fitGameCanvas(cv, RUN_W, RUN_H);
  if (!g) return;
  const R = POSTURE_RUN;
  const d = R.dist;
  const W = RUN_W;
  if (R.shake > 0) g.translate((Math.random() - 0.5) * R.shake * 12, (Math.random() - 0.5) * R.shake * 8);

  const sky = g.createLinearGradient(0, 0, 0, RUN_GY);
  sky.addColorStop(0, '#A8D8E8'); sky.addColorStop(0.7, '#D6ECEF'); sky.addColorStop(1, '#EAF3E4');
  g.fillStyle = sky; g.fillRect(0, 0, W, RUN_GY);

  /* 구름 — 가장 느립니다. 뭉치 셋이 한 덩이입니다. */
  for (let i = 0; i < 4; i++) {
    const x = ((i * 260 - d * 0.035 - R.cloud * 6) % (W + 300) + W + 300) % (W + 300) - 150;
    const y = 26 + (i % 3) * 22;
    disc(g, x, y, 22, 'rgba(255,255,255,.85)');
    disc(g, x + 24, y + 5, 17, 'rgba(255,255,255,.85)');
    disc(g, x - 22, y + 7, 14, 'rgba(255,255,255,.8)');
    g.fillStyle = 'rgba(255,255,255,.85)'; g.fillRect(x - 22, y, 48, 9);
  }

  /* 먼 나무 — 관중석 뒤 */
  for (let i = 0; i < 12; i++) {
    const x = ((i * 92 - d * 0.09) % (W + 120) + W + 120) % (W + 120) - 60;
    g.fillStyle = '#6B4A2E'; g.fillRect(x + 9, 108, 6, 22);
    disc(g, x + 12, 104, 17, '#4E9E63');
    disc(g, x + 6, 98, 11, '#6FBE7F');
  }

  /* 관중석 — 계단 셋에 앉은 사람들. 색 점만 뿌려 봤더니 색종이가
     흩어진 것으로 보여서, **머리와 몸통 두 조각**으로 사람 꼴을 만들고
     간격을 촘촘히(14px) 했습니다. 색은 월드 팔레트에서 채도를 낮춘
     것들만 씁니다 — 관중이 주자보다 눈에 띄면 안 됩니다. */
  g.fillStyle = '#9FB6A6'; g.fillRect(0, 130, W, 46);
  const CROWD = ['#B9705F', '#B49653', '#5E7FA0', '#7E6B9E', '#5FA093', '#A46A78'];
  for (let r = 0; r < 3; r++) {
    const y = 131 + r * 15;
    g.fillStyle = r % 2 ? '#B7CCBC' : '#A9C0AF';
    g.fillRect(0, y, W, 15);
    g.fillStyle = 'rgba(42,35,32,.14)'; g.fillRect(0, y + 14, W, 1);
    for (let i = 0; i < 72; i++) {
      const x = ((i * 14 + r * 7 - d * 0.14) % (W + 40) + W + 40) % (W + 40) - 20;
      const c = CROWD[(i * 3 + r * 2) % CROWD.length];
      /* 응원 — 몇은 위아래로 조금 움직입니다. 다 멈춰 있으면 인형입니다. */
      const hop = ((i + r) % 7 === 0) ? Math.round(Math.sin(R.cloud * 4 + i) * 1.5) : 0;
      g.fillStyle = c; g.fillRect(x, y + 6 + hop, 9, 8);
      g.fillStyle = 'rgba(255,255,255,.18)'; g.fillRect(x, y + 6 + hop, 9, 2);
      g.fillStyle = '#8A6A55'; g.fillRect(x + 2, y + 2 + hop, 5, 5);
    }
  }
  g.fillStyle = '#7E9C86'; g.fillRect(0, 176, W, 8);
  g.fillStyle = '#93AE99'; g.fillRect(0, 176, W, 3);

  /* 잔디 인필드는 **트랙 뒤**입니다. 발이 닿는 줄(RUN_GY)보다 위에서
     붉은 우레탄이 시작해야 "트랙 위를 달린다" 로 읽힙니다 — 경계선에
     발을 딱 붙여 놓으면 잔디에 서 있는 것처럼 보입니다. */
  g.fillStyle = '#8FBF7A'; g.fillRect(0, 184, W, 22);
  g.fillStyle = '#A3CE8B'; g.fillRect(0, 184, W, 4);
  g.fillStyle = '#79AE68';
  for (let i = 0; i < 40; i++) {
    const x = ((i * 47 - d * 0.5) % (W + 60) + W + 60) % (W + 60) - 30;
    g.fillRect(x, 190 + (i % 3) * 5, 4, 4);
  }
  g.fillStyle = '#C4553F'; g.fillRect(0, 206, W, RUN_H - 206);
  g.fillStyle = '#D96A50'; g.fillRect(0, 206, W, 4);
  g.fillStyle = '#B04A36'; g.fillRect(0, RUN_GY - 2, W, 2);
  /* 레인 선 · 100m 표지 */
  g.fillStyle = '#F4EDE4';
  for (let i = 0; i < 22; i++) {
    const x = ((i * 72 - d) % (W + 72) + W + 72) % (W + 72) - 72;
    g.fillRect(x, RUN_GY + 24, 38, 4);
  }
  g.fillStyle = '#A8422F'; g.fillRect(0, RUN_GY + 44, W, 3);
  g.fillStyle = 'rgba(244,237,228,.5)';
  for (let i = 0; i < 30; i++) {
    const x = ((i * 44 - d * 1.15) % (W + 44) + W + 44) % (W + 44) - 44;
    g.fillRect(x, RUN_GY + 52, 20, 3);
  }
  /* 100m 마다 표지판. "얼마나 왔나" 를 막대 말고 트랙 위에서도 봅니다. */
  for (let m = 100; m < RUN_LAP_M; m += 100) {
    const x = m * RUN_PX_M - d + RUN_ME;
    if (x < -60 || x > W + 20) continue;
    g.fillStyle = '#F4EDE4'; g.fillRect(x, RUN_GY - 4, 3, 6);
    g.fillStyle = 'rgba(42,35,32,.62)'; g.fillRect(x - 16, 186, 40, 18);
    g.fillStyle = '#FFF6F3'; g.font = '700 12px system-ui, sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(m + 'm', x + 4, 195);
    g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  }

  /* 장애물 — 책상에서 굴러 나온 것들. 1.5배로 키웠습니다. */
  for (const o of R.obs) {
    const x = Math.round(o.at - d);
    if (x < -60 || x > W + 20) continue;
    /* 접지 그림자 — 셋 다 바닥에 붙어 있어야 뛰어넘을 것으로 보입니다 */
    g.fillStyle = 'rgba(80,30,20,.28)'; g.fillRect(x - 3, RUN_GY - 3, 40, 5);
    if (o.kind === 'book') {
      [['#D8442C', 0], ['#E8C34A', 10], ['#3F8F5C', 20]].forEach(([c, dy]) => {
        g.fillStyle = '#6B2A1C'; g.fillRect(x - 1, RUN_GY - 10 - dy, 35, 10);
        g.fillStyle = c; g.fillRect(x, RUN_GY - 9 - dy, 33, 8);
        g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(x, RUN_GY - 9 - dy, 33, 2);
        g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(x, RUN_GY - 3 - dy, 33, 2);
      });
    } else if (o.kind === 'monitor') {
      g.fillStyle = '#4A525C'; g.fillRect(x + 12, RUN_GY - 15, 12, 15);
      g.fillRect(x + 3, RUN_GY - 6, 30, 6);
      g.fillStyle = '#2E343B'; g.fillRect(x - 1, RUN_GY - 46, 38, 33);
      g.fillStyle = '#3A4048'; g.fillRect(x, RUN_GY - 45, 36, 31);
      g.fillStyle = '#8FD3E8'; g.fillRect(x + 3, RUN_GY - 42, 30, 25);
      g.fillStyle = '#CDEAF5'; g.fillRect(x + 3, RUN_GY - 42, 30, 6);
      g.fillStyle = 'rgba(255,255,255,.5)'; g.fillRect(x + 5, RUN_GY - 34, 14, 3);
      g.fillRect(x + 5, RUN_GY - 28, 20, 3);
    } else {
      g.fillStyle = '#6B4A2E'; g.fillRect(x - 1, RUN_GY - 19, 38, 8);
      g.fillStyle = '#8A6039'; g.fillRect(x, RUN_GY - 18, 36, 6);
      g.fillStyle = '#B08050'; g.fillRect(x, RUN_GY - 18, 36, 2);
      g.fillStyle = '#8A6039'; g.fillRect(x + 1, RUN_GY - 40, 8, 23);
      g.fillStyle = '#B08050'; g.fillRect(x + 1, RUN_GY - 40, 8, 3);
      g.fillStyle = '#6B4A2E';
      g.fillRect(x + 3, RUN_GY - 11, 6, 11); g.fillRect(x + 28, RUN_GY - 11, 6, 11);
    }
  }

  /* 기린 — 달리는 사람 자리 */
  const y = RUN_GY - R.y;
  const air = R.y > 0.5;
  /* 그림자는 늘 땅에 붙어 있고 뜬 만큼 작아집니다. 이게 없으면 공중에
     있는지 그냥 위에 그려진 것인지 구별이 안 됩니다. */
  g.fillStyle = 'rgba(90,40,28,' + (0.3 - Math.min(0.22, R.y / 460)).toFixed(2) + ')';
  g.fillRect(RUN_ME + 2 + Math.min(7, R.y / 16), RUN_GY - 3,
             28 - Math.min(13, R.y / 8), 5);
  const blink = R.invuln > 0 && ((performance.now() / 90) | 0) % 2 === 0;
  if (!blink) {
    /* 착지 눌림 — 0.2초 동안 납작해졌다 돌아옵니다 */
    const sq = R.land * 0.16;
    g.save();
    g.translate(RUN_ME + 15, y);
    g.scale(1 + sq, 1 - sq);
    g.translate(-(RUN_ME + 15), -y);
    const swing = air ? 0 : Math.sin(R.step / 15) * 6;
    g.fillStyle = '#9B5B2B';
    g.fillRect(RUN_ME + 3, y - 18 + (air ? 6 : 0), 6, air ? 12 : 18 + swing);
    g.fillRect(RUN_ME + 18, y - 18 + (air ? 6 : 0), 6, air ? 12 : 18 - swing);
    g.fillStyle = '#6B4A2E';
    g.fillRect(RUN_ME + 3, y - 3 + (air ? 3 : 0), 6, 3);
    g.fillRect(RUN_ME + 18, y - 3 + (air ? 3 : 0), 6, 3);
    /* 몸통 */
    g.fillStyle = '#9B5B2B'; g.fillRect(RUN_ME - 1, y - 40, 32, 24);
    g.fillStyle = '#E8AD50'; g.fillRect(RUN_ME, y - 39, 30, 22);
    g.fillStyle = '#F0C378'; g.fillRect(RUN_ME, y - 39, 30, 5);
    g.fillStyle = '#C98536'; g.fillRect(RUN_ME, y - 22, 30, 5);
    g.fillStyle = '#B66D31';
    [[4, -35], [18, -32], [9, -26], [22, -24]].forEach(([a, b]) => g.fillRect(RUN_ME + a, y + b, 7, 6));
    /* 꼬리 */
    g.fillStyle = '#9B5B2B';
    g.fillRect(RUN_ME - 6, y - 34, 7, 4 + (air ? 0 : Math.sin(R.step / 15) * 2));
    /* 목 — 뛰는 동안 더 곧게 섭니다. 이 게임이 파는 그림이 그것입니다. */
    const nh = air ? 46 : 36;
    g.fillStyle = '#9B5B2B'; g.fillRect(RUN_ME + 17, y - 40 - nh, 12, nh);
    g.fillStyle = '#E8AD50'; g.fillRect(RUN_ME + 18, y - 40 - nh, 10, nh);
    g.fillStyle = '#F0C378'; g.fillRect(RUN_ME + 18, y - 40 - nh, 3, nh);
    g.fillStyle = '#B66D31';
    for (let k = 0; k < 3; k++) g.fillRect(RUN_ME + 21, y - 34 - nh + k * 12, 5, 5);
    /* 머리 */
    g.fillStyle = '#9B5B2B'; g.fillRect(RUN_ME + 15, y - 48 - nh, 21, 13);
    g.fillStyle = '#E8AD50'; g.fillRect(RUN_ME + 16, y - 47 - nh, 19, 11);
    g.fillStyle = '#F0C378'; g.fillRect(RUN_ME + 16, y - 47 - nh, 19, 3);
    g.fillStyle = '#E8AD50'; g.fillRect(RUN_ME + 33, y - 44 - nh, 8, 7);   // 주둥이
    g.fillStyle = '#2A2520'; g.fillRect(RUN_ME + 28, y - 44 - nh, 3, 3);   // 눈
    g.fillStyle = '#9B5B2B';
    g.fillRect(RUN_ME + 19, y - 55 - nh, 3, 7); g.fillRect(RUN_ME + 26, y - 55 - nh, 3, 7);
    g.fillStyle = '#6B4A2E';
    g.fillRect(RUN_ME + 18, y - 58 - nh, 5, 4); g.fillRect(RUN_ME + 25, y - 58 - nh, 5, 4);
    g.restore();
  }

  JUICE.draw(g);

  /* 자세 게이지 — 고개를 얼마나 들었는지. 조작이 눈에 보여야 "내가
     뭘 해서 뛰었는지" 를 배웁니다. 점수가 아니라 **입력 표시**입니다. */
  if (R.mode === 'pose') {
    const gx = W - 46, gy = 22, gh = 150;
    g.fillStyle = 'rgba(255,255,255,.84)'; g.fillRect(gx - 8, gy - 20, 40, gh + 34);
    g.fillStyle = '#5C6663'; g.font = '700 11px system-ui, sans-serif';
    g.textAlign = 'center'; g.fillText('고개', gx + 12, gy - 8);
    g.fillStyle = '#D8D2CC'; g.fillRect(gx, gy, 24, gh);
    const t = Math.max(0, Math.min(1, ((R.lift || 0) + 0.5) / 2.2));
    g.fillStyle = R.armed ? '#2E9E5B' : '#9A8E88';
    g.fillRect(gx, gy + gh - gh * t, 24, gh * t);
    const jy = gy + gh - gh * ((RUN_JUMP_AT + 0.5) / 2.2);
    g.fillStyle = '#E0483A'; g.fillRect(gx - 6, jy, 36, 3);
    g.fillStyle = '#E0483A'; g.font = '700 10px system-ui, sans-serif';
    g.fillText('뛰기', gx + 12, gy + gh + 12);
    g.textAlign = 'left';
  }

  /* ---- 끝난 뒤 ---- */
  if (R.over) {
    g.fillStyle = R.won ? 'rgba(47,158,91,.93)' : 'rgba(42,35,32,.88)';
    g.fillRect(0, RUN_H / 2 - 56, W, 112);
    g.fillStyle = '#FFFFFF'; g.textAlign = 'center';
    g.font = '800 40px system-ui, sans-serif';
    g.fillText(R.won ? '한 바퀴 완주!' : '세 번 부딪혔어요', W / 2, RUN_H / 2 - 6);
    g.font = '700 17px system-ui, sans-serif';
    g.fillText(R.won
      ? '400m · ' + R.jumps + '번 뛰었어요 · 최고 ' + R.bestClear + '개 연속 통과'
      : Math.floor(R.dist / RUN_PX_M) + 'm 에서 끝 · 장애물이 보이면 조금 일찍 들어 주세요',
      W / 2, RUN_H / 2 + 26);
    g.textAlign = 'left';
  }
  g.textBaseline = 'alphabetic';
  g.setTransform(1, 0, 0, 1, 0, 0);
}

function finishPostureRun(won) {
  const R = POSTURE_RUN;
  if (R.over) return;
  R.active = false; R.over = true; R.won = won;
  R.overAt = performance.now(); R.last = performance.now();
  postureRunPaintRows();
  const msg = panelBody.querySelector('#run-msg');
  if (won) {
    if (!R.rewarded) { R.rewarded = true; earn(COIN_MINIGAME, '거북목 탈출 러너 완주', 'postureRun'); }
    SFX.door();
    JUICE.burst(RUN_ME + 20, RUN_GY - 70, '#FFE9A8', 26, 210);
    if (msg) msg.textContent = gameWinMsg() + ' 최고 ' + R.bestClear + '개 연속 통과.';
  } else if (msg) {
    msg.textContent = '세 번 부딪혔어요. 장애물이 보이면 조금 일찍 들어 주세요.';
  }
  cancelAnimationFrame(R.raf);
  R.raf = requestAnimationFrame(postureRunOutro);
}

/** 끝난 뒤 1.4초 — 먼지가 가라앉는 것까지. */
function postureRunOutro(now) {
  const R = POSTURE_RUN;
  if (!R.over) return;
  const dt = Math.min(0.05, (now - R.last) / 1000);
  R.last = now;
  R.shake = Math.max(0, R.shake - dt * 2.4);
  JUICE.update(dt);
  drawPostureRun();
  if (now - R.overAt < 1400) R.raf = requestAnimationFrame(postureRunOutro);
}

function startPostureRun() {
  const R = POSTURE_RUN;
  cancelAnimationFrame(R.raf);
  panelBody.innerHTML = postureRunHtml();
  JUICE.reset();
  R.active = true; R.over = false; R.won = false; R.rewarded = false;
  R.dist = 0; R.spd = 300; R.y = 0; R.vy = 0; R.lives = RUN_LIVES; R.invuln = 0;
  R.obs = []; R.nextAt = 700; R.armed = true; R.jumps = 0; R.step = 0; R.rowsAt = 0;
  R.clear = 0; R.bestClear = 0; R.shake = 0; R.land = 0; R.cloud = 0;
  R.last = performance.now();
  postureRunMode();
  postureRunPaintRows();
  drawPostureRun();
  R.raf = requestAnimationFrame(postureRunTick);
}

/* ==================================================================
   미니게임 6 — 달리기 시합 · 운동장

   ---- 왜 좌우 번갈아인가 ----
   한 키 연타를 골라 봤다가 접었습니다. (1) 손목에 그대로 부담이 가고,
   이 제품이 파는 것이 그 반대입니다. (2) 자동 연타 매크로 앞에서 아무
   의미가 없습니다. 좌우 교대는 같은 키를 두 번 눌러도 안 나가므로
   **박자를 지키는 쪽**이 이깁니다. 그리고 왼발 오른발이라 그림과 조작이
   같은 말을 합니다.

   ---- 왜 혼자서도 되는가 ----
   지금 이 월드에 사람이 몇이나 있는지 아무도 모릅니다. 사람이 있어야
   시작되는 게임은 빈 월드에서 그냥 안 되는 게임입니다. 그래서 페이서
   셋과 **내 최고 기록 고스트**가 늘 함께 뜁니다. 남이 들어오면 레인이
   늘어날 뿐, 규칙은 하나도 안 바뀝니다.

   ---- 순위와 성공을 따로 두는 이유 ----
   같은 시각에 출발하도록 맞추는 협상을 넣지 않았습니다(호스트도 방도
   없습니다). 각자 자기 시계로 달리고 서로의 **진행 거리**만 흘립니다.
   그래서 순위는 "먼저 결승선을 넘은 사람" 이고, 코인은 순위가 아니라
   **기록 18초**로 정합니다 — 느린 사람과 붙어서 코인을 캐는 길을
   막으려면 이쪽이어야 합니다.

   ---- 이번에 고친 것 ----
   조작에 **답이 없었습니다.** 제대로 밟았는지 아닌지가 화면에 안 나오고,
   같은 발을 두 번 눌렀을 때만 붉은 판이 한 번 깔렸습니다. 그래서
   (1) 다음에 밟을 발을 화면과 단추 양쪽에 표시하고,
   (2) 걸음마다 발자국이 트랙에 찍히고,
   (3) 박자가 좋으면(0.10~0.34초 간격) 그 걸음이 더 나갑니다 — "빨리
       누르기" 가 아니라 "고르게 누르기" 가 이기는 쪽이 됩니다.
   출발 신호도 글자에서 **신호등 셋**으로 바꿨습니다. 제자리에·준비·출발이
   빨강·노랑·초록이면 글자를 안 읽어도 몸이 압니다.
   마지막 20m 는 **스퍼트** 구간입니다. 여기서 한 걸음이 1.35배로 나가고,
   화면에 속도선이 깔립니다 — 100m 가 그냥 끝나면 끝난 줄도 모릅니다.
   ================================================================== */
const RACE_M = 100;              // 짧게. 100m 는 20초 안쪽입니다
const RACE_TARGET = 18;          // 이 안에 들어오면 성공
const RACE_LIMIT = 30;           // 한 판의 끝. 안 두면 안 뛰는 판이 안 끝납니다
const RACE_VMAX = 9.6;           // m/s
const RACE_GAIN = 0.55;          // 한 걸음이 더해 주는 속도
const RACE_DECAY = 0.45;         // 초당 잃는 비율
const RACE_W = 880, RACE_LANE = 44, RACE_TOP = 34;
const RACE_X0 = 158, RACE_X1 = RACE_W - 42;   // 출발선 · 결승선
const RACE_KEEP_MS = 3000;       // 이만큼 조용하면 레인을 접습니다
const RACE_SPURT_M = 80;         // 여기서부터 스퍼트
const RACE_TEMPO = [100, 340];   // 좋은 박자로 치는 걸음 간격(ms)
const TRACK_RACE = {
  active: false, raf: 0, last: 0, phase: 'ready', wait: 0,
  t: 0, dist: 0, v: 0, lastFoot: '', lastStepAt: 0, slip: 0, steps: 0, tempo: 0,
  prints: [], pacers: [], ghosts: new Map(), best: 0, time: 0, rank: 0,
  rewarded: false, won: false, done: false, sendAt: 0, msg: '', overAt: 0, spurt: false,
};

/* 페이서 셋. 이름과 종은 이 월드에 사는 것들에서 가져옵니다 — 낯선
   이름이 레인에 서 있으면 연습 상대가 아니라 남의 게임이 됩니다. */
const RACE_PACERS = [
  { nick: '느린거북', sec: 19.6, col: '#5CB177' },
  { nick: '뒤뚱펭귄', sec: 17.2, col: '#4A7FB5' },
  { nick: '폴짝개구리', sec: 15.4, col: '#7BB661' },
];

function raceBest() {
  const v = Number(loadJSON('girin.race.best', 0)) || 0;
  return v > 0 ? v : 0;
}

function trackRaceHtml() {
  const best = raceBest();
  return `
    <p><b>100m</b>. 왼발 오른발을 <b>번갈아</b> · 고르게 밟으면 더 빨라져요.</p>
    <div class="rows">
      <div class="row"><span>조작</span><span class="val">← → · A D · 아래 단추</span></div>
      <div class="row"><span>지금</span><span class="val" id="race-state">제자리에</span></div>
      <div class="row"><span>목표</span><span class="val">${RACE_TARGET}초 안</span></div>
      <div class="row"><span>내 최고 기록</span><span class="val" id="race-best">${best ? best.toFixed(2) + '초' : '아직 없음'}</span></div>
    </div>
    <canvas id="race-cv" width="${RACE_W}" height="${RACE_TOP + 4 * RACE_LANE + 10}" role="img"
      aria-label="100m 트랙. 내 레인과 페이서, 같이 달리는 사람들이 보입니다."
      style="width:100%;margin:12px 0 10px;border-radius:14px;border:1px solid var(--line-2);display:block"></canvas>
    <div style="display:flex;gap:10px">
      <button class="act" id="race-left" data-do="race-foot" data-foot="left" style="flex:1;padding:16px;font-size:15px">왼발</button>
      <button class="act" id="race-right" data-do="race-foot" data-foot="right" style="flex:1;padding:16px;font-size:15px">오른발</button>
    </div>
    <p class="hint" id="race-msg" aria-live="polite">신호를 기다려 주세요.</p>
    <button class="act ghost" data-do="race-restart" style="margin-top:10px">다시 하기</button>
    <div class="note"><b>${RACE_TARGET}초 안</b>에 들어오면 오늘 몫 코인이
    들어와요. 코인은 순위가 아니라 기록으로 정합니다 — 느린 사람과 붙어서
    받는 길을 막으려고요. 마지막 <b>20m</b>는 스퍼트 구간이라 한 걸음이 더
    나가요. 같은 시간에 트랙에 있는 사람은 레인으로 같이 보여요.
    <b>${RACE_LIMIT}초</b>를 넘기면 그 판은 거기서 끝나요.</div>`;
}

/** 다음에 밟을 발을 단추에도 표시합니다. 화면 안에만 두면 손이 어디를
    눌러야 하는지 모르고, 단추에만 두면 트랙에서 눈을 떼야 합니다. */
function racePaintFeet() {
  const R = TRACK_RACE;
  const next = R.lastFoot === 'left' ? 'right' : R.lastFoot === 'right' ? 'left' : '';
  for (const side of ['left', 'right']) {
    const el = panelBody.querySelector('#race-' + side);
    if (!el) continue;
    const on = R.phase === 'run' && (next === '' || next === side);
    el.classList.toggle('ghost', !on);
    el.style.transform = on ? 'translateY(-2px)' : 'none';
  }
}

/** 한 걸음. foot 은 'left' | 'right'. 같은 발을 두 번 밟으면 안 나갑니다. */
function raceStep(foot) {
  const R = TRACK_RACE;
  if (!R.active) return;
  if (R.phase !== 'run') {
    if (R.phase === 'ready') {
      raceSay('아직 출발 신호 전이에요. 초록불에 나가 주세요.');
      R.slip = 0.22;
    }
    return;
  }
  if (foot === R.lastFoot) {
    R.slip = 0.35; R.tempo = 0;
    raceSay('같은 발이에요. 왼발 오른발 번갈아!');
    JUICE.say(RACE_X0 + 120, RACE_TOP + 12, '같은 발!', '#E0483A', 18);
    racePaintFeet();
    return;
  }
  const now = performance.now();
  const gap = R.lastStepAt ? now - R.lastStepAt : 0;
  /* 박자 — 너무 몰아치거나 늘어지면 그냥 한 걸음, 고르면 1.3배.
     "빨리" 가 아니라 "고르게" 가 이기게 하는 자리입니다. */
  const good = gap >= RACE_TEMPO[0] && gap <= RACE_TEMPO[1];
  R.tempo = good ? Math.min(12, R.tempo + 1) : 0;
  const spurt = R.dist >= RACE_SPURT_M ? 1.35 : 1;
  R.v = Math.min(RACE_VMAX, R.v + RACE_GAIN * (good ? 1.3 : 1) * spurt);
  R.lastFoot = foot; R.lastStepAt = now; R.steps++;
  /* 발자국 — 밟은 자리에 남습니다. 조작에 흔적이 없으면 눌러도 아무
     일이 없는 것처럼 느껴집니다. */
  R.prints.push({ d: R.dist, side: foot, t: 0 });
  if (R.prints.length > 26) R.prints.shift();
  if (R.steps % 2 === 0) SFX.step(SURF.TRACK, true);
  if (good && R.tempo === 4) JUICE.say(RACE_X0 + 150, RACE_TOP + 14, '좋은 박자!', '#2DD4BF', 18);
  racePaintFeet();
}
function raceSay(t) {
  const el = panelBody.querySelector('#race-msg');
  if (el) el.textContent = t;
}

function trackRaceTick(now) {
  const R = TRACK_RACE;
  if (!R.active) return;
  R.raf = requestAnimationFrame(trackRaceTick);
  const dt = Math.min(0.05, (now - R.last) / 1000);
  R.last = now;
  if (dt <= 0) return;
  JUICE.update(dt);
  for (const p of R.prints) p.t += dt;

  if (R.phase === 'ready') {
    const before = Math.ceil(R.wait);
    R.wait -= dt;
    const st = panelBody.querySelector('#race-state');
    if (st) st.textContent = R.wait > 1.0 ? '제자리에' : R.wait > 0 ? '준비' : '출발!';
    /* 신호가 바뀔 때 딱 한 번씩 소리. 매 프레임 내면 삐 소리가 이어집니다. */
    if (Math.ceil(R.wait) !== before) SFX.chair(R.wait <= 1);
    if (R.wait <= 0) {
      R.phase = 'run'; R.t = 0; R.lastStepAt = 0;
      raceSay('가세요! 왼발 오른발 번갈아.');
      SFX.door(); racePaintFeet();
    }
  } else if (R.phase === 'run') {
    R.t += dt;
    R.v = Math.max(0, R.v - R.v * RACE_DECAY * dt);
    const was = R.dist;
    R.dist = Math.min(RACE_M, R.dist + R.v * dt);
    if (!R.spurt && was < RACE_SPURT_M && R.dist >= RACE_SPURT_M) {
      R.spurt = true;
      raceSay('스퍼트! 마지막 20m — 한 걸음이 더 나가요.');
      JUICE.say(RACE_W / 2, RACE_TOP + 20, '스퍼트!', '#FFD98A', 26);
    }
    if (R.slip > 0) R.slip -= dt;
    for (const q of R.pacers) q.d = Math.min(RACE_M, racePacerAt(q, R.t));
    /* 초당 열 번 — 위치 broadcast 와 같은 굵기입니다. 더 자주 보내도
       화면이 못 따라가고 요금만 씁니다. */
    if (now - R.sendAt > 100 && window.MP && MP.race) {
      R.sendAt = now;
      MP.race({ k: 'run', d: Math.round(R.dist * 10) / 10, e: Math.round(R.t * 100) / 100,
                n: ROOM.nickname || '누군가' });
    }
    if (R.dist >= RACE_M || R.t >= RACE_LIMIT) return finishTrackRace();
    const st = panelBody.querySelector('#race-state');
    if (st) st.textContent = R.t.toFixed(2) + '초 · ' + Math.round(R.dist) + 'm · '
      + R.v.toFixed(1) + 'm/s';
  }
  raceExpire(now);
  drawTrackRace();
}

/** 페이서는 일정한 속도가 아닙니다 — 처음 15m 를 가속에 씁니다.
    등속으로 두면 출발선에서 저 혼자 튀어 나갑니다. */
function racePacerAt(q, t) {
  const v = RACE_M / q.sec;
  const acc = 1.6;                                  // 가속 구간(초)
  return t < acc ? v * t * t / (2 * acc) : v * (t - acc / 2);
}

/** 조용해진 레인을 접습니다. **다 들어온 사람은 안 접습니다** — 나보다
    3초 넘게 먼저 끝낸 사람이 사라지면 순위가 "내가 1등" 이 됩니다.
    실제로 두 탭으로 달려 보다가 그렇게 나왔습니다. */
function raceExpire(now) {
  for (const [id, g] of TRACK_RACE.ghosts)
    if (!g.fin && now - g.at > RACE_KEEP_MS) TRACK_RACE.ghosts.delete(id);
}

/** 결승선을 나보다 먼저 넘은 레인 수 + 1. 페이서와 사람을 같이 셉니다. */
function raceRank() {
  const R = TRACK_RACE;
  let ahead = 0;
  for (const q of R.pacers) if (q.sec < R.t) ahead++;
  for (const g of R.ghosts.values()) if (g.fin && g.e < R.t) ahead++;
  return ahead + 1;
}

function finishTrackRace() {
  const R = TRACK_RACE;
  R.phase = 'done'; R.active = false;
  R.time = R.t; R.rank = raceRank();
  /* 결승선을 못 넘고 시간이 끝났으면 기록이 아닙니다 */
  R.done = R.dist >= RACE_M;
  R.won = R.done && R.time <= RACE_TARGET;
  if (window.MP && MP.race) {
    MP.race({ k: 'fin', d: RACE_M, e: Math.round(R.t * 100) / 100, n: ROOM.nickname || '누군가' });
  }
  const prev = raceBest();
  const isBest = R.done && (!prev || R.time < prev);
  if (isBest) saveJSON('girin.race.best', Math.round(R.time * 100) / 100);
  const bestEl = panelBody.querySelector('#race-best');
  if (bestEl) bestEl.textContent = raceBest().toFixed(2) + '초';
  const st = panelBody.querySelector('#race-state');
  if (st) st.textContent = R.done ? R.time.toFixed(2) + '초 · ' + R.rank + '위' : '시간 초과';
  if (R.won) {
    if (!R.rewarded) { R.rewarded = true; earn(COIN_MINIGAME, '달리기 시합 ' + R.time.toFixed(2) + '초', 'trackRace'); }
    raceSay(gameWinMsg() + (isBest ? ' 개인 최고 기록이에요!' : ''));
    SFX.door();
    JUICE.burst(RACE_X1 - 20, RACE_TOP + RACE_LANE / 2, '#FFE9A8', 26, 210);
  } else if (R.done) {
    raceSay(RACE_TARGET + '초를 넘겼어요(' + R.time.toFixed(2) + '초). 같은 발을 두 번 누르지 않고 고르게 밟으면 훨씬 빨라져요.');
  } else {
    raceSay(RACE_LIMIT + '초 안에 못 들어왔어요. ' + Math.round(R.dist) + 'm 에서 끝났습니다.');
  }
  racePaintFeet();
  R.overAt = performance.now(); R.last = performance.now();
  R.raf = requestAnimationFrame(trackRaceOutro);
}

/** 끝난 뒤 1.4초. 결승선 색종이가 떨어지는 것까지 보여 줍니다. */
function trackRaceOutro(now) {
  const R = TRACK_RACE;
  if (R.phase !== 'done') return;
  const dt = Math.min(0.05, (now - R.last) / 1000);
  R.last = now;
  JUICE.update(dt);
  drawTrackRace();
  if (now - R.overAt < 1400) R.raf = requestAnimationFrame(trackRaceOutro);
}

/* ---- 그림 — 위에서 내려다본 레인 ----
   옆에서 보면 남이 앞선 것이 안 보입니다. 레인을 세로로 쌓아야
   "누가 앞에 있나" 가 한눈에 들어옵니다. */
function drawTrackRace() {
  const cv = panelBody.querySelector('#race-cv');
  if (!cv) return;
  const R = TRACK_RACE;

  const lanes = [{ nick: (ROOM.nickname || '나') + '(나)', d: R.dist, col: '#2DD4BF', me: true }]
    .concat(R.pacers.map((q) => ({ nick: q.nick, d: q.d, col: q.col })))
    .concat([...R.ghosts.values()].map((q) => ({ nick: q.nick, d: q.d, col: '#E0AE3C' })));
  if (R.best) lanes.splice(1, 0, { nick: '내 최고', d: Math.min(RACE_M, racePacerAt({ sec: R.best }, R.t)), col: '#9AA3AE', ghost: true });
  lanes.length = Math.min(6, lanes.length);

  /* 레인 수만큼만 높이를 잡습니다. 여섯 칸을 고정으로 두면 혼자 달릴 때
     화면 절반이 빈 붉은 판입니다. */
  const H = RACE_TOP + lanes.length * RACE_LANE + 10;
  /* 레인이 늘거나 줄 때만 비율을 고칩니다. 매 프레임 넣으면 값이 같아도
     브라우저가 배치를 다시 계산합니다. */
  const ratio = RACE_W + ' / ' + H;
  if (cv.style.aspectRatio !== ratio) cv.style.aspectRatio = ratio;
  const g = fitGameCanvas(cv, RACE_W, H);
  if (!g) return;

  g.fillStyle = '#C4553F'; g.fillRect(0, 0, RACE_W, H);

  /* ---- 거리 자 ---- */
  g.fillStyle = '#8E3A29'; g.fillRect(0, 0, RACE_W, RACE_TOP - 4);
  g.fillStyle = '#F4EDE4'; g.font = '700 12px system-ui, sans-serif';
  g.textBaseline = 'middle';
  for (let m = 0; m <= RACE_M; m += 10) {
    const x = RACE_X0 + (RACE_X1 - RACE_X0) * (m / RACE_M);
    const big = m % 50 === 0;
    g.fillStyle = big ? '#F4EDE4' : 'rgba(244,237,228,.45)';
    g.fillRect(x, RACE_TOP - 14, big ? 2 : 1, big ? 10 : 6);
    if (m % 25 === 0) { g.textAlign = 'center'; g.fillText(m + 'm', x, RACE_TOP - 22); }
  }
  /* 스퍼트 구간 표시 — 마지막 20m 가 왜 특별한지 자에 적어 둡니다 */
  const sx = RACE_X0 + (RACE_X1 - RACE_X0) * (RACE_SPURT_M / RACE_M);
  g.fillStyle = 'rgba(255,217,138,.9)'; g.fillRect(sx, RACE_TOP - 6, RACE_X1 - sx, 3);
  g.textAlign = 'left'; g.fillStyle = '#FFD98A';
  g.font = '700 11px system-ui, sans-serif';
  g.fillText('스퍼트', sx + 6, RACE_TOP - 22);

  for (let i = 0; i < lanes.length; i++) {
    const L = lanes[i], y = RACE_TOP + i * RACE_LANE;
    const lh = RACE_LANE - 3;
    g.fillStyle = i % 2 ? '#B84E3A' : '#C4553F'; g.fillRect(0, y, RACE_W, lh);
    /* 우레탄 알갱이 — 민판이면 붉은 종이가 됩니다 */
    g.fillStyle = 'rgba(0,0,0,.05)';
    for (let k = 0; k < 60; k++)
      g.fillRect(RACE_X0 + ((k * 101 + i * 37) % (RACE_X1 - RACE_X0)), y + 3 + ((k * 7 + i * 3) % (lh - 6)), 2, 2);
    g.fillStyle = 'rgba(244,237,228,.5)'; g.fillRect(0, y + lh, RACE_W, 1);
    /* 스퍼트 구간은 조금 밝습니다 */
    g.fillStyle = 'rgba(255,217,138,.10)'; g.fillRect(sx, y, RACE_X1 - sx, lh);

    /* 내 레인의 발자국 — 밟은 자리에 남았다가 흐려집니다 */
    if (L.me) {
      for (const p of R.prints) {
        const px = RACE_X0 + (RACE_X1 - RACE_X0 - 22) * (p.d / RACE_M);
        g.fillStyle = 'rgba(42,24,18,' + Math.max(0, 0.3 - p.t * 0.12).toFixed(2) + ')';
        g.fillRect(px, y + (p.side === 'left' ? 8 : 26), 9, 6);
      }
    }
    /* 이름표 — 왼쪽에 붙박이. 레인 위에 띄우면 달리는 동안 글자가
       같이 움직여서 못 읽습니다. */
    g.fillStyle = L.me ? 'rgba(12,90,79,.94)' : 'rgba(42,35,32,.8)';
    g.fillRect(0, y, RACE_X0 - 12, lh);
    g.fillStyle = L.me ? '#2DD4BF' : 'rgba(244,237,228,.35)';
    g.fillRect(0, y, 4, lh);
    g.fillStyle = L.me ? '#A8FBF0' : '#FFF6F3';
    g.font = '700 13px system-ui, sans-serif'; g.textAlign = 'left';
    const nm = String(L.nick);
    g.fillText(nm.length > 9 ? nm.slice(0, 8) + '…' : nm, 12, y + lh / 2 - 7);
    g.font = '600 12px system-ui, sans-serif';
    g.fillStyle = L.me ? 'rgba(168,251,240,.78)' : 'rgba(255,246,243,.62)';
    g.fillText(Math.round(L.d) + 'm', 12, y + lh / 2 + 11);
    /* 출발선 */
    g.fillStyle = 'rgba(244,237,228,.8)'; g.fillRect(RACE_X0 - 3, y, 2, lh);
    /* 결승선 */
    for (let k = 0; k < 5; k++) {
      g.fillStyle = k % 2 ? '#2A2320' : '#F4EDE4';
      g.fillRect(RACE_X1, y + k * 9, 12, 9);
    }

    const rx = RACE_X0 + (RACE_X1 - RACE_X0 - 22) * (L.d / RACE_M);
    if (L.ghost) g.globalAlpha = 0.5;
    /* 달리는 사람 — 테두리를 먼저 깔아야 붉은 트랙 위에서 실루엣이 섭니다 */
    const moving = R.phase === 'run' && (L.me ? R.v > 0.4 : L.d > 0 && L.d < RACE_M);
    const sw = moving ? Math.sin(performance.now() / 62 + i * 2) * 5 : 0;
    /* 속도선 — 빠를수록 길어집니다. 내 레인에만 답니다. */
    if (L.me && R.v > 4) {
      g.fillStyle = 'rgba(255,255,255,' + Math.min(0.4, (R.v - 4) / 14).toFixed(2) + ')';
      for (let k = 1; k <= 3; k++) g.fillRect(rx - 12 - k * 14, y + 10 + k * 5, 11, 3);
    }
    g.fillStyle = 'rgba(24,16,12,.42)';                       // 접지 그림자
    g.fillRect(rx + 1, y + lh - 8, 24, 5);
    g.fillStyle = 'rgba(24,16,12,.55)';                       // 검은 테 — 붉은 판 위 실루엣
    g.fillRect(rx - 2, y + 3, 32, 28);
    g.fillStyle = L.col;
    g.fillRect(rx + 1, y + 11, 17, 14);                       // 몸통
    g.fillStyle = 'rgba(255,255,255,.24)'; g.fillRect(rx + 1, y + 11, 17, 4);
    g.fillStyle = 'rgba(0,0,0,.16)'; g.fillRect(rx + 1, y + 22, 17, 3);
    g.fillStyle = L.col;
    g.fillRect(rx + 16, y + 4, 12, 12);                       // 머리
    g.fillStyle = 'rgba(255,255,255,.24)'; g.fillRect(rx + 16, y + 4, 12, 3);
    g.fillStyle = L.col;
    g.fillRect(rx + 18, y - 1, 3, 6); g.fillRect(rx + 24, y - 1, 3, 6);   // 귀 둘
    g.fillRect(rx - 4, y + 13, 7, 4);                         // 뒤로 뻗은 팔
    g.fillRect(rx + 15, y + 13 - sw * 0.4, 6, 4);             // 앞으로 뻗은 팔
    g.fillStyle = 'rgba(24,16,12,.8)';
    g.fillRect(rx + 24, y + 8, 3, 3);                         // 눈
    g.fillStyle = L.col;
    g.fillRect(rx + 3, y + 24, 6, 7 + sw);                    // 다리 둘 — 번갈아
    g.fillRect(rx + 11, y + 24, 6, 7 - sw);
    g.fillStyle = 'rgba(24,16,12,.55)';
    g.fillRect(rx + 3, y + 30 + sw, 6, 3); g.fillRect(rx + 11, y + 30 - sw, 6, 3);
    g.globalAlpha = 1;
  }

  JUICE.draw(g);

  /* ---- 신호등 — 출발 전에는 이것만 봅니다 ---- */
  const mid = H / 2;
  if (R.phase === 'ready') {
    g.fillStyle = 'rgba(42,35,32,.82)'; g.fillRect(0, mid - 46, RACE_W, 92);
    const step = R.wait > 1.0 ? 0 : R.wait > 0 ? 1 : 2;
    const LIGHTS = [['#E0483A', '제자리에'], ['#E0AE3C', '준비'], ['#2E9E5B', '출발!']];
    LIGHTS.forEach(([col, label], i) => {
      const cx = RACE_W / 2 - 92 + i * 92;
      disc(g, cx, mid - 8, 26, i === step ? col : 'rgba(255,255,255,.14)');
      if (i === step) disc(g, cx - 7, mid - 15, 10, 'rgba(255,255,255,.45)');
    });
    g.fillStyle = '#FFFFFF'; g.textAlign = 'center';
    g.font = '800 26px system-ui, sans-serif';
    g.fillText(LIGHTS[step][1], RACE_W / 2, mid + 34);
    g.textAlign = 'left';
  } else if (R.phase === 'done') {
    g.fillStyle = R.won ? 'rgba(47,158,91,.93)' : 'rgba(42,35,32,.88)';
    g.fillRect(0, mid - 50, RACE_W, 100);
    g.fillStyle = '#FFFFFF'; g.textAlign = 'center';
    g.font = '800 36px system-ui, sans-serif';
    g.fillText(R.done ? R.time.toFixed(2) + '초 · ' + R.rank + '위'
                      : Math.round(R.dist) + 'm 에서 끝', RACE_W / 2, mid - 4);
    g.font = '700 16px system-ui, sans-serif';
    g.fillText(R.won ? '목표 ' + RACE_TARGET + '초 통과! · ' + R.steps + '걸음'
                     : '목표는 ' + RACE_TARGET + '초예요 · ' + R.steps + '걸음', RACE_W / 2, mid + 28);
    g.textAlign = 'left';
  }
  if (R.slip > 0) {
    g.fillStyle = 'rgba(224,72,58,' + Math.min(0.34, R.slip).toFixed(2) + ')';
    g.fillRect(0, 0, RACE_W, H);
  }
  g.textBaseline = 'alphabetic';
  g.setTransform(1, 0, 0, 1, 0, 0);
}

function startTrackRace() {
  const R = TRACK_RACE;
  cancelAnimationFrame(R.raf);
  panelBody.innerHTML = trackRaceHtml();
  JUICE.reset();
  R.active = true; R.phase = 'ready'; R.wait = 2.4;
  R.t = 0; R.dist = 0; R.v = 0; R.lastFoot = ''; R.lastStepAt = 0; R.steps = 0;
  R.slip = 0; R.tempo = 0; R.prints = []; R.spurt = false;
  R.rewarded = false; R.won = false; R.done = false; R.time = 0; R.rank = 0; R.sendAt = 0;
  R.best = raceBest();
  R.ghosts.clear();
  /* 페이서 기록을 판마다 조금씩 흔듭니다. 늘 같은 초로 들어오면 두 판만에
     "저 셋은 그림" 이라는 게 들통납니다. */
  R.pacers = RACE_PACERS.map((q) => ({ ...q, sec: q.sec + (Math.random() - 0.5) * 1.2, d: 0 }));
  R.last = performance.now();
  racePaintFeet();
  drawTrackRace();
  R.raf = requestAnimationFrame(trackRaceTick);
}

/* 남의 진행 상황. 존이 다르면 채널이 다르므로 여기까지 오지 않습니다.
   multiplayer.js 는 이 인라인 스크립트 **뒤에** 읽히므로 load 를 기다립니다 —
   지금 window.MP 를 보면 아직 없습니다(chat.js 의 syncChat 과 같은 이유). */
addEventListener('load', () => {
  if (!window.MP || !MP.on) return;
  MP.on('race', (id, p) => {
    if (!TRACK_RACE.active && TRACK_RACE.phase !== 'done') return;
    TRACK_RACE.ghosts.set(id, {
      nick: String(p.n || '누군가'), d: Math.max(0, Math.min(RACE_M, Number(p.d) || 0)),
      e: Number(p.e) || 0, fin: p.k === 'fin', at: performance.now(),
    });
  });
});

/* ==================================================================
   미니게임 7 — 연못 낚시 · 호수

   호수는 "세션과 세션 사이에 아무것도 안 해도 되는 자리" 로 만든 곳입니다
   (캠퍼스 존 주석). 그 성격을 깨지 않는 게임이어야 해서, 조작을 하나로
   줄이고 판 사이에 **기다리는 시간**을 그대로 뒀습니다. 손이 바쁘면
   여기가 쉬는 자리가 아니게 됩니다.

   ---- 고쳐 쓰기 전 ----
   찌가 잠기면 0.6초 안에 Space. 그게 전부였고, 다섯 번 다 같은 판이었습니다.
   문제는 셋이었습니다.
     (1) 잘 챈 것과 겨우 챈 것이 **똑같았습니다.** 0.05초에 채나 0.55초에
         채나 결과가 같으니, 잘하려는 이유가 없습니다.
     (2) 잡히는 물고기가 순전히 운이었습니다(고정 가중치). 여덟 종 도감을
         걸어 두고 실력과 무관하게 뽑기만 시킨 셈입니다.
     (3) 아무 예고가 없어 **반사신경 시험**이었습니다. 낚시는 원래 찌를
         읽는 놀이인데, 읽을 것이 없었습니다.

   ---- 지금 ----
     · 챈 시간을 잽니다. 0.23초 안이면 완벽, 창의 70% 안이면 좋아요,
       그 뒤는 아슬아슬. 세 등급이 화면에 뜨고, 잰 시간(ms)을 같이 적습니다 —
       "왜 완벽인지" 를 숫자로 확인할 수 있어야 다음 판이 달라집니다.
     · 등급이 좋을수록 **귀한 종**이 걸립니다. 가중치를 w^(1-0.55x) 로
       눌러 폅니다(x = 등급 0~1). 백조깃 은어(w=1)와 기린무늬 잉어(w=26)의
       비가 26:1 에서 4.4:1 까지 좁혀집니다 — 확실히 달라지지만 완벽하게
       챈다고 은어가 보장되지도 않습니다. 도감이 실력과 이어집니다.
     · 던질수록 창이 좁아집니다(700 -> 480ms, 55ms 씩). 첫 판은 누구나
       챌 수 있고 마지막 판은 손이 떨립니다.
     · 찌가 **톡톡** 두 번 건드린 뒤에 잠깁니다. 예고가 있으니 반사신경이
       아니라 보고 있는 사람이 이깁니다. 물밑에서 그림자도 같이 올라옵니다.
     · 헛챔질(잠기기 전에 채기)은 그 판을 씁니다. 대신 얼마나 일렀는지를
       초로 말해 줍니다 — 벌만 주고 이유를 안 알려 주면 억울합니다.

   코인 규칙은 그대로입니다. 다섯 번 던져 세 마리, 하루 한 번.
   도감과 최고 챔질 기록은 코인 밖에 있어서 계속 채울 수 있습니다.
   ================================================================== */
const FISH_CASTS = 5;
const FISH_NEED = 3;
const FISH_WIN0 = 700;           // 첫 판의 챔질 창(ms)
const FISH_WIN_STEP = 55;        // 던질 때마다 좁아지는 폭
const FISH_PERFECT = 230;        // 이 안이면 완벽. 사람 반응이 0.2초쯤입니다
const FISH_W = 880, FISH_H = 330;
const FISH_SURF = 118;           // 수면 높이. 데크를 넉넉히 두고 물을 아래에 깝니다
/* 이 월드에 사는 여덟 종에서 이름을 땁니다. 여기 없는 물고기를 넣으면
   "어느 게임에서든 나올 법한 잉어" 가 되고, 그러면 호수가 이 캠퍼스의
   호수일 이유가 없어집니다. w 는 뽑기 가중치입니다. */
const FISH_KINDS = [
  { name: '기린무늬 잉어',   w: 26, col: '#E8AD50', spot: '#9B5B2B' },
  { name: '거북등 붕어',     w: 24, col: '#5CB177', spot: '#2F6B45' },
  { name: '펭귄꼬리 빙어',   w: 18, col: '#4A7FB5', spot: '#22405E' },
  { name: '햄스터볼 복어',   w: 14, col: '#D8A66C', spot: '#8E6440' },
  { name: '개구리알 우렁',   w: 10, col: '#7BB661', spot: '#3F6B32' },
  { name: '고슴도치 성게',   w: 5,  col: '#8A6BC4', spot: '#4E3480' },
  { name: '알파카털 해초',   w: 2,  col: '#E4D3CC', spot: '#B9A99F' },
  { name: '백조깃 은어',     w: 1,  col: '#F4EDE4', spot: '#9AA3AE' },
];
const POND_FISH = {
  active: false, raf: 0, phase: 'idle', at: 0, biteAt: 0, nibbleAt: [],
  cast: 0, got: 0, last: '', lastCol: '', bag: [], rewarded: false, over: false,
  bob: 0, react: 0, grade: '', win: FISH_WIN0, resultAt: 0, shake: 0, overAt: 0,
};

/** 받침이 있으면 앞 것, 없으면 뒤 것. 물고기 이름이 여덟이라 '빙어 을
    잡았어요' 가 그대로 화면에 나왔습니다. */
function josa(word, withJong, withoutJong) {
  const c = String(word).charCodeAt(word.length - 1) - 0xAC00;
  const hasJong = c >= 0 && c <= 11171 && c % 28 !== 0;
  return word + (hasJong ? withJong : withoutJong);
}

function fishBook() {
  const v = loadJSON('girin.fishbook', []);
  return Array.isArray(v) ? v : [];
}
function fishBookAdd(name) {
  const b = fishBook();
  if (b.includes(name)) return;
  b.push(name); saveJSON('girin.fishbook', b);
}
/** 가장 빨리 챈 기록(ms). 코인 밖에 있는 **두 번째 판의 이유**입니다. */
function fishBest() {
  const v = Number(loadJSON('girin.fish.best', 0)) || 0;
  return v > 0 ? v : 0;
}

/** 이번 판의 챔질 창. 던진 횟수만큼 좁아집니다. */
function fishWindow(cast) {
  return Math.max(360, FISH_WIN0 - (cast - 1) * FISH_WIN_STEP);
}

/** 등급 0(아슬아슬) · 1(좋아요) · 2(완벽). 창이 좁아져도 '완벽' 기준은
    절대 시간으로 둡니다 — 창에 비례로 두면 마지막 판의 완벽이 0.13초가
    되어 사람이 낼 수 없는 값이 됩니다. */
function fishGrade(react, win) {
  if (react <= FISH_PERFECT) return 2;
  return react <= win * 0.7 ? 1 : 0;
}
const FISH_GRADE_NAME = ['아슬아슬', '좋아요', '완벽!'];
const FISH_GRADE_COL = ['#E0AE3C', '#2DD4BF', '#FFD98A'];

/** 등급이 좋을수록 귀한 종. 가중치를 w^(1-0.55x) 로 눌러 폅니다 —
    자세한 이유는 머리말에. x 는 0(아슬아슬) ~ 1(완벽). */
function pickFish(quality) {
  const x = Math.max(0, Math.min(1, quality || 0));
  const pow = 1 - 0.55 * x;
  const ws = FISH_KINDS.map((f) => Math.pow(f.w, pow));
  let r = Math.random() * ws.reduce((s, v) => s + v, 0);
  for (let i = 0; i < FISH_KINDS.length; i++) { r -= ws[i]; if (r <= 0) return FISH_KINDS[i]; }
  return FISH_KINDS[0];
}

function pondFishHtml() {
  const book = fishBook();
  const best = fishBest();
  return `
    <p>찌가 <b>톡톡</b> 건드린 뒤 <b>쑥 잠기는 순간</b> 챕니다.
    다섯 번 던져서 <b>세 마리</b>면 성공이에요.</p>
    <div class="rows">
      <div class="row"><span>남은 횟수</span><span class="val" id="fish-cast">${FISH_CASTS}번</span></div>
      <div class="row"><span>잡은 것</span><span class="val" id="fish-got">0 / ${FISH_NEED}마리</span></div>
      <div class="row"><span>도감</span><span class="val" id="fish-book">${book.length} / ${FISH_KINDS.length}종</span></div>
      <div class="row"><span>가장 빠른 챔질</span><span class="val" id="fish-best">${best ? best + 'ms' : '아직 없음'}</span></div>
    </div>
    <canvas id="fish-cv" width="${FISH_W}" height="${FISH_H}" role="img"
      aria-label="호수에 드리운 찌. 찌가 잠기면 스페이스로 챕니다."
      style="width:100%;aspect-ratio:${FISH_W}/${FISH_H};margin:12px 0 10px;border-radius:14px;border:1px solid var(--line-2);display:block"></canvas>
    <button class="act" data-do="fish-press" style="width:100%;padding:14px">던지기 · 채기 (Space)</button>
    <p class="hint" id="fish-msg" aria-live="polite">던져 보세요.</p>
    <button class="act ghost" data-do="fish-restart" style="margin-top:10px">다시 하기</button>
    <div class="note">챈 시간이 <b>0.23초</b> 안이면 <b>완벽</b>이고, 등급이 좋을수록
    귀한 종이 걸립니다. 던질수록 챌 수 있는 창이 좁아져요(0.70초 → 0.48초).
    잡은 종은 <b>도감</b>에 남아요 — 여덟 종이 다 이 캠퍼스에 사는 것들이에요.
    코인은 하루 한 번이지만 도감과 기록은 계속 채울 수 있어요.</div>`;
}
function fishSay(t) {
  const el = panelBody.querySelector('#fish-msg');
  if (el) el.textContent = t;
}
function pondFishRows() {
  const c = panelBody.querySelector('#fish-cast');
  const gt = panelBody.querySelector('#fish-got');
  const bk = panelBody.querySelector('#fish-book');
  const bs = panelBody.querySelector('#fish-best');
  if (!c) return;
  c.textContent = Math.max(0, FISH_CASTS - POND_FISH.cast) + '번';
  gt.textContent = POND_FISH.got + ' / ' + FISH_NEED + '마리';
  bk.textContent = fishBook().length + ' / ' + FISH_KINDS.length + '종';
  if (bs) bs.textContent = fishBest() ? fishBest() + 'ms' : '아직 없음';
}

/** Space 와 단추가 같이 부릅니다. 상태에 따라 던지기이기도 하고 채기이기도
    합니다 — 조작이 하나면 무엇을 눌러야 하는지 고민할 것이 없습니다. */
function fishPress() {
  const F = POND_FISH;
  if (!F.active || F.over) return;
  const now = performance.now();

  if (F.phase === 'idle' || F.phase === 'result') {
    if (F.cast >= FISH_CASTS) return;
    F.cast++; F.phase = 'wait'; F.last = ''; F.grade = ''; F.react = 0;
    F.win = fishWindow(F.cast);
    /* 기다리는 시간을 매번 다르게 둡니다. 일정하면 초를 세는 게임이 되고,
       그러면 찌를 안 보게 됩니다. */
    F.at = now + 1500 + Math.random() * 2400;
    /* 톡톡 — 잠기기 0.9초와 0.55초 전. 이 예고가 없으면 반사신경 시험이
       되고, 너무 이르면 예고와 본편이 따로 놉니다. 재 보고 고른 값입니다. */
    F.nibbleAt = [F.at - 900, F.at - 550];
    SFX.splash();
    JUICE.puff(430, FISH_SURF, 'rgba(230,246,252,.9)', 7);
    fishSay('던졌어요. 찌를 보세요 — 톡톡 두 번 뒤에 잠깁니다.');
    pondFishRows();
    return;
  }

  if (F.phase === 'wait') {
    /* 헛챔질. 얼마나 일렀는지를 말해 줍니다 — 벌만 주고 이유를 안
       알려 주면 다음 판도 똑같이 틀립니다. */
    const early = Math.max(0, F.at - now) / 1000;
    F.phase = 'result'; F.resultAt = now; F.grade = 'early'; F.shake = 0.3;
    SFX.step(SURF.WATER, false);
    JUICE.say(430, FISH_SURF - 20, '헛챔질', '#E0483A', 22);
    fishSay('잠기기 ' + early.toFixed(1) + '초 전이었어요. 톡톡 뒤 한 박자 더 기다려 주세요.');
    pondFishRows();
    return pondFishAfter();
  }

  if (F.phase === 'bite') {
    F.react = Math.round(now - F.biteAt);
    const gi = fishGrade(F.react, F.win);
    const f = pickFish(gi / 2);
    F.got++; F.bag.push(f.name); F.last = f.name; F.lastCol = f.col;
    F.grade = String(gi);
    fishBookAdd(f.name);
    const prev = fishBest();
    if (!prev || F.react < prev) saveJSON('girin.fish.best', F.react);
    F.phase = 'result'; F.resultAt = now; F.shake = 0.18 + gi * 0.12;
    SFX.splash(); SFX.chair(true);
    JUICE.burst(430, FISH_SURF, 'rgba(214,240,250,.95)', 12 + gi * 6, 150);
    JUICE.say(430, FISH_SURF - 26, FISH_GRADE_NAME[gi], FISH_GRADE_COL[gi], 24 + gi * 3);
    fishSay(FISH_GRADE_NAME[gi] + ' ' + F.react + 'ms — ' + josa(f.name, '을', '를') + ' 잡았어요!');
    pondFishRows();
    return pondFishAfter();
  }
}
function pondFishAfter() {
  if (POND_FISH.cast >= FISH_CASTS) finishPondFish();
}

function pondFishTick(now) {
  const F = POND_FISH;
  if (!F.active) return;
  F.raf = requestAnimationFrame(pondFishTick);
  const dt = Math.min(0.05, (now - F.bob) / 1000);
  F.bob = now;
  F.shake = Math.max(0, F.shake - dt * 2.2);
  JUICE.update(dt);
  if (F.phase === 'wait' && now >= F.at) {
    F.phase = 'bite'; F.biteAt = now;
    SFX.splash();
    JUICE.puff(430, FISH_SURF, 'rgba(230,246,252,.95)', 9);
    fishSay('지금 채세요!');
  } else if (F.phase === 'bite' && now - F.biteAt > F.win) {
    F.phase = 'result'; F.resultAt = now; F.last = ''; F.grade = 'miss';
    SFX.step(SURF.WATER, false);
    JUICE.say(430, FISH_SURF - 20, '놓쳤어요', '#9AA3AE', 22);
    fishSay('놓쳤어요. 찌가 잠긴 뒤 ' + (F.win / 1000).toFixed(2) + '초 안이에요.');
    pondFishAfter();
  }
  drawPondFish();
}

/* ---- 그림 ----
   데크에 서서 **물을 내려다보는** 그림입니다. 위에서부터 돌 둘레 · 나무
   데크 · 물. 하늘을 넣어 봤더니 위 안내 띠에 다 가려 띠 셋만 남았습니다.
   물은 아래로 갈수록 짙어지고(깊이), 빛은 왼쪽 위에서 옵니다. */
function drawPondFish() {
  const cv = panelBody.querySelector('#fish-cv');
  const g = fitGameCanvas(cv, FISH_W, FISH_H);
  if (!g) return;
  const F = POND_FISH;
  const W = FISH_W, H = FISH_H;
  if (F.shake > 0) g.translate((Math.random() - 0.5) * F.shake * 10, (Math.random() - 0.5) * F.shake * 7);

  /* 돌 둘레 */
  g.fillStyle = '#8C99A6'; g.fillRect(0, 0, W, 40);
  g.fillStyle = '#A7B3BE'; g.fillRect(0, 0, W, 28);
  g.fillStyle = '#6F7C88';
  for (let x = 6; x < W; x += 38) g.fillRect(x, 9, 26, 19);
  g.fillStyle = '#C4CDD5';
  for (let x = 6; x < W; x += 38) g.fillRect(x, 9, 26, 3);
  g.fillStyle = '#6F9E5C';
  for (let x = 14; x < W; x += 51) g.fillRect(x, 31, 10, 9);
  /* 나무 데크 — 널 여덟 장. 널이 가로로 길어 판이 넓어진 것이 보입니다. */
  for (let i = 0; i < 8; i++) {
    g.fillStyle = i % 2 ? '#A97A4C' : '#B98756';
    g.fillRect(0, 40 + i * 8, W, 8);
    g.fillStyle = '#8A6039'; g.fillRect(0, 46 + i * 8, W, 1);
  }
  g.fillStyle = '#C79A6B'; g.fillRect(0, 40, W, 2);          // 빛은 왼쪽 위
  g.fillStyle = '#7A5637'; g.fillRect(0, 104, W, 6);         // 데크 끝 — 물에 지는 그늘
  g.fillStyle = '#5E4028'; g.fillRect(0, 108, W, 3);
  /* 못 자국 */
  g.fillStyle = '#6B4A2E';
  for (let x = 40; x < W; x += 120) { g.fillRect(x, 52, 3, 3); g.fillRect(x, 92, 3, 3); }

  /* 물 */
  const w = g.createLinearGradient(0, FISH_SURF - 8, 0, H);
  w.addColorStop(0, '#6BC3D8'); w.addColorStop(0.45, '#3E93B4'); w.addColorStop(1, '#0F4257');
  g.fillStyle = w; g.fillRect(0, 111, W, H - 111);
  g.fillStyle = 'rgba(255,255,255,.24)'; g.fillRect(0, 111, W, 3);
  /* 빛줄기 — 왼쪽 위에서 물속으로. 이 한 겹이 없으면 물이 파란 판입니다. */
  for (let i = 0; i < 5; i++) {
    const x = 90 + i * 165 + Math.sin(F.bob / 2200 + i) * 12;
    g.fillStyle = 'rgba(255,255,255,.055)';
    g.beginPath();
    g.moveTo(x, 114); g.lineTo(x + 34, 114); g.lineTo(x + 128, H); g.lineTo(x + 62, H);
    g.closePath(); g.fill();
  }
  /* 물결 — 층마다 다른 속도로 흘러야 물이 깊어 보입니다 */
  for (let i = 0; i < 11; i++) {
    const y = 128 + i * 18;
    const sp = 26 + (i % 3) * 16;
    const x = ((i * 137 + F.bob / sp) % (W + 140)) - 140;
    g.fillStyle = 'rgba(255,255,255,' + (0.15 - i * 0.008).toFixed(3) + ')';
    g.fillRect(x, y, 72, 3); g.fillRect(x + 96, y, 34, 3);
  }
  /* 물풀 — 바닥 쪽. 앞뒤 두 겹이라 깊이가 납니다. */
  for (let x = 24; x < W; x += 71) {
    const sway = Math.sin(F.bob / 700 + x) * 3;
    g.fillStyle = 'rgba(16,66,54,.45)';
    g.fillRect(x, H - 44, 5, 44);
    g.fillRect(x + 8 + sway, H - 32, 5, 32);
    g.fillStyle = 'rgba(30,96,78,.5)';
    g.fillRect(x + 16, H - 24, 4, 24);
  }
  /* 물속 그림자 — 뭔가 살고 있어야 못이 됩니다. 미끼와는 무관합니다. */
  g.fillStyle = 'rgba(8,40,56,.3)';
  for (let i = 0; i < 6; i++) {
    const y = 176 + (i % 3) * 48;
    const sp = i % 2 ? 34 : 46;
    const x = ((i * 191 - F.bob / sp) % (W + 160) + W + 160) % (W + 160) - 80;
    g.fillRect(x, y, 34, 10); g.fillRect(x - 9, y + 3, 10, 5);
  }
  /* 연잎 둘 — 수면에 뜬 것이 있어야 수면이 수면으로 보입니다 */
  [[120, 132], [760, 146]].forEach(([lx, ly], i) => {
    const sw = Math.sin(F.bob / 800 + i) * 2;
    g.fillStyle = '#2F6B45'; g.beginPath(); g.ellipse(lx, ly + sw, 44, 13, 0, 0, 7); g.fill();
    g.fillStyle = '#4E9E63'; g.beginPath(); g.ellipse(lx, ly - 3 + sw, 42, 12, 0, 0, 7); g.fill();
    g.fillStyle = '#3F8F5C'; g.fillRect(lx - 3, ly - 8 + sw, 24, 3);
  });

  /* 낚싯대 — 데크 왼쪽에서 물 쪽으로. 끝이 휘어야 낚싯대입니다. */
  const bite = F.phase === 'bite';
  const pull = bite ? 12 : 0;                 // 물면 초리가 처집니다
  /* 대는 데크와 색이 비슷해서, 어두운 테를 한 겹 두르지 않으면 널 위에
     그은 선으로 보입니다. 굵기는 손잡이 쪽이 두껍고 끝이 가늡니다. */
  const rodAt = (t) => ({ x: 66 + t * 338, y: 100 - t * 56 - Math.sin(t * Math.PI) * 20 + pull * t * t });
  for (const pass of [0, 1]) {
    for (let k = 0; k <= 60; k++) {
      const t = k / 60, q = rodAt(t), th = (10 - t * 5.5) + (pass ? 0 : 4);
      g.fillStyle = pass ? (t > 0.62 ? '#B98756' : '#8A6039') : '#4A3323';
      g.fillRect(q.x - th / 2, q.y - th / 2, th, th);
    }
  }
  g.fillStyle = '#5F6874'; disc(g, 92, 100, 13, '#5F6874');        // 릴
  disc(g, 92, 100, 9, '#98A2AD');
  disc(g, 89, 97, 4, '#C2CAD2');
  g.fillStyle = '#4A3323'; g.fillRect(40, 96, 34, 14);             // 손잡이
  g.fillStyle = '#6B4A2E'; g.fillRect(42, 98, 30, 8);
  g.fillStyle = '#8A6039'; g.fillRect(42, 98, 30, 2);

  /* 찌 — 톡톡 · 잠김. 여기가 이 게임의 전부라 제일 크게 그립니다. */
  const fx = 430;
  let fy = FISH_SURF + 6;
  if (F.phase === 'wait') {
    fy += Math.sin(F.bob / 300) * 3;
    /* 톡톡 — 예고 두 번. 짧고 얕게 눌렸다 올라옵니다. */
    for (const t of F.nibbleAt) {
      const d = F.bob - t;
      if (d >= 0 && d < 260) fy += Math.sin((d / 260) * Math.PI) * 11;
    }
    /* 물밑 그림자 — 잠기기 전 1초 동안 올라옵니다. 눈이 여기에 붙습니다. */
    const near = 1 - Math.max(0, Math.min(1, (F.at - F.bob) / 1000));
    if (near > 0) {
      g.fillStyle = 'rgba(8,40,56,' + (0.18 + near * 0.3).toFixed(2) + ')';
      const sy = 286 - near * 132;
      g.fillRect(fx - 30, sy, 54, 15); g.fillRect(fx - 44, sy + 5, 15, 7);
    }
  } else if (bite) {
    const d = Math.min(1, (F.bob - F.biteAt) / 140);
    fy += 46 * (1 - Math.pow(1 - d, 3));      // 쑥 — 뒤로 갈수록 느려집니다
  }
  /* 낚싯줄 */
  g.strokeStyle = 'rgba(250,250,255,.9)'; g.lineWidth = 2;
  const tip = rodAt(1);
  g.beginPath(); g.moveTo(tip.x, tip.y); g.lineTo(fx + 6, fy - 20); g.stroke();
  /* 파문 — 잠기면 크고 빠릅니다 */
  g.strokeStyle = 'rgba(255,255,255,' + (bite ? 0.9 : 0.42) + ')';
  g.lineWidth = bite ? 3 : 2;
  for (let r = 1; r <= 3; r++) {
    const grow = ((F.bob / (bite ? 90 : 260) + r * 0.8) % 3) + 0.4;
    g.beginPath();
    g.ellipse(fx + 6, FISH_SURF + 14, grow * (bite ? 30 : 15), grow * (bite ? 8 : 5), 0, 0, 7);
    g.stroke();
  }
  g.fillStyle = '#2A2320'; g.fillRect(fx, fy - 6, 13, 28);          // 아랫동
  g.fillStyle = '#F4EDE4'; g.fillRect(fx - 4, fy - 24, 21, 19);     // 흰 몸
  g.fillStyle = '#D8D2CC'; g.fillRect(fx + 11, fy - 24, 6, 19);
  g.fillStyle = '#D8442C'; g.fillRect(fx - 4, fy - 42, 21, 19);     // 붉은 머리
  g.fillStyle = '#F08A78'; g.fillRect(fx - 4, fy - 42, 21, 4);      // 빛은 왼쪽 위
  g.fillStyle = '#9B2E1C'; g.fillRect(fx + 11, fy - 42, 6, 37);

  /* ---- 잡은 물고기 ----
     물 위로 튀어 오릅니다. 이름표만 뜨면 "숫자가 올라갔다" 이고,
     튀어 오르면 "잡았다" 입니다. */
  if (F.phase === 'result' && F.last) {
    const t = Math.min(1, (F.bob - F.resultAt) / 420);
    const rise = 1 - Math.pow(1 - t, 3);
    const k = FISH_KINDS.find((q) => q.name === F.last) || FISH_KINDS[0];
    const cx = 636, cy = 282 - rise * 138, tilt = (1 - rise) * 0.5;
    g.save(); g.translate(cx, cy); g.rotate(-tilt);
    /* 몸통은 위아래가 좁아지는 줄로 쌓습니다 — 네모로 그리면 물고기로
       안 읽힙니다. 물빛과 겹치는 종(빙어·은어)이 있어 테두리를 먼저. */
    const rows = [6, 12, 18, 24, 28, 32, 34, 34, 32, 28, 24, 18, 12, 6];
    rows.forEach((wRow, i) => {
      const x = -(wRow * 1.5), y = -21 + i * 3;
      g.fillStyle = 'rgba(12,40,52,.8)'; g.fillRect(x - 3, y - 1, wRow * 3 + 6, 5);
    });
    rows.forEach((wRow, i) => {
      const x = -(wRow * 1.5), y = -21 + i * 3;
      g.fillStyle = k.col; g.fillRect(x, y, wRow * 3, 3);
      g.fillStyle = 'rgba(255,255,255,.22)'; g.fillRect(x, y, wRow * 3, 1);
    });
    g.fillStyle = 'rgba(12,40,52,.8)'; g.fillRect(-72, -14, 22, 28);   // 꼬리
    g.fillStyle = k.col; g.fillRect(-68, -10, 18, 20); g.fillRect(-72, -4, 6, 8);
    g.fillStyle = k.spot;
    [[-24, -6], [-2, 4], [18, -10]].forEach(([a, b]) => g.fillRect(a, b, 11, 9));
    g.fillStyle = '#FFF6F3'; g.fillRect(36, -6, 10, 10);
    g.fillStyle = '#2A2320'; g.fillRect(39, -3, 5, 5);                 // 눈
    g.restore();
    /* 이름표 */
    g.fillStyle = 'rgba(42,35,32,.9)';
    g.fillRect(cx - 96, cy + 34, 192, 30);
    g.fillStyle = '#FFF6F3'; g.font = '700 16px system-ui, sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(k.name, cx, cy + 49);
    g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  }

  /* ---- 챔질 자 ----
     방금 챈 자리를 창 위에 표시합니다. "완벽" 이 왜 완벽인지 눈으로
     한 번 더 말해 주는 자리입니다. */
  if (F.phase === 'result' && F.grade !== '' && F.grade !== 'early' && F.grade !== 'miss') {
    const bw = 300, bx = W - bw - 26, by = H - 54;
    g.fillStyle = 'rgba(255,255,255,.9)'; g.fillRect(bx - 8, by - 22, bw + 16, 44);
    g.fillStyle = '#D8D2CC'; g.fillRect(bx, by, bw, 12);
    g.fillStyle = '#FFD98A'; g.fillRect(bx, by, bw * (FISH_PERFECT / F.win), 12);
    g.fillStyle = '#2DD4BF';
    g.fillRect(bx + bw * (FISH_PERFECT / F.win), by, bw * (0.7 - FISH_PERFECT / F.win), 12);
    const mx = bx + bw * Math.min(1, F.react / F.win);
    g.fillStyle = '#2B3230'; g.fillRect(mx - 2, by - 6, 4, 24);
    g.font = '700 12px system-ui, sans-serif'; g.textBaseline = 'middle';
    g.fillText(F.react + 'ms / ' + F.win + 'ms', bx, by - 12);
    g.textBaseline = 'alphabetic';
  }

  JUICE.draw(g);

  /* 지금 뭘 해야 하는지 — 캔버스 안에도 한 줄. 아래 글만 보면 찌에서
     눈을 떼야 하고, 그 사이에 판이 끝납니다. */
  g.fillStyle = bite ? 'rgba(224,72,58,.94)' : 'rgba(42,35,32,.66)';
  g.fillRect(0, 0, W, 24);
  g.fillStyle = '#FFFFFF'; g.font = '700 14px system-ui, sans-serif';
  g.textBaseline = 'middle';
  g.fillText(bite ? '지금 채세요!' : F.phase === 'wait' ? '기다리는 중… 톡톡 두 번 뒤에 잠깁니다'
             : F.over ? '끝났어요' : '던지려면 Space', 12, 12);
  g.textAlign = 'right';
  g.fillText(F.got + ' / ' + FISH_NEED + '마리 · ' + Math.max(0, FISH_CASTS - F.cast) + '번 남음 · 창 '
             + (fishWindow(Math.min(FISH_CASTS, F.cast + 1)) / 1000).toFixed(2) + '초', W - 12, 12);
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';

  /* ---- 끝 ---- */
  if (F.over) {
    const won = F.got >= FISH_NEED;
    g.fillStyle = won ? 'rgba(47,158,91,.93)' : 'rgba(42,35,32,.88)';
    g.fillRect(0, H / 2 - 62, W, 124);
    g.fillStyle = '#FFFFFF'; g.textAlign = 'center';
    g.font = '800 42px system-ui, sans-serif';
    g.fillText(F.got + '마리', W / 2, H / 2 - 12);
    /* 같은 종을 다섯 번 잡으면 이름이 다섯 번 나와 칸을 넘칩니다.
       세어서 한 줄로 줄이고, 그래도 넘치면 글자를 줄입니다. */
    const tally = new Map();
    for (const n of F.bag) tally.set(n, (tally.get(n) || 0) + 1);
    const line = [...tally].map(([n, c]) => (c > 1 ? n + ' x' + c : n)).join(' · ');
    let size = 17;
    g.font = '700 ' + size + 'px system-ui, sans-serif';
    while (size > 11 && g.measureText(line).width > W - 60) {
      size -= 1; g.font = '700 ' + size + 'px system-ui, sans-serif';
    }
    g.fillText(F.bag.length ? line : '한 마리도 못 잡았어요', W / 2, H / 2 + 24);
    g.textAlign = 'left';
  }
  g.setTransform(1, 0, 0, 1, 0, 0);
}

function finishPondFish() {
  const F = POND_FISH;
  F.over = true; F.active = false;
  F.overAt = performance.now();
  cancelAnimationFrame(F.raf);
  const won = F.got >= FISH_NEED;
  if (won) {
    if (!F.rewarded) { F.rewarded = true; earn(COIN_MINIGAME, '연못 낚시 ' + F.got + '마리', 'pondFish'); }
    SFX.door();
    JUICE.burst(FISH_W / 2, FISH_H / 2, '#FFE9A8', 26, 200);
    fishSay(gameWinMsg());
  } else {
    fishSay(F.got + '마리로 끝났어요. 세 마리부터 코인이에요 — 톡톡 뒤 잠기는 순간이에요.');
  }
  pondFishRows();
  F.bob = performance.now();
  F.raf = requestAnimationFrame(pondFishOutro);
}

/** 끝난 뒤 1.4초. 마지막 물보라가 떨어지는 것까지 보여 줍니다. */
function pondFishOutro(now) {
  const F = POND_FISH;
  if (!F.over) return;
  const dt = Math.min(0.05, (now - F.bob) / 1000);
  F.bob = now;
  F.shake = Math.max(0, F.shake - dt * 2.2);
  JUICE.update(dt);
  drawPondFish();
  if (now - F.overAt < 1400) F.raf = requestAnimationFrame(pondFishOutro);
}

function startPondFish() {
  const F = POND_FISH;
  cancelAnimationFrame(F.raf);
  panelBody.innerHTML = pondFishHtml();
  JUICE.reset();
  F.active = true; F.over = false; F.phase = 'idle';
  F.cast = 0; F.got = 0; F.bag = []; F.last = ''; F.rewarded = false;
  F.at = 0; F.biteAt = 0; F.nibbleAt = []; F.react = 0; F.grade = '';
  F.win = FISH_WIN0; F.resultAt = 0; F.shake = 0;
  F.bob = performance.now();
  pondFishRows();
  drawPondFish();
  F.raf = requestAnimationFrame(pondFishTick);
}

/* ==================================================================
   미니게임 8 — 책 정리 · 도서관

   도서관은 백색소음이 깔린 "오래 앉는 방" 입니다. 그 방에 반응 속도를
   요구하는 게임을 놓으면 방의 성격을 깨므로, **순서만 맞추면 되는**
   조용한 것으로 골랐습니다. 손이 아니라 눈으로 하는 일입니다.

   청구기호는 KDC(한국십진분류) 꼴입니다 — 분류번호가 먼저, 같으면
   저자기호. 도서관에서 실제로 꽂는 순서 그대로라, 규칙을 따로 배울
   것이 없습니다.

   ---- 고쳐 쓰기 전 ----
   세 칸이 전부 똑같았습니다. 매번 다섯 권을 무작위로 뽑았으니 1칸과
   3칸의 난이도가 같고(재 보니 같은 번호가 겹칠 확률이 판마다 26%),
   그래서 세 칸이 "한 판을 세 번" 이었습니다. 틀리면 정답을 그대로
   알려 줬고("아직이에요 — 512.6 최09ㅁ 먼저!"), 그러면 두 번째부터는
   찍고 답을 받아 적으면 됩니다. 맞혀도 아무 일이 안 일어나서, 꽂았다는
   느낌도 없었습니다.

   ---- 지금 ----
     1칸 네 권 · 앞자리가 다 다릅니다. 백의 자리만 보면 됩니다.
     2칸 다섯 권 · **같은 번호 한 쌍**이 반드시 들어갑니다. 저자기호까지
          봐야 하는 규칙이 여기서 처음 필요해집니다.
     3칸 여섯 권 · 같은 번호 한 쌍에, 나머지도 같은 백의 자리로 모읍니다.
          앞자리로는 못 가르고 소수점까지 읽어야 합니다.
   틀리면 처음에는 방향만 알려 주고(더 작은 번호가 남았어요), 같은 칸에서
   두 번째로 틀리면 그때 답을 짚어 줍니다 — 헤매는 사람은 건지고,
   찍는 사람에게는 답을 안 팝니다. 벌은 그대로 시간 3초입니다.
   맞으면 책이 책장으로 **날아가 꽂히고** 나무 소리가 납니다.
   ================================================================== */
const BOOK_ROUNDS = 3;
const BOOK_MS = 90000;
const BOOK_PENALTY = 3000;       // 틀리면 3초. 못 꽂는 벌은 안 줍니다
/* 칸마다 몇 권인지. 늘어나는 것이 곧 난이도 곡선입니다. */
const BOOK_PER_ROUND = [4, 5, 6];
/* 이 캠퍼스에 있을 법한 책만 넣습니다. 아무 대학 도서관에나 있는 목록을
   넣으면 여기가 이 도서관일 이유가 없습니다. */
/* 제목은 **일곱 자 안쪽**입니다. 책등에 세로로 한 줄로 서야 하는데,
   길면 두 줄로 접히면서 읽는 순서가 뒤엉킵니다('목해 과부 어학 깨의'). */
const BOOK_POOL = [
  { n: '026.4', a: '김72ㄷ', t: '도서관 안내' },
  { n: '182.1', a: '박43ㅈ', t: '집중의 기술' },
  { n: '325.2', a: '이55ㅅ', t: '시간 관리법' },
  { n: '411.8', a: '정31ㅌ', t: '통계 첫걸음' },
  { n: '512.6', a: '최09ㅁ', t: '목 해부학' },
  { n: '513.4', a: '한27ㅇ', t: '앉는 사람들' },
  { n: '513.4', a: '한27ㅈ', t: '일어나기' },
  { n: '517.2', a: '윤66ㅅ', t: '생활 스트레칭' },
  { n: '598.3', a: '서14ㅋ', t: '책상 앞 자세' },
  { n: '658.9', a: '노88ㅍ', t: '픽셀 그리기' },
  { n: '701.3', a: '강20ㅎ', t: '한국어 문법' },
  { n: '813.7', a: '문95ㄱ', t: '기린의 목' },
  { n: '818.2', a: '오03ㄴ', t: '느린 거북' },
  { n: '911.5', a: '배77ㅅ', t: '서울의 대학' },
  { n: '982.1', a: '류61ㅇ', t: '도서관 기행' },
];
const BOOK_COLORS = ['#D8442C', '#E8C34A', '#3F8F5C', '#4A7FB5', '#8A6BC4', '#E4805A'];
const BOOK_SORT = {
  active: false, timer: 0, endAt: 0, round: 0, cart: [], shelf: [],
  wrong: 0, roundWrong: 0, streak: 0, rewarded: false, over: false,
  flash: 0, placed: -1,
};

/** 꽂는 순서 — 분류번호가 먼저, 같으면 저자기호. */
const bookOrder = (x, y) => (Number(x.n) - Number(y.n)) || (x.a < y.a ? -1 : x.a > y.a ? 1 : 0);

/** 같은 분류번호를 나눠 갖는 짝. 2·3칸이 이걸 반드시 하나 씁니다 —
    저자기호 규칙은 짝이 있어야만 쓸 일이 생깁니다. */
function bookTwins() {
  const by = new Map();
  for (const b of BOOK_POOL) {
    const k = b.n;
    by.set(k, (by.get(k) || []).concat([b]));
  }
  return [...by.values()].filter((g) => g.length > 1);
}

function bookShuffle(list) {
  for (let i = list.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    [list[i], list[j]] = [list[j], list[i]];
  }
  return list;
}

/** 칸 하나를 뽑습니다. round 는 0·1·2.
    1칸은 앞자리(백의 자리)가 다 다른 것만 고릅니다 — 첫 칸에서 소수점을
    읽게 하면 규칙을 배우기 전에 지칩니다. */
function bookDeal(round) {
  const n = BOOK_PER_ROUND[round] || 5;
  let pick = [];
  if (round === 0) {
    const byHead = new Map();
    for (const b of bookShuffle(BOOK_POOL.slice())) {
      const h = b.n[0];
      if (!byHead.has(h)) byHead.set(h, b);
    }
    pick = bookShuffle([...byHead.values()]).slice(0, n);
  } else {
    const twins = bookTwins();
    const pair = twins[(Math.random() * twins.length) | 0] || [];
    pick = pair.slice(0, 2);
    let rest = BOOK_POOL.filter((b) => !pick.includes(b));
    /* 3칸은 나머지도 같은 백의 자리로 모읍니다. 500 번대가 이 표에서
       가장 두꺼워(512·513·513·517) 소수점을 꼭 읽어야 하는 칸이 됩니다. */
    if (round === 2) {
      const head = pick[0] ? pick[0].n[0] : '5';
      const near = bookShuffle(rest.filter((b) => b.n[0] === head));
      pick = pick.concat(near.slice(0, n - pick.length));
      rest = rest.filter((b) => !pick.includes(b));
    }
    pick = pick.concat(bookShuffle(rest).slice(0, Math.max(0, n - pick.length)));
  }
  /* 섞습니다. 뽑은 순서대로 두면 가끔 이미 정렬된 판이 나옵니다. */
  return bookShuffle(pick).map((b, i) => ({ ...b, col: BOOK_COLORS[i % BOOK_COLORS.length] }));
}
