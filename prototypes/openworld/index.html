<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>Deskfit — 오픈월드 프로토타입</title>
<!-- Wanted Sans — UI 전용입니다. 월드 안의 픽셀 글자는 Malgun Gothic 을
     1비트로 잘라 만들므로 그쪽 서체 사슬은 건드리지 않습니다. -->
<link rel="stylesheet" href="../../public/fonts/wanted-sans/WantedSansVariable.css">

<style>
  /* ==================================================================
     Deskfit — 화면 색

     제품은 밝은 서비스이고, 그 안에 픽셀 세계가 들어 있습니다. ZEP 이
     그렇듯 UI 는 흰 판이고 월드만 그림입니다. 예전 다크라임은 월드와
     UI 가 같은 어둠이라 어디까지가 게임인지 흐렸습니다.

     **코랄 위에 흰 글자는 쓰지 않습니다.** 대비가 2.81 로 AA 에 못
     미칩니다(재서 확인했습니다). 코랄은 채움으로 쓰고 글자는 잉크를
     얹으며(5.50), 코랄로 글자를 쓸 때는 700 단계를 씁니다(5.14).
     ================================================================== */
  @font-face {
    font-family: 'Pretendard Variable';
    src: url('assets/fonts/PretendardVariable.woff2') format('woff2-variations');
    font-weight: 45 920;
    font-style: normal;
    font-display: swap;
  }

  /* 갈무리 — 픽셀 격자에 맞춰 설계된 한글 글꼴입니다. 세 종을 쓰는 이유는
     크기마다 획이 따로 그려져 있기 때문입니다. 7 을 키워 11 자리에 쓰면
     갈무리를 쓰는 뜻이 없어집니다.
     SIL Open Font License 1.1 — assets/fonts/Galmuri-OFL.md */
  @font-face {
    font-family: 'Galmuri7';
    src: url('assets/fonts/Galmuri7.woff2') format('woff2');
    font-weight: 400; font-style: normal; font-display: block;
  }
  @font-face {
    font-family: 'Galmuri9';
    src: url('assets/fonts/Galmuri9.woff2') format('woff2');
    font-weight: 400; font-style: normal; font-display: block;
  }
  @font-face {
    font-family: 'Galmuri11';
    src: url('assets/fonts/Galmuri11.woff2') format('woff2');
    font-weight: 400; font-style: normal; font-display: block;
  }

  :root {
    /* 청록 — 서비스 주색.

       코랄에서 넘어왔습니다. 코랄 #FF6B52 는 자세가 나쁠 때 뜨는 빨강과
       색상환에서 5도 떨어져 있었습니다. 브랜드색과 경고색이 사실상 같은
       색이면, 이기는 쪽은 언제나 더 자주 보이는 브랜드색입니다 — 가장
       중요한 순간에 안 읽히는 경고가 됩니다.

       **청록 위에는 먹 글자를 얹습니다.** 흰 글자는 1.86:1 로 못 씁니다.
       밝은 채움에 어두운 글자가 이 색의 원래 쓰임이고, 눌린 상태(600)
       에서도 먹을 유지하면 5.02 로 버팁니다. 전 계통이 규칙 하나로
       통일됩니다 - 자리마다 글자색이 달라지면 그때부터 어긋납니다. */
    --teal-50:  #EFFBF9;
    --teal-100: #CFF2ED;
    --teal-200: #ADEBE2;
    --teal-300: #8AE5D9;
    --teal-400: #56DCCA;
    --teal:     #2DD4BF;
    --teal-600: #12A592;   /* 눌림 · 호버 — 여기도 먹 글자 5.02 */
    --teal-700: #0D7769;   /* 크림 위 청록 글자 5.25 — AA */
    --teal-800: #0C5A4F;

    /* 민트 — design-drafts/palette.html 의 앵커(#40DDCA, 시안 A).
       --teal(#2DD4BF)과 색상이 1도 차이라 나란히 놓아도 안 어긋납니다.
       가구 서랍과 놓을 자리 표시에만 씁니다 — 나머지 UI 를 통째로
       옮기는 것은 이 작업의 범위가 아닙니다. */
    --mint: #40DDCA;

    /* 중성 — 흰 무대. 온보딩과 **같은 값**입니다. 알을 깨고 들어온
       순간 바탕색이 바뀌면 다른 제품에 온 것처럼 보입니다.
       완전한 무채색은 청록 옆에서 누렇게 보여 아주 조금 차갑습니다. */
    --bg:        #FFFFFF;
    --ink:       #2B3230;   /* 흰 위 13.11 */
    --ink-2:     #5C6663;   /* 5.94 */
    --ink-3:     #6E7876;   /* 4.55 — 작은 글자도 통과해야 하는 층 */
    --line:      #E8EBEB;
    --line-2:    #DCE0E0;
    --surface:   #FFFFFF;
    --surface-2: #F7F8F8;
    --surface-3: #EFF1F1;

    --on-teal:  #2B3230;
    --good: #2E9E5B;
    --warn: #D98324;
    --bad:  #E0483A;   /* 판정 색 셋은 STATE_COLOR 와 같은 값입니다 */

    --sh:    0 8px 24px rgba(20, 40, 38, .10);
    --sh-lg: 0 24px 56px rgba(20, 40, 38, .16);
    --r:  10px;
    --r-lg: 16px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--surface-2);
    color: var(--ink);
    font: 14px/1.6 'Wanted Sans Variable', 'Pretendard Variable', -apple-system,
          'Segoe UI', 'Malgun Gothic', sans-serif;
    /* 타이머·코인·남은 시간이 매초 좌우로 떨지 않게 */
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  #stage {
    position: fixed; inset: 0; display: grid; place-items: center;
    background:
      radial-gradient(120% 90% at 50% 42%, #FFFFFF 0%, var(--surface-2) 58%, var(--surface-3) 100%);
  }
  canvas#world {
    image-rendering: pixelated; display: block;
    touch-action: none;
    border-radius: 12px;
    box-shadow: 0 1px 0 rgba(255,255,255,.9), var(--sh-lg);
    outline: 1px solid var(--line);
  }

  /* ---------- HUD ---------- */
  .hud { position: fixed; pointer-events: none; font-variant-numeric: tabular-nums; }

  /* 좌측 상단 존 배지와 좌측 하단 조작 안내는 걷어냈습니다. 지금 어느
     건물인지는 화면이 말해 주고, 조작은 첫 진입 안내가 한 번 알려 준 뒤
     나루에게 다시 물으면 됩니다. 늘 떠 있는 설명은 처음 한 번만 읽힙니다.
     비운 왼쪽 아래는 채팅이 씁니다(chat.js).

     성능 배지는 남깁니다 — 출시 직전에 지웁니다. */
  #hud-perf {
    right: 20px; top: 20px; text-align: right;
    font: 11px/1.5 ui-monospace, 'Consolas', monospace;
    color: var(--ink-3);
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); padding: 8px 11px; box-shadow: var(--sh);
  }
  #hud-perf b { color: var(--teal-700); font-weight: 700; }

  /* ---------- 지도 배율 ----------
     오른쪽 가장자리 한가운데. 위(성능·마이페이지)와 아래(코인·세션)가
     이미 찬 모서리라, 비어 있는 변은 여기뿐입니다. */
  #zoom {
    position: fixed; right: 20px; top: 50%; transform: translateY(-50%); z-index: 6;
    display: flex; flex-direction: column; align-items: stretch; gap: 2px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); padding: 4px; box-shadow: var(--sh);
  }
  #zoom button {
    width: 30px; height: 26px; padding: 0; cursor: pointer;
    border: 0; border-radius: 7px; background: transparent;
    color: var(--ink-2); font: inherit; font-size: 15px; font-weight: 700; line-height: 1;
  }
  #zoom button:hover:not(:disabled) { background: var(--teal-50); color: var(--teal-700); }
  #zoom button:disabled { opacity: .32; cursor: default; }
  #zoom button:focus-visible { outline: 2px solid var(--teal-600); outline-offset: 1px; }
  #zoom b {
    text-align: center; font-size: 11px; font-weight: 700; color: var(--ink-3);
    font-variant-numeric: tabular-nums; padding: 1px 0;
  }
  #hud-perf .warn { color: var(--warn); }

  /* ==================================================================
     첫 안내 — 그림 넉 장

     예전 판은 아래쪽 띠에 제목 한 줄 · 설명 한 줄이었습니다. 줄글이라
     읽는 사람이 적었고, "학생회관 상점" 이라고 써 놔도 그게 어느
     건물인지는 결국 걸어 다니며 찾아야 했습니다.

     지금은 **우리 월드를 그대로 찍은 그림**에 동그라미와 화살표를 얹습니다.
     그림이 본문이고 글은 한 줄짜리 제목과 한 줄짜리 설명뿐입니다.
     그림이 주인공이므로 화면 가운데 모달입니다 — 예전에 모달을 피한
     이유가 "배우는 동안 캠퍼스가 안 보인다" 였는데, 이제는 카드 안에
     캠퍼스가 들어 있습니다.
     ================================================================== */
  #tour {
    position: fixed; inset: 0; z-index: 40;
    display: none; align-items: center; justify-content: center;
    background: rgba(30, 38, 36, .46);
    padding: 20px;
  }
  #tour.on { display: flex; }
  .tour-card {
    position: relative;
    width: min(620px, 100%); max-height: calc(100vh - 40px); overflow: auto;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 18px; box-shadow: 0 18px 50px rgba(43, 50, 48, .28);
    padding: 18px 22px 16px;
    animation: tourUp .22s cubic-bezier(.2, .9, .3, 1) both;
  }
  @keyframes tourUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  #tour-pic {
    display: block; width: 100%; height: auto;
    border-radius: 12px; background: #EFF1F1;
    border: 1px solid var(--line);
  }
  .tour-text { margin: 14px 2px 0; }
  .tour-text b {
    display: block; font-size: 16px; font-weight: 800; color: var(--ink);
    letter-spacing: -.01em;
  }
  .tour-text p {
    margin: 5px 0 0; font-size: 13px; line-height: 1.55; color: var(--ink-2);
    word-break: keep-all;
  }
  .tour-foot { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
  .tour-dots { display: flex; gap: 5px; margin-right: auto; }
  .tour-dots i {
    width: 7px; height: 7px; border-radius: 50%; background: var(--line-2);
    transition: background .18s ease, transform .18s cubic-bezier(.2, .9, .3, 1);
  }
  .tour-dots i.on { background: var(--teal); transform: scale(1.34); }
  .tour-dots i.done { background: var(--teal-300); }
  .tour-btn {
    background: var(--teal); border: 1px solid var(--teal-600);
    border-radius: 9px; color: var(--on-teal);
    font: inherit; font-size: 12.5px; font-weight: 700;
    padding: 8px 16px; cursor: pointer;
    transition: filter .14s ease, transform .09s ease;
  }
  .tour-btn:hover { filter: brightness(1.04); }
  .tour-btn:active { transform: scale(.97); }
  .tour-btn.ghost { background: var(--surface); border-color: var(--line-2); color: var(--ink-3); }
  .tour-btn.ghost:hover { background: var(--teal-50); color: var(--ink-2); }
  .tour-btn:disabled { opacity: .38; cursor: default; }
  .tour-btn:focus-visible { outline: 2px solid var(--teal-600); outline-offset: 2px; }
  #tour-x {
    position: absolute; right: 12px; top: 12px; z-index: 1;
    width: 30px; height: 30px; padding: 0; cursor: pointer;
    border: 1px solid var(--line); border-radius: 9px;
    background: var(--surface); color: var(--ink-3);
    font: inherit; font-size: 17px; line-height: 1;
  }
  #tour-x:hover { background: var(--teal-50); color: var(--ink); }
  #tour-x:focus-visible { outline: 2px solid var(--teal-600); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .tour-card { animation: none; } }

  /* 상호작용 안내 — 코랄 알약. 글자는 잉크입니다. */
  #prompt {
    position: fixed; pointer-events: none;
    padding: 7px 14px; border-radius: 999px;
    background: var(--teal); color: var(--on-teal);
    font-size: 12.5px; font-weight: 700; white-space: nowrap;
    transform: translate(-50%, -100%);
    opacity: 0; transition: opacity .16s ease;
    /* 코랄 시절 값이 남아 있었습니다. 청록 칩 아래에만 주황 노을이
       졌습니다 - 한 번 보면 계속 보입니다. */
    filter: drop-shadow(2px 3px 0 rgba(43, 50, 48, .22));
  }
  #prompt.on { opacity: 1; }

  /* ---------- 자세 말풍선 ----------
     상호작용 칩과 같은 층·같은 좌표 계산을 씁니다. 그래서 걸어가는
     동안에도 머리를 따라옵니다 — 자세 알림이 세션 카드 안 작은 글자로만
     있으면, 공부하는 사람은 그걸 볼 일이 없습니다.

     색은 자세 상태색(STATE_COLOR)입니다. 브랜드 청록과 분리된 계통이라
     이 칩만은 청록이 아닙니다 — 그게 "지금 다른 이야기" 라는 표시입니다. */
  #say {
    position: fixed; pointer-events: none; z-index: 7;
    max-width: 260px; padding: 8px 14px; border-radius: 14px;
    background: var(--surface); color: var(--ink);
    border: 2px solid var(--warn);
    font-size: 13px; font-weight: 700; line-height: 1.4; text-align: center;
    transform: translate(-50%, -100%) scale(.94);
    opacity: 0; transition: opacity .2s ease, transform .2s cubic-bezier(.2,.9,.3,1);
    filter: drop-shadow(2px 3px 0 rgba(43, 50, 48, .18));
  }
  #say.on { opacity: 1; transform: translate(-50%, -100%) scale(1); }
  #say::after {
    content: ''; position: absolute; left: 50%; bottom: -7px;
    width: 10px; height: 10px; margin-left: -5px; transform: rotate(45deg);
    background: var(--surface);
    border-right: 2px solid var(--warn); border-bottom: 2px solid var(--warn);
  }
  #say.bad, #say.bad::after { border-color: #E0483A; }
  #say.warning, #say.warning::after { border-color: #D98324; }
  #say.good, #say.good::after { border-color: #2E9E5B; }
  @media (prefers-reduced-motion: reduce) {
    #say { transition: none; transform: translate(-50%, -100%); }
    #say.on { transform: translate(-50%, -100%); }
  }

  /* 머리 위 세션 타이머. 상호작용 안내와 같은 층에 있는 작은 칩입니다.
     캔버스에 그리면 월드 배율을 그대로 받아 사람보다 커집니다. */
  /* 남의 캐릭터(.mp-tag)와 **같은 모양**입니다 — 위에 이름/학교, 아래에
     시간. 내 것만 시간 하나였는데, 여럿이 모이면 이름 없는 캐릭터가
     하나 섞여 있어 그게 나인지 남인지 매번 확인해야 했습니다. */
  #headTimer {
    position: fixed; pointer-events: none; display: none;
    flex-direction: column; align-items: center; gap: 2px;
    transform: translate(-50%, -100%);
  }
  #headTimer.on { display: inline-flex; }
  #headTimer > span {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 7px 2px 5px; border-radius: 999px;
    background: #fff; color: var(--ink-1);
    font-size: 10.5px; font-weight: 700; line-height: 1;
    font-variant-numeric: tabular-nums; white-space: nowrap;
    box-shadow: 0 2px 5px rgba(78, 47, 38, .18), 0 0 0 1px rgba(78, 47, 38, .07);
  }
  /* 이름 줄. 내 것임을 청록 테두리로 표시합니다 — 색 하나로 "이게 나" 가
     되면 이름을 읽지 않아도 자기를 찾습니다. */
  #headWho {
    padding: 2px 7px; border-radius: 999px;
    background: #fff; color: var(--ink-1);
    font-size: 10.5px; font-weight: 700; line-height: 1; white-space: nowrap;
    text-decoration: none;
    box-shadow: 0 2px 5px rgba(78, 47, 38, .18), 0 0 0 1.5px var(--teal);
  }
  #headWho:empty { display: none; }
  #headTimer i {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--teal); flex: none;
  }

  #banner {
    position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%);
    text-align: center; pointer-events: none; opacity: 0;
  }
  #banner b {
    display: block; font-size: 44px; font-weight: 800;
    letter-spacing: -.035em; color: var(--ink);
    text-shadow: 0 2px 0 #FFF, 0 6px 26px rgba(255, 255, 255, .95);
  }
  #banner span {
    font-size: 12px; color: var(--teal-700);
    letter-spacing: .2em; font-weight: 700;
  }
  @keyframes bannerIn {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(.94); }
    16%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    70%  { opacity: 1; }
    100% { opacity: 0; }
  }
  #banner.play { animation: bannerIn 2.1s ease both; }

  /* ---------- 배치 모드 안내줄 ----------
     화면 위쪽입니다. 아래에는 세션 카드·채팅·코인이 이미 있고, 놓는
     자리를 보려면 방 아래쪽이 안 가려져야 합니다. */
  #decor-bar {
    position: fixed; left: 50%; top: 16px; transform: translate(-50%, -12px);
    display: none; align-items: center; gap: 10px;
    padding: 9px 15px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--line);
    box-shadow: var(--sh-lg); font-size: 12.5px;
    opacity: 0; transition: opacity .16s ease, transform .16s ease;
  }
  #decor-bar.on { display: flex; opacity: 1; transform: translate(-50%, 0); }
  #decor-bar b { font-weight: 800; }
  #decor-bar u {
    text-decoration: none; font-weight: 700; color: var(--teal-700);
  }
  #decor-bar.bad u { color: var(--bad); }
  #decor-bar em {
    font-style: normal; color: var(--ink-3); font-size: 11px;
    padding-left: 10px; border-left: 1px solid var(--line);
  }

  /* ---------- 가구 서랍 ----------
     동물의 숲 수납 서랍을 우리 격자로 옮긴 것입니다. 창(#panel)으로 안
     만든 이유 — 창은 방을 통째로 가리고 키를 가져갑니다. 서랍은 오른쪽
     끝에 붙어 있고 열려 있는 동안에도 방을 걸어 다닐 수 있어야
     "어디 놓을지 보면서 고르기" 가 됩니다.
     테두리 2px · 어긋난 그림자 · 모서리 3px 은 시안 A 의 문법입니다
     (design-drafts/palette.html). */
  #furn {
    position: fixed; right: 18px; top: 50%; z-index: 7;
    transform: translate(16px, -50%);
    width: 244px; max-height: min(600px, 84vh);
    display: none; flex-direction: column; overflow: hidden;
    background: var(--surface);
    border: 2px solid var(--teal-800); border-radius: 3px;
    box-shadow: 5px 5px 0 var(--teal-100), var(--sh-lg);
    opacity: 0; transition: opacity .14s ease, transform .14s ease;
  }
  #furn.on { display: flex; opacity: 1; transform: translate(0, -50%); }
  #furn > header {
    display: flex; align-items: center; gap: 8px; flex: none;
    padding: 7px 7px 6px 11px;
    background: var(--mint); border-bottom: 2px solid var(--teal-800);
  }
  /* 픽셀 글꼴은 짧은 이름표에만 씁니다. 문장까지 갈무리로 두면 두 줄만
     넘어가도 읽는 속도가 떨어집니다. */
  #furn > header b { font: 400 13px/1.4 'Galmuri11', monospace; color: var(--ink); }
  #furn > header button {
    margin-left: auto; width: 22px; height: 22px; padding: 0; flex: none;
    border: 2px solid var(--teal-800); border-radius: 2px;
    background: var(--surface); color: var(--ink);
    font: 400 12px/1 'Galmuri11', monospace; cursor: pointer;
  }
  /* 위 칸막이 — 동물의 숲은 여기에 가구 **종류** 아이콘이 섭니다. 우리는
     가구가 한 종류뿐이라 종류로 나눌 것이 없어서, 대신 지금 어디 있는지로
     나눕니다. 이 화면에서 실제로 궁금한 구분이 그것입니다. */
  #furn nav { display: flex; flex: none; border-bottom: 2px solid var(--teal-800); }
  #furn nav button {
    flex: 1; padding: 7px 2px 6px; border: 0; border-right: 1px solid var(--line-2);
    background: var(--surface-2); color: var(--ink-3); cursor: pointer;
    font: 400 11px/1.2 'Galmuri11', monospace;
  }
  #furn nav button:last-child { border-right: 0; }
  #furn nav button[aria-selected="true"] { background: var(--mint); color: var(--ink); }
  #furn .grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
    padding: 10px; overflow-y: auto; align-content: start;
  }
  #furn .cell {
    position: relative; aspect-ratio: 1; padding: 0;
    border: 2px solid var(--line-2); border-radius: 3px;
    background: var(--surface-2); cursor: grab; touch-action: none;
  }
  #furn .cell canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  #furn .cell:hover, #furn .cell:focus-visible {
    border-color: var(--mint); background: var(--teal-50); outline: none;
  }
  /* 놓여 있는 것은 모서리에 점 하나. 칸을 통째로 물들이면 정작 그림이
     안 보입니다. */
  #furn .cell.set::after {
    content: ''; position: absolute; right: 3px; top: 3px;
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--mint); border: 1px solid var(--teal-800);
  }
  #furn .cell.dragging { opacity: .3; }
  #furn .empty { grid-column: 1 / -1; padding: 20px 8px; color: var(--ink-3); font-size: 12px; text-align: center; }
  #furn > p {
    margin: 0; flex: none; padding: 8px 11px 9px;
    border-top: 2px solid var(--teal-800); background: var(--surface-2);
    color: var(--ink-3); font-size: 11px; line-height: 1.55;
  }
  /* 이름표 — 동물의 숲의 그 알약입니다. 칸 위에 떠서 칸을 안 가립니다. */
  #furn-pill {
    position: fixed; z-index: 8; display: none; pointer-events: none;
    padding: 4px 9px 3px;
    border: 2px solid var(--teal-800); border-radius: 999px;
    background: var(--mint); color: var(--ink);
    font: 400 11px/1.3 'Galmuri11', monospace; white-space: nowrap;
    box-shadow: 2px 2px 0 rgba(12, 90, 79, .32);
  }
  #furn-pill.on { display: block; }

  /* ---------- 집중 세션 ---------- */
  /* 세션 카드 자리. 기본은 오른쪽 아래인데, 앉아서 PIP 로 줄어들면
     오른쪽 **위**로 올라갑니다 — 아래쪽에는 세션 HUD·조작 안내·코인이
     이미 있어서, 줄어든 카드가 그 위에 겹칩니다. 위는 비어 있습니다.
     자리는 사람이 직접 바꿀 수도 있습니다(pip-move 버튼). */
  #session {
    position: fixed; right: 20px; bottom: 176px; width: 300px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-lg); padding: 15px; box-shadow: var(--sh-lg);
    transform: translateY(16px); opacity: 0; pointer-events: none;
    transition: opacity .22s ease, transform .22s ease;
  }
  #session.on { transform: none; opacity: 1; pointer-events: auto; }
  /* 서 있는 동안은 일어나기 버튼이 뜻이 없습니다 */
  #session #stand { display: none; }
  /* 앉으면 PIP — 카메라만 남기고 작아집니다. 세션 패널을 치우는 게
     아니라 줄이는 것입니다: 카메라가 도는 동안 화면 어딘가에는 내
     모습과 상태가 보여야 하고, 앉은 사람은 다른 탭으로 갑니다. */
  #session.pip { width: 178px; padding: 8px; }
  #session.pip h3, #session.pip p.sub, #session.pip .stats,
  #session.pip #calib { display: none; }
  /* PIP 에서는 상태 글자를 남깁니다 — 테두리 색만으로 상태를 말하면
     적록색약인 사람에게는 아무 말도 안 한 것과 같습니다(WCAG 1.4.1). */
  #session.pip .state { margin: 6px 0 0; font-size: 10.5px; text-align: center; }
  #session.pip #stand { display: block; margin-top: 6px; padding: 6px; font-size: 11px; }
  /* PIP 자리 — 위/아래.
     위로 갈 때 20px 에 두면 마이페이지 단추(top 18~56)를 덮습니다.
     그 아래에서 시작하고, 성능 패널은 PIP 높이만큼 더 내립니다. */
  #session.pip.up { top: 66px; bottom: auto; }
  #hud-perf { transition: top .22s ease; }
  body.pip-up #hud-perf { top: 282px; }

  /* 자세 테두리. 색은 아래 배지·글자와 **겹쳐서** 말합니다 —
     색 하나만으로 상태를 전하면 안 됩니다(WCAG 1.4.1 Use of Color). */
  #cam-wrap { transition: box-shadow .18s ease, border-color .18s ease; }
  #cam-wrap[data-posture="good"]    { border-color: #2E9E5B; box-shadow: 0 0 0 3px rgba(46,158,91,.28); }
  #cam-wrap[data-posture="warning"] { border-color: #D98324; box-shadow: 0 0 0 3px rgba(217,131,36,.30); }
  #cam-wrap[data-posture="bad"]     { border-color: #E0483A; box-shadow: 0 0 0 3px rgba(224,72,58,.30); }
  #cam-wrap[data-posture="idle"]    { border-color: var(--line); box-shadow: none; }
  /* 모서리 배지 — 모양이 상태마다 다릅니다. 같은 동그라미에 색만 바꾸면
     색을 못 가리는 사람에게는 셋이 전부 같은 그림입니다. */
  #cam-badge {
    position: absolute; left: 6px; top: 6px; z-index: 2;
    display: none; align-items: center; gap: 3px;
    padding: 2px 6px 2px 5px; border-radius: 999px;
    font-size: 10px; font-weight: 800; color: #fff; letter-spacing: -.01em;
    box-shadow: 0 1px 3px rgba(0,0,0,.25);
  }
  #cam-wrap[data-posture="good"]    #cam-badge { display: inline-flex; background: #2E9E5B; }
  #cam-wrap[data-posture="warning"] #cam-badge { display: inline-flex; background: #D98324; }
  #cam-wrap[data-posture="bad"]     #cam-badge { display: inline-flex; background: #E0483A; }

  /* ---------- 회의 모드 ----------
     알림만 끕니다. 판정·코인·축 누적은 그대로 돕니다.
     **꺼져 있다는 사실이 보여야 합니다.** 조용해진 것과 고장난 것을
     구별할 방법이 없으면, 회의가 끝나고도 켜는 걸 잊습니다. */
  #cam-wrap.quiet::after {
    /* 자세 배지 **바로 아래**. 아래쪽에 두면 얼굴 껐을 때 '얼굴 꺼짐'
       알약과 겹칩니다(PIP 가 160px 이라 가로로 피할 자리가 없습니다). */
    content: '🔇 알림 끔'; position: absolute; left: 6px; top: 26px; z-index: 2;
    padding: 2px 7px; border-radius: 999px;
    background: rgba(20,16,14,.72); color: #fff;
    font-size: 9.5px; font-weight: 700; letter-spacing: -.01em;
  }
  #session #cam-btns button[aria-pressed="true"] { background: var(--teal-600, #159); }
  /* 회의 요약 — 회의가 끝난 그 자리에서 한 번만. 회고 화면을 세션 도중에
     열게 하지 않으려고 카드로 둡니다. */
  #quiet-sum {
    margin: 8px 0 0; padding: 9px 11px; border-radius: 11px;
    background: var(--teal-50); border-left: 3px solid var(--teal);
    font-size: 11.5px; line-height: 1.65; color: var(--ink-2);
  }
  #quiet-sum b { color: var(--ink); }
  #quiet-sum button {
    display: block; margin: 7px 0 0; padding: 4px 10px; min-width: 0;
    border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
    font-size: 11px; cursor: pointer; box-shadow: none;
  }
  #quiet-sum button::before { content: none; }
  #session.pip #quiet-sum { font-size: 10.5px; padding: 7px 9px; }

  /* 얼굴을 끄면 이 자리에 내 캐릭터가 뜹니다. 빈 칸이나 사람 아이콘을
     두면 "카메라가 고장났나" 로 읽힙니다 — 내가 거기 있다는 표시가 필요합니다. */
  #cam-avatar {
    position: absolute; inset: 0; width: 100%; height: 100%;
    display: none; place-items: center; background: var(--surface-3);
    image-rendering: pixelated;
  }
  #cam-wrap.face-off #cam-avatar { display: grid; }
  /* 안내문도 같이 비킵니다 — 얼굴을 껐는데 "카메라를 여는 중" 이 캐릭터를
     덮고 있으면 껐다는 사실이 안 보입니다. */
  #cam-wrap.face-off #cam, #cam-wrap.face-off #cam-overlay,
  #cam-wrap.face-off #cam-msg { visibility: hidden; }
  #cam-avatar canvas { image-rendering: pixelated; }
  /* 캐릭터 위에 글자가 겹치지 않게 아래에 알약으로 깝니다. */
  #cam-avatar span {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 5px;
    padding: 1px 7px; border-radius: 999px; white-space: nowrap;
    background: rgba(255,255,255,.92); color: #5A4A44;
    font-size: 9.5px; font-weight: 700;
  }

  /* 작은 아이콘 단추 둘 — 얼굴 끄기 / 자리 옮기기 */
  #cam-btns { position: absolute; right: 6px; top: 6px; z-index: 2; display: flex; gap: 4px; }
  /* #session button 이 흰 알약 + ::before 장식을 덮어씌웁니다.
     같은 무게로는 못 이겨서 #session 을 앞에 붙여 이깁니다. */
  #session #cam-btns button {
    width: 26px; height: 26px; min-width: 0; padding: 0; margin: 0;
    border: 0; border-radius: 8px; box-shadow: none;
    background: rgba(20,16,14,.58); color: #fff; cursor: pointer;
    font-size: 13px; line-height: 1; display: grid; place-items: center;
  }
  #session #cam-btns button::before { content: none; }
  #session #cam-btns button:hover { background: rgba(20,16,14,.82); }
  #session #cam-btns button:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }
  #session h3 {
    margin: 0 0 2px; font-size: 14px; font-weight: 700;
    display: flex; align-items: center; gap: 8px; letter-spacing: -.01em;
  }
  #session h3 i {
    width: 8px; height: 8px; border-radius: 50%; flex: none;
    background: var(--ink-3);
  }
  #session h3 i.live { background: var(--good); box-shadow: 0 0 0 3px rgba(46,158,91,.16); }
  #session p.sub { margin: 0 0 12px; font-size: 11.5px; color: var(--ink-3); }
  #cam-wrap {
    position: relative; width: 100%; aspect-ratio: 4 / 3;
    background: var(--surface-3); border-radius: 11px; overflow: hidden;
    border: 1px solid var(--line); display: grid; place-items: center;
  }
  #cam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  #cam-overlay { position: absolute; inset: 0; width: 100%; height: 100%; transform: scaleX(-1); }
  #cam-msg {
    position: absolute; inset: 0; display: grid; place-items: center;
    padding: 16px; text-align: center; font-size: 11.5px; line-height: 1.65;
    color: var(--ink-2); background: var(--surface-3);
  }
  #session .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  #session .stat { background: var(--teal-50); border-radius: 10px; padding: 8px 10px; }
  #session .stat u {
    display: block; text-decoration: none; font-size: 10.5px;
    color: var(--ink-3); letter-spacing: .02em;
  }
  #session .stat b { font-size: 18px; font-weight: 800; }
  #session .state {
    margin: 10px 0 0; font-size: 12.5px; font-weight: 700; text-align: center;
    color: var(--ink-3);
  }
  #session button {
    margin-top: 12px; width: 100%; padding: 10px;
    background: var(--surface-3); border: 1px solid var(--line-2); border-radius: 9px;
    color: var(--ink-2); font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
    transition: background .16s ease, color .16s ease;
  }
  #session button:hover { background: var(--teal-100); color: var(--ink); }
  #session button:focus-visible { outline: 2px solid var(--teal-600); outline-offset: 2px; }

  /* ---------- NPC 대화 ---------- */
  #dialog {
    position: fixed; left: 50%; bottom: 26px;
    transform: translateX(-50%) translateY(14px);
    width: min(560px, calc(100vw - 48px));
    background: var(--surface); border: 1px solid var(--line);
    border-left: 3px solid var(--teal);
    border-radius: var(--r-lg); padding: 15px 18px;
    opacity: 0; pointer-events: none; box-shadow: var(--sh-lg);
    transition: opacity .18s ease, transform .18s ease;
  }
  #dialog.on { opacity: 1; transform: translateX(-50%); }
  #dialog b {
    display: block; font-size: 13px; color: var(--teal-700);
    margin-bottom: 3px; font-weight: 700;
  }
  #dialog p { margin: 0; font-size: 13.5px; line-height: 1.7; color: var(--ink); }
  #dialog small { display: block; margin-top: 9px; font-size: 11.5px; color: var(--ink-3); }

  /* ---------- 지도 · M ---------- */
  #minimap {
    position: fixed; inset: 0; z-index: 8;
    display: grid; place-items: center; padding: 24px;
    background: rgba(42, 35, 32, .34); backdrop-filter: blur(3px);
    opacity: 0; pointer-events: none; transition: opacity .18s ease;
  }
  #minimap.on { opacity: 1; pointer-events: auto; }
  #minimap .mini-box {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 18px; overflow: hidden; box-shadow: var(--sh-lg);
    transform: scale(.97); transition: transform .2s cubic-bezier(.2,.9,.3,1);
  }
  #minimap.on .mini-box { transform: none; }
  #minimap.on #minimap-spots .spot { pointer-events: auto; }
  #minimap header {
    display: flex; align-items: center; gap: 9px;
    padding: 13px 14px 12px; border-bottom: 1px solid var(--line);
    background: linear-gradient(var(--teal-50), var(--surface));
  }
  #minimap header b { font-size: 14px; font-weight: 800; letter-spacing: -.02em; }
  #minimap header u {
    text-decoration: none; font-size: 10px; color: var(--ink-3);
    letter-spacing: .1em; font-weight: 700;
  }
  #minimap header button {
    margin-left: auto; width: 26px; height: 26px; flex: none;
    background: var(--surface-3); border: 1px solid var(--line); border-radius: 8px;
    color: var(--ink-2); font: 600 15px/1 sans-serif; cursor: pointer;
  }
  #minimap header button:hover { background: var(--teal-100); color: var(--ink); }
  .mini-wrap { position: relative; padding: 12px; }
  #minimap-cv { display: block; border-radius: 10px; outline: 1px solid var(--line-2); }
  #minimap-spots { position: absolute; left: 12px; top: 12px; pointer-events: none; }
  /* **지도가 열렸을 때만** 눌립니다.
     pointer-events:none 은 부모에 걸어도 자식이 auto 로 스스로 되살립니다.
     그래서 닫힌 지도의 장소 버튼 아홉 개가 화면 한가운데에 투명하게 떠
     있었고, 그 자리는 마이페이지·미니게임 창이 뜨는 자리와 같습니다.
     창을 누른 것이 보이지 않는 "기숙사" 버튼에 맞아 순간이동했습니다.
     #minimap 과 #panel 이 둘 다 z-index 8 이라, DOM 뒤에 있는 지도가
     위로 쌓인 것이 겹친 이유입니다. */
  #minimap-spots .spot {
    position: absolute; transform: translate(-50%, -50%); pointer-events: none;
    display: flex; align-items: center; gap: 5px; white-space: nowrap;
    background: rgba(255,255,255,.94); border: 1px solid var(--line-2);
    border-radius: 999px; padding: 3px 7px 3px 6px; cursor: pointer;
    font: 700 10.5px/1.3 inherit; color: var(--ink);
    box-shadow: 0 2px 6px rgba(43,50,48,.22);
    transition: transform .12s ease, border-color .12s ease;
  }
  #minimap-spots .spot:hover {
    transform: translate(-50%, -50%) scale(1.07); border-color: var(--teal);
  }
  #minimap-spots .spot:focus-visible { outline: 2px solid var(--teal-600); outline-offset: 2px; }
  #minimap-spots .spot i {
    width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--teal);
  }
  #minimap-spots .spot kbd {
    background: var(--surface-3); border: 1px solid var(--line-2); border-radius: 4px;
    padding: 0 4px; font: 700 9.5px/1.5 ui-monospace, monospace; color: var(--ink-2);
  }

  /* ---------- 설정 버튼 · 미니룸에서만 ---------- */
  #gear {
    position: fixed; right: 20px; top: 18px; z-index: 6;
    display: none; align-items: center; gap: 7px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); padding: 9px 14px;
    color: var(--ink-2); font: inherit; font-size: 12.5px; font-weight: 600;
    cursor: pointer; box-shadow: var(--sh);
    transition: color .16s ease, border-color .16s ease, background .16s ease;
  }
  #gear.on { display: flex; }
  #gear:hover { color: var(--ink); background: var(--teal-50); border-color: var(--teal-200); }
  #gear:focus-visible { outline: 2px solid var(--teal-600); outline-offset: 3px; }
  #gear i {
    width: 15px; height: 15px; border-radius: 50%; flex: none;
    border: 2px solid var(--teal); position: relative;
  }
  #gear i::after {
    content: ''; position: absolute; inset: 3px;
    border-radius: 50%; background: var(--teal);
  }

  /* ---------- 창 ---------- */
  /* 지도(8)보다 위. 같은 층에 두면 어느 쪽이 위인지 DOM 순서가 정하고,
     그건 눈에 안 보이는 규칙입니다. */
  #panel {
    position: fixed; inset: 0; z-index: 10;
    display: grid; place-items: center; padding: 24px;
    background: rgba(42, 35, 32, .34);
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease;
    backdrop-filter: blur(3px);
  }
  #panel.on { opacity: 1; pointer-events: auto; }
  #panel .box {
    width: min(560px, 100%); max-height: min(78vh, 620px);
    display: flex; flex-direction: column;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 20px; overflow: hidden; box-shadow: var(--sh-lg);
    transform: scale(.96) translateY(10px);
    transition: transform .22s cubic-bezier(.2, .9, .3, 1);
  }
  #panel.on .box { transform: none; }
  #panel header {
    display: flex; align-items: center; gap: 9px;
    padding: 17px 18px 15px; border-bottom: 1px solid var(--line);
    background: linear-gradient(var(--teal-50), var(--surface));
  }
  #panel header b { font-size: 16px; font-weight: 800; letter-spacing: -.02em; }
  #panel header u {
    text-decoration: none; font-size: 10px; color: var(--teal-700);
    letter-spacing: .16em; font-weight: 700;
  }
  #panel header u:empty { display: none; }
  #panel header button {
    margin-left: auto; width: 30px; height: 30px; flex: none;
    background: var(--surface-3); border: 1px solid var(--line); border-radius: 9px;
    color: var(--ink-2); font: 600 16px/1 sans-serif; cursor: pointer;
    transition: background .16s ease, color .16s ease;
  }
  #panel header button:hover { background: var(--teal-100); color: var(--ink); }
  #panel header button:focus-visible { outline: 2px solid var(--teal-600); outline-offset: 2px; }
  #panel .body { padding: 17px 18px 22px; overflow-y: auto; }

  #panel .tabs { display: flex; gap: 4px; padding: 10px 14px 0; }
  #panel .tabs button {
    flex: 1; background: none; border: 0; border-bottom: 2px solid transparent;
    color: var(--ink-3); font: inherit; font-size: 13px; font-weight: 600;
    padding: 9px 4px 10px; cursor: pointer;
  }
  #panel .tabs button[aria-selected="true"] {
    color: var(--teal-700); border-bottom-color: var(--teal);
  }
  #panel .tabs button:focus-visible { outline: 2px solid var(--teal-600); outline-offset: -3px; border-radius: 7px; }

  /* ---------- 상점만 왼쪽 세로 막대 ----------
     탭 기계는 그대로 두고 **자리만** 바꿉니다. 탭을 만들고 고르고
     openPanel(key, tab) 로 특정 탭을 여는 코드는 회고·마이페이지가 같이
     쓰므로, 거기 손을 대면 세 창이 한꺼번에 위험해집니다. 그래서
     openPanel 이 남기는 data-panel 하나만 보고 CSS 로 갈라냅니다 —
     JS 쪽에 상점 전용 분기가 없습니다.

     상자를 격자로 바꿉니다. 머리글이 두 칸을 걸치고, 아래 왼쪽이 탭,
     오른쪽이 본문입니다. */
  #panel[data-panel^="shop"] .box {
    width: min(880px, 100%);
    display: grid;
    grid-template-columns: 124px minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
  }
  #panel[data-panel^="shop"] header { grid-column: 1 / -1; }
  #panel[data-panel^="shop"] .tabs {
    grid-column: 1; grid-row: 2;
    flex-direction: column; gap: 1px;
    padding: 11px 0 14px; align-content: start;
    border-right: 1px solid var(--line);
    background: var(--surface-2); overflow-y: auto;
  }
  #panel[data-panel^="shop"] .tabs button {
    flex: none; text-align: left;
    padding: 11px 12px 11px 14px;
    border-bottom: 0; border-left: 3px solid transparent;
  }
  #panel[data-panel^="shop"] .tabs button:hover { color: var(--ink-2); }
  #panel[data-panel^="shop"] .tabs button[aria-selected="true"] {
    border-bottom-color: transparent; border-left-color: var(--teal);
    background: var(--surface); color: var(--teal-700);
  }
  #panel[data-panel^="shop"] .body { grid-column: 2; grid-row: 2; }
  /* 좁은 화면에서는 막대가 방해가 됩니다 — 위 탭으로 되돌립니다 */
  @media (max-width: 700px) {
    #panel[data-panel^="shop"] .box {
      display: flex; flex-direction: column; width: min(560px, 100%);
    }
    #panel[data-panel^="shop"] .tabs {
      flex-direction: row; gap: 4px; padding: 10px 14px 0;
      border-right: 0; background: none;
      /* 세로 막대일 때 넘치면 스크롤하라고 준 overflow 를 여기서 되돌립니다.
         가로 줄에서 스크롤 컨테이너가 되면 min-height 가 0 으로 풀려
         탭 줄이 20px 로 찌그러지고 글자가 잘립니다. */
      overflow: visible; flex: none;
    }
    #panel[data-panel^="shop"] .tabs button {
      flex: 1; text-align: center; padding: 9px 4px 10px;
      border-left: 0; border-bottom: 2px solid transparent;
    }
    #panel[data-panel^="shop"] .tabs button[aria-selected="true"] {
      border-bottom-color: var(--teal); background: none;
    }
  }

  /* ---------- 미니게임만 큰 상자 ----------
     560px 는 **읽는 창**의 너비입니다. 한 줄에 40자쯤 들어가라고 정한
     값이고, 안내·설정·회고는 그 폭이 맞습니다. 그런데 게임까지 같은
     상자에 넣으니 1280px 화면에서 480px 짜리 판이 화면 폭의 37% 만
     쓰고 있었습니다 — 낚시 찌도, 레인 여섯 줄도, 책등 다섯 권도 전부
     휴대폰 한 칸에 들어가 있었습니다.

     그래서 **게임 창만** 넓힙니다. 상점이 이미 [data-panel^="shop"] 로
     제 폭을 갖고 있으므로 같은 방식인데, 이름을 CSS 에 일곱 개 적으면
     그 순간 목록이 둘이 됩니다(이 파일이 MINIGAMES 하나로 모아 둔 이유
     그대로). openPanel 이 표를 보고 data-game 을 남기고, 여기서는 그
     한 글자만 봅니다.

     940px 은 재어서 고른 값입니다. 1280px 창에서 바깥 여백 24px 씩을
     빼면 1232px 이 남는데, 그걸 다 쓰면 창이 아니라 페이지가 됩니다.
     940px 이면 본문 폭이 892px — 이 안에 880px 짜리 판이 1:1 로 들어갑니다.
     높이는 92vh 로 올렸습니다. 78vh(=561px @720)에서는 판 위의 숫자 줄과
     아래 안내가 같이 안 보여서, 게임 중에 창을 스크롤해야 했습니다.

     좁은 창은 min() 이 알아서 100% 로 접습니다 — 880px 창에서 상자는
     832px, 본문 784px 이고 판은 CSS 로 그만큼 줄어듭니다(fitGameCanvas 가
     실제 픽셀 수를 다시 맞추므로 글자는 안 뭉갭니다). */
  #panel[data-game] .box {
    width: min(940px, 100%);
    max-height: min(92vh, 880px);
  }
  /* 판이 넓어진 만큼 좌우 여백도 같이 늘립니다 — 18px 그대로 두면
     892px 짜리 본문에서 글줄이 벽에 붙습니다. */
  #panel[data-game] .body { padding: 16px 22px 22px; }
  /* 게임 안의 글줄만 좁게 잡습니다. 설명 문장이 892px 을 꽉 채우면
     한 줄에 60자가 넘어가 눈이 줄을 놓칩니다(본문 폭 규칙과 같은 이유).
     ch 로 안 씁니다 — ch 는 '0' 한 글자 너비(13.5px 기준 약 7.5px)라
     62ch 가 한글로는 34자밖에 안 됩니다. 실제로 62ch 로 두었더니 책
     정리 설명이 "…순서예 / 요." 로 끊겼습니다. 한글 40~45자에 해당하는
     640px 로 못박습니다. */
  #panel[data-game] .body > p { max-width: 640px; }
  /* 판 위 숫자 줄. 좁은 창에서는 세로로 쌓이던 것을 가로 칸으로 폅니다 —
     넓은 창에서 세로로 쌓으면 눈이 판에서 멀어집니다. */
  #panel[data-game] .rows {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 0 14px;
  }
  #panel[data-game] .row { border-bottom: 0; padding: 8px 2px; }

  #panel h4 {
    margin: 0 0 9px; font-size: 11px; font-weight: 700;
    letter-spacing: .1em; color: var(--ink-3);
  }
  #panel p { margin: 0 0 12px; font-size: 13.5px; line-height: 1.78; color: var(--ink-2); }
  #panel p b { color: var(--ink); font-weight: 700; }
  #panel p:last-child { margin-bottom: 0; }
  #panel .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
  #panel .stat { background: var(--teal-50); border-radius: 12px; padding: 11px 13px; }
  #panel .stat u { display: block; text-decoration: none; font-size: 10.5px; color: var(--ink-3); }
  #panel .stat b {
    display: block; margin-top: 2px; font-size: 21px; font-weight: 800;
    color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -.02em;
  }
  #panel ol { margin: 0; padding-left: 0; list-style: none; counter-reset: s; }
  #panel ol li {
    counter-increment: s; position: relative; padding-left: 31px;
    margin-bottom: 12px; font-size: 13.5px; line-height: 1.72; color: var(--ink-2);
  }
  #panel ol li b { color: var(--ink); }
  #panel ol li::before {
    content: counter(s); position: absolute; left: 0; top: 1px;
    width: 21px; height: 21px; border-radius: 7px;
    background: var(--teal); color: var(--on-teal);
    display: grid; place-items: center; font-size: 11px; font-weight: 800;
  }
  #panel .rows { display: flex; flex-direction: column; }
  #panel .row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 2px; border-bottom: 1px solid var(--line);
  }
  #panel .row:last-child { border-bottom: 0; }
  #panel .row span { font-size: 13.5px; font-weight: 600; }
  #panel .row em {
    font-style: normal; font-size: 11.5px; color: var(--ink-3);
    display: block; margin-top: 1px; font-weight: 400;
  }
  #panel .row .val {
    margin-left: auto; color: var(--ink-2); font-size: 13px; font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- 상점 ----------
     개더의 아바타 편집과 같은 순서입니다 — **부위 막대 · 격자 · 색 ·
     미리보기**. 부위 막대는 상자 왼쪽(위 .tabs 규칙)이고, 여기는 본문
     안 셋입니다.

     세로 목록이던 것을 격자로 바꾼 이유: 한 칸이 가로로 길어서 그림이
     32px 밖에 안 되고 이름만 크게 보였습니다. 사는 것은 그림인데
     그림이 제일 작았습니다. 색을 격자와 미리보기 사이에 세운 이유:
     "고른다 -> 색을 고른다 -> 입은 모습을 본다" 가 손이 가는 순서입니다.
     좁은 창에서는 위아래로 접힙니다. */
  #panel .shop { display: grid; grid-template-columns: minmax(0, 1fr) 62px 168px; gap: 14px; align-items: start; }
  /* 알·가구 칸은 고를 색이 없습니다. 빈 칸을 남기면 격자가 그만큼 좁아집니다 */
  #panel .shop.nopal { grid-template-columns: minmax(0, 1fr) 168px; }
  @media (max-width: 700px) {
    #panel .shop, #panel .shop.nopal { grid-template-columns: 1fr; }
    #panel .shop-prev { order: 1; } #panel .shop .pal { order: 2; } #panel .shop-list { order: 3; }
  }
  #panel .shop-prev {
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px 12px; align-self: start;
  }
  /* 종이 인형 — 마네킹 위에 산 옷을 실제로 겹쳐 그린 캔버스입니다.
     확대해도 픽셀이 뭉개지면 안 되므로 pixelated 를 씁니다. */
  #panel .doll {
    display: block; margin: 0 auto 10px;
    image-rendering: pixelated;
    background: var(--surface-3); border-radius: 10px;
  }
  #panel .shop-prev .who { text-align: center; margin-bottom: 10px; }
  #panel .shop-prev .who b { display: block; font-size: 13.5px; font-weight: 700; }
  #panel .shop-prev .who em { font-style: normal; font-size: 11.5px; color: var(--ink-3); }
  #panel .lays { display: flex; flex-direction: column; gap: 5px; }
  #panel .lay { display: flex; align-items: center; gap: 7px; font-size: 11.5px; }
  #panel .lay i {
    width: 12px; height: 12px; border-radius: 3px; flex: none;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.14);
  }
  #panel .lay span { color: var(--ink-3); }
  #panel .lay em { font-style: normal; margin-left: auto; color: var(--ink-2); font-weight: 600; }
  #panel .shop-prev .hint { margin-top: 10px; font-size: 10.5px; line-height: 1.5; }
  /* 색 팔레트 — 격자와 미리보기 사이 세로 줄. 누르면 오른쪽 종이 인형이
     그 자리에서 바뀝니다. 두 줄로 세우는 이유: 한 줄이면 색 아홉이
     세로로 300px 을 먹어 미리보기보다 길어집니다. */
  #panel .pal b { display: block; font-size: 11px; font-weight: 700; margin-bottom: 7px; }
  #panel .pal .hint { margin-top: 0; color: var(--ink-3); font-size: 10.5px; line-height: 1.45; }
  /* auto-fill — 62px 세로 줄에서는 두 칸, 좁은 화면에서 아래로 접히면
     한 줄로 펴집니다. 고정 칸 수로 두면 접혔을 때 색동그라미가
     화면 폭만큼 커집니다(실측 522px). */
  #panel .sws { display: grid; grid-template-columns: repeat(auto-fill, minmax(24px, 1fr)); gap: 5px; max-width: 268px; }
  #panel .sw {
    aspect-ratio: 1; border-radius: 50%; cursor: pointer; padding: 0;
    background: var(--sw, var(--surface-3));
    border: 1px solid rgba(0,0,0,.22);
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.12);
  }
  /* 원래 색 칸은 색이 없으므로 사선으로 '비었음'을 표시합니다 */
  #panel .sw[data-hex=""] {
    background: repeating-linear-gradient(45deg, var(--surface-3) 0 3px, var(--surface) 3px 6px);
  }
  #panel .sw.on { outline: 2px solid var(--ink); outline-offset: 2px; }
  #panel .sw:focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }

  #panel .shop-coin {
    font-size: 11.5px; color: var(--ink-3); text-align: right; margin-bottom: 8px;
  }
  #panel .shop-coin b { color: var(--ink); font-size: 13px; font-variant-numeric: tabular-nums; }
  /* 바깥 서비스 화면 한 칸. 높이를 고정하는 이유: 안이 교차 출처라
     내용에 맞춰 늘릴 수가 없고, 안 정하면 0px 로 접힙니다.
     380px 은 스포티파이 플레이리스트와 캘린더 안건 목록이 둘 다
     한눈에 들어오는 높이입니다. */
  #panel .embed {
    position: relative; margin: 10px 0 6px; height: 380px;
    border-radius: 12px; overflow: hidden;
    background: var(--surface-3); border: 1px solid var(--line-2);
  }
  #panel .embed iframe { position: relative; z-index: 1; width: 100%; height: 100%; border: 0; }
  /* 안내는 화면 **뒤에** 깔립니다. 앞에 두면 다 뜬 뒤에도 글자가 얹혀 있고,
     뒤에 두면 화면이 뜨는 순간 자연히 가려집니다. */
  #panel .embed-wait {
    position: absolute; inset: 0; z-index: 0; margin: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 0 24px; text-align: center; line-height: 1.5;
    font-size: 12px; color: var(--ink-3);
  }
  #panel .embed-wait.bad { color: var(--ink-2); }
  /* 못 불러왔으면 380px 짜리 회색 판을 남길 이유가 없습니다 — 한 줄이면
     한 줄만큼입니다. 큰 판에 글자 한 줄이 떠 있으면 아직 뭔가 오는
     중처럼 보입니다. */
  #panel .embed.dead { height: auto; }
  #panel .embed.dead .embed-wait { position: static; padding: 18px 20px; }
  /* 못 산 이유 · 못 보낸 저장. 색만으로 말하지 않도록 글로 씁니다 —
     안 뜨는 것이 정상이고, 뜨면 무엇이 안 됐는지가 그대로 적혀 있습니다. */
  #panel .shop-state {
    margin: 0 0 8px; padding: 7px 10px; border-radius: 9px;
    background: var(--surface-3); border: 1px solid var(--line-2);
    font-size: 11.5px; line-height: 1.45; color: var(--ink-2);
  }
  /* auto-fill + minmax — 패널 폭이 줄면 칸 수가 알아서 줄어듭니다.
     고정 칸 수로 두면 좁은 화면에서 그림이 뭉개집니다. */
  #panel .shop-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px;
    align-items: stretch;
  }
  #panel .item {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 10px 8px 9px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface); position: relative;
  }
  #panel .item.on { border-color: var(--school, var(--coral)); background: var(--school-soft, var(--coral-50)); }
  /* 격자 그림 — 세로 48 을 2배로 키웁니다. 이게 이번 개편의 요점입니다. */
  #panel .item > .thumb {
    width: 64px; height: 96px; flex: none;
    image-rendering: pixelated;
    background: var(--surface-2); border-radius: 9px;
  }
  /* 가구 칸 — 종이인형이 아니라 물건 한 장이라 네모입니다 */
  #panel .item > .thumb.furn { width: 64px; height: 64px; }
  #panel .item > span { font-size: 12.5px; font-weight: 600; text-align: center; line-height: 1.35; }
  #panel .item > span em {
    display: block; font-style: normal; font-size: 10.5px; color: var(--ink-3); font-weight: 400;
  }
  /* '보유' 는 칸 모서리 딱지로. 줄로 두면 이름을 아래로 밀어 칸 높이가 제각각이 됩니다. */
  #panel .item > u {
    position: absolute; top: 6px; right: 7px; text-decoration: none;
    font-size: 10px; color: var(--ink-3); background: var(--surface-2);
    padding: 1px 5px; border-radius: 999px;
  }
  /* 단추를 칸 바닥에 붙입니다. 설명 줄이 있는 것과 없는 것이 섞여 있어
     그냥 두면 같은 줄인데도 단추 높이가 제각각이 됩니다. */
  #panel .item .act { width: 100%; min-width: 0; text-align: center; margin: auto 0 0; }
  #panel .item .act[disabled] { opacity: .4; cursor: not-allowed; }

  /* ---------- 명예의 전당 ---------- */
  #panel .ranks { display: flex; flex-direction: column; }
  #panel .rank {
    display: flex; align-items: center; gap: 9px;
    padding: 9px 6px; border-bottom: 1px solid var(--line);
  }
  #panel .rank.me { background: var(--school-soft, var(--coral-50)); border-radius: 9px; }
  #panel .rank u {
    text-decoration: none; width: 20px; flex: none; text-align: center;
    font-size: 12px; font-weight: 800; color: var(--ink-3); font-variant-numeric: tabular-nums;
  }
  #panel .rank:nth-child(1) u { color: #B8860B; }
  #panel .rank i {
    width: 10px; height: 18px; border-radius: 3px; flex: none;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.16);
  }
  #panel .rank span { font-size: 13px; font-weight: 600; flex: 1; min-width: 0; }
  #panel .rank span em {
    font-style: normal; font-size: 10.5px; color: var(--school, var(--ink-3)); font-weight: 700;
  }
  /* 학교 이름 아래 작은 줄 — 총 시간과 회복 횟수. 점수(인당 분)만 남기면
     "우리가 실제로 얼마나 했나" 를 볼 자리가 없어집니다. */
  #panel .rank span small {
    display: block; margin-top: 2px; font-size: 10.5px; font-weight: 500;
    color: var(--ink-3); font-variant-numeric: tabular-nums;
  }
  #panel .rank b {
    font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right;
    min-width: 62px;
  }
  #panel .rank b.sub { color: var(--ink-3); font-weight: 600; min-width: 62px; }
  #panel .rank b small { font-size: 10px; color: var(--ink-3); font-weight: 400; margin-left: 3px; }

  /* 역대 1위 — 액자 셋이 나란히 */
  #panel .frames { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
  #panel .frame {
    border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 9px 11px;
    background: var(--surface-2); text-align: center;
    box-shadow: inset 0 0 0 3px var(--surface);
  }
  #panel .frame .plate {
    display: inline-block; border-radius: 999px; padding: 2px 9px; margin-bottom: 7px;
    font-size: 10px; font-weight: 800; letter-spacing: .06em;
  }
  #panel .frame b { display: block; font-size: 12px; font-weight: 700; }
  #panel .frame em {
    font-style: normal; font-size: 10.5px; color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }

  /* ---- 지난 세션 ----
     업라이트 결과 화면의 판을 줄여 옮겼습니다. 한 세션이 **한 줄**입니다 —
     카드로 키우면 열 세션에 화면이 세 배가 되고, 그러면 "지난 흐름" 이
     아니라 "긴 목록" 이 됩니다. */
  #panel .wk {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
    align-items: end; height: 64px; margin-bottom: 6px;
  }
  /* 칸 너비를 그대로 쓰면 막대가 아니라 벽돌이 됩니다 — 높이 차이가
     너비에 묻혀 이레의 모양이 안 읽힙니다. 칸 가운데에 좁게 세웁니다. */
  #panel .wk i {
    display: block; width: 26px; margin: 0 auto; min-height: 3px;
    border-radius: 5px 5px 3px 3px; background: var(--teal-200);
  }
  #panel .wk i.now  { background: var(--teal); }
  #panel .wk i.zero { background: var(--surface-3); }
  #panel .wkx {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
    margin-bottom: 18px; text-align: center;
    font-size: 10.5px; color: var(--ink-3); font-variant-numeric: tabular-nums;
  }
  #panel .wkx b { font-weight: 700; color: var(--teal-700); }

  #panel .sess { padding: 13px 2px; border-bottom: 1px solid var(--line); }
  #panel .sess:last-child { border-bottom: 0; }
  #panel .sess .top { display: flex; align-items: baseline; gap: 7px; }
  #panel .sess .top b { font-size: 13.5px; font-weight: 700; color: var(--ink); }
  #panel .sess .top em { font-style: normal; font-size: 11.5px; color: var(--ink-3); }
  #panel .sess .top .val {
    margin-left: auto; font-size: 13px; font-weight: 700; color: var(--ink-2);
    font-variant-numeric: tabular-nums;
  }
  /* 자세 띠 — 좋음·주의·굽음을 시간 비율 그대로 늘어놓습니다. 숫자 셋을
     나란히 적는 것보다 한 눈에 읽히고, 세로로 겹치면 세션마다 세 줄이
     됩니다. 색은 말풍선·판정 표시와 같은 값입니다. */
  #panel .bar {
    display: flex; height: 6px; margin: 9px 0 7px;
    background: var(--surface-3); border-radius: 3px; overflow: hidden;
  }
  #panel .bar i { display: block; height: 100%; }
  #panel .sess .sub {
    font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums;
  }
  /* 띠가 없는 세션 — 바로 붙으면 두 줄이 한 덩어리로 보입니다 */
  #panel .sess .top + .sub { margin-top: 7px; }
  #panel .sess .sub b { font-weight: 700; color: var(--ink-2); }
  /* 누를 수 있는 행 — 업라이트 마이페이지의 setrow 를 그대로 옮겼습니다.
     값 옆에 꺾쇠가 있어야 "눌러서 바꾸는 것" 으로 읽힙니다. */
  #panel .row.tap {
    cursor: pointer; border-radius: 10px; margin: 0 -8px; padding-left: 8px; padding-right: 8px;
    transition: background .14s ease;
  }
  #panel .row.tap:hover { background: var(--teal-50); }
  #panel .row.tap:focus-visible { outline: 2px solid var(--teal-600); outline-offset: -2px; }
  #panel .row .chev { margin-left: 6px; color: var(--ink-3); flex: none; }
  #panel .edit {
    display: flex; gap: 8px; align-items: center; padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  #panel .edit input {
    flex: 1; min-width: 0; padding: 10px 12px;
    background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 9px;
    color: var(--ink); font: inherit; font-size: 13.5px;
  }
  #panel .edit input:focus { outline: 2px solid var(--teal-600); outline-offset: 1px; }
  #panel .hint { margin: 8px 0 0; font-size: 11.5px; color: var(--ink-3); }

  #panel .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 15px; }
  /* 음량 손잡이. 칩 두 개로 "크게/작게" 를 만들 수도 있었지만, 편한 음량은
     쓰는 방(이어폰이냐 노트북 스피커냐)마다 달라서 두 칸으로는 못 맞춥니다.
     행 오른쪽에 끼우지 않고 아래 한 줄을 통째로 쓰는 것은, 좁은 창에서
     손잡이가 40px 로 쪼그라들면 5% 단위를 손가락으로 못 짚기 때문입니다. */
  #panel .slider {
    width: 100%; margin: 2px 0 10px; accent-color: var(--teal);
    height: 22px; cursor: pointer;
  }
  #panel .slider:focus-visible { outline: 2px solid var(--teal-600); outline-offset: 2px; }
  /* 행 안에 들어간 칩 묶음 — 오른쪽 끝에 붙습니다. 아래에 따로 두면
     설정 하나에 두 줄이 들고, 설정이 넷이면 페이지가 여덟 줄이 됩니다.
     표준적인 설정 화면은 이름 왼쪽 · 값 오른쪽 한 줄입니다. */
  #panel .row .chips { margin: 0 0 0 auto; flex-wrap: nowrap; flex: none; }
  #panel .row .chip { padding: 5px 12px; font-size: 12px; }
  #panel .chip {
    background: var(--surface-2); border: 1px solid var(--line-2);
    border-radius: 999px; padding: 8px 14px;
    color: var(--ink-2); font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
    transition: background .14s ease, border-color .14s ease, color .14s ease;
  }
  #panel .chip:hover { border-color: var(--teal-300); }
  #panel .chip[aria-pressed="true"] {
    background: var(--teal); border-color: var(--teal-600); color: var(--on-teal);
  }
  #panel .chip:focus-visible { outline: 2px solid var(--teal-600); outline-offset: 2px; }
  #panel .code {
    display: flex; align-items: center; gap: 10px;
    background: var(--teal-50); border: 1px dashed var(--teal-300);
    border-radius: 14px; padding: 15px 17px; margin-bottom: 14px;
  }
  #panel .code b {
    font: 800 23px/1 ui-monospace, 'Consolas', monospace;
    letter-spacing: .18em; color: var(--teal-700);
  }
  #panel .act {
    margin-left: auto; background: var(--teal); border: 1px solid var(--teal-600);
    border-radius: 9px; color: var(--on-teal);
    font: inherit; font-size: 12.5px; font-weight: 700;
    padding: 9px 15px; cursor: pointer;
    transition: filter .14s ease;
  }
  #panel .act:hover { filter: brightness(1.04); }
  #panel .act.ghost {
    background: var(--surface); border-color: var(--line-2); color: var(--ink-2);
  }
  #panel .act.ghost:hover { background: var(--teal-50); color: var(--ink); }
  #panel .act:focus-visible { outline: 2px solid var(--teal-600); outline-offset: 2px; }
  #panel .note {
    margin-top: 15px; padding: 12px 14px; border-radius: 12px;
    background: var(--teal-50); border-left: 3px solid var(--teal);
    font-size: 12.5px; line-height: 1.72; color: var(--ink-2);
  }
  #panel .bar {
    height: 8px; border-radius: 999px; background: var(--surface-3);
    overflow: hidden; margin-top: 8px;
  }
  #panel .bar i { display: block; height: 100%; background: var(--teal); border-radius: 999px; }

  /* ---- 축별 스트레칭 처방 ---- */
  #panel .rx {
    margin-top: 10px; padding: 13px 15px; border-radius: 13px;
    background: var(--surface-2); border: 1px solid var(--line-2);
  }
  #panel .rx-h { display: flex; align-items: baseline; gap: 8px; }
  #panel .rx-h b { font-size: 14px; }
  /* 이탈 시간은 **근거**입니다. 처방만 있고 근거가 없으면 지어낸 말로 읽힙니다. */
  #panel .rx-h u {
    margin-left: auto; text-decoration: none; font-size: 11.5px;
    color: var(--ink-3); font-variant-numeric: tabular-nums;
  }
  #panel .rx p { margin: 6px 0 0; font-size: 12.5px; color: var(--ink-2); line-height: 1.6; }
  #panel .rx ol { margin: 8px 0 0; padding-left: 19px; font-size: 12.5px; line-height: 1.78; }
  #panel .rx ol li::marker { color: var(--ink-3); }

  /* ---- 자세 나이 계기판 ---- */
  #panel .gauge { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-top: 8px; }
  #panel .gauge svg { flex: none; }

  /* 세션 표시 — 좌측 하단. 지금 세션이 돌고 있다는 사실과 얼마나
     됐는지가 늘 보여야 합니다. 종료 버튼을 옆에 두는 이유는, 회고를
     보려면 반드시 여기를 눌러야 하기 때문입니다. */
  #hud-session {
    right: 20px; bottom: 20px; z-index: 6; pointer-events: auto;
    display: flex; align-items: center; gap: 9px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 999px; padding: 7px 8px 7px 14px; box-shadow: var(--sh);
  }
  #hud-session .dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--teal);
    box-shadow: 0 0 0 3px rgba(255,107,82,.20);
    animation: sessPulse 2.4s ease-in-out infinite;
  }
  @keyframes sessPulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
  #hud-session b { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
  /* 촬영 고지 — 걷는 동안 화면에 남는 유일한 상시 표시입니다.
     웹캠 미리보기를 숨긴 사람에게는 이 글자가 전부입니다. */
  #cam-live { font-size: 11px; font-weight: 600; color: var(--ink-3); }
  #cam-live.live { color: var(--teal-700); }
  #hud-session button {
    background: var(--surface-3); border: 1px solid var(--line-2); border-radius: 999px;
    color: var(--ink-2); font: inherit; font-size: 12px; font-weight: 600;
    padding: 6px 13px; cursor: pointer;
    transition: background .14s ease, color .14s ease;
  }
  #hud-session button:hover { background: var(--teal); color: var(--on-teal); }
  #hud-session button:focus-visible { outline: 2px solid var(--teal-600); outline-offset: 2px; }
  #hud-session.done .dot { background: var(--ink-3); animation: none; box-shadow: none; }

  /* 코인 — 우측 하단. Lucide "coins" 아이콘(ISC).
     재화는 항상 보여야 합니다. 마이페이지를 열어야만 알 수 있으면
     "얼마나 모았나"가 동기가 되지 못합니다. */
  /* 세션 알약(높이 40) 위. 아래에서부터 20 + 40 + 12 = 72 */
  #coin {
    position: fixed; right: 20px; bottom: 72px; z-index: 6;
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 999px; padding: 9px 16px 9px 12px;
    color: var(--ink); font: inherit; font-size: 14px; font-weight: 700;
    cursor: pointer; box-shadow: var(--sh);
    transition: transform .16s ease, border-color .16s ease;
  }
  #coin:hover { border-color: #E8B93A; transform: translateY(-1px); }
  #coin:focus-visible { outline: 2px solid var(--teal-600); outline-offset: 3px; }
  #coin svg { width: 19px; height: 19px; flex: none; color: #E0A21E; }
  #coin b { font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  /* 지급 사유 칩 — 코인 버튼 위에 잠깐. 숫자만 튕기면 "왜 늘었는지" 를
     모릅니다. 사유가 보여야 행동과 보상이 이어집니다. */
  /* 코인 알약(높이 41) 위. 72 + 41 + 8 = 121.
     칩은 잠깐 떴다 사라지지만 자리는 늘 비워 둡니다 — 뜰 때마다 위엣것을
     밀어 올리면 그게 더 어지럽습니다. */
  #coinNote {
    position: fixed; right: 20px; bottom: 121px; z-index: 6;
    padding: 5px 11px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--line-2);
    font-size: 12px; font-weight: 700; color: var(--teal-700);
    opacity: 0; transform: translateY(4px); pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
    box-shadow: var(--sh);
  }
  #coinNote.on { opacity: 1; transform: none; }
  @keyframes coinPop { 0%,100% { transform: scale(1); } 40% { transform: scale(1.18); } }
  #coin.pop svg { animation: coinPop .42s ease; }

  #boot {
    position: fixed; inset: 0; z-index: 9; display: grid; place-items: center;
    background: var(--surface-2); font-size: 13px; color: var(--ink-3);
    transition: opacity .4s ease;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
  /* ==================================================================
     손그림 UI

     온보딩과 **같은 필터**입니다. 알을 깨고 들어온 사람이 같은 손이
     그린 화면을 봐야 합니다.

     여기 걸리는 것은 DOM UI 뿐입니다. 월드 그림은 캔버스라 이 필터가
     안 닿고, 닿아서도 안 됩니다 - 16px 픽셀 그림을 난류로 밀면
     격자가 무너집니다.

     채움과 테두리만 밀고 글자는 안 밉니다. 그래서 필터는 요소가 아니라
     요소 뒤에 깔린 판(::before)에 걸립니다. */
  #gear, #prompt, #session button, #hud-session button, #panel header button {
    position: relative; isolation: isolate;
    background: transparent; border: 0;
  }
  #gear::before, #prompt::before, #session button::before,
  #hud-session button::before, #panel header button::before {
    content: ''; position: absolute; inset: -1px; z-index: -1;
    border-radius: inherit;
    background: var(--surface); border: 2px solid var(--ink);
    filter: url(#wobble-sm);
    transition: background .16s ease;
  }
  /* 바로 위 규칙의 position: relative 가 이 둘의 fixed 를 덮었습니다 —
     마이페이지 버튼이 문서 흐름의 왼쪽 위로 흘러 화면 밖으로 잘리고,
     앉기 안내 칩이 머리 위가 아니라 엉뚱한 자리에 떴습니다. 판(::before)
     은 fixed 요소에도 똑같이 붙으므로 고정을 되살립니다. */
  #gear, #prompt { position: fixed; }
  #prompt::before { background: var(--teal); }
  #hud-session button:hover::before { background: var(--teal); }
  #session button:hover::before, #panel header button:hover::before { background: var(--teal-100); }

  /* 누르면 종이에 붙습니다. 온보딩 버튼과 같은 움직임입니다. */
  #gear, #session button, #hud-session button, #panel header button {
    filter: drop-shadow(2px 3px 0 rgba(43, 50, 48, .12));
    transition: transform 90ms ease, filter 90ms ease, color .16s ease;
  }
  #gear:active, #session button:active,
  #hud-session button:active, #panel header button:active {
    transform: translate(1px, 2px);
    filter: drop-shadow(1px 1px 0 rgba(43, 50, 48, .12));
  }
</style>

<!-- 온보딩과 같은 손. Frequency -> baseFrequency, Wiggle -> scale. -->
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <filter id="wobble" x="-12%" y="-14%" width="124%" height="128%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="wobble-sm" x="-16%" y="-18%" width="132%" height="136%">
    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="3" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

/* ==================================================================
   건물 픽셀 그리기

   Kenney 타일로는 돔도 첨탑도 만들 수 없습니다. 시트에 없는 형태라
   조합으로는 안 나옵니다. 그래서 건물은 **한 장씩 직접 그립니다** —
