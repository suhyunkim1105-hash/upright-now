addEventListener('keyup', (e) => keys.delete(controlKey(e.key)));
addEventListener('blur', () => keys.clear());
/* 탭을 닫거나 다른 곳으로 가면 마지막으로 한 번 더 남깁니다.
   pagehide 는 모바일에서 unload 대신 도는 것이지만, 데스크톱에서도
   새로고침·닫기에 불립니다. visibilitychange 는 탭 전환을 잡습니다. */
for (const ev of ['pagehide', 'visibilitychange']) {
  addEventListener(ev, () => {
    if (ev === 'visibilitychange' && document.visibilityState !== 'hidden') return;
    if (SESSION.startedAt && !SESSION.ended) saveSession();
  });
}

/** 발이 닿은 칸의 표면. 발은 몸통 아래라 y 에서 한 픽셀 올려 봅니다 -
    안 그러면 칸 경계에서 다음 칸 소리가 먼저 납니다. */
function surfaceAt(px, py) {
  const tx = Math.floor(px / T), ty = Math.floor((py - 1) / T);
  if (!inMap(zone, tx, ty) || !zone.surf) return SURF.GRASS;
  return zone.surf[at(zone, tx, ty)];
}

/** 둘레에 물이 있으면 그 칸을 돌려줍니다. 물가 파문이 어디에 생길지 */
function waterNear(px, py) {
  const tx = Math.floor(px / T), ty = Math.floor((py - 1) / T);
  for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
    const x = tx + i, y = ty + j;
    if (!inMap(zone, x, y)) continue;
    if (zone.surf[at(zone, x, y)] === SURF.WATER) return { x, y };
  }
  return null;
}

/** 사방이 다 물인 칸인가. 둑에 닿은 칸은 오토타일이 물가를 그리므로
    반짝임을 얹으면 물이 뭍으로 올라온 것처럼 보입니다. */
function waterInner(m, x, y) {
  for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
    if (!inMap(m, x + i, y + j) || m.over[at(m, x + i, y + j)] !== M.WATER) return false;
  }
  return true;
}

function solidAt(px, py) {
  const tx = Math.floor(px / T), ty = Math.floor(py / T);
  if (!inMap(zone, tx, ty)) return true;
  return zone.solid[at(zone, tx, ty)] === 1;
}
/* 발이 딛는 자리. 타일 대비 비율이 그대로여야 지나다니던 틈을 계속
   지나갑니다 — 9/16 = 18/32. multiplayer.js 의 봇 상자와 **반드시**
   같아야 하고, 다르면 남만 벽을 통과합니다(그 파일 주석에 경고가 있습니다). */
const BOX = { w: 9 * AS, h: 6 * AS };
function canStand(px, py) {
  const l = px - BOX.w / 2, r = px + BOX.w / 2 - 1, t = py - BOX.h, b = py - 1;
  return !(solidAt(l, t) || solidAt(r, t) || solidAt(l, b) || solidAt(r, b));
}

/* ==================================================================
   클릭해서 걷기

   자판을 못 쓰는 사람은 없습니다. 다만 화면 저쪽이 보이면 손이 먼저
   그리로 갑니다 - 처음 들어온 사람이 WASD 를 찾기 전에 하는 일이
   화면을 눌러 보는 것이었습니다. 젭도 스타듀도 그 손을 받습니다.

   길찾기는 A* 가 아니라 너비 우선입니다. 가장 넓은 캠퍼스가 46x42 =
   1932 칸이고 실내는 그 5분의 1 도 안 됩니다. 이 크기에서는 우선순위
   큐를 얹어 아끼는 시간보다 큐를 관리하는 코드가 더 깁니다 - 게다가
   이 함수는 **누를 때 한 번** 돌지 프레임마다 돌지 않습니다.

   대각선도 안 씁니다. 발 상자가 18x12 라 벽 모서리를 비스듬히 스치면
   x·y 중 한 축만 막혀 그 자리에서 다리만 젓게 됩니다(canStand 가 축을
   나눠 보기 때문입니다). 네 방향으로 두면 길이 한두 칸 길어지는 대신
   그런 자리가 아예 안 생깁니다.
   ================================================================== */
const PATH = { steps: [], i: 0, stuck: 0 };
/* 훑는 칸 수의 상한. 지금 지도에서는 안 걸립니다 - 가장 큰 존이 1932
   칸이라 갈 수 있는 곳을 다 훑어도 여기 못 닿습니다. 그래도 두는 이유는,
   닿을 수 없는 칸을 누르면 **갈 수 있는 곳 전부**를 훑고 나서야 없다는
   답이 나오고 그 값이 지도가 커지는 만큼 같이 자라기 때문입니다. 여기서
   한 번 끊어 두면 지도를 아무리 늘려도 한 번 누르는 값이 이 숫자를
   안 넘습니다. */
const PATH_CAP = 4000;

/** 걷던 길을 버립니다. "이제 내가 몬다" 는 신호가 오는 자리마다 부릅니다 -
    자판·창·지도·앉기·가구 들기·존 이동. 한 군데 모아 받을 수가 없어서
    (저마다 다른 길로 들어옵니다) 부르는 쪽이 여럿입니다. */
function pathClear() { PATH.steps.length = 0; PATH.i = 0; PATH.stuck = 0; }

/** sx,sy 에서 tx,ty 까지 네 방향 너비 우선. 지나갈 칸 목록을 돌려주고
    출발 칸은 안 넣습니다. 목적지에 못 닿으면 목적지에 **맞닿은** 칸까지,
    그것도 없으면 null 입니다.

    벽을 눌렀을 때 아무 일도 안 일어나는 것보다 그 앞까지 가는 편이
    낫습니다 - 사람은 건물을 누를 때 "건물 안으로" 가 아니라 "저기로"
    를 말합니다. 맞닿은 칸이 여럿이면 가장 가까운 것으로 갑니다. */
function findPath(sx, sy, tx, ty) {
  const m = zone;
  if (!inMap(m, sx, sy) || !inMap(m, tx, ty)) return null;
  /* 누를 때 한 번 뜨는 판이라 캐시하지 않습니다. 존마다 크기가 달라
     재활용하려면 크기를 맞추는 코드가 또 붙는데, 가장 큰 존이라야
     1932 칸 * 4바이트 * 두 장 = 16KB 입니다. */
  const from = new Int32Array(m.w * m.h).fill(-1);
  const q = new Int32Array(m.w * m.h);
  const s = at(m, sx, sy), goal = at(m, tx, ty);
  const D = [0, -1, 0, 1, -1, 0, 1, 0];        // 위·아래·왼·오
  let head = 0, tail = 0, seen = 0, end = -1;
  q[tail++] = s; from[s] = s;                  // 자기 자신을 가리켜 되짚기가 여기서 멈춥니다
  while (head < tail && seen++ < PATH_CAP) {
    const cur = q[head++];
    if (cur === goal) { end = goal; break; }
    const cx = cur % m.w, cy = (cur / m.w) | 0;
    /* 목적지가 벽이면 그 벽에 맞닿은 칸으로 갑니다. 너비 우선은 가까운
       칸부터 꺼내므로 **처음 걸린 것이 가장 가까운 것**입니다 - 거리를
       따로 재서 비교할 필요가 없습니다. */
    if (end < 0 && Math.abs(cx - tx) + Math.abs(cy - ty) === 1) end = cur;
    for (let d = 0; d < 8; d += 2) {
      const nx = cx + D[d], ny = cy + D[d + 1];
      if (!inMap(m, nx, ny)) continue;
      const ni = at(m, nx, ny);
      if (from[ni] !== -1 || m.solid[ni] === 1) continue;
      from[ni] = cur;
      q[tail++] = ni;
    }
  }
  if (end < 0) return null;
  const out = [];
  for (let i = end; i !== s; i = from[i]) out.push({ x: i % m.w, y: (i / m.w) | 0 });
  return out.reverse();
}

/** 누른 칸으로 걷습니다. 길이 없으면 조용히 아무것도 안 합니다 -
    "여기는 못 갑니다" 를 띄우면 잘못 누른 것까지 야단이 됩니다. 벽
    한가운데나 지도 밖을 누르는 일은 흔하고, 흔한 일에 말을 걸면
    말이 시끄러워집니다. */
function walkTo(tx, ty) {
  pathClear();
  if (player.sitting || dialogOpen || panelOpen || travel || DECOR.it) return;
  /* 서 있는 칸은 1px 올려 봅니다. 발이 칸 아래 모서리에 서 있어서
     player.y 를 그대로 나누면 한 칸 아래가 나옵니다(findNearby 와 같은 규칙). */
  const p = findPath(Math.floor(player.x / T), Math.floor((player.y - 1) / T), tx, ty);
  if (!p) return;
  PATH.steps = p;
  /* 고리는 **누른 칸**이 아니라 **설 칸**에 찍습니다. 벽을 눌렀을 때
     벽 위에 고리가 뜨면 벽 속으로 들어간다는 뜻이 되는데 실제로는 그
     앞에 섭니다 - 표시가 약속한 것과 다른 일이 일어나면 그 다음부터
     표시를 안 믿게 됩니다. */
  const end = p.length ? p[p.length - 1] : { x: tx, y: ty };
  FX.goal(end.x, end.y);
}

/** 이번 프레임에 길을 따라 옮길 거리. 자판과 **같은 속도**를 받아
    자판과 **같은 코드**로 흘려보냅니다 - 여기서 따로 걸으면 발소리
    간격도 다리 그림도 따로 놉니다.

    남은 거리가 이번 몫보다 짧으면 그 칸에 정확히 올려놓고 남은 몫으로
    다음 칸을 이어서 먹습니다. 칸마다 잘라 쓰면 한 프레임에 1.8px 씩
    가는 걸음이 32px 짜리 칸을 넘을 때마다 조금씩 손해를 봐서, 클릭으로
    걷는 쪽이 자판보다 눈에 띄게 느려집니다. */
function pathStep(speed) {
  let left = speed, dx = 0, dy = 0;
  while (left > 0 && PATH.i < PATH.steps.length) {
    const n = PATH.steps[PATH.i];
    const ax = n.x * T + T / 2 - (player.x + dx), ay = n.y * T + T - (player.y + dy);
    const d = Math.hypot(ax, ay);
    if (d <= left) { dx += ax; dy += ay; left -= d; PATH.i++; }
    else { dx += ax / d * left; dy += ay / d * left; left = 0; }
  }
  return { dx, dy };
}

function enterZone(id, sx, sy, dir) {
  /* 앉은 채로 방을 옮기는 길이 있습니다(지도 M · 세션 끝내기). 일어나는
     것은 **떠나기 전**에 해야 합니다 — 여태 이 줄이 아래쪽, 새 자리를
     정한 뒤에 있어서, 일어서면서 도착 칸에서 한 칸 밀려났습니다.
     앉은 칸 아래가 늘 비어 있던 도서관·본관에서는 티가 안 났는데,
     벤치처럼 아래가 벽인 자리가 생기면서 밀려나는 방향이 위·옆으로도
     갈라졌습니다. 옛 방에서 일어나 두면 도착 칸은 적어 준 그대로입니다. */
  if (player.sitting) stand();
  if (id === 'library' || id === 'mainhall' || id === 'union')
    award('once:visit_' + id, ({ library: '도서관', mainhall: '본관', union: '학생회관' })[id] + ' 첫 방문');
  /* 세션은 여기서 한 번만 시작합니다. 존을 옮겨 다녀도 이어집니다 —
     캠퍼스 안에 있는 동안이 하나의 세션입니다.
     카메라도 이 순간 켭니다. 세션이 곧 촬영 구간입니다 — 앉기가 아니라. */
  if (!SESSION.startedAt) { SESSION.startedAt = Date.now(); startCamera(); }
  zoneId = id; zone = ZONES[id];
  player.x = sx * T + T / 2; player.y = sy * T + T;
  if (dir) { player.dir = dir === 'left' || dir === 'right' ? 'side' : dir; player.flip = dir === 'left'; }
  /* 짧게 둡니다. 문 바로 안쪽에 서므로, 돌아서면 곧바로 다시 나갈 수
     있어야 합니다. 길면 문이 잠긴 것처럼 느껴집니다. */
  portalCooldown = 0.35;
  FX.clear();                        // 이전 존의 자국을 들고 오지 않습니다
  /* 길은 칸 번호로 적혀 있고 칸 번호는 존마다 뜻이 다릅니다. 안 버리면
     새 방에서 남의 지도를 따라 걷습니다. */
  pathClear();
  walked = STRIDE; lastSurf = -1;
  /* 방금 지나온 문에서 빛이 새어 듭니다. 0.4 초면 뒤돌아볼 때쯤 닫힙니다.
     들어온 자리에서 가장 가까운 포탈을 찾습니다 - 문이 여럿인 방을
     대비한 것이고, 지금은 어느 방이든 하나뿐입니다. */
  {
    let best = null, bd = 1e9;
    for (const q of zone.portals) {
      const d = Math.hypot(q.x + q.w / 2 - sx, q.y + q.h / 2 - sy);
      if (d < bd) { bd = d; best = q; }
    }
    doorFlash = best && bd < 6 ? { x: best.x, y: best.y, w: best.w, h: best.h, t: 0 } : null;
  }
  const b = document.getElementById('banner');
  b.querySelector('b').textContent = zone.name;
  b.querySelector('span').textContent = zone.sub;
  /* CSS 만으로는 화면에 남는 일이 있었습니다 — 애니메이션이 끝나기 전에
     탭이 가려지거나 다음 전환이 겹치면 `.play` 가 붙은 채로 멈춰 섭니다.
     끝나면 반드시 클래스를 떼고, 못 끝나도 시간이 지나면 떼도록 두 겹으로
     막습니다. 클래스가 없으면 기본 규칙(opacity:0)이라 무조건 사라집니다. */
  clearTimeout(b.__hide);
  b.classList.remove('play'); void b.offsetWidth; b.classList.add('play');
  const drop = () => { b.classList.remove('play'); clearTimeout(b.__hide); };
  b.addEventListener('animationend', drop, { once: true });
  b.__hide = setTimeout(drop, 2400);   // 2.1s 애니메이션 + 여유
  /* 존 배지를 없앴으므로 여기서 쓸 곳이 없습니다. 이름은 지도(M)와
     건물 안내판이 말합니다. */
  /* 설정은 **어디서나** 오른쪽 위에 있습니다. 전에는 기숙사에서만
     떴는데, 소리·접근성·개인정보처럼 "지금 당장 끄고 싶은" 것들이
     거기 들어 있어서 방까지 걸어가야 했습니다. 설정을 찾으러 이동해야
     하는 것은 설정이 아닙니다. */
  document.getElementById('gear').classList.add('on');
  document.getElementById('session-place').textContent = FOCUS[id] || zone.name;
  if (panelOpen) closePanel();
  /* 서랍은 기숙사 물건입니다. 방을 나가면 같이 닫습니다 — 안 닫으면
     광장 한복판에서 가구를 끄는 창이 떠 있습니다. */
  if (DECOR.drawer) decorDrawer(false);
  closeDialog();
  /* 일어서기는 이 함수 맨 위로 올라갔습니다 — 새 자리를 정하기 전에
     해야 도착 칸이 안 밀립니다. */
  /* 공간이 곧 모드라면 소리도 공간을 따라야 합니다.
     문소리는 포탈에서 이미 울리므로 여기서는 앰비언트만 갈아 답니다. */
  if (audioWoken) { setAmbience(id); setMusic(id); }
  /* 첫 안내 — 기숙사에 처음 들어올 때 한 번. 부팅 직후에도 이 길로
     들어오므로 처음 온 사람은 방에 서자마자 보게 됩니다. 한 박자 두는
     것은 문 넘어가는 어둠이 걷힌 뒤에 띄우기 위해서입니다. */
  if (id === 'dorm') {
    let seen = true;
    try { seen = localStorage.getItem('girin.tour') === 'seen'; } catch { /* 막혀 있으면 안 띄웁니다 */ }
    if (!seen) setTimeout(() => { if (zoneId === 'dorm' && !panelOpen) startTour(); }, 700);
  }
}
window.__teleport = enterZone;

function facingTile() {
  const tx = Math.floor(player.x / T), ty = Math.floor((player.y - 1) / T);
  if (player.dir === 'up') return { x: tx, y: ty - 1 };
  if (player.dir === 'down') return { x: tx, y: ty + 1 };
  return { x: tx + (player.flip ? -1 : 1), y: ty };
}
function findNearby() {
  if (player.sitting) return { kind: 'stand' };
  const f = facingTile();
  /* NPC 는 두 칸까지 — 계산대 뒤에 서 있어서 앞 칸만 보면 못 만납니다 */
  const d = { up: [0, -1], down: [0, 1], side: [player.flip ? -1 : 1, 0] }[player.dir];
  for (const step of [0, 1]) {
    const fx = f.x + d[0] * step, fy = f.y + d[1] * step;
    for (const n of zone.npcs) if (n.x === fx && n.y === fy) return { kind: 'talk', npc: n };
  }
  /* 물건 만지기. 방향이 아니라 **거리**로 잡습니다 — 미니룸은 물건이
     빽빽해서, 정확히 마주 봐야만 열리면 답답합니다. 여러 개가 걸리면
     가장 가까운 것을 고릅니다. */
  const ptx = Math.floor(player.x / T), pty = Math.floor((player.y - 1) / T);
  let best = null, bestD = 99;
  for (const t of zone.things || []) {
    const tw = t.w || 1, th = t.h || 1;
    const nx = Math.max(t.x - ptx, 0, ptx - (t.x + tw - 1));
    const ny = Math.max(t.y - pty, 0, pty - (t.y + th - 1));
    if (nx > 1 || ny > 1) continue;
    /* 같은 거리에 둘이 걸리면 **보고 있는 쪽**이 이깁니다. 기숙사 기능
       줄처럼 물건이 한 칸 간격으로 서면 사이에 섰을 때 둘 다 한 칸이라,
       거리만 보면 목록 순서가 정하게 됩니다 — 사람이 고른 것이 아니라. */
    const facing = f.x >= t.x && f.x < t.x + tw && f.y >= t.y && f.y < t.y + th;
    const dist = nx + ny - (facing ? 0.5 : 0);
    if (dist < bestD) { bestD = dist; best = t; }
  }
  if (best) return { kind: 'talk', npc: best };
  /* 앉는 자리는 **어디에나** 있습니다. 여기서 FOCUS 로 막고 있었는데,
     그 한 줄 때문에 광장·호수·동아리 거리의 벤치가 전부 앉을 수 없는
     벤치 그림이었습니다. 앉는 것과 세션은 다른 일입니다 — 세션과 웹캠은
     sit() 이 FOCUS 로 가릅니다. 여기서 한 번 더 가르면 "쉬는 자리"가
     아예 안 생깁니다. */
  for (const s of zone.sitSpots) if (s.x === f.x && s.y === f.y) return { kind: 'sit', spot: s };
  return null;
}
function interact() {
  /* 대화창이 떠 있으면 스페이스는 **닫기**입니다.

     이걸 nearby 보다 먼저 보지 않으면 창이 영영 안 닫힙니다 — 대화를
     연 자리에 그대로 서 있으니 nearby 가 살아 있고, 스페이스를 누를
     때마다 같은 창이 다시 열립니다. 자리를 뜬 경우만 닫히던 이유입니다. */
  if (dialogOpen) return advanceDialog();
  const n = nearby;
  if (!n) return;
  if (n.kind === 'stand') return stand();
  if (n.kind === 'sit') return sit(n.spot);
  if (n.kind === 'talk') {
    /* 미니룸 물건은 설명이 아니라 **창**을 엽니다 */
    if (n.npc.panel) return openPanel(n.npc.panel);
    return talk(n.npc);
  }
}

let dialogOpen = false, talkingTo = null;

/** 한 줄짜리(line)든 여러 줄(lines)이든 배열로 봅니다. 부르는 쪽이 둘을
    구분하지 않아도 되게, 읽는 자리에서 한 번만 맞춥니다. */
const npcLines = (npc) => (npc.lines && npc.lines.length ? npc.lines : [npc.line]);

function talk(npc) {
  /* things 도 이 창을 쓰므로 진짜 NPC 만 셉니다 */
  if ((zone.npcs || []).includes(npc)) award('once:npc_' + npc.name, npc.name.split(' · ')[1] + ' 첫 만남');
  talkingTo = npc;
  npc.at = 0;
  paintDialog();
}

/** 스페이스 — 남은 줄이 있으면 넘기고, 없으면 닫습니다.
    **끝까지 들은 사람만** after 가 걸립니다(안내 나루 → 튜토리얼).
    중간에 걸어 나간 사람에게 안내를 밀어 넣지 않기 위해서입니다. */
function advanceDialog() {
  const npc = talkingTo;
  if (!npc || npc.at >= npcLines(npc).length - 1) {
    const after = npc && npc.after;
    closeDialog();
    if (after) after();
    return;
  }
  npc.at++;
  paintDialog();
}

function paintDialog() {
  const npc = talkingTo, lines = npcLines(npc);
  const d = document.getElementById('dialog');
  d.querySelector('b').textContent = npc.name;
  d.querySelector('p').textContent = lines[npc.at];
  const last = npc.at >= lines.length - 1;
  /* 몇 줄 남았는지 보여 줍니다. 안 보여 주면 스페이스를 누를 때마다
     이번이 마지막인지 아닌지 몰라 계속 누르게 됩니다. */
  d.querySelector('small').textContent = last
    ? 'Space 로 닫기'
    : 'Space 로 계속 · ' + (npc.at + 1) + '/' + lines.length;
  d.classList.add('on'); dialogOpen = true;
}

function closeDialog() {
  document.getElementById('dialog').classList.remove('on');
  dialogOpen = false; talkingTo = null;
}

/* ==================================================================
   첫 안내 — 그림 넉 장

   **기숙사에 처음 들어왔을 때** 뜹니다. 이 월드는 자기 방에서 시작하고,
   방에서 나가기 전에 캠퍼스가 어떻게 생겼는지 한 번은 봐야 합니다.

   그림은 **우리 월드를 그 자리에서 찍습니다.** 손으로 그린 삽화를 넣으면
   가구를 옮길 때마다 그림이 거짓말이 되고, 캡처를 파일로 넣으면 저장소가
   무거워지고 존을 고칠 때 같이 안 바뀝니다. draw() 가 이미 다섯 존을 다
   그릴 줄 아니, 카메라만 옮겨 한 장씩 떠서 동그라미와 화살표를 얹습니다.

   넉 장인 이유 — 사람들이 실제로 첫 1분에 하는 질문이 넷입니다.
   어디로 가나 · 어디서 세션을 하나 · 코인은 어디서 쓰나 · 내 방에서
   뭘 할 수 있나. 다섯 장째부터는 건너뛰기를 누릅니다. 조작(WASD·Space)은
   따로 한 장을 쓰지 않고 그림 안에 키 모양으로 얹었습니다.

   한 번 보면 다시 안 뜹니다(girin.tour). 다시 보려면 마이페이지 설정이나
   방 안 안내 입간판에서 엽니다.
   ================================================================== */
const tourEl = document.getElementById('tour');
const tourPic = document.getElementById('tour-pic');
const tourG = tourPic.getContext('2d');
const tourTitle = document.getElementById('tour-title');
const tourDesc = document.getElementById('tour-desc');
const tourDots = document.getElementById('tour-dots');
const tourNext = document.getElementById('tour-next');
const tourBack = document.getElementById('tour-back');
const PIC_W = 576, PIC_H = 360;

/* ---- 그림 위에 얹는 것 ----
   월드는 픽셀 그림이라 정수 배로만 늘리고, 표시(동그라미·글자)는 카드
   해상도에서 곧바로 그립니다. 표시까지 픽셀로 그리면 작은 글자가
   무너지고, 월드를 매끄럽게 늘리면 픽셀 그림이 흐려집니다. 둘은 서로
   다른 층이고, 층마다 다른 규칙을 씁니다. */
function tourRound(g, x, y, w, h, r) {
  if (g.roundRect) { g.beginPath(); g.roundRect(x, y, w, h, r); return; }
  g.beginPath();
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r); g.closePath();
}
/** 여기를 보라는 동그라미. 흰 무리 · 먹 테 · 청록 순서라 밝은 바닥에도
    어두운 가구 위에도 남습니다. */
function tourRing(g, x, y, r) {
  g.save();
  g.lineWidth = 7; g.strokeStyle = 'rgba(255,255,255,.9)';
  g.beginPath(); g.arc(x, y, r, 0, 7); g.stroke();
  g.lineWidth = 4; g.strokeStyle = '#0C5A4F';
  g.beginPath(); g.arc(x, y, r, 0, 7); g.stroke();
  g.lineWidth = 2; g.strokeStyle = '#2DD4BF';
  g.beginPath(); g.arc(x, y, r, 0, 7); g.stroke();
  g.restore();
}
/** 이름표. dark 면 청록 알약에 흰 글자(가장 중요한 하나에만). */
function tourChip(g, x, y, text, dark) {
  g.save();
  g.font = '700 12.5px "Wanted Sans Variable", system-ui, sans-serif';
  const w = Math.round(g.measureText(text).width) + 18, h = 23;
  const rx = Math.round(x - w / 2), ry = Math.round(y - h / 2);
  g.fillStyle = 'rgba(30,38,36,.22)';
  tourRound(g, rx + 1, ry + 2, w, h, 11); g.fill();
  g.fillStyle = dark ? '#0C5A4F' : '#FFFFFF';
  tourRound(g, rx, ry, w, h, 11); g.fill();
  g.strokeStyle = dark ? 'rgba(255,255,255,.22)' : 'rgba(43,50,48,.14)';
  g.lineWidth = 1; g.stroke();
  g.fillStyle = dark ? '#FFFFFF' : '#2B3230';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, x, y + 1);
  g.restore();
}
/** 자판 한 알. 조작을 글로 쓰지 않고 눌러야 할 모양 그대로 보여 줍니다. */
function tourKey(g, x, y, text) {
  g.save();
  g.font = '700 12px "Wanted Sans Variable", system-ui, sans-serif';
  const w = Math.max(26, Math.round(g.measureText(text).width) + 16), h = 25;
  const rx = Math.round(x - w / 2), ry = Math.round(y - h / 2);
  g.fillStyle = '#0C5A4F'; tourRound(g, rx, ry + 2, w, h, 7); g.fill();
  g.fillStyle = '#FFFFFF'; tourRound(g, rx, ry, w, h, 7); g.fill();
  g.strokeStyle = '#0C5A4F'; g.lineWidth = 1.5; g.stroke();
  g.fillStyle = '#0C5A4F'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, x, y + 1);
  g.restore();
}
/** 화살표. 먹 획 위에 청록을 얹어 어느 바탕에서도 보이게 합니다. */
function tourArrow(g, x1, y1, x2, y2) {
  const a = Math.atan2(y2 - y1, x2 - x1);
  /* 먹 획 위에 청록을 얹습니다. 촉도 먹이 한 겹 크게 깔려야 밝은 바닥
     에서 청록 삼각형이 바닥에 녹지 않습니다. */
  const one = (col, w, L, back) => {
    g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round';
    g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2 - Math.cos(a) * back, y2 - Math.sin(a) * back); g.stroke();
    g.fillStyle = col;
    g.beginPath();
    g.moveTo(x2 + Math.cos(a) * (L - 12), y2 + Math.sin(a) * (L - 12));
    g.lineTo(x2 - Math.cos(a - 0.44) * L, y2 - Math.sin(a - 0.44) * L);
    g.lineTo(x2 - Math.cos(a + 0.44) * L, y2 - Math.sin(a + 0.44) * L);
    g.closePath(); g.fill();
  };
  g.save();
  one('#0C5A4F', 8, 18, 10);
  one('#2DD4BF', 3.5, 13, 12);
  g.restore();
}

/* ---- 월드 한 장 뜨기 ----
   전역(존·카메라·사람 자리·시각)을 잠깐 바꾸고 draw() 를 한 번 돌린 뒤
   화면 캔버스에서 필요한 만큼 잘라 옵니다. 한 호출 안에서 끝나므로
   화면에는 중간 상태가 한 번도 안 보입니다(브라우저는 자바스크립트가
   멈춘 사이에 화면을 안 그립니다). 끝나면 전부 제자리에 돌려 놓습니다.

   시각은 11시로 고정합니다. 밤에 처음 들어온 사람에게 새까만 안내
   그림을 보여 줄 수는 없습니다. */
function worldShot(g, dx, dy, dw, dh, id, cxTile, cyTile, at) {
  const keep = {
    id: zoneId, z: zone, cx: camX, cy: camY,
    px: player.x, py: player.y, dir: player.dir, flip: player.flip, sit: player.sitting,
    near: nearby, flash: doorFlash, tv: travel, t: TIME.override, w: WEATHER.override,
    scale: SCALE,
  };
  /* 넓은 장면(방 하나가 통째로 들어가야 하는 장)은 화면 배율을 1 로
     내려 찍습니다. ×2 로는 화면 캔버스가 610×350 칸밖에 안 되어 14칸
     짜리 방이 안 들어갑니다. 찍고 나서 곧바로 되돌립니다. */
  const zoom = at && at.wide ? 1 : 2;
  if (zoom === 1 && SCALE !== 1) { SCALE = 1; resize(); }
  const cw = Math.min(dw / zoom, VIEW_W), ch = Math.min(dh / zoom, VIEW_H);
  zoneId = id; zone = ZONES[id];
  TIME.override = 11; WEATHER.override = 0;
  doorFlash = null; travel = null; nearby = null;
  player.sitting = !!(at && at.sit);
  if (at) { player.x = at.x * T + T / 2; player.y = (at.y + 1) * T; player.dir = at.dir || 'down'; player.flip = !!at.flip; }
  else { player.x = -9999; player.y = -9999; }         // 사람이 없는 장면
  camX = Math.round(cxTile * T + T / 2 - VIEW_W / 2);
  camY = Math.round(cyTile * T + T / 2 - VIEW_H / 2);
  draw();
  g.imageSmoothingEnabled = false;
  g.drawImage(cv, Math.round((VIEW_W - cw) / 2), Math.round((VIEW_H - ch) / 2), cw, ch,
              dx, dy, cw * zoom, ch * zoom);
  g.imageSmoothingEnabled = true;
  if (SCALE !== keep.scale) { SCALE = keep.scale; resize(); zoomNowEl.textContent = zoomPct + '%'; }
  zoneId = keep.id; zone = keep.z; camX = keep.cx; camY = keep.cy;
  player.x = keep.px; player.y = keep.py; player.dir = keep.dir; player.flip = keep.flip;
  player.sitting = keep.sit;
  nearby = keep.near; doorFlash = keep.flash; travel = keep.tv;
  TIME.override = keep.t; WEATHER.override = keep.w;
  /* 화면은 다음 프레임이 어차피 다시 그립니다. 여기서 한 번 더 그려
     두는 것은 카드가 열리는 동안 뒤가 남의 방으로 보이지 않게 하려는
     것입니다. */
  draw();
  return { x: dx, y: dy, w: cw * zoom, h: ch * zoom, zoom, cxTile, cyTile };
}
/** 잘라 온 그림 안에서 월드 칸 좌표가 어디인지. 동그라미를 찍는 데 씁니다. */
function shotAt(box, tx, ty) {
  return {
    x: box.x + box.w / 2 + (tx - box.cxTile) * T * box.zoom,
    y: box.y + box.h / 2 + (ty - box.cyTile) * T * box.zoom,
  };
}

let tourStep = 0, tourOn = false;

function paintTour() {
  const s = TOUR[tourStep];
  tourG.setTransform(1, 0, 0, 1, 0, 0);
  tourG.clearRect(0, 0, PIC_W, PIC_H);
  tourG.fillStyle = '#EFF1F1'; tourG.fillRect(0, 0, PIC_W, PIC_H);
  try { s.draw(tourG); } catch (e) { /* 그림 한 장이 못 떠도 안내는 계속됩니다 */ }
  tourTitle.textContent = s.title;
  tourDesc.textContent = s.desc;
  tourDots.innerHTML = TOUR
    .map((_, i) => '<i class="' + (i === tourStep ? 'on' : i < tourStep ? 'done' : '') + '"></i>').join('');
  tourNext.textContent = tourStep === TOUR.length - 1 ? '시작하기' : '다음';
  tourBack.disabled = tourStep === 0;
}

function startTour() {
  if (tourOn) return;
  tourStep = 0; tourOn = true;
  tourEl.classList.add('on');
  paintTour();
  tourNext.focus();
}
/** 끝까지 봤든 건너뛰었든 같습니다 — 본 것으로 칩니다. */
function endTour() {
  tourOn = false;
  tourEl.classList.remove('on');
  try { localStorage.setItem('girin.tour', 'seen'); } catch { /* 무시 */ }
}
function tourGo(d) {
  const next = tourStep + d;
  if (next < 0) return;
  if (next >= TOUR.length) return endTour();
  tourStep = next;
  paintTour();
}
tourNext.addEventListener('click', () => tourGo(1));
tourBack.addEventListener('click', () => tourGo(-1));
document.getElementById('tour-skip').addEventListener('click', endTour);
document.getElementById('tour-x').addEventListener('click', endTour);
/* 바깥을 눌러도 닫힙니다 — 카드 밖은 이미 안내가 아닙니다 */
tourEl.addEventListener('click', (e) => { if (e.target === tourEl) endTour(); });
/* 키는 캡처 단계에서 받습니다. 월드가 같은 키를 조작으로 쓰기 때문에
   여기서 먼저 삼키지 않으면 안내를 넘기면서 캐릭터가 걷습니다. */
addEventListener('keydown', (e) => {
  if (!tourOn) return;
  const k = controlKey(e.key);
  if (['arrowright', 'd', 'enter', ' '].includes(k)) { e.preventDefault(); e.stopPropagation(); tourGo(1); }
  else if (['arrowleft', 'a'].includes(k)) { e.preventDefault(); e.stopPropagation(); tourGo(-1); }
  else if (k === 'escape') { e.preventDefault(); e.stopPropagation(); endTour(); }
}, true);

const FOCUS = { library: '도서관 · 백색소음', mainhall: '본관 · 대중음악' };

/** 웹캠 PIP 를 띄우거나 치웁니다. 같은 모서리를 쓰는 코인 버튼과 지급
    사유 칩도 함께 비킵니다 — 세 곳에서 따로 토글하다 한 곳을 빠뜨리면
    화면 구석에서 서로 겹칩니다. */
function showPip(on) {
  const p = document.getElementById('session');
  p.classList.toggle('on', on);
  p.classList.toggle('pip', on);
  /* 줄어든 카드는 오른쪽 **위**로 갑니다. 아래쪽 그 자리에는 세션 HUD ·
     조작 안내 · 코인이 이미 있어서 겹칩니다. 위는 비어 있습니다.
     한 번 옮겨 둔 사람은 그 선택을 기억합니다. */
  if (on) p.classList.toggle('up', loadJSON('girin.pipUp', true) !== false);
  else p.classList.remove('up');
  document.body.classList.toggle('pip-up', on && p.classList.contains('up'));

  document.getElementById('coinNote').classList.toggle('shifted', on);

}
/* 앉기 — 세션도 판정도 여기서 시작하지 않습니다. 둘 다 월드에 들어온
   순간부터 돌고 있습니다.

   **앉는 것은 어디서나 됩니다.** 광장 벤치도, 호숫가 벤치도, 동아리
   거리 벤치도 앉습니다. 앉을 데가 있는 거리와 없는 거리는 다른
   거리이고, 앉지 못하는 벤치는 벤치 모양의 장식입니다.

   **세션과 웹캠 화면(PIP)만** 집중 공간(도서관·본관)에서 돕니다. 여기
   앉으면 화면 구석에 자기 얼굴이 뜹니다 — 다른 탭으로 가서 집중하라는
   신호입니다. 밖에서는 안 뜹니다: 산책하다 벤치에 앉았다고 카메라 창이
   따라 뜨면 그건 쉬는 것이 아니라 감시입니다. 앉은 시간(seatedAt)도
   같은 이유로 집중 공간에서만 셉니다 — 벤치에 앉아 보낸 시간이 회고에
   "앉아 있던 시간" 으로 섞이면 그 숫자가 무엇을 뜻하는지 알 수 없게
   됩니다. 카메라가 도는 사실은 왼쪽 아래 세션 시계 옆 글자가 늘
   말해 줍니다. */
function sit(spot) {
  if (player.sitting) return;
  pathClear();                // 앉는 사람은 이제 갈 곳이 없습니다
  SFX.chair(false);
  sitSquash = 1;            // 앉는 순간 살짝 눌렸다 폅니다
  player.sitting = true;
  player.x = spot.x * T + T / 2; player.y = spot.y * T + T;
  /* 자리마다 정해 둔 쪽을 봅니다(bake). 책상 위쪽 줄이면 아래를 봅니다 —
     그래야 여섯 명이 마주 앉는 열람석이 마주 앉은 것으로 보입니다.
     벤치는 등받이가 정합니다(아래). */
  player.dir = spot.dir || 'up'; player.flip = false; player.moving = false;
  sitStart = performance.now();
  /* 여기서부터가 **세션 자리**만의 일입니다. 밖에서는 아무 일도 안
     일어나야 합니다 — 앉고, 일어나고, 그게 전부입니다. */
  if (!FOCUS[zoneId]) return;
  SESSION.seatedAt = Date.now();
  showPip(true);
  /* 입장 때 기준을 못 잡았으면(걸어 들어오느라 10초를 놓쳤거나 첫
     세션이거나) 여기서 잡습니다. 지금은 화면이 보이므로 "얼굴과 어깨가
     함께 보이게" 같은 안내를 읽을 수 있습니다. */
  if (!LIVE.profile && camStream) startCalibrate();
}
function stand() {
  if (SESSION.seatedAt) {
    SESSION.seatedMs += Date.now() - SESSION.seatedAt;
    SESSION.seatedAt = 0;
  }
  SFX.chair(true);
  sitSquash = 1;
  player.sitting = false;
  /* ---- 비켜설 자리 ----
     여태 **아래 한 칸만** 봤습니다. 도서관·본관 열람석은 전부 앞이
     비어 있어서 그걸로 충분했는데, 벤치는 벽에 등을 붙이고 서는 일이
     흔합니다(미니게임관·동아리 상점 벤치는 아랫벽에 붙어 있습니다).
     그러면 아래가 벽이라 제자리로 되돌아오고, 좌면은 막힌 칸이라
     일어난 사람이 벤치 안에 갇힙니다 — 어느 방향으로도 못 걷습니다.

     아래 · 위 · 왼 · 오 순으로 봅니다. 아래가 첫째인 이유는 여태
     그랬기 때문이고(앞으로 일어서는 것이 자연스럽습니다), 나머지는
     아래가 막혔을 때만 씁니다. */
  const bx = player.x, by = player.y;
  for (const [dx, dy] of [[0, T], [0, -T], [-T, 0], [T, 0]]) {
    player.x = bx + dx; player.y = by + dy;
    if (canStand(player.x, player.y)) break;
    player.x = bx; player.y = by;
  }
  player.dir = 'down';
  /* 카메라는 끄지 않습니다 — 세션이 도는 동안은 계속 봅니다.
     화면만 치웁니다. 판정이 멎었다는 뜻이 아니에요. */
  showPip(false);
}
document.getElementById('stand').addEventListener('click', stand);

var POSE = (function () {

    }
    if (hipsOk && shouldersOk) {
      f.torsoLean = Math.abs(smx - (P.leftHip.x + P.rightHip.x) / 2) / d;
    }
    if (hp && headUsable(hp)) {
      f.headDistanceCm = hp.headDistanceCm;
      f.headPitchDeg = hp.headPitchDeg;
    }

    return {
      features: f, shoulderWidth: sw, yawRatio: yaw,
      severeRotation: severe, moderateRotation: moderate,
      inFrame: core.every(inFrame), meanVisibility: vis,
      bothShouldersOk: shouldersOk, faceCoreOk: P.nose.present || eyesOk
    };
  }

  /* ---------------- 투표 ---------------- */
  var DIRECTION = {
    faceScaleRatio: 1,      /* 얼굴이 커짐 = 카메라 쪽으로 접근 */
    headHeightRatio: -1,    /* 눈-어깨 거리 감소 = 고개 숙임·움츠림 */
    facePitchRatio: 1,      /* 눈-코 세로 간격 벌어짐 = 고개 숙임 */
    earEyeRatio: -1,        /* 귀가 눈보다 올라감 = 고개 숙임 */
    shoulderSpan: 1,        /* 어깨폭 넓어짐 = 몸 전체 접근 */
    lateralOffsetRatio: 1, shoulderTiltRatio: 1, torsoLean: 1,
    headDistanceCm: -1,     /* 얼굴이 가까워짐 = 머리 전방 이동 */
    headPitchDeg: 1,        /* 턱을 내림 */
    forwardDepthRatio: 1
  };
  var FLOOR = {
    faceScaleRatio: 0.03, headHeightRatio: 0.08,
    facePitchRatio: 0.06, earEyeRatio: 0.06, shoulderSpan: 0.012,
    lateralOffsetRatio: 0.1, shoulderTiltRatio: 0.08, torsoLean: 0.1,
    headDistanceCm: 4, headPitchDeg: 8,   /* cm·도 단위 */
    forwardDepthRatio: 0.35
  };
  var MAD_K = 8;
  var SENS = { gentle: 1.4, 'default': 1.0, sensitive: 0.75 };
  var WARNING_ENTER = 1.0, BAD_STRONG = 1.8, GOOD_EXIT = 0.8;

  function votes(f, profile, sens, qualityGood) {
    var mult = SENS[sens] || 1, details = [];
    PRIMARY.concat(AUX).forEach(function (k) {
      var v = f[k], st = profile.features[k];
      if (v === undefined || !st) return;
      var tol = mult * Math.max(FLOOR[k], st.mad * MAD_K);
      var dev = Math.max(0, (v - st.median) * DIRECTION[k]) / tol;
      details.push({ key: k, deviation: dev, primary: PRIMARY.indexOf(k) >= 0,
                     exceeded: dev > WARNING_ENTER });
    });
    var pri = details.filter(function (d) { return d.primary; });
    var over = pri.filter(function (d) { return d.exceeded; }).length;
    var max = pri.reduce(function (m, d) { return Math.max(m, d.deviation); }, 0);
    return {
      details: details, primaryExceedCount: over, maxPrimary: max,
      usedFeatureCount: details.length,
      /* z 는 표가 아닙니다: bad 의 두 번째 표도, good 복귀의 거부권도
         갖지 않습니다. 실카메라에서 z 는 조명·거리에 따라 흘러다닙니다. */
      voteWarning: over >= 1,
      voteBad: over >= 2 || (max > BAD_STRONG && qualityGood),
      voteGood: pri.every(function (d) { return d.deviation < GOOD_EXIT; })
    };
  }

  /* ---------------- 지속 시간으로 확정 ----------------
     한 프레임 튀었다고 상태를 바꾸지 않습니다. */
  var HOLD = { warning: 1500, bad: 5000, good: 2000 };
  function arbiter() { return { current: 'good', candidate: null, since: 0 }; }
  function step(s, v, now) {
    var target = v.voteBad ? 'bad' : v.voteWarning ? 'warning' : v.voteGood ? 'good' : null;
    if (target === null || target === s.current) {
      return { current: s.current, candidate: null, since: now };
    }
    if (s.candidate !== target) return { current: s.current, candidate: target, since: now };
    if (now - s.since >= HOLD[target]) return { current: target, candidate: null, since: now };
    return s;
  }

  /* ---------------- 통계 ---------------- */
  function median(a) {
    var s = a.slice().sort(function (x, y) { return x - y; }), m = Math.floor(s.length / 2);
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  }
  function mad(a, c) {
    if (c === undefined) c = median(a);
    return median(a.map(function (n) { return Math.abs(n - c); }));
  }

  /* ---------------- 프레임 루프 ----------------
     한 비디오에 대해 Pose 와 Face 를 같은 타임스탬프로 한 번씩 돌립니다. */
  function detect(video, t, smoother) {
    if (!poser) return null;
    var res;
    try { res = poser.detectForVideo(video, t); } catch (e) { return null; }
    var people = res.landmarks || [];
    var raw = people[0];
    if (!raw) { smoother.reset(); return { analysis: null, multi: false, landmarks: null }; }

    var hp = null;
    if (facer) {
      try {
        var fr = facer.detectForVideo(video, t);
        var m = fr.facialTransformationMatrixes && fr.facialTransformationMatrixes[0];
        hp = headPose(m && m.data);
      } catch (e) { hp = null; }
    }
    return {
      analysis: analyze(smoother.smooth(raw, t), hp),
      /* 기준을 맞출 때는 "기준 대비" 가 아직 없으므로 **절대값**이 필요합니다.
         머리 6DoF 는 도·cm 단위라 그대로 쓸 수 있어 밖으로 넘깁니다. */
      head: hp,
      /* 뼈대 그리기용 원본 좌표. 이 키가 빠져 있어 drawSkeleton 이
         한 번도 그려지지 않았습니다 — 호출부 아홉 곳 전부 out.landmarks. */
      landmarks: raw,
      multi: people.length > 1
    };
  }

  return {
    load: load, detect: detect, analyze: analyze, votes: votes,
    arbiter: arbiter, step: step, median: median, mad: mad,
    Smoother: Smoother,
    PRIMARY: PRIMARY, AUX: AUX,
    /* 판정에 쓰는 환산 상수를 그대로 내보냅니다. 러너가 고개 움직임을
       입력으로 쓰는데, 같은 식((v-median)*DIRECTION/tol)을 저쪽에 베껴
       두면 여기 숫자를 고칠 때 조작이 조용히 어긋납니다. */
    DIRECTION: DIRECTION, FLOOR: FLOOR, MAD_K: MAD_K, SENS: SENS,
    MIN_SHOULDER_WIDTH: MIN_SHOULDER_WIDTH,
    ready: function () { return !!poser; }
  };
})();

/* ==================================================================
   웹캠 자세 판정 — UpRight 엔진 이식

   (UpRight 은 이 제품의 옛 이름입니다. 지금 이름은 Deskfit 이고, 여기만
   옛 이름으로 남깁니다 — 옮겨 온 시점의 코드와 문서가 그 이름이라,
   Deskfit 으로 고쳐 쓰면 어디서 옮겼는지를 못 찾습니다.)

   여기 있는 POSE 블록은 `prototypes/room-flow/index.html` 의 것을 그대로
   옮긴 것입니다. 손대지 마세요 — 값 하나하나에 이유가 있고, 그 이유는
   `upright-now/docs/24_POSTURE_ENGINE.md` 에 있습니다.

   요약만 적어 둡니다.
   · 정면 카메라는 거북목이 움직이는 축(앞뒤)을 원래 못 봅니다. 그래서
     **정면에서 실제로 보이는 형태 변화**를 여러 개 모아 투표시킵니다 —
     facePitchRatio · earEyeRatio · shoulderSpan, 그리고 얼굴 메시가 주는
     머리 6DoF(headDistanceCm · headPitchDeg).
   · 랜드마크 z(forwardDepthRatio)를 주력으로 쓰면 안 됩니다. 조명과 거리에
     따라 흘러다녀 기준선이 세션 중에 바뀝니다. 보조(AUX)로만 둡니다.
   · One Euro 필터가 앞에 붙습니다. 새 축들은 값이 작아서(0.06 단위)
     원본 떨림에 그대로 묻힙니다.
   · 절대 임계값은 없습니다. 사람마다 캘리브레이션한 **자기 기준**과
     중앙값·MAD 로 비교합니다.
   ================================================================== */

/* ---- 판정 민감도 ----
   업라이트와 같은 표준값으로 고정합니다. 사용자가 느슨하게 바꿀 수
   있으면 학교 랭킹이 조용히 무너집니다 — 랭킹 지표가 "bad 를 겪고
   회복한 시간" 이라, 기준을 풀면 bad 자체가 안 나옵니다. */
const SENSITIVITY = 'default';

/* ---- 기준 프로필 ----
   세션을 시작할 때 10초로 한 번 잡아 그 세션 내내 씁니다. 존을 옮겨
   다녀도 같은 기준으로 봅니다 — 카메라와 사람의 관계는 존이 아니라
   책상이 정하고, 책상은 세션 동안 하나입니다. 이 기기에만 남고 서버로
   가지 않습니다. version 3 이 아니면 버립니다 — 축이 바뀐 옛 프로필은
   조용히 무시되어 사용자에게는 고장으로 보입니다. (존별로 잡던 옛
   저장본은 최상위에 version 이 없어 여기서 같이 걸러집니다.) */
let BASELINE = null;
try {
  const saved = JSON.parse(localStorage.getItem('girin.baseline') || 'null');
  if (saved && saved.version === 3) BASELINE = saved;
} catch { /* 저장된 게 깨졌으면 기본값 */ }
function saveBaseline() {
  try { localStorage.setItem('girin.baseline', JSON.stringify(BASELINE)); } catch { /* 무시 */ }
}

/* ================== 화면 ================== */
const video = document.getElementById('cam');
const overlay = document.getElementById('cam-overlay');
const octx = overlay.getContext('2d');
const camMsg = document.getElementById('cam-msg');
const camDot = document.getElementById('cam-dot');
const stateLabel = document.getElementById('state-label');

let camStream = null, poseRunning = false;
let poseFrames = 0, poseFps = 0, lastDetect = 0;

/* 판정 결과. 세션 패널과 월드의 캐릭터가 같은 값을 봅니다. */
const LIVE = {
  on: false, smoother: null, arb: null, profile: null, zone: null,
  state: 'idle', msg: '측정 준비',
  frames: 0, seen: 0,
  goodMs: 0, warnMs: 0, badMs: 0, recoveries: 0, lastTick: 0, wasBad: false,
  /* 마지막으로 쓸 만했던 프레임의 축값과 그 시각. 러너의 조작이 여기서
     나옵니다(postureLift). 오래된 값으로 뛰면 안 되므로 시각을 같이 둡니다. */
  features: null, featAt: 0,
};

const STATE_COLOR = { good: '#2E9E5B', warning: '#D98324', bad: '#E0483A', idle: '#9A8E88' };
const STATE_TEXT  = { good: '좋아요', warning: '조금 앞으로 나왔어요', bad: '오래 굽어 있어요', idle: '' };

/* ================== 자세 말풍선 ==================
   멘토 피드백 — 자세 관리 기능이 세션 카드 안에만 있어 노출이 약합니다.
   캐릭터가 직접 말하게 합니다.

   **good 은 안 띄웁니다.** 잘하고 있을 때 칭찬이 반복되면 그게 곧
   소음이고, 소음이 되면 정작 나쁠 때도 안 봅니다. 좋은 상태는 캐릭터가
   평소처럼 서 있는 것으로 이미 말합니다. 회복한 순간만 예외입니다 —
   거기가 코인이 들어오는 자리라, 펴면 좋은 일이 생긴다는 것이 붙습니다.

   문구가 해요체인 것은 사용자 결정입니다. 이 월드에서 캐릭터는 반말이
   원칙이지만(girin-copy-voice), 자세 알림은 캐릭터의 잡담이 아니라
   제품이 사용자에게 하는 말이라 존대로 갑니다. */
const SAY_TEXT = {
  warning: '처음 잡은 자세에서 조금 내려왔어요',
  bad: '많이 내려왔어요. 어깨 한 번 펴 주세요',
  good: '기준 자세로 돌아왔어요',
};
/* 얼마나 보여 줄지 */
const SAY_SHOW = { warning: 3500, bad: 5000, good: 3000 };
/* 같은 상태가 이어져도 이 간격 전에는 다시 안 뜹니다 */
const SAY_GAP = { warning: 180000, bad: 90000 };
/* 세션당 상한. 넘으면 조용해집니다 — 계속 말하면 잔소리꾼이 됩니다 */
const SAY_MAX = { warning: 3, bad: 5 };
/* 앉고 나서 이만큼은 조용합니다. 자리 잡는 중에 지적하지 않습니다 */
const SAY_QUIET_MS = 30000;

const sayEl = document.getElementById('say');
const SAY = { until: 0, last: { warning: 0, bad: 0 }, count: { warning: 0, bad: 0 }, timer: 0 };

/* ================== 회의 모드 ==================
   회의·발표 중에는 캐릭터가 말을 걸면 안 됩니다. 그런데 **측정을 끄면
   안 됩니다** — 코인의 분모가 판정 시간이라(AGENTS.md §2.2) 측정을 끄는
   순간 회의 시간이 통째로 0 이 되고, 그러면 회의가 잦은 사람은 이 앱을
   쓸 이유가 없어집니다. 그래서 **알림만** 끕니다.

   구현은 스냅숏 하나입니다. 켤 때 지금까지의 누적을 적어 두고, 끌 때
   차이를 냅니다 — 회의용 카운터를 따로 두면 두 군데서 같은 값을 세게
   되고, 둘이 어긋나는 순간 어느 쪽이 맞는지 알 수 없습니다.

   끌 때 요약을 한 번 보여 줍니다. 회고 화면을 쓰지 않는 이유는 그게
   "세션을 끝내야 볼 수 있는" 화면이기 때문입니다 — 회의는 세션 중간에
   끝나므로 그 규칙을 깨지 않으려고 자리에 카드로 둡니다. */
const QUIET = { on: false, at: 0, snap: null };
const quietBtn = document.getElementById('cam-quiet');
const quietSum = document.getElementById('quiet-sum');

function quietSnapshot() {
  return { good: LIVE.goodMs, warn: LIVE.warnMs, bad: LIVE.badMs, axis: { ...AXIS.ms } };
}

function setQuiet(on) {
  on = !!on;
  if (on === QUIET.on) return;
  if (on) {
    QUIET.on = true; QUIET.at = Date.now(); QUIET.snap = quietSnapshot();
    if (quietSum) quietSum.hidden = true;
    sayEl.classList.remove('on'); clearTimeout(SAY.timer); SAY.until = 0;   // 떠 있던 말풍선도 즉시 내립니다
  } else {
    QUIET.on = false;
    showQuietSummary();
    QUIET.snap = null;
  }
  camWrap.classList.toggle('quiet', QUIET.on);
  if (quietBtn) {
    quietBtn.setAttribute('aria-pressed', String(QUIET.on));
    quietBtn.textContent = QUIET.on ? '🔇' : '🔔';
    quietBtn.title = QUIET.on ? '회의 모드 끄기' : '회의 모드 (알림만 끕니다)';
  }
  /* 새로고침 뒤로 **안 남깁니다.** 회의는 한 번 지나가는 것인데 이 상태가
     남으면, 알림이 꺼진 줄 모르고 계속 쓰다가 자세 알림을 영구히 잃습니다. */
}

function showQuietSummary() {
  if (!quietSum || !QUIET.snap) return;
  const s = QUIET.snap;
  const good = LIVE.goodMs - s.good, warn = LIVE.warnMs - s.warn, bad = LIVE.badMs - s.bad;
  const tot = good + warn + bad;
  const mins = Math.round((Date.now() - QUIET.at) / 60000);

  /* 판정이 1분도 안 돌았으면 비율을 안 씁니다. 30초를 100% 로 부풀려
     보여 주는 것은 지어낸 값입니다. */
  if (tot < 60000) {
    quietSum.innerHTML = `회의 모드를 <b>${mins || 1}분</b> 켰어요. 그동안 판정이
      충분히 돌지 않아 요약할 값이 없어요.<button type="button" data-quiet-close>확인</button>`;
    quietSum.hidden = false;
    return;
  }
  const pct = (v) => Math.round((v / tot) * 100);
  /* 회의 구간에서 가장 오래 벗어난 갈래 하나. 처방 표를 그대로 씁니다 —
     회의용 문구를 따로 쓰면 같은 말이 두 군데에 생깁니다. */
  const top = STRETCH
    .map((g) => ({ g, ms: g.axes.reduce((a, k) => a + ((AXIS.ms[k] || 0) - (s.axis[k] || 0)), 0) }))
    .sort((a, b) => b.ms - a.ms)[0];
  const worst = top && top.ms > 20000
    ? ` 제일 오래 벗어난 건 <b>${top.g.name}</b>이었어요.` : '';
  quietSum.innerHTML = `회의 모드 <b>${mins}분</b> — 그동안도 계속 재고 있었어요.
    편했던 시간 <b>${pct(good)}%</b> · 앞으로 나옴 ${pct(warn)}% · 오래 굽음 ${pct(bad)}%.${worst}
    <button type="button" data-quiet-close>확인</button>`;
  quietSum.hidden = false;
}

quietBtn?.addEventListener('click', () => setQuiet(!QUIET.on));
quietSum?.addEventListener('click', (e) => {
  if (e.target.closest('[data-quiet-close]')) quietSum.hidden = true;
});

/** 세션이 새로 시작하면 상한과 간격을 비웁니다. */
function resetSay() {
  SAY.until = 0; SAY.last = { warning: 0, bad: 0 }; SAY.count = { warning: 0, bad: 0 };
  clearTimeout(SAY.timer);
  sayEl.classList.remove('on');
}

/** 상태가 **바뀐 순간**에만 부릅니다. 유지되는 동안은 안 뜹니다. */
function saySomething(kind) {
  if (!SAY_TEXT[kind]) return;
  /* 꺼 두면 아무것도 안 뜹니다. 자세 판정과 코인은 그대로 돕니다 —
     알림만 끄는 것이지 기능을 끄는 것이 아닙니다. */
  if (ROOM.sayOn === 'off') return;
  if (QUIET.on) return;                 // 회의 중 — 여기가 회의 모드의 전부입니다
  const now = Date.now();
  /* 앉은 직후는 조용히 */
  if (SESSION.seatedAt && now - SESSION.seatedAt < SAY_QUIET_MS) return;
  if (kind !== 'good') {
    if (SAY.count[kind] >= SAY_MAX[kind]) return;              // 세션 상한
    if (now - SAY.last[kind] < SAY_GAP[kind]) return;          // 재알림 간격
    SAY.last[kind] = now; SAY.count[kind]++;
  }
  sayEl.textContent = SAY_TEXT[kind];
  sayEl.className = kind;
  sayEl.classList.add('on');
  SAY.until = now + SAY_SHOW[kind];
  clearTimeout(SAY.timer);
  SAY.timer = setTimeout(() => { sayEl.classList.remove('on'); SAY.until = 0; }, SAY_SHOW[kind]);
}

function setState(kind, msg) {
  const now = performance.now();
  if (LIVE.lastTick && LIVE.state !== 'idle') {
    const dt = now - LIVE.lastTick;
    /* rAF 는 탭이 숨으면 멈춥니다. 클램프가 없으면 다른 탭에 가 있던
       구간 전체가 복귀 첫 프레임에 직전 상태로 청구됩니다 — 앉기의
       존재 이유가 "다른 탭에서 집중" 이라 이건 설계된 경로입니다.
       ponytail: 숨은 동안은 판정 자체가 쉽니다(카메라는 켜져 있지만
       프레임을 안 읽습니다). 다른 탭에서도 계속 재려면 제품처럼
       Document PiP 창으로 옮겨야 합니다 — 이식 때 함께 옵니다. */
    if (dt < 2000) {
      if (LIVE.state === 'good') LIVE.goodMs += dt;
      else if (LIVE.state === 'warning') LIVE.warnMs += dt;
      else if (LIVE.state === 'bad') LIVE.badMs += dt;
    }
  }
  LIVE.lastTick = now;
  /* 회복 — bad 를 겪고 good 으로 돌아온 것만 셉니다. 랭킹이 이걸 씁니다. */
  const changed = LIVE.state !== kind;
  if (changed) feedRecovery(kind);          // 회복에 걸린 시간 — 자세 나이가 씁니다
  if (kind === 'bad') LIVE.wasBad = true;
  else if (kind === 'good' && LIVE.wasBad) { LIVE.recoveries++; LIVE.wasBad = false; award('recov', '회복'); }
  /* 말풍선은 **전이 순간**에만. 상태가 유지되는 동안 계속 뜨면 화면에
     붙박이가 됩니다. 좋았다 나빴다 하는 깜빡임은 POSE 의 HOLD
     (warning 1.5초 · bad 5초)가 이미 걸러 냅니다. */
  if (changed && kind !== 'idle') {
    if (kind === 'bad' || kind === 'warning') saySomething(kind);
    else if (kind === 'good' && LIVE.recoveries > 0) saySomething('good');
  }

  LIVE.state = kind;
  LIVE.msg = msg || STATE_TEXT[kind] || '';
  /* 표시등(camDot)은 판정 상태가 아니라 **카메라 수명**을 말합니다.
     판정 색을 섞으면 기준 없음·화면 이탈 때 카메라가 도는데도 꺼진
     것처럼 보입니다. 자세 색은 아래 stateLabel 이 담당합니다. */
  if (stateLabel) {
    stateLabel.textContent = LIVE.msg;
    stateLabel.style.color = kind === 'idle' ? 'var(--ink-3)' : STATE_COLOR[kind];
  }
  paintPosture(kind);
}

/* ================== 자세 테두리 ==================
   PIP 로 줄어들면 통계도 그래프도 안 보입니다. 그때 남는 것이 카메라 칸
   하나뿐이라, 그 테두리가 상태를 말합니다.

   색만 쓰지 않습니다. 적록색약은 인구의 8%(남성)이고, 우리 색은 하필
   초록(#2E9E5B)과 빨강(#E0483A)입니다 — 그 사람들에게는 둘이 같은 갈색
   비슷한 색으로 보입니다. 그래서 셋을 겹쳐 말합니다(WCAG 1.4.1):
     · 테두리 색
     · 모서리 배지 — **모양이 상태마다 다릅니다** (체크 / 느낌표 / 엑스)
     · 글자 — PIP 에서도 상태 문장을 남깁니다
   색을 못 봐도 배지 모양만으로 알 수 있어야 합니다. */
const camWrap = document.getElementById('cam-wrap');
const camBadgeI = document.getElementById('cam-badge-i');
const camBadgeT = document.getElementById('cam-badge-t');
const POSTURE_BADGE = {
  good:    { icon: '\u2713', text: '좋아요' },
  warning: { icon: '\u0021', text: '주의' },
  bad:     { icon: '\u2715', text: '굽음' },
};
/* ================== 캐릭터가 대신 무너집니다 ==================
   알림을 보내는 대신 내 캐릭터가 같이 처집니다. "자세가 나쁩니다" 는
   죄책감을 주고 사흘이면 끕니다. 내 것이 힘들어하면 고치게 됩니다.

   값 하나(droop 0~1)로 머리 높이·몸통 눌림·눈꺼풀을 함께 움직입니다.
   따로 두면 셋이 각자 놀아서 사람이 아니라 부품으로 보입니다. */
const DROOP = {
  now: 0,        // 화면에 그려지는 값 (부드럽게 따라옵니다)
  target: 0,     // 판정이 준 값
  flash: 0,      // 회복 반짝임 남은 양
  wasBad: false,
};
/* 지수이동평균 — 각도가 튀면 캐릭터가 경련합니다. 0.3초쯤 뒤따라옵니다.
   올라갈 때(무너질 때)보다 내려올 때(회복)를 빠르게 둡니다: 회복은
   바로 보상으로 느껴져야 하고, 무너짐은 천천히 와야 겁주지 않습니다. */
function feedDroop(dev) {
  /* 편차 1.0 이 "주의 들어감" 이라, 2.0 을 완전히 늘어진 상태로 봅니다. */
  DROOP.target = Math.max(0, Math.min(1, (dev - 0.6) / 1.4));
}
function stepDroop() {
  const d = DROOP.target - DROOP.now;
  DROOP.now += d * (d > 0 ? 0.06 : 0.14);
  /* 회복 순간 — 이 반짝임이 이 기능에서 제일 중요한 한 프레임입니다. */
  const bad = DROOP.now > 0.55;
  if (DROOP.wasBad && !bad) DROOP.flash = 1;
  DROOP.wasBad = bad;
  if (DROOP.flash > 0) DROOP.flash = Math.max(0, DROOP.flash - 0.05);
}

/* ================== 축별 누적 ==================
   판정은 프레임마다 축 10개의 편차를 이미 다 계산합니다(POSE.votes 의
   details). 그런데 지금까지 그중 **가장 큰 값 하나**만 쓰고 나머지는
   버렸습니다. 여기서 축마다 "기준을 넘긴 시간"을 쌓아 둡니다.

   왜 횟수가 아니라 **시간**인가 — 프레임률이 기기마다 15~30fps 로
   달라서 횟수를 세면 빠른 기기가 두 배로 나쁘게 나옵니다.

   이 값으로 두 가지를 만듭니다.
     · 축별 스트레칭 처방 — 제일 오래 넘긴 축 한둘만 처방
     · 자세 나이 — 유지력·회복속도와 함께 씀
   둘 다 **코인과 무관**합니다. 코인은 여전히 "사람이 있었나" 하나만 봅니다. */
const AXIS = { ms: {}, last: 0, recovMs: [], badAt: 0 };

function resetAxis() { AXIS.ms = {}; AXIS.last = 0; AXIS.recovMs = []; AXIS.badAt = 0; }

function feedAxis(v) {
  const now = performance.now();
  const dt = AXIS.last ? now - AXIS.last : 0;
  AXIS.last = now;
  /* 탭이 숨으면 rAF 가 멈춥니다. 돌아온 첫 프레임에 그 시간을 통째로
     청구하면 축 하나가 몇 분씩 뜁니다 — goodMs 와 같은 이유로 자릅니다. */
  if (!v || dt <= 0 || dt > 2000) return;
  v.details.forEach((d) => { if (d.primary && d.exceeded) AXIS.ms[d.key] = (AXIS.ms[d.key] || 0) + dt; });
}

/** 나쁨에 들어간 순간과 돌아온 순간을 재서 **회복에 걸린 시간**을 모읍니다.
    자세 나이가 정적인 각도만 보지 않게 하는 값입니다 — 훈련하면 실제로
    짧아지는 쪽이라, 노력이 숫자에 반영됩니다. */
function feedRecovery(kind) {
  if (kind === 'bad') { if (!AXIS.badAt) AXIS.badAt = Date.now(); }
  else if (kind === 'good' && AXIS.badAt) {
    AXIS.recovMs.push(Date.now() - AXIS.badAt);
    AXIS.badAt = 0;
  }
}

/* 축 → 처방. 10축을 **4갈래**로 묶습니다. 정면 웹캠 한 대로 믿을 수 있는
   갈래만 남긴 것이고, 어깨 말림(protraction)은 정면에서 앞뒤를 못 재서
   아예 뺐습니다 — 못 재는 것을 처방하면 처방 전체의 신뢰가 깎입니다.

   axes 는 그 갈래에 속한 축이고, 넘긴 시간을 합쳐서 갈래끼리 겨룹니다. */
const STRETCH = [
  {
    id: 'chin', name: '고개 숙임',
    axes: ['facePitchRatio', 'earEyeRatio', 'headPitchDeg'],
    why: '턱이 아래로 내려가 목 뒤가 계속 당겨졌어요',
    how: ['턱을 목 쪽으로 **당겨** 뒤통수를 위로 미세요 (5초 유지)',
          '천천히 고개를 뒤로 젖혀 천장을 3초 보세요', '10회 반복'],
  },
  {
    id: 'forward', name: '화면으로 다가감',
    axes: ['faceScaleRatio', 'shoulderSpan', 'headDistanceCm', 'headHeightRatio'],
    why: '몸이 조금씩 화면 쪽으로 나왔어요 — 거북목이 만들어지는 자리예요',
    how: ['의자 등받이에 등을 **완전히** 붙이고 앉으세요',
          '두 손을 뒤통수에 대고 팔꿈치를 뒤로 5초 여세요', '5회 반복 후 모니터를 한 뼘 뒤로'],
  },
  {
    id: 'tilt', name: '어깨 좌우 기울기',
    axes: ['shoulderTiltRatio'],
    why: '한쪽 어깨가 계속 올라가 있었어요',
    how: ['양 어깨를 귀까지 올렸다가 **툭** 떨어뜨리세요 (10회)',
          '오른손으로 머리를 오른쪽으로 당겨 왼목을 15초 늘이세요', '반대쪽도 같이'],
  },
  {
    id: 'lean', name: '몸통 치우침',
    axes: ['lateralOffsetRatio', 'torsoLean'],
    why: '몸통이 한쪽으로 기울어 앉아 있었어요',
    how: ['앉은 채로 두 발을 바닥에 나란히 두세요',
          '한 손을 위로 뻗어 반대쪽으로 기울여 옆구리를 15초 늘이세요', '반대쪽도 같이'],
  },
];

/** 넘긴 시간이 긴 갈래부터. 아무 축도 안 넘겼으면 빈 배열 —
    **처방할 게 없으면 안 합니다.** 없는데 지어내면 다음번에 안 믿습니다. */
function stretchPlan() {
  return STRETCH
    .map((g) => ({ g, ms: g.axes.reduce((s, k) => s + (AXIS.ms[k] || 0), 0) }))
    .filter((x) => x.ms > 20000)          // 20초는 넘겨야 처방합니다. 한 번 뒤척인 것은 처방거리가 아닙니다
    .sort((a, b) => b.ms - a.ms)
    .slice(0, 2);                          // 상위 둘까지. 넷을 다 주면 아무것도 안 합니다
}

/* ================== 자세 나이 ==================
   **재미 요소입니다.** 코인·랭킹과 완전히 분리돼 있고, 이 값이 낮다고
   얻는 것도 높다고 잃는 것도 없습니다(AGENTS.md §2.2 의 "자세를 점수화
   하지 않는다" 를 지키는 선입니다 — 점수가 보상에 연결되는 순간 규칙이
   깨집니다).

   정적인 각도만 보지 않습니다. 셋을 섞습니다.
     유지력   good 이었던 시간의 비율          (절반)
     회복속도 나쁨에서 돌아오는 데 걸린 시간   (3/10)
     이탈크기 축이 기준을 넘긴 시간의 비율     (2/10)
   뒤의 둘은 **훈련하면 실제로 좋아지는 값**입니다. 각도만 쓰면 체형이
   결정해 버려서 아무리 노력해도 안 바뀝니다.

   판정 5분 미만이면 계산하지 않습니다 — 표본이 모자란 수를 보여 주면
   그건 지어낸 값입니다. */
function postureAge() {
  const tot = LIVE.goodMs + LIVE.warnMs + LIVE.badMs;
  if (tot < 5 * 60000) return null;
  const hold = LIVE.goodMs / tot;                                   // 0~1, 클수록 좋음
  const recov = AXIS.recovMs.length
    ? AXIS.recovMs.reduce((a, b) => a + b, 0) / AXIS.recovMs.length / 1000
    : (LIVE.badMs > 0 ? 120 : 0);                                   // 나빴는데 못 돌아왔으면 최악으로 봅니다
  const over = Math.min(1, Object.values(AXIS.ms).reduce((a, b) => a + b, 0) / tot);
  const bad = 0.5 * (1 - hold) + 0.3 * Math.min(1, recov / 120) + 0.2 * over;
  return {
    age: Math.round(20 + bad * 45),                                 // 20 ~ 65
    hold: Math.round(hold * 100),
    recovSec: Math.round(recov),
    minutes: Math.round(tot / 60000),
  };
}

/** 계기판 — 20~65 를 반원 눈금에 얹습니다. 숫자만 쓰면 "45세" 가 좋은지
    나쁜지 알 수 없어서, 눈금 위 위치로 먼저 읽히게 합니다. */
function ageGaugeSvg(age) {
  const t = Math.max(0, Math.min(1, (age - 20) / 45));
  const a = Math.PI * (1 - t);                                      // 왼쪽(180도)에서 오른쪽(0도)으로
  const R = 62, cx = 78, cy = 74;
  const px = cx + R * Math.cos(a), py = cy - R * Math.sin(a);
  const col = age <= 30 ? '#2E9E5B' : age <= 45 ? '#D98324' : '#E0483A';
  /* 숫자는 **바늘 아래**에 둡니다. 반원 안에 넣으면 바늘이 지나가면서
     글자를 가로지릅니다(실제로 그렇게 나왔습니다). */
  return `<svg viewBox="0 0 156 118" width="156" height="118" role="img" aria-label="자세 나이 ${age}세">
    <path d="M16 74 A62 62 0 0 1 140 74" fill="none" stroke="#E3E0DC" stroke-width="13" stroke-linecap="round"/>
    <path d="M16 74 A62 62 0 0 1 140 74" fill="none" stroke="${col}" stroke-width="13" stroke-linecap="round"
          stroke-dasharray="${(Math.PI * R).toFixed(1)}" stroke-dashoffset="${(Math.PI * R * (1 - t)).toFixed(1)}"/>
    <line x1="${cx}" y1="${cy}" x2="${px.toFixed(1)}" y2="${py.toFixed(1)}" stroke="#3A322E" stroke-width="3" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="5" fill="#3A322E"/>
    <text x="16" y="90" font-size="10" fill="#9A8E88">20</text>
    <text x="130" y="90" font-size="10" fill="#9A8E88">65</text>
    <text x="${cx}" y="112" font-size="27" font-weight="700" text-anchor="middle" fill="${col}">${age}<tspan font-size="13" font-weight="600">세</tspan></text>
  </svg>`;
}

function paintPosture(kind) {
  if (!camWrap) return;
  camWrap.dataset.posture = kind || 'idle';
  const b = POSTURE_BADGE[kind];
  if (b && camBadgeI) { camBadgeI.textContent = b.icon; camBadgeT.textContent = b.text; }
}

/* ================== 얼굴 끄기 ==================
   끄는 것은 **보여 주기**뿐입니다. 판정은 그대로 돕니다 — 카메라를 끄면
   코인이 안 쌓이는 규칙이라(판정 시간이 분모), 얼굴을 가리고 싶은 사람이
   코인까지 잃으면 둘 중 하나를 포기하게 됩니다.
   빈 칸을 두지 않고 **내 캐릭터**를 세웁니다. 아무것도 없으면 카메라가
   고장난 것으로 읽힙니다. */
let faceOff = false, avatarCv = null;
/* ================== PIP 얼굴 ==================
   전신 32x48 을 PIP 에 넣으면 표정이 한두 픽셀이라 다섯 상태가 다 비슷해
   보입니다. 그렇다고 **고정 좌표로 머리를 자르면** 종마다 머리 높이가
   달라서(고슴도치는 y4 에서 시작하고 개구리는 y9) 어떤 종은 턱이 잘리고
   어떤 종은 위가 비어 보입니다. 앞 판이 그래서 잘려 보였습니다.

   그래서 이번에는 **얼굴을 따로 굽습니다.**

     1) 시트에서 머리 경계를 **재서** 잘라냅니다 (고정 crop 이 아닙니다).
        모자를 쓰면 꼭대기가 따라 올라가고, 가로도 재서 자르므로
        PIP 안에서 얼굴이 늘 한가운데에 꽉 찹니다.
     2) 눈을 지워 **민얼굴 판** 하나를 만듭니다 — 이것이 "하나의 얼굴"입니다.
     3) 그 판 위에 다섯 상태를 그립니다. 눈·눈썹·입이 상태마다 다릅니다.

   눈을 **지우고 다시 그리는** 것이 핵심입니다. 위에 얹기만 하면 원래 눈이
   비쳐서 감은 눈·웃는 눈을 만들 수 없고, 그래서 다섯 상태가 다 비슷해집니다.

   아래 표의 숫자는 assets/characters/*.png 의 down 프레임을 **직접 재서**
   넣은 값입니다. 종이 늘면 여기 한 줄이 늘어납니다. */
const FACE_BOTTOM = 24;                  // 머리·목 경계 (characters/layout.json 의 headBottomY)
const FACE_PAD = { top: 4, bot: 2, side: 3 };   // 위는 zᶻ·반짝임, 아래는 처짐 자리
/* 여백은 **아낍니다.** 머리가 17줄인데 위아래로 9줄을 비우면 PIP 안에서
   확대 배율이 한 단계 떨어져 얼굴이 그만큼 작아집니다. */

/* ex   : 눈칸 왼쪽 x 둘 (칸은 8종 모두 4x4 로 같습니다)
   ey   : 눈칸 윗줄 y
   skin : 눈을 지울 때 칠할 색 — 눈 둘레의 살갗 색입니다
   my   : 입을 그릴 줄. **null 이면 안 그립니다** — 펭귄·백조는 부리가
          얼굴의 절반이라 입을 얹으면 부리가 둘이 됩니다. 그 둘은
          눈·눈썹·땀만으로 다섯 상태를 만듭니다
   clear: 원래 입이 그려져 있는 종만. [x,y,w,h] 를 clearFill 로 덮고 새로 그립니다
   brow : 눈썹 색을 따로 줘야 하는 종. 없으면 종 테두리색(sp.line)을 씁니다 —
          펭귄만 머리가 새까매서 테두리색 눈썹이 안 보입니다 */
const FACE_SPEC = {
  turtle:   { ex: [10, 18], ey: 14, skin: '#8CD296', my: 19 },
  giraffe:  { ex: [10, 18], ey: 14, skin: '#FAF0C8', my: 20, clear: [13, 19, 6, 3], clearFill: '#E6C896' },
  penguin:  { ex: [10, 18], ey: 14, skin: '#FFFFFF', my: null, brow: '#FFFFFF' },
  hamster:  { ex: [10, 18], ey: 14, skin: '#DCAA78', my: 19 },
  frog:     { ex: [9,  19], ey: 10, skin: '#82DC3C', my: 19, clear: [13, 19, 6, 2], clearFill: '#FAF0A0' },
  hedgehog: { ex: [10, 18], ey: 14, skin: '#E6B48C', my: 20 },
  alpaca:   { ex: [10, 18], ey: 14, skin: '#FAE6D2', my: 19 },
  swan:     { ex: [10, 18], ey: 14, skin: '#FFFFFF', my: null },
};

/* 눈 — 다섯이 **눈 모양부터** 다릅니다. 눈썹·입만 바꾸면 이 크기에서
   좋음과 주의가 구별되지 않습니다. X 검은자 · o 하이라이트

   높이가 4 → 3 → 1 로 줄어드는 것이 좋음·주의·나쁨의 뼈대입니다.
   회복(⌒)과 잠듦(⌄)은 휘는 방향이 반대라 서로 안 헷갈립니다. */
const FACE_EYE = {
  good:    ['.XX.', 'XXoX', 'XXXX', '.XX.'],   // 크게 뜸
  warn:    ['....', 'XXXX', 'XXXX', '.XX.'],   // 윗꺼풀이 내려옴 (하이라이트도 사라집니다)
  bad:     ['....', '....', 'XXXX', '....'],   // 실눈
  recover: ['....', '.XX.', 'X..X', '....'],   // ⌒ 웃는 눈
  sleep:   ['....', 'X..X', '.XX.', '....'],   // ⌄ 감은 눈
};

/* 머리 경계 — 시트마다 한 번만 잽니다. 옷을 갈아입으면 시트 객체가
   새로 만들어지므로 WeakMap 이면 저절로 다시 재고 저절로 버려집니다. */
const faceBoxCache = new WeakMap();
function faceBox(sheet) {
  let b = faceBoxCache.get(sheet);
  if (b) return b;
  const H = FACE_BOTTOM + 1;
  const c = document.createElement('canvas');
  c.width = CHAR_W; c.height = H;
  const cg = c.getContext('2d');
  cg.imageSmoothingEnabled = false;
  cg.drawImage(sheet, CHAR_W * ITEM_DIR.down, 0, CHAR_W, H, 0, 0, CHAR_W, H);
  let px;
  try { px = cg.getImageData(0, 0, CHAR_W, H).data; } catch { px = null; }
  let x0 = CHAR_W, x1 = -1, y0 = H;
  if (px) {
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < CHAR_W; x++) {
        if (px[(y * CHAR_W + x) * 4 + 3] <= 40) continue;
        if (x < x0) x0 = x;
        if (x > x1) x1 = x;
        if (y < y0) y0 = y;
      }
    }
  }
  if (x1 < 0) { x0 = 4; x1 = 27; y0 = 6; }      // 빈 시트 방어 — 없는 값으로 나누지 않게
  b = { x0, x1, y0 };
  faceBoxCache.set(sheet, b);
  return b;
}

/** 얼굴 한 장을 1x 격자에 굽습니다. 확대한 화면에 직접 그리면 선 굵기가
    픽셀 격자에 안 맞아 표정만 매끈해지므로, 작게 그린 뒤 통째로 키웁니다.
    state: good / warn / bad / recover / sleep — 이 함수가 유일한 그리는 곳입니다. */
function bakeFace(sheet, sp, state, droop, flash) {
  const F = FACE_SPEC[sp.slug] || FACE_SPEC.turtle;
  const bx = faceBox(sheet);
  const hw = bx.x1 - bx.x0 + 1, hh = FACE_BOTTOM - bx.y0 + 1;
  const W = hw + FACE_PAD.side * 2, H = hh + FACE_PAD.top + FACE_PAD.bot;

  const t = document.createElement('canvas');
  t.width = W; t.height = H;
  const g = t.getContext('2d');
  g.imageSmoothingEnabled = false;

  /* 처짐 — 나쁠수록 내려가고, 회복하는 순간 한 번 튀어오릅니다. */
  const drop = Math.round(droop * 2) + (state === 'sleep' ? 1 : 0) - (state === 'recover' ? 1 : 0);
  const ox = FACE_PAD.side - bx.x0, oy = FACE_PAD.top + drop - bx.y0;
  g.drawImage(sheet, CHAR_W * ITEM_DIR.down + bx.x0, bx.y0, hw, hh,
              FACE_PAD.side, FACE_PAD.top + drop, hw, hh);

  const ink = sp.line;
  const px = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x + ox, y + oy, w, h); };

  /* ① 민얼굴 — 눈을 지웁니다. 여기까지가 다섯 상태가 공유하는 "하나의 얼굴". */
  F.ex.forEach((x) => px(x, F.ey, 4, 4, F.skin));
  if (F.clear) px(F.clear[0], F.clear[1], F.clear[2], F.clear[3], F.clearFill);

  /* ② 눈 — 상태별 모양표를 그대로 찍습니다. */
  const eye = FACE_EYE[state] || FACE_EYE.good;
  F.ex.forEach((ex) => {
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
      const ch = eye[r][c];
      if (ch === 'X') px(ex + c, F.ey + r, 1, 1, ink);
      else if (ch === 'o') px(ex + c, F.ey + r, 1, 1, '#FFFFFF');
    }
  });

  /* ③ 눈썹 — 주의·나쁨만. 안쪽 끝이 내려간 팔자입니다.
     개구리는 눈이 머리 꼭대기에 붙어 있어 눈썹 자리가 없습니다.
     자리가 없으면 그리지 않습니다 — 억지로 그리면 머리 위에 뜹니다. */
  const lift = state === 'bad' ? 4 : 3;
  if ((state === 'warn' || state === 'bad') && F.ey - lift >= bx.y0) {
    const bi = F.brow || ink;
    px(F.ex[0], F.ey - lift, 2, 1, bi);         px(F.ex[0] + 2, F.ey - lift + 1, 2, 1, bi);
    px(F.ex[1] + 2, F.ey - lift, 2, 1, bi);     px(F.ex[1], F.ey - lift + 1, 2, 1, bi);
  }

  /* ④ 입 — 부리 있는 종(펭귄·백조)은 건너뜁니다. */
  if (F.my != null) {
    const mx = 15, my = F.my;
    if (state === 'good') {                       // 살짝 ∪
      px(mx, my, 2, 1, ink); px(mx - 1, my - 1, 1, 1, ink); px(mx + 2, my - 1, 1, 1, ink);
    } else if (state === 'warn') {                // 일자
      px(mx - 1, my, 4, 1, ink);
    } else if (state === 'bad') {                 // ∧ — 양 끝이 내려갑니다
      px(mx, my, 2, 1, ink); px(mx - 1, my + 1, 1, 1, ink); px(mx + 2, my + 1, 1, 1, ink);
    } else if (state === 'recover') {             // 활짝
      px(mx - 1, my, 4, 1, ink); px(mx, my + 1, 2, 1, ink);
      px(mx - 2, my - 1, 1, 1, ink); px(mx + 3, my - 1, 1, 1, ink);
    } else {                                      // 잠듦 — 작게
      px(mx, my, 2, 1, ink);
    }
  }

  /* ⑤ 부가 — 땀·반짝임·zᶻ. 상태를 하나 더 겹쳐 읽게 합니다. */
  const drip = (x, y) => { px(x, y, 1, 2, '#7EC8F0'); px(x, y + 2, 1, 1, '#BFE6FA'); };
  if (state === 'warn') drip(F.ex[1] + 4, F.ey + 2);
  if (state === 'bad') { drip(F.ex[1] + 4, F.ey + 1); drip(F.ex[0] - 1, F.ey + 3); }
  if (state === 'recover') {
    [[F.ex[0] - 3, F.ey - 1], [F.ex[1] + 6, F.ey - 2]].forEach(([x, y]) => {
      px(x, y - 1, 1, 3, '#FFE9A8'); px(x - 1, y, 3, 1, '#FFE9A8');
    });
  }
  if (state === 'sleep') {
    /* zᶻ 를 글자로 찍으면 안티에일리어싱이 껴서 이 배율에서 뭉갭니다.
       픽셀로 그리고, 밝은 얼굴에도 어두운 얼굴에도 보이도록 흰 테를 두릅니다. */
    const zed = (x, y) => {
      g.fillStyle = '#5A4A44';
      g.fillRect(x, y, 3, 1);                           // 윗줄
      g.fillRect(x + 1, y + 1, 1, 1);                   // 대각
      g.fillRect(x, y + 2, 3, 1);                       // 아랫줄
    };
    /* **왼쪽** 위로 올립니다 — 오른쪽 위는 얼굴끄기·자리옮기기 단추 자리라
       거기 두면 zᶻ 가 단추에 걸립니다. */
    zed(4, 2); zed(0, 0);
  }

  if (flash > 0) {
    /* 회복 섬광. source-atop 이라야 **그려진 픽셀에만** 얹힙니다 —
       source-over/lighter 로 사각형을 덮으면 투명한 배경까지 밝아져서
       얼굴 주위에 네모난 판이 생기고 표정이 하얗게 날아갑니다. */
    g.globalCompositeOperation = 'source-atop';
    g.fillStyle = 'rgba(255,244,190,' + (0.2 * flash).toFixed(3) + ')';
    g.fillRect(0, 0, W, H);
    g.globalCompositeOperation = 'source-over';
  }
  return t;
}

function faceState(droop, flash) {
  if (LIVE.state === 'idle') return 'sleep';      // 회의·자리비움 — 판정이 안 도는 시간
  if (flash > 0) return 'recover';                // 막 좋아진 순간이 이 기능의 보상입니다
  if (droop > 0.55) return 'bad';
  if (droop > 0.22) return 'warn';
  return 'good';
}

function drawCamAvatar() {
  if (!faceOff) return;
  const host = document.getElementById('cam-avatar');
  if (!host) return;
  const sheet = (window.GIRIN_CHAR && GIRIN_CHAR.mine && GIRIN_CHAR.mine()) || null;
  if (!sheet) return;
  if (!avatarCv) { avatarCv = document.createElement('canvas'); host.prepend(avatarCv); }

  const sp = speciesOf(ROOM.character);
  const t = bakeFace(sheet, sp, faceState(DROOP.now, DROOP.flash), DROOP.now, DROOP.flash);

  /* PIP 안에 꽉 채워 가운데 둡니다. 아래 20 은 이름 알약 자리입니다. */
  const box = camWrap.getBoundingClientRect();
  const z = Math.max(2, Math.floor(Math.min(box.width / t.width, (box.height - 14) / t.height)));
  avatarCv.width = t.width * z; avatarCv.height = t.height * z;
  const o = avatarCv.getContext('2d');
  o.imageSmoothingEnabled = false;
  o.clearRect(0, 0, avatarCv.width, avatarCv.height);
  o.drawImage(t, 0, 0, t.width, t.height, 0, 0, avatarCv.width, avatarCv.height);
}
function setFaceOff(v) {
  faceOff = !!v;
  camWrap.classList.toggle('face-off', faceOff);
  const btn = document.getElementById('cam-face');
  if (btn) {
    btn.setAttribute('aria-pressed', String(faceOff));
    btn.textContent = faceOff ? '\uD83D\uDE36' : '\uD83D\uDE42';
    btn.title = faceOff ? '얼굴 켜기' : '얼굴 끄기 (판정은 계속 돕니다)';
  }
  if (faceOff) drawCamAvatar();
}
document.getElementById('cam-face')?.addEventListener('click', () => setFaceOff(!faceOff));
document.getElementById('cam-move')?.addEventListener('click', () => {
  const p = document.getElementById('session');
  p.classList.toggle('up');
  document.body.classList.toggle('pip-up', p.classList.contains('up'));
  saveJSON('girin.pipUp', p.classList.contains('up'));
});
window.addEventListener('resize', drawCamAvatar);

setInterval(() => {
  if (!faceOff) return;
  const before = DROOP.now;
  stepDroop();
  if (Math.abs(DROOP.now - before) > 0.002 || DROOP.flash > 0) drawCamAvatar();
}, 50);

/* ================== 카메라 ================== */
/* HUD 의 촬영 고지 — 켜짐 / 꺼짐 / 거부됨 셋뿐입니다. 미리보기를 숨긴
   사람에게는 이 글자가 카메라가 돌고 있다는 유일한 고지입니다. */
const camLive = document.getElementById('cam-live');
function noteCam(text, on) {
  camLive.textContent = text;
  camLive.classList.toggle('live', !!on);
}

async function startCamera() {
  /* 이미 열려 있으면 그대로 둡니다. 두 번 열면 앞 스트림이 stop 없이
     버려져 카메라 LED 가 안 꺼지고, poseLoop rAF 사슬이 둘이 됩니다. */
  if (camStream) return;
  /* 패널은 띄우지 않습니다. 카메라가 도는 것과 화면에 자기 얼굴이
     떠 있는 것은 다른 일이고, 후자는 집중 공간에 앉을 때만입니다.
     상태는 HUD 글자가 말합니다 — 거부됐을 때도 거기 남습니다. */
  camMsg.textContent = '카메라를 여는 중이에요';
  camMsg.hidden = false;
  setState('idle', '측정 준비');
  if (!navigator.mediaDevices?.getUserMedia) {
    camMsg.textContent = '이 브라우저에서는 카메라를 열 수 없어요.';
    noteCam('카메라 꺼짐', false);
    return;
  }
  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' },
      audio: false,
    });
    video.srcObject = camStream;
    video.hidden = false;
    await video.play();
    camMsg.hidden = true;
    camDot.classList.add('live');
    noteCam('카메라 켜짐', true);
    loadPose();
  } catch (err) {
    video.hidden = true;
    camMsg.hidden = false;
    const denied = err?.name === 'NotAllowedError';
    camMsg.textContent = denied
      ? '카메라를 거부했어요. 주소창 왼쪽에서 허용하면 다시 켜집니다.'
      : '카메라를 열지 못했어요. 미리보기 창에서는 항상 막힙니다 — 크롬에서 직접 열어 주세요.';
    noteCam(denied ? '카메라 거부됨' : '카메라 꺼짐', false);
  }
}

function stopCamera() {
  poseRunning = false;
  CAL.on = false;                    // 기준을 재던 중이면 그것도 멈춥니다
  LIVE.on = false;
  setState('idle', '측정 준비');
  if (camStream) { camStream.getTracks().forEach((t) => t.stop()); camStream = null; }
  video.srcObject = null;
  video.hidden = true;
  octx.clearRect(0, 0, overlay.width, overlay.height);
  poseFps = 0;
  camDot.classList.remove('live');
  noteCam('카메라 꺼짐', false);
  showPip(false);
}

async function loadPose() {
  camMsg.hidden = false;
  camMsg.textContent = '자세 판정 모델을 받는 중이에요';
  try {
    await POSE.load();
    camMsg.hidden = true;
    LIVE.smoother = new POSE.Smoother();
    LIVE.arb = POSE.arbiter();
    LIVE.profile = BASELINE || null;   // votes() 계약: 표가 아니라 기준선 객체
    LIVE.zone = zoneId;
    /* lastTick 리셋은 남깁니다 — 없으면 재시작 첫 프레임이 꺼져 있던
       공백 전체를 이전 상태에 청구합니다. good/warn/bad 누적은 세션의
       것이라 여기서 지우지 않습니다. 카메라가 세션 중에 다시 붙어도
       (권한 재허용 등) 이미 쌓인 기록이 날아가면 안 됩니다. */
    LIVE.frames = 0; LIVE.seen = 0; LIVE.lastTick = 0; LIVE.wasBad = false;
    LIVE.on = true;
    poseRunning = true;
    if (!LIVE.profile) setState('idle', '아직 기준을 못 잡았어요');
    poseLoop();
    startCalibrate();             // 세션 시작 10초 — 기준을 여기서 잡습니다
  } catch {
    camMsg.hidden = false;
    camMsg.textContent = '판정 모델을 받지 못했어요 (오프라인이거나 CDN 차단).';
  }
}

/* 뼈대 — 사람이 자기가 어떻게 잡히는지 보는 용도입니다.
   판정은 이 그림이 아니라 아래 votes/step 이 합니다. */
const SKELETON = [[11,12],[11,23],[12,24],[23,24],[11,13],[13,15],[12,14],[14,16],[0,11],[0,12],[7,8]];
function drawSkeleton(lm, color) {
  const w = video.videoWidth, h = video.videoHeight;
  if (overlay.width !== w) { overlay.width = w; overlay.height = h; }
  octx.clearRect(0, 0, w, h);
  if (!lm) return;
  octx.strokeStyle = color; octx.lineWidth = Math.max(2, w / 240);
  octx.beginPath();
  for (const [a, b] of SKELETON) {
    if (!lm[a] || !lm[b]) continue;
    octx.moveTo(lm[a].x * w, lm[a].y * h);
    octx.lineTo(lm[b].x * w, lm[b].y * h);
  }
  octx.stroke();
  octx.fillStyle = color;
  for (const i of [0, 7, 8, 11, 12, 23, 24]) {
    if (!lm[i]) continue;
    octx.beginPath(); octx.arc(lm[i].x * w, lm[i].y * h, Math.max(2.5, w / 190), 0, 7); octx.fill();
  }
}

/* ---- 판정 루프 ----
   room-flow 의 것을 그대로 옮겼습니다. 순서가 중요합니다 — 프레임을
   먼저 걸러 내고, 남은 것만 투표에 넣습니다. 걸러 내는 이유가 서로
   다르므로 안내 문구도 다릅니다. */
function poseLoop() {
  if (!poseRunning) return;
  requestAnimationFrame(poseLoop);
  if (!video || video.readyState < 2 || !POSE.ready()) return;

  const now = performance.now();
  /* ~15fps 로 자릅니다. 걷는 동안에도 판정이 돌게 되면서 동기 추론
     2개(pose+face)가 월드 렌더와 같은 rAF 를 나눠 쓰게 됐습니다 —
     안 자르면 메인스레드가 마릅니다. HOLD(경고 1.5초·굽음 5초)보다
     훨씬 촘촘해서 판정 품질은 그대로입니다. */
  if (now - lastDetect < 66) return;
  lastDetect = now;
  const out = POSE.detect(video, now, LIVE.smoother);
  if (!out) return;
  poseFrames++; LIVE.frames++;

  const a = out.analysis;
  if (!a || !a.faceCoreOk || !a.bothShouldersOk || !a.inFrame) {
    drawSkeleton(out.landmarks, STATE_COLOR.idle);
    setState('idle', '화면에서 벗어났어요');
    LIVE.arb = POSE.arbiter();
    return;
  }
  if (a.shoulderWidth < POSE.MIN_SHOULDER_WIDTH) {
    drawSkeleton(out.landmarks, STATE_COLOR.idle);
    setState('idle', '조금 더 가까이 앉아 주세요');
    return;
  }
  if (out.multi) {
    drawSkeleton(out.landmarks, STATE_COLOR.idle);
    setState('idle', '두 명 이상 보여요');
    return;
  }
  if (a.severeRotation) {
    /* 고개를 많이 돌리면 코 기반 축이 전부 못 믿을 값이 됩니다.
       이탈로 치지 않고 측정 제한으로 둡니다. */
    drawSkeleton(out.landmarks, STATE_COLOR.idle);
    setState('idle', '고개를 돌리는 중이에요');
    return;
  }
  if (!LIVE.profile) {
    drawSkeleton(out.landmarks, STATE_COLOR.idle);
    setState('idle', '아직 기준을 못 잡았어요');
    return;
  }
  LIVE.seen++;
  /* 이번 프레임의 **원본 축값**입니다. 러너가 이걸 씁니다.
     판정 결과(votes.details)로는 안 됩니다 — 거기 deviation 은
     Math.max(0, …) 라 "벗어난 쪽" 만 남고, 러너가 필요한 "고개를 든 쪽"
     은 전부 0 으로 깎여 있습니다. */
  LIVE.features = a.features; LIVE.featAt = now;

  const q = a.meanVisibility >= 0.6;
  const v = POSE.votes(a.features, LIVE.profile, SENSITIVITY, q);
  /* 기준에 없는 축이 너무 많으면 판정하지 않습니다 — 기준을 맞출 때와
     지금의 조명·거리가 너무 다르다는 뜻입니다. */
  if (v.usedFeatureCount < 3) {
    drawSkeleton(out.landmarks, STATE_COLOR.idle);
    setState('idle', '기준과 화면이 달라요');
    return;
  }

  LIVE.arb = POSE.step(LIVE.arb, v, now);
  const s = LIVE.arb.current;
  drawSkeleton(out.landmarks, STATE_COLOR[s]);
  /* 캐릭터가 따라 처지는 데 쓰는 값. 좋음/주의/나쁨 세 칸으로는 캐릭터가
     계단처럼 움직여서, **가장 벗어난 축의 편차**를 그대로 씁니다.
     절대 각도가 아니라 본인 기준선 대비라(median·MAD) 거북목인 사람이
     켜자마자 처져 있지 않습니다 — 이게 이 값을 쓰는 이유입니다. */
  feedDroop(v && isFinite(v.maxPrimary) ? v.maxPrimary : 0);
  feedAxis(v);                        // 축별 누적 — 처방과 자세 나이가 이걸 씁니다
  setState(s);
}

/* ================== 10초 기준 맞추기 ==================
   시간을 채우는 이유 — 한순간만 보면 그 순간의 자세가 기준이 되어
   세션 내내 어긋납니다. 표본이 일찍 쌓여도 끝내지 않습니다.

   30초에서 10초로 줄였습니다. 온보딩에서 가입 도중에 요구하기엔 30초가
   길기 때문인데, **시간만 줄이면 반드시 실패합니다.** 표본은 프레임마다
   쌓이고, 판정이 도는 실효 프레임률은 15~30fps 입니다.

     30초 → 450~900 프레임   (하한 150 대비 넉넉)
     10초 → 150~300 프레임   (하한 150 이면 경계선)

   게다가 자세가 나쁘거나 움직인 프레임은 버립니다. 10초 중 3초만
   뒤척여도 하한에 미달합니다. 그래서 하한을 같이 내렸습니다.

     CAL_MIN_SAMPLES     150 → 70   (중앙값·MAD 는 n=70 이면 충분합니다.
                                     평균이 아니라 중앙값이라 이상치에 강합니다)
     CAL_BUCKETS           6 → 4    (10초를 6등분하면 구간당 1.67초라
                                     한 번 기침하면 구간 하나가 통째로 빕니다)
     CAL_MIN_PER_FEATURE  60 → 28   (같은 비율) */
const CAL = { on: false, t0: 0, samples: [], widths: [], last: null, badMsg: '' };
const CAL_MS = 10000, CAL_BUCKETS = 4, CAL_MIN_SAMPLES = 70;
const CAL_MIN_PER_FEATURE = 28, CAL_MOVE_LIMIT = 0.2;

/* 기준을 맞추는 순간에는 "기준 대비" 가 아직 없어서 절대값으로만
   거릅니다. 전부 사람마다 안 변하는 단위입니다 — 각도(도), 거리(cm),
   어깨폭으로 나눈 비율. 체형처럼 사람마다 다른 값은 쓰지 않습니다. */
const CAL_PITCH_DOWN = 14, CAL_PITCH_UP = 14, CAL_ROLL = 10;
const CAL_NEAR_CM = 38, CAL_TILT = 0.075;

function calBadPosture(a, head) {
  CAL.badMsg = '';
  if (head) {
    if (head.headPitchDeg > CAL_PITCH_DOWN) { CAL.badMsg = '고개가 숙여져 있어요. 턱을 살짝 당기고 정면을 봐 주세요'; return true; }
    if (head.headPitchDeg < -CAL_PITCH_UP)  { CAL.badMsg = '턱이 들려 있어요. 시선을 화면 높이로 맞춰 주세요'; return true; }
    if (Math.abs(head.headRollDeg) > CAL_ROLL) { CAL.badMsg = '고개가 한쪽으로 기울었어요. 수평으로 세워 주세요'; return true; }
    if (head.headDistanceCm < CAL_NEAR_CM) { CAL.badMsg = '화면에 너무 가까워요. 등을 붙이고 한 뼘만 물러나 주세요'; return true; }
  }
  const tilt = a.features.shoulderTiltRatio;
  if (tilt !== undefined && tilt > CAL_TILT) { CAL.badMsg = '어깨가 한쪽으로 기울었어요. 양쪽 높이를 맞춰 주세요'; return true; }
  return false;
}
function calMoved(next, prev) {
  if (!prev) return false;
  return ['faceScaleRatio', 'headHeightRatio', 'lateralOffsetRatio'].some((k) => {
    const x = next[k], y = prev[k];
    return x !== undefined && y !== undefined && Math.abs(x - y) > CAL_MOVE_LIMIT;
  });
}

function startCalibrate() {
  if (CAL.on || !POSE.ready() || !camStream) return;
  CAL.on = true; CAL.t0 = performance.now();
  CAL.samples = []; CAL.widths = []; CAL.last = null; CAL.badMsg = '';
  poseRunning = false;                    // 판정 루프를 잠시 내리고 수집만
  LIVE.smoother = new POSE.Smoother();
  calLoop();
}
function calLoop() {
  if (!CAL.on) return;
  requestAnimationFrame(calLoop);
  if (!video || video.readyState < 2) return;

  const now = performance.now();
  const elapsed = now - CAL.t0;
  const out = POSE.detect(video, now, LIVE.smoother);
  const a = out && out.analysis;

  if (a && a.faceCoreOk && a.bothShouldersOk && a.inFrame && !out.multi && !a.severeRotation) {
    drawSkeleton(out.landmarks, STATE_COLOR.good);
    if (calBadPosture(a, a.head)) {
      camMsg.hidden = false; camMsg.textContent = CAL.badMsg;
    } else if (!calMoved(a.features, CAL.last)) {
      camMsg.hidden = true;
      CAL.samples.push({ f: a.features, bucket: Math.min(CAL_BUCKETS - 1, Math.floor(elapsed / (CAL_MS / CAL_BUCKETS))) });
      CAL.widths.push(a.shoulderWidth);
      CAL.last = a.features;
    }
  } else {
    drawSkeleton(out && out.landmarks, STATE_COLOR.idle);
    camMsg.hidden = false;
    camMsg.textContent = '얼굴과 어깨가 함께 보이게 앉아 주세요';
  }

  const left = Math.max(0, Math.ceil((CAL_MS - elapsed) / 1000));
  if (stateLabel) {
    stateLabel.textContent = '기준 맞추는 중 · ' + left + '초';
    stateLabel.style.color = 'var(--teal-700)';
  }
  /* 입장 직후 기준을 잡을 때는 패널이 안 떠 있습니다 — HUD 글자가
     그동안 유일한 창구입니다. */
  noteCam('기준 맞추는 중 · ' + left + '초', true);
  if (elapsed >= CAL_MS) calFinish();
}

function calFinish() {
  CAL.on = false;
  const covered = new Set(CAL.samples.map((s) => s.bucket)).size;

  const fail = (msg) => {
    camMsg.hidden = false; camMsg.textContent = msg;
    /* 이번 10초는 버려도, 지난 세션에 잡아 둔 기준이 있으면 그걸로
       계속 봅니다. 없으면 idle 로 남고, 집중 공간에 앉을 때 다시
       시도합니다(sit 참고). */
    LIVE.profile = BASELINE || null;   // votes() 계약: 표가 아니라 기준선 객체
    setState('idle', LIVE.profile ? '지난 기준으로 볼게요' : '기준을 못 맞췄어요');
    noteCam(LIVE.profile ? '카메라 켜짐' : '기준 없음', !!LIVE.profile);
    poseRunning = true; poseLoop();
  };
  if (CAL.samples.length < CAL_MIN_SAMPLES) {
    return fail('10초 중 앉아 있는 모습이 충분히 잡히지 않았어요. 얼굴과 어깨가 함께 보이는 자리에서 다시 해 주세요.');
  }
  if (covered < CAL_BUCKETS) {
    return fail('중간에 자리를 비운 구간이 있어요. 10초 내내 같은 자세로 앉아 주세요.');
  }

  /* 축마다 중앙값과 MAD. 표본이 모자란 축은 기준에서 뺍니다 — 책상에
     가려 엉덩이가 안 보이면 torsoLean 이 빠지고, 빠진 축은 세션에서도
     안 쓰이므로 없는 편이 정확합니다. */
  const feats = {};
  POSE.PRIMARY.concat(POSE.AUX).forEach((k) => {
    const vals = CAL.samples.map((s) => s.f[k]).filter((x) => x !== undefined);
    if (vals.length < CAL_MIN_PER_FEATURE) return;
    const m = POSE.median(vals);
    feats[k] = { median: m, mad: POSE.mad(vals, m), n: vals.length };
  });
  if (Object.keys(feats).length < 3) {
    return fail('기준으로 쓸 만한 값이 부족해요. 조명이 밝은 곳에서 다시 해 주세요.');
  }

  BASELINE = {
    version: 3,
    features: feats,
    shoulderWidthMedian: POSE.median(CAL.widths),
    sampleCount: CAL.samples.length,
    createdAt: Date.now(),
  };
  saveBaseline();

  /* **표가 아니라 기준선 객체를 통째로** 넣습니다. votes() 는
     `profile.features[k]` 를 읽습니다(src/features/posture-engine/classify.ts
     와 같은 계약). 표를 바로 넣으면 `feats.features` 가 undefined 라
     프레임마다 TypeError 가 나고, poseLoop 이 rAF 를 먼저 걸어 두어
     루프는 살아 있는 채로 **판정만 한 번도 확정되지 않습니다.** */
  LIVE.profile = BASELINE;
  LIVE.arb = POSE.arbiter();
  camMsg.hidden = true;
  setState('good', Object.keys(feats).length + '개 축으로 기준을 맞췄어요');
  noteCam('카메라 켜짐', true);
  poseRunning = true; poseLoop();
}

/* ==================================================================
   미니룸의 창

   싸이월드 미니룸이 그랬듯, 방 안의 물건이 곧 메뉴입니다. 걸어가서
   스페이스를 누르면 그 물건이 맡은 창이 열립니다 — 상단 메뉴바도,
   화면 전환도 없습니다.

   설정만 예외로 오른쪽 위 버튼입니다. 방 안 어디서든 눌러야 하는데
   그걸 맡을 물건을 하나 더 놓으면 방이 복잡해집니다.
   ================================================================== */
const panelEl = document.getElementById('panel');
const panelTitle = panelEl.querySelector('header b');
const panelKind = panelEl.querySelector('header u');
const panelBody = panelEl.querySelector('.body');
const panelTabs = panelEl.querySelector('.tabs');

/* 아직 서버가 없어 숫자는 이 기기에 남습니다. 지어낸 값이 아니라
   실제로 이 브라우저에서 쌓인 것만 보여 줍니다. */
const ROOM = {
  nickname: '익명의 기린',
  school: '명지대학교',
  schoolVerifiedAt: '',
  schoolDomain: '',
  character: '거북이',
  owned: [],              // 산 아이템 id
  worn: {},               // 칸(cat) 하나에 하나씩. 같은 칸을 사면 앞엣것이 벗겨집니다
  /* 방에 놓은 가구. 납작한 배열이라 그대로 테이블 한 줄씩이 됩니다
     (room_id, item_id, x, y). 캔버스나 PROP 참조를 담으면 안 됩니다 —
     저장은 JSON 이고, 나중에 서버로 갈 때도 같은 모양이어야 합니다.
     산 것은 하나씩이라 item id 가 곧 열쇠입니다. */
  decor: [],              // [{ id: 'fur-rug', x: 4, y: 5 }, ...]
  coins: 0,
  wallpaper: 'cream',
  floor: 'laminate',
  music: 'none',
  bgm: 'on',
  bgmTrack: 'auto',       // 'auto' = 장소마다 정해진 곡. 하나를 고르면 어디서나 그 곡
  sfxOn: 'on',
  camPeek: 'on',          // 세션 동안 웹캠 화면을 띄울지 (앉으면 작은 PIP 로 줄어듭니다)
  tint: {},               // 아이템 id -> 고른 색. 없으면 그려진 원래 색
  sayOn: 'on',            // 자세 말풍선을 캐릭터 머리 위에 띄울지
  chatOn: 'on',           // 남의 말을 화면에 띄울지 (숨겨도 입력줄은 남습니다)
  invite: null,
};
try {
  Object.assign(ROOM, JSON.parse(localStorage.getItem('girin.room') || '{}'));
} catch { /* 저장된 게 깨졌으면 기본값으로 갑니다 */ }
function saveRoom() {
  try { localStorage.setItem('girin.room', JSON.stringify(ROOM)); } catch { /* 무시 */ }
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ==================================================================
   학교 색

   학교마다 쓰는 색이 어두운 남색부터 형광까지 제각각입니다. 그대로
   화면에 얹으면 어떤 학교는 검은 얼룩이 되고 어떤 학교는 눈이 아픕니다.
   그래서 **색상과 채도는 그대로 두고 명도만** 30~55% 로 끌어옵니다.
   그 구간이 흰 UI 위에서도, 잔디 위 16px 캐릭터에서도 둘 다 읽힙니다.

   색을 쓰는 곳은 넷뿐입니다 — 과잠, 이름표 바탕, 마이페이지 강조,
   기숙사 소품 둘. 배경·버튼·글자는 무채색으로 둡니다. 학교 색이 화면
   전체를 물들이면 열 학교가 열 개의 다른 앱이 됩니다.

   아래 색값은 각 학교가 널리 쓰는 대표색을 눈으로 맞춘 **근삿값**입니다.
   실제 브랜드 가이드의 값으로 바꿔야 합니다.
   ================================================================== */
const SCHOOLS = [
  { name: '서울대학교',     domain: 'snu.ac.kr',     raw: '#00468B' },
  { name: '연세대학교',     domain: 'yonsei.ac.kr',  raw: '#0F4C81' },
  { name: '고려대학교',     domain: 'korea.ac.kr',   raw: '#862633' },
  { name: '성균관대학교',   domain: 'skku.edu',      raw: '#00563F' },
  { name: '한양대학교',     domain: 'hanyang.ac.kr', raw: '#0E4A84' },
  { name: '중앙대학교',     domain: 'cau.ac.kr',     raw: '#0B4DA2' },
  { name: '경희대학교',     domain: 'khu.ac.kr',     raw: '#8C1D40' },
  { name: '이화여자대학교', domain: 'ewha.ac.kr',    raw: '#00713C' },
  { name: '서강대학교',     domain: 'sogang.ac.kr',  raw: '#8B0029' },
  { name: '명지대학교',     domain: 'mju.ac.kr',     raw: '#003A70' },
];

function hexToHsl(hex) {
  const [r, g, b] = hexRGB(hex).map((v) => v / 255);
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  const l = (mx + mn) / 2;
  if (!d) return [0, 0, l];
  const s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
  const h = mx === r ? ((g - b) / d + (g < b ? 6 : 0))
          : mx === g ? (b - r) / d + 2
          : (r - g) / d + 4;
  return [h / 6, s, l];
}
function hslToHex(h, s, l) {
  const f = (n) => {
    const k = (n + h * 12) % 12;
    const a = s * Math.min(l, 1 - l);
    const v = l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
    return Math.round(v * 255).toString(16).padStart(2, '0');
  };
  return '#' + f(0) + f(8) + f(4);
}
/** 명도만 30~55% 구간으로 끌어옵니다. 색상·채도는 그 학교 것 그대로. */
function normalizeSchoolColor(hex) {
  const [h, s, l] = hexToHsl(hex);
  return hslToHex(h, s, Math.min(0.55, Math.max(0.30, l)));
}
SCHOOLS.forEach((s) => { s.color = normalizeSchoolColor(s.raw); });

const SCHOOL_BY_NAME = Object.fromEntries(SCHOOLS.map((s) => [s.name, s]));
/* 도메인 → 학교. 없으면 도메인을 그대로 보여 주고 "(미확인)" 을 붙입니다 —
   없는 학교를 지어내지 않습니다. */
const SCHOOL_BY_DOMAIN = Object.fromEntries(SCHOOLS.map((s) => [s.domain, s.name]));

const DEFAULT_SCHOOL_COLOR = '#5A6472';    // 미확인 학교 — 무채색에 가깝게
function schoolColorOf(name) {
  return (SCHOOL_BY_NAME[name] || {}).color || DEFAULT_SCHOOL_COLOR;
}
/** 내 색 — 과잠 · 이름표 · 마이페이지. 남의 방에 가도 내 학교입니다. */
function schoolColor() { return schoolColorOf(ROOM.school); }
/** 이 방 주인의 색 — 기숙사 소품. 기숙사는 늘 내 방이므로 내 학교 색입니다.
    (친구 방 방문 기능은 본 서비스의 화상 기능으로 대체되어 없앴습니다.) */
function roomColor() { return schoolColorOf(ROOM.school); }
/** 흰 판 위에 아주 옅게 까는 같은 색. 강조 칸의 바탕입니다. */
function schoolSoft(alpha) {
  const [r, g, b] = hexRGB(schoolColor());
  return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
}

/** 학교가 바뀌면 색이 닿는 곳을 전부 다시 칠합니다. */
function applySchoolColor() {
  const c = schoolColor();
  const root = document.documentElement.style;
  root.setProperty('--school', c);
  root.setProperty('--school-soft', schoolSoft(0.10));
  root.setProperty('--school-line', schoolSoft(0.30));
  jacketCanvas = null; dressedCache = null;                       // 과잠을 다시 굽습니다
  paintSchoolProps();
  /* ponytail: 원래는 여기서 기숙사 소품(페넌트·방석)도 학교 색으로 다시
     구웠습니다. 그 두 기물은 아직 이 판본에 없어 실내 보강 때 같이
     옮깁니다. 이름표는 이 제품에서 안 씁니다 — 머리 위에 이름을 띄우지
     않기로 한 결정이라 되살리지 않습니다. */
}
/** 바탕색 위에서 읽히는 글자색. 코랄 위 흰 글자를 금지한 것과 같은 이유로,
    학교 색도 밝기를 재서 잉크와 흰색 중 대비가 큰 쪽을 씁니다. */
function readableOn(hex) {
  const [r, g, b] = hexRGB(hex).map((v) => {
    const s = v / 255;
    return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
  });
  const L = 0.2126 * r + 0.7152 * g + 0.0722 * b;
  return (L + 0.05) / 0.05 > (1.05) / (L + 0.05) ? '#2A2320' : '#FFFFFF';
}

/* JSON 한 벌을 브라우저에 넣고 빼는 자리.
   병합 정리: 민철 판본에는 초대 코드(INVITE)가 없어서 이 헬퍼도 같이
   지워져 있었습니다. 초대 코드·설정·소리가 전부 이걸 쓰므로 되살립니다.
   깨진 값이 들어 있어도 화면이 죽지 않게 조용히 기본값으로 물러납니다. */
function loadJSON(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
}
function saveJSON(key, v) {
  try { localStorage.setItem(key, JSON.stringify(v)); } catch { /* 무시 */ }
}

/* 초대 코드 헬퍼.

   지금 월드에서 부르는 곳이 없습니다 — 코드를 쓰던 곳(친구 방 가기)을
   없앴고, 마이페이지의 초대 탭은 코드를 그 자리에서 직접 만듭니다.
   그래도 남겨 둡니다: 초대 코드는 본 서비스 기능이고, 서버(invites 표)에
   붙일 때 쓸 자리 표시가 각 메서드 주석에 적혀 있습니다. 지우면 그
   설계도까지 같이 사라집니다. */
const INVITE = {
  KEY: 'girin.invites',
  ABC: 'ABCDEFGHJKMNPQRSTUVWXYZ23456789',   // 0/O/1/I 는 뺐습니다 — 받아적다 틀립니다
  LEN: 6,

  all() { return loadJSON(this.KEY, {}); },
  /** 코드를 등록합니다. → supabase.from('invites').upsert(...) */
  publish(code, profile) {
    const a = this.all();
    a[code] = Object.assign({ at: Date.now() }, profile);
    saveJSON(this.KEY, a);
  },
  /** 코드로 사람을 찾습니다. → supabase.from('invites').select().eq('code', code) */
  lookup(code) { return this.all()[String(code || '').toUpperCase().trim()] || null; },
  /** → supabase.from('invites').delete().eq('code', code) */
  revoke(code) { const a = this.all(); delete a[code]; saveJSON(this.KEY, a); },

  make() {
    let c = '';
    for (let i = 0; i < this.LEN; i++) c += this.ABC[Math.floor(Math.random() * this.ABC.length)];
    return c;
  },
  valid(code) {
    const c = String(code || '').toUpperCase().trim();
    return c.length === this.LEN && [...c].every((ch) => this.ABC.includes(ch));
  },
  /** 내 코드를 만들고 등록합니다. 이미 있으면 프로필만 갱신합니다. */
  mine() {
    if (!ROOM.invite || !this.valid(ROOM.invite)) { ROOM.invite = this.make(); saveRoom(); }
    this.publish(ROOM.invite, {
      nickname: ROOM.nickname, school: ROOM.school, character: ROOM.character, self: true,
    });
    return ROOM.invite;
  },
};

/* 데모용 이웃 둘(DEMO_INVITES)과 방문 상태(VISIT)는 지웠습니다. 월드에서

   초대 코드 자체는 마이페이지에 남습니다 — 그쪽은 본 서비스가 씁니다. */

/** 이 기기에 쌓인 세션 기록. 없으면 없다고 말합니다. */
/* ================== 세션 기록 ==================
   같은 기기에서만 남습니다. 서버로 아무것도 안 보냅니다 — 이 제품이
   파는 약속이 그것입니다.

   한 행에 자세 통계까지 넣습니다. 전에는 { date, minutes, recoveries }
   셋뿐이라, 회고 화면이 그리는 좋음/주의/굽음 비율이 세션이 끝나는
   순간 사라졌습니다. 어제 회고를 다시 열 방법이 없었습니다. */
const ZONE_KO = { library: '도서관', mainhall: '본관', union: '학생회관', dorm: '기숙사',
                  arcade: '미니게임관', campus: '캠퍼스', clubshop: '동아리 상점' };
const SESS_KEY = 'girin.sessions';
const SESS_MAX = 200;                      // 약 반년치

function loadSessions() {
  try {
    const rows = JSON.parse(localStorage.getItem(SESS_KEY) || '[]');
    return Array.isArray(rows) ? rows : [];
  } catch { return []; }
}

/** 지금 세션을 한 행으로. 진행 중에도 부를 수 있습니다. */
function sessionRow() {
  return {
    date: dayKey(SESSION.startedAt || Date.now()),
    at: SESSION.startedAt || Date.now(),
    /* 저장 시점의 공간. 판정이 세션 내내 돌게 되면서 "판정이 돈 공간"
       은 하나가 아니게 됐습니다 — 마지막 자동저장이 남으므로 사실상
       세션을 마친 곳이 기록됩니다. LIVE.zone 은 카메라가 켜진 곳(거의
       늘 기숙사)이라 쓸모가 없어 버렸습니다. */
    zone: zoneId,
    minutes: Math.round(SESSION.seatedMs / 60000),
    seatedMs: SESSION.seatedMs,
    goodMs: Math.round(LIVE.goodMs),
    warnMs: Math.round(LIVE.warnMs),
    badMs: Math.round(LIVE.badMs),
    recoveries: LIVE.recoveries,
    coins: SESSION.coins || 0,
  };
}

/** 같은 세션은 **덮어씁니다.** at 이 열쇠라, 1분마다 저장해도 행이
    쌓이지 않고 마지막 상태만 남습니다. */
function saveSession() {
  if (!SESSION.startedAt) return;
  const row = sessionRow();
  /* 아무것도 안 한 세션은 안 남깁니다 — 지나가며 문만 연 것까지
     기록하면 목록이 의미를 잃습니다. */
  if (row.seatedMs < 30000 && row.goodMs + row.warnMs + row.badMs < 30000) return;
  try {
    const rows = loadSessions().filter((r) => r.at !== row.at);
    rows.push(row);
    rows.sort((a, b) => (a.at || 0) - (b.at || 0));
    localStorage.setItem(SESS_KEY, JSON.stringify(rows.slice(-SESS_MAX)));
  } catch { /* 저장 공간이 없으면 조용히 넘어갑니다 */ }
}

/** 마이페이지 숫자. 옛 행은 새 필드가 없으므로 0 으로 셉니다 —
    형식이 바뀌었다고 지난 기록을 버리면 세션 수와 총 시간까지 잃습니다. */
/* 병합 정리: 서버저장 판본에 이 이름의 더 단순한 함수(count·total·recov
   셋만 돌려주는 것)가 있어서 자동병합이 그쪽을 남겼습니다. 그런데 회고
   화면은 week·goodMs·byZone 까지 읽으므로, 그대로 두면 회고를 여는 순간
   pastSessionsHtml 이 s.week.map 에서 터집니다. 세션 행을 자세히 남기는
   이쪽 판본을 되살립니다 — sessionRow() 가 그 필드를 채웁니다. */
function myStats() {
  const rows = loadSessions();
  const sum = (k) => rows.reduce((a, r) => a + (r[k] || 0), 0);
  const good = sum('goodMs'), warn = sum('warnMs'), bad = sum('badMs');
  const judged = good + warn + bad;
  const byZone = {};
  for (const r of rows) byZone[r.zone || '기타'] = (byZone[r.zone || '기타'] || 0) + (r.minutes || 0);
  /* 최근 이레 — 날짜별 앉은 분 */
  const week = [];
  for (let i = 6; i >= 0; i--) {
    const d = dayKey(Date.now() - i * 86400000);
    week.push({ d, min: rows.filter((r) => r.date === d).reduce((a, r) => a + (r.minutes || 0), 0) });
  }
  return {
    count: rows.length,
    total: sum('minutes'),
    recov: sum('recoveries'),
    goodMs: good, warnMs: warn, badMs: bad, judged,
    /* 회복 시간 = 편안했던 시간. 판정이 돈 시간 대비 비율로 씁니다 */
    goodPct: judged > 0 ? Math.round((good / judged) * 100) : 0,
    goodMin: Math.round(good / 60000),
    byZone, week,
  };
}

/* ==================================================================

   여덟 색뿐인 이유: 이 여덟은 **여덟 종 털 위에서 전부 옷으로 읽히는**
   색입니다. 흰색은 백조·알파카에서, 검정은 펭귄에서, 밝은 초록은
   거북이·개구리에서, 주황은 기린에서 몸과 붙어 버립니다. 그래서 명도를
   30~55% 로 모으고 채도를 낮췄습니다 — 학교 색을 다루는 규칙과 같습니다.
   무지개를 늘어놓으면 고르는 재미보다 어느 게 옷인지 모르는 일이 먼저 옵니다.
   ================================================================== */
const TINTS = [
  { id: 'charcoal', name: '숯',     hex: '#3A3F4A' },
  { id: 'mist',     name: '안개',   hex: '#AEB8C4' },
  { id: 'navy',     name: '남색',   hex: '#3E5A8C' },
  { id: 'teal',     name: '청록',   hex: '#2F6E68' },
