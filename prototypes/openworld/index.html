   회의·발표 중에는 캐릭터가 말을 걸면 안 됩니다. 그런데 **측정을 끄면
   안 됩니다** — 코인의 분모가 판정 시간이라(AGENTS.md §2.2) 측정을 끄는
   순간 회의 시간이 통째로 0 이 되고, 그러면 회의가 잦은 사람은 이 앱을
   쓸 이유가 없어집니다. 그래서 **알림만** 끕니다.

   구현은 스냅숏 하나입니다. 켤 때 지금까지의 누적을 적어 두고, 끌 때
   차이를 냅니다 — 회의용 카운터를 따로 두면 두 군데서 같은 값을 세게
   되고, 둘이 어긋나는 순간 어느 쪽이 맞는지 알 수 없습니다.

   끌 때 요약을 한 번 보여 줍니다. 회고 화면을 쓰지 않는 이유는 그게
   "세션을 끝내야 볼 수 있는" 화면이기 때문입니다 — 회의는 세션 중간에
   끝나므로 그 규칙을 깨지 않으려고 자리에 카드로 둡니다. */
const QUIET = { on: false, at: 0, snap: null };
const quietBtn = document.getElementById('cam-quiet');
const quietSum = document.getElementById('quiet-sum');

function quietSnapshot() {
  return { good: LIVE.goodMs, warn: LIVE.warnMs, bad: LIVE.badMs, axis: { ...AXIS.ms } };
}

function setQuiet(on) {
  on = !!on;
  if (on === QUIET.on) return;
  if (on) {
    QUIET.on = true; QUIET.at = Date.now(); QUIET.snap = quietSnapshot();
    if (quietSum) quietSum.hidden = true;
    sayEl.classList.remove('on'); clearTimeout(SAY.timer); SAY.until = 0;   // 떠 있던 말풍선도 즉시 내립니다
  } else {
    QUIET.on = false;
    showQuietSummary();
    QUIET.snap = null;
  }
  camWrap.classList.toggle('quiet', QUIET.on);
  if (quietBtn) {
    quietBtn.setAttribute('aria-pressed', String(QUIET.on));
    quietBtn.textContent = QUIET.on ? '🔇' : '🔔';
    quietBtn.title = QUIET.on ? '회의 모드 끄기' : '회의 모드 (알림만 끕니다)';
  }
  /* 새로고침 뒤로 **안 남깁니다.** 회의는 한 번 지나가는 것인데 이 상태가
     남으면, 알림이 꺼진 줄 모르고 계속 쓰다가 자세 알림을 영구히 잃습니다. */
}

function showQuietSummary() {
  if (!quietSum || !QUIET.snap) return;
  const s = QUIET.snap;
  const good = LIVE.goodMs - s.good, warn = LIVE.warnMs - s.warn, bad = LIVE.badMs - s.bad;
  const tot = good + warn + bad;
  const mins = Math.round((Date.now() - QUIET.at) / 60000);

  /* 판정이 1분도 안 돌았으면 비율을 안 씁니다. 30초를 100% 로 부풀려
     보여 주는 것은 지어낸 값입니다. */
  if (tot < 60000) {
    quietSum.innerHTML = `회의 모드를 <b>${mins || 1}분</b> 켰어요. 그동안 판정이
      충분히 돌지 않아 요약할 값이 없어요.<button type="button" data-quiet-close>확인</button>`;
    quietSum.hidden = false;
    return;
  }
  const pct = (v) => Math.round((v / tot) * 100);
  /* 회의 구간에서 가장 오래 벗어난 갈래 하나. 처방 표를 그대로 씁니다 —
     회의용 문구를 따로 쓰면 같은 말이 두 군데에 생깁니다. */
  const top = STRETCH
    .map((g) => ({ g, ms: g.axes.reduce((a, k) => a + ((AXIS.ms[k] || 0) - (s.axis[k] || 0)), 0) }))
    .sort((a, b) => b.ms - a.ms)[0];
  const worst = top && top.ms > 20000
    ? ` 제일 오래 벗어난 건 <b>${top.g.name}</b>이었어요.` : '';
  quietSum.innerHTML = `회의 모드 <b>${mins}분</b> — 그동안도 계속 재고 있었어요.
    편했던 시간 <b>${pct(good)}%</b> · 앞으로 나옴 ${pct(warn)}% · 오래 굽음 ${pct(bad)}%.${worst}
    <button type="button" data-quiet-close>확인</button>`;
  quietSum.hidden = false;
}

quietBtn?.addEventListener('click', () => setQuiet(!QUIET.on));
quietSum?.addEventListener('click', (e) => {
  if (e.target.closest('[data-quiet-close]')) quietSum.hidden = true;
});

/** 세션이 새로 시작하면 상한과 간격을 비웁니다. */
function resetSay() {
  SAY.until = 0; SAY.last = { warning: 0, bad: 0 }; SAY.count = { warning: 0, bad: 0 };
  clearTimeout(SAY.timer);
  sayEl.classList.remove('on');
}

/** 상태가 **바뀐 순간**에만 부릅니다. 유지되는 동안은 안 뜹니다. */
function saySomething(kind) {
  if (!SAY_TEXT[kind]) return;
  /* 꺼 두면 아무것도 안 뜹니다. 자세 판정과 코인은 그대로 돕니다 —
     알림만 끄는 것이지 기능을 끄는 것이 아닙니다. */
  if (ROOM.sayOn === 'off') return;
  if (QUIET.on) return;                 // 회의 중 — 여기가 회의 모드의 전부입니다
  const now = Date.now();
  /* 앉은 직후는 조용히 */
  if (SESSION.seatedAt && now - SESSION.seatedAt < SAY_QUIET_MS) return;
  if (kind !== 'good') {
    if (SAY.count[kind] >= SAY_MAX[kind]) return;              // 세션 상한
    if (now - SAY.last[kind] < SAY_GAP[kind]) return;          // 재알림 간격
    SAY.last[kind] = now; SAY.count[kind]++;
  }
  sayEl.textContent = SAY_TEXT[kind];
  sayEl.className = kind;
  sayEl.classList.add('on');
  SAY.until = now + SAY_SHOW[kind];
  clearTimeout(SAY.timer);
  SAY.timer = setTimeout(() => { sayEl.classList.remove('on'); SAY.until = 0; }, SAY_SHOW[kind]);
}

function setState(kind, msg) {
  const now = performance.now();
  if (LIVE.lastTick && LIVE.state !== 'idle') {
    const dt = now - LIVE.lastTick;
    /* rAF 는 탭이 숨으면 멈춥니다. 클램프가 없으면 다른 탭에 가 있던
       구간 전체가 복귀 첫 프레임에 직전 상태로 청구됩니다 — 앉기의
       존재 이유가 "다른 탭에서 집중" 이라 이건 설계된 경로입니다.
       ponytail: 숨은 동안은 판정 자체가 쉽니다(카메라는 켜져 있지만
       프레임을 안 읽습니다). 다른 탭에서도 계속 재려면 제품처럼
       Document PiP 창으로 옮겨야 합니다 — 이식 때 함께 옵니다. */
    if (dt < 2000) {
      if (LIVE.state === 'good') LIVE.goodMs += dt;
      else if (LIVE.state === 'warning') LIVE.warnMs += dt;
      else if (LIVE.state === 'bad') LIVE.badMs += dt;
    }
  }
  LIVE.lastTick = now;
  /* 회복 — bad 를 겪고 good 으로 돌아온 것만 셉니다. 랭킹이 이걸 씁니다. */
  const changed = LIVE.state !== kind;
  if (changed) feedRecovery(kind);          // 회복에 걸린 시간 — 자세 나이가 씁니다
  if (kind === 'bad') LIVE.wasBad = true;
  else if (kind === 'good' && LIVE.wasBad) { LIVE.recoveries++; LIVE.wasBad = false; award('recov', '회복'); }
  /* 말풍선은 **전이 순간**에만. 상태가 유지되는 동안 계속 뜨면 화면에
     붙박이가 됩니다. 좋았다 나빴다 하는 깜빡임은 POSE 의 HOLD
     (warning 1.5초 · bad 5초)가 이미 걸러 냅니다. */
  if (changed && kind !== 'idle') {
    if (kind === 'bad' || kind === 'warning') saySomething(kind);
    else if (kind === 'good' && LIVE.recoveries > 0) saySomething('good');
  }

  LIVE.state = kind;
  LIVE.msg = msg || STATE_TEXT[kind] || '';
  /* 표시등(camDot)은 판정 상태가 아니라 **카메라 수명**을 말합니다.
     판정 색을 섞으면 기준 없음·화면 이탈 때 카메라가 도는데도 꺼진
     것처럼 보입니다. 자세 색은 아래 stateLabel 이 담당합니다. */
  if (stateLabel) {
    stateLabel.textContent = LIVE.msg;
    stateLabel.style.color = kind === 'idle' ? 'var(--ink-3)' : STATE_COLOR[kind];
  }
  paintPosture(kind);
}

/* ================== 자세 테두리 ==================
   PIP 로 줄어들면 통계도 그래프도 안 보입니다. 그때 남는 것이 카메라 칸
   하나뿐이라, 그 테두리가 상태를 말합니다.

   색만 쓰지 않습니다. 적록색약은 인구의 8%(남성)이고, 우리 색은 하필
   초록(#2E9E5B)과 빨강(#E0483A)입니다 — 그 사람들에게는 둘이 같은 갈색
   비슷한 색으로 보입니다. 그래서 셋을 겹쳐 말합니다(WCAG 1.4.1):
     · 테두리 색
     · 모서리 배지 — **모양이 상태마다 다릅니다** (체크 / 느낌표 / 엑스)
     · 글자 — PIP 에서도 상태 문장을 남깁니다
   색을 못 봐도 배지 모양만으로 알 수 있어야 합니다. */
const camWrap = document.getElementById('cam-wrap');
const camBadgeI = document.getElementById('cam-badge-i');
const camBadgeT = document.getElementById('cam-badge-t');
const POSTURE_BADGE = {
  good:    { icon: '\u2713', text: '좋아요' },
  warning: { icon: '\u0021', text: '주의' },
  bad:     { icon: '\u2715', text: '굽음' },
};
/* ================== 캐릭터가 대신 무너집니다 ==================
   알림을 보내는 대신 내 캐릭터가 같이 처집니다. "자세가 나쁩니다" 는
   죄책감을 주고 사흘이면 끕니다. 내 것이 힘들어하면 고치게 됩니다.

   값 하나(droop 0~1)로 머리 높이·몸통 눌림·눈꺼풀을 함께 움직입니다.
   따로 두면 셋이 각자 놀아서 사람이 아니라 부품으로 보입니다. */
const DROOP = {
  now: 0,        // 화면에 그려지는 값 (부드럽게 따라옵니다)
  target: 0,     // 판정이 준 값
  flash: 0,      // 회복 반짝임 남은 양
  wasBad: false,
};
/* 지수이동평균 — 각도가 튀면 캐릭터가 경련합니다. 0.3초쯤 뒤따라옵니다.
   올라갈 때(무너질 때)보다 내려올 때(회복)를 빠르게 둡니다: 회복은
   바로 보상으로 느껴져야 하고, 무너짐은 천천히 와야 겁주지 않습니다. */
function feedDroop(dev) {
  /* 편차 1.0 이 "주의 들어감" 이라, 2.0 을 완전히 늘어진 상태로 봅니다. */
  DROOP.target = Math.max(0, Math.min(1, (dev - 0.6) / 1.4));
}
function stepDroop() {
  const d = DROOP.target - DROOP.now;
  DROOP.now += d * (d > 0 ? 0.06 : 0.14);
  /* 회복 순간 — 이 반짝임이 이 기능에서 제일 중요한 한 프레임입니다. */
  const bad = DROOP.now > 0.55;
  if (DROOP.wasBad && !bad) DROOP.flash = 1;
  DROOP.wasBad = bad;
  if (DROOP.flash > 0) DROOP.flash = Math.max(0, DROOP.flash - 0.05);
}

/* ================== 축별 누적 ==================
   판정은 프레임마다 축 10개의 편차를 이미 다 계산합니다(POSE.votes 의
   details). 그런데 지금까지 그중 **가장 큰 값 하나**만 쓰고 나머지는
   버렸습니다. 여기서 축마다 "기준을 넘긴 시간"을 쌓아 둡니다.

   왜 횟수가 아니라 **시간**인가 — 프레임률이 기기마다 15~30fps 로
   달라서 횟수를 세면 빠른 기기가 두 배로 나쁘게 나옵니다.

   이 값으로 두 가지를 만듭니다.
     · 축별 스트레칭 처방 — 제일 오래 넘긴 축 한둘만 처방
     · 자세 나이 — 유지력·회복속도와 함께 씀
   둘 다 **코인과 무관**합니다. 코인은 여전히 "사람이 있었나" 하나만 봅니다. */
const AXIS = { ms: {}, last: 0, recovMs: [], badAt: 0 };

function resetAxis() { AXIS.ms = {}; AXIS.last = 0; AXIS.recovMs = []; AXIS.badAt = 0; }

function feedAxis(v) {
  const now = performance.now();
  const dt = AXIS.last ? now - AXIS.last : 0;
  AXIS.last = now;
  /* 탭이 숨으면 rAF 가 멈춥니다. 돌아온 첫 프레임에 그 시간을 통째로
     청구하면 축 하나가 몇 분씩 뜁니다 — goodMs 와 같은 이유로 자릅니다. */
  if (!v || dt <= 0 || dt > 2000) return;
  v.details.forEach((d) => { if (d.primary && d.exceeded) AXIS.ms[d.key] = (AXIS.ms[d.key] || 0) + dt; });
}

/** 나쁨에 들어간 순간과 돌아온 순간을 재서 **회복에 걸린 시간**을 모읍니다.
    자세 나이가 정적인 각도만 보지 않게 하는 값입니다 — 훈련하면 실제로
    짧아지는 쪽이라, 노력이 숫자에 반영됩니다. */
function feedRecovery(kind) {
  if (kind === 'bad') { if (!AXIS.badAt) AXIS.badAt = Date.now(); }
  else if (kind === 'good' && AXIS.badAt) {
    AXIS.recovMs.push(Date.now() - AXIS.badAt);
    AXIS.badAt = 0;
  }
}

/* 축 → 처방. 10축을 **4갈래**로 묶습니다. 정면 웹캠 한 대로 믿을 수 있는
   갈래만 남긴 것이고, 어깨 말림(protraction)은 정면에서 앞뒤를 못 재서
   아예 뺐습니다 — 못 재는 것을 처방하면 처방 전체의 신뢰가 깎입니다.

   axes 는 그 갈래에 속한 축이고, 넘긴 시간을 합쳐서 갈래끼리 겨룹니다. */
const STRETCH = [
  {
    id: 'chin', name: '고개 숙임',
    axes: ['facePitchRatio', 'earEyeRatio', 'headPitchDeg'],
    why: '턱이 아래로 내려가 목 뒤가 계속 당겨졌어요',
    how: ['턱을 목 쪽으로 **당겨** 뒤통수를 위로 미세요 (5초 유지)',
          '천천히 고개를 뒤로 젖혀 천장을 3초 보세요', '10회 반복'],
  },
  {
    id: 'forward', name: '화면으로 다가감',
    axes: ['faceScaleRatio', 'shoulderSpan', 'headDistanceCm', 'headHeightRatio'],
    why: '몸이 조금씩 화면 쪽으로 나왔어요 — 거북목이 만들어지는 자리예요',
    how: ['의자 등받이에 등을 **완전히** 붙이고 앉으세요',
          '두 손을 뒤통수에 대고 팔꿈치를 뒤로 5초 여세요', '5회 반복 후 모니터를 한 뼘 뒤로'],
  },
  {
    id: 'tilt', name: '어깨 좌우 기울기',
    axes: ['shoulderTiltRatio'],
    why: '한쪽 어깨가 계속 올라가 있었어요',
    how: ['양 어깨를 귀까지 올렸다가 **툭** 떨어뜨리세요 (10회)',
          '오른손으로 머리를 오른쪽으로 당겨 왼목을 15초 늘이세요', '반대쪽도 같이'],
  },
  {
    id: 'lean', name: '몸통 치우침',
    axes: ['lateralOffsetRatio', 'torsoLean'],
    why: '몸통이 한쪽으로 기울어 앉아 있었어요',
    how: ['앉은 채로 두 발을 바닥에 나란히 두세요',
          '한 손을 위로 뻗어 반대쪽으로 기울여 옆구리를 15초 늘이세요', '반대쪽도 같이'],
  },
];

/** 넘긴 시간이 긴 갈래부터. 아무 축도 안 넘겼으면 빈 배열 —
    **처방할 게 없으면 안 합니다.** 없는데 지어내면 다음번에 안 믿습니다. */
function stretchPlan() {
  return STRETCH
    .map((g) => ({ g, ms: g.axes.reduce((s, k) => s + (AXIS.ms[k] || 0), 0) }))
    .filter((x) => x.ms > 20000)          // 20초는 넘겨야 처방합니다. 한 번 뒤척인 것은 처방거리가 아닙니다
    .sort((a, b) => b.ms - a.ms)
    .slice(0, 2);                          // 상위 둘까지. 넷을 다 주면 아무것도 안 합니다
}

/* ================== 자세 나이 ==================
   **재미 요소입니다.** 코인·랭킹과 완전히 분리돼 있고, 이 값이 낮다고
   얻는 것도 높다고 잃는 것도 없습니다(AGENTS.md §2.2 의 "자세를 점수화
   하지 않는다" 를 지키는 선입니다 — 점수가 보상에 연결되는 순간 규칙이
   깨집니다).

   정적인 각도만 보지 않습니다. 셋을 섞습니다.
     유지력   good 이었던 시간의 비율          (절반)
     회복속도 나쁨에서 돌아오는 데 걸린 시간   (3/10)
     이탈크기 축이 기준을 넘긴 시간의 비율     (2/10)
   뒤의 둘은 **훈련하면 실제로 좋아지는 값**입니다. 각도만 쓰면 체형이
   결정해 버려서 아무리 노력해도 안 바뀝니다.

   판정 5분 미만이면 계산하지 않습니다 — 표본이 모자란 수를 보여 주면
   그건 지어낸 값입니다. */
function postureAge() {
  const tot = LIVE.goodMs + LIVE.warnMs + LIVE.badMs;
  if (tot < 5 * 60000) return null;
  const hold = LIVE.goodMs / tot;                                   // 0~1, 클수록 좋음
  const recov = AXIS.recovMs.length
    ? AXIS.recovMs.reduce((a, b) => a + b, 0) / AXIS.recovMs.length / 1000
    : (LIVE.badMs > 0 ? 120 : 0);                                   // 나빴는데 못 돌아왔으면 최악으로 봅니다
  const over = Math.min(1, Object.values(AXIS.ms).reduce((a, b) => a + b, 0) / tot);
  const bad = 0.5 * (1 - hold) + 0.3 * Math.min(1, recov / 120) + 0.2 * over;
  return {
    age: Math.round(20 + bad * 45),                                 // 20 ~ 65
    hold: Math.round(hold * 100),
    recovSec: Math.round(recov),
    minutes: Math.round(tot / 60000),
  };
}

/** 계기판 — 20~65 를 반원 눈금에 얹습니다. 숫자만 쓰면 "45세" 가 좋은지
    나쁜지 알 수 없어서, 눈금 위 위치로 먼저 읽히게 합니다. */
function ageGaugeSvg(age) {
  const t = Math.max(0, Math.min(1, (age - 20) / 45));
  const a = Math.PI * (1 - t);                                      // 왼쪽(180도)에서 오른쪽(0도)으로
  const R = 62, cx = 78, cy = 74;
  const px = cx + R * Math.cos(a), py = cy - R * Math.sin(a);
  const col = age <= 30 ? '#2E9E5B' : age <= 45 ? '#D98324' : '#E0483A';
  /* 숫자는 **바늘 아래**에 둡니다. 반원 안에 넣으면 바늘이 지나가면서
     글자를 가로지릅니다(실제로 그렇게 나왔습니다). */
  return `<svg viewBox="0 0 156 118" width="156" height="118" role="img" aria-label="자세 나이 ${age}세">
    <path d="M16 74 A62 62 0 0 1 140 74" fill="none" stroke="#E3E0DC" stroke-width="13" stroke-linecap="round"/>
    <path d="M16 74 A62 62 0 0 1 140 74" fill="none" stroke="${col}" stroke-width="13" stroke-linecap="round"
          stroke-dasharray="${(Math.PI * R).toFixed(1)}" stroke-dashoffset="${(Math.PI * R * (1 - t)).toFixed(1)}"/>
    <line x1="${cx}" y1="${cy}" x2="${px.toFixed(1)}" y2="${py.toFixed(1)}" stroke="#3A322E" stroke-width="3" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="5" fill="#3A322E"/>
    <text x="16" y="90" font-size="10" fill="#9A8E88">20</text>
    <text x="130" y="90" font-size="10" fill="#9A8E88">65</text>
    <text x="${cx}" y="112" font-size="27" font-weight="700" text-anchor="middle" fill="${col}">${age}<tspan font-size="13" font-weight="600">세</tspan></text>
  </svg>`;
}

function paintPosture(kind) {
  if (!camWrap) return;
  camWrap.dataset.posture = kind || 'idle';
  const b = POSTURE_BADGE[kind];
  if (b && camBadgeI) { camBadgeI.textContent = b.icon; camBadgeT.textContent = b.text; }
}

/* ================== 얼굴 끄기 ==================
   끄는 것은 **보여 주기**뿐입니다. 판정은 그대로 돕니다 — 카메라를 끄면
   코인이 안 쌓이는 규칙이라(판정 시간이 분모), 얼굴을 가리고 싶은 사람이
   코인까지 잃으면 둘 중 하나를 포기하게 됩니다.
   빈 칸을 두지 않고 **내 캐릭터**를 세웁니다. 아무것도 없으면 카메라가
   고장난 것으로 읽힙니다. */
let faceOff = false, avatarCv = null;
/* ================== PIP 얼굴 ==================
   전신 32x48 을 PIP 에 넣으면 표정이 한두 픽셀이라 다섯 상태가 다 비슷해
   보입니다. 그렇다고 **고정 좌표로 머리를 자르면** 종마다 머리 높이가
   달라서(고슴도치는 y4 에서 시작하고 개구리는 y9) 어떤 종은 턱이 잘리고
   어떤 종은 위가 비어 보입니다. 앞 판이 그래서 잘려 보였습니다.

   그래서 이번에는 **얼굴을 따로 굽습니다.**

     1) 시트에서 머리 경계를 **재서** 잘라냅니다 (고정 crop 이 아닙니다).
        모자를 쓰면 꼭대기가 따라 올라가고, 가로도 재서 자르므로
        PIP 안에서 얼굴이 늘 한가운데에 꽉 찹니다.
     2) 눈을 지워 **민얼굴 판** 하나를 만듭니다 — 이것이 "하나의 얼굴"입니다.
     3) 그 판 위에 다섯 상태를 그립니다. 눈·눈썹·입이 상태마다 다릅니다.

   눈을 **지우고 다시 그리는** 것이 핵심입니다. 위에 얹기만 하면 원래 눈이
   비쳐서 감은 눈·웃는 눈을 만들 수 없고, 그래서 다섯 상태가 다 비슷해집니다.

   아래 표의 숫자는 assets/characters/*.png 의 down 프레임을 **직접 재서**
   넣은 값입니다. 종이 늘면 여기 한 줄이 늘어납니다. */
const FACE_BOTTOM = 24;                  // 머리·목 경계 (characters/layout.json 의 headBottomY)
const FACE_PAD = { top: 4, bot: 2, side: 3 };   // 위는 zᶻ·반짝임, 아래는 처짐 자리
/* 여백은 **아낍니다.** 머리가 17줄인데 위아래로 9줄을 비우면 PIP 안에서
   확대 배율이 한 단계 떨어져 얼굴이 그만큼 작아집니다. */

/* ex   : 눈칸 왼쪽 x 둘 (칸은 8종 모두 4x4 로 같습니다)
   ey   : 눈칸 윗줄 y
   skin : 눈을 지울 때 칠할 색 — 눈 둘레의 살갗 색입니다
   my   : 입을 그릴 줄. **null 이면 안 그립니다** — 펭귄·백조는 부리가
          얼굴의 절반이라 입을 얹으면 부리가 둘이 됩니다. 그 둘은
          눈·눈썹·땀만으로 다섯 상태를 만듭니다
   clear: 원래 입이 그려져 있는 종만. [x,y,w,h] 를 clearFill 로 덮고 새로 그립니다
   brow : 눈썹 색을 따로 줘야 하는 종. 없으면 종 테두리색(sp.line)을 씁니다 —
          펭귄만 머리가 새까매서 테두리색 눈썹이 안 보입니다 */
const FACE_SPEC = {
  turtle:   { ex: [10, 18], ey: 14, skin: '#8CD296', my: 19 },
  giraffe:  { ex: [10, 18], ey: 14, skin: '#FAF0C8', my: 20, clear: [13, 19, 6, 3], clearFill: '#E6C896' },
  penguin:  { ex: [10, 18], ey: 14, skin: '#FFFFFF', my: null, brow: '#FFFFFF' },
  hamster:  { ex: [10, 18], ey: 14, skin: '#DCAA78', my: 19 },
  frog:     { ex: [9,  19], ey: 10, skin: '#82DC3C', my: 19, clear: [13, 19, 6, 2], clearFill: '#FAF0A0' },
  hedgehog: { ex: [10, 18], ey: 14, skin: '#E6B48C', my: 20 },
  alpaca:   { ex: [10, 18], ey: 14, skin: '#FAE6D2', my: 19 },
  swan:     { ex: [10, 18], ey: 14, skin: '#FFFFFF', my: null },
};

/* 눈 — 다섯이 **눈 모양부터** 다릅니다. 눈썹·입만 바꾸면 이 크기에서
   좋음과 주의가 구별되지 않습니다. X 검은자 · o 하이라이트

   높이가 4 → 3 → 1 로 줄어드는 것이 좋음·주의·나쁨의 뼈대입니다.
   회복(⌒)과 잠듦(⌄)은 휘는 방향이 반대라 서로 안 헷갈립니다. */
const FACE_EYE = {
  good:    ['.XX.', 'XXoX', 'XXXX', '.XX.'],   // 크게 뜸
  warn:    ['....', 'XXXX', 'XXXX', '.XX.'],   // 윗꺼풀이 내려옴 (하이라이트도 사라집니다)
  bad:     ['....', '....', 'XXXX', '....'],   // 실눈
  recover: ['....', '.XX.', 'X..X', '....'],   // ⌒ 웃는 눈
  sleep:   ['....', 'X..X', '.XX.', '....'],   // ⌄ 감은 눈
};

/* 머리 경계 — 시트마다 한 번만 잽니다. 옷을 갈아입으면 시트 객체가
   새로 만들어지므로 WeakMap 이면 저절로 다시 재고 저절로 버려집니다. */
const faceBoxCache = new WeakMap();
function faceBox(sheet) {
  let b = faceBoxCache.get(sheet);
  if (b) return b;
  const H = FACE_BOTTOM + 1;
  const c = document.createElement('canvas');
  c.width = CHAR_W; c.height = H;
  const cg = c.getContext('2d');
  cg.imageSmoothingEnabled = false;
  cg.drawImage(sheet, CHAR_W * ITEM_DIR.down, 0, CHAR_W, H, 0, 0, CHAR_W, H);
  let px;
  try { px = cg.getImageData(0, 0, CHAR_W, H).data; } catch { px = null; }
  let x0 = CHAR_W, x1 = -1, y0 = H;
  if (px) {
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < CHAR_W; x++) {
        if (px[(y * CHAR_W + x) * 4 + 3] <= 40) continue;
        if (x < x0) x0 = x;
        if (x > x1) x1 = x;
        if (y < y0) y0 = y;
      }
    }
  }
  if (x1 < 0) { x0 = 4; x1 = 27; y0 = 6; }      // 빈 시트 방어 — 없는 값으로 나누지 않게
  b = { x0, x1, y0 };
  faceBoxCache.set(sheet, b);
  return b;
}

/** 얼굴 한 장을 1x 격자에 굽습니다. 확대한 화면에 직접 그리면 선 굵기가
    픽셀 격자에 안 맞아 표정만 매끈해지므로, 작게 그린 뒤 통째로 키웁니다.
    state: good / warn / bad / recover / sleep — 이 함수가 유일한 그리는 곳입니다. */
function bakeFace(sheet, sp, state, droop, flash) {
  const F = FACE_SPEC[sp.slug] || FACE_SPEC.turtle;
  const bx = faceBox(sheet);
  const hw = bx.x1 - bx.x0 + 1, hh = FACE_BOTTOM - bx.y0 + 1;
  const W = hw + FACE_PAD.side * 2, H = hh + FACE_PAD.top + FACE_PAD.bot;

  const t = document.createElement('canvas');
  t.width = W; t.height = H;
  const g = t.getContext('2d');
  g.imageSmoothingEnabled = false;

  /* 처짐 — 나쁠수록 내려가고, 회복하는 순간 한 번 튀어오릅니다. */
  const drop = Math.round(droop * 2) + (state === 'sleep' ? 1 : 0) - (state === 'recover' ? 1 : 0);
  const ox = FACE_PAD.side - bx.x0, oy = FACE_PAD.top + drop - bx.y0;
  g.drawImage(sheet, CHAR_W * ITEM_DIR.down + bx.x0, bx.y0, hw, hh,
              FACE_PAD.side, FACE_PAD.top + drop, hw, hh);

  const ink = sp.line;
  const px = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x + ox, y + oy, w, h); };

  /* ① 민얼굴 — 눈을 지웁니다. 여기까지가 다섯 상태가 공유하는 "하나의 얼굴". */
  F.ex.forEach((x) => px(x, F.ey, 4, 4, F.skin));
  if (F.clear) px(F.clear[0], F.clear[1], F.clear[2], F.clear[3], F.clearFill);

  /* ② 눈 — 상태별 모양표를 그대로 찍습니다. */
  const eye = FACE_EYE[state] || FACE_EYE.good;
  F.ex.forEach((ex) => {
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
      const ch = eye[r][c];
      if (ch === 'X') px(ex + c, F.ey + r, 1, 1, ink);
      else if (ch === 'o') px(ex + c, F.ey + r, 1, 1, '#FFFFFF');
    }
  });

  /* ③ 눈썹 — 주의·나쁨만. 안쪽 끝이 내려간 팔자입니다.
     개구리는 눈이 머리 꼭대기에 붙어 있어 눈썹 자리가 없습니다.
     자리가 없으면 그리지 않습니다 — 억지로 그리면 머리 위에 뜹니다. */
  const lift = state === 'bad' ? 4 : 3;
  if ((state === 'warn' || state === 'bad') && F.ey - lift >= bx.y0) {
    const bi = F.brow || ink;
    px(F.ex[0], F.ey - lift, 2, 1, bi);         px(F.ex[0] + 2, F.ey - lift + 1, 2, 1, bi);
    px(F.ex[1] + 2, F.ey - lift, 2, 1, bi);     px(F.ex[1], F.ey - lift + 1, 2, 1, bi);
  }

  /* ④ 입 — 부리 있는 종(펭귄·백조)은 건너뜁니다. */
  if (F.my != null) {
    const mx = 15, my = F.my;
    if (state === 'good') {                       // 살짝 ∪
      px(mx, my, 2, 1, ink); px(mx - 1, my - 1, 1, 1, ink); px(mx + 2, my - 1, 1, 1, ink);
    } else if (state === 'warn') {                // 일자
      px(mx - 1, my, 4, 1, ink);
    } else if (state === 'bad') {                 // ∧ — 양 끝이 내려갑니다
      px(mx, my, 2, 1, ink); px(mx - 1, my + 1, 1, 1, ink); px(mx + 2, my + 1, 1, 1, ink);
    } else if (state === 'recover') {             // 활짝
      px(mx - 1, my, 4, 1, ink); px(mx, my + 1, 2, 1, ink);
      px(mx - 2, my - 1, 1, 1, ink); px(mx + 3, my - 1, 1, 1, ink);
    } else {                                      // 잠듦 — 작게
      px(mx, my, 2, 1, ink);
    }
  }

  /* ⑤ 부가 — 땀·반짝임·zᶻ. 상태를 하나 더 겹쳐 읽게 합니다. */
  const drip = (x, y) => { px(x, y, 1, 2, '#7EC8F0'); px(x, y + 2, 1, 1, '#BFE6FA'); };
  if (state === 'warn') drip(F.ex[1] + 4, F.ey + 2);
  if (state === 'bad') { drip(F.ex[1] + 4, F.ey + 1); drip(F.ex[0] - 1, F.ey + 3); }
  if (state === 'recover') {
    [[F.ex[0] - 3, F.ey - 1], [F.ex[1] + 6, F.ey - 2]].forEach(([x, y]) => {
      px(x, y - 1, 1, 3, '#FFE9A8'); px(x - 1, y, 3, 1, '#FFE9A8');
    });
  }
  if (state === 'sleep') {
    /* zᶻ 를 글자로 찍으면 안티에일리어싱이 껴서 이 배율에서 뭉갭니다.
       픽셀로 그리고, 밝은 얼굴에도 어두운 얼굴에도 보이도록 흰 테를 두릅니다. */
    const zed = (x, y) => {
      g.fillStyle = '#5A4A44';
      g.fillRect(x, y, 3, 1);                           // 윗줄
      g.fillRect(x + 1, y + 1, 1, 1);                   // 대각
      g.fillRect(x, y + 2, 3, 1);                       // 아랫줄
    };
    /* **왼쪽** 위로 올립니다 — 오른쪽 위는 얼굴끄기·자리옮기기 단추 자리라
       거기 두면 zᶻ 가 단추에 걸립니다. */
    zed(4, 2); zed(0, 0);
  }

  if (flash > 0) {
    /* 회복 섬광. source-atop 이라야 **그려진 픽셀에만** 얹힙니다 —
       source-over/lighter 로 사각형을 덮으면 투명한 배경까지 밝아져서
       얼굴 주위에 네모난 판이 생기고 표정이 하얗게 날아갑니다. */
    g.globalCompositeOperation = 'source-atop';
    g.fillStyle = 'rgba(255,244,190,' + (0.2 * flash).toFixed(3) + ')';
    g.fillRect(0, 0, W, H);
    g.globalCompositeOperation = 'source-over';
  }
  return t;
}

function faceState(droop, flash) {
  if (LIVE.state === 'idle') return 'sleep';      // 회의·자리비움 — 판정이 안 도는 시간
  if (flash > 0) return 'recover';                // 막 좋아진 순간이 이 기능의 보상입니다
  if (droop > 0.55) return 'bad';
  if (droop > 0.22) return 'warn';
  return 'good';
}

function drawCamAvatar() {
  if (!faceOff) return;
  const host = document.getElementById('cam-avatar');
  if (!host) return;
  const sheet = (window.GIRIN_CHAR && GIRIN_CHAR.mine && GIRIN_CHAR.mine()) || null;
  if (!sheet) return;
  if (!avatarCv) { avatarCv = document.createElement('canvas'); host.prepend(avatarCv); }

  const sp = speciesOf(ROOM.character);
  const t = bakeFace(sheet, sp, faceState(DROOP.now, DROOP.flash), DROOP.now, DROOP.flash);

  /* PIP 안에 꽉 채워 가운데 둡니다. 아래 20 은 이름 알약 자리입니다. */
  const box = camWrap.getBoundingClientRect();
  const z = Math.max(2, Math.floor(Math.min(box.width / t.width, (box.height - 14) / t.height)));
  avatarCv.width = t.width * z; avatarCv.height = t.height * z;
  const o = avatarCv.getContext('2d');
  o.imageSmoothingEnabled = false;
  o.clearRect(0, 0, avatarCv.width, avatarCv.height);
  o.drawImage(t, 0, 0, t.width, t.height, 0, 0, avatarCv.width, avatarCv.height);
}
function setFaceOff(v) {
  faceOff = !!v;
  camWrap.classList.toggle('face-off', faceOff);
  const btn = document.getElementById('cam-face');
  if (btn) {
    btn.setAttribute('aria-pressed', String(faceOff));
    btn.textContent = faceOff ? '\uD83D\uDE36' : '\uD83D\uDE42';
    btn.title = faceOff ? '얼굴 켜기' : '얼굴 끄기 (판정은 계속 돕니다)';
  }
  if (faceOff) drawCamAvatar();
}
document.getElementById('cam-face')?.addEventListener('click', () => setFaceOff(!faceOff));
document.getElementById('cam-move')?.addEventListener('click', () => {
  const p = document.getElementById('session');
  p.classList.toggle('up');
  document.body.classList.toggle('pip-up', p.classList.contains('up'));
  saveJSON('girin.pipUp', p.classList.contains('up'));
});
window.addEventListener('resize', drawCamAvatar);

setInterval(() => {
  if (!faceOff) return;
  const before = DROOP.now;
  stepDroop();
  if (Math.abs(DROOP.now - before) > 0.002 || DROOP.flash > 0) drawCamAvatar();
}, 50);

/* ================== 카메라 ================== */
/* HUD 의 촬영 고지 — 켜짐 / 꺼짐 / 거부됨 셋뿐입니다. 미리보기를 숨긴
   사람에게는 이 글자가 카메라가 돌고 있다는 유일한 고지입니다. */
const camLive = document.getElementById('cam-live');
function noteCam(text, on) {
  camLive.textContent = text;
  camLive.classList.toggle('live', !!on);
}

async function startCamera() {
  /* 이미 열려 있으면 그대로 둡니다. 두 번 열면 앞 스트림이 stop 없이
     버려져 카메라 LED 가 안 꺼지고, poseLoop rAF 사슬이 둘이 됩니다. */
  if (camStream) return;
  /* 패널은 띄우지 않습니다. 카메라가 도는 것과 화면에 자기 얼굴이
     떠 있는 것은 다른 일이고, 후자는 집중 공간에 앉을 때만입니다.
     상태는 HUD 글자가 말합니다 — 거부됐을 때도 거기 남습니다. */
  camMsg.textContent = '카메라를 여는 중이에요';
  camMsg.hidden = false;
  setState('idle', '측정 준비');
  if (!navigator.mediaDevices?.getUserMedia) {
    camMsg.textContent = '이 브라우저에서는 카메라를 열 수 없어요.';
    noteCam('카메라 꺼짐', false);
    return;
  }
  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' },
      audio: false,
    });
    video.srcObject = camStream;
    video.hidden = false;
    await video.play();
    camMsg.hidden = true;
    camDot.classList.add('live');
    noteCam('카메라 켜짐', true);
    loadPose();
  } catch (err) {
    video.hidden = true;
    camMsg.hidden = false;
    const denied = err?.name === 'NotAllowedError';
    camMsg.textContent = denied
      ? '카메라를 거부했어요. 주소창 왼쪽에서 허용하면 다시 켜집니다.'
      : '카메라를 열지 못했어요. 미리보기 창에서는 항상 막힙니다 — 크롬에서 직접 열어 주세요.';
    noteCam(denied ? '카메라 거부됨' : '카메라 꺼짐', false);
  }
}

function stopCamera() {
  poseRunning = false;
  CAL.on = false;                    // 기준을 재던 중이면 그것도 멈춥니다
  LIVE.on = false;
  setState('idle', '측정 준비');
  if (camStream) { camStream.getTracks().forEach((t) => t.stop()); camStream = null; }
  video.srcObject = null;
  video.hidden = true;
  octx.clearRect(0, 0, overlay.width, overlay.height);
  poseFps = 0;
  camDot.classList.remove('live');
  noteCam('카메라 꺼짐', false);
  showPip(false);
}

async function loadPose() {
  camMsg.hidden = false;
  camMsg.textContent = '자세 판정 모델을 받는 중이에요';
  try {
    await POSE.load();
    camMsg.hidden = true;
    LIVE.smoother = new POSE.Smoother();
    LIVE.arb = POSE.arbiter();
    LIVE.profile = (BASELINE && BASELINE.features) || null;
    LIVE.zone = zoneId;
    /* lastTick 리셋은 남깁니다 — 없으면 재시작 첫 프레임이 꺼져 있던
       공백 전체를 이전 상태에 청구합니다. good/warn/bad 누적은 세션의
       것이라 여기서 지우지 않습니다. 카메라가 세션 중에 다시 붙어도
       (권한 재허용 등) 이미 쌓인 기록이 날아가면 안 됩니다. */
    LIVE.frames = 0; LIVE.seen = 0; LIVE.lastTick = 0; LIVE.wasBad = false;
    LIVE.on = true;
    poseRunning = true;
    if (!LIVE.profile) setState('idle', '아직 기준을 못 잡았어요');
    poseLoop();
    startCalibrate();             // 세션 시작 10초 — 기준을 여기서 잡습니다
  } catch {
    camMsg.hidden = false;
    camMsg.textContent = '판정 모델을 받지 못했어요 (오프라인이거나 CDN 차단).';
  }
}

/* 뼈대 — 사람이 자기가 어떻게 잡히는지 보는 용도입니다.
   판정은 이 그림이 아니라 아래 votes/step 이 합니다. */
const SKELETON = [[11,12],[11,23],[12,24],[23,24],[11,13],[13,15],[12,14],[14,16],[0,11],[0,12],[7,8]];
function drawSkeleton(lm, color) {
  const w = video.videoWidth, h = video.videoHeight;
  if (overlay.width !== w) { overlay.width = w; overlay.height = h; }
  octx.clearRect(0, 0, w, h);
  if (!lm) return;
  octx.strokeStyle = color; octx.lineWidth = Math.max(2, w / 240);
  octx.beginPath();
  for (const [a, b] of SKELETON) {
    if (!lm[a] || !lm[b]) continue;
    octx.moveTo(lm[a].x * w, lm[a].y * h);
    octx.lineTo(lm[b].x * w, lm[b].y * h);
  }
  octx.stroke();
  octx.fillStyle = color;
  for (const i of [0, 7, 8, 11, 12, 23, 24]) {
    if (!lm[i]) continue;
    octx.beginPath(); octx.arc(lm[i].x * w, lm[i].y * h, Math.max(2.5, w / 190), 0, 7); octx.fill();
  }
}

/* ---- 판정 루프 ----
   room-flow 의 것을 그대로 옮겼습니다. 순서가 중요합니다 — 프레임을
   먼저 걸러 내고, 남은 것만 투표에 넣습니다. 걸러 내는 이유가 서로
   다르므로 안내 문구도 다릅니다. */
function poseLoop() {
  if (!poseRunning) return;
  requestAnimationFrame(poseLoop);
  if (!video || video.readyState < 2 || !POSE.ready()) return;

  const now = performance.now();
  /* ~15fps 로 자릅니다. 걷는 동안에도 판정이 돌게 되면서 동기 추론
     2개(pose+face)가 월드 렌더와 같은 rAF 를 나눠 쓰게 됐습니다 —
     안 자르면 메인스레드가 마릅니다. HOLD(경고 1.5초·굽음 5초)보다
     훨씬 촘촘해서 판정 품질은 그대로입니다. */
  if (now - lastDetect < 66) return;
  lastDetect = now;
  const out = POSE.detect(video, now, LIVE.smoother);
  if (!out) return;
  poseFrames++; LIVE.frames++;

  const a = out.analysis;
  if (!a || !a.faceCoreOk || !a.bothShouldersOk || !a.inFrame) {
    drawSkeleton(out.landmarks, STATE_COLOR.idle);
    setState('idle', '화면에서 벗어났어요');
    LIVE.arb = POSE.arbiter();
    return;
  }
  if (a.shoulderWidth < POSE.MIN_SHOULDER_WIDTH) {
    drawSkeleton(out.landmarks, STATE_COLOR.idle);
    setState('idle', '조금 더 가까이 앉아 주세요');
    return;
  }
  if (out.multi) {
    drawSkeleton(out.landmarks, STATE_COLOR.idle);
    setState('idle', '두 명 이상 보여요');
    return;
  }
  if (a.severeRotation) {
    /* 고개를 많이 돌리면 코 기반 축이 전부 못 믿을 값이 됩니다.
       이탈로 치지 않고 측정 제한으로 둡니다. */
    drawSkeleton(out.landmarks, STATE_COLOR.idle);
    setState('idle', '고개를 돌리는 중이에요');
    return;
  }
  if (!LIVE.profile) {
    drawSkeleton(out.landmarks, STATE_COLOR.idle);
    setState('idle', '아직 기준을 못 잡았어요');
    return;
  }
  LIVE.seen++;

  const q = a.meanVisibility >= 0.6;
  const v = POSE.votes(a.features, LIVE.profile, SENSITIVITY, q);
  /* 기준에 없는 축이 너무 많으면 판정하지 않습니다 — 기준을 맞출 때와
     지금의 조명·거리가 너무 다르다는 뜻입니다. */
  if (v.usedFeatureCount < 3) {
    drawSkeleton(out.landmarks, STATE_COLOR.idle);
    setState('idle', '기준과 화면이 달라요');
    return;
  }

  LIVE.arb = POSE.step(LIVE.arb, v, now);
  const s = LIVE.arb.current;
  drawSkeleton(out.landmarks, STATE_COLOR[s]);
  /* 캐릭터가 따라 처지는 데 쓰는 값. 좋음/주의/나쁨 세 칸으로는 캐릭터가
     계단처럼 움직여서, **가장 벗어난 축의 편차**를 그대로 씁니다.
     절대 각도가 아니라 본인 기준선 대비라(median·MAD) 거북목인 사람이
     켜자마자 처져 있지 않습니다 — 이게 이 값을 쓰는 이유입니다. */
  feedDroop(v && isFinite(v.maxPrimary) ? v.maxPrimary : 0);
  feedAxis(v);                        // 축별 누적 — 처방과 자세 나이가 이걸 씁니다
  setState(s);
}

/* ================== 10초 기준 맞추기 ==================
   시간을 채우는 이유 — 한순간만 보면 그 순간의 자세가 기준이 되어
   세션 내내 어긋납니다. 표본이 일찍 쌓여도 끝내지 않습니다.

   30초에서 10초로 줄였습니다. 온보딩에서 가입 도중에 요구하기엔 30초가
   길기 때문인데, **시간만 줄이면 반드시 실패합니다.** 표본은 프레임마다
   쌓이고, 판정이 도는 실효 프레임률은 15~30fps 입니다.

     30초 → 450~900 프레임   (하한 150 대비 넉넉)
     10초 → 150~300 프레임   (하한 150 이면 경계선)

   게다가 자세가 나쁘거나 움직인 프레임은 버립니다. 10초 중 3초만
   뒤척여도 하한에 미달합니다. 그래서 하한을 같이 내렸습니다.

     CAL_MIN_SAMPLES     150 → 70   (중앙값·MAD 는 n=70 이면 충분합니다.
                                     평균이 아니라 중앙값이라 이상치에 강합니다)
     CAL_BUCKETS           6 → 4    (10초를 6등분하면 구간당 1.67초라
                                     한 번 기침하면 구간 하나가 통째로 빕니다)
     CAL_MIN_PER_FEATURE  60 → 28   (같은 비율) */
const CAL = { on: false, t0: 0, samples: [], widths: [], last: null, badMsg: '' };
const CAL_MS = 10000, CAL_BUCKETS = 4, CAL_MIN_SAMPLES = 70;
const CAL_MIN_PER_FEATURE = 28, CAL_MOVE_LIMIT = 0.2;

/* 기준을 맞추는 순간에는 "기준 대비" 가 아직 없어서 절대값으로만
   거릅니다. 전부 사람마다 안 변하는 단위입니다 — 각도(도), 거리(cm),
   어깨폭으로 나눈 비율. 체형처럼 사람마다 다른 값은 쓰지 않습니다. */
const CAL_PITCH_DOWN = 14, CAL_PITCH_UP = 14, CAL_ROLL = 10;
const CAL_NEAR_CM = 38, CAL_TILT = 0.075;

function calBadPosture(a, head) {
  CAL.badMsg = '';
  if (head) {
    if (head.headPitchDeg > CAL_PITCH_DOWN) { CAL.badMsg = '고개가 숙여져 있어요. 턱을 살짝 당기고 정면을 봐 주세요'; return true; }
    if (head.headPitchDeg < -CAL_PITCH_UP)  { CAL.badMsg = '턱이 들려 있어요. 시선을 화면 높이로 맞춰 주세요'; return true; }
    if (Math.abs(head.headRollDeg) > CAL_ROLL) { CAL.badMsg = '고개가 한쪽으로 기울었어요. 수평으로 세워 주세요'; return true; }
    if (head.headDistanceCm < CAL_NEAR_CM) { CAL.badMsg = '화면에 너무 가까워요. 등을 붙이고 한 뼘만 물러나 주세요'; return true; }
  }
  const tilt = a.features.shoulderTiltRatio;
  if (tilt !== undefined && tilt > CAL_TILT) { CAL.badMsg = '어깨가 한쪽으로 기울었어요. 양쪽 높이를 맞춰 주세요'; return true; }
  return false;
}
function calMoved(next, prev) {
  if (!prev) return false;
  return ['faceScaleRatio', 'headHeightRatio', 'lateralOffsetRatio'].some((k) => {
    const x = next[k], y = prev[k];
    return x !== undefined && y !== undefined && Math.abs(x - y) > CAL_MOVE_LIMIT;
  });
}

function startCalibrate() {
  if (CAL.on || !POSE.ready() || !camStream) return;
  CAL.on = true; CAL.t0 = performance.now();
  CAL.samples = []; CAL.widths = []; CAL.last = null; CAL.badMsg = '';
  poseRunning = false;                    // 판정 루프를 잠시 내리고 수집만
  LIVE.smoother = new POSE.Smoother();
  calLoop();
}
function calLoop() {
  if (!CAL.on) return;
  requestAnimationFrame(calLoop);
  if (!video || video.readyState < 2) return;

  const now = performance.now();
  const elapsed = now - CAL.t0;
  const out = POSE.detect(video, now, LIVE.smoother);
  const a = out && out.analysis;

  if (a && a.faceCoreOk && a.bothShouldersOk && a.inFrame && !out.multi && !a.severeRotation) {
    drawSkeleton(out.landmarks, STATE_COLOR.good);
    if (calBadPosture(a, a.head)) {
      camMsg.hidden = false; camMsg.textContent = CAL.badMsg;
    } else if (!calMoved(a.features, CAL.last)) {
      camMsg.hidden = true;
      CAL.samples.push({ f: a.features, bucket: Math.min(CAL_BUCKETS - 1, Math.floor(elapsed / (CAL_MS / CAL_BUCKETS))) });
      CAL.widths.push(a.shoulderWidth);
      CAL.last = a.features;
    }
  } else {
    drawSkeleton(out && out.landmarks, STATE_COLOR.idle);
    camMsg.hidden = false;
    camMsg.textContent = '얼굴과 어깨가 함께 보이게 앉아 주세요';
  }

  const left = Math.max(0, Math.ceil((CAL_MS - elapsed) / 1000));
  if (stateLabel) {
    stateLabel.textContent = '기준 맞추는 중 · ' + left + '초';
    stateLabel.style.color = 'var(--teal-700)';
  }
  /* 입장 직후 기준을 잡을 때는 패널이 안 떠 있습니다 — HUD 글자가
     그동안 유일한 창구입니다. */
  noteCam('기준 맞추는 중 · ' + left + '초', true);
  if (elapsed >= CAL_MS) calFinish();
}

function calFinish() {
  CAL.on = false;
  const covered = new Set(CAL.samples.map((s) => s.bucket)).size;

  const fail = (msg) => {
    camMsg.hidden = false; camMsg.textContent = msg;
    /* 이번 10초는 버려도, 지난 세션에 잡아 둔 기준이 있으면 그걸로
       계속 봅니다. 없으면 idle 로 남고, 집중 공간에 앉을 때 다시
       시도합니다(sit 참고). */
    LIVE.profile = (BASELINE && BASELINE.features) || null;
    setState('idle', LIVE.profile ? '지난 기준으로 볼게요' : '기준을 못 맞췄어요');
    noteCam(LIVE.profile ? '카메라 켜짐' : '기준 없음', !!LIVE.profile);
    poseRunning = true; poseLoop();
  };
  if (CAL.samples.length < CAL_MIN_SAMPLES) {
    return fail('10초 중 앉아 있는 모습이 충분히 잡히지 않았어요. 얼굴과 어깨가 함께 보이는 자리에서 다시 해 주세요.');
  }
  if (covered < CAL_BUCKETS) {
    return fail('중간에 자리를 비운 구간이 있어요. 10초 내내 같은 자세로 앉아 주세요.');
  }

  /* 축마다 중앙값과 MAD. 표본이 모자란 축은 기준에서 뺍니다 — 책상에
     가려 엉덩이가 안 보이면 torsoLean 이 빠지고, 빠진 축은 세션에서도
     안 쓰이므로 없는 편이 정확합니다. */
  const feats = {};
  POSE.PRIMARY.concat(POSE.AUX).forEach((k) => {
    const vals = CAL.samples.map((s) => s.f[k]).filter((x) => x !== undefined);
    if (vals.length < CAL_MIN_PER_FEATURE) return;
    const m = POSE.median(vals);
    feats[k] = { median: m, mad: POSE.mad(vals, m), n: vals.length };
  });
  if (Object.keys(feats).length < 3) {
    return fail('기준으로 쓸 만한 값이 부족해요. 조명이 밝은 곳에서 다시 해 주세요.');
  }

  BASELINE = {
    version: 3,
    features: feats,
    shoulderWidthMedian: POSE.median(CAL.widths),
    sampleCount: CAL.samples.length,
    createdAt: Date.now(),
  };
  saveBaseline();

  LIVE.profile = feats;
  LIVE.arb = POSE.arbiter();
  camMsg.hidden = true;
  setState('good', Object.keys(feats).length + '개 축으로 기준을 맞췄어요');
  noteCam('카메라 켜짐', true);
  poseRunning = true; poseLoop();
}

/* ==================================================================
   미니룸의 창

   싸이월드 미니룸이 그랬듯, 방 안의 물건이 곧 메뉴입니다. 걸어가서
   스페이스를 누르면 그 물건이 맡은 창이 열립니다 — 상단 메뉴바도,
   화면 전환도 없습니다.

   설정만 예외로 오른쪽 위 버튼입니다. 방 안 어디서든 눌러야 하는데
   그걸 맡을 물건을 하나 더 놓으면 방이 복잡해집니다.
   ================================================================== */
const panelEl = document.getElementById('panel');
const panelTitle = panelEl.querySelector('header b');
const panelKind = panelEl.querySelector('header u');
const panelBody = panelEl.querySelector('.body');
const panelTabs = panelEl.querySelector('.tabs');

/* 아직 서버가 없어 숫자는 이 기기에 남습니다. 지어낸 값이 아니라
   실제로 이 브라우저에서 쌓인 것만 보여 줍니다. */
const ROOM = {
  nickname: '익명의 기린',
  school: '명지대학교',
  schoolVerifiedAt: '',
  schoolDomain: '',
  character: '거북이',
  owned: [],              // 산 아이템 id
  worn: {},               // 칸(cat) 하나에 하나씩. 같은 칸을 사면 앞엣것이 벗겨집니다
  coins: 0,
  wallpaper: 'cream',
  floor: 'laminate',
  music: 'none',
  bgm: 'on',
  bgmTrack: 'auto',       // 'auto' = 장소마다 정해진 곡. 하나를 고르면 어디서나 그 곡
  sfxOn: 'on',
  camPeek: 'on',          // 세션 동안 웹캠 화면을 띄울지 (앉으면 작은 PIP 로 줄어듭니다)
  sayOn: 'on',            // 자세 말풍선을 캐릭터 머리 위에 띄울지
  chatOn: 'on',           // 남의 말을 화면에 띄울지 (숨겨도 입력줄은 남습니다)
  invite: null,
};
try {
  Object.assign(ROOM, JSON.parse(localStorage.getItem('girin.room') || '{}'));
} catch { /* 저장된 게 깨졌으면 기본값으로 갑니다 */ }
function saveRoom() {
  try { localStorage.setItem('girin.room', JSON.stringify(ROOM)); } catch { /* 무시 */ }
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ==================================================================
   학교 색

   학교마다 쓰는 색이 어두운 남색부터 형광까지 제각각입니다. 그대로
   화면에 얹으면 어떤 학교는 검은 얼룩이 되고 어떤 학교는 눈이 아픕니다.
   그래서 **색상과 채도는 그대로 두고 명도만** 30~55% 로 끌어옵니다.
   그 구간이 흰 UI 위에서도, 잔디 위 16px 캐릭터에서도 둘 다 읽힙니다.

   색을 쓰는 곳은 넷뿐입니다 — 과잠, 이름표 바탕, 마이페이지 강조,
   기숙사 소품 둘. 배경·버튼·글자는 무채색으로 둡니다. 학교 색이 화면
   전체를 물들이면 열 학교가 열 개의 다른 앱이 됩니다.

   아래 색값은 각 학교가 널리 쓰는 대표색을 눈으로 맞춘 **근삿값**입니다.
   실제 브랜드 가이드의 값으로 바꿔야 합니다.
   ================================================================== */
const SCHOOLS = [
  { name: '서울대학교',     domain: 'snu.ac.kr',     raw: '#00468B' },

function hexToHsl(hex) {
  const [r, g, b] = hexRGB(hex).map((v) => v / 255);
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  const l = (mx + mn) / 2;
  if (!d) return [0, 0, l];
  const s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
  const h = mx === r ? ((g - b) / d + (g < b ? 6 : 0))
          : mx === g ? (b - r) / d + 2
          : (r - g) / d + 4;
  return [h / 6, s, l];
}
function hslToHex(h, s, l) {
  const f = (n) => {
    const k = (n + h * 12) % 12;
    const a = s * Math.min(l, 1 - l);
    const v = l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
    return Math.round(v * 255).toString(16).padStart(2, '0');
  };
  return '#' + f(0) + f(8) + f(4);
}
/** 명도만 30~55% 구간으로 끌어옵니다. 색상·채도는 그 학교 것 그대로. */
function normalizeSchoolColor(hex) {
  const [h, s, l] = hexToHsl(hex);
  return hslToHex(h, s, Math.min(0.55, Math.max(0.30, l)));
}

     않기로 한 결정이라 되살리지 않습니다. */

/** 바탕색 위에서 읽히는 글자색. 코랄 위 흰 글자를 금지한 것과 같은 이유로,
    학교 색도 밝기를 재서 잉크와 흰색 중 대비가 큰 쪽을 씁니다. */
function readableOn(hex) {
  const [r, g, b] = hexRGB(hex).map((v) => {
    const s = v / 255;
    return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
  });
  const L = 0.2126 * r + 0.7152 * g + 0.0722 * b;
  return (L + 0.05) / 0.05 > (1.05) / (L + 0.05) ? '#2A2320' : '#FFFFFF';
}

/* JSON 한 벌을 브라우저에 넣고 빼는 자리.
   병합 정리: 민철 판본에는 초대 코드(INVITE)가 없어서 이 헬퍼도 같이
   지워져 있었습니다. 초대 코드·설정·소리가 전부 이걸 쓰므로 되살립니다.
   깨진 값이 들어 있어도 화면이 죽지 않게 조용히 기본값으로 물러납니다. */
function loadJSON(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
}
function saveJSON(key, v) {
  try { localStorage.setItem(key, JSON.stringify(v)); } catch { /* 무시 */ }
}

const INVITE = {
  KEY: 'girin.invites',
  ABC: 'ABCDEFGHJKMNPQRSTUVWXYZ23456789',   // 0/O/1/I 는 뺐습니다 — 받아적다 틀립니다
  LEN: 6,

  all() { return loadJSON(this.KEY, {}); },
  /** 코드를 등록합니다. → supabase.from('invites').upsert(...) */
  publish(code, profile) {
    const a = this.all();
    a[code] = Object.assign({ at: Date.now() }, profile);
    saveJSON(this.KEY, a);
  },
  /** 코드로 사람을 찾습니다. → supabase.from('invites').select().eq('code', code) */
  lookup(code) { return this.all()[String(code || '').toUpperCase().trim()] || null; },
  /** → supabase.from('invites').delete().eq('code', code) */
  revoke(code) { const a = this.all(); delete a[code]; saveJSON(this.KEY, a); },

  make() {
    let c = '';
    for (let i = 0; i < this.LEN; i++) c += this.ABC[Math.floor(Math.random() * this.ABC.length)];
    return c;
  },
  valid(code) {
    const c = String(code || '').toUpperCase().trim();
    return c.length === this.LEN && [...c].every((ch) => this.ABC.includes(ch));
  },
  /** 내 코드를 만들고 등록합니다. 이미 있으면 프로필만 갱신합니다. */
  mine() {
    if (!ROOM.invite || !this.valid(ROOM.invite)) { ROOM.invite = this.make(); saveRoom(); }
    this.publish(ROOM.invite, {
      nickname: ROOM.nickname, school: ROOM.school, character: ROOM.character, self: true,
    });
    return ROOM.invite;
  },
};

/* 데모용 이웃 둘. 기기가 하나뿐이라 이게 없으면 "유효한 코드" 를 넣어
   볼 방법이 없습니다. 서버가 붙으면 통째로 지웁니다.

   코드에 I·L·O 를 못 쓰는 것은 위 ABC 가 정한 규칙입니다 — 1·I 와 0·O 를
   받아적다 틀리기 때문입니다. 데모 코드도 같은 규칙을 지켜야 합니다. */

/* ================== 세션 기록 ==================
   같은 기기에서만 남습니다. 서버로 아무것도 안 보냅니다 — 이 제품이
   파는 약속이 그것입니다.

   한 행에 자세 통계까지 넣습니다. 전에는 { date, minutes, recoveries }
   셋뿐이라, 회고 화면이 그리는 좋음/주의/굽음 비율이 세션이 끝나는
   순간 사라졌습니다. 어제 회고를 다시 열 방법이 없었습니다. */
const ZONE_KO = { library: '도서관', mainhall: '본관', union: '학생회관', dorm: '기숙사', campus: '캠퍼스' };
const SESS_KEY = 'girin.sessions';
const SESS_MAX = 200;                      // 약 반년치

function loadSessions() {
  try {
    const rows = JSON.parse(localStorage.getItem(SESS_KEY) || '[]');
    return Array.isArray(rows) ? rows : [];
  } catch { return []; }
}

/** 지금 세션을 한 행으로. 진행 중에도 부를 수 있습니다. */
function sessionRow() {
  return {
    date: dayKey(SESSION.startedAt || Date.now()),
    at: SESSION.startedAt || Date.now(),
    /* 저장 시점의 공간. 판정이 세션 내내 돌게 되면서 "판정이 돈 공간"
       은 하나가 아니게 됐습니다 — 마지막 자동저장이 남으므로 사실상
       세션을 마친 곳이 기록됩니다. LIVE.zone 은 카메라가 켜진 곳(거의
       늘 기숙사)이라 쓸모가 없어 버렸습니다. */
    zone: zoneId,
    minutes: Math.round(SESSION.seatedMs / 60000),
    seatedMs: SESSION.seatedMs,
    goodMs: Math.round(LIVE.goodMs),
    warnMs: Math.round(LIVE.warnMs),
    badMs: Math.round(LIVE.badMs),
    recoveries: LIVE.recoveries,
    coins: SESSION.coins || 0,
  };
}

/** 같은 세션은 **덮어씁니다.** at 이 열쇠라, 1분마다 저장해도 행이
    쌓이지 않고 마지막 상태만 남습니다. */
function saveSession() {
  if (!SESSION.startedAt) return;
  const row = sessionRow();
  /* 아무것도 안 한 세션은 안 남깁니다 — 지나가며 문만 연 것까지
     기록하면 목록이 의미를 잃습니다. */
  if (row.seatedMs < 30000 && row.goodMs + row.warnMs + row.badMs < 30000) return;
  try {
    const rows = loadSessions().filter((r) => r.at !== row.at);
    rows.push(row);
    rows.sort((a, b) => (a.at || 0) - (b.at || 0));
    localStorage.setItem(SESS_KEY, JSON.stringify(rows.slice(-SESS_MAX)));
  } catch { /* 저장 공간이 없으면 조용히 넘어갑니다 */ }
}

/** 마이페이지 숫자. 옛 행은 새 필드가 없으므로 0 으로 셉니다 —
    형식이 바뀌었다고 지난 기록을 버리면 세션 수와 총 시간까지 잃습니다. */
/* 병합 정리: 서버저장 판본에 이 이름의 더 단순한 함수(count·total·recov
   셋만 돌려주는 것)가 있어서 자동병합이 그쪽을 남겼습니다. 그런데 회고
   화면은 week·goodMs·byZone 까지 읽으므로, 그대로 두면 회고를 여는 순간
   pastSessionsHtml 이 s.week.map 에서 터집니다. 세션 행을 자세히 남기는
   이쪽 판본을 되살립니다 — sessionRow() 가 그 필드를 채웁니다. */
function myStats() {
  const rows = loadSessions();
  const sum = (k) => rows.reduce((a, r) => a + (r[k] || 0), 0);
  const good = sum('goodMs'), warn = sum('warnMs'), bad = sum('badMs');
  const judged = good + warn + bad;
  const byZone = {};
  for (const r of rows) byZone[r.zone || '기타'] = (byZone[r.zone || '기타'] || 0) + (r.minutes || 0);
  /* 최근 이레 — 날짜별 앉은 분 */
  const week = [];
  for (let i = 6; i >= 0; i--) {
    const d = dayKey(Date.now() - i * 86400000);
    week.push({ d, min: rows.filter((r) => r.date === d).reduce((a, r) => a + (r.minutes || 0), 0) });
  }
  return {
    count: rows.length,
    total: sum('minutes'),
    recov: sum('recoveries'),
    goodMs: good, warnMs: warn, badMs: bad, judged,
    /* 회복 시간 = 편안했던 시간. 판정이 돈 시간 대비 비율로 씁니다 */
    goodPct: judged > 0 ? Math.round((good / judged) * 100) : 0,
    goodMin: Math.round(good / 60000),
    byZone, week,
  };
}

  { id: 'fac-round',   cat: 'face',   name: '동그란테',    price: 200, z: 60, color: '#6B4A35', sprite: 'glasses/round.png' },
  { id: 'fac-sun',     cat: 'face',   name: '선글라스',    price: 260, z: 60, color: '#2B2438', sprite: 'glasses/sunglasses.png' },

  { id: 'bag-backpack',cat: 'bag',    name: '백팩',        price: 180, z: 50, color: '#5B8F5C', sprite: 'bags/backpack.png' },
  { id: 'bag-tote',    cat: 'bag',    name: '에코백',      price: 140, z: 50, color: '#BDB7AE', sprite: 'bags/tote.png' },

  /* 알은 여덟 종 전부 있어야 합니다. 넷만 있던 판에서는 EGG_CHARACTER 가
     여덟을 아는데 상품은 넷이라, 미어캣·돼지 알을 사면 EGG_CHARACTER 에
     없는 이름이라 ROOM.character 가 undefined 가 됐습니다.
     색은 각 시트의 **몸통에서 실제로 뽑은 값**입니다(펭귄만 예외 — 몸이
     검어서 표본이 배 흰색으로 잡히므로 테두리 쪽 회청색을 씁니다).
     값은 전부 800 으로 같습니다. 어느 종을 레어로 둘지는 정해진 바가
     없어서, 아무거나 고르느니 안 나누는 쪽을 택했습니다. */
  { id: 'egg-turtle',   cat: 'egg', name: '거북이 알',   price: 800, color: '#8CD296', sprite: null },
  { id: 'egg-giraffe',  cat: 'egg', name: '기린 알',     price: 800, color: '#F08C32', sprite: null },
  { id: 'egg-penguin',  cat: 'egg', name: '펭귄 알',     price: 800, color: '#4A5464', sprite: null },
  { id: 'egg-hamster',  cat: 'egg', name: '햄스터 알',   price: 800, color: '#E6C8A0', sprite: null },
  { id: 'egg-frog',     cat: 'egg', name: '개구리 알',   price: 800, color: '#82DC3C', sprite: null },
  { id: 'egg-hedgehog', cat: 'egg', name: '고슴도치 알', price: 800, color: '#E6B48C', sprite: null },
  { id: 'egg-alpaca',   cat: 'egg', name: '알파카 알',   price: 800, color: '#DCBEA0', sprite: null },
  { id: 'egg-swan',     cat: 'egg', name: '백조 알',     price: 800, color: '#D2D2D2', sprite: null },
];
const SHOP_BY_ID = Object.fromEntries(SHOP.map((i) => [i.id, i]));

/* 예전 판에서 산 아이템(니트·워커·안경)은 이제 없습니다. 그대로 두면
   `SHOP_BY_ID[id]` 가 undefined 라 입은 칸을 그릴 때 터집니다. 들어오는
   길목 하나에서 걸러야 뒤에 있는 모든 곳이 안전합니다. */
function pruneUnknownItems() {
  ROOM.owned = (ROOM.owned || []).filter((id) => SHOP_BY_ID[id]);
  for (const cat of Object.keys(ROOM.worn || {}))
    if (!SHOP_BY_ID[ROOM.worn[cat]]) delete ROOM.worn[cat];
}
pruneUnknownItems();

/* ---- 스프라이트 한 장씩 — 다 뜨면 열린 상점을 다시 그립니다 ---- */
const ITEM_IMG = {};
let itemsPending = 0;
function loadItemImg(path) {
  if (ITEM_IMG[path]) return ITEM_IMG[path];
  const img = new Image();
  itemsPending++;
  img.onload = () => { if (--itemsPending === 0) repaintOpenPanel(); };
  img.onerror = () => { itemsPending--; };            // 그림이 없으면 색 블록으로 물러납니다
  img.src = ITEM_BASE + path;
  ITEM_IMG[path] = img;
  return img;
}
const itemReady = (img) => !!img && img.complete && img.naturalWidth > 0;

const MANNEQUIN = loadItemImg('mannequin.png');

/* ==================================================================
   캐릭터 — 32x48 시트

   월드는 타일이 16px 인데 캐릭터는 32x48 입니다. 가로 두 칸 세로 세 칸을
   차지한다는 뜻이라, 타일 격자와 어긋나지 않습니다.

   시트 한 장에 right / up / left / down 네 프레임이 가로로 붙어 있고,
   아이템(assets/items)과 프레임 순서가 같습니다 — 순서가 다르면 옷만
   반대쪽을 보게 됩니다.

   발바닥은 프레임 안에서 y45 입니다(y46-47 은 예전 바닥 그림자 자리로
   비워 둡니다). 그래서 그릴 때 player.y 에서 45 를 빼고 얹습니다.
   ================================================================== */
const CHAR_W = 32, CHAR_H = 48;
/* sitSquash 는 이 판본에 이미 있습니다(위 캐릭터 상태 쪽). 여기서 다시
   선언하면 스크립트가 통째로 안 돕니다. */
const CHAR_GROUND_Y = 45;                       // 프레임 안에서 발바닥이 닿는 줄
const CHAR_BASE_PATH = 'assets/characters/';

/* 종마다 다른 것은 셋뿐입니다.
     line  — 테두리 색. 아이템 테두리(#2b2438)를 이 색으로 바꿔 그립니다.
             안 바꾸면 머리·다리는 종 색 테두리인데 옷만 검은 테두리가 되어
             이음매가 보입니다.
     hatDy — 정수리 높이 차이. 모자를 이만큼 올리거나 내립니다.
     eyeDy — 눈높이 차이. 안경이 씁니다.
   숫자는 시안 8장을 32x48 격자에서 직접 재서 나온 값입니다. */
const CHAR_SPECIES = {
  '거북이':   { slug: 'turtle',   line: '#142814', hatDy: 0,  eyeDy: 0 },
  '기린':     { slug: 'giraffe',  line: '#82461e', hatDy: 0,  eyeDy: 0 },
  '펭귄':     { slug: 'penguin',  line: '#1a1a24', hatDy: -1, eyeDy: 0 },
  '햄스터':   { slug: 'hamster',  line: '#6b3d18', hatDy: -1, eyeDy: 0 },
  '개구리':   { slug: 'frog',     line: '#1e5a1e', hatDy: 1,  eyeDy: -4 },
  '고슴도치': { slug: 'hedgehog', line: '#28140a', hatDy: -2, eyeDy: 0 },
  '알파카':   { slug: 'alpaca',   line: '#785a46', hatDy: -1, eyeDy: 0 },
  '백조':     { slug: 'swan',     line: '#6e6e78', hatDy: 0,  eyeDy: 0 },
};
const CHAR_IMG = {};
for (const sp of Object.values(CHAR_SPECIES)) {
  const img = new Image();
  itemsPending++;
  img.onload = () => { dressedCache = null; if (--itemsPending === 0) repaintOpenPanel(); };
  img.onerror = () => { itemsPending--; };
  img.src = CHAR_BASE_PATH + sp.slug + '.png';
  CHAR_IMG[sp.slug] = img;
}
const speciesOf = (name) => CHAR_SPECIES[name] || CHAR_SPECIES['거북이'];

/* 아이템 테두리를 종 테두리 색으로 바꾼 사본. 종·아이템 쌍마다 한 번만 굽습니다.
   file:// 로 열면 픽셀을 읽을 수 없어(보안 제약) 원본을 그대로 씁니다 —
   색이 조금 어긋날 뿐 그림은 나옵니다. */
const OUTLINE_SRC = [0x2b, 0x24, 0x38];
const tintCache = new Map();
function tintedItem(sheet, line) {
  if (!sheet) return null;
  const key = (sheet.src || sheet.__id || '') + '|' + line;
  if (tintCache.has(key)) return tintCache.get(key);
  let out = sheet;
  try {
    const c = document.createElement('canvas');
    c.width = sheet.width || sheet.naturalWidth; c.height = sheet.height || sheet.naturalHeight;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.imageSmoothingEnabled = false;
    g.drawImage(sheet, 0, 0);
    const d = g.getImageData(0, 0, c.width, c.height);
    const r = parseInt(line.slice(1, 3), 16), gg = parseInt(line.slice(3, 5), 16), b = parseInt(line.slice(5, 7), 16);
    for (let i = 0; i < d.data.length; i += 4) {
      if (d.data[i + 3] === 0) continue;
      if (d.data[i] === OUTLINE_SRC[0] && d.data[i + 1] === OUTLINE_SRC[1] && d.data[i + 2] === OUTLINE_SRC[2]) {
        d.data[i] = r; d.data[i + 1] = gg; d.data[i + 2] = b;
      }
    }
    g.putImageData(d, 0, 0);
    out = c;
  } catch { /* 픽셀을 못 읽으면 원본 그대로 */ }
  tintCache.set(key, out);
  return out;
}

/* 상의·가방은 종마다 몸 실루엣에 맞춰 깎아 둔 판본이 따로 있습니다.
   시안 8종은 어깨 높이가 제각각이라(거북이 y25, 백조 y33) 한 벌을 그대로
   얹으면 소매가 몸 밖으로 튀어나옵니다. */
const FITTED_CATS = { top: 'tops', bag: 'bags' };
function fittedPath(it, slug) {
  const folder = FITTED_CATS[it.cat];
  if (!folder || !it.sprite) return null;
  return 'fitted/' + slug + '/' + it.sprite;
}
/* 과잠은 sprite 가 없고 base+mask 로 그때그때 굽습니다. 그래서 위 fittedPath
   가 null 을 돌려주고, 종별로 깎은 판을 못 탑니다 — 백조·펭귄처럼 몸이 좁은
   종에서 소매만 몸 밖으로 나갑니다. base·mask 도 종별로 깎아 둔 것을 씁니다. */
function fittedRecolor(it, slug) {
  if (!it.recolor || !FITTED_CATS[it.cat]) return null;
  const b = loadItemImg('fitted/' + slug + '/' + it.recolor.base);
  const m = loadItemImg('fitted/' + slug + '/' + it.recolor.mask);
  return itemReady(b) && itemReady(m) ? { base: b, mask: m } : null;
}
function itemSheetFor(it, sp, col) {
  const fp = fittedPath(it, sp.slug);
  if (fp) {
    const img = loadItemImg(fp);
    if (itemReady(img)) return img;
  }
  return itemSheet(it, col, sp.slug);
}

/** 모자·안경은 머리를 따라 올라갑니다(item-spec §5). 나머지는 몸에 붙습니다. */
/* 상점의 안경 칸은 cat 이 'face' 입니다('glasses' 는 그림 폴더 이름일 뿐).
   여기서 'glasses' 를 보고 있어서 안경은 언제나 followsHead 가 거짓이었고,
   종별 eyeDy 가 한 번도 안 먹었습니다. */
const followsHead = (it) => it.cat === 'hat' || it.cat === 'face';

/* 옷을 입힌 시트 한 장. 종·입은 것·학교색이 그대로면 다시 굽지 않습니다 —
   60fps 로 매 프레임 합성하면 그리는 것보다 합성이 비쌉니다. */
let dressedCache = null, dressedKey = '';
function dressedSheet() {
  const sp = speciesOf(ROOM.character);
  const key = sp.slug + '|' + JSON.stringify(ROOM.worn || {}) + '|' + schoolColor();
  if (dressedCache && dressedKey === key) return dressedCache;
  const base = CHAR_IMG[sp.slug];
  if (!itemReady(base)) return null;
  const c = document.createElement('canvas');
  c.width = CHAR_W * 4; c.height = CHAR_H;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.drawImage(base, 0, 0);
  const on = Object.values(ROOM.worn || {}).map((id) => SHOP_BY_ID[id]).filter(Boolean);
  for (const it of on.sort((a, b) => a.z - b.z)) {
    const sheet = tintedItem(itemSheetFor(it, sp, schoolColor()), sp.line);
    if (!sheet) continue;
    g.drawImage(sheet, 0, followsHead(it) ? (it.cat === 'hat' ? sp.hatDy : sp.eyeDy) : 0);
  }
  dressedCache = c; dressedKey = key;
  return c;
}

/* ==================================================================
   다른 사람도 같은 그림으로 — multiplayer.js 가 쓰는 창구

   내 캐릭터만 32x48 이면 화면에 두 크기가 섞입니다. 남을 그리는 쪽은
   파일이 달라서(multiplayer.js) 여기 전역 하나만 열어 둡니다.

   sheetFor(종 이름, 입은 것) -> 128x48 캔버스 (right/up/left/down)
     · 종·입은 것이 같으면 구운 것을 돌려줍니다. 사람이 여럿이어도
       종류만큼만 굽습니다 — 사람마다 구우면 100명이 100장이 됩니다.
     · 시트가 아직 안 왔으면 null. 부르는 쪽이 예전 그림으로 물러나면 됩니다.
   ================================================================== */
const otherCache = new Map();
window.GIRIN_CHAR = {
  W: CHAR_W, H: CHAR_H, groundY: CHAR_GROUND_Y,
  dirIndex: ITEM_DIR,                       // { right:0, up:1, left:2, down:3 }
  species: CHAR_SPECIES,
  names: Object.keys(CHAR_SPECIES),
  /** 내 캐릭터 — 입은 것이 바뀌면 알아서 다시 굽습니다. */
  mine: () => dressedSheet(),
  /**
   * 남의 캐릭터.
   *   worn   { top, bottom, shoes, hat, face, bag } 꼴. 없으면 맨몸.
   *   school 그 사람의 학교. **안 넘기면 내 학교 색으로 칠해집니다** —
   *          홍익대 사람이 내 학교 과잠을 입게 되므로 남을 그릴 때는 넘기세요.
   *          multiplayer.js 가 이름표에 쓰는 값 그대로면 됩니다.
   */
  sheetFor(name, worn, school) {
    const sp = speciesOf(name);
    const base = CHAR_IMG[sp.slug];
    if (!itemReady(base)) return null;
    const tint = school ? schoolColorOf(school) : schoolColor();
    const key = sp.slug + '|' + JSON.stringify(worn || {}) + '|' + tint;
    const hit = otherCache.get(key);
    if (hit) return hit;
    const c = document.createElement('canvas');
    c.width = CHAR_W * 4; c.height = CHAR_H;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    g.drawImage(base, 0, 0);
    const on = Object.values(worn || {}).map((id) => SHOP_BY_ID[id]).filter(Boolean);
    for (const it of on.sort((a, b) => a.z - b.z)) {
      /* 과잠만 학교 색을 탑니다 — 남을 그릴 때는 그 사람 학교 색이어야 합니다. */
      const sheet = tintedItem(itemSheetFor(it, sp, tint), sp.line);
      if (sheet) g.drawImage(sheet, 0, followsHead(it) ? (it.cat === 'hat' ? sp.hatDy : sp.eyeDy) : 0);
    }
    /* 종류가 아무리 많아도 24장이면 충분합니다 — 8종 x 자주 쓰는 조합 몇 개.
       넘치면 가장 오래된 것부터 버립니다. */
    if (otherCache.size >= 24) otherCache.delete(otherCache.keys().next().value);
    otherCache.set(key, c);
    return c;
  },
};

for (const it of SHOP) {
  if (it.sprite) loadItemImg(it.sprite);
  if (it.recolor) { loadItemImg(it.recolor.base); loadItemImg(it.recolor.mask); }
}

/* 과잠 — 무채색 마스크에 학교 색을 곱하면 회색 2단계가 그대로 명암이
   됩니다(item-spec §7). 학교를 바꾸기 전까지는 같은 그림이라 캐시합니다. */
/* 화면에 학교가 여럿일 수 있어 (종+색) 별로 담습니다. 한 칸짜리로 두면
   학교가 다른 두 사람이 매 프레임 서로를 밀어내며 다시 굽습니다. */
const varsityCache = new Map();
function varsitySheet(col, slug) {
  col = col || schoolColor();
  const key = (slug || '-') + '|' + col;
  const hit = varsityCache.get(key);
  if (hit) return hit;
  const it = SHOP_BY_ID['top-varsity'], r = it.recolor;
  const fit = slug ? fittedRecolor(it, slug) : null;
  const base = fit ? fit.base : ITEM_IMG[r.base];
  const mask = fit ? fit.mask : ITEM_IMG[r.mask];
  if (!itemReady(base) || !itemReady(mask)) return null;
  const c = document.createElement('canvas');
  c.width = ITEM_W * 4; c.height = ITEM_H;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.drawImage(mask, 0, 0);
  g.globalCompositeOperation = 'multiply';
  g.fillStyle = col; g.fillRect(0, 0, c.width, c.height);
  g.globalCompositeOperation = 'destination-in';      // 곱하면서 번진 알파를 되돌립니다
  g.drawImage(mask, 0, 0);
  g.globalCompositeOperation = 'source-over';
  g.drawImage(base, 0, 0);                            // 흰 소매·립은 학교색을 안 탑니다
  /* tintedItem 의 열쇠는 sheet.src 인데 캔버스에는 그것이 없습니다. 이름을
     안 붙이면 학교가 달라도 전부 '' 한 칸을 나눠 써서, 처음 구운 학교 색이
     모두에게 돌아갑니다. 색과 종이 들어간 이름을 붙입니다. */
  c.__id = 'varsity|' + key;
  /* 종별로 깎은 판을 달라고 했는데 아직 안 왔으면 담아 두지 않습니다 —
     담으면 이 프레임의 임시 그림이 영영 남아 실루엣이 안 맞습니다. */
  if (slug && !fit) return c;
  if (varsityCache.size >= 16) varsityCache.delete(varsityCache.keys().next().value);
  varsityCache.set(key, c);
  return c;
}

/** 아이템 하나의 그림 한 장 — 과잠이면 학교색을 입힌 것. */
function itemSheet(it, col, slug) {
  if (it.recolor) return varsitySheet(col, slug);
  const img = it.sprite && ITEM_IMG[it.sprite];
  return itemReady(img) ? img : null;
}

/** 마네킹 위에 입은 것을 z 순서로 쌓아 한 방향을 그립니다. */
function drawDoll(g, worn, dir, zoom) {
  const sx = ITEM_DIR[dir] * ITEM_W;
  const sp = speciesOf(ROOM.character);
  const put = (src, dy) => g.drawImage(src, sx, 0, ITEM_W, ITEM_H, 0, (dy || 0) * zoom, ITEM_W * zoom, ITEM_H * zoom);
  g.imageSmoothingEnabled = false;
  /* 몸은 검사용 마네킹이 아니라 지금 고른 종입니다. 시트가 아직 안 왔으면
     마네킹으로 물러납니다 — 빈 화면보다 낫습니다. */
  const body = CHAR_IMG[sp.slug];
  if (itemReady(body)) put(body);
  else if (itemReady(MANNEQUIN)) put(MANNEQUIN);
  const on = Object.values(worn || {}).map((id) => SHOP_BY_ID[id]).filter(Boolean);
  for (const it of on.sort((a, b) => a.z - b.z)) {
    const sheet = tintedItem(itemSheetFor(it, sp), sp.line);
    if (sheet) put(sheet, followsHead(it) ? (it.cat === 'hat' ? sp.hatDy : sp.eyeDy) : 0);
  }
}
/* 알은 입는 게 아니라 캐릭터가 바뀌는 것이라 칸이 아니라 이름으로 갑니다 */
const EGG_CHARACTER = {
  'egg-turtle': '거북이', 'egg-giraffe': '기린', 'egg-penguin': '펭귄',
  'egg-hamster': '햄스터', 'egg-frog': '개구리', 'egg-hedgehog': '고슴도치',
  'egg-alpaca': '알파카', 'egg-swan': '백조',
};

const itemColor = (it) => (it.school ? schoolColor() : it.color);
const owns = (id) => ROOM.owned.includes(id);
const wearing = (id) => {
  const it = SHOP_BY_ID[id];
  return it.cat === 'egg' ? ROOM.character === EGG_CHARACTER[id] : ROOM.worn[it.cat] === id;
};

/** 왼쪽 미리보기 — 입은 것을 마네킹에 실제로 겹쳐 보여 줍니다. */
function shopPreviewHtml() {
  const layer = (cat, label) => {
    const id = ROOM.worn[cat];
    const it = id && SHOP_BY_ID[id];
    return `<div class="lay">
      <i style="background:${it ? itemColor(it) || 'var(--line-2)' : 'var(--surface-3)'}"></i>
      <span>${label}</span><em>${it ? esc(it.name) : '없음'}</em></div>`;
  };
  const Z = 3;
  return `
    <div class="shop-prev">
      <canvas class="doll" data-doll="down" data-zoom="${Z}"
        width="${ITEM_W * Z}" height="${ITEM_H * Z}"></canvas>
      <div class="who"><b>${esc(ROOM.nickname)}</b><em>${esc(ROOM.character)}</em></div>
      <div class="lays">
        ${layer('hat', '모자')}${layer('face', '안경')}${layer('top', '상의')}
        ${layer('bottom', '하의')}${layer('shoes', '신발')}${layer('bag', '가방')}
      </div>
      <p class="hint">지금 고른 캐릭터 몸에 그대로 겹쳐 보여 줍니다.
        옷은 종마다 몸 실루엣에 맞춰 깎인 판을 씁니다.</p>
    </div>`;
}

function shopTabHtml(cat) {
  const items = SHOP.filter((i) => i.cat === cat);
  const card = (it) => {
    const have = owns(it.id), on = wearing(it.id);
    const afford = ROOM.coins >= it.price;
    const action = !have
      ? `<button class="act" data-buy="${it.id}"${afford ? '' : ' disabled'}>${it.price}</button>`
      : on
        ? `<button class="act ghost" data-off="${it.id}">벗기</button>`
        : `<button class="act" data-on="${it.id}">입기</button>`;
    /* zoom 2 — 격자 칸의 그림을 두 배로 키웁니다. 캔버스 자체를 크게
       잡아야(64x96) 확대해도 픽셀이 또렷합니다. CSS 로만 늘리면
       image-rendering 이 있어도 브라우저마다 결과가 다릅니다. */
    return `<div class="item${on ? ' on' : ''}">
      <canvas class="thumb" data-item="${it.id}" data-zoom="2"
        width="${ITEM_W * 2}" height="${ITEM_H * 2}"></canvas>
      <span>${esc(it.name)}${it.desc ? `<em>${esc(it.desc)}</em>` : ''}</span>
      ${have && !on ? '<u>보유</u>' : ''}
      ${action}</div>`;
  };
  return `<div class="shop">
    <div class="shop-list">
      <div class="shop-coin">가진 코인 <b>${ROOM.coins}</b></div>
      <div class="shop-grid">${items.map(card).join('')}</div>
    </div>
    ${shopPreviewHtml()}
  </div>`;
}


/* ================== 미니게임 ==================
   연우 판본(feat/openworld-develop)에서 그대로 옮겼습니다. 관문 넷이
   서 있기만 하던 자리에 실제로 할 것이 생깁니다.

   보상은 이 판본의 award() 를 거칩니다 — 연우 쪽 earn() 은 별도 코인
   장부를 쓰는데, 두 장부가 같은 잔액을 건드리면 상한이 무의미해집니다. */
/* 게임 보상. 게임마다 하루 한 번입니다 — 같은 판을 돌려 코인을 모으면
   미니게임존이 쉬는 곳이 아니라 일하는 곳이 됩니다.
   어느 게임인지는 열려 있는 패널이 압니다. */
function earn(amount, why) {
  rwRoll();
  const key = activePanelKey || 'game';
  RW.daily.games = RW.daily.games || [];
  if (RW.daily.games.includes(key)) return 0;    // 오늘 이미 받았습니다
  RW.daily.games.push(key); saveRW();
  /* 서버도 게임별 하루 1회를 따로 셉니다. 로컬은 표시를 즉시 맞추는
     용도이고, 돌아온 잔액이 정답입니다. */
  if (window.WORLD_SAVE && WORLD_SAVE.configured) WORLD_SAVE.earnMinigame(key).then(applyServerBalance);
  return grant(COIN_MINIGAME, why || '미니게임');
}

/* ==================================================================
   미니게임 1 — 기린 목 펴기

   고개를 숙인 기린이 3분 안에 바른 자세를 찾도록 도와주는 게임입니다.
   Space 또는 게임 영역 클릭을 연속해서 입력할수록 목이 펴집니다.
   ================================================================== */
const GAME_MS = 180000;          // 넷 공통 제한 — 3분
/** 남은 시간을 3:00 꼴로. 초만 쓰면 180초가 얼마인지 세어 봐야 압니다. */
function mmss(ms) {
  const t = Math.max(0, Math.ceil(ms / 1000));
  return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
}
const GIRAFFE_NECK = {
  active: false, timer: 0, startedAt: 0, angle: 42, combo: 0, lastTapAt: 0, rewarded: false,
};
const GIRAFFE_START_ANGLE = 42;
const GIRAFFE_TARGET_ANGLE = 4;
function giraffeNeckHtml() {
  return `
    <p>고개 숙인 기린의 목을 3분 안에 펴 주세요.</p>
    <div class="rows">
      <div class="row"><span>남은 시간</span><span class="val" id="giraffe-time">3:00</span></div>
      <div class="row"><span>조작</span><span class="val">Space · 클릭</span></div>
      <div class="row"><span>목표</span><span class="val">목을 끝까지 펴기</span></div>
    </div>
    <div class="giraffe-stage" data-do="giraffe-tap" role="button" tabindex="0" aria-label="기린 목 펴기. 클릭해서 목을 펴세요." style="position:relative;height:260px;margin:14px 0;border-radius:14px;background:linear-gradient(180deg,#dce9ef,#f4dfb9);overflow:hidden;cursor:pointer;user-select:none">
      <div class="giraffe-body" style="position:absolute;left:50%;bottom:12px;width:58px;height:58px;transform:translateX(-50%);border-radius:48% 48% 35% 35%;background:#d7953f;border:4px solid #9b5b2b;box-shadow:inset 10px 0 #edb657,inset -9px 0 #b66d31"></div>
      <div id="giraffe-neck-group" style="position:absolute;left:calc(50% - 32px);bottom:52px;width:64px;height:110px;transform-origin:50% 100%;transition:transform .12s ease">
        <div class="giraffe-neck" id="giraffe-neck" style="position:absolute;left:20px;bottom:0;width:24px;height:78px;background:#e8ad50;border:4px solid #9b5b2b;border-bottom:0;border-radius:14px 14px 0 0"><i style="position:absolute;left:4px;top:14px;width:7px;height:7px;border-radius:50%;background:#a96b30;box-shadow:10px 16px #a96b30,0 38px #a96b30,10px 58px #a96b30"></i></div>
        <div class="giraffe-head" id="giraffe-head" style="position:absolute;left:0;bottom:67px;width:64px;height:40px;background:#e8ad50;border:4px solid #9b5b2b;border-radius:45% 55% 40% 35%"><i style="position:absolute;right:13px;top:14px;width:7px;height:7px;border-radius:50%;background:#2a2520"></i><b style="position:absolute;right:-11px;top:20px;width:16px;height:8px;background:#e8ad50;border:3px solid #9b5b2b;border-left:0;border-radius:0 10px 10px 0"></b><em style="position:absolute;left:10px;top:-12px;width:7px;height:12px;border-left:3px solid #9b5b2b;border-right:3px solid #9b5b2b"></em></div>
      </div>
      <span class="giraffe-tap-hint" style="position:absolute;left:50%;bottom:8px;transform:translateX(-50%);padding:3px 9px;border-radius:999px;background:rgba(42,37,32,.72);color:#fff;font-size:12px">여기를 연속 클릭!</span>
    </div>
    <div style="margin:14px 0 10px;height:12px;border-radius:999px;background:var(--surface-3);overflow:hidden;border:1px solid var(--line-2)">
      <i id="giraffe-progress" style="display:block;width:0%;height:100%;background:var(--good);transition:width .12s ease"></i>
    </div>
    <p class="hint" id="giraffe-message" aria-live="polite">Space 또는 기린을 클릭해 주세요.</p>
    <button class="act" data-do="giraffe-restart">다시 시작</button>`;
}
function renderGiraffeNeck() {
  const neck = panelBody.querySelector('#giraffe-neck');
  const head = panelBody.querySelector('#giraffe-head');
  const time = panelBody.querySelector('#giraffe-time');
  const progress = panelBody.querySelector('#giraffe-progress');
  if (!neck || !head || !time || !progress) return;
  const elapsed = GIRAFFE_NECK.active ? Date.now() - GIRAFFE_NECK.startedAt : 0;
  const progressValue = Math.max(0, Math.min(100, ((GIRAFFE_START_ANGLE - GIRAFFE_NECK.angle) / (GIRAFFE_START_ANGLE - GIRAFFE_TARGET_ANGLE)) * 100));
  const group = panelBody.querySelector('#giraffe-neck-group');
  if (group) group.style.transform = `rotate(${GIRAFFE_NECK.angle}deg)`;
  time.textContent = GIRAFFE_NECK.active ? mmss(GAME_MS - elapsed) : time.textContent;
  progress.style.width = `${progressValue}%`;
}
function finishGiraffeNeck(success) {
  GIRAFFE_NECK.active = false;
  clearInterval(GIRAFFE_NECK.timer);
  const stage = panelBody.querySelector('.giraffe-stage');
  const message = panelBody.querySelector('#giraffe-message');
  const button = panelBody.querySelector('[data-do="giraffe-restart"]');
  if (success) {
    if (!GIRAFFE_NECK.rewarded) {
      GIRAFFE_NECK.rewarded = true;
      earn(5, '기린 목 펴기 성공');
    }
    if (stage) stage.innerHTML = '<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(145deg,#ff6b52,#f04d39);color:#fff;text-align:center"><strong style="font-size:42px;line-height:1;letter-spacing:-.08em">성공!</strong><span style="margin-top:12px;font-size:16px;font-weight:700">기린이 바른 자세를 찾았어요</span><b style="margin-top:18px;padding:7px 14px;border-radius:999px;background:#fff;color:#d84635;font-size:15px">+5P</b></div>';
    if (message) message.textContent = '멋져요! 포인트 5P를 받았어요.';
  } else if (message) {
    message.textContent = '시간이 끝났어요. 조금 더 빠르게 연속 입력해 보세요.';
  }
  if (button) button.textContent = '다시 하기';
  renderGiraffeNeck();
}
function tickGiraffeNeck() {
  if (!GIRAFFE_NECK.active) return;
  const now = Date.now();
  if (now - GIRAFFE_NECK.lastTapAt > 700) GIRAFFE_NECK.combo = 0;
  GIRAFFE_NECK.angle = Math.min(GIRAFFE_START_ANGLE, GIRAFFE_NECK.angle + .14);
  if (GIRAFFE_NECK.angle <= GIRAFFE_TARGET_ANGLE) return finishGiraffeNeck(true);
  if (now - GIRAFFE_NECK.startedAt >= GAME_MS) return finishGiraffeNeck(false);
  renderGiraffeNeck();
}
function tapGiraffeNeck() {
  if (!GIRAFFE_NECK.active) return;
  const now = Date.now();
  GIRAFFE_NECK.combo = now - GIRAFFE_NECK.lastTapAt <= 700 ? GIRAFFE_NECK.combo + 1 : 1;
  GIRAFFE_NECK.lastTapAt = now;
  const lift = Math.min(1.2, .8 + GIRAFFE_NECK.combo * .05);
  GIRAFFE_NECK.angle = Math.max(GIRAFFE_TARGET_ANGLE, GIRAFFE_NECK.angle - lift);
  const message = panelBody.querySelector('#giraffe-message');
  if (message) message.textContent = GIRAFFE_NECK.combo >= 3 ? `${GIRAFFE_NECK.combo} 콤보! 계속 눌러 주세요.` : '좋아요! 목이 펴지고 있어요.';
  renderGiraffeNeck();
  if (GIRAFFE_NECK.angle <= GIRAFFE_TARGET_ANGLE) finishGiraffeNeck(true);
}
function startGiraffeNeck() {
  clearInterval(GIRAFFE_NECK.timer);
  GIRAFFE_NECK.active = true;
  GIRAFFE_NECK.startedAt = Date.now();
  GIRAFFE_NECK.angle = GIRAFFE_START_ANGLE;
  GIRAFFE_NECK.combo = 0;
  GIRAFFE_NECK.lastTapAt = 0;
  GIRAFFE_NECK.rewarded = false;
  GIRAFFE_NECK.timer = setInterval(tickGiraffeNeck, 100);
  renderGiraffeNeck();
}

/* ==================================================================
   미니게임 2 — 방탈출

   3분 안에 방 안의 단서 세 개를 찾아 숫자를 순서대로 입력합니다.
   단서는 한 번에 하나씩 열리므로 발견하는 과정이 게임의 핵심입니다.
   ================================================================== */
const ESCAPE_ROOM = {
  active: false, timer: 0, startedAt: 0, clues: [false, false, false],
  digits: ['4', '2', '8'], rewarded: false,
};
function escapeRoomHtml() {
  return `
    <p>방 안의 단서 3개를 찾아 비밀번호를 완성하세요.</p>
    <div class="rows">
      <div class="row"><span>남은 시간</span><span class="val" id="escape-time">3:00</span></div>
      <div class="row"><span>찾은 단서</span><span class="val" id="escape-found">0 / 3</span></div>

    </div>

    </div>
    <div id="escape-code" style="text-align:center;letter-spacing:.35em;font-size:28px;font-weight:800;padding:10px;border-radius:10px;background:var(--surface-3)">_ _ _</div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <input id="escape-input" inputmode="numeric" maxlength="3" placeholder="비밀번호 3자리" aria-label="방탈출 비밀번호" style="flex:1;min-width:0;padding:11px;border:1px solid var(--line-2);border-radius:10px;font:inherit">
      <button class="act" data-do="escape-submit">확인</button>
    </div>
    <p class="hint" id="escape-message" aria-live="polite">단서를 모두 찾아 숫자를 입력해 주세요.</p>
    <button class="act" data-do="escape-restart">다시 시작</button>`;
}
function renderEscapeRoom() {
  const time = panelBody.querySelector('#escape-time');
  const found = panelBody.querySelector('#escape-found');
  if (!time || !found) return;
  const elapsed = ESCAPE_ROOM.active ? Date.now() - ESCAPE_ROOM.startedAt : 0;
  time.textContent = ESCAPE_ROOM.active ? mmss(GAME_MS - elapsed) : time.textContent;
  found.textContent = `${ESCAPE_ROOM.clues.filter(Boolean).length} / 3`;
  ESCAPE_ROOM.clues.forEach((open, i) => {
    const cell = panelBody.querySelector(`#escape-clue-${i}`);
    if (cell) cell.textContent = open ? ESCAPE_ROOM.digits[i] : '?';
  });
  const code = panelBody.querySelector('#escape-code');
  if (code) code.textContent = ESCAPE_ROOM.clues.map((open, i) => open ? ESCAPE_ROOM.digits[i] : '_').join(' ');
}
function finishEscapeRoom(success, message) {
  ESCAPE_ROOM.active = false;
  clearInterval(ESCAPE_ROOM.timer);
  const stage = panelBody.querySelector('#escape-clues');
  const messageEl = panelBody.querySelector('#escape-message');
  if (success) {
    if (!ESCAPE_ROOM.rewarded) {
      ESCAPE_ROOM.rewarded = true;
      earn(5, '방탈출 성공');
    }
    if (stage) stage.innerHTML = '<div style="grid-column:1/-1;height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:14px;background:linear-gradient(145deg,#ff6b52,#f04d39);color:#fff;text-align:center"><strong style="font-size:42px;line-height:1">성공!</strong><span style="margin-top:12px;font-size:16px;font-weight:700">방을 탈출했어요</span><b style="margin-top:18px;padding:7px 14px;border-radius:999px;background:#fff;color:#d84635;font-size:15px">+5P</b></div>';
    if (messageEl) messageEl.textContent = '멋져요! 포인트 5P를 받았어요.';
  } else if (messageEl) messageEl.textContent = message || '시간이 끝났어요. 다시 도전해 보세요.';

function tickEscapeRoom() {
  if (!ESCAPE_ROOM.active) return;
  if (Date.now() - ESCAPE_ROOM.startedAt >= GAME_MS) finishEscapeRoom(false);
  else renderEscapeRoom();

function revealEscapeClue(index) {
  if (!ESCAPE_ROOM.active || ESCAPE_ROOM.clues[index]) return;
  ESCAPE_ROOM.clues[index] = true;
  const message = panelBody.querySelector('#escape-message');
  if (message) message.textContent = `단서 ${index + 1} 발견! 나머지 단서도 찾아보세요.`;
  renderEscapeRoom();
}
function submitEscapeCode() {
  if (!ESCAPE_ROOM.active) return;
  const input = panelBody.querySelector('#escape-input');
  const message = panelBody.querySelector('#escape-message');
  const code = input?.value.trim() || '';
  if (ESCAPE_ROOM.clues.some((clue) => !clue)) {
    if (message) message.textContent = '먼저 단서 3개를 모두 찾아야 해요.';
    return;
  }
  if (code === ESCAPE_ROOM.digits.join('')) return finishEscapeRoom(true);
  if (message) message.textContent = '비밀번호가 맞지 않아요. 단서 순서를 다시 확인해 보세요.';
  if (input) { input.value = ''; input.focus(); }
}
function startEscapeRoom() {
  clearInterval(ESCAPE_ROOM.timer);
  if (!panelBody.querySelector('#escape-clues .escape-clue')) panelBody.innerHTML = escapeRoomHtml();
  ESCAPE_ROOM.active = true;
  ESCAPE_ROOM.startedAt = Date.now();
  ESCAPE_ROOM.clues = [false, false, false];
  ESCAPE_ROOM.rewarded = false;
  ESCAPE_ROOM.timer = setInterval(tickEscapeRoom, 100);
  renderEscapeRoom();
}

}
function renderTurtleEgg() {
  const stage = panelBody.querySelector('.egg-stage');

  const time = panelBody.querySelector('#egg-time');
  const score = panelBody.querySelector('#egg-score');

  TURTLE_EGG.eggs.forEach((egg) => {

}
function moveTurtleBasket(direction) {

function finishTurtleEgg(success, message) {

  const messageEl = panelBody.querySelector('#egg-message');
  if (success) {
    if (!TURTLE_EGG.rewarded) {

    }
    if (stage) stage.innerHTML = '<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(145deg,#5cb177,#3f9960);color:#fff;text-align:center"><strong style="font-size:42px;line-height:1">성공!</strong><span style="margin-top:12px;font-size:16px;font-weight:700">거북이 알을 잘 받았어요</span><b style="margin-top:18px;padding:7px 14px;border-radius:999px;background:#fff;color:#3f9960;font-size:15px">+5P</b></div>';

function tickTurtleEgg() {
  if (!TURTLE_EGG.active) return;

    TURTLE_EGG.eggs.push({ x: 12 + Math.random() * 76, y: 24 });

  TURTLE_EGG.eggs.forEach((egg) => { egg.y += 3.1; });
  const basketY = 152;
  TURTLE_EGG.eggs = TURTLE_EGG.eggs.filter((egg) => {
    if (egg.y >= basketY) {
      if (Math.abs(egg.x - TURTLE_EGG.basketX) <= 10) TURTLE_EGG.caught++;
      else TURTLE_EGG.missed++;
      return false;
    }
    return true;

  const elapsed = now - TURTLE_EGG.startedAt;
  if (TURTLE_EGG.caught >= 5) return finishTurtleEgg(true);
  if (elapsed >= 20000) return finishTurtleEgg(false);
  if (TURTLE_EGG.spawned >= 8 && TURTLE_EGG.eggs.length === 0) return finishTurtleEgg(false);
  renderTurtleEgg();
}

/* ==================================================================
   미니게임 2 — 거북이 알 합치기

   2048 방식의 4×4 블록 퍼즐입니다. 같은 알을 합치면 다음 동물로
   진화하고, 왕관 알을 만들면 성공합니다.
   ================================================================== */
const EGG_MERGE = {
  active: false, board: [], score: 0, rewarded: false,
};
const EGG_TILES = ['','🥚','🐢','🌿','🦒','✨','👑'];
function eggMergeHtml() {
  return `
    <p>같은 알을 합쳐 왕관 알을 만들어 보세요.</p>
    <div class="rows">
      <div class="row"><span>점수</span><span class="val" id="egg-merge-score">0</span></div>
      <div class="row"><span>목표</span><span class="val">👑 왕관 알</span></div>
      <div class="row"><span>조작</span><span class="val">방향키 · WASD</span></div>
    </div>
    <div id="egg-merge-board" style="display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:8px;margin:14px 0;background:#a78360;border-radius:14px;aspect-ratio:1">
      ${Array.from({ length: 16 }, (_, i) => `<div id="egg-cell-${i}" style="display:flex;align-items:center;justify-content:center;border-radius:9px;background:rgba(255,255,255,.24);font-size:clamp(24px,8vw,42px);min-height:52px"></div>`).join('')}
    </div>

    </div>

      <button class="act" data-do="egg-down" aria-label="아래로 이동">↓</button>
      <button class="act" data-do="egg-right" aria-label="오른쪽으로 이동">→</button>
    </div>
    <p class="hint" id="egg-merge-message" aria-live="polite">알을 합쳐 더 큰 동물로 진화시키세요.</p>
    <button class="act" data-do="egg-merge-restart">다시 시작</button>`;
}
function renderEggMerge() {
  const score = panelBody.querySelector('#egg-merge-score');
  if (!score) return;
  score.textContent = EGG_MERGE.score;
  EGG_MERGE.board.forEach((value, i) => {
    const cell = panelBody.querySelector(`#egg-cell-${i}`);
    if (!cell) return;
    cell.textContent = EGG_TILES[value] || '';
    cell.style.background = value ? ['','#f5dfb2','#acd19b','#91c8a8','#f0c566','#e3b2e8','#ffe6a3'][value] : 'rgba(255,255,255,.24)';
  });
}
function addEggTile() {
  const empty = EGG_MERGE.board.map((v, i) => v ? -1 : i).filter((i) => i >= 0);
  if (!empty.length) return;
  EGG_MERGE.board[empty[Math.floor(Math.random() * empty.length)]] = Math.random() < .85 ? 1 : 2;
}
function slideEggLine(line) {
  const packed = line.filter(Boolean);
  const result = [];
  for (let i = 0; i < packed.length; i++) {
    if (packed[i] === packed[i + 1]) {
      result.push(packed[i] + 1); EGG_MERGE.score += 2 ** (packed[i] + 1); i++;
    } else result.push(packed[i]);
  }
  while (result.length < 4) result.push(0);
  return result;
}
function moveEggMerge(direction) {
  if (!EGG_MERGE.active) return;
  const before = EGG_MERGE.board.join(',');
  const b = EGG_MERGE.board;
  if (direction === 'a' || direction === 'arrowleft') {
    for (let r = 0; r < 4; r++) b.splice(r * 4, 4, ...slideEggLine(b.slice(r * 4, r * 4 + 4)));
  } else if (direction === 'd' || direction === 'arrowright') {
    for (let r = 0; r < 4; r++) b.splice(r * 4, 4, ...slideEggLine(b.slice(r * 4, r * 4 + 4).reverse()).reverse());
  } else if (direction === 'w' || direction === 'arrowup') {
    for (let c = 0; c < 4; c++) {
      const line = [b[c], b[c + 4], b[c + 8], b[c + 12]];
      const moved = slideEggLine(line);
      moved.forEach((v, r) => { b[r * 4 + c] = v; });
    }
  } else if (direction === 's' || direction === 'arrowdown') {
    for (let c = 0; c < 4; c++) {
      const line = [b[c + 12], b[c + 8], b[c + 4], b[c]];
      const moved = slideEggLine(line);
      moved.reverse().forEach((v, r) => { b[r * 4 + c] = v; });
    }
  }
  if (before === b.join(',')) {
    const movable = b.some((v, i) => !v || (i % 4 < 3 && v === b[i + 1]) || (i < 12 && v === b[i + 4]));
    if (!movable) finishEggMerge(false);
    return;
  }
  addEggTile();
  if (b.some((v) => v >= 6)) return finishEggMerge(true);
  renderEggMerge();
}
function finishEggMerge(success) {
  EGG_MERGE.active = false;
  const board = panelBody.querySelector('#egg-merge-board');
  const message = panelBody.querySelector('#egg-merge-message');
  if (success) {
    if (!EGG_MERGE.rewarded) {
      EGG_MERGE.rewarded = true;
      earn(5, '거북이 알 합치기 성공');
    }
    if (board) board.innerHTML = '<div style="grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:260px;border-radius:10px;background:linear-gradient(145deg,#5cb177,#3f9960);color:#fff;text-align:center"><strong style="font-size:42px;line-height:1">성공!</strong><span style="margin-top:12px;font-size:16px;font-weight:700">왕관 알이 탄생했어요</span><b style="margin-top:18px;padding:7px 14px;border-radius:999px;background:#fff;color:#3f9960;font-size:15px">+5P</b></div>';
    if (message) message.textContent = '멋져요! 포인트 5P를 받았어요.';
  } else if (message) message.textContent = '더 움직일 수 없어요. 다시 도전해 보세요.';
  renderEggMerge();
}
function startEggMerge() {
  if (!panelBody.querySelector('#egg-merge-board')) panelBody.innerHTML = eggMergeHtml();
  EGG_MERGE.active = true;
  EGG_MERGE.board = Array(16).fill(0);
  EGG_MERGE.score = 0;
  EGG_MERGE.rewarded = false;
  addEggTile(); addEggTile();
  renderEggMerge();
}

/* ==================================================================

const GIRAFFE_STACK = {

  direction: 1, rewarded: false, dropping: false, dropTop: 34, round: 0,

function renderGiraffeStack() {

function tickGiraffeStack() {
  if (!GIRAFFE_STACK.active) return;
  GIRAFFE_STACK.x += GIRAFFE_STACK.direction * 1.2;
  const edge = 10;
  if (GIRAFFE_STACK.x >= 100 - edge || GIRAFFE_STACK.x <= edge) GIRAFFE_STACK.direction *= -1;
  renderGiraffeStack();
}
function dropGiraffeStack() {
  if (!GIRAFFE_STACK.active) return;
  if (GIRAFFE_STACK.dropping) return;
  const previous = GIRAFFE_STACK.blocks[GIRAFFE_STACK.blocks.length - 1] || { x: 50, width: 24, visualWidth: 48 };
  const left = Math.max(GIRAFFE_STACK.x - GIRAFFE_STACK.width / 2, previous.x - previous.width / 2);
  const right = Math.min(GIRAFFE_STACK.x + GIRAFFE_STACK.width / 2, previous.x + previous.width / 2);
  const overlap = right - left;
  if (overlap <= 3) return finishGiraffeStack(false);
  const nextVisualWidth = Math.max(30, Math.round(previous.visualWidth * overlap / previous.width));
  const nextX = (left + right) / 2;
  GIRAFFE_STACK.dropping = true;
  GIRAFFE_STACK.dropTop = Math.max(26, 400 - 14 - GIRAFFE_STACK.stackHeight - nextVisualWidth);
  GIRAFFE_STACK.x = nextX;
  GIRAFFE_STACK.visualWidth = nextVisualWidth;
  clearInterval(GIRAFFE_STACK.timer);

    GIRAFFE_STACK.width = overlap;
    GIRAFFE_STACK.x = nextX;
    GIRAFFE_STACK.level++;
    GIRAFFE_STACK.dropping = false;
    GIRAFFE_STACK.dropTop = 104;
    if (GIRAFFE_STACK.level >= 6) return finishGiraffeStack(true);
    GIRAFFE_STACK.timer = setInterval(tickGiraffeStack, 50);

    renderGiraffeStack();

          '<div style="position:relative;width:180px;height:390px">' +
            '<img src="assets/giraffe-lower-legs.png" alt="완성된 기린 다리" style="position:absolute;left:50%;bottom:' + baseBottom + 'px;width:' + legsWidth + 'px;height:' + legsHeight + 'px;transform:translateX(-50%);object-fit:contain">' +
            finishedBlocks +
            '<img src="assets/giraffe-head.png" alt="완성된 기린 머리" style="position:absolute;left:50%;bottom:' + headBottom + 'px;width:' + headWidth + 'px;height:' + Math.round(headWidth * .78) + 'px;transform:translateX(-50%);object-fit:contain">' +

          '<div><strong style="display:block;font-size:42px;line-height:1">성공!</strong><span style="display:block;margin-top:12px;font-size:16px;font-weight:700">내가 만든 기린 완성!</span><b style="display:inline-block;margin-top:18px;padding:7px 14px;border-radius:999px;background:#fff;color:#a56e25;font-size:15px">+5P</b></div>' +

/** 산 뒤에도 보던 칸에 그대로 남아야 합니다 — 매번 상의로 튕기면
    신발 세 켤레를 사는 데 열 번을 눌러야 합니다. */

function reopenShop() {

  openPanel('shop');
