      ${Array.from({ length: 16 }, (_, i) => `<div id="egg-cell-${i}" style="display:flex;align-items:center;justify-content:center;border-radius:9px;background:rgba(255,255,255,.24);font-size:clamp(24px,8vw,42px);min-height:52px"></div>`).join('')}
    </div>
    <div style="display:flex;justify-content:center;gap:8px;margin:8px 0">
      <button class="act" data-do="egg-up" aria-label="위로 이동">↑</button>
    </div>
    <div style="display:flex;justify-content:center;gap:8px">
      <button class="act" data-do="egg-left" aria-label="왼쪽으로 이동">←</button>
      <button class="act" data-do="egg-down" aria-label="아래로 이동">↓</button>
      <button class="act" data-do="egg-right" aria-label="오른쪽으로 이동">→</button>
    </div>
    <p class="hint" id="egg-merge-message" aria-live="polite">알을 합쳐 더 큰 동물로 진화시키세요.</p>
    <button class="act" data-do="egg-merge-restart">다시 시작</button>`;
}
function renderEggMerge() {
  const score = panelBody.querySelector('#egg-merge-score');
  if (!score) return;
  score.textContent = EGG_MERGE.score;
  EGG_MERGE.board.forEach((value, i) => {
    const cell = panelBody.querySelector(`#egg-cell-${i}`);
    if (!cell) return;
    cell.textContent = EGG_TILES[value] || '';
    cell.style.background = value ? ['','#f5dfb2','#acd19b','#91c8a8','#f0c566','#e3b2e8','#ffe6a3'][value] : 'rgba(255,255,255,.24)';
  });
}
function addEggTile() {
  const empty = EGG_MERGE.board.map((v, i) => v ? -1 : i).filter((i) => i >= 0);
  if (!empty.length) return;
  EGG_MERGE.board[empty[Math.floor(Math.random() * empty.length)]] = Math.random() < .85 ? 1 : 2;
}
function slideEggLine(line) {
  const packed = line.filter(Boolean);
  const result = [];
  for (let i = 0; i < packed.length; i++) {
    if (packed[i] === packed[i + 1]) {
      result.push(packed[i] + 1); EGG_MERGE.score += 2 ** (packed[i] + 1); i++;
    } else result.push(packed[i]);
  }
  while (result.length < 4) result.push(0);
  return result;
}
function moveEggMerge(direction) {
  if (!EGG_MERGE.active) return;
  const before = EGG_MERGE.board.join(',');
  const b = EGG_MERGE.board;
  if (direction === 'a' || direction === 'arrowleft') {
    for (let r = 0; r < 4; r++) b.splice(r * 4, 4, ...slideEggLine(b.slice(r * 4, r * 4 + 4)));
  } else if (direction === 'd' || direction === 'arrowright') {
    for (let r = 0; r < 4; r++) b.splice(r * 4, 4, ...slideEggLine(b.slice(r * 4, r * 4 + 4).reverse()).reverse());
  } else if (direction === 'w' || direction === 'arrowup') {
    for (let c = 0; c < 4; c++) {
      const line = [b[c], b[c + 4], b[c + 8], b[c + 12]];
      const moved = slideEggLine(line);
      moved.forEach((v, r) => { b[r * 4 + c] = v; });
    }
  } else if (direction === 's' || direction === 'arrowdown') {
    for (let c = 0; c < 4; c++) {
      const line = [b[c + 12], b[c + 8], b[c + 4], b[c]];
      const moved = slideEggLine(line);
      moved.reverse().forEach((v, r) => { b[r * 4 + c] = v; });
    }
  }
  if (before === b.join(',')) {
    const movable = b.some((v, i) => !v || (i % 4 < 3 && v === b[i + 1]) || (i < 12 && v === b[i + 4]));
    if (!movable) finishEggMerge(false);
    return;
  }
  addEggTile();
  if (b.some((v) => v >= 6)) return finishEggMerge(true);
  renderEggMerge();
}
function finishEggMerge(success) {
  EGG_MERGE.active = false;
  const board = panelBody.querySelector('#egg-merge-board');
  const message = panelBody.querySelector('#egg-merge-message');
  if (success) {
    if (!EGG_MERGE.rewarded) {
      EGG_MERGE.rewarded = true;
      earn(COIN_MINIGAME, '거북이 알 합치기 성공');
    }
    if (board) board.innerHTML = '<div style="grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:260px;border-radius:10px;background:linear-gradient(145deg,#5cb177,#3f9960);color:#fff;text-align:center"><strong style="font-size:42px;line-height:1">성공!</strong><span style="margin-top:12px;font-size:16px;font-weight:700">왕관 알이 탄생했어요</span><b style="margin-top:18px;padding:7px 14px;border-radius:999px;background:#fff;color:#3f9960;font-size:15px">+' + COIN_MINIGAME + '코인</b></div>';
    if (message) message.textContent = gameWinMsg();
  } else if (message) message.textContent = '더 붙일 자리가 없어요. 다시 해 볼까 싶으면 아래 버튼을.';
  renderEggMerge();
}
function startEggMerge() {
  if (!panelBody.querySelector('#egg-merge-board')) panelBody.innerHTML = eggMergeHtml();
  EGG_MERGE.active = true;
  EGG_MERGE.board = Array(16).fill(0);
  EGG_MERGE.score = 0;
  EGG_MERGE.rewarded = false;
  addEggTile(); addEggTile();
  renderEggMerge();
}

/** 산 뒤에도 보던 칸에 그대로 남아야 합니다 — 매번 상의로 튕기면
    신발 세 켤레를 사는 데 열 번을 눌러야 합니다. */

/** 산 뒤에 **열려 있던 그 가게**를 그대로 다시 엽니다. 예전에는 창이
    하나여서 'shop' 을 적어 두면 됐는데, 셋으로 갈린 뒤에도 그대로 두면
    가구를 사자마자 옷 가게로 튕깁니다. */
function reopenShop() {
  const key = isShopPanel(activePanelKey) ? activePanelKey : SHOP_KEYS[0];
  const tabs = [...panelTabs.querySelectorAll('button')];
  const active = Math.max(0, tabs.findIndex((b) => b.getAttribute('aria-selected') === 'true'));
  openPanel(key);
  panelTabs.querySelectorAll('button')[active]?.click();
}

function wornColor(cat) {
  const it = SHOP_BY_ID[ROOM.worn[cat]];
  return it ? itemColor(it) : null;
}
/* 16px 예비 그림 — 종 시트가 아직 안 왔을 때만 씁니다. Kenney 사람의
   몸통 줄만 지금 입은 상의 색(없으면 학교 과잠 색)으로 갈아입힙니다. */
const CHAR_SHEET_COL = 23, CHAR_SHEET_W = 4, CHAR_SHEET_H = 3;
/* 과잠 한 장을 구워 두는 자리.
   병합 정리: 선언이 민철 판본 쪽으로 덮이면서 사라졌습니다. 아래에서
   `if (jacketCanvas)` 로 **읽으므로** 없으면 그 줄에서 바로 터집니다. */
let jacketCanvas = null;

function playerSheet() {
  if (jacketCanvas) return jacketCanvas;
  const c = canvasOf(CHAR_SHEET_W, CHAR_SHEET_H), g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.drawImage(urban, CHAR_SHEET_COL * TS, 0, c.width, c.height, 0, 0, c.width, c.height);
  g.globalCompositeOperation = 'source-atop';
  /* 몸통 줄 하나만 갈아입힙니다. 모자·하의·신발 줄까지 색으로 덮어 봤지만
     16px 안에서 다리 두 짝과 발이 한 덩어리가 되어 원본보다 나빠집니다 —
     머리와 다리는 Kenney 가 그린 대로 두는 편이 사람으로 읽힙니다.
     아무것도 안 입었으면 예전처럼 학교 과잠을 기본으로 입습니다. */
  const col = wornColor('top') || schoolColor();
  for (let r = 0; r < CHAR_SHEET_H; r++) {
    px(g, 0, r * TS + 8, c.width, 5, col);
    px(g, 0, r * TS + 8, c.width, 1, 'rgba(255,255,255,.28)');   // 어깨선
    px(g, 0, r * TS + 12, c.width, 1, 'rgba(0,0,0,.22)');        // 밑단 그늘
  }
  g.globalCompositeOperation = 'source-over';
  jacketCanvas = c;
  return c;
}

function paintItemCanvases() {
  for (const c of panelBody.querySelectorAll('canvas[data-doll]')) {
    const g = c.getContext('2d');
    g.clearRect(0, 0, c.width, c.height);
    drawDoll(g, ROOM.worn, c.dataset.doll || 'down', Number(c.dataset.zoom) || 1);
  }
  for (const c of panelBody.querySelectorAll('canvas[data-item]')) {
    const it = SHOP_BY_ID[c.dataset.item];
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    g.clearRect(0, 0, c.width, c.height);
    const zoom = Number(c.dataset.zoom) || 1;
    if (isFurniture(it)) {
      /* 가구는 그려 둔 그림 그대로입니다. 칸 안에서 최대 배율로 키우되
         정수배만 씁니다 — 1.5배로 늘리면 픽셀 폭이 들쭉날쭉해집니다. */
      drawFurnThumb(g, c.width, c.height, PROP[it.prop]);
    } else if (it && it.cat === 'ride') {
      /* 탈것은 sprite 가 없어서(종과 상관없이 발밑에 한 장) 종이인형만
         부르면 **맨 캐릭터**가 나옵니다. 실제로 상점에서 넷이 다 똑같아
         보였습니다. 세계에서 그리는 것과 같은 방식으로, 탈것 그림 위에
         캐릭터를 얹어 보여 줍니다. */
      drawRideThumb(g, c.width, c.height, it, zoom);
    } else if (it && it.cat === 'egg') {
      drawEggThumb(g, c.width, c.height, itemColor(it) || '#C9C4BE');
    } else if (it && (itemReady(CHAR_IMG[speciesOf(ROOM.character).slug]) || itemReady(MANNEQUIN))) {
      /* 옷만 따로 띄우면 32px 짜리 색 덩어리라 무엇인지 알 수 없습니다.
         지금 고른 종에 그 한 벌만 입혀 보여 줍니다 — 젭·게더도 아이템을
         아바타에 입혀 놓고 고르게 합니다. 고른 색도 여기 바로 반영됩니다. */
      drawDoll(g, { [it.cat]: it.id }, 'down', zoom);
    } else if (it) {
      /* 아직 안 뜬 그림 — 색 블록으로 자리를 지킵니다 */
      g.fillStyle = itemColor(it) || '#C9C4BE';
      g.fillRect(c.width * 0.25, c.height * 0.3, c.width * 0.5, c.height * 0.4);
    }
  }
}
/** 탈것 한 칸 — 탈것 그림 위에 지금 종을 얹습니다. 세계에서 그리는
    규칙(탈것 먼저, 사람 나중, 앉는 것은 앉은 자세)과 같습니다. */
function drawRideThumb(g, W, H, it, zoom) {
  const art = RIDE_ART[it.id];
  const R = RIDES[it.id];
  if (!art || !R) return;
  g.imageSmoothingEnabled = false;
  /* **옆모습**으로 보여 줍니다. 자전거를 앞에서 보면 바퀴 둘과 핸들뿐이라
     킥보드와 구별이 안 갑니다 — 옆에서 봐야 자전거입니다. 캐릭터도 같이
     옆으로 세워야 둘이 같은 방향을 봅니다. */
  const img = art.side || art.front;
  /* 칸 안에서 정수배로만 키웁니다. 1.5배로 늘리면 픽셀 폭이 들쭉날쭉합니다. */
  const k = Math.max(1, Math.min(zoom || 2, Math.floor(W / img.width)));
  const rw = img.width * k, rh = img.height * k;
  /* 바닥선을 칸 아래에서 10px 띄웁니다. 4px 로 뒀더니 자전거 바퀴가
     칸 테두리에 잘렸습니다 — 탈것은 캐릭터보다 옆으로도 아래로도 큽니다. */
  const baseY = Math.round(H - 10);
  g.drawImage(img, Math.round((W - rw) / 2), baseY - rh, rw, rh);
  /* 캐릭터를 그 위에 얹습니다. **선 자세**로 그립니다 — drawDoll 은
     아이템 시트를 겹치는 함수라 자세 시트(bakeStance)를 안 씁니다.
     칸에서는 무엇을 파는지가 먼저이고, 앉는 자세는 세계에서 보입니다. */
  const lift = (R.lift + (R.pose === 'sit' ? R.seatY : 0)) * k;
  g.save();
  g.translate(0, -lift - 3 * k);
  drawDoll(g, ROOM.worn, 'right', k);
  g.restore();
}

/** 가구 그림 한 장을 칸 가운데에 놓습니다. 상점 칸과 꾸미기 칸이 같이 씁니다. */
function drawFurnThumb(g, W, H, d) {
  if (!d || !d.canvas) return;
  const src = d.canvas;
  const k = Math.max(1, Math.floor(Math.min(W / src.width, H / src.height)));
  const w = src.width * k, h = src.height * k;
  g.imageSmoothingEnabled = false;
  g.drawImage(src, Math.round((W - w) / 2), Math.round((H - h) / 2), w, h);
}

/* 알에는 스프라이트가 없습니다(까 봐야 아는 것이라 그림이 없는 게 맞습니다).
   그렇다고 네모난 색 블록을 두면 옆 칸의 옷 그림과 결이 안 맞아 **미완성으로
   보입니다.** 알 모양을 픽셀로 찍고 통째로 확대합니다 — 벡터 타원으로
   그리면 매끈해져서 이 화면에서 혼자 다른 그림체가 됩니다. */
const EGG_ART = [
  '....XXXX....', '..XXXXXXXX..', '.XXXXXXXXXX.', '.XXXXXXXXXX.',
  'XXXXXXXXXXXX', 'XXXXXXXXXXXX', 'XXXXXXXXXXXX', 'XXXXXXXXXXXX',
  'XXXXXXXXXXXX', 'XXXXXXXXXXXX', 'XXXXXXXXXXXX', '.XXXXXXXXXX.',
  '.XXXXXXXXXX.', '..XXXXXXXX..', '....XXXX....',
];
/** #RRGGBB 를 k 배 밝게(>1)·어둡게(<1). 알 색이 종마다 달라 무늬 색을
    표로 또 두면 종이 늘 때마다 손볼 곳이 하나 더 생깁니다. */
function shade(hex, k) {
  const n = parseInt(String(hex).replace('#', ''), 16);
  const c = (v) => Math.max(0, Math.min(255, Math.round(v * k)));
  return 'rgb(' + c((n >> 16) & 255) + ',' + c((n >> 8) & 255) + ',' + c(n & 255) + ')';
}
function drawEggThumb(g, W, H, color) {
  const w = EGG_ART[0].length, h = EGG_ART.length;
  const z = Math.max(1, Math.floor(Math.min(W / (w + 2), H / (h + 2))));
  const ox = Math.round((W - w * z) / 2), oy = Math.round((H - h * z) / 2);
  const put = (x, y, c) => { g.fillStyle = c; g.fillRect(ox + x * z, oy + y * z, z, z); };
  const line = shade(color, 0.55), spot = shade(color, 0.78), lit = shade(color, 1.22);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (EGG_ART[y][x] !== 'X') continue;
    /* 테두리 = 네 이웃 중 하나라도 알이 아닌 칸. 따로 표를 두지 않습니다 */
    const edge = y === 0 || y === h - 1 || x === 0 || x === w - 1
      || EGG_ART[y - 1][x] !== 'X' || EGG_ART[y + 1][x] !== 'X'
      || EGG_ART[y][x - 1] !== 'X' || EGG_ART[y][x + 1] !== 'X';
    put(x, y, edge ? line : color);
  }
  [[4, 6], [5, 6], [7, 9], [8, 9], [3, 10], [6, 12]].forEach(([x, y]) => put(x, y, spot));
  [[3, 3], [4, 3], [3, 4]].forEach(([x, y]) => put(x, y, lit));      // 광택
}

/* repaintOpenPanel 은 위(dressedSheet 앞)에 한 벌만 둡니다. 병합이
   두 벌을 만들어 놨었습니다 — const 와 function 이 같은 스코프에
   겹치면 파일 전체가 SyntaxError 라 흰 화면이 됩니다. */

/** 창 내용을 갈아 끼울 때는 **늘 이 문을 지납니다.** 캔버스는 innerHTML
    로 안 그려지므로, 넣은 다음 한 번 칠해 줘야 합니다. innerHTML 을
    직접 쓰면 인형과 아이템 칸이 빈 채로 남습니다. */
function setPanelBody(html) {
  panelBody.innerHTML = html;
  paintItemCanvases();
  /* 바깥 화면(iframe)이 들어 있으면 뜨는지 지켜봅니다. 창을 그리는 길이
     둘(html · tabHtml)이라 여기 한 곳에서 겁니다. */
  watchEmbeds();
}


/* ==================================================================
   미니게임 3 — 동물 기억력 게임

   16장의 동물 카드를 기억하고 같은 짝을 맞추는 짧은 카드 게임입니다.
   순수 게임 로직은 엔진 모듈에서 관리하고, 이 파일에서는 패널과 입력만
   연결합니다.
   ================================================================== */
const ANIMAL_FIND = { active: false, timerId: null, resolveTimerId: null, finishTimerId: null, effectTimerId: null, game: null, effect: null, lastInputAt: 0, finishedAt: 0 };
function animalFindEngine() { return window.ANIMAL_FIND_ENGINE; }
function animalFindIntroHtml() {
  return `<div style="padding:8px 0 4px">
    <h3 style="margin:0 0 10px;font-size:20px">동물 기억력 게임</h3>
    <p>같은 동물 카드 2장을 찾아보세요. 시작하면 잠깐 전체 카드가 보여요.</p>
    <button class="act" data-do="animal-find-start" style="width:100%;margin-top:12px">게임 시작</button>
  </div>`;
}
/* 카드 UI. 옛 '동물 찾기' 판의 같은 이름 함수 일곱이 이 아래에 한 벌 더
   있었는데, 나중 선언이 앞 것을 덮어 앞쪽은 한 번도 안 불렸습니다.
   덮여 있을 뿐 문법은 멀쩡해서 오류로도 안 잡혔습니다 — 지웁니다. */
function animalMemoryTime(ms) {
  const total = Math.max(0, Math.floor(ms / 1000));
  return `${String(Math.floor(total / 60)).padStart(2, '0')}:${String(total % 60).padStart(2, '0')}`;
}
function animalFindHtml() {
  return `<style>
    @keyframes animalMemoryShake { 0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)} }
    @keyframes animalMemoryMatch { 0%,100%{transform:scale(1)}45%{transform:scale(1.06)} }
    #animal-find-game{position:relative;overflow:hidden}
    /* 판이 넓어졌으니 보드도 같이 큽니다. 다만 4x4 정사각이라 **세로가
       먼저 막힙니다** — 1280x720 에서 창 본문에 쓸 수 있는 세로가 587px 이고,
       숫자 줄·문구·여백을 빼면 443px 뿐입니다. 그래서 가로 560px 과 함께
       58vh 로도 잠급니다: 720 높이에서는 417px(지금과 비슷), 세로가 긴
       화면에서는 560px 까지 자랍니다. 가로만 늘리면 아래가 잘립니다. */
    #animal-find-board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(100%,560px,58vh);margin:16px auto;touch-action:manipulation;perspective:900px}
    .animal-memory-card{position:relative;min-width:0;aspect-ratio:1;padding:0;border:0;border-radius:14px;background:transparent;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
    .animal-memory-card:disabled{cursor:default}
    .animal-memory-card-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .18s ease}
    .animal-memory-card.flipped .animal-memory-card-inner,.animal-memory-card.matched .animal-memory-card-inner{transform:rotateY(180deg)}
    .animal-memory-card-face{position:absolute;inset:0;display:grid;place-items:center;border-radius:14px;backface-visibility:hidden;box-shadow:inset 0 -5px 0 rgba(0,0,0,.12)}
    .animal-memory-card-back{background:linear-gradient(145deg,#2dd4bf,#168f84);color:#eafffb;font-size:clamp(20px,7vw,44px)}
    .animal-memory-card-front{transform:rotateY(180deg);font-size:clamp(28px,9vw,64px)}
    .animal-memory-card.mismatch{animation:animalMemoryShake .24s ease}
    .animal-memory-card.success{animation:animalMemoryMatch .3s ease}
    .animal-memory-card.matched .animal-memory-card-front{box-shadow:0 0 0 3px #ffd166,inset 0 -5px 0 rgba(0,0,0,.12)}
    .animal-memory-preview{margin:8px 0;text-align:center;color:var(--ink-2);font-weight:700}
    @media (max-width:520px){#animal-find-board{gap:6px}.animal-memory-card-face{border-radius:11px}}
  </style>
  <div id="animal-find-game">
    <div class="rows" style="grid-template-columns:repeat(4,1fr)">
      <div class="row"><span>TIME</span><span class="val" id="animal-find-time">00:00</span></div>
      <div class="row"><span>MOVES</span><span class="val" id="animal-find-moves">0</span></div>
      <div class="row"><span>SCORE</span><span class="val" id="animal-find-score">0</span></div>
      <div class="row"><span>COMBO</span><span class="val" id="animal-find-combo">0</span></div>
    </div>
    <p class="animal-memory-preview" id="animal-find-message" aria-live="polite">카드 위치를 기억해보세요.</p>
    <div id="animal-find-board" role="group" aria-label="동물 기억력 카드 보드"></div>
  </div>`;
}
function animalFindResultHtml() {
  const game = ANIMAL_FIND.game;
  const elapsed = Math.max(0, (ANIMAL_FIND.finishedAt || performance.now()) - (game.playStartedAt || 0));
  let bestScore = 0, bestTime = 0, bestMoves = 0;
  try {
    bestScore = Number(localStorage.getItem('girin.animalMemory.highScore')) || 0;
    bestTime = Number(localStorage.getItem('girin.animalMemory.bestTimeMs')) || 0;
    bestMoves = Number(localStorage.getItem('girin.animalMemory.bestMoves')) || 0;
  } catch { /* private mode */ }
  bestScore = Math.max(bestScore, game.score);
  bestTime = bestTime === 0 ? elapsed : Math.min(bestTime, elapsed);
  bestMoves = bestMoves === 0 ? game.moves : Math.min(bestMoves, game.moves);
  try {
    localStorage.setItem('girin.animalMemory.highScore', String(bestScore));
    localStorage.setItem('girin.animalMemory.bestTimeMs', String(bestTime));
    localStorage.setItem('girin.animalMemory.bestMoves', String(bestMoves));
  } catch { /* private mode */ }
  return `<div style="text-align:center;padding:20px 0">
    <h3 style="margin:0 0 16px;font-size:26px">게임 완료!</h3>
    <div class="rows">
      <div class="row"><span>최종 점수</span><span class="val">${game.score}</span></div>
      <div class="row"><span>플레이 시간</span><span class="val">${animalMemoryTime(elapsed)}</span></div>
      <div class="row"><span>Move</span><span class="val">${game.moves}</span></div>
      <div class="row"><span>최대 Combo</span><span class="val">${game.maxCombo}</span></div>
      <div class="row"><span>최고 점수</span><span class="val">${bestScore}</span></div>
    </div>
    <button class="act" data-do="animal-find-start" style="width:100%;margin-top:16px">다시 하기</button>
  </div>`;
}
function renderAnimalFind(now = performance.now()) {
  const engine = animalFindEngine(), game = ANIMAL_FIND.game;
  const board = panelBody.querySelector('#animal-find-board');
  const root = panelBody.querySelector('#animal-find-game');
  if (!engine || !game || !board || !root) return;
  const time = panelBody.querySelector('#animal-find-time');
  const moves = panelBody.querySelector('#animal-find-moves');
  const score = panelBody.querySelector('#animal-find-score');
  const combo = panelBody.querySelector('#animal-find-combo');
  const message = panelBody.querySelector('#animal-find-message');
  const elapsed = game.playStartedAt === null ? 0 : (ANIMAL_FIND.finishedAt || now) - game.playStartedAt;
  if (time) time.textContent = animalMemoryTime(elapsed);
  if (moves) moves.textContent = `${game.moves}`;
  if (score) score.textContent = `${game.score}`;
  if (combo) combo.textContent = game.combo >= 3 ? `${game.combo} COMBO!` : `${game.combo}`;
  if (message) message.textContent = game.status === 'PREVIEW' ? '카드 위치를 기억해보세요.' : game.combo >= 3 ? `${game.combo} COMBO!` : '같은 동물 카드 2장을 찾아보세요.';
  board.innerHTML = game.cards.map((card, index) => {
    const animal = engine.ANIMAL_MEMORY_TYPES.find((item) => item.id === card.animalId);
    const effect = ANIMAL_FIND.effect?.indices?.includes(index) ? ANIMAL_FIND.effect.kind : '';
    const visible = card.isFlipped || card.isMatched;
    return `<button type="button" class="animal-memory-card ${visible ? 'flipped' : ''} ${card.isMatched ? 'matched' : ''} ${effect}" data-animal-memory-index="${index}" aria-label="${visible ? animal.name : '뒤집힌 동물 카드'}" ${game.status !== 'PLAYING' ? 'disabled' : ''}>
      <span class="animal-memory-card-inner"><span class="animal-memory-card-face animal-memory-card-back">✦</span><span class="animal-memory-card-face animal-memory-card-front" style="background:${animal.color}">${animal.emoji}</span></span>
    </button>`;

    const target = choices[Math.floor(Math.random() * choices.length)];

    previousBlank = blank;

/* ==================================================================
   미니게임 4 — 거북이 미로 탈출

const TURTLE_MAZE = {
  active: false, timer: 30, timerId: null, grid: [], player: { r: 0, c: 0 },
  goal: { r: 9, c: 9 }, moves: 0, rewarded: false,
};
function mazePathExists(grid) {
  const queue = [{ r: 0, c: 0 }], seen = new Set(['0,0']);
  while (queue.length) {
    const current = queue.shift();
    if (current.r === 9 && current.c === 9) return true;
    [[-1,0],[1,0],[0,-1],[0,1]].forEach(([dr, dc]) => {
      const r = current.r + dr, c = current.c + dc, key = `${r},${c}`;
      if (r >= 0 && r < 10 && c >= 0 && c < 10 && grid[r][c] === 0 && !seen.has(key)) {

}

    candidates.push({ r, c });

  for (let i = candidates.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
  }
  let walls = 0;
  for (const cell of candidates) {
    if (walls >= 36) break;

}

/* ================== 지난 세션 요약 ==================

const SESS_LIST_MAX = 12;

    + '<i style="width:' + w(r.warnMs || 0) + ';background:var(--warn)"></i>'
    + '<i style="width:' + w(r.badMs || 0) + ';background:var(--bad)"></i>'

/* ==================================================================
   명예의 전당 — 서버 집계

   전에는 SEED_RANKING 이라는 예시 값 열 줄이 여기 있었습니다. 이제
   순위는 서버가 셉니다(supabase/migrations/20260819_world_school_ranking.sql).

   왜 클라이언트가 못 세는가: world_sessions 의 RLS 가 "본인 행만" 이라
   브라우저는 남의 세션을 한 줄도 못 읽습니다. 학교 합계는 원리상 여기서
   만들 수 없고, 만들 수 있게 하려면 남의 기록을 열어 줘야 합니다.

   이 파일이 하는 일은 **받아서 그리는 것**뿐입니다. 점수 공식도 참여자
   하한도 시즌 창도 서버 것입니다 — 두 벌로 두면 언젠가 화면과 서버가
   다른 순위를 말합니다.
   ================================================================== */
const HALL = {
  /* 'idle' 아직 안 물어봄 · 'loading' 물어보는 중 · 'ok' 받음
     못 받은 이유는 save.js 의 reason 을 그대로 씁니다:
     'unconfigured' 서버 없는 판본 · 'offline' 못 닿음 · 'unauth' 로그인 풀림
     · 'server' 그 밖 */
  state: 'idle', data: null, at: 0,
};
/* 창을 여닫을 때마다 물어보면 왕복이 낭비고, 한 번 받아 영영 두면 옆
   사람이 세션을 끝내도 안 바뀝니다. 1분이면 창을 닫았다 다시 여는 동안은
   그대로고, 잠깐 다른 일을 하고 오면 새로 받습니다.

   실패했을 때는 5초입니다. **성공과 같은 1분을 주면 안 됩니다** — 화면이
   "창을 다시 열면 한 번 더 물어봅니다" 라고 적어 놓고 1분 동안 안 물어보면
   그 줄이 거짓말이 됩니다. */
const HALL_TTL = 60000, HALL_RETRY = 5000;

/** 서버에서 순위를 받아 옵니다. 창이 열려 있으면 받은 뒤 다시 그립니다.
    답이 오면 다시 그리는데, 다시 그리는 길이 openPanel 이라 이 함수가 또
    불립니다. 그래서 **결과가 좋든 나쁘든** 방금 물어봤으면 물러납니다 —
    안 그러면 실패할 때마다 그리기와 요청이 서로를 부르며 끝없이 돕니다. */
function refreshHall(force) {
  if (!(window.WORLD_SAVE && WORLD_SAVE.schoolRanking)) { HALL.state = 'unconfigured'; return; }
  if (!WORLD_SAVE.configured) { HALL.state = 'unconfigured'; return; }
  if (HALL.state === 'loading') return;
  if (!force && HALL.at
      && Date.now() - HALL.at < (HALL.state === 'ok' ? HALL_TTL : HALL_RETRY)) return;
  HALL.state = 'loading';
  WORLD_SAVE.schoolRanking().then((r) => {
    HALL.state = r.ok ? 'ok' : (r.reason || 'server');
    HALL.data = r.ok ? r.data : null;
    HALL.at = Date.now();
    if (panelOpen && activePanelKey === 'hall') openPanel('hall');
  });
}

/* seasonInfo 는 아래 코인 장부 옆에 한 벌만 있습니다(seasonNow 와 붙어
   있는 것). 병합이 두 벌을 만들어 놨었습니다 — 몸은 같았지만, 같은
   이름이 두 번 선언되면 나중 것이 이기므로 위쪽을 고쳐도 아무 일이
   안 일어나는 상태가 됩니다. */

/** 'YYYY-MM-DD' → '7월 4일'. 서버는 날짜만 주고 말투는 화면이 정합니다. */
function hallDate(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ''));
  return m ? Number(m[2]) + '월 ' + Number(m[3]) + '일' : '';
}

/** 화면 위쪽 시즌 칸에 쓸 값. 서버 답이 있으면 서버 것, 없으면 이 기기 것. */
function hallSeason() {
  const s = HALL.state === 'ok' && HALL.data && HALL.data.season;
  if (!s) return seasonInfo();
  return {
    no: s.no, daysLeft: s.daysLeft, progress: s.progress,
    from: hallDate(s.from), to: hallDate(s.to),
  };
}

function swapAnimalMatch3(first, second) {
  const engine = animalMatch3Engine();
  if (!engine || ANIMAL_MATCH3.state !== 'PLAYING' || !animalMatch3Adjacent(first, second)) return false;
  ANIMAL_MATCH3.state = 'PROCESSING';
  const firstRow = Math.floor(first / ANIMAL_MATCH3_SIZE), firstCol = first % ANIMAL_MATCH3_SIZE;
  const secondRow = Math.floor(second / ANIMAL_MATCH3_SIZE), secondCol = second % ANIMAL_MATCH3_SIZE;
  const dx = `${(secondCol - firstCol) * 100}%`, dy = `${(secondRow - firstRow) * 100}%`;
  ANIMAL_MATCH3.swap = { indices: [first, second], x: { [first]: dx, [second]: `-${(secondCol - firstCol) * 100}%` }, y: { [first]: dy, [second]: `-${(secondRow - firstRow) * 100}%` } };
  renderAnimalMatch3();
  setTimeout(() => {
    ANIMAL_MATCH3.swap = null;
    const result = engine.swapIfMatches(ANIMAL_MATCH3.grid, first, second, Math.random, ANIMAL_MATCH3.specials);
    if (!result.valid) {
      ANIMAL_MATCH3.state = 'PLAYING';
      ANIMAL_MATCH3.lastResult = '매치가 되지 않아 원래 자리로 돌아왔어요.';
      renderAnimalMatch3();
      return;

    ANIMAL_MATCH3.moves -= 1;
    ANIMAL_MATCH3.combo = result.chains;
    ANIMAL_MATCH3.score += result.score;
    ANIMAL_MATCH3.effect = { indices: result.matches.flatMap((size) => Array.from({ length: Math.min(size, 5) }, (_, i) => (first + i) % ANIMAL_MATCH3.grid.length)), size: result.specialCreated?.kind === 'rainbow' ? 5 : result.specialCreated?.kind === 'line' ? 4 : 3 };
    ANIMAL_MATCH3.lastResult = result.specialActivated === 'rainbow' ? '무지개 블록 발동!'

      : result.specialCreated?.kind === 'rainbow' ? '5개 매치! 무지개 블록이 생겼어요.'
      : result.specialCreated?.kind === 'line' ? '4개 매치! 라인 블록이 생겼어요.'
      : result.chains > 1 ? `${result.chains}연쇄! +${result.score}점` : `+${result.score}점`;

    setTimeout(() => { ANIMAL_MATCH3.effect = null; renderAnimalMatch3(); }, 360);
    if (ANIMAL_MATCH3.moves <= 0) finishAnimalMatch3(false);
  }, 240);
  return true;
}
