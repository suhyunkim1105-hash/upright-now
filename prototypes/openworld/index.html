/* ---- 미니룸 소품 ----
   싸이월드 미니룸은 물건이 **빽빽해서** 방처럼 보입니다. 넓게 두면
   가구 카탈로그가 되고, 붙여 놓으면 사는 곳이 됩니다.
   여기 있는 것들은 전부 장식입니다 — 기능은 마이페이지 한 곳에 모았고,
   물건마다 창을 달면 사용자가 어디를 눌러야 할지 모릅니다. */

/* 옷장 2×2 — 기숙사 기능 줄의 '방 꾸미기'.
   문 한 짝을 열어 둡니다. 닫힌 장은 그냥 가구지만, 열려서 안이 보이면
   "여기서 꺼내 놓는다" 가 그림만으로 읽힙니다. 안에는 옷걸이에 걸린 옷
   셋과 상자 하나 — 산 것이 옷과 가구 둘이라 둘 다 보여야 합니다. */
{
  const c = canvasOf(2, 2), g = c.getContext('2d');
  shadow(g, 16, 30, 14, 2);
  px(g, 1, 2, 30, 29, '#6B4A2E');
  px(g, 2, 3, 28, 27, '#9A6C42');
  px(g, 2, 3, 28, 3, '#B98756');
  /* 왼쪽 — 열린 칸. 안쪽은 늘 그늘입니다 */
  px(g, 4, 6, 12, 22, '#4A3323');
  px(g, 4, 6, 12, 1, '#3A2718');
  px(g, 5, 9, 10, 1, '#C9B48E');                     // 옷걸이 봉
  [['#2DD4BF', '#8AE5D9'], ['#D8442C', '#F0836E'], ['#E8C34A', '#F6DE92']]
    .forEach(([col, lit], i) => {
      const x = 5 + i * 3;
      px(g, x, 10, 3, 8, col);
      px(g, x, 10, 3, 1, lit);
      px(g, x + 1, 8, 1, 2, '#C9B48E');               // 고리
    });
  px(g, 5, 21, 9, 6, '#B8834A');                     // 상자 — 사 둔 가구
  px(g, 5, 21, 9, 1, '#D6A165');
  px(g, 5, 23, 9, 1, '#8A6039');
  /* 열린 문짝 — 바깥으로 젖혀져 옆에 섭니다 */
  px(g, 1, 5, 3, 24, '#8A5F3A');
  px(g, 1, 5, 1, 24, '#A97A4C');
  /* 오른쪽 — 닫힌 문 */
  px(g, 17, 5, 12, 23, '#8A5F3A');
  px(g, 17, 5, 12, 2, '#A97A4C');
  px(g, 18, 15, 2, 4, '#E2C88A');
  px(g, 2, 29, 28, 2, '#5A3C24');
  PAINTED.wardrobe = c;
}

/* ---- 기숙사 기능 줄에 새로 서는 것 셋 ----
   방 안 물건이 곧 메뉴라는 규칙은 그대로입니다. 다만 흩어져 있던 것을
   윗벽 한 줄로 모으면서, 무엇을 하는 자리인지 그림만으로 갈리게
   다시 그렸습니다 — 다섯이 나란히 서면 생김새가 곧 이름표입니다. */

/* 노트북 1×1 — 화면에 달력. 책상 위 노트북이 시간표를 여는 자리인데
   화면이 파란 판이면 무엇을 여는 자리인지 알 수 없습니다. */
{
  const c = canvasOf(1, 1), g = c.getContext('2d');

  px(g, 4, 2, 8, 5, '#F4F7FA');

  g.fillStyle = '#9AA7B4';
  for (let r = 0; r < 2; r++) for (let k = 0; k < 3; k++) g.fillRect(5 + k * 3, 4 + r * 2, 2, 1);
  px(g, 8, 4, 2, 1, '#D8442C');                      // 오늘
  px(g, 2, 8, 12, 3, '#6B747E');

/* ---- 방을 넓히면서 더한 것들 ----
   8×8 에서는 걸을 자리가 세 줄뿐이라 큰 가구를 더 넣을 수 없었습니다.
   14×11 이 되면서 벽을 따라 붙일 자리가 생겼고, **벽에 붙는 것부터**
   채웁니다 - 방 한가운데에 물건을 두면 방이 아니라 창고가 됩니다.

   고른 다섯은 전부 "여기 사람이 산다" 를 말하는 것들입니다. 장식용
   오브제가 아니라 기숙사 방에 실제로 있는 물건이라야 방으로 읽힙니다. */

/* 미니 냉장고 1×2 — 기숙사 방의 상징입니다 */
{
  const c = canvasOf(1, 2), g = c.getContext('2d');
  shadow(g, 8, 30, 7, 2);
  px(g, 2, 3, 12, 28, '#8A9099');                    // 옆면·뒷그늘
  px(g, 3, 4, 10, 26, '#D8DCE2');                    // 앞면
  px(g, 3, 4, 10, 2, '#EFF2F6');                     // 윗면 빛
  px(g, 3, 12, 10, 1, '#9AA0A8');                    // 냉동칸 경계
  px(g, 11, 7, 1, 4, '#6E757F');                     // 손잡이 둘
  px(g, 11, 15, 1, 8, '#6E757F');
  px(g, 3, 29, 10, 2, '#7C818A');                    // 굽
  /* 문에 붙인 자석과 쪽지. 문이 매끈하면 전시장 물건이 됩니다 - 냉장고는
     원래 무언가 붙어 있는 면입니다. */
  px(g, 4, 16, 4, 5, '#F2EAD8');
  px(g, 4, 16, 4, 1, '#FFFFFF');
  px(g, 5, 18, 2, 1, '#8A8078');
  px(g, 9, 17, 2, 2, '#FF6B52');
  px(g, 9, 21, 2, 2, '#2DD4BF');
  PAINTED.fridge = c;
}

/* 책장 1×2 — 세 단. 책등 폭과 높이를 흩어야 책으로 읽힙니다 */
{
  const c = canvasOf(1, 2), g = c.getContext('2d');
  shadow(g, 8, 30, 7, 2);
  px(g, 1, 2, 14, 29, '#6B4A2E');                    // 통
  px(g, 2, 3, 12, 27, '#3A2718');                    // 안쪽 그늘
  px(g, 2, 3, 12, 1, '#8A5F3A');
  px(g, 2, 3, 1, 27, '#5C4029');
  const spine = ['#B75B4C', '#52739F', '#8B9C48', '#CDC2B1', '#9C6BA0', '#C08A3E'];
  for (let r = 0; r < 3; r++) {
    const ry = 4 + r * 9;
    let bx = 3, k = r * 37 + 11;
    while (bx < 13) {
      k = (k * 1103515245 + 12345) & 0x7fffffff;
      const w = 2 + (k >> 8) % 2;
      if (bx + w > 13) break;
      const h = 5 + ((k >> 16) % 3);
      px(g, bx, ry + (8 - h), w, h, spine[(k >> 20) % 6]);
      px(g, bx, ry + (8 - h), w, 1, 'rgba(255,255,255,.28)');
      px(g, bx + w, ry + (8 - h), 1, h, 'rgba(0,0,0,.30)');   // 책 사이 그늘
      bx += w + 1;
    }
    px(g, 2, ry + 8, 12, 2, '#6B4A2E');              // 선반. 앞코가 있어야 판이 됩니다
    px(g, 2, ry + 8, 12, 1, '#96693F');
  }
  PAINTED.bookshelf = c;
}

/* 2인 소파 2×1 — 친구가 왔을 때 앉는 자리.
   위에서 내려다보면 소파는 넓고 얕습니다. 두 칸 높이로 그리면 침대가 됩니다. */
{
  const c = canvasOf(2, 1), g = c.getContext('2d');
  shadow(g, 16, 15, 14, 2);
  px(g, 2, 1, 28, 6, '#415D72');                     // 등받이
  px(g, 3, 2, 26, 4, '#4E6E86');
  px(g, 3, 2, 26, 1, '#6789A2');
  px(g, 1, 4, 4, 9, '#415D72');                      // 팔걸이 둘
  px(g, 27, 4, 4, 9, '#415D72');
  px(g, 1, 4, 4, 1, '#6789A2');
  px(g, 27, 4, 4, 1, '#6789A2');
  px(g, 5, 6, 22, 7, '#5B7E97');                     // 앉는 자리
  px(g, 5, 6, 22, 1, '#7FA2BC');
  px(g, 15, 6, 2, 7, '#415D72');                     // 방석 둘로 가르는 골
  px(g, 5, 12, 22, 1, '#375063');
  px(g, 4, 13, 3, 2, '#3A2718');                     // 다리
  px(g, 25, 13, 3, 2, '#3A2718');
  PAINTED.sofa = c;
}

/* 키 큰 화분 1×2 */
{
  const c = canvasOf(1, 2), g = c.getContext('2d');
  shadow(g, 8, 30, 6, 2);
  px(g, 4, 22, 8, 9, '#A8654A');                     // 화분
  px(g, 4, 22, 8, 2, '#C4805E');
  px(g, 3, 21, 10, 2, '#8E5238');                    // 테두리
  px(g, 4, 29, 8, 2, '#7A4632');
  px(g, 5, 20, 6, 2, FURN.soil);
  px(g, 7, 8, 2, 13, '#4E7A3E');                     // 줄기
  px(g, 7, 8, 1, 13, '#639650');                     // 줄기 왼쪽 빛
  /* 잎 여섯. 좌우 길이를 달리해야 화초가 됩니다 - 대칭이면 조화입니다. */
  const leaf = [[-6, 10, 6, '#3E7A3D'], [5, 12, 5, '#5FA855'], [-5, 14, 5, '#4C8C46'],
                [4, 16, 6, '#3E7A3D'], [-4, 18, 4, '#5FA855'], [3, 7, 4, '#6FBA60']];
  for (const [dx, y, len, col] of leaf) {
    const dir = dx < 0 ? -1 : 1;
    for (let i = 0; i < len; i++) {
      const h = Math.max(1, 3 - ((i / 2) | 0));
      px(g, 8 + dir * (i + 1) - (dir < 0 ? 1 : 0), y - ((i * 3) / len | 0), 1, h, col);
    }
  }
  disc(g, 8, 7, 2, '#6FBA60');
  PAINTED.plantTall = c;
}

/* 빨래 바구니 1×1 — 옷이 삐져나와야 쓰는 물건으로 보입니다 */
{
  const c = canvasOf(1, 1), g = c.getContext('2d');
  shadow(g, 8, 15, 6, 2);
  px(g, 3, 4, 10, 11, '#B8A47E');                    // 바구니
  px(g, 4, 5, 8, 9, '#D2BE94');
  g.fillStyle = 'rgba(120,104,72,.45)';              // 엮은 결
  for (let y = 6; y < 14; y += 3) g.fillRect(4, y, 8, 1);
  for (let x = 6; x < 12; x += 3) g.fillRect(x, 5, 1, 9);
  px(g, 3, 4, 10, 2, '#E0CFA8');                     // 테두리
  px(g, 5, 2, 5, 3, '#E8EDF2');                      // 삐져나온 옷
  px(g, 6, 1, 3, 2, '#C4D2E0');
  px(g, 9, 3, 3, 2, '#F0B8B0');
  PAINTED.laundry = c;
}

/* ==================================================================
   사서 놓는 가구

   위의 것들은 방을 지을 때 코드가 박아 둔 것이고, 여기부터는 상점에서
   사서 내가 놓는 것입니다. 그림 방식은 같습니다 — 16px 눈금, 빛은 왼쪽
   위, 바닥에 닿는 자리에 그림자.

   가구는 둘로 갈립니다.
     · 밟고 지나가는 것 (러그·방석) — anchor 0, 막는 줄 없음.
       못 지나가면 좁은 방에 구멍이 뚫립니다.
     · 걸어서 돌아가는 것 (책장·TV·빈백) — 밑동 줄만 막습니다.

   벽에 거는 것은 없습니다. 이 방 윗벽은 방을 지을 때 dressRoom 이 이미
   다 채웠습니다 — 책장 x1-2, 안내 x4-6, 벽시계 x7-8, 창 x9-10, 응원기
   x12. 남는 칸이 x3 과 x11 둘뿐이라 두 칸짜리 액자도 안 들어갑니다.
   ================================================================== */

/* 러그 3×2 — 밟고 다닙니다. 무늬가 없으면 그냥 색칠한 바닥입니다 */
{
  const c = canvasOf(3, 2), g = c.getContext('2d');
  px(g, 1, 3, 46, 26, '#8A5B4A');                    // 두른 천
  px(g, 2, 4, 44, 24, '#C08466');
  px(g, 4, 6, 40, 20, '#DFA982');                    // 안쪽 면
  px(g, 4, 6, 40, 1, '#EFC5A2');                     // 윗면 빛
  /* 마름모 셋. 짝수로 놓으면 가운데가 비어 러그가 두 장으로 보입니다 */
  for (const cx of [12, 24, 36]) {
    for (let i = 0; i < 5; i++) {
      px(g, cx - i, 16 - i, i * 2 + 1, 1, '#A8624A');
      px(g, cx - i, 16 + i, i * 2 + 1, 1, '#A8624A');
    }
    px(g, cx - 1, 15, 3, 3, '#EFC5A2');
  }
  /* 술 — 좌우 끝. 러그는 끝이 풀려 있어야 천으로 읽힙니다 */
  for (let y = 6; y < 26; y += 3) { px(g, 0, y, 2, 2, '#E2D2BE'); px(g, 46, y, 2, 2, '#E2D2BE'); }
  PAINTED.furRug = c;
}

/* 방석 1×1 — 밟고 다닙니다. 방에 원래 있는 분홍 방석과 색으로 갈랐습니다 */
{
  const c = canvasOf(1, 1), g = c.getContext('2d');

  px(g, 3, 6, 10, 6, '#47948C');
  px(g, 3, 6, 10, 2, '#6FBCB2');
  px(g, 3, 12, 10, 1, '#255952');
  px(g, 7, 8, 2, 2, '#255952');                      // 가운데 단추
  px(g, 4, 7, 1, 1, 'rgba(255,255,255,.5)');

}

/* 작은 화분 1×1 */
{

/* 선풍기 1×2 — 기둥만 막습니다 */
{

  /* 날개 셋 — 원 안에서 갈라지는 선이면 회전으로 읽힙니다 */
  for (const [dx, dy] of [[0, -4], [4, 2], [-4, 2]]) px(g, 8 + dx / 2 - 1, 10 + dy / 2 - 1, 3, 3, '#A8B2BC');
  disc(g, 8, 10, 1, '#6E7682');

/* 낮은 책장 2×1 — 두 단. 책등 폭을 흩어야 책으로 읽힙니다 */
{

  px(g, 2, 3, 28, 11, '#3A2718');
  px(g, 2, 3, 28, 1, '#8A5F3A');
  const spine = ['#B75B4C', '#52739F', '#8B9C48', '#CDC2B1', '#9C6BA0', '#C08A3E'];
  for (let r = 0; r < 2; r++) {
    const ry = 4 + r * 5;
    let bx = 3, k = r * 53 + 7;
    while (bx < 29) {
      k = (k * 1103515245 + 12345) & 0x7fffffff;
      const w = 2 + (k >> 8) % 2;
      if (bx + w > 29) break;
      px(g, bx, ry, w, 4, spine[(k >> 20) % 6]);
      px(g, bx, ry, w, 1, 'rgba(255,255,255,.26)');
      bx += w + 1;
    }
    px(g, 2, ry + 4, 28, 1, '#6B4A2E');              // 선반 앞코
  }
  PAINTED.furShelf = c;
}

/* ==================================================================
   앉는 자리와 문 — 직접 그립니다

   Cool School 의자는 48px 원본을 3으로 나눈 것이라 등받이 살이 뭉개져
   "잘린 상자" 로 보였습니다. 16px 에서 의자로 읽히려면 **등받이 · 앉는
   면 · 다리** 세 덩이가 각각 최소 4px 은 되어야 하는데, 축소로는 그
   경계가 남지 않습니다. 그래서 16px 격자에 맞춰 처음부터 그립니다.

   빛은 언제나 왼쪽 위. 바닥에 닿는 자리에는 그림자를 깔아야 물건이
   떠 있지 않습니다.
   ================================================================== */

/* 앉는 면 넉 장이 전부 밝기 39~43% 였습니다 — 밝아진 바닥(65%) 위에서
   네 색이 다 같은 어두운 덩이로 뭉쳐 보였습니다. 색상은 그대로 두고
   밝기만 39~43% → 57~60% 로 올립니다. 나무 틀(woodDark)은 그대로라
   등받이·다리와 앉는 면의 경계는 오히려 또렷해집니다. */
const DESKPAL = {
  wood:    '#BE8A4C', woodLit: '#DCA96E', woodDark: '#8E6330', woodDeep: '#6E4A22',
  seat:    '#6E92B6', seatLit: '#93B2D0', seatDark: '#4E7095',
  metal:   '#9AA3AD', metalLit: '#C4CBD2', metalDark: '#616974',
  glass:   '#BFD9E4', glassLit: '#E2F0F5', glassDark: '#6E93A4',
  mat:     '#C2412C', matLit: '#E0604A',
  /* 천과 펠트를 새로 답니다. 나무·금속·유리만으로는 안락의자와 긴
     열람대가 안 그려집니다 — 안락의자를 나무로 칠하면 나무 상자가 되고,
     열람대 상판은 나무 위에 나무라 상판과 틀이 안 갈립니다.
     색은 이미 방에 있는 것에서 골랐습니다: 천은 창유리(glass)와 같은
     청록 계열이고, 펠트는 도서관 벽 책장의 초록입니다. 새 색상환을
     들이면 가구만 다른 게임에서 온 것으로 보입니다. */
  fab:     '#4E8290', fabLit: '#79ADB9', fabDark: '#33606F',
  felt:    '#3E6B4C', feltLit: '#5F9270', feltDark: '#2A4B37',
};

/* ---- 의자 1×1 — 등받이 · 앉는 면 · 다리 ---- */
function chairCanvas(seatCol, seatLit, seatDark) {
  const c = canvasOf(1, 1), g = c.getContext('2d');
  const P = DESKPAL;
  shadow(g, 8, 15, 6, 2);
  /* 등받이 — 위쪽. 살 두 개가 있어야 의자로 읽힙니다. */
  px(g, 3, 0, 10, 6, P.woodDark);
  px(g, 4, 1, 8, 4, P.wood);
  px(g, 4, 1, 8, 1, P.woodLit);
  px(g, 6, 2, 1, 3, P.woodDark);
  px(g, 9, 2, 1, 3, P.woodDark);
  /* 앉는 면 — 좌우로 조금 넓어야 등받이와 구분됩니다. */
  px(g, 2, 6, 12, 6, P.woodDeep);
  px(g, 2, 6, 12, 5, seatCol);
  px(g, 2, 6, 12, 2, seatLit);
  px(g, 3, 10, 10, 1, seatDark);
  /* 다리 넷 — 앞 둘만 보이고 뒤 둘은 그림자로 */
  px(g, 3, 12, 2, 4, P.woodDark);
  px(g, 3, 12, 1, 4, P.wood);
  px(g, 11, 12, 2, 4, P.woodDark);
  px(g, 11, 12, 1, 4, P.wood);
  px(g, 5, 12, 6, 1, 'rgba(0,0,0,.18)');
  return c;
}
PAINTED.chair  = chairCanvas(DESKPAL.seat, DESKPAL.seatLit, DESKPAL.seatDark);
PAINTED.chairB = chairCanvas('#BE8676', '#D6A695', '#95604F');
PAINTED.chairC = chairCanvas('#79AC8B', '#9BC7AA', '#568A67');
PAINTED.chairD = chairCanvas('#AF9C76', '#C9B896', '#87764F');

/* ---- 책상 ----
   상판 · 앞면 · 다리 세 켜. 상판만 그리면 판때기로 보입니다. */
function deskCanvas(wTiles, topCol, topLit) {
  const c = canvasOf(wTiles, 1), g = c.getContext('2d');
  const P = DESKPAL, W = wTiles * TS;
  shadow(g, W / 2, 15, W / 2 - 2, 2);
  /* 상판 */
  px(g, 0, 1, W, 10, P.woodDeep);
  px(g, 1, 2, W - 2, 8, topCol);
  px(g, 1, 2, W - 2, 2, topLit);
  /* 나뭇결 */
  g.fillStyle = 'rgba(94,61,25,.20)';
  for (let x = 3; x < W - 3; x += 7) g.fillRect(x, 5, 5, 1);
  /* 앞면 — 상판보다 어두워야 두께가 보입니다 */
  px(g, 1, 10, W - 2, 3, P.woodDark);
  px(g, 1, 10, W - 2, 1, P.wood);
  /* 다리 */
  px(g, 2, 13, 2, 3, P.woodDeep);
  px(g, W - 4, 13, 2, 3, P.woodDeep);
  return c;
}
PAINTED.desk1 = deskCanvas(1, DESKPAL.wood, DESKPAL.woodLit);
PAINTED.desk2 = deskCanvas(2, DESKPAL.wood, DESKPAL.woodLit);
PAINTED.desk3 = deskCanvas(3, '#B8834A', '#D6A165');

/* ==================================================================
   모양이 다른 앉는 자리 넷

   위의 의자 넉 장은 **같은 그림에 색만 넷**입니다. 도서관과 본관은
   의자가 방마다 마흔 개씩 서는 방이라, 색만 다른 것을 마흔 번 찍으면
   방이 아니라 도장 자국으로 보입니다. 색을 더 늘려도 같습니다 —
   16px 에서 먼저 읽히는 것은 색이 아니라 **윤곽**입니다.

   그래서 여기부터는 실루엣을 바꿉니다. 넷을 고른 기준은 "16px 격자
   에서 서로 헷갈리지 않는가" 하나입니다.
     안락의자    팔걸이가 좌우로 튀어나오고 등받이가 낮습니다
     스툴        등받이가 아예 없고 앉는 면이 원입니다
     열람 의자   등받이가 타일 꼭대기까지 올라가고 좁습니다
     바퀴 의자   다리 넷 대신 다섯 갈래 별 받침이 깔립니다
   빛은 여전히 왼쪽 위이고, 바닥에 닿는 것에는 전부 그림자를 깝니다.
   ================================================================== */

/* ---- 안락의자 1×1 ---- */
{
  const c = canvasOf(1, 1), g = c.getContext('2d');
  const P = DESKPAL;
  shadow(g, 8, 15, 7, 2);
  /* 등받이 — 낮고 둥급니다. 윗줄을 한 칸 좁혀 모서리를 깎습니다 */
  px(g, 3, 0, 10, 1, P.fabDark);
  px(g, 2, 1, 12, 5, P.fabDark);
  px(g, 3, 1, 10, 4, P.fab);
  px(g, 3, 1, 10, 2, P.fabLit);
  /* 팔걸이 둘 — 앉는 면보다 높고 좌우로 더 나옵니다. 이 두 덩이가
     안락의자 실루엣의 전부입니다.
     타일 가장자리(x0 · x15)는 한 줄 비웁니다. 처음엔 끝까지 채웠는데,
     본관 뒤 원탁처럼 둘을 나란히 놓으면 팔걸이가 맞닿아 **2인 소파
     한 장**으로 보였습니다. 한 줄만 비워도 둘로 갈립니다. */
  px(g, 1, 5, 3, 7, P.fabDark);
  px(g, 1, 5, 3, 2, P.fabLit);
  px(g, 12, 5, 3, 7, P.fabDark);
  px(g, 12, 5, 3, 2, P.fab);
  /* 앉는 면 — 방석 한 장 */
  px(g, 3, 6, 10, 6, P.fab);
  px(g, 3, 6, 10, 2, P.fabLit);
  px(g, 3, 11, 10, 1, P.fabDark);
  /* 치마단과 발 — 다리가 안 보이는 의자라 밑동이 통으로 내려옵니다 */
  px(g, 2, 12, 12, 2, P.woodDeep);
  px(g, 2, 12, 12, 1, P.woodDark);
  px(g, 3, 14, 2, 2, P.woodDeep);
  px(g, 11, 14, 2, 2, P.woodDeep);
  PAINTED.armchair = c;
}

/* ---- 등받이 없는 둥근 스툴 1×1 ---- */
{
  const c = canvasOf(1, 1), g = c.getContext('2d');
  const P = DESKPAL;
  shadow(g, 8, 15, 6, 2);
  /* 다리 셋 — 앉는 면보다 먼저 깔아야 뒤로 넘어갑니다. 벌어져 있어야
     스툴이고, 곧게 내리면 낮은 상자입니다 */
  px(g, 2, 9, 2, 7, P.woodDeep);
  px(g, 2, 9, 1, 7, P.woodDark);
  px(g, 12, 9, 2, 7, P.woodDeep);
  px(g, 7, 10, 2, 6, P.woodDark);
  px(g, 4, 12, 8, 1, P.woodDeep);                    // 가로대 — 다리 셋을 묶습니다
  /* 앉는 면 — 위에서 본 원입니다. 등받이가 없으니 이 원이 곧 윤곽이고,
     위 한 줄을 비워 두어야 옆의 의자보다 낮다는 것이 보입니다 */
  px(g, 4, 1, 8, 1, P.fabDark);
  px(g, 2, 2, 12, 1, P.fabDark);
  px(g, 1, 3, 14, 5, P.fabDark);
  px(g, 2, 8, 12, 1, P.fabDark);
  px(g, 4, 9, 8, 1, P.fabDark);
  px(g, 4, 2, 8, 1, P.fab);
  px(g, 2, 3, 12, 4, P.fab);
  px(g, 4, 7, 8, 1, P.fab);
  px(g, 4, 2, 7, 1, P.fabLit);
  px(g, 3, 3, 8, 2, P.fabLit);
  PAINTED.stool = c;
}

/* ---- 등받이 높은 열람 의자 1×1 ---- */
{
  const c = canvasOf(1, 1), g = c.getContext('2d');
  const P = DESKPAL;
  shadow(g, 8, 15, 6, 2);
  /* 등받이 — 타일 꼭대기까지 올리고 폭은 좁힙니다. 같은 줄에 다른
     의자와 섰을 때 **키가 달라 보이는 것**이 이 의자의 전부입니다 */
  px(g, 3, 0, 10, 2, P.woodDark);
  px(g, 4, 0, 8, 1, P.wood);
  px(g, 4, 2, 8, 7, P.woodDeep);
  px(g, 5, 2, 2, 7, P.wood);
  px(g, 5, 2, 1, 7, P.woodLit);
  px(g, 9, 2, 2, 7, P.wood);
  px(g, 9, 2, 1, 7, P.woodLit);
  /* 앉는 면 — 초록 펠트. 등받이보다 좌우로 넓어야 둘이 갈립니다 */
  px(g, 2, 9, 12, 4, P.woodDeep);
  px(g, 3, 9, 10, 3, P.felt);
  px(g, 3, 9, 10, 1, P.feltLit);
  px(g, 3, 12, 10, 1, P.feltDark);
  /* 다리 — 앞 둘만 보이고 뒤 둘은 그늘로 */
  px(g, 3, 13, 2, 3, P.woodDark);
  px(g, 3, 13, 1, 3, P.wood);
  px(g, 11, 13, 2, 3, P.woodDark);
  px(g, 11, 13, 1, 3, P.wood);
  px(g, 5, 13, 6, 1, 'rgba(0,0,0,.18)');
  PAINTED.readChair = c;
}

/* ---- 바퀴 의자 1×1 ---- */
{
  const c = canvasOf(1, 1), g = c.getContext('2d');
  const P = DESKPAL;
  shadow(g, 8, 15, 7, 2);
  /* 등받이 — 메시. 윗줄을 좁혀 모서리를 깎습니다 */
  px(g, 4, 0, 8, 1, '#39454F');
  px(g, 3, 1, 10, 5, '#39454F');
  px(g, 4, 1, 8, 4, '#5B6E80');
  px(g, 4, 1, 8, 1, '#8398AB');
  px(g, 6, 2, 1, 3, '#39454F');
  px(g, 9, 2, 1, 3, '#39454F');
  /* 앉는 면 */
  px(g, 2, 6, 12, 5, '#36434F');
  px(g, 2, 6, 12, 4, '#4E5F70');
  px(g, 2, 6, 12, 2, '#72859A');
  /* 기둥과 다섯 갈래 받침. 16px 에서 이 의자를 알아보는 단서는 별 모양
     받침 하나뿐이라, 갈래 끝의 바퀴를 어둡게 찍어 셀 수 있게 합니다.
     다섯째 갈래는 뒤로 뻗어 앉는 면에 가립니다 — 위에서 보면 그렇습니다. */
  px(g, 7, 11, 2, 2, P.metalDark);
  px(g, 6, 12, 4, 2, P.metal);
  px(g, 1, 13, 5, 1, P.metal);
  px(g, 10, 13, 5, 1, P.metal);
  px(g, 4, 14, 3, 1, P.metal);
  px(g, 9, 14, 3, 1, P.metal);
  px(g, 0, 13, 2, 2, P.metalDark);
  px(g, 14, 13, 2, 2, P.metalDark);
  px(g, 3, 15, 2, 1, P.metalDark);
  px(g, 11, 15, 2, 1, P.metalDark);
  PAINTED.officeChair = c;
}

/* ---- 긴 공용 열람대 ----
   3칸 책상과 폭만 다르면 긴 널판입니다. 갈리는 곳은 둘 — 마주 앉는
   자리를 가르는 **낮은 칸막이**가 상판 위로 3px 솟고, 상판에 초록
   펠트를 깝니다. 나무는 호두나무로 내려 3칸 책상(참나무)보다 어둡습니다. */
function studyTableCanvas(wTiles) {
  const c = canvasOf(wTiles, 1), g = c.getContext('2d');
  const P = DESKPAL, W = wTiles * TS;
  shadow(g, W / 2, 15, W / 2 - 2, 2);
  /* 칸막이 — 상판보다 먼저 깔아야 뒤로 넘어갑니다 */
  px(g, 2, 0, W - 4, 3, P.feltDark);
  px(g, 2, 0, W - 4, 1, P.felt);
  for (let x = 7; x < W - 7; x += 12) px(g, x, 0, 2, 3, '#1F3728');   // 칸막이 기둥
  /* 상판 */
  px(g, 0, 3, W, 9, '#5E4128');
  px(g, 1, 4, W - 2, 7, '#8A6038');
  px(g, 1, 4, W - 2, 2, '#A87C4C');
  /* 펠트 — 나무만 있으면 긴 책상이 아니라 긴 널판입니다 */
  px(g, 4, 6, W - 8, 4, P.felt);
  px(g, 4, 6, W - 8, 1, P.feltLit);
  px(g, 4, 9, W - 8, 1, P.feltDark);
  /* 앞면과 다리. 가운데 다리를 하나 더 세웁니다 — 여섯 칸짜리는 양
     끝만으로 받치면 가운데가 처져 보입니다 */
  px(g, 1, 11, W - 2, 3, '#6B4A2E');
  px(g, 1, 11, W - 2, 1, '#8A6038');
  px(g, 2, 14, 3, 2, '#4A3220');
  px(g, W - 5, 14, 3, 2, '#4A3220');
  if (wTiles >= 4) px(g, (W >> 1) - 1, 14, 3, 2, '#4A3220');
  return c;
}
PAINTED.tableStudy  = studyTableCanvas(6);
PAINTED.tableStudy3 = studyTableCanvas(3);

/* ---- 책 칸이 달린 강의실 책상 ----
   본관 책상 열여덟 개가 전부 같은 2칸 판이었습니다. 상판을 얇게 하고
   그 아래를 뚫어 책을 꽂으면, 옆에서 보이는 것이 판 하나가 아니라
   판 + 책등 줄이 됩니다 — 같은 폭에서 윤곽을 바꾸는 가장 싼 방법입니다. */
function deskShelfCanvas(wTiles) {
  const c = canvasOf(wTiles, 1), g = c.getContext('2d');
  const P = DESKPAL, W = wTiles * TS;
  shadow(g, W / 2, 15, W / 2 - 2, 2);
  /* 상판 — 아래에 책 칸을 두느라 얇습니다 */
  px(g, 0, 1, W, 6, P.woodDeep);
  px(g, 1, 2, W - 2, 4, P.wood);
  px(g, 1, 2, W - 2, 2, P.woodLit);
  /* 책 칸 — 안쪽은 늘 그늘입니다 */
  px(g, 1, 7, W - 2, 6, P.woodDeep);
  px(g, 2, 8, W - 4, 4, '#3A2718');
  const spine = ['#B75B4C', '#52739F', '#8B9C48', '#CDC2B1', '#9C6BA0', '#C08A3E'];
  let bx = 3, k = 17;
  while (bx < W - 4) {
    k = (k * 1103515245 + 12345) & 0x7fffffff;
    const bw = 2 + (k >> 8) % 2;
    if (bx + bw > W - 4) break;
    const bh = 3 + ((k >> 16) % 2);
    px(g, bx, 12 - bh, bw, bh, spine[(k >> 20) % 6]);
    px(g, bx, 12 - bh, bw, 1, 'rgba(255,255,255,.26)');
    bx += bw + 1;
  }
  px(g, 1, 12, W - 2, 1, P.woodDark);
  px(g, 1, 13, 3, 3, P.woodDeep);
  px(g, W - 4, 13, 3, 3, P.woodDeep);
  return c;
}
PAINTED.deskShelf = deskShelfCanvas(2);

/* ---- 원탁 2×2 ----
   네모 책상 옆에 놓으면 모양 하나로 "여기는 공부하는 자리가 아니다"
   가 됩니다. 기둥 하나로 서서 다리가 넷 안 보이는 것이 두 번째 단서입니다.

   상판은 정원이 아니라 **세로가 눌린 타원**입니다. 이 게임은 비스듬히
   내려다보는 시점이라 정원으로 그리면 접시가 위로 선 것처럼 보입니다.
   disc 는 정원만 그리므로 여기서만 줄 단위로 폅니다. */
{
  const c = canvasOf(2, 2), g = c.getContext('2d');
  const P = DESKPAL;
  shadow(g, 16, 30, 13, 3);
  /* 기둥과 발 — 상판보다 먼저 깔아야 뒤로 넘어갑니다 */
  px(g, 12, 18, 8, 10, P.woodDeep);
  px(g, 12, 18, 2, 10, P.woodDark);
  px(g, 8, 26, 16, 3, P.woodDeep);
  px(g, 8, 26, 16, 1, P.woodDark);
  px(g, 10, 29, 12, 1, '#3E2A18');
  const top = (cx, cy, rx, ry, col) => {
    g.fillStyle = col;
    for (let dy = -ry; dy <= ry; dy++) {
      const hw = Math.floor(rx * Math.sqrt(1 - (dy * dy) / (ry * ry)));
      if (hw > 0) g.fillRect(cx - hw, cy + dy, hw * 2, 1);
    }
  };
  /* 테두리를 **한 바퀴 통째로** 두릅니다. 아래쪽에만 어두운 줄을
     남겼더니 위·좌우가 바닥으로 번져서, 상판이 나무 판이 아니라 바닥에
     번진 얼룩으로 보였습니다. 안쪽에 띠를 한 겹 더 넣어 두께를 만듭니다. */
  top(16, 13, 14, 9, '#4A3220');                     // 상판 두께 — 아래로 한 줄 어긋납니다
  top(16, 12, 14, 9, P.woodDeep);
  top(16, 12, 13, 8, '#9A6B34');
  top(16, 12, 12, 7, P.wood);
  top(15, 11, 9, 5, P.woodLit);
  top(13, 10, 5, 3, '#E8BE86');
  /* 나뭇결 — 없으면 나무 상판이 아니라 접시입니다 */
  g.fillStyle = 'rgba(74,50,32,.24)';
  g.fillRect(8, 8, 11, 1); g.fillRect(12, 13, 12, 1); g.fillRect(10, 16, 9, 1);
  PAINTED.tableRound = c;
}

/* ---- 책상 위 물건 — 노트북·책·스탠드 ---- */
{
  const c = canvasOf(1, 1), g = c.getContext('2d');
  /* 노트북 — 열린 화면이 뒤로 서 있습니다 */
  px(g, 3, 1, 10, 7, '#4A525C');
  px(g, 4, 2, 8, 5, '#8FB4C6');
  px(g, 4, 2, 8, 2, '#C4DDE8');
  px(g, 2, 8, 12, 3, '#6B747E');
  px(g, 2, 8, 12, 1, '#98A2AC');
  px(g, 4, 9, 8, 1, '#4A525C');
  PAINTED.laptopN = c;
}
{
  const c = canvasOf(1, 1), g = c.getContext('2d');

/* ---- 큰 출입문 3×2 ----
   건물마다 문이 다르면 "여기가 나가는 곳" 을 매번 새로 배워야 합니다.
   전부 같은 문을 씁니다 — 윗창 · 유리 두 짝 · 손잡이 · 발판. */
{
  const c = canvasOf(3, 2), g = c.getContext('2d');
  const P = DESKPAL;
  const W = 48;
  /* 문틀 */
  px(g, 0, 0, W, 32, P.metalDark);
  px(g, 1, 1, W - 2, 30, P.metal);
  px(g, 1, 1, W - 2, 2, P.metalLit);
  /* 윗창 */
  px(g, 4, 3, W - 8, 6, P.glassDark);
  px(g, 5, 4, W - 10, 4, P.glass);
  px(g, 5, 4, W - 10, 2, P.glassLit);
  /* 유리 두 짝 */
  [5, 25].forEach((x) => {
    px(g, x, 11, 18, 19, P.metalDark);
    px(g, x + 1, 12, 16, 17, P.glass);
    px(g, x + 1, 12, 16, 5, P.glassLit);
    /* 비스듬한 반사 — 한 줄이면 유리가 됩니다 */
    g.fillStyle = 'rgba(255,255,255,.42)';
    for (let i = 0; i < 12; i++) g.fillRect(x + 3 + i, 26 - i, 2, 1);
    px(g, x + 1, 27, 16, 2, P.glassDark);
  });
  /* 가운데 기둥과 손잡이 */
  px(g, 22, 11, 4, 19, P.metalDark);
  px(g, 22, 11, 1, 19, P.metal);
  px(g, 19, 19, 3, 5, P.metalLit);
  px(g, 26, 19, 3, 5, P.metalLit);
  /* 발판 — 코랄. 나가는 곳이라는 표시입니다. */
  px(g, 6, 30, 36, 2, P.mat);
  px(g, 6, 30, 36, 1, P.matLit);
  PAINTED.exitDoor = c;
}

/* 문은 통과할 수 있어야 합니다 — 아랫줄만 뚫습니다 */

/* ==================================================================
   동아리 상점 진열품 — 옷 가게와 가구 가게

   알 가게 뒤에는 알 넷이 나란히 섭니다. 그래서 알 가게는 창구가 아니라
   **가게**로 보입니다. 옷 가게 뒤에는 옷장 하나와 거울 하나뿐이었고
   가구 가게 뒤에는 책장 하나와 화분 하나뿐이었습니다 — 둘 다 어느 방에
   놓아도 되는 물건이라, 뒤에 서 있어도 무엇을 파는지 말해 주지 않습니다.

   여기 그리는 것들은 전부 **그 가게에서만 나올 물건**입니다. 옷걸이는
   옷 가게 밖에서는 쓸 데가 없고, 포개 쌓은 의자는 가구 가게 밖에서는
   창고입니다. 진열은 물건 개수가 아니라 그 자리에만 있는 물건으로
   만들어집니다.
   ================================================================== */

/* 옷걸이 2×2 — 봉에 옷 다섯 벌 */
{
  const c = canvasOf(2, 2), g = c.getContext('2d');
  shadow(g, 16, 30, 13, 2);
  /* 기둥 둘과 봉. 봉이 가로로 길어야 옷걸이입니다 — 짧으면 우산꽂이입니다 */
  px(g, 2, 26, 6, 3, '#5F6874'); px(g, 24, 26, 6, 3, '#5F6874');
  px(g, 3, 5, 2, 22, '#8E9AA6'); px(g, 3, 5, 1, 22, '#BEC7D0');
  px(g, 27, 5, 2, 22, '#8E9AA6'); px(g, 27, 5, 1, 22, '#BEC7D0');
  px(g, 3, 4, 26, 2, '#8E9AA6');
  px(g, 3, 4, 26, 1, '#D2DAE2');
  /* 걸린 옷 다섯 — 어깨가 좁고 아래가 넓어야 옷입니다. 색 셋은 옷장
     (wardrobe) 안에 걸린 것과 같습니다: 같은 가게가 파는 같은 옷입니다 */
  [['#2DD4BF', '#8AE5D9'], ['#D8442C', '#F0836E'], ['#E8C34A', '#F6DE92'],
   ['#5C7FC4', '#93AEE0'], ['#C46FA8', '#E3A0CC']].forEach(([col, lit], i) => {
    const x = 4 + i * 5;
    px(g, x + 2, 2, 1, 3, '#C9B48E');                // 고리
    px(g, x + 1, 6, 3, 2, col);                      // 어깨
    px(g, x, 8, 5, 13, col);
    px(g, x, 8, 5, 2, lit);
    px(g, x, 20, 5, 1, 'rgba(0,0,0,.28)');
  });
  PAINTED.clothRack = c;
}

/* 마네킹 1×2 — 옷을 입혀 세웁니다 */
{
  const c = canvasOf(1, 2), g = c.getContext('2d');
  shadow(g, 8, 30, 5, 2);
  px(g, 3, 28, 10, 2, '#5F6874'); px(g, 3, 28, 10, 1, '#8E9AA6');
  px(g, 7, 20, 2, 8, '#8E9AA6'); px(g, 7, 20, 1, 8, '#BEC7D0');
  /* 몸통 — 목이 가늘고 어깨가 넓고 허리가 좁습니다. 이 모래시계 윤곽이
     마네킹의 전부입니다. 머리는 안 답니다: 16px 폭에서 머리를 얹으면
     마네킹이 아니라 사람으로 보이고, 카운터 뒤에 점원이 하나 더 서 있는
     것이 됩니다. 처음엔 목에 파란 천을 둘렀는데 그 천이 딱 머리 자리라,
     "머리를 안 단다" 는 원칙을 스스로 깨고 있었습니다. */
  px(g, 6, 3, 4, 5, '#E0D2C0');                      // 목
  px(g, 6, 3, 2, 5, '#F4EADD');
  px(g, 2, 8, 12, 3, '#E0D2C0');                     // 어깨
  px(g, 3, 11, 10, 5, '#E0D2C0');                    // 가슴
  px(g, 5, 16, 6, 4, '#C9B9A4');                     // 허리
  px(g, 2, 8, 2, 3, '#F4EADD');
  px(g, 3, 11, 2, 5, '#F4EADD');
  /* 입혀 놓은 옷 — 파는 물건이 몸에 붙어 있어야 진열입니다.
     목과 허리는 남겨 둡니다. 통으로 덮으면 옷걸이에 걸린 옷과 같아집니다. */
  px(g, 3, 9, 10, 7, '#D8442C');
  px(g, 3, 9, 10, 2, '#F0836E');
  px(g, 2, 9, 1, 3, '#A8331F');                      // 어깨 솔기
  px(g, 13, 9, 1, 3, '#A8331F');
  px(g, 3, 15, 10, 1, '#A8331F');
  PAINTED.mannequin = c;
}

/* 포개 쌓은 의자 1×2 — 가구 가게의 재고 */
{
  const c = canvasOf(1, 2), g = c.getContext('2d');
  const P = DESKPAL;
  shadow(g, 8, 30, 6, 2);
  /* 맨 아래 의자의 다리만 바닥에 닿습니다 */
  px(g, 3, 26, 2, 5, P.woodDark);
  px(g, 11, 26, 2, 5, P.woodDark);
  /* 셋을 포개면 앉는 면이 계단처럼 어긋납니다 — 그 어긋남이 "쌓았다"
     를 말합니다. 나란히 세우면 그냥 의자 셋입니다. */
  [[P.seat, P.seatLit], ['#79AC8B', '#9BC7AA'], ['#BE8676', '#D6A695']].forEach(([col, lit], i) => {
    const y = 22 - i * 7;
    px(g, 2, y - 6, 12, 7, P.woodDark);
    px(g, 3, y - 5, 10, 5, P.wood);
    px(g, 3, y - 5, 10, 1, P.woodLit);
    px(g, 1, y, 14, 5, P.woodDeep);
    px(g, 1, y, 14, 4, col);
    px(g, 1, y, 14, 2, lit);

/* 받침 위 화분 1×2 — 바닥 화분과 갈립니다 */
{

  shadow(g, 8, 30, 6, 2);

  px(g, 3, 29, 2, 2, '#5C4029'); px(g, 11, 29, 2, 2, '#5C4029');
  px(g, 4, 22, 2, 8, '#6B4A2E'); px(g, 10, 22, 2, 8, '#6B4A2E');
  px(g, 4, 22, 1, 8, '#8A5F3A');
  px(g, 2, 20, 12, 3, '#8A5F3A'); px(g, 2, 20, 12, 1, '#A97A4C');
  /* 화분 */
  px(g, 4, 13, 8, 7, '#A8654A'); px(g, 4, 13, 8, 2, '#C4805E');
  px(g, 3, 12, 10, 2, '#8E5238');
  px(g, 5, 11, 6, 1, FURN.soil);
  /* 잎 — 좌우 길이를 달리해야 화초가 됩니다. 대칭이면 조화입니다 */
  px(g, 7, 4, 2, 8, '#4E7A3E');
  px(g, 7, 4, 1, 8, '#639650');
  [[-5, 6, 5, '#3E7A3D'], [4, 8, 4, '#5FA855'], [-4, 10, 4, '#4C8C46'],
   [3, 5, 3, '#6FBA60']].forEach(([dx, y, len, col]) => {
    const dir = dx < 0 ? -1 : 1;
    for (let i = 0; i < len; i++)
      px(g, 8 + dir * (i + 1) - (dir < 0 ? 1 : 0), y - ((i * 3) / len | 0), 1, Math.max(1, 3 - ((i / 2) | 0)), col);
  });
  disc(g, 8, 3, 2, '#6FBA60');
  PAINTED.plantStand = c;
}

/* 옷걸이·신발장·소파는 통으로 막습니다 — 뒤로 걸어 들어가지면 진열대와
   벽 사이에 사람이 낄 주머니가 생깁니다(입간판과 같은 이유).
   마네킹·모자걸이·러그·쌓은 의자·화분 받침은 위가 튀어나온 물건이라

/* ==================================================================
   실내 바닥

   타일 한 장을 반복하면 격자가 눈에 띄고, 넓은 방일수록 심해집니다.
   방 전체를 한 장에 그리면 널판 이음새를 어긋나게 놓고, 통로를 다른
   재질로 깔고, 걸레받이 그림자까지 넣을 수 있습니다.
   ================================================================== */
function paintFloor(w, h, kind, P) {
  const c = canvasOf(w, h), g = c.getContext('2d');
  const W = c.width, H = c.height;

  if (kind === 'parquet') {
    /* 마루 — 도서관. 널판을 줄마다 어긋나게 깝니다.
       한동안 벽돌로 읽혔습니다. 처음엔 널 길이(47px) 탓인 줄 알고
       31px 로 줄였는데 더 벽돌이 됐습니다 — 31×7 은 2:1, 정확히 벽돌
       비율입니다. 재질을 가르는 것은 **비율과 이음새**입니다: 벽돌은
       2:1 에 줄눈이 진하고, 마루는 9:1 에 세로 이음새가 거의 안 보이며
       결이 깁니다. 그래서 널을 63px(9:1)로 늘이고 세로 이음새를 죽이고
       긴 결을 넣습니다. 색도 주황에서 갈색으로 내립니다. */
    /* 밝기는 51% → 61% 로 올리되 **채도는 오히려 내립니다**(31% → 24%).
       한 번은 밝기만 올렸다가 주황기가 세져 싸구려 합판처럼 보였습니다 —
       밝은 나무를 고급스럽게 보이게 하는 것은 밝기가 아니라 낮은 채도이고,
       색상도 29~30° 주황에서 31~32° 로 옮겨 호두나무 쪽에 붙였습니다.
       세 널의 명암 순서(어두움-밝음-중간)는 그대로라 결은 살아 있습니다. */
    px(g, 0, 0, W, H, '#B39C82');
    for (let y = 0; y < H; y += 8) {
      const off = (y / 8 % 2) * 32;
      for (let x = -64; x < W; x += 64) {
        const n = rnd(x, y, 3);
        px(g, x + off, y, 63, 7, n < 0.33 ? '#AF9880' : n < 0.66 ? '#BCA68C' : '#A78F76');
        px(g, x + off, y, 63, 1, 'rgba(255,255,255,.09)');
        px(g, x + off + 62, y, 1, 7, 'rgba(0,0,0,.07)');
        /* 긴 결 두 가닥 — 이게 나무를 나무로 만듭니다 */
        px(g, x + off + 5 + Math.floor(n * 10), y + 2, 22, 1, 'rgba(80,55,30,.12)');
        px(g, x + off + 30 + Math.floor(n * 14), y + 5, 18, 1, 'rgba(80,55,30,.10)');
      }
      px(g, 0, y + 7, W, 1, 'rgba(0,0,0,.06)');
    }
  } else if (kind === 'stone') {
    /* 석재 — 본관. 큰 판을 줄눈으로 나눕니다. */
    /* 석재는 밝기(75%)가 아니라 **채도**가 문제였습니다 — 10% 라 밝은
       게 아니라 색이 빠진 것으로 읽힙니다. 채도를 18% 로 올리고 색상을
       푸른 회색에서 따뜻한 베이지 회색으로 옮깁니다. 밝기는 그대로라
       기물과의 대비는 안 변합니다. */
    px(g, 0, 0, W, H, '#CBC4B6');
    for (let y = 0; y < H; y += 24) for (let x = 0; x < W; x += 24) {
      const n = rnd(x, y, 7);
      px(g, x, y, 23, 23, n < 0.3 ? '#D4CDBE' : n < 0.7 ? '#C6BFB1' : '#CFC8BA');
      px(g, x, y, 23, 1, 'rgba(255,255,255,.16)');
      px(g, x, y, 1, 23, 'rgba(255,255,255,.12)');
      px(g, x + 23, y, 1, 24, 'rgba(0,0,0,.13)');
      px(g, x, y + 23, 24, 1, 'rgba(0,0,0,.13)');
      /* 반점 — 화강암 느낌 */
      g.fillStyle = 'rgba(90,100,115,.22)';
      for (let s = 0; s < 5; s++)
        g.fillRect(x + 3 + Math.floor(rnd(x + s, y, 11) * 17),
                   y + 3 + Math.floor(rnd(x, y + s, 13) * 17), 1, 1);
    }
  } else if (kind === 'laminate') {
    /* 장판 — 기숙사. 따뜻하고 이음새가 촘촘합니다. */
    px(g, 0, 0, W, H, '#DBC49E');
    for (let y = 0; y < H; y += 11) {
      const n = rnd(0, y, 5);
      px(g, 0, y, W, 10, n < 0.4 ? '#DCC6A2' : n < 0.75 ? '#D6BE99' : '#E0CBA6');
      px(g, 0, y, W, 1, 'rgba(255,255,255,.14)');
      px(g, 0, y + 10, W, 1, 'rgba(0,0,0,.07)');
      /* 나뭇결 — 촘촘하면 줄무늬가 되고 성글면 나무가 됩니다 */
      g.fillStyle = 'rgba(150,120,80,.11)';
      for (let x = 0; x < W; x += 19)
        g.fillRect(x + ((y / 11) % 2 ? 9 : 0), y + 4, 11, 1);
    }
  } else {
    /* 타일 — 학생회관. 반들거리는 대형 타일. */
    px(g, 0, 0, W, H, '#DDE3E6');
    for (let y = 0; y < H; y += 16) for (let x = 0; x < W; x += 16) {
      const n = rnd(x, y, 9);
      px(g, x, y, 15, 15, n < 0.5 ? '#E2E8EA' : '#D8DEE2');
      px(g, x, y, 15, 1, 'rgba(255,255,255,.5)');
      px(g, x, y, 1, 15, 'rgba(255,255,255,.35)');
      px(g, x + 15, y, 1, 16, 'rgba(120,132,140,.3)');
      px(g, x, y + 15, 16, 1, 'rgba(120,132,140,.3)');
    }
  }

  /* 벽에서 떨어지는 그림자. 바닥과 벽이 만나는 자리가 어두워야
     방이 닫힌 상자로 보입니다. */
  const grad = g.createLinearGradient(0, TS * 3, 0, TS * 3 + 14);
  grad.addColorStop(0, 'rgba(0,0,0,.30)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad; g.fillRect(0, TS * 3, W, 14);
  const gl = g.createLinearGradient(TS, 0, TS + 10, 0);
  gl.addColorStop(0, 'rgba(0,0,0,.22)'); gl.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gl; g.fillRect(TS, TS * 3, 10, H - TS * 3);
  const gr = g.createLinearGradient(W - TS, 0, W - TS - 10, 0);
  gr.addColorStop(0, 'rgba(0,0,0,.22)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(W - TS - 10, TS * 3, 10, H - TS * 3);
  return c;
}

/** 통로·러그를 바닥 위에 덧그립니다. 방의 동선을 눈으로 알려 줍니다. */
/** 스탠드 아래 빛웅덩이. 조명이 켜져 있는데 바닥이 그대로면
    스탠드가 장식품으로 보입니다. */
function floorGlow(c, cx, cy, r) {
  const g = c.getContext('2d');
  const X = cx * TS, Y = cy * TS, R = r * TS;
  for (let k = 4; k >= 1; k--) {
    g.fillStyle = 'rgba(255,214,138,' + (0.05 * k) + ')';
    g.beginPath(); g.ellipse(X, Y, R * (k / 4), R * (k / 4) * 0.72, 0, 0, 7); g.fill();
  }
}

/** rgb — 러너 색. 안 주면 도서관·본관·학생회관이 쓰는 청록입니다.
    미니게임관만 자주를 넘깁니다. 색을 하나 더 만드는 대신 넘겨받는
    이유는, 무늬가 방마다 달라지면 같은 건물군으로 안 보이기 때문입니다. */
function floorInlay(c, x, y, w, h, kind, rgb) {
  const g = c.getContext('2d');
  const X = x * TS, Y = y * TS, W = w * TS, H = h * TS;
  const run = rgb || '62,141,130';
  if (kind === 'border') {
    /* 벽을 따라 도는 테두리 띠. 넓은 방은 이게 없으면 바닥이 아니라
       무늬 종이가 됩니다. */
    /* 검정 10% 로 방 둘레를 한 바퀴 덮고 있었습니다. 넓은 방일수록
       시야 가장자리가 눌려서 방 전체가 어둡게 느껴집니다 — 검정을
       절반으로 줄이고 대신 안쪽 하이라이트를 올려, 테두리는 그대로
       읽히되 눌리지는 않게 합니다. */
    px(g, X, Y, W, TS, 'rgba(0,0,0,.05)');
    px(g, X, Y + H - TS, W, TS, 'rgba(0,0,0,.05)');
    px(g, X, Y, TS, H, 'rgba(0,0,0,.05)');
    px(g, X + W - TS, Y, TS, H, 'rgba(0,0,0,.05)');
    px(g, X + TS - 2, Y + TS - 2, W - TS * 2 + 4, 2, 'rgba(255,255,255,.28)');
    px(g, X + TS - 2, Y + H - TS, W - TS * 2 + 4, 2, 'rgba(255,255,255,.28)');
    px(g, X + TS - 2, Y + TS - 2, 2, H - TS * 2 + 4, 'rgba(255,255,255,.28)');
    px(g, X + W - TS, Y + TS - 2, 2, H - TS * 2 + 4, 'rgba(255,255,255,.28)');
    return;
  }
  if (kind === 'runner') {
    px(g, X, Y, W, H, 'rgba(' + run + ',.16)');
    px(g, X, Y, W, 2, 'rgba(255,255,255,.22)');
    px(g, X + W - 2, Y, 2, H, 'rgba(0,0,0,.12)');
    g.fillStyle = 'rgba(' + run + ',.4)';
    g.fillRect(X + 2, Y, 2, H); g.fillRect(X + W - 5, Y, 2, H);
  } else if (kind === 'rug') {
    /* 테두리 두 겹에 안쪽 무늬. 동심 사각을 계속 겹치면 과녁이 됩니다.
       네 겹의 명암 순서는 그대로 두고 통째로 위로 올렸습니다 — 전에는
       바깥 테두리가 마루보다 어두워 깔개가 바닥에 뚫린 구멍처럼 보였습니다.

       그 다음 판이 촌스러웠던 이유는 밝기가 아니라 **채도**였습니다:
       35~53% 짜리 주황 갈색은 밝게 올릴수록 살구색으로 가서 싸 보입니다.
       고풍스러운 갈색은 채도가 낮습니다 — 채도를 절반(18~29%)으로 깎고
       색상을 20~24° 주황에서 31~34° 올리브 갈색으로 옮겼습니다.
       오래된 양모 깔개의 색입니다. 밝기는 거의 그대로 둡니다.
       (색은 민철님이 재서 잡은 값입니다.)

       겹 두께는 **짧은 변**을 따라갑니다. 4·7·11 로 못을 박아 두면 두 칸
       짜리 러그(32px)는 테두리 세 겹이 높이를 다 먹어 안쪽 무늬가 한 줄도
       안 남고, 그러면 러그가 아니라 판때기가 됩니다. 방 꾸미기로 산
       작은 러그가 그렇습니다 — 큰 방 깔개만 있던 때는 안 걸렸습니다.
       12로 나눈 것은 4겹이 짧은 변의 1/3을 넘지 않게 하는 값입니다. */
    const k = Math.max(1, Math.min(4, Math.floor(Math.min(W, H) / 12)));
    px(g, X, Y, W, H, '#9D8871');
    px(g, X + k, Y + k, W - k * 2, H - k * 2, '#BCA891');
    px(g, X + Math.round(k * 1.75), Y + Math.round(k * 1.75),
       W - Math.round(k * 3.5), H - Math.round(k * 3.5), '#AC977F');
    px(g, X + Math.round(k * 2.75), Y + Math.round(k * 2.75),
       W - Math.round(k * 5.5), H - Math.round(k * 5.5), '#CBB9A1');
    g.fillStyle = 'rgba(120,102,80,.34)';
    const m0 = k * 4;
    for (let yy = Y + m0; yy < Y + H - m0; yy += 14)
      for (let xx = X + m0; xx < X + W - m0; xx += 14) {
        g.fillRect(xx, yy + 2, 6, 2); g.fillRect(xx + 2, yy, 2, 6);
      }
    /* 술 */
    g.fillStyle = '#D9BCA4';
    for (let xx = X + 2; xx < X + W - 2; xx += 4) {
      g.fillRect(xx, Y - 3, 2, 3); g.fillRect(xx, Y + H, 2, 3);
    }
    px(g, X, Y, W, 2, 'rgba(255,255,255,.12)');
    px(g, X, Y + H - 2, W, 2, 'rgba(0,0,0,.16)');
  }
}

/* ================== 맵 ================== */
/* ---------------- 표면 ----------------
   무엇을 밟고 있는지. 발소리·먼지·풀 눕히기가 전부 이 값을 봅니다.

   over 나 base 로 매번 알아내지 않는 이유 - 트랙과 자갈 마당은 잔디
   위에 **그림으로만** 얹혀 있어 타일 값으로는 구분되지 않습니다. 그림과
   감촉이 어긋나면 포석 위에서 잔디 소리가 납니다. */
const SURF = { GRASS: 0, STONE: 1, WOOD: 2, TILE: 3, WATER: 4, GRAVEL: 5, TRACK: 6 };

/** 바닥 그림과 짝이 맞는 표면을 칠합니다. 그림을 그린 자리에 같은 범위로
    부르세요 - 안 부르면 bake 가 잔디로 둡니다. */
function fillSurf(m, x, y, w, h, kind) {
  for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++)
    if (inMap(m, i, j)) m.surf[at(m, i, j)] = kind;
}

function makeMap(w, h, baseTile) {
  return { w, h, base: new Uint16Array(w * h).fill(baseTile),
           over: new Uint8Array(w * h), surf: new Uint8Array(w * h),
           /* 바닥 그림에 직접 그린 칸. 오토타일을 얹지 않습니다 —
              시트에는 직각 모서리 조각이 없어서, 곧게 그리려면 타일을
              쓰지 않는 수밖에 없습니다. */
           painted: new Uint8Array(w * h),
           props: [], portals: [], npcs: [], things: [] };
}
const at = (m, x, y) => y * m.w + x;
const inMap = (m, x, y) => x >= 0 && y >= 0 && x < m.w && y < m.h;

function fillBase(m, x, y, w, h, tile) {
  for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++)
    if (inMap(m, i, j)) m.base[at(m, i, j)] = tile;
}
/* ---- 못 ----
   타일시트로는 직각이 안 나옵니다. 오토타일은 아홉 조각(모서리 넷 ·
   변 넷 · 가운데)뿐이고 모서리 조각이 전부 둥글게 그려져 있어서,
   무엇을 골라도 귀가 깎이거나 한쪽 변이 끊깁니다. 세 번 고쳐 봤고
   세 번 다 어딘가 어긋났습니다.

   그래서 못은 **바닥 그림에 직접 그립니다.** 물 사각형 하나, 그 둘레에
   돌 테 하나 — 선이 곧고 귀가 직각입니다. 물낯 반짝임은 지금처럼
   그리기 루프가 위에 얹으므로 그대로 삽니다. */
function paintPond(m, x, y, w, h, rim) {
  const g = m.ground.getContext('2d');
  const X = x * TS, Y = y * TS, W = w * TS, H = h * TS, R = rim * TS;

  /* 1) 돌 테 — 바깥 사각형 전체를 돌로 깔고 안쪽을 물로 덮습니다.
        테를 네 조각으로 그리면 귀에서 두 번 칠해져 톤이 어긋납니다. */
  px(g, X, Y, W, H, '#8E93A6');
  /* 판석 이음매. 가로 줄만 넣습니다 — 세로까지 그으면 격자가 되고,
     16px 에서 격자는 곧 노이즈입니다. */
  for (let j = 0; j < H; j += 8) px(g, X, Y + j, W, 1, '#7C8195');
  px(g, X, Y, W, 1, '#A6ABBD');                      // 위 모서리 빛
  px(g, X, Y + H - 1, W, 1, '#6E7386');              // 아래 모서리 그늘

  /* 2) 물 — 안쪽 사각형. 가장자리 한 줄을 어둡게 해서 깊이를 냅니다. */
  const wx = X + R, wy = Y + R, ww = W - R * 2, wh = H - R * 2;
  px(g, wx, wy, ww, wh, '#2F6BA8');
  px(g, wx, wy, ww, 2, '#255A90');                   // 안쪽 그림자 (위)
  px(g, wx, wy, 2, wh, '#255A90');                   // 안쪽 그림자 (왼)
  px(g, wx + ww - 2, wy, 2, wh, '#3576B4');          // 반대편은 조금 밝게
  px(g, wx, wy + wh - 2, ww, 2, '#3576B4');
  /* 물결 — 가로로 긴 얼룩 몇 개. 고인 물이라 세로 무늬는 안 넣습니다.
     너비를 남은 폭으로 자릅니다. 안 자르면 오른쪽 끝 얼룩이 돌 테 위로
     4px 삐져나가고, 그 한 줄 때문에 곧게 그린 테가 다시 어긋나 보입니다. */
  for (let j = 6; j < wh - 4; j += 7) {
    for (let i = 4; i < ww - 6; i += 13) {
      if (rnd(i + X, j + Y, 17) < 0.45) continue;
      const len = Math.min(6 + ((i + j) % 5), ww - 3 - i);
      if (len > 1) px(g, wx + i, wy + j, len, 1, '#3A7CBB');
    }
  }

  /* 3) 이 칸들은 그리기 루프가 타일로 덮지 않습니다 */
  for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++)
    if (inMap(m, i, j)) m.painted[at(m, i, j)] = 1;
}
/* 호수 장식 — 외부 이미지 대신 기존 월드와 같은 16px 픽셀 격자로
   그립니다. x/y는 월드 좌표, 내부 숫자는 16px 원본 격자입니다. */
function drawLakeLotus(x, y, variant = 0) {
  const bob = Math.round(Math.sin(WIND.t * 0.8 + variant) * AS * 0.35);
  const p = (dx, dy, w, h, color) => px(ctx, x + dx * AS, y + dy * AS + bob, w * AS, h * AS, color);
  const leaf = variant % 2 ? '#2B8A45' : '#31994B';
  const leafDark = '#176334';
  const petal = variant % 3 === 1 ? '#F28BB8' : variant % 3 === 2 ? '#FFD36A' : '#F49BC5';
  const petalLight = '#FFD3E8';
  p(1, 7, 9, 2, 'rgba(12,54,70,.22)');
  p(0, 4, 11, 4, leafDark);
  p(2, 2, 7, 6, leaf);
  p(1, 4, 3, 2, '#45AE58');
  p(5, 2, 2, 6, leafDark);
  p(8, 4, 2, 2, '#45AE58');
  /* 꽃은 작은 5瓣 실루엣으로, 잎 중앙에 얹습니다. */
  p(4, 0, 3, 2, petalLight);
  p(2, 2, 3, 3, petal);
  p(6, 2, 3, 3, petal);
  p(4, 3, 4, 3, petal);
  p(5, 2, 2, 3, '#FFE36E');
  p(5, 3, 1, 1, '#E49A32');
}

/* 물고기는 **헤엄칩니다.** 여태 제자리에서 위아래로만 까딱였습니다 —
   가만히 떠 있는 물고기는 물고기가 아니라 물 위에 붙인 스티커입니다.

   자리를 상태로 들고 있지 않고 시각(WIND.t)에서 바로 계산합니다.
   갱신 함수가 없으면 프레임을 건너뛰어도 자리가 안 튀고, 존을 오가도
   맞출 것이 없습니다.

   왕복 폭은 ±1.6칸입니다. 못이 8칸(x2~9)이라 그 이상 가면 돌 테를
   넘고, 그보다 좁으면 헤엄이 아니라 떨림으로 보입니다. 한 왕복이
   18초쯤 — 물속에서 어슬렁대는 속도입니다.

   facing 은 이제 **어느 쪽에서 시작하나**를 뜻합니다. 보는 쪽은
   가는 쪽에서 나옵니다(도함수 cos). 방향 전환이 왕복의 양 끝에서
   정확히 일어나므로, 물고기가 벽에 부딪혀 튕기는 것이 아니라 돌아서
   가는 것으로 보입니다. */
function drawLakeFish(x, y, variant = 0, facing = 'left') {
  const t = FX.reduced ? 0 : WIND.t;
  const ph = (facing === 'right' ? Math.PI : 0) + variant * 1.4;
  const swim = t * 0.34 + ph;
  const drift = Math.round(Math.sin(swim) * 1.6 * T);
  const bob = Math.round(Math.sin(t * 1.05 + variant * 1.4) * AS * 0.3);
  const mirrored = Math.cos(swim) > 0;          // 가는 쪽(도함수)을 봅니다
  const originX = (mirrored ? x + 12 * AS : x) + drift;
  const p = (dx, dy, w, h, color) => px(
    ctx,
    originX + (mirrored ? -dx * AS - w * AS : dx * AS),
    y + dy * AS + bob,
    w * AS,
    h * AS,
    color,
  );
  const palettes = [
    ['#F08B4B', '#B94E3B', '#FFD17A'],
    ['#4F8FEA', '#24518B', '#9FD7F2'],
    ['#78B7B0', '#276B74', '#C4EEE2'],
    ['#B7B8C8', '#5C617B', '#E7E8F4'],
    ['#F0B94E', '#9B5730', '#FFE39A'],
  ];
  const [body, dark, light] = palettes[variant % palettes.length];
  /* 연꽃보다 작은 픽셀 실루엣입니다. 머리와 꼬리를 넓혀
     물고기 방향이 한눈에 보이게 합니다. */
  p(1, 3, 9, 4, dark);
  p(3, 2, 7, 5, body);
  p(0, 4, 3, 2, body);
  p(10, 2, 2, 2, dark);
  p(10, 5, 2, 2, dark);
  p(4, 2, 3, 1, light);
  p(4, 3, 1, 1, '#24343A');
  /* 수면 아래쪽을 다시 칠해 몸통의 절반만 남깁니다. */
  p(0, 4, 12, 3, '#2F6BA8');
  p(2, 4, 8, 1, '#3A7CBB');
}

/* ==================================================================
   백조

   월드에 백조 캐릭터 시트가 이미 있습니다(sprite 347 · 알 800코인).
   그런데 그건 **옷을 입고 두 발로 걷는 32×48 종이인형**입니다 — 물 위를
   도는 새로 쓰려면 종이인형 합성 경로(옷·모자·탈것·걸음 프레임)가 통째로
   딸려 오고, 그 값을 프레임마다 냅니다. 연꽃·물고기와 같은 16px 격자로
   직접 그리는 편이 훨씬 쌉니다 — 새 한 마리에 fillRect 스무 남짓입니다.

   ---- 그림 규칙 ----
   물고기와 같습니다. **아랫줄을 물색으로 도로 덮어** 몸의 절반만 물 위에
   남깁니다. 그래야 물에 얹힌 것이 아니라 뜬 것으로 보입니다.
   목은 S 자입니다 — 곧게 세우면 거위가 됩니다. 이 한 획이 백조를
   백조로 만듭니다.
   자국(wake)은 가는 쪽 **반대편**으로 세 줄, 뒤로 갈수록 넓고 옅게.
   자국이 없으면 물 위에 붙은 그림이고, 있으면 지나간 것이 됩니다.
   ================================================================== */
function drawLakeSwan(x, y, facing) {
  const mirrored = facing === 'right';
  const ox = mirrored ? x + 14 * AS : x;
  const p = (dx, dy, w, h, c) => px(ctx,
    ox + (mirrored ? -dx * AS - w * AS : dx * AS),
    y + dy * AS, w * AS, h * AS, c);
  /* 자국 — 지나온 쪽으로 벌어집니다 */
  p(-2, 7, 4, 1, 'rgba(226,244,250,.34)');
  p(-5, 8, 5, 1, 'rgba(226,244,250,.21)');
  p(-9, 9, 6, 1, 'rgba(226,244,250,.12)');
  p(1, 8, 10, 1, 'rgba(12,54,70,.20)');          // 물에 지는 그늘
  /* 몸 — 뒤가 높고 앞이 낮아야 뜬 배 모양이 됩니다 */
  p(1, 5, 10, 3, '#E8EFF5');
  p(2, 4, 8, 3, '#FFFFFF');
  p(0, 4, 3, 2, '#F4F8FB');                      // 꼬리 깃
  p(3, 5, 5, 2, '#F8FBFD');
  p(4, 6, 4, 1, '#D8E2EA');                      // 날개 아래 그늘
  /* 목 — 한 칸씩 어긋나게 올려 S 자로 굽힙니다 */
  p(8, 4, 2, 1, '#E8EFF5');
  p(8, 2, 2, 3, '#FFFFFF');
  p(9, 1, 2, 2, '#FFFFFF');
  /* 머리 · 부리 · 눈 */
  p(10, 0, 3, 2, '#FFFFFF');
  p(11, 0, 1, 1, '#2A2320');
  p(11, 1, 1, 1, '#2A2320');                     // 부리 밑동의 검은 혹
  p(12, 1, 2, 1, '#F0913A');
  p(13, 1, 1, 1, '#D2761F');
  /* 물낯 — 몸의 아랫절반을 물색으로 덮습니다 */
  p(0, 7, 12, 2, '#2F6BA8');
  p(1, 7, 10, 1, '#3A7CBB');
}

/* 백조가 지금 어디에 있나. **상태를 안 들고** 시각에서 바로 셉니다 —
   갱신 함수가 없으면 존을 오가도 어긋날 데가 없고, 탭이 가려져 프레임을
   건너뛰어도 돌아왔을 때 자리가 안 튑니다(그건 물 위를 순간이동하는
   것으로 보입니다).

   x 는 코사인, y 는 주기가 어긋난 사인입니다. 둘의 주기가 같으면
   타원 한 바퀴라 시계 바늘처럼 읽히는데, 0.61 배로 어긋내면 같은 자리가
   한참 뒤에나 돌아옵니다 — 정처 없이 떠다니는 것으로 보입니다.
   보는 쪽은 x 의 도함수(-sin)에서 나옵니다. 그림을 왼쪽으로 젓는데
   머리가 오른쪽을 보고 있으면 그건 헤엄이 아니라 미끄러짐입니다. */
const LAKE = {
  at(s) {
    const t = FX.reduced ? 0 : WIND.t;
    const a = t * s.sp + s.ph;
    return {
      x: Math.round((s.cx + Math.cos(a) * s.rx) * T),
      y: Math.round((s.cy + Math.sin(a * 0.61 + s.ph) * s.ry) * T),
      dir: Math.sin(a) < 0 ? 'right' : 'left',
    };
  },
};

function fillOver(m, x, y, w, h, mat) {
  for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++)
    if (inMap(m, i, j)) m.over[at(m, i, j)] = mat;
}
/** 타원으로 표면을 칠합니다. 트랙 인필드처럼 둥근 안쪽을 되살릴 때 씁니다. */
function fillEllipseSurf(m, cx, cy, rx, ry, kind) {
  for (let y = Math.floor(cy - ry); y <= cy + ry; y++)
    for (let x = Math.floor(cx - rx); x <= cx + rx; x++) {
      const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry;
      if (dx * dx + dy * dy <= 1 && inMap(m, x, y)) m.surf[at(m, x, y)] = kind;
    }
}

/** 타원으로 재질을 칠합니다. 사각형으로 칠한 못은 수영장이 됩니다. */
function fillEllipse(m, cx, cy, rx, ry, mat) {
  for (let y = Math.floor(cy - ry); y <= cy + ry; y++)
    for (let x = Math.floor(cx - rx); x <= cx + rx; x++) {
      const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry;
      if (dx * dx + dy * dy <= 1 && inMap(m, x, y)) m.over[at(m, x, y)] = mat;
    }
}
function ring(m, x, y, w, h, tile) {
  for (let i = x; i < x + w; i++) { fillBase(m, i, y, 1, 1, tile); fillBase(m, i, y + h - 1, 1, 1, tile); }
  for (let j = y; j < y + h; j++) { fillBase(m, x, j, 1, 1, tile); fillBase(m, x + w - 1, j, 1, 1, tile); }
}
function prop(m, kind, x, y) { m.props.push({ kind, x, y }); }

/** 미니게임 표에서 이 존 몫만 꺼내 소품과 만질 것을 같이 세웁니다.
    소품만 놓고 things 를 잊으면 서 있는 그림이 되고, things 만 놓으면
    아무것도 없는 자리에서 창이 열립니다. 둘을 한 줄에 묶어 둡니다. */
function placeMinigames(m, id) {
  for (const g of MINIGAMES) {
    if (g.zone !== id) continue;
    prop(m, g.prop, g.x, g.y);
    m.things.push({ x: g.x, y: g.y, name: g.name, panel: g.panel });
    if (g.glow) floorGlow(m.floor, g.x + g.glow[0], g.y + g.glow[1], g.glow[2]);
  }
}
function rowOf(m, kind, x, y, n, step = 1) { for (let i = 0; i < n; i++) prop(m, kind, x + i * step, y); }
function rnd(x, y, s = 0) {
  let h = (x * 374761393 + y * 668265263 + s * 2246822519) | 0;
  h = (h ^ (h >>> 13)) * 1274126177;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

/** 건물을 세우고, 문에 포탈과 간판을 같이 답니다. */
function placeBuilding(m, kind, x, y, to, sx, sy, label) {
  const d = PROP[kind];
  prop(m, kind, x, y);
  const dx = x + d.doorX, dy = y + d.h - 1;
  m.portals.push({ x: dx, y: dy, w: 2, h: 1, to, sx, sy, label });
  /* 문 앞 진입로 */
  fillOver(m, dx - 1, dy + 1, 4, 3, M.PLAZA);
}

/* ---- 숲 ----
   맵을 십자로 자르면 잘린 면이 생깁니다. 잔디로 두면 "왜 더 못 가지"가
   되고, 검게 두면 화면이 고장 난 것처럼 보입니다. 나무를 빽빽이 세워
   **여기서 캠퍼스가 끝난다**고 말하게 했습니다. */
function treeBlob(g, x, y, r) {
  const R = r > 0.6 ? 9 : r > 0.28 ? 7 : 6;
  g.fillStyle = 'rgba(0,0,0,.26)';
  g.beginPath(); g.ellipse(x, y, R, Math.max(2, R * 0.4), 0, 0, 7); g.fill();
  px(g, x - 1, y - R, 3, R, '#553A25');
  px(g, x - 1, y - R, 1, R, '#75543A');
  disc(g, x, y - R - 2, R, '#1F4B2C');
  disc(g, x, y - R - 3, R - 1, '#2E6A3C');
  disc(g, x - 2, y - R - 4, Math.max(2, R - 4), '#44884B');
  disc(g, x - 3, y - R - 5, Math.max(1, R - 6), '#5CA35C');
}
function bushBlob(g, x, y, s) {
  disc(g, x, y, s, '#24522F');
  disc(g, x, y - 1, s - 1, '#33703E');
  disc(g, x - 1, y - 2, Math.max(1, s - 3), '#4A8C4F');
}
/* ---- 잔디 ----
   시트의 잔디 타일은 #38CBAB, 청록입니다. 그 위에 나무를 심으면 땅만
   물색이라 숲이 캠퍼스에 붙어 있지 않고 떠 보입니다. 실내 마루처럼
   캠퍼스 바닥도 한 장으로 그립니다 — 16px 격자가 사라지고, 얼룩과
   풀포기를 타일 경계와 상관없이 놓을 수 있습니다. */
function paintLawn(wTiles, hTiles) {
  const c = canvasOf(wTiles, hTiles), g = c.getContext('2d');
  const W = c.width, H = c.height;
  px(g, 0, 0, W, H, '#5B9E52');
  for (let y = 0; y < H; y += 4) for (let x = 0; x < W; x += 4) {
    const r = rnd(x, y, 3);
    if (r > 0.78) px(g, x, y, 4, 3, '#68AC5C');
    else if (r < 0.20) px(g, x, y, 3, 3, '#4F8E49');
  }
  /* 넓은 얼룩 — 잔디가 한 톤이면 장판입니다. 풀포기보다 먼저 깔아야
     포기가 얼룩 위에 서 있는 것으로 보입니다. */
  for (let y = 0; y < H; y += 11) for (let x = 0; x < W; x += 11) {
    if (rnd(x, y, 41) < 0.6) continue;
    const r = 6 + Math.round(rnd(x, y, 42) * 7);
    disc(g, x + Math.round(rnd(x, y, 43) * 10), y + Math.round(rnd(x, y, 44) * 10), r,
         rnd(x, y, 45) > 0.5 ? 'rgba(122,191,102,.30)' : 'rgba(64,124,60,.26)');
  }
  /* 풀포기 — 3px 짜리 V 자. 간격만큼 흔들어야 격자가 안 보입니다:
     7px 격자에 4px 만 흔들었더니 대각선 줄이 그대로 남았습니다. */
  for (let y = 4; y < H - 3; y += 9) for (let x = 3; x < W - 3; x += 9) {
    if (rnd(x, y, 11) < 0.34) continue;
    const bx = x + Math.round(rnd(x, y, 12) * 8), by = y + Math.round(rnd(x, y, 13) * 8);
    if (bx >= W - 2 || by >= H - 3) continue;
    g.fillStyle = rnd(bx, by, 14) > 0.5 ? '#7CBF66' : '#6FB35C';
    const tall = rnd(bx, by, 15) > 0.62 ? 3 : 2;
    g.fillRect(bx, by, 1, tall);
    g.fillRect(bx - 1, by - 1 + (tall > 2 ? 1 : 0), 1, tall - 1);
    g.fillRect(bx + 1, by - 1, 1, tall - 1);
    g.fillStyle = '#46833F'; g.fillRect(bx, by + tall, 1, 1);
  }
  return c;
}

/* ---- 들꽃 ----
   잔디밭에 꽃 무더기를 몇 군데 피웁니다. 화단(planter)은 사람이 만든
   것이고 이건 저절로 핀 것이라, 줄을 안 맞추고 가운데가 짙고 가장자리가
   성기게 흩습니다. 무더기가 아니라 고르게 뿌리면 잔디 무늬가 됩니다.

   **잔디 그림에 같이 굽습니다.** 매 프레임 그리면 송이마다 fillRect 가
   대여섯씩 들고, 캠퍼스 한 화면에 수백 송이면 그것만으로 프레임이
   밀립니다. 구워 두면 프레임 값이 0 이고, 미니맵(bakeMinimap)도 같은
   그림을 줄여 쓰므로 지도에까지 꽃밭이 따라갑니다.

   자리는 rnd(x, y, seed) 해시가 정합니다. Math.random 이면 새로고침마다
   다른 데서 피고, 프레임마다 부르면 아예 반짝입니다 — 같은 칸이 늘 같은
   답을 내야 "그 자리에 핀 꽃" 이 됩니다.

   안 피우는 칸 셋 —
     포장·물(over)      광장 포석 틈의 꽃은 꽃이 아니라 얼룩입니다
     트랙·자갈(surf)    우레탄 위에 꽃이 필 리 없습니다
     기물이 덮은 칸     건물·천막 밑에 그려 봐야 안 보이고, 가장자리로
                        삐져나오면 지붕 밑에서 꽃이 자란 것이 됩니다 */
function scatterBlooms(m, patches) {
  const g = m.ground.getContext('2d');
  /* 여섯 색. 다섯 이하면 무더기마다 같은 배색이 되고, 더 늘리면
     잔디 위에서 색점 노이즈가 됩니다. */
  const PETAL = ['#F4F7FA', '#F2D35C', '#E0708A', '#FF8E6E', '#C79BE0', '#F6B8D0'];
  const covered = (x, y) => m.props.some((q) => {
    const d = PROP[q.kind];
    return d && x >= q.x && x < q.x + d.w && y >= q.y && y < q.y + d.h;
  });
  for (const [cx, cy, r, seed] of patches) {
    for (let y = Math.max(0, cy - r); y <= Math.min(m.h - 1, cy + r); y++)
      for (let x = Math.max(0, cx - r); x <= Math.min(m.w - 1, cx + r); x++) {
        const i = at(m, x, y);
        if (m.over[i] || m.surf[i] || covered(x, y)) continue;
        /* 가운데에서 멀어질수록 필 확률이 떨어집니다 — 그래야 무더기의
           테두리가 원이 아니라 흩어진 가장자리가 됩니다. */
        const far = Math.hypot(x - cx, y - cy) / (r + 0.6);
        if (rnd(x, y, seed) < far * 0.85 + 0.16) continue;
        const n = 2 + Math.floor(rnd(x, y, seed + 7) * 3);
        for (let k = 0; k < n; k++) {
          const fx = x * TS + 2 + Math.floor(rnd(x * 3 + k, y, seed + 11) * 12);
          const fy = y * TS + 3 + Math.floor(rnd(x, y * 3 + k, seed + 13) * 11);
          const col = PETAL[Math.floor(rnd(x + k, y + k, seed + 17) * PETAL.length)];
          px(g, fx + 1, fy + 2, 1, 3, '#3E7A3D');            // 줄기
          px(g, fx, fy + 3, 1, 1, '#4C8C46');                // 잎 한 장
          px(g, fx, fy, 3, 2, col);                          // 꽃잎
          px(g, fx + 1, fy - 1, 1, 1, col);
          px(g, fx, fy, 2, 1, 'rgba(255,255,255,.42)');      // 윗면 빛
          px(g, fx + 1, fy + 1, 1, 1, 'rgba(90,60,20,.45)'); // 꽃심
        }
      }
  }
}
/* ---- 육상 트랙 ----
   레인 선이 없으면 붉은 도넛입니다. 선이 트랙을 트랙으로 만듭니다. */
function paintTrack(wTiles, hTiles) {
  const c = canvasOf(wTiles, hTiles), g = c.getContext('2d');
  const W = c.width, H = c.height, cx = W / 2, cy = H / 2;
  const RX = W / 2 - 5, RY = H / 2 - 5;
  const ell = (rx, ry, col) => {
    g.fillStyle = col;
    for (let y = -Math.ceil(ry); y <= Math.ceil(ry); y++) {
      const w = Math.floor(rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry))));
      if (w > 0) g.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2 + 1, 1);
    }
  };
  ell(RX + 3, RY + 3, '#7E8C6A');                 // 바깥 연석
  ell(RX, RY, '#BF563C');                          // 우레탄
  /* 레인 — 안쪽으로 네 줄. 흰 타원을 그리고 한 겹 안을 다시 덮어 선만 남깁니다. */
  for (let k = 0; k < 4; k++) {
    const rx = RX - 5 - k * 7, ry = RY - 4 - k * 6;
    ell(rx, ry, '#F0E7D8');
    ell(rx - 1, ry - 1, k % 2 ? '#B44F36' : '#BF563C');
  }
  const IX = RX - 32, IY = RY - 26;
  ell(IX + 2, IY + 2, '#E8DFCB');                  // 안쪽 연석
  ell(IX, IY, '#57A053');                          // 인필드
  /* 인필드 결 — 잔디깎이 자국. 이게 있으면 운동장이 됩니다. */
  g.globalAlpha = 0.18; g.fillStyle = '#8FD08A';
  for (let x = -IX; x < IX; x += 12) {
    for (let y = -IY; y <= IY; y++) {
      const w = Math.floor(IX * Math.sqrt(Math.max(0, 1 - (y * y) / (IY * IY))));
      if (x > -w && x < w) g.fillRect(Math.round(cx + x), Math.round(cy + y), 6, 1);
    }
  }
  g.globalAlpha = 1;
  /* 출발선 */
  g.fillStyle = '#F0E7D8';
  for (let y = 0; y < 22; y++) g.fillRect(Math.round(cx), Math.round(cy - RY + 5 + y), 2, 1);
  return c;
}

/* ---- 미니게임존 마당 ----
   관문 넷이 마주 보고 서는 안뜰입니다. 가운데 통로를 한 줄 비워 두면
   어디로 걸어 들어가는지가 바닥에서 먼저 읽힙니다 — 상가 거리와 같은
   원리입니다. */
function paintArcadeCourt(wTiles, hTiles, aisleTile, aisleTiles) {
  const c = canvasOf(wTiles, hTiles), g = c.getContext('2d');
  const W = c.width, H = c.height;
  px(g, 0, 0, W, H, '#C6BCA6');
  /* 판석 — 줄눈을 한 줄씩 어긋나게 놓습니다. 맞추면 타일 격자가 보입니다. */
  for (let y = 0; y < H; y += 8) {
    const off = (y / 8) % 2 ? 6 : 0;
    for (let x = -12; x < W; x += 12) {
      const r = rnd(x, y, 71);
      px(g, x + off, y, 11, 7, r > 0.72 ? '#D3CAB5' : r < 0.2 ? '#B7AD97' : '#CBC2AC');
    }
  }
  g.fillStyle = 'rgba(120,110,92,.35)';
  for (let y = 7; y < H; y += 8) g.fillRect(0, y, W, 1);

  /* 문으로 가는 통로 — 코랄 실선 둘로 폭을 표시합니다. 자리를 밖에서
     받는 이유는 이 선이 곧 "문은 여기" 이기 때문입니다. 마당 한가운데에
     그으면 문과 어긋나고, 그러면 선이 아무 데도 안내하지 않습니다. */
  const aisle = aisleTile * TS, aw = aisleTiles * TS;
  px(g, aisle, 0, aw, H, 'rgba(255,107,82,.10)');
  px(g, aisle, 0, 2, H, 'rgba(255,107,82,.55)');
  px(g, aisle + aw - 2, 0, 2, H, 'rgba(255,107,82,.55)');

  /* 모서리를 45도로 깎고 연석을 두릅니다 */
  const CUT = 22;
  g.globalCompositeOperation = 'destination-out';
  g.fillStyle = '#000';
  for (let k = 0; k < CUT; k++) {
    const w = CUT - k;
    g.fillRect(0, k, w, 1);         g.fillRect(W - w, k, w, 1);
    g.fillRect(0, H - 1 - k, w, 1); g.fillRect(W - w, H - 1 - k, w, 1);
  }
  g.globalCompositeOperation = 'source-over';
  for (let y = 0; y < H; y++) {
    const ins = y < CUT ? CUT - y : y >= H - CUT ? CUT - (H - 1 - y) : 0;
    px(g, ins, y, 2, 1, '#8E8471');
    px(g, W - ins - 2, y, 2, 1, '#8E8471');
  }
  for (let x = CUT; x < W - CUT; x++) {
    px(g, x, 0, 1, 2, '#8E8471');
    px(g, x, H - 2, 1, 2, '#8E8471');
  }
  return c;
}

function paintGrove(wTiles, hTiles, seed) {
  /* 걷는 쪽으로 두 칸 넘겨 그립니다. 잎이 잔디 위로 늘어져야 숲이
     **자란** 것으로 보입니다 — 딱 맞게 자르면 초록 카펫을 깐 꼴입니다.
     지도 밖으로 넘친 쪽은 어차피 잘려 나갑니다. */
  const PAD = 2;
  const c = canvasOf(wTiles + PAD * 2, hTiles + PAD * 2), g = c.getContext('2d');
  const W = c.width, H = c.height, m = PAD * TS;

  /* 그늘진 바닥. 네 변을 모두 흔들어야 직선이 안 남습니다. */
  const img = g.createImageData(W, H), a = img.data;
  const mask = new Uint8Array(W * H);
  const tone = ['#37603D', '#43714A', '#2C5335'].map(hexRGB);
  const top = [], bot = [];
  for (let x = 0; x < W; x++) {
    top[x] = m - 6 + Math.round(rnd(x, 3, seed) * 11);
    bot[x] = H - m + 6 - Math.round(rnd(x, 91, seed) * 11);
  }
  for (let y = 0; y < H; y++) {
    const l = Math.max(0, m - 6 + Math.round(rnd(7, y, seed) * 11));
    const r = Math.min(W, W - m + 6 - Math.round(rnd(77, y, seed) * 11));
    for (let x = l; x < r; x++) {
      if (y < top[x] || y >= bot[x]) continue;
      const v = rnd(x, y, seed + 5);
      const t = tone[v > 0.76 ? 1 : v < 0.2 ? 2 : 0];
      const k = (y * W + x) * 4;
      a[k] = t[0]; a[k + 1] = t[1]; a[k + 2] = t[2]; a[k + 3] = 255;
      mask[y * W + x] = 1;
    }
  }
  g.putImageData(img, 0, 0);

  /* 나무는 격자를 어긋나게 심습니다. 줄이 맞으면 과수원이 됩니다. */
  const trees = [];
  for (let ty = 2; ty < H; ty += 10)
    for (let tx = 2; tx < W; tx += 10) {
      const x = tx + Math.round(rnd(tx, ty, seed) * 7);
      const y = ty + Math.round(rnd(tx, ty, seed + 7) * 7);
      if (x >= W || y >= H || !mask[y * W + x]) continue;   // 그늘 밖에는 안 심습니다
      trees.push({ x, y, r: rnd(tx, ty, seed + 13) });
    }
  trees.sort((u, v) => u.y - v.y);
  for (const t of trees) treeBlob(g, t.x, t.y, t.r);

  /* 덤불 — 숲 가장자리의 아랫도리. 나무만 있으면 발밑이 비어 보입니다. */
  for (let y = 3; y < H; y += 7) for (let x = 3; x < W; x += 7) {
    if (rnd(x, y, seed + 21) < 0.55) continue;
    const bx = x + Math.round(rnd(x, y, seed + 22) * 5);
    const by = y + Math.round(rnd(x, y, seed + 23) * 5);
    if (bx >= W || by >= H || !mask[by * W + bx]) continue;
    bushBlob(g, bx, by, 3 + Math.round(rnd(x, y, seed + 24) * 2));
  }
  return c;
}

     화단은 1×2 라 벤치(2칸)와 붙여 세 칸 한 덩어리가 됩니다. */
  prop(m, 'planter', 15, 19); prop(m, 'planter', 30, 19);

  /* 가로등 넷. 여섯이면 광장이 주차장이 되고, 가로등 자리가 곧 사람이
     서는 자리라 서로 가립니다. */
  [[15, 16], [30, 16], [15, 24], [30, 24]].forEach(([x, y]) => prop(m, 'lamp', x, y));

  /* 기물은 최소로. 자판기 하나, 쓰레기통 둘. 그것도 길 한복판이 아니라
     길가 잔디에 붙입니다 — 실제 캠퍼스가 그렇습니다. */
  /* 자판기와 쓰레기통은 뺐습니다. 광장은 사람이 모이는 곳이고, 모이는
     자리에 물건을 두면 서로를 가립니다. 필요해지면 건물 안에 둡니다. */
  /* 쓰레기통만 둘 되돌립니다 — 벤치가 생겼기 때문입니다. 앉는 자리
     옆에 버릴 데가 없는 것이 오히려 눈에 걸립니다. 벤치 바깥쪽 끝에
     한 칸씩 붙여 길에서 비켜 세웁니다. */
  prop(m, 'bin', 18, 19); prop(m, 'bin', 27, 19);

  /* ================= 모서리 넷 ================= */

  /* 북서 — 운동장. 매트 둘은 뺐습니다. "곧 뭐가 붙어서가 아니라 트랙만
     있으면 비어 보여서" 놓은 것이었는데, 그 자리에 이제 진짜 할 것이
     들어갑니다 — 자리를 채우려고 놓은 그림은 진짜가 오면 비켜야 합니다.

     운동장에서 하는 것 둘(거북목 러너 · 달리기 시합)을 **인필드**로
     옮깁니다. 전에는 남쪽 큰길(y13) 위에 서 있어서, 운동장 게임인데

     트랙 한 바퀴 도는 길을 막지도 않습니다.
     자리는 MINIGAMES 가 들고 있습니다. */
  placeMinigames(m, 'campus');
  /* 출발선 옆 벤치 하나. 달리기를 기다리는 사람이 서 있을 자리입니다 —
     운동장에 앉을 데가 없으면 뛰는 사람 말고는 있을 이유가 없습니다.
     산책로는 세 줄(y13~15)이고 벤치가 막는 것은 가운데 줄 두 칸뿐이라,
     그 앞뒤로 계속 지나갑니다. 출발 관문(x7~9)에서 두 칸 떨어뜨립니다. */
  prop(m, 'bench', 12, 13);
  /* 깃대. 운동장은 넓고 평평해서 **세로로 선 것**이 하나는 있어야
     어디가 끝인지 읽힙니다. 트랙 동쪽 끝(x15)에 세워 산책로에서
     운동장으로 꺾이는 목을 표시합니다. 막는 것은 밑동 한 칸(15,15)뿐이라
     세 줄짜리 산책로의 윗줄·가운뎃줄이 그대로 뚫려 있습니다. */
  prop(m, 'flagPole', 15, 13);

  /* 북동 — 미니게임관 앞마당. 관문 넷과 게시판은 전부 건물 안으로
     들어갔습니다(ZONES.arcade). 마당에 흩어져 있으면 넷을 다 보려고
     마당을 한 바퀴 돌아야 하고, 비 오는 날에도 밖에 서 있어야 합니다.
     여기 남는 것은 문으로 가는 통로와 그 양옆 화단뿐입니다. */
  prop(m, 'planter', 33, 11); prop(m, 'planter', 42, 11);

  /* 남서 — 호수. 세션과 세션 사이에 아무것도 안 해도 되는 자리가
     하나는 있어야 합니다. 광장은 지나가는 곳이라 머무는 곳이 못 됩니다. */
  /* 해초는 뺐습니다. 물 안에 풀이 서 있으면 사람이 만든 못이 아니라
     내버려 둔 웅덩이가 됩니다 — 이 못의 직선 둘레와도 어긋납니다. */
  /* ---- 호숫가에 앉는 자리 ----
     "머무는 곳" 이라고 적어 두고 정작 앉을 데가 없었습니다. 벤치 둘을
     **못 북쪽 잔디**(y28~29)에 놓아 물을 마주 보게 합니다. 등받이가
     위이니 앉은 사람은 아래 — 물 쪽을 봅니다.

     돌 둘레(x1~10, y30/y39 한 칸) 위에는 못 놓습니다. 둘레가 한 칸이라
     좌면이 그 한 칸을 먹으면 못을 한 바퀴 도는 길이 그 자리에서 끊깁니다.
     낚시터(fishDeck, x5~6)는 사이에 비워 둡니다 — 앉는 자리와 낚는
     자리가 겹치면 둘 중 하나만 됩니다. */
  prop(m, 'bench', 2, 28); prop(m, 'bench', 8, 28);
  /* 부들은 **물 밖**입니다. 물 안에 세우지 않기로 한 판단은 그대로 —
     못은 사람이 쌓은 곧은 못입니다. 다만 물가 잔디에 서는 부들은
     그 못이 공원에 있다는 표시라, 직선 둘레와 다투지 않습니다.
     벤치 사이 빈 잔디에만 세 포기. 밟고 지나갈 수 있습니다(solid 0). */
  prop(m, 'reed', 1, 28); prop(m, 'reed', 7, 28); prop(m, 'reed', 10, 28);

  /* ---- 남동 — 동아리 거리 ----
     천막 셋이 서 있는데 여는 것이 하나도 없었습니다. 지도에 이름이 있고
     (미니맵 9번) 가 보면 할 일이 없는 자리는, 이 월드에서 가장 나쁜
     자리입니다 — 한 번 속으면 다시 안 옵니다.

     그래서 여기를 **시장**으로 만듭니다. 상점을 새 건물에 넣지 않은
     이유는 미니게임 때와 같습니다: 이미 서 있는 자리를 먼저 씁니다.
     그리고 가게는 문을 열고 들어가는 곳이 아니라 **길에서 보이는 곳**이
     맞습니다 — 셋이 한눈에 서 있고 천 색으로 구별되면, "빨간 게 옷" 을
     설명 없이 한 번에 배웁니다. 건물이면 문을 열기 전엔 아무것도
     모릅니다.

     천 색은 이미 서로 다르게 칠해 둔 것을 그대로 씁니다(tentCanvas).
       빨강 tentA — 옷      · 파랑 tentB — 가구 · 노랑 tentC — 안내 */
  /* 가게 셋은 이제 **건물 안**입니다(ZONES.clubshop). 천막은 그 앞마당에
     남습니다 — 여는 것은 없고, 가게 앞에 장이 선 거리라는 표시입니다.
     문으로 가는 길(x38~40)은 비워 둡니다. */
  prop(m, 'tentA', 33, 34); prop(m, 'tentC', 43, 34);
  /* 바닥은 이미 깔려 있습니다(위 fillOver 의 M.GRAY 두 줄). floorGlow 는
     여기서 못 씁니다 — 그건 방 안 바닥 그림(m.floor)에 붓는 것이고
     캠퍼스는 타일 지도라 m.floor 자체가 없습니다. */
  prop(m, 'board', 36, 37); prop(m, 'board', 41, 37);
  /* ---- 거리에 앉는 자리 ----
     장이 선 거리에는 앉을 데가 있습니다. 게시판 바로 아래에 벤치를
     붙여 "판 읽고 앉는 자리" 한 덩어리로 만듭니다 — 따로 세우면 거리
     한복판에 벤치 둘이 떠 있습니다.
     문으로 가는 길(x38~40)은 그대로 비웁니다. 좌면이 막는 것은
     x36,37 과 x41,42 의 y40 뿐이고 그 사이 세 칸이 통째로 뚫려 있습니다. */
  prop(m, 'bench', 36, 39); prop(m, 'bench', 41, 39);
  /* 파라솔 탁자 하나. 벤치가 등받이를 지고 앉는 자리라면 여기는 마주
     앉는 자리입니다 — 장터에 있어야 하는 것은 앉는 자리가 아니라
     같이 앉는 자리입니다. 가게 문(x38~39) 바로 서쪽에 붙여 "가게 앞
     야외석" 으로 읽히게 합니다. 문 앞마당은 x37~40 넉 줄인데 그중
     x37 한 줄만 먹으므로 문으로 드는 길은 세 칸으로 남습니다. */
  prop(m, 'cafeSet', 36, 33);

  /* ---- 들꽃 무더기 일곱 ----
     **길에서 비켜난 잔디에만** 피웁니다. 대로와 앞마당은 사람이 걷는
     자리이고, 걷는 자리에 색점을 뿌리면 어디가 길인지가 흐려집니다.
     여기 적은 일곱은 전부 "가장자리라 지금까지 비어 있던" 잔디입니다 —
     호숫가 · 못 남쪽 · 광장 남쪽 잔디 삼각형 · 기숙사와 미니게임관 사이 ·
     동쪽 잔디 · 산책로 서쪽 · 운동장과 기숙사 사이.
     자리는 반드시 기물·꾸미기가 다 끝난 뒤에 정해야 합니다(covered). */
  scatterBlooms(m, [
    [5, 28, 2, 21],    // 호숫가 — 벤치 둘 사이
    [5, 40, 2, 23],    // 못 남쪽 잔디
    [22, 28, 3, 25],   // 광장 남쪽 잔디 — 학생회관을 도는 두 길 사이
    [30, 11, 2, 27],   // 기숙사와 미니게임관 사이
    [42, 15, 2, 29],   // 동쪽 잔디 — 도서관 위
    [10, 11, 2, 31],   // 산책로 서쪽
    [16, 6, 1, 35],    // 운동장과 기숙사 사이 좁은 잔디
  ]);

  m.spawn = { x: 22, y: 25 };
}

/* ================== 도서관 ==================
   3칸 긴 책상 위아래에 의자를 붙여 6인석. 책상 사이 통로는 3칸이라
   뒤에 사람이 앉아 있어도 지나갈 수 있습니다. */
{
  const m = makeMap(38, 28, F.beige);
  ZONES.library = m; m.name = '도서관'; m.sub = '백색소음 · 오래 앉는 자리';

  ring(m, 0, 0, m.w, m.h, F.brickR);
  fillBase(m, 1, 1, m.w - 2, 2, F.brickR);
  m.floor = paintFloor(m.w, m.h, 'parquet'); m.floorKind = SURF.WOOD;
  floorInlay(m.floor, 1, 3, m.w - 2, m.h - 5, 'border');
  floorInlay(m.floor, 17, 3, 4, m.h - 5, 'runner');   // 가운데 통로

  /* 벽면 책장은 손으로 그린 벽에 이미 들어 있습니다 (dressRoom).
     타일 책장을 또 세우면 두 겹이 되어 벽이 두꺼워 보입니다. */

  /* ---- 배치 규칙 (DESIGN.md §배치) ----
     벽면 기물은 벽에 붙이고 같은 런은 밀착, 주 통로 3칸 이상, 좌석
     단위 사이 여백 1칸, 입구 앞 3×3 비움. 카날라베 도서관 1F 를 16px
     격자로 실측해 얻은 문법입니다 — 벽면은 채우고 한가운데는 비운다. */

  /* 북쪽 서가 — 런 둘, 같은 런은 밀착. 여섯 개가 1칸씩 떨어져 있었는데
     그건 책장이 아니라 책장 여섯 개입니다. */
  [2, 5].forEach((x) => prop(m, 'stack', x, 4));
  [30, 33].forEach((x) => prop(m, 'stack', x, 4));

  /* 열람석 — 책상 위아래에 의자를 붙여 마주 앉습니다. **두 줄.**
     세 줄이었을 때 의자·책상이 127기물 중 109개 — 도서관이 아니라
     의자 창고였습니다. 줄 사이는 3칸(주 통로) 비웁니다.

     뒷줄은 6칸 **긴 공용 열람대** 둘, 앞줄은 3칸 책상 넷입니다.
     예전에는 3칸 책상 여덟 장이 전부였는데, 같은 판이 여덟 번 서면
     열람실이 아니라 책상 창고입니다. 자리 수는 그대로 48 입니다 —
     3칸 책상 둘(6+6)을 6칸 한 장(6+6)으로 바꿔 놓았을 뿐이라,
     세션이 시작되는 자리는 한 칸도 안 줄었습니다.

     의자는 한 열람대 안에서 **두 모양씩 섞습니다.** 색만 넷이던 시절엔
     한 줄이 통째로 같은 도장이었고, 그게 "다 똑같다"의 정체였습니다.
     섞는 것은 색이 아니라 등받이 높이입니다 — 16px 에서 먼저 보이는
     것이 그것입니다. */
  const table6 = (bx, by) => {
    for (let i = 0; i < 6; i++) prop(m, i % 2 ? 'chairC' : 'readChair', bx + i, by);
    prop(m, 'tableStudy', bx, by + 1);
    prop(m, 'deskLamp', bx + 1, by + 1);
    prop(m, 'deskLamp', bx + 4, by + 1);
    for (let i = 0; i < 6; i++) prop(m, i % 2 ? 'readChair' : 'chair', bx + i, by + 2);
  };
  /* 앞줄 넷도 판이 하나면 넷이 같은 도장입니다. 하나 걸러 호두나무
     열람대(3칸)를 섞습니다 — 뒷줄 긴 열람대와 같은 판이라, 방에 나무가
     두 종류 있는 것이지 책상이 네 종류 있는 것이 아닙니다. */
  const table3 = (bx, by, kind, back, front) => {
    for (let i = 0; i < 3; i++) prop(m, back[i], bx + i, by);
    prop(m, kind, bx, by + 1);
    prop(m, 'deskLamp', bx + 2, by + 1);
    for (let i = 0; i < 3; i++) prop(m, front[i], bx + i, by + 2);
  };
  const LONG = [3, 24], TABLES = [3, 9, 24, 30];
  LONG.forEach((bx) => table6(bx, 8));
  table3(3, 14, 'desk3', ['chairC', 'readChair', 'chairC'], ['chair', 'chairD', 'chair']);
  table3(9, 14, 'tableStudy3', ['readChair', 'chairC', 'readChair'], ['chairD', 'chair', 'chairD']);
  table3(24, 14, 'desk3', ['chairC', 'readChair', 'chairC'], ['chair', 'chairD', 'chair']);
  table3(30, 14, 'tableStudy3', ['readChair', 'chairC', 'readChair'], ['chairD', 'chair', 'chairD']);
  /* 빛웅덩이는 **책상 가운데**입니다. 램프가 오른쪽 끝(bx+2)에 서 있다고
     빛도 거기 두면, 세 자리 중 오른쪽 하나만 밝고 왼쪽 둘은 어둡습니다 -
     여섯 명이 앉는 열람대에서 그건 등이 치우친 것으로 보입니다.
     책상은 bx~bx+2 세 칸이므로 가운데는 bx+1.5(칸 중앙 기준).
     긴 열람대는 여섯 칸이라 가운데가 bx+3 이고, 한 웅덩이로 덮기엔
     너무 길어서 램프 둘 밑에 하나씩 놓습니다. */
  TABLES.forEach((bx) => floorGlow(m.floor, bx + 1.5, 15.5, 3.2));
  LONG.forEach((bx) => { floorGlow(m.floor, bx + 1.5, 9.5, 3.2); floorGlow(m.floor, bx + 4.5, 9.5, 3.2); });

  /* 가운데 — 캐럴 여섯. 11칸이 통째로 비어 화면 절반이 빈 바닥이었던
     자리입니다. 러너(x17~20)가 주 통로로 남고, 캐럴이 양옆에서 러너를
     등집니다. 열람석이 같이 앉는 자리면 캐럴은 혼자 버티는 자리 —
     좌석에 위계가 생깁니다. */
  /* 캐럴 의자도 줄마다 갈아 답니다 — 여섯 개가 한 줄로 서는 자리라
     여기가 같은 도장이면 가운데 통로가 통째로 반복 무늬가 됩니다. */
  for (const [k, cy] of [7, 11, 15].entries()) {
    prop(m, 'carrel', 14, cy); prop(m, k % 2 ? 'chair' : 'readChair', 14, cy + 2);
    prop(m, 'carrel', 21, cy); prop(m, k % 2 ? 'readChair' : 'chairC', 22, cy + 2);
    floorGlow(m.floor, 15, cy + 1.4, 2.2);
    floorGlow(m.floor, 22, cy + 1.4, 2.2);
  }

  /* ---- 오른쪽 원탁 자리 ----
     뒷줄을 긴 열람대로 묶으면서 x30~36 · y7~11 이 통째로 빈 마루가
     됐습니다. 열람대를 하나 더 세워 메우면 다시 책상 창고가 되므로,
     여기는 **다르게 앉는 자리**로 씁니다 — 둥근 탁자에 안락의자 둘과
     스툴 둘. 네모난 판이 방을 가득 채운 뒤에 원이 하나 있으면 그
     원이 곧 "여기는 쉬는 자리" 라는 말이 됩니다.

     자리 넷은 **늘어난 것**입니다(48+6 → 58). 세션은 앉는 자리에서
     시작하므로 줄이면 안 되지만 느는 것은 막을 이유가 없고, 탁자만
     놓고 의자를 안 두면 아무도 못 앉는 탁자가 하나 서 있게 됩니다. */
  floorInlay(m.floor, 30, 6, 6, 6, 'rug');

  dressRoom(m, IPAL.library, [

  placeMinigames(m, 'library');

     북쪽(22,20)에 세워 봤더니 가로대 **바깥**이라, 창구를 등지고 복도에

  m.npcs.push(
    { x: 23, y: 22, sprite: 347, species: '백조', dir: 'down',

      name: '사서 · 하람',

        '일어나도 안 멈춰. 코인은 세션 끝낼 때 한 번에 — 앉은 시간이 아니라 판정이 돌아간 시간만큼.',

/* ================== 본관 ==================
   강의실. 칠판을 향해 줄지어 앉습니다. 가운데 통로 2칸을 비웁니다. */
{
  const m = makeMap(38, 28, F.gray);
  ZONES.mainhall = m; m.name = '본관'; m.sub = '대중음악 · 끊어 앉는 자리';

  floorInlay(m.floor, 1, 3, m.w - 2, m.h - 5, 'border');

  prop(m, 'desk3', 17, 5); prop(m, 'laptopN', 18, 5);


  /* 강의실 — 2칸 책상 하나에 의자 둘. 도서관과 같은 규칙이고

     예전에는 c===2 만 건너뛰어 책상이 x7–26 에 몰리고 오른쪽 열 칸이
     통째로 비었습니다. 강의실이 한쪽으로 쏠려 보이던 이유입니다.
     지금은 통로(x16–21)를 **가운데 두고 좌우 셋씩** 세웁니다. */
  const SEAT_X = [4, 9, 14, 22, 27, 32], SEAT_Y = [10, 15, 20];
  /* 열여덟 자리가 전부 같은 2칸 판에 같은 의자 둘이었습니다. 강의실은
     같은 것을 줄 세우는 방이 맞지만, 그렇다고 열여덟 번 같은 도장을
     찍으면 자리가 아니라 무늬가 됩니다.

     그래서 **줄마다 · 열 짝마다** 갈아 답니다. 규칙은 둘입니다.
       · 좌우 대칭을 안 깹니다. 이 방의 축은 칠판이고 짝은 x ↔ 37-x 라,

     책상도 줄마다 갈립니다 — 가운데 줄만 책 칸이 뚫린 판입니다. */
  const SEATS = [
    [['officeChair', 'chair'], ['chair', 'chairC'], ['chairC', 'officeChair']],
    [['chairD', 'officeChair'], ['officeChair', 'chair'], ['chair', 'chairD']],
    [['chair', 'chairB'], ['chairB', 'officeChair'], ['officeChair', 'chairC']],

  SEAT_Y.forEach((y, r) => SEAT_X.forEach((x, i) => {

    const [a, b] = SEATS[r][pair];
    prop(m, r === 1 ? 'deskShelf' : 'desk2', x, y);
    prop(m, right ? b : a, x, y + 1);

  /* 책(books2)은 월드 전체에서 뺐습니다. */

     14칸이면 여백 1 · 사이 3 · 사이 3 · 여백 1 로 떨어집니다.

     좌우 짝은 칸 x ↔ 37-x 입니다. 왼쪽이 x3~16 이므로 오른쪽은 x21~34.

  for (const y of SEAT_Y) {
    floorInlay(m.floor, 3, y - 1, 14, 4, 'rug');
    floorInlay(m.floor, 21, y - 1, 14, 4, 'rug');
    for (const x of SEAT_X) floorGlow(m.floor, x + 1, y + 1.5, 2.2);

  /* 교탁 위 조명 — **책상 한가운데**입니다. desk3 는 세 칸이므로 x+1.5 가
     가운데이고, 뒷줄 라운지도 같은 규칙을 씁니다(12 → 13.5).

  floorGlow(m.floor, 18.5, 6, 5);

  dressRoom(m, IPAL.mainhall, [
    { k: 'win', x: 2, style: 'tall' }, { k: 'banner', x: 5, c: '#3C5C82' },
    { k: 'win', x: 8, style: 'tall' }, { k: 'board', x: 12 },
    { k: 'clock', x: 17 },
    { k: 'art', x: 19, pic: 'chart' },
    /* 오른쪽 칠판은 x23 이었는데, 칠판이 픽셀 기준 366~418 이고 그 옆
