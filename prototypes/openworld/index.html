/* ==================================================================
   실내 바닥

   타일 한 장을 반복하면 격자가 눈에 띄고, 넓은 방일수록 심해집니다.
   방 전체를 한 장에 그리면 널판 이음새를 어긋나게 놓고, 통로를 다른
   재질로 깔고, 걸레받이 그림자까지 넣을 수 있습니다.
   ================================================================== */
function paintFloor(w, h, kind, P) {
  const c = canvasOf(w, h), g = c.getContext('2d');
  const W = c.width, H = c.height;

  if (kind === 'parquet') {
    /* 마루 — 도서관. 널판을 줄마다 어긋나게 깝니다. */
    px(g, 0, 0, W, H, '#C9A87C');
    for (let y = 0; y < H; y += 8) {
      const off = (y / 8 % 2) * 24;
      for (let x = -24; x < W; x += 48) {
        const n = rnd(x, y, 3);
        px(g, x + off, y, 47, 7, n < 0.33 ? '#C49A6C' : n < 0.66 ? '#CFA87E' : '#BC8F62');
        px(g, x + off, y, 47, 1, 'rgba(255,255,255,.12)');
        px(g, x + off + 46, y, 1, 7, 'rgba(0,0,0,.14)');
      }
      px(g, 0, y + 7, W, 1, 'rgba(0,0,0,.13)');
    }
  } else if (kind === 'stone') {
    /* 석재 — 본관. 큰 판을 줄눈으로 나눕니다. */
    px(g, 0, 0, W, H, '#B9BEC6');
    for (let y = 0; y < H; y += 24) for (let x = 0; x < W; x += 24) {
      const n = rnd(x, y, 7);
      px(g, x, y, 23, 23, n < 0.3 ? '#C2C7CE' : n < 0.7 ? '#B4B9C2' : '#BDC2C9');
      px(g, x, y, 23, 1, 'rgba(255,255,255,.16)');
      px(g, x, y, 1, 23, 'rgba(255,255,255,.12)');
      px(g, x + 23, y, 1, 24, 'rgba(0,0,0,.13)');
      px(g, x, y + 23, 24, 1, 'rgba(0,0,0,.13)');
      /* 반점 — 화강암 느낌 */
      g.fillStyle = 'rgba(90,100,115,.22)';
      for (let s = 0; s < 5; s++)
        g.fillRect(x + 3 + Math.floor(rnd(x + s, y, 11) * 17),
                   y + 3 + Math.floor(rnd(x, y + s, 13) * 17), 1, 1);
    }
  } else if (kind === 'laminate') {
    /* 장판 — 기숙사. 따뜻하고 이음새가 촘촘합니다. */
    px(g, 0, 0, W, H, '#DBC49E');
    for (let y = 0; y < H; y += 11) {
      const n = rnd(0, y, 5);
      px(g, 0, y, W, 10, n < 0.4 ? '#DCC6A2' : n < 0.75 ? '#D6BE99' : '#E0CBA6');
      px(g, 0, y, W, 1, 'rgba(255,255,255,.14)');
      px(g, 0, y + 10, W, 1, 'rgba(0,0,0,.07)');
      /* 나뭇결 — 촘촘하면 줄무늬가 되고 성글면 나무가 됩니다 */
      g.fillStyle = 'rgba(150,120,80,.11)';
      for (let x = 0; x < W; x += 19)
        g.fillRect(x + ((y / 11) % 2 ? 9 : 0), y + 4, 11, 1);
    }
  } else {
    /* 타일 — 학생회관. 반들거리는 대형 타일. */
    px(g, 0, 0, W, H, '#DDE3E6');
    for (let y = 0; y < H; y += 16) for (let x = 0; x < W; x += 16) {
      const n = rnd(x, y, 9);
      px(g, x, y, 15, 15, n < 0.5 ? '#E2E8EA' : '#D8DEE2');
      px(g, x, y, 15, 1, 'rgba(255,255,255,.5)');
      px(g, x, y, 1, 15, 'rgba(255,255,255,.35)');
      px(g, x + 15, y, 1, 16, 'rgba(120,132,140,.3)');
      px(g, x, y + 15, 16, 1, 'rgba(120,132,140,.3)');
    }
  }

  /* 벽에서 떨어지는 그림자. 바닥과 벽이 만나는 자리가 어두워야
     방이 닫힌 상자로 보입니다. */
  const grad = g.createLinearGradient(0, T * 3, 0, T * 3 + 14);
  grad.addColorStop(0, 'rgba(0,0,0,.30)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad; g.fillRect(0, T * 3, W, 14);
  const gl = g.createLinearGradient(T, 0, T + 10, 0);
  gl.addColorStop(0, 'rgba(0,0,0,.22)'); gl.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gl; g.fillRect(T, T * 3, 10, H - T * 3);
  const gr = g.createLinearGradient(W - T, 0, W - T - 10, 0);
  gr.addColorStop(0, 'rgba(0,0,0,.22)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(W - T - 10, T * 3, 10, H - T * 3);
  return c;
}

/** 통로·러그를 바닥 위에 덧그립니다. 방의 동선을 눈으로 알려 줍니다. */
/** 스탠드 아래 빛웅덩이. 조명이 켜져 있는데 바닥이 그대로면
    스탠드가 장식품으로 보입니다. */
function floorGlow(c, cx, cy, r) {
  const g = c.getContext('2d');
  const X = cx * T, Y = cy * T, R = r * T;
  for (let k = 4; k >= 1; k--) {
    g.fillStyle = 'rgba(255,214,138,' + (0.05 * k) + ')';
    g.beginPath(); g.ellipse(X, Y, R * (k / 4), R * (k / 4) * 0.72, 0, 0, 7); g.fill();
  }
}

function floorInlay(c, x, y, w, h, kind) {
  const g = c.getContext('2d');
  const X = x * T, Y = y * T, W = w * T, H = h * T;
  if (kind === 'border') {
    /* 벽을 따라 도는 테두리 띠. 넓은 방은 이게 없으면 바닥이 아니라
       무늬 종이가 됩니다. */
    px(g, X, Y, W, T, 'rgba(0,0,0,.10)');
    px(g, X, Y + H - T, W, T, 'rgba(0,0,0,.10)');
    px(g, X, Y, T, H, 'rgba(0,0,0,.10)');
    px(g, X + W - T, Y, T, H, 'rgba(0,0,0,.10)');
    px(g, X + T - 2, Y + T - 2, W - T * 2 + 4, 2, 'rgba(255,255,255,.20)');
    px(g, X + T - 2, Y + H - T, W - T * 2 + 4, 2, 'rgba(255,255,255,.20)');
    px(g, X + T - 2, Y + T - 2, 2, H - T * 2 + 4, 'rgba(255,255,255,.20)');
    px(g, X + W - T, Y + T - 2, 2, H - T * 2 + 4, 'rgba(255,255,255,.20)');
    return;
  }
  if (kind === 'runner') {
    px(g, X, Y, W, H, 'rgba(62,141,130,.16)');
    px(g, X, Y, W, 2, 'rgba(255,255,255,.22)');
    px(g, X + W - 2, Y, 2, H, 'rgba(0,0,0,.12)');
    g.fillStyle = 'rgba(62,141,130,.4)';
    g.fillRect(X + 2, Y, 2, H); g.fillRect(X + W - 5, Y, 2, H);
  } else if (kind === 'rug') {
    /* 테두리 두 겹에 안쪽 무늬. 동심 사각을 계속 겹치면 과녁이 됩니다. */
    px(g, X, Y, W, H, '#9A6A57');
    px(g, X + 4, Y + 4, W - 8, H - 8, '#B5866C');
    px(g, X + 7, Y + 7, W - 14, H - 14, '#A87458');
    px(g, X + 11, Y + 11, W - 22, H - 22, '#C39679');
    g.fillStyle = 'rgba(154,106,87,.55)';
    for (let yy = Y + 16; yy < Y + H - 16; yy += 14)
      for (let xx = X + 16; xx < X + W - 16; xx += 14) {
        g.fillRect(xx, yy + 2, 6, 2); g.fillRect(xx + 2, yy, 2, 6);
      }
    /* 술 */
    g.fillStyle = '#D9BCA4';
    for (let xx = X + 2; xx < X + W - 2; xx += 4) {
      g.fillRect(xx, Y - 3, 2, 3); g.fillRect(xx, Y + H, 2, 3);
    }
    px(g, X, Y, W, 2, 'rgba(255,255,255,.12)');
    px(g, X, Y + H - 2, W, 2, 'rgba(0,0,0,.16)');
  }
}

/* ================== 맵 ================== */
function makeMap(w, h, baseTile) {
  return { w, h, base: new Uint16Array(w * h).fill(baseTile),
           over: new Uint8Array(w * h), props: [], portals: [], npcs: [],
           things: [] };
}
const at = (m, x, y) => y * m.w + x;
const inMap = (m, x, y) => x >= 0 && y >= 0 && x < m.w && y < m.h;

function fillBase(m, x, y, w, h, tile) {
  for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++)
    if (inMap(m, i, j)) m.base[at(m, i, j)] = tile;
}
function fillOver(m, x, y, w, h, mat) {
  for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++)
    if (inMap(m, i, j)) m.over[at(m, i, j)] = mat;
}
/** 타원으로 재질을 칠합니다. 사각형으로 칠한 못은 수영장이 됩니다. */
function fillEllipse(m, cx, cy, rx, ry, mat) {
  for (let y = Math.floor(cy - ry); y <= cy + ry; y++)
    for (let x = Math.floor(cx - rx); x <= cx + rx; x++) {
      const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry;
      if (dx * dx + dy * dy <= 1 && inMap(m, x, y)) m.over[at(m, x, y)] = mat;
    }
}
function ring(m, x, y, w, h, tile) {
  for (let i = x; i < x + w; i++) { fillBase(m, i, y, 1, 1, tile); fillBase(m, i, y + h - 1, 1, 1, tile); }
  for (let j = y; j < y + h; j++) { fillBase(m, x, j, 1, 1, tile); fillBase(m, x + w - 1, j, 1, 1, tile); }
}
function prop(m, kind, x, y) { m.props.push({ kind, x, y }); }
function rowOf(m, kind, x, y, n, step = 1) { for (let i = 0; i < n; i++) prop(m, kind, x + i * step, y); }
function rnd(x, y, s = 0) {
  let h = (x * 374761393 + y * 668265263 + s * 2246822519) | 0;
  h = (h ^ (h >>> 13)) * 1274126177;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

/** 건물을 세우고, 문에 포탈과 간판을 같이 답니다. */
function placeBuilding(m, kind, x, y, to, sx, sy, label) {
  const d = PROP[kind];
  prop(m, kind, x, y);
  const dx = x + d.doorX, dy = y + d.h - 1;
  m.portals.push({ x: dx, y: dy, w: 2, h: 1, to, sx, sy, label });
  /* 문 앞 진입로 */
  fillOver(m, dx - 1, dy + 1, 4, 3, M.PLAZA);
}

/* ---- 숲 ----
   맵을 십자로 자르면 잘린 면이 생깁니다. 잔디로 두면 "왜 더 못 가지"가
   되고, 검게 두면 화면이 고장 난 것처럼 보입니다. 나무를 빽빽이 세워
   **여기서 캠퍼스가 끝난다**고 말하게 했습니다. */
function treeBlob(g, x, y, r) {
  const R = r > 0.6 ? 9 : r > 0.28 ? 7 : 6;
  g.fillStyle = 'rgba(0,0,0,.26)';
  g.beginPath(); g.ellipse(x, y, R, Math.max(2, R * 0.4), 0, 0, 7); g.fill();
  px(g, x - 1, y - R, 3, R, '#553A25');
  px(g, x - 1, y - R, 1, R, '#75543A');
  disc(g, x, y - R - 2, R, '#1F4B2C');
  disc(g, x, y - R - 3, R - 1, '#2E6A3C');
  disc(g, x - 2, y - R - 4, Math.max(2, R - 4), '#44884B');
  disc(g, x - 3, y - R - 5, Math.max(1, R - 6), '#5CA35C');
}
function bushBlob(g, x, y, s) {
  disc(g, x, y, s, '#24522F');
  disc(g, x, y - 1, s - 1, '#33703E');
  disc(g, x - 1, y - 2, Math.max(1, s - 3), '#4A8C4F');
}
/* ---- 잔디 ----
   시트의 잔디 타일은 #38CBAB, 청록입니다. 그 위에 나무를 심으면 땅만
   물색이라 숲이 캠퍼스에 붙어 있지 않고 떠 보입니다. 실내 마루처럼
   캠퍼스 바닥도 한 장으로 그립니다 — 16px 격자가 사라지고, 얼룩과
   풀포기를 타일 경계와 상관없이 놓을 수 있습니다. */
function paintLawn(wTiles, hTiles) {
  const c = canvasOf(wTiles, hTiles), g = c.getContext('2d');
  const W = c.width, H = c.height;
  px(g, 0, 0, W, H, '#5B9E52');
  for (let y = 0; y < H; y += 4) for (let x = 0; x < W; x += 4) {
    const r = rnd(x, y, 3);
    if (r > 0.78) px(g, x, y, 4, 3, '#68AC5C');
    else if (r < 0.20) px(g, x, y, 3, 3, '#4F8E49');
  }
  /* 넓은 얼룩 — 잔디가 한 톤이면 장판입니다. 풀포기보다 먼저 깔아야
     포기가 얼룩 위에 서 있는 것으로 보입니다. */
  for (let y = 0; y < H; y += 11) for (let x = 0; x < W; x += 11) {
    if (rnd(x, y, 41) < 0.6) continue;
    const r = 6 + Math.round(rnd(x, y, 42) * 7);
    disc(g, x + Math.round(rnd(x, y, 43) * 10), y + Math.round(rnd(x, y, 44) * 10), r,
         rnd(x, y, 45) > 0.5 ? 'rgba(122,191,102,.30)' : 'rgba(64,124,60,.26)');
  }
  /* 풀포기 — 3px 짜리 V 자. 간격만큼 흔들어야 격자가 안 보입니다:
     7px 격자에 4px 만 흔들었더니 대각선 줄이 그대로 남았습니다. */
  for (let y = 4; y < H - 3; y += 9) for (let x = 3; x < W - 3; x += 9) {
    if (rnd(x, y, 11) < 0.34) continue;
    const bx = x + Math.round(rnd(x, y, 12) * 8), by = y + Math.round(rnd(x, y, 13) * 8);
    if (bx >= W - 2 || by >= H - 3) continue;
    g.fillStyle = rnd(bx, by, 14) > 0.5 ? '#7CBF66' : '#6FB35C';
    const tall = rnd(bx, by, 15) > 0.62 ? 3 : 2;
    g.fillRect(bx, by, 1, tall);
    g.fillRect(bx - 1, by - 1 + (tall > 2 ? 1 : 0), 1, tall - 1);
    g.fillRect(bx + 1, by - 1, 1, tall - 1);
    g.fillStyle = '#46833F'; g.fillRect(bx, by + tall, 1, 1);
  }
  return c;
}
/* ---- 육상 트랙 ----
   레인 선이 없으면 붉은 도넛입니다. 선이 트랙을 트랙으로 만듭니다. */
function paintTrack(wTiles, hTiles) {
  const c = canvasOf(wTiles, hTiles), g = c.getContext('2d');
  const W = c.width, H = c.height, cx = W / 2, cy = H / 2;
  const RX = W / 2 - 5, RY = H / 2 - 5;
  const ell = (rx, ry, col) => {
    g.fillStyle = col;
    for (let y = -Math.ceil(ry); y <= Math.ceil(ry); y++) {
      const w = Math.floor(rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry))));
      if (w > 0) g.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2 + 1, 1);
    }
  };
  ell(RX + 3, RY + 3, '#7E8C6A');                 // 바깥 연석
  ell(RX, RY, '#BF563C');                          // 우레탄
  /* 레인 — 안쪽으로 네 줄. 흰 타원을 그리고 한 겹 안을 다시 덮어 선만 남깁니다. */
  for (let k = 0; k < 4; k++) {
    const rx = RX - 5 - k * 7, ry = RY - 4 - k * 6;
    ell(rx, ry, '#F0E7D8');
    ell(rx - 1, ry - 1, k % 2 ? '#B44F36' : '#BF563C');
  }
  const IX = RX - 32, IY = RY - 26;
  ell(IX + 2, IY + 2, '#E8DFCB');                  // 안쪽 연석
  ell(IX, IY, '#57A053');                          // 인필드
  /* 인필드 결 — 잔디깎이 자국. 이게 있으면 운동장이 됩니다. */
  g.globalAlpha = 0.18; g.fillStyle = '#8FD08A';
  for (let x = -IX; x < IX; x += 12) {
    for (let y = -IY; y <= IY; y++) {
      const w = Math.floor(IX * Math.sqrt(Math.max(0, 1 - (y * y) / (IY * IY))));
      if (x > -w && x < w) g.fillRect(Math.round(cx + x), Math.round(cy + y), 6, 1);
    }
  }
  g.globalAlpha = 1;
  /* 출발선 */
  g.fillStyle = '#F0E7D8';
  for (let y = 0; y < 22; y++) g.fillRect(Math.round(cx), Math.round(cy - RY + 5 + y), 2, 1);
  return c;
}

/* ---- 미니게임존 마당 ----
   관문 넷이 마주 보고 서는 안뜰입니다. 가운데 통로를 한 줄 비워 두면
   어디로 걸어 들어가는지가 바닥에서 먼저 읽힙니다 — 상가 거리와 같은
   원리입니다. */
function paintArcadeCourt(wTiles, hTiles) {
  const c = canvasOf(wTiles, hTiles), g = c.getContext('2d');
  const W = c.width, H = c.height;
  px(g, 0, 0, W, H, '#C6BCA6');
  /* 판석 — 줄눈을 한 줄씩 어긋나게 놓습니다. 맞추면 타일 격자가 보입니다. */
  for (let y = 0; y < H; y += 8) {
    const off = (y / 8) % 2 ? 6 : 0;
    for (let x = -12; x < W; x += 12) {
      const r = rnd(x, y, 71);
      px(g, x + off, y, 11, 7, r > 0.72 ? '#D3CAB5' : r < 0.2 ? '#B7AD97' : '#CBC2AC');
    }
  }
  g.fillStyle = 'rgba(120,110,92,.35)';
  for (let y = 7; y < H; y += 8) g.fillRect(0, y, W, 1);

  /* 가운데 통로 — 코랄 실선 둘로 폭을 표시합니다 */
  const aisle = 5 * T, aw = 3 * T;
  px(g, aisle, 0, aw, H, 'rgba(255,107,82,.10)');
  px(g, aisle, 0, 2, H, 'rgba(255,107,82,.55)');
  px(g, aisle + aw - 2, 0, 2, H, 'rgba(255,107,82,.55)');

  /* 모서리를 45도로 깎고 연석을 두릅니다 */
  const CUT = 22;
  g.globalCompositeOperation = 'destination-out';
  g.fillStyle = '#000';
  for (let k = 0; k < CUT; k++) {
    const w = CUT - k;
    g.fillRect(0, k, w, 1);         g.fillRect(W - w, k, w, 1);
    g.fillRect(0, H - 1 - k, w, 1); g.fillRect(W - w, H - 1 - k, w, 1);
  }
  g.globalCompositeOperation = 'source-over';
  for (let y = 0; y < H; y++) {
    const ins = y < CUT ? CUT - y : y >= H - CUT ? CUT - (H - 1 - y) : 0;
    px(g, ins, y, 2, 1, '#8E8471');
    px(g, W - ins - 2, y, 2, 1, '#8E8471');
  }
  for (let x = CUT; x < W - CUT; x++) {
    px(g, x, 0, 1, 2, '#8E8471');
    px(g, x, H - 2, 1, 2, '#8E8471');
  }
  return c;
}

function paintGrove(wTiles, hTiles, seed) {
  /* 걷는 쪽으로 두 칸 넘겨 그립니다. 잎이 잔디 위로 늘어져야 숲이
     **자란** 것으로 보입니다 — 딱 맞게 자르면 초록 카펫을 깐 꼴입니다.
     지도 밖으로 넘친 쪽은 어차피 잘려 나갑니다. */
  const PAD = 2;
  const c = canvasOf(wTiles + PAD * 2, hTiles + PAD * 2), g = c.getContext('2d');
  const W = c.width, H = c.height, m = PAD * T;

  /* 그늘진 바닥. 네 변을 모두 흔들어야 직선이 안 남습니다. */
  const img = g.createImageData(W, H), a = img.data;
  const mask = new Uint8Array(W * H);
  const tone = ['#37603D', '#43714A', '#2C5335'].map(hexRGB);
  const top = [], bot = [];
  for (let x = 0; x < W; x++) {
    top[x] = m - 6 + Math.round(rnd(x, 3, seed) * 11);
    bot[x] = H - m + 6 - Math.round(rnd(x, 91, seed) * 11);
  }
  for (let y = 0; y < H; y++) {
    const l = Math.max(0, m - 6 + Math.round(rnd(7, y, seed) * 11));
    const r = Math.min(W, W - m + 6 - Math.round(rnd(77, y, seed) * 11));
    for (let x = l; x < r; x++) {
      if (y < top[x] || y >= bot[x]) continue;
      const v = rnd(x, y, seed + 5);
      const t = tone[v > 0.76 ? 1 : v < 0.2 ? 2 : 0];
      const k = (y * W + x) * 4;
      a[k] = t[0]; a[k + 1] = t[1]; a[k + 2] = t[2]; a[k + 3] = 255;
      mask[y * W + x] = 1;
    }
  }
  g.putImageData(img, 0, 0);

  /* 나무는 격자를 어긋나게 심습니다. 줄이 맞으면 과수원이 됩니다. */
  const trees = [];
  for (let ty = 2; ty < H; ty += 10)
    for (let tx = 2; tx < W; tx += 10) {
      const x = tx + Math.round(rnd(tx, ty, seed) * 7);
      const y = ty + Math.round(rnd(tx, ty, seed + 7) * 7);
      if (x >= W || y >= H || !mask[y * W + x]) continue;   // 그늘 밖에는 안 심습니다
      trees.push({ x, y, r: rnd(tx, ty, seed + 13) });
    }
  trees.sort((u, v) => u.y - v.y);
  for (const t of trees) treeBlob(g, t.x, t.y, t.r);

  /* 덤불 — 숲 가장자리의 아랫도리. 나무만 있으면 발밑이 비어 보입니다. */
  for (let y = 3; y < H; y += 7) for (let x = 3; x < W; x += 7) {
    if (rnd(x, y, seed + 21) < 0.55) continue;
    const bx = x + Math.round(rnd(x, y, seed + 22) * 5);
    const by = y + Math.round(rnd(x, y, seed + 23) * 5);
    if (bx >= W || by >= H || !mask[by * W + bx]) continue;
    bushBlob(g, bx, by, 3 + Math.round(rnd(x, y, seed + 24) * 2));
  }
  return c;
}

function bake(m) {
  m.solid = new Uint8Array(m.w * m.h);
  for (let y = 0; y < m.h; y++) for (let x = 0; x < m.w; x++) {
    const b = m.base[at(m, x, y)];
    if (b === F.brickR || b === F.brickO) m.solid[at(m, x, y)] = 1;
    if (m.over[at(m, x, y)] === M.WATER) m.solid[at(m, x, y)] = 1;
  }
  m.sitSpots = [];
  for (const p of m.props) {
    const d = PROP[p.kind];
    for (let j = 0; j < d.h; j++) for (let i = 0; i < d.w; i++) {
      if (!inMap(m, p.x + i, p.y + j)) continue;
      if (d.c[j][i]) m.solid[at(m, p.x + i, p.y + j)] = 1;
    }
    if (d.sit) m.sitSpots.push({ x: p.x, y: p.y });
  }
  for (const n of m.npcs) m.solid[at(m, n.x, n.y)] = 1;
  for (const po of m.portals)
    for (let j = 0; j < po.h; j++) for (let i = 0; i < po.w; i++)
      if (inMap(m, po.x + i, po.y + j)) m.solid[at(m, po.x + i, po.y + j)] = 0;
}
Object.values(ZONES).forEach(bake);

/* ==================================================================
   학교 색

   학교마다 쓰는 색이 어두운 남색부터 형광까지 제각각입니다. 그대로
   화면에 얹으면 어떤 학교는 검은 얼룩이 되고 어떤 학교는 눈이 아픕니다.
   그래서 **색상과 채도는 그대로 두고 명도만** 30~55% 로 끌어옵니다.
   그 구간이 흰 UI 위에서도, 잔디 위 16px 캐릭터에서도 둘 다 읽힙니다.

   색을 쓰는 곳은 넷뿐입니다 — 과잠, 이름표 바탕, 마이페이지 강조,
   기숙사 소품 둘. 배경·버튼·글자는 무채색으로 둡니다. 학교 색이 화면
   전체를 물들이면 열 학교가 열 개의 다른 앱이 됩니다.

   아래 색값은 각 학교가 널리 쓰는 대표색을 눈으로 맞춘 **근삿값**입니다.
   실제 브랜드 가이드의 값으로 바꿔야 합니다.
   ================================================================== */
const SCHOOLS = [
  { name: '서울대학교',     domain: 'snu.ac.kr',     raw: '#00468B' },
  { name: '연세대학교',     domain: 'yonsei.ac.kr',  raw: '#0F4C81' },
  { name: '고려대학교',     domain: 'korea.ac.kr',   raw: '#862633' },
  { name: '성균관대학교',   domain: 'skku.edu',      raw: '#00563F' },
  { name: '한양대학교',     domain: 'hanyang.ac.kr', raw: '#0E4A84' },
  { name: '중앙대학교',     domain: 'cau.ac.kr',     raw: '#0B4DA2' },
  { name: '경희대학교',     domain: 'khu.ac.kr',     raw: '#8C1D40' },
  { name: '이화여자대학교', domain: 'ewha.ac.kr',    raw: '#00713C' },
  { name: '서강대학교',     domain: 'sogang.ac.kr',  raw: '#8B0029' },
  { name: '명지대학교',     domain: 'mju.ac.kr',     raw: '#003A70' },
];

function hexToHsl(hex) {
  const [r, g, b] = hexRGB(hex).map((v) => v / 255);
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  const l = (mx + mn) / 2;
  if (!d) return [0, 0, l];
  const s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
  const h = mx === r ? ((g - b) / d + (g < b ? 6 : 0))
          : mx === g ? (b - r) / d + 2
          : (r - g) / d + 4;
  return [h / 6, s, l];
}
function hslToHex(h, s, l) {
  const f = (n) => {
    const k = (n + h * 12) % 12;
    const a = s * Math.min(l, 1 - l);
    const v = l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
    return Math.round(v * 255).toString(16).padStart(2, '0');
  };
  return '#' + f(0) + f(8) + f(4);
}
/** 명도만 30~55% 구간으로 끌어옵니다. 색상·채도는 그 학교 것 그대로. */
function normalizeSchoolColor(hex) {
  const [h, s, l] = hexToHsl(hex);
  return hslToHex(h, s, Math.min(0.55, Math.max(0.30, l)));
}
SCHOOLS.forEach((s) => { s.color = normalizeSchoolColor(s.raw); });

const SCHOOL_BY_NAME = Object.fromEntries(SCHOOLS.map((s) => [s.name, s]));
/* 도메인 → 학교. 없으면 도메인을 그대로 보여 주고 "(미확인)" 을 붙입니다 —
   없는 학교를 지어내지 않습니다. */
const SCHOOL_BY_DOMAIN = Object.fromEntries(SCHOOLS.map((s) => [s.domain, s.name]));

const DEFAULT_SCHOOL_COLOR = '#5A6472';    // 미확인 학교 — 무채색에 가깝게
function schoolColorOf(name) {
  return (SCHOOL_BY_NAME[name] || {}).color || DEFAULT_SCHOOL_COLOR;
}
/** 내 색 — 과잠 · 이름표 · 마이페이지. 남의 방에 가도 내 학교입니다. */
function schoolColor() { return schoolColorOf(ROOM.school); }
/** 이 방 주인의 색 — 기숙사 소품. 친구 방에 가면 친구 학교 색입니다. */
function roomColor() { return schoolColorOf((VISIT.host || ROOM).school); }
/** 흰 판 위에 아주 옅게 까는 같은 색. 강조 칸의 바탕입니다. */
function schoolSoft(alpha) {
  const [r, g, b] = hexRGB(schoolColor());
  return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
}

/** 학교가 바뀌면 색이 닿는 곳을 전부 다시 칠합니다. */
function applySchoolColor() {
  const c = schoolColor();
  const root = document.documentElement.style;
  root.setProperty('--school', c);
  root.setProperty('--school-soft', schoolSoft(0.10));
  root.setProperty('--school-line', schoolSoft(0.30));
  jacketCanvas = null;                       // 과잠을 다시 굽습니다
  paintSchoolProps();
  nameTagEl.style.background = c;
  nameTagEl.style.color = readableOn(c);
}
/** 바탕색 위에서 읽히는 글자색. 코랄 위 흰 글자를 금지한 것과 같은 이유로,
    학교 색도 밝기를 재서 잉크와 흰색 중 대비가 큰 쪽을 씁니다. */
function readableOn(hex) {
  const [r, g, b] = hexRGB(hex).map((v) => {
    const s = v / 255;
    return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
  });
  const L = 0.2126 * r + 0.7152 * g + 0.0722 * b;
  return (L + 0.05) / 0.05 > (1.05) / (L + 0.05) ? '#2A2320' : '#FFFFFF';
}

/* ==================================================================
   소리

   음원 파일을 싣지 않습니다. 이 프로토타입은 파일 하나로 도는 것이
   전부라, mp3 를 넣는 순간 그 성질을 잃습니다. 대신 Web Audio 로
   **그 자리에서 만듭니다** — 잡음 한 벌과 필터, 사인파 몇 개면 장소의
   공기는 충분히 납니다.

   장소마다 다른 소리를 트는 이유는 세션 모델과 같습니다: 공간이 곧
   모드입니다. 도서관에 들어왔다는 것이 귀로도 와야 합니다.

   브라우저는 사용자가 건드리기 전에는 소리를 못 내게 합니다. 그래서
   첫 키·첫 클릭에서 깨웁니다 — 그전까지는 조용한 게 정상입니다.
   ================================================================== */
const SOUND = Object.assign({ bgm: true, sfx: true }, loadJSON('girin.sound', {}));
function saveSound() { saveJSON('girin.sound', { bgm: SOUND.bgm, sfx: SOUND.sfx }); }

const AUDIO = { ctx: null, master: null, bgmGain: null, amb: null, ambId: null, noise: null };

/** 분홍잡음 한 벌. 흰잡음은 이 크기에서 쉬익 소리가 세서 귀가 아픕니다. */
function noiseBuffer(ctx) {
  if (AUDIO.noise) return AUDIO.noise;
  const len = ctx.sampleRate * 4;                 // 4초를 이어 붙여 씁니다
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  /* Voss-McCartney 를 줄인 판. 옥타브마다 값을 드물게 바꿔 더하면
     저음이 두터운 분홍잡음이 납니다. */
  let b0 = 0, b1 = 0, b2 = 0;
  for (let i = 0; i < len; i++) {
    const w = Math.random() * 2 - 1;
    b0 = 0.99765 * b0 + w * 0.0990460;
    b1 = 0.96300 * b1 + w * 0.2965164;
    b2 = 0.57000 * b2 + w * 1.0526913;
    d[i] = (b0 + b1 + b2 + w * 0.1848) * 0.16;
  }
  AUDIO.noise = buf;
  return buf;
}

function audio() {
  if (AUDIO.ctx) return AUDIO.ctx;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  const ctx = new AC();
  AUDIO.ctx = ctx;
  AUDIO.master = ctx.createGain();
  AUDIO.master.gain.value = 0.5;
  AUDIO.master.connect(ctx.destination);
  AUDIO.bgmGain = ctx.createGain();
  AUDIO.bgmGain.gain.value = 0;
  AUDIO.bgmGain.connect(AUDIO.master);
  return ctx;
}

/* ---- 장소별 앰비언트 ----
   같은 잡음을 필터로 다르게 깎습니다. 도서관은 위를 잘라 조용하게,
   본관은 아주 낮은 곳만 남겨 웅웅거리게, 기숙사는 그보다 더 낮고
   따뜻하게. 광장만 잡음 대신 화음을 얹어 밝게 둡니다. */
const AMBIENCE = {
  library: { cut: 900,  q: 0.6, gain: 0.16, tone: null },
  mainhall:{ cut: 220,  q: 1.2, gain: 0.22, tone: [72, 108] },
  dorm:    { cut: 160,  q: 1.0, gain: 0.20, tone: [64, 96] },
  union:   { cut: 1400, q: 0.5, gain: 0.12, tone: [196, 294] },
  campus:  { cut: 2600, q: 0.4, gain: 0.07, tone: [294, 392, 494] },
};

function stopAmbience() {
  if (!AUDIO.amb) return;
  const ctx = AUDIO.ctx, t = ctx.currentTime;
  const dying = AUDIO.amb;
  dying.gain.gain.cancelScheduledValues(t);
  dying.gain.gain.setValueAtTime(dying.gain.gain.value, t);
  dying.gain.gain.linearRampToValueAtTime(0, t + 0.5);
  setTimeout(() => dying.nodes.forEach((n) => { try { n.stop(); } catch { /* 이미 멈춤 */ } }), 700);
  AUDIO.amb = null; AUDIO.ambId = null;
}

/** 장소가 바뀌면 앞엣것을 접고 새로 답니다. 뚝 끊으면 문을 지날 때마다
    딸깍 소리가 납니다 — 0.5초씩 겹쳐 넘깁니다. */
function setAmbience(id) {
  if (AUDIO.ambId === id) return;
  const spec = AMBIENCE[id];
  const ctx = audio();
  if (!ctx || !spec) { stopAmbience(); return; }
  stopAmbience();

  const gain = ctx.createGain();
  gain.gain.value = 0;
  gain.connect(AUDIO.bgmGain);
  const nodes = [];

  const src = ctx.createBufferSource();
  src.buffer = noiseBuffer(ctx);
  src.loop = true;
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = spec.cut; lp.Q.value = spec.q;
  src.connect(lp); lp.connect(gain);
  src.start(); nodes.push(src);

  /* 화음 — 잡음만이면 환풍기입니다. 아주 작게 깐 지속음이 있어야
     "여기 있다" 는 느낌이 납니다. */
  (spec.tone || []).forEach((hz, i) => {
    const o = ctx.createOscillator();
    o.type = i === 0 ? 'sine' : 'triangle';
    o.frequency.value = hz;
    const og = ctx.createGain();
    og.gain.value = 0.035 / (i + 1);
    /* 아주 느린 흔들림. 고정된 사인파는 몇 초만 지나도 기계음이 됩니다. */
    const lfo = ctx.createOscillator(), lg = ctx.createGain();
    lfo.frequency.value = 0.05 + i * 0.03; lg.gain.value = 0.012;
    lfo.connect(lg); lg.connect(og.gain);
    o.connect(og); og.connect(gain);
    o.start(); lfo.start();
    nodes.push(o, lfo);
  });

  gain.gain.linearRampToValueAtTime(spec.gain, ctx.currentTime + 0.6);
  AUDIO.amb = { gain, nodes }; AUDIO.ambId = id;
  syncSound();
}

/* ---- 효과음 ----
   짧은 톤 하나씩입니다. 길게 만들면 문을 여러 번 지날 때 겹쳐 울립니다. */
const SFX = {
  door:  { hz: [330, 220], dur: 0.16, type: 'triangle', gain: 0.16 },
  sit:   { hz: [220, 165], dur: 0.14, type: 'sine',     gain: 0.14 },
  coin:  { hz: [880, 1320], dur: 0.12, type: 'square',  gain: 0.07 },
  deny:  { hz: [200, 140], dur: 0.18, type: 'sawtooth', gain: 0.08 },
  buy:   { hz: [523, 784, 1046], dur: 0.20, type: 'triangle', gain: 0.10 },
};
function sfx(kind) {
  if (!SOUND.sfx) return;
  const spec = SFX[kind];
  const ctx = audio();
  if (!ctx || !spec || ctx.state !== 'running') return;
  const t = ctx.currentTime;
  spec.hz.forEach((hz, i) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = spec.type; o.frequency.value = hz;
    const t0 = t + i * spec.dur * 0.55;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(spec.gain, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + spec.dur);
    o.connect(g); g.connect(AUDIO.master);
    o.start(t0); o.stop(t0 + spec.dur + 0.02);
  });
}

/** 설정이 바뀌면 여기서 한 번에 반영합니다.

    지금 값을 먼저 못 박고 나서 기울입니다. 안 그러면 **마지막으로 예약된
    값**에서 출발해서, 끄자마자 켜면 0 이 아니라 예전 목표에서 시작해
    소리가 튑니다. */
function syncSound() {
  if (!AUDIO.ctx) return;
  const g = AUDIO.bgmGain.gain, t = AUDIO.ctx.currentTime;
  g.cancelScheduledValues(t);
  g.setValueAtTime(g.value, t);
  g.linearRampToValueAtTime(SOUND.bgm ? 1 : 0, t + 0.25);
}

/**
 * 48px 시트를 16px 로 줄입니다. 3×3 블록의 **최빈색**을 씁니다 —
 * 평균을 내면 1px 외곽선이 배경과 섞여 흐려집니다. 최빈색은 얇은
 * 선을 잃긴 하지만 남은 선은 또렷합니다. 흐린 그림보다 낫습니다.
 */
function downscale3(img) {
  const src = document.createElement('canvas');
  src.width = img.width; src.height = img.height;
  const sg = src.getContext('2d', { willReadFrequently: true });
  sg.drawImage(img, 0, 0);
  const sd = sg.getImageData(0, 0, img.width, img.height).data;

  const w = img.width / 3 | 0, h = img.height / 3 | 0;
  const out = document.createElement('canvas');
  out.width = w; out.height = h;
  const og = out.getContext('2d');
  const od = og.createImageData(w, h);
  const tally = new Map();

  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    tally.clear();
    let best = 0, bestN = 0, clear = 0;
    for (let j = 0; j < 3; j++) for (let i = 0; i < 3; i++) {
      const k = ((y * 3 + j) * img.width + (x * 3 + i)) * 4;
      if (sd[k + 3] < 128) { clear++; continue; }
      const key = (sd[k] << 16) | (sd[k + 1] << 8) | sd[k + 2];
      const n = (tally.get(key) || 0) + 1;
      tally.set(key, n);
      if (n > bestN) { bestN = n; best = key; }
    }
    const o = (y * w + x) * 4;
    if (clear >= 5) { od.data[o + 3] = 0; continue; }
    od.data[o] = (best >> 16) & 255;
    od.data[o + 1] = (best >> 8) & 255;
    od.data[o + 2] = best & 255;
    od.data[o + 3] = 255;
  }
  og.putImageData(od, 0, 0);
  return out;
}

function blitU(i, dx, dy) { ctx.drawImage(urban, (i % U_COLS) * T, ((i / U_COLS) | 0) * T, T, T, dx, dy, T, T); }
function blitC(i, dx, dy) { ctx.drawImage(city,  (i % C_COLS) * T, ((i / C_COLS) | 0) * T, T, T, dx, dy, T, T); }
function blitK(i, dx, dy) { ctx.drawImage(school,(i % K_COLS) * T, ((i / K_COLS) | 0) * T, T, T, dx, dy, T, T); }

/** 이웃을 보고 테두리 타일을 고릅니다. 지도 밖은 같은 재질로 칩니다. */
function autoTile(m, x, y, mat) {
  const same = (i, j) => !inMap(m, i, j) || m.over[at(m, i, j)] === mat;
  const r = !same(x, y - 1) ? 0 : (!same(x, y + 1) ? 2 : 1);
  const c = !same(x - 1, y) ? 0 : (!same(x + 1, y) ? 2 : 1);
  return AUTO[mat].t[r * 3 + c];
}

/* ---------------- 야외 바닥 굽기 ----------------
   광장이 느렸던 이유입니다.

   실내는 방 하나가 이미 한 장(zone.floor)이라 바닥이 drawImage 한 번이고,
   그래서 25~50 draws 에 120fps 가 나왔습니다. 야외는 달랐습니다 — 잔디는
   한 장인데 그 위의 포장(over)만은 **매 프레임 칸마다** 오토타일을 골라
   그렸습니다. 화면에 20×12 칸이 걸리고 광장은 거의 전부가 포장이라,
   가만히 서 있어도 프레임마다 240 번이 넘게 들었습니다.

   오토타일은 이웃한 칸만 보고 정해지고 그 이웃은 변하지 않습니다. 즉
   **한 번 굽고 끝날 그림을 매 프레임 다시 그리고 있었습니다.** 여기서
   잔디 위에 포장을 미리 얹어 두면 야외도 실내처럼 바닥이 한 장이 됩니다.

   시트가 와야 그릴 수 있으므로 maybeStart 에서 부릅니다. */
function bakeGround(m) {
  if (m.floor) return;                       // 실내는 이미 한 장입니다
  if (!m.ground) {
    /* 바닥 시트를 쓰는 야외가 생기면 여기서 한 장으로 만듭니다 */
    m.ground = canvasOf(m.w, m.h);
    const bg = m.ground.getContext('2d');
    bg.imageSmoothingEnabled = false;
    for (let y = 0; y < m.h; y++) for (let x = 0; x < m.w; x++) {
      const i = m.base[at(m, x, y)];
      bg.drawImage(urban, (i % U_COLS) * T, ((i / U_COLS) | 0) * T, T, T, x * T, y * T, T, T);
    }
  }
  const g = m.ground.getContext('2d');
  g.imageSmoothingEnabled = false;
  for (let y = 0; y < m.h; y++) for (let x = 0; x < m.w; x++) {
    const mat = m.over[at(m, x, y)];
    if (!mat) continue;
    const i = autoTile(m, x, y, mat);
    g.drawImage(urban, (i % U_COLS) * T, ((i / U_COLS) | 0) * T, T, T, x * T, y * T, T, T);
  }
  m.groundBaked = true;
}

const keys = new Set();
addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  /* 버튼이나 입력칸에 포커스가 있으면 월드 조작은 비켜 줍니다. 이게 없으면

  if (k !== 'escape' && e.target?.closest?.('button, input, textarea, select, [role="button"], [role="switch"]')) return;
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();

function solidAt(px, py) {

function facingTile() {
  const tx = Math.floor(player.x / T), ty = Math.floor((player.y - 1) / T);
  if (player.dir === 'up') return { x: tx, y: ty - 1 };
  if (player.dir === 'down') return { x: tx, y: ty + 1 };
  return { x: tx + (player.flip ? -1 : 1), y: ty };
}
function findNearby() {
  if (player.sitting) return { kind: 'stand' };
  const f = facingTile();
  /* NPC 는 두 칸까지 — 계산대 뒤에 서 있어서 앞 칸만 보면 못 만납니다 */
  const d = { up: [0, -1], down: [0, 1], side: [player.flip ? -1 : 1, 0] }[player.dir];
  for (const step of [0, 1]) {
    const fx = f.x + d[0] * step, fy = f.y + d[1] * step;
    for (const n of zone.npcs) if (n.x === fx && n.y === fy) return { kind: 'talk', npc: n };
  }
  /* 물건 만지기. 방향이 아니라 **거리**로 잡습니다 — 미니룸은 물건이
     빽빽해서, 정확히 마주 봐야만 열리면 답답합니다. 여러 개가 걸리면
     가장 가까운 것을 고릅니다. */
  const ptx = Math.floor(player.x / T), pty = Math.floor((player.y - 1) / T);
  let best = null, bestD = 99;
  for (const t of zone.things || []) {
    const d2 = PROP[zone.props.find((q) => q.x === t.x && q.y === t.y)?.kind];
    const tw = d2 ? d2.w : 1, th = d2 ? d2.h : 1;
    const nx = Math.max(t.x - ptx, 0, ptx - (t.x + tw - 1));
    const ny = Math.max(t.y - pty, 0, pty - (t.y + th - 1));
    if (nx > 1 || ny > 1) continue;
    const dist = nx + ny;
    if (dist < bestD) { bestD = dist; best = t; }
  }
  if (best) return { kind: 'talk', npc: best };
  for (const s of zone.sitSpots) if (s.x === f.x && s.y === f.y) return { kind: 'sit', spot: s };
  return null;
}
function interact() {
  /* 대화창이 떠 있으면 스페이스는 **닫기**입니다.

     이걸 nearby 보다 먼저 보지 않으면 창이 영영 안 닫힙니다 — 대화를
     연 자리에 그대로 서 있으니 nearby 가 살아 있고, 스페이스를 누를
     때마다 같은 창이 다시 열립니다. 자리를 뜬 경우만 닫히던 이유입니다. */
  if (dialogOpen) return closeDialog();
  const n = nearby;
  if (!n) return;
  if (n.kind === 'stand') return stand();
  if (n.kind === 'sit') return sit(n.spot);
  if (n.kind === 'talk') {
    /* 미니룸 물건은 설명이 아니라 **창**을 엽니다 */
    if (n.npc.panel) return openPanel(n.npc.panel);
    return talk(n.npc);
  }
}

var POSE = (function () {

     납니다. 하필 우리 판정축 중 earEyeRatio 와 shoulderSpan 이 그 점들을

  var FACE_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/'

  function build(delegate) {
    return vision.FilesetResolver.forVisionTasks(WASM).then(function (fs) {
      return Promise.all([
        vision.PoseLandmarker.createFromOptions(fs, {
          baseOptions: { modelAssetPath: POSE_MODEL, delegate: delegate },
          runningMode: 'VIDEO',
          numPoses: 2   /* 2 로 두어 "두 명 이상" 을 감지합니다. 판정은 첫 사람만. */

  function load() {

    loading = import(WASM.replace('/wasm', '/vision_bundle.mjs'))
      .then(function (mod) {

     판정 축 중 거리에 가장 민감한 faceScaleRatio 의 분자(눈 사이 거리)는
     화면 폭의 4% 밖에 안 됩니다. 프레임당 몇 px 흔들림이 그대로 10%대

  function LowPass() { this.y = null; }
  LowPass.prototype.filter = function (x, a) {

  OneEuro.prototype.filter = function (v, t) {

    var dt = this.last === null ? 0 : (t - this.last) / 1000;

        y: c(i + 'y').filter(lm.y, t),

  /* ---------------- 머리 6DoF ----------------
     478점을 표준 얼굴 모형에 맞춘 4x4 행렬입니다. 열 우선이라
     R[row][col] = data[col*4 + row].
     Pose 의 성긴 랜드마크로는 머리가 8cm 나온 것을 못 잡습니다 —
     1.6m 에서 8cm 는 배율 5% 변화라 지터에 묻힙니다. 여기서는 cm 로
     직접 나옵니다. */
  var HEAD_YAW_LIMIT = 25, HEAD_ROLL_LIMIT = 25;
  function headPose(data) {
    if (!data || data.length < 16) return null;
    var d = data, dist = Math.abs(d[14]);
    if (!isFinite(dist) || dist < 20 || dist > 150) return null;
    var deg = 180 / Math.PI;
    return {
      headDistanceCm: dist,
      /* 모형은 y 가 위입니다. 턱을 내리면 + 가 되도록 부호를 뒤집습니다. */
      headPitchDeg: -Math.atan2(d[6], d[10]) * deg,
      headYawDeg: Math.atan2(-d[2], Math.hypot(d[6], d[10])) * deg,
      headRollDeg: Math.atan2(d[1], d[0]) * deg
    };
  }
  function headUsable(h) {
    return Math.abs(h.headYawDeg) <= HEAD_YAW_LIMIT
        && Math.abs(h.headRollDeg) <= HEAD_ROLL_LIMIT;
  }

  /* ---------------- 랜드마크 분석 ---------------- */
  var IDX = { nose: 0, leftEyeOuter: 3, rightEyeOuter: 6, leftEar: 7, rightEar: 8,
              leftShoulder: 11, rightShoulder: 12, leftHip: 23, rightHip: 24 };
  var PRESENCE_MIN = 0.5, MIN_SHOULDER_WIDTH = 0.09;
  var YAW_SEVERE = 0.9, YAW_MODERATE = 0.5, FRAME_MARGIN = 0.06;

  var PRIMARY = ['faceScaleRatio', 'headHeightRatio', 'facePitchRatio', 'earEyeRatio',
                 'shoulderSpan', 'lateralOffsetRatio', 'shoulderTiltRatio', 'torsoLean',
                 'headDistanceCm', 'headPitchDeg'];
  var AUX = ['forwardDepthRatio'];

  function pt(lm) {
    if (!lm) return { x: 0, y: 0, z: 0, visibility: 0, present: false };
    var v = lm.visibility == null ? 0 : lm.visibility;
    return { x: lm.x, y: lm.y, z: lm.z, visibility: v, present: v >= PRESENCE_MIN };
  }
  function inFrame(p) {
    return p.x >= -FRAME_MARGIN && p.x <= 1 + FRAME_MARGIN
        && p.y >= -FRAME_MARGIN && p.y <= 1 + FRAME_MARGIN;
  }

  function analyze(lms, hp) {
    if (!lms || lms.length < 25) return null;
    var P = {};
    Object.keys(IDX).forEach(function (k) { P[k] = pt(lms[IDX[k]]); });

    var eyesOk = P.leftEyeOuter.present && P.rightEyeOuter.present;
    var shouldersOk = P.leftShoulder.present && P.rightShoulder.present;
    var earsOk = P.leftEar.present && P.rightEar.present;
    var hipsOk = P.leftHip.present && P.rightHip.present;

    var sw = Math.hypot(P.leftShoulder.x - P.rightShoulder.x,
                        P.leftShoulder.y - P.rightShoulder.y);
    var smx = (P.leftShoulder.x + P.rightShoulder.x) / 2;
    var smy = (P.leftShoulder.y + P.rightShoulder.y) / 2;
    var smz = (P.leftShoulder.z + P.rightShoulder.z) / 2;

    var eyeDist = eyesOk
      ? Math.hypot(P.leftEyeOuter.x - P.rightEyeOuter.x, P.leftEyeOuter.y - P.rightEyeOuter.y) : 0;
    var emx = (P.leftEyeOuter.x + P.rightEyeOuter.x) / 2;
    var emy = (P.leftEyeOuter.y + P.rightEyeOuter.y) / 2;

    /* 정면이면 코가 두 눈 중앙 근처에 있습니다. */
    var yaw = (eyesOk && P.nose.present && eyeDist > 0)
      ? Math.abs(P.nose.x - emx) / (eyeDist / 2) : 0;
    var severe = yaw > YAW_SEVERE, moderate = !severe && yaw > YAW_MODERATE;

    var core = [P.leftShoulder, P.rightShoulder]
      .concat(eyesOk ? [P.leftEyeOuter, P.rightEyeOuter] : [P.nose]);
    var vis = core.reduce(function (s, p) { return s + p.visibility; }, 0) / core.length;

    var f = {}, d = sw || 1;

    if (eyesOk && shouldersOk) {
      f.faceScaleRatio = eyeDist / d;
      f.headHeightRatio = (smy - emy) / d;
    }
    /* ---- 시상면(앞뒤) 축 ----
       faceScale·headHeight 는 shoulderWidth 로 정규화하는데, 거북목은 대개
       상체가 같이 앞으로 나와 어깨도 함께 커집니다 — 분자·분모가 같이
       커져 신호가 상쇄됩니다. 아래 두 축은 eyeDist 로만 정규화해 카메라
       거리와 무관하고, 고개 각도 자체를 잽니다. */
    if (eyesOk && P.nose.present && eyeDist > 0 && !moderate) {
      /* 코는 얼굴 평면보다 앞으로 나와 있어, 고개를 숙이면 눈-코 세로
         간격이 오히려 벌어집니다. 증가가 이탈 방향입니다. */
      f.facePitchRatio = (P.nose.y - emy) / eyeDist;
    }
    if (eyesOk && earsOk && eyeDist > 0 && !moderate) {
      /* 귀는 눈보다 뒤에 있어, 고개를 숙이면 눈보다 덜 내려갑니다. */
      f.earEyeRatio = ((P.leftEar.y + P.rightEar.y) / 2 - emy) / eyeDist;
    }
    if (P.nose.present && shouldersOk && !moderate) {
      f.lateralOffsetRatio = Math.abs(P.nose.x - smx) / d;
      f.forwardDepthRatio = smz - P.nose.z;
    }
    if (shouldersOk) {
      f.shoulderTiltRatio = Math.abs(P.leftShoulder.y - P.rightShoulder.y) / d;
      /* 유일하게 정규화하지 않는 축입니다. 어깨폭은 카메라까지의 거리에
         그대로 반비례하므로, 몸 전체가 화면으로 다가온 것을 잡아냅니다. */
      f.shoulderSpan = sw;
    }

      f.torsoLean = Math.abs(smx - (P.leftHip.x + P.rightHip.x) / 2) / d;
    }

  var DIRECTION = {

    headHeightRatio: -1,    /* 눈-어깨 거리 감소 = 고개 숙임·움츠림 */
    facePitchRatio: 1,      /* 눈-코 세로 간격 벌어짐 = 고개 숙임 */
    earEyeRatio: -1,        /* 귀가 눈보다 올라감 = 고개 숙임 */
    shoulderSpan: 1,        /* 어깨폭 넓어짐 = 몸 전체 접근 */
    lateralOffsetRatio: 1, shoulderTiltRatio: 1, torsoLean: 1,
    headDistanceCm: -1,     /* 얼굴이 가까워짐 = 머리 전방 이동 */
    headPitchDeg: 1,        /* 턱을 내림 */
    forwardDepthRatio: 1
  };
  var FLOOR = {
    faceScaleRatio: 0.03, headHeightRatio: 0.08,
    facePitchRatio: 0.06, earEyeRatio: 0.06, shoulderSpan: 0.012,
    lateralOffsetRatio: 0.1, shoulderTiltRatio: 0.08, torsoLean: 0.1,
    headDistanceCm: 4, headPitchDeg: 8,   /* cm·도 단위 */
    forwardDepthRatio: 0.35
  };

  var WARNING_ENTER = 1.0, BAD_STRONG = 1.8, GOOD_EXIT = 0.8;

  function votes(f, profile, sens, qualityGood) {
    var mult = SENS[sens] || 1, details = [];

      var v = f[k], st = profile.features[k];
      if (v === undefined || !st) return;
      var tol = mult * Math.max(FLOOR[k], st.mad * MAD_K);
      var dev = Math.max(0, (v - st.median) * DIRECTION[k]) / tol;
      details.push({ key: k, deviation: dev, primary: PRIMARY.indexOf(k) >= 0,
                     exceeded: dev > WARNING_ENTER });

    var over = pri.filter(function (d) { return d.exceeded; }).length;
    var max = pri.reduce(function (m, d) { return Math.max(m, d.deviation); }, 0);
    return {
      details: details, primaryExceedCount: over, maxPrimary: max,
      usedFeatureCount: details.length,
      /* z 는 표가 아닙니다: bad 의 두 번째 표도, good 복귀의 거부권도
         갖지 않습니다. 실카메라에서 z 는 조명·거리에 따라 흘러다닙니다. */
      voteWarning: over >= 1,
      voteBad: over >= 2 || (max > BAD_STRONG && qualityGood),
      voteGood: pri.every(function (d) { return d.deviation < GOOD_EXIT; })

     한 프레임 튀었다고 상태를 바꾸지 않습니다. */
  var HOLD = { warning: 1500, bad: 5000, good: 2000 };
  function arbiter() { return { current: 'good', candidate: null, since: 0 }; }
  function step(s, v, now) {
    var target = v.voteBad ? 'bad' : v.voteWarning ? 'warning' : v.voteGood ? 'good' : null;
    if (target === null || target === s.current) {
      return { current: s.current, candidate: null, since: now };
    }
    if (s.candidate !== target) return { current: s.current, candidate: target, since: now };
    if (now - s.since >= HOLD[target]) return { current: target, candidate: null, since: now };
    return s;
  }

  /* ---------------- 통계 ---------------- */
  function median(a) {
    var s = a.slice().sort(function (x, y) { return x - y; }), m = Math.floor(s.length / 2);
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  }
  function mad(a, c) {
    if (c === undefined) c = median(a);
    return median(a.map(function (n) { return Math.abs(n - c); }));
  }

  /* ---------------- 프레임 루프 ----------------

    if (!poser) return null;
    var res;
    try { res = poser.detectForVideo(video, t); } catch (e) { return null; }
    var people = res.landmarks || [];
    var raw = people[0];
    if (!raw) { smoother.reset(); return { analysis: null, multi: false }; }

    var hp = null;
    if (facer) {
      try {
        var fr = facer.detectForVideo(video, t);
        var m = fr.facialTransformationMatrixes && fr.facialTransformationMatrixes[0];
        hp = headPose(m && m.data);
      } catch (e) { hp = null; }
    }
    return {
      analysis: analyze(smoother.smooth(raw, t), hp),
      /* 기준을 맞출 때는 "기준 대비" 가 아직 없으므로 **절대값**이 필요합니다.
         머리 6DoF 는 도·cm 단위라 그대로 쓸 수 있어 밖으로 넘깁니다. */
      head: hp,
      multi: people.length > 1
    };
  }

  return {
    load: load, detect: detect, analyze: analyze, votes: votes,
    arbiter: arbiter, step: step, median: median, mad: mad,
    Smoother: Smoother,
    PRIMARY: PRIMARY, AUX: AUX,
    MIN_SHOULDER_WIDTH: MIN_SHOULDER_WIDTH,
    ready: function () { return !!poser; }
  };
})();

/* ==================================================================
   웹캠 자세 판정 — UpRight 엔진 이식

   여기 있는 POSE 블록은 `prototypes/room-flow/index.html` 의 것을 그대로
   옮긴 것입니다. 손대지 마세요 — 값 하나하나에 이유가 있고, 그 이유는
   `upright-now/docs/24_POSTURE_ENGINE.md` 에 있습니다.

   요약만 적어 둡니다.
   · 정면 카메라는 거북목이 움직이는 축(앞뒤)을 원래 못 봅니다. 그래서
     **정면에서 실제로 보이는 형태 변화**를 여러 개 모아 투표시킵니다 —
     facePitchRatio · earEyeRatio · shoulderSpan, 그리고 얼굴 메시가 주는
     머리 6DoF(headDistanceCm · headPitchDeg).
   · 랜드마크 z(forwardDepthRatio)를 주력으로 쓰면 안 됩니다. 조명과 거리에
     따라 흘러다녀 기준선이 세션 중에 바뀝니다. 보조(AUX)로만 둡니다.
   · One Euro 필터가 앞에 붙습니다. 새 축들은 값이 작아서(0.06 단위)
     원본 떨림에 그대로 묻힙니다.
   · 절대 임계값은 없습니다. 사람마다 캘리브레이션한 **자기 기준**과
     중앙값·MAD 로 비교합니다.
   ================================================================== */

/* ---- 판정 민감도 ----

   있으면 학교 랭킹이 조용히 무너집니다 — 랭킹 지표가 "bad 를 겪고
   회복한 시간" 이라, 기준을 풀면 bad 자체가 안 나옵니다. */
const SENSITIVITY = 'default';

/* ---- 기준 프로필 ----
   공간마다 앉는 높이가 다르므로 따로 잡습니다. 이 기기에만 남고
   서버로 가지 않습니다. version 3 이 아니면 버립니다 — 축이 바뀐
   옛 프로필은 조용히 무시되어 사용자에게는 고장으로 보입니다. */

} catch { /* 저장된 게 깨졌으면 기본값 */ }

}

};

const STATE_COLOR = { good: '#2E9E5B', warning: '#D98324', bad: '#E0483A', idle: '#9A8E88' };
const STATE_TEXT  = { good: '좋아요', warning: '조금 앞으로 나왔어요', bad: '오래 굽어 있어요', idle: '' };

function setState(kind, msg) {
  const now = performance.now();
  if (LIVE.lastTick && LIVE.state !== 'idle') {
    const dt = now - LIVE.lastTick;
    if (LIVE.state === 'good') LIVE.goodMs += dt;
    else if (LIVE.state === 'warning') LIVE.warnMs += dt;
    else if (LIVE.state === 'bad') LIVE.badMs += dt;
  }
  LIVE.lastTick = now;
  /* 회복 — bad 를 겪고 good 으로 돌아온 것만 셉니다. 랭킹이 이걸 씁니다. */
  if (kind === 'bad') LIVE.wasBad = true;
  else if (kind === 'good' && LIVE.wasBad) {
    LIVE.recoveries++; LIVE.wasBad = false;
    /* 돌아온 것에 줍니다. 굽지 않고 버틴 것이 아니라 **돌아온 행동**이
       이 앱이 만들려는 습관입니다. */
    if (LIVE.rewardedRecoveries < COIN.maxRewardedRecoveries) {
      earn(COIN.perRecovery, '회복 성공');
      LIVE.rewardedRecoveries++;
    }
  }

  LIVE.state = kind;
  LIVE.msg = msg || STATE_TEXT[kind] || '';
  camDot.style.background = STATE_COLOR[kind];
  camDot.classList.toggle('live', kind !== 'idle');
  if (stateLabel) {
    stateLabel.textContent = LIVE.msg;
    stateLabel.style.color = kind === 'idle' ? 'var(--ink-3)' : STATE_COLOR[kind];
  }
}

/* ================== 카메라 ================== */
async function startCamera() {
  camMsg.textContent = '카메라를 여는 중이에요';
  camMsg.hidden = false;
  setState('idle', '측정 준비');
  if (!navigator.mediaDevices?.getUserMedia) {
    camMsg.textContent = '이 브라우저에서는 카메라를 열 수 없어요.';
    return;
  }
  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' },
      audio: false,
    });
    video.srcObject = camStream;
    video.hidden = false;
    await video.play();
    camMsg.hidden = true;
    loadPose();
  } catch (err) {
    video.hidden = true;
    camMsg.hidden = false;
    camMsg.textContent = err?.name === 'NotAllowedError'
      ? '카메라를 거부했어요. 주소창 왼쪽에서 허용하면 다시 켜집니다.'
      : '카메라를 열지 못했어요. 미리보기 창에서는 항상 막힙니다 — 크롬에서 직접 열어 주세요.';
  }
}

function stopCamera() {
  poseRunning = false;
  LIVE.on = false;
  setState('idle', '측정 준비');
  if (camStream) { camStream.getTracks().forEach((t) => t.stop()); camStream = null; }
  video.srcObject = null;
  video.hidden = true;
  octx.clearRect(0, 0, overlay.width, overlay.height);
  poseFps = 0;
}

async function loadPose() {
  camMsg.hidden = false;
  camMsg.textContent = '자세 판정 모델을 받는 중이에요';
  try {
    await POSE.load();
    camMsg.hidden = true;
    LIVE.smoother = new POSE.Smoother();
    LIVE.arb = POSE.arbiter();
    LIVE.profile = (BASELINE[zoneId] && BASELINE[zoneId].features) || null;
    LIVE.zone = zoneId;
    LIVE.frames = 0; LIVE.seen = 0; LIVE.lastTick = 0; LIVE.wasBad = false;
    LIVE.goodMs = 0; LIVE.warnMs = 0; LIVE.badMs = 0; LIVE.recoveries = 0;
    LIVE.on = true;
    poseRunning = true;
    if (!LIVE.profile) setState('idle', '이 자리 기준이 없어요');
    poseLoop();
  } catch {
    camMsg.hidden = false;
    camMsg.textContent = '판정 모델을 받지 못했어요 (오프라인이거나 CDN 차단).';
  }
}

/* 뼈대 — 사람이 자기가 어떻게 잡히는지 보는 용도입니다.
   판정은 이 그림이 아니라 아래 votes/step 이 합니다. */
const SKELETON = [[11,12],[11,23],[12,24],[23,24],[11,13],[13,15],[12,14],[14,16],[0,11],[0,12],[7,8]];
function drawSkeleton(lm, color) {
  const w = video.videoWidth, h = video.videoHeight;
  if (overlay.width !== w) { overlay.width = w; overlay.height = h; }
  octx.clearRect(0, 0, w, h);
  if (!lm) return;
  octx.strokeStyle = color; octx.lineWidth = Math.max(2, w / 240);
  octx.beginPath();
  for (const [a, b] of SKELETON) {
    if (!lm[a] || !lm[b]) continue;
    octx.moveTo(lm[a].x * w, lm[a].y * h);
    octx.lineTo(lm[b].x * w, lm[b].y * h);
  }
  octx.stroke();
  octx.fillStyle = color;
  for (const i of [0, 7, 8, 11, 12, 23, 24]) {
    if (!lm[i]) continue;
    octx.beginPath(); octx.arc(lm[i].x * w, lm[i].y * h, Math.max(2.5, w / 190), 0, 7); octx.fill();
  }
}

/* ---- 판정 루프 ----
   room-flow 의 것을 그대로 옮겼습니다. 순서가 중요합니다 — 프레임을
   먼저 걸러 내고, 남은 것만 투표에 넣습니다. 걸러 내는 이유가 서로
   다르므로 안내 문구도 다릅니다. */
function poseLoop() {
  if (!poseRunning) return;
  requestAnimationFrame(poseLoop);
  if (!video || video.readyState < 2 || !POSE.ready()) return;

  const now = performance.now();
  const out = POSE.detect(video, now, LIVE.smoother);
  if (!out) return;
  poseFrames++; LIVE.frames++;

  const a = out.analysis;
  if (!a || !a.faceCoreOk || !a.bothShouldersOk || !a.inFrame) {
    drawSkeleton(out.landmarks, STATE_COLOR.idle);
    setState('idle', '화면에서 벗어났어요');
    LIVE.arb = POSE.arbiter();
    return;
  }
  if (a.shoulderWidth < POSE.MIN_SHOULDER_WIDTH) {
    drawSkeleton(out.landmarks, STATE_COLOR.idle);
    setState('idle', '조금 더 가까이 앉아 주세요');
    return;
  }
  if (out.multi) {
    drawSkeleton(out.landmarks, STATE_COLOR.idle);
    setState('idle', '두 명 이상 보여요');
    return;
  }
  if (a.severeRotation) {
    /* 고개를 많이 돌리면 코 기반 축이 전부 못 믿을 값이 됩니다.
       이탈로 치지 않고 측정 제한으로 둡니다. */
    drawSkeleton(out.landmarks, STATE_COLOR.idle);
    setState('idle', '고개를 돌리는 중이에요');
    return;
  }
  if (!LIVE.profile) {
    drawSkeleton(out.landmarks, STATE_COLOR.idle);
    setState('idle', '이 자리 기준이 없어요');
    return;
  }
  LIVE.seen++;

  const q = a.meanVisibility >= 0.6;
  const v = POSE.votes(a.features, LIVE.profile, SENSITIVITY, q);
  /* 기준에 없는 축이 너무 많으면 판정하지 않습니다 — 기준을 맞출 때와
     지금의 조명·거리가 너무 다르다는 뜻입니다. */
  if (v.usedFeatureCount < 3) {
    drawSkeleton(out.landmarks, STATE_COLOR.idle);
    setState('idle', '기준과 화면이 달라요');
    return;
  }

  LIVE.arb = POSE.step(LIVE.arb, v, now);
  const s = LIVE.arb.current;
  drawSkeleton(out.landmarks, STATE_COLOR[s]);
  setState(s);
}

/* ================== 30초 기준 맞추기 ==================
   30초를 채우는 이유 — 5초로 줄이면 그 순간의 자세가 기준이 되어
   세션 내내 어긋납니다. 표본이 일찍 쌓여도 끝내지 않습니다. */
const CAL = { on: false, zone: null, t0: 0, samples: [], widths: [], last: null, badMsg: '' };
const CAL_MS = 30000, CAL_BUCKETS = 6, CAL_MIN_SAMPLES = 150;
const CAL_MIN_PER_FEATURE = 60, CAL_MOVE_LIMIT = 0.2;

/* 기준을 맞추는 순간에는 "기준 대비" 가 아직 없어서 절대값으로만
   거릅니다. 전부 사람마다 안 변하는 단위입니다 — 각도(도), 거리(cm),
   어깨폭으로 나눈 비율. 체형처럼 사람마다 다른 값은 쓰지 않습니다. */
const CAL_PITCH_DOWN = 14, CAL_PITCH_UP = 14, CAL_ROLL = 10;
const CAL_NEAR_CM = 38, CAL_TILT = 0.075;

function calBadPosture(a, head) {
  CAL.badMsg = '';
  if (head) {
    if (head.headPitchDeg > CAL_PITCH_DOWN) { CAL.badMsg = '고개가 숙여져 있어요. 턱을 살짝 당기고 정면을 봐 주세요'; return true; }
    if (head.headPitchDeg < -CAL_PITCH_UP)  { CAL.badMsg = '턱이 들려 있어요. 시선을 화면 높이로 맞춰 주세요'; return true; }
    if (Math.abs(head.headRollDeg) > CAL_ROLL) { CAL.badMsg = '고개가 한쪽으로 기울었어요. 수평으로 세워 주세요'; return true; }
    if (head.headDistanceCm < CAL_NEAR_CM) { CAL.badMsg = '화면에 너무 가까워요. 등을 붙이고 한 뼘만 물러나 주세요'; return true; }
  }
  const tilt = a.features.shoulderTiltRatio;
  if (tilt !== undefined && tilt > CAL_TILT) { CAL.badMsg = '어깨가 한쪽으로 기울었어요. 양쪽 높이를 맞춰 주세요'; return true; }
  return false;
}
function calMoved(next, prev) {
  if (!prev) return false;
  return ['faceScaleRatio', 'headHeightRatio', 'lateralOffsetRatio'].some((k) => {
    const x = next[k], y = prev[k];
    return x !== undefined && y !== undefined && Math.abs(x - y) > CAL_MOVE_LIMIT;
  });
}

function startCalibrate() {
  if (CAL.on || !POSE.ready() || !camStream) return;
  CAL.on = true; CAL.zone = zoneId; CAL.t0 = performance.now();
  CAL.samples = []; CAL.widths = []; CAL.last = null; CAL.badMsg = '';
  poseRunning = false;                    // 판정 루프를 잠시 내리고 수집만
  LIVE.smoother = new POSE.Smoother();
  calLoop();
}
function calLoop() {
  if (!CAL.on) return;
  requestAnimationFrame(calLoop);
  if (!video || video.readyState < 2) return;

  const now = performance.now();
  const elapsed = now - CAL.t0;
  const out = POSE.detect(video, now, LIVE.smoother);
  const a = out && out.analysis;

  if (a && a.faceCoreOk && a.bothShouldersOk && a.inFrame && !out.multi && !a.severeRotation) {
    drawSkeleton(out.landmarks, STATE_COLOR.good);
    if (calBadPosture(a, a.head)) {
      camMsg.hidden = false; camMsg.textContent = CAL.badMsg;
    } else if (!calMoved(a.features, CAL.last)) {
      camMsg.hidden = true;
      CAL.samples.push({ f: a.features, bucket: Math.min(CAL_BUCKETS - 1, Math.floor(elapsed / (CAL_MS / CAL_BUCKETS))) });
      CAL.widths.push(a.shoulderWidth);
      CAL.last = a.features;
    }
  } else {
    drawSkeleton(out && out.landmarks, STATE_COLOR.idle);
    camMsg.hidden = false;
    camMsg.textContent = '얼굴과 어깨가 함께 보이게 앉아 주세요';
  }

  const left = Math.max(0, Math.ceil((CAL_MS - elapsed) / 1000));
  if (stateLabel) {
    stateLabel.textContent = '기준 맞추는 중 · ' + left + '초';
    stateLabel.style.color = 'var(--coral-700)';
  }
  if (elapsed >= CAL_MS) calFinish();
}

function calFinish() {
  CAL.on = false;
  const covered = new Set(CAL.samples.map((s) => s.bucket)).size;

  const fail = (msg) => {
    camMsg.hidden = false; camMsg.textContent = msg;
    setState('idle', '기준을 못 맞췄어요');
    poseRunning = true; poseLoop();
  };
  if (CAL.samples.length < CAL_MIN_SAMPLES) {
    return fail('30초 중 앉아 있는 모습이 충분히 잡히지 않았어요. 얼굴과 어깨가 함께 보이는 자리에서 다시 해 주세요.');
  }
  if (covered < CAL_BUCKETS) {
    return fail('중간에 자리를 비운 구간이 있어요. 30초 내내 같은 자세로 앉아 주세요.');
  }

  /* 축마다 중앙값과 MAD. 표본이 모자란 축은 기준에서 뺍니다 — 책상에
     가려 엉덩이가 안 보이면 torsoLean 이 빠지고, 빠진 축은 세션에서도
     안 쓰이므로 없는 편이 정확합니다. */
  const feats = {};
  POSE.PRIMARY.concat(POSE.AUX).forEach((k) => {
    const vals = CAL.samples.map((s) => s.f[k]).filter((x) => x !== undefined);
    if (vals.length < CAL_MIN_PER_FEATURE) return;
    const m = POSE.median(vals);
    feats[k] = { median: m, mad: POSE.mad(vals, m), n: vals.length };
  });
  if (Object.keys(feats).length < 3) {
    return fail('기준으로 쓸 만한 값이 부족해요. 조명이 밝은 곳에서 다시 해 주세요.');
  }

  BASELINE[CAL.zone] = {
    version: 3,
    features: feats,
    shoulderWidthMedian: POSE.median(CAL.widths),
    sampleCount: CAL.samples.length,
    createdAt: Date.now(),
  };
  saveBaseline();

  LIVE.profile = feats;
  LIVE.arb = POSE.arbiter();
  camMsg.hidden = true;
  setState('good', Object.keys(feats).length + '개 축으로 기준을 맞췄어요');
  poseRunning = true; poseLoop();
}

/* ==================================================================
   미니룸의 창

   싸이월드 미니룸이 그랬듯, 방 안의 물건이 곧 메뉴입니다. 걸어가서
   스페이스를 누르면 그 물건이 맡은 창이 열립니다 — 상단 메뉴바도,
   화면 전환도 없습니다.

   설정만 예외로 오른쪽 위 버튼입니다. 방 안 어디서든 눌러야 하는데
   그걸 맡을 물건을 하나 더 놓으면 방이 복잡해집니다.
   ================================================================== */
const panelEl = document.getElementById('panel');
const panelTitle = panelEl.querySelector('header b');
const panelKind = panelEl.querySelector('header u');
const panelBody = panelEl.querySelector('.body');
const panelTabs = panelEl.querySelector('.tabs');

/* 아직 서버가 없어 숫자는 이 기기에 남습니다. 지어낸 값이 아니라
   실제로 이 브라우저에서 쌓인 것만 보여 줍니다. */
const ROOM = {
  nickname: '익명의 기린',
  school: '명지대학교',
  schoolVerifiedAt: '',
  schoolDomain: '',
  character: '거북이',
  coins: 0,
  wallpaper: 'cream',
  floor: 'laminate',
  music: 'none',
  invite: null,
  owned: [],          // 산 아이템 id
  worn: {},           // 칸(top/bottom/shoes/hat) → 아이템 id
};
try {
  Object.assign(ROOM, JSON.parse(localStorage.getItem('girin.room') || '{}'));
} catch { /* 저장된 게 깨졌으면 기본값으로 갑니다 */ }
/* 저장된 판이 이 필드들보다 오래됐을 수 있습니다 */
if (!Array.isArray(ROOM.owned)) ROOM.owned = [];
if (!ROOM.worn || typeof ROOM.worn !== 'object') ROOM.worn = {};
function saveRoom() {
  try { localStorage.setItem('girin.room', JSON.stringify(ROOM)); } catch { /* 무시 */ }
}
/* 초기 UTF-8 선언이 없던 버전에서 저장된 닉네임은 replacement character
   (�)를 포함할 수 있습니다. 이름표는 DOM 텍스트라 폰트를 바꿔도 복구되지
   않으므로, 깨진 저장값만 안전한 기본값으로 한 번 교정합니다. */
if (typeof ROOM.nickname !== 'string' || ROOM.nickname.includes('\uFFFD')) {
  ROOM.nickname = '익명의 기린';
  saveRoom();
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ==================================================================
   코인

   버는 규칙이 화면에 적혀만 있고 실제로는 아무것도 쌓이지 않았습니다.
   여기 한 곳에 규칙을 두고, 세션 쪽에서 불러 씁니다.

   **자세가 좋아서 주는 코인은 없습니다.** 앉아 있던 시간과 돌아온 횟수,
   그리고 왔다는 사실에만 줍니다 — 자세로 주면 목이 긴 사람이 유리한
   게임이 됩니다.

   코인은 세션 종료와 회복 성공처럼 실제 행동이 확정될 때만 지급합니다. */
const COIN = {
  perRecovery: 5,      // 회복 성공 1회
  maxRewardedRecoveries: 5,
};
const SESSION_COIN_REWARDS = [
  { min: 50, points: 60 },
  { min: 30, points: 40 },
  { min: 15, points: 30 },
  { min: 5, points: 10 },
];
const STREAK_MILESTONES = [
  { days: 3, points: 10 },
  { days: 7, points: 25 },
  { days: 14, points: 50 },
  { days: 30, points: 100 },
  { days: 60, points: 180 },
];
const PRICE = { wear: [150, 250], acc: [100, 200], egg: 800, eggRare: 2000 };

function kstDateKey(at = Date.now()) {
  return new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit',
  }).format(at);
}
const today = () => kstDateKey();
function kstDateDaysAgo(days) {
  return kstDateKey(Date.now() - days * 86400000);
}
function sessionCompletionCoins(minutes) {
  return SESSION_COIN_REWARDS.find((reward) => minutes >= reward.min)?.points || 0;
}
function streakMilestone(days) {
  return STREAK_MILESTONES.find((milestone) => milestone.days === days) || null;
}
function loadJSON(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
}
function saveJSON(key, v) {
  try { localStorage.setItem(key, JSON.stringify(v)); } catch { /* 무시 */ }
}

/** 오늘 얼마나 벌었는지. 날짜가 바뀌면 0 부터 다시 셉니다. */
function coinDay() {
  const d = loadJSON('girin.coinday', null);
  if (!d || d.date !== today()) return { date: today(), earned: 0 };
  return d;
}
/** 상한에 걸리면 걸린 만큼만 줍니다. 준 액수를 돌려줍니다. */
function earn(amount, why) {
  if (amount <= 0) return 0;
  const d = coinDay();
  const give = amount;
  d.earned += give; saveJSON('girin.coinday', d);
  ROOM.coins += give; saveRoom();
  paintCoins(true);
  sfx('coin');
  if (why) coinToast(give, why);
  return give;
}
function spend(amount) {
  if (ROOM.coins < amount) return false;
  ROOM.coins -= amount; saveRoom(); paintCoins(true);
  return true;
}

/** 출석. 10분 이상 유효 집중 세션을 완료했을 때만 호출합니다. */
function markAttendance() {
  const a = loadJSON('girin.attend', { last: '', streak: 0, claimed: [] });
  a.claimed = Array.isArray(a.claimed) ? a.claimed : [];
  const t = today();
  if (a.last === t) return { first: false, streak: a.streak, milestone: null };
  const y = kstDateDaysAgo(1);
  a.streak = a.last === y ? a.streak + 1 : 1;
  a.last = t; saveJSON('girin.attend', a);
  const milestone = streakMilestone(a.streak);
  if (milestone && !a.claimed.includes(milestone.days)) {
    a.claimed.push(milestone.days);
    saveJSON('girin.attend', a);
    return { first: true, streak: a.streak, milestone };
  }
  return { first: true, streak: a.streak, milestone: null };
}

/* ==================================================================
   초대 코드

   서버가 없으니 이 브라우저가 서버 노릇을 합니다. 나중에 Supabase 로
   갈아 끼울 때 **여기 네 함수만** 바꾸면 되도록 모아 뒀습니다 —
   publish 는 upsert, lookup 은 select, revoke 는 delete 가 됩니다.
   부르는 쪽(패널·방문)은 저장소가 무엇인지 모릅니다.

   같은 브라우저 안에서만 도는 것이 이 구현의 한계이고, 그래서 데모용
   코드를 몇 개 심어 둡니다. 그게 없으면 이 기능은 기기 두 대가 있어야
   눌러 볼 수 있습니다.
   ================================================================== */
const INVITE = {
  KEY: 'girin.invites',
  ABC: 'ABCDEFGHJKMNPQRSTUVWXYZ23456789',   // 0/O/1/I 는 뺐습니다 — 받아적다 틀립니다
  LEN: 6,

  all() { return loadJSON(this.KEY, {}); },
  /** 코드를 등록합니다. → supabase.from('invites').upsert(...) */
  publish(code, profile) {
    const a = this.all();
    a[code] = Object.assign({ at: Date.now() }, profile);
    saveJSON(this.KEY, a);
  },
  /** 코드로 사람을 찾습니다. → supabase.from('invites').select().eq('code', code) */
  lookup(code) { return this.all()[String(code || '').toUpperCase().trim()] || null; },
  /** → supabase.from('invites').delete().eq('code', code) */
  revoke(code) { const a = this.all(); delete a[code]; saveJSON(this.KEY, a); },

  make() {
    let c = '';
    for (let i = 0; i < this.LEN; i++) c += this.ABC[Math.floor(Math.random() * this.ABC.length)];
    return c;
  },
  valid(code) {
    const c = String(code || '').toUpperCase().trim();
    return c.length === this.LEN && [...c].every((ch) => this.ABC.includes(ch));
  },
  /** 내 코드를 만들고 등록합니다. 이미 있으면 프로필만 갱신합니다. */
  mine() {
    if (!ROOM.invite || !this.valid(ROOM.invite)) { ROOM.invite = this.make(); saveRoom(); }
    this.publish(ROOM.invite, {
      nickname: ROOM.nickname, school: ROOM.school, character: ROOM.character, self: true,
    });
    return ROOM.invite;
  },
};

/* 데모용 이웃 둘. 기기가 하나뿐이라 이게 없으면 "유효한 코드" 를 넣어
   볼 방법이 없습니다. 서버가 붙으면 통째로 지웁니다.

   코드에 I·L·O 를 못 쓰는 것은 위 ABC 가 정한 규칙입니다 — 1·I 와 0·O 를
   받아적다 틀리기 때문입니다. 데모 코드도 같은 규칙을 지켜야 합니다. */

/** 이 기기에 쌓인 세션 기록. 없으면 없다고 말합니다. */
function myStats() {
  let rows = [];
  try { rows = JSON.parse(localStorage.getItem('girin.sessions') || '[]'); } catch { /* 무시 */ }
  const total = rows.reduce((a, r) => a + (r.minutes || 0), 0);
  const recov = rows.reduce((a, r) => a + (r.recoveries || 0), 0);
  return { count: rows.length, total, recov };
}

/** 시즌은 90일. 남은 날이 보여야 "이번 시즌 안에" 라는 말이 성립합니다. */
function seasonInfo() {
  const LEN = 90, START = Date.UTC(2026, 0, 5);       // 시즌 4 시작
  const days = Math.floor((Date.now() - START) / 86400000);
  const no = 4 + Math.floor(days / LEN);
  const into = ((days % LEN) + LEN) % LEN;
  const from = new Date(START + (no - 4) * LEN * 86400000);
  const to = new Date(from.getTime() + (LEN - 1) * 86400000);
  const fmt = (d) => (d.getUTCMonth() + 1) + '월 ' + d.getUTCDate() + '일';
  return { no, daysLeft: LEN - into, progress: into / LEN, from: fmt(from), to: fmt(to) };
}

/** 예시 값에 이 기기의 진짜 기록을 얹어 정렬합니다. */
function schoolRanking() {
  const s = myStats();
  const rows = SEED_RANKING.map((r) => Object.assign({}, r));
  const mine = rows.find((r) => r.school === ROOM.school);
  if (mine) {
    mine.hours += Math.round(s.total / 60);
    mine.recoveries += s.recov;
  } else if (ROOM.school) {
    rows.push({ school: ROOM.school, hours: Math.round(s.total / 60), recoveries: s.recov });
  }
  return rows.sort((a, b) => b.hours - a.hours || b.recoveries - a.recoveries);
}

function tickGiraffeNeck() {
  if (!GIRAFFE_NECK.active) return;
  const now = Date.now();
  if (now - GIRAFFE_NECK.lastTapAt > 700) GIRAFFE_NECK.combo = 0;
  GIRAFFE_NECK.angle = Math.min(GIRAFFE_START_ANGLE, GIRAFFE_NECK.angle + .14);
  if (GIRAFFE_NECK.angle <= GIRAFFE_TARGET_ANGLE) return finishGiraffeNeck(true);
  if (now - GIRAFFE_NECK.startedAt >= 10000) return finishGiraffeNeck(false);
  renderGiraffeNeck();
}
function tapGiraffeNeck() {
  if (!GIRAFFE_NECK.active) return;
  const now = Date.now();
  GIRAFFE_NECK.combo = now - GIRAFFE_NECK.lastTapAt <= 700 ? GIRAFFE_NECK.combo + 1 : 1;
  GIRAFFE_NECK.lastTapAt = now;
  const lift = Math.min(1.2, .8 + GIRAFFE_NECK.combo * .05);
  GIRAFFE_NECK.angle = Math.max(GIRAFFE_TARGET_ANGLE, GIRAFFE_NECK.angle - lift);
  const message = panelBody.querySelector('#giraffe-message');
  if (message) message.textContent = GIRAFFE_NECK.combo >= 3 ? `${GIRAFFE_NECK.combo} 콤보! 계속 눌러 주세요.` : '좋아요! 목이 펴지고 있어요.';
  renderGiraffeNeck();
  if (GIRAFFE_NECK.angle <= GIRAFFE_TARGET_ANGLE) finishGiraffeNeck(true);
}
function startGiraffeNeck() {
  clearInterval(GIRAFFE_NECK.timer);
  GIRAFFE_NECK.active = true;
  GIRAFFE_NECK.startedAt = Date.now();
  GIRAFFE_NECK.angle = GIRAFFE_START_ANGLE;
  GIRAFFE_NECK.combo = 0;
  GIRAFFE_NECK.lastTapAt = 0;
  GIRAFFE_NECK.rewarded = false;
  GIRAFFE_NECK.timer = setInterval(tickGiraffeNeck, 100);
  renderGiraffeNeck();
}
