          <div class="row"><span>이동 <em>WASD 또는 방향키</em></span><span class="val">기본</span></div>
          <div class="row"><span>상호작용</span><span class="val">Space</span></div>
          <div class="row"><span>미니맵 <em>전체 지도 · 눌러서 이동</em></span><span class="val">M</span></div>
        </div>
        <p class="hint">소리는 브라우저 정책상 화면을 한 번 누르거나 키를 눌러야
        납니다. 그전까지 조용한 것은 고장이 아니에요.</p>
        <div class="note">카메라 영상과 관절 좌표는 어떤 서버에도 보내지 않습니다.
        나가는 것은 “몇 분 앉았는지” 같은 숫자뿐이에요.</div>`,
      ],
    };
  },
};

let panelOpen = false, activePanelKey = '';
function openPanel(key) {
  const spec = PANELS[key] && PANELS[key]();
  if (!spec) return;
  panelTitle.textContent = spec.title;
  panelKind.textContent = spec.kind;
  panelTabs.innerHTML = '';
  panelTabs.hidden = !spec.tabs;

  if (spec.tabs) {
    spec.tabs.forEach((name, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = name;
      b.setAttribute('aria-selected', String(i === 0));
      b.addEventListener('click', () => {
        [...panelTabs.children].forEach((c, j) => c.setAttribute('aria-selected', String(i === j)));
        panelBody.innerHTML = spec.tabHtml[i];
      });
      panelTabs.append(b);
    });
    panelBody.innerHTML = spec.tabHtml[0];
  } else {
    panelBody.innerHTML = spec.html;
  }

  panelEl.classList.add('on');
  panelOpen = true;
  activePanelKey = key;
  keys.clear();
  if (key === 'giraffeNeck') startGiraffeNeck();
  panelEl.querySelector('header button').focus();
}
function closePanel() {
  if (GIRAFFE_NECK.active) {
    GIRAFFE_NECK.active = false;
    clearInterval(GIRAFFE_NECK.timer);
  }
  panelEl.classList.remove('on'); panelOpen = false; activePanelKey = '';
}
panelEl.querySelector('header button').addEventListener('click', closePanel);
panelEl.addEventListener('click', (e) => { if (e.target === panelEl) closePanel(); });
panelBody.addEventListener('click', (e) => {
  if (e.target.closest('[data-do="giraffe-restart"]')) return startGiraffeNeck();
  if (e.target.closest('[data-do="giraffe-tap"]')) tapGiraffeNeck();
});

/* ---- 값 고치기 ----
   업라이트 마이페이지의 편집 흐름을 그대로 옮겼습니다. 다만 모달을
   하나 더 띄우지 않고 **그 행 자리에서** 입력칸으로 바뀝니다 — 창 위에
   창이 겹치면 어느 것을 닫는지 헷갈립니다.

   학교는 글자를 직접 고칠 수 없습니다. 가입할 때 학교 메일로 인증한
   소속이라, 여기서 아무 이름이나 적을 수 있으면 인증이 의미를 잃습니다.
   학교를 옮겼거나 인증이 만료된 사람을 위해 **다시 인증**으로만 엽니다. */
const EDITS = {
  nickname: {
    label: '닉네임', hint: '2~12자', max: 12,
    validate: (v) => !nicknameValidation(v),
    error: nicknameValidation,
    apply: (v) => { ROOM.nickname = v.trim(); },
  },
  school: {
    label: '학교 이메일', hint: 'ac.kr 로 끝나는 학교 메일', max: 60,
    type: 'email',
    validate: (v) => /^[^@\s]+@[^@\s]+\.ac\.kr$/i.test(v.trim()),
    apply: (v) => {
      /* 도메인에서 학교를 읽습니다. 실제 인증은 서버가 메일을 보내야
         가능하므로, 지금은 입력을 받아 두기만 합니다. */
      const host = v.trim().split('@')[1].toLowerCase();
      ROOM.schoolDomain = host;
      ROOM.school = SCHOOL_BY_DOMAIN[host] || host.replace(/\.ac\.kr$/, '') + ' (미확인)';
      const d = new Date();
      ROOM.schoolVerifiedAt = d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월';
      applySchoolColor();
    },
    note: '인증 메일을 보내는 것은 서버가 붙은 뒤예요. 지금은 적어 두기만 합니다.',
  },
};

/* 닉네임 필터 — 화면 표시용 원문은 보존하고, 검사할 때만 정규화합니다.
   공백·기호를 제거해 "시 발", "시.발" 같은 간단한 우회를 막습니다.
   짧은 목록으로 시작하고, 오탐 사례가 나오면 목록을 조정합니다. */
const NICKNAME_BLOCKLIST = [
  '씨발', '시발', 'ㅅㅂ', 'ㅆㅂ', '개새끼', '개새', '새끼',
  '병신', '븅신', 'ㅂㅅ', '지랄', '니미', '좆', '존나', '좃',
  '보지', '자지', '창녀', 'fuck', 'shit', 'bitch', 'asshole',
];
function normalizeNicknameForFilter(value) {
  return value.normalize('NFKC').toLowerCase()
    .replace(/[\s\p{P}\p{S}_]+/gu, '');
}
function nicknameValidation(value) {
  const nickname = value.trim();
  if (nickname.length < 2 || nickname.length > 12) return '닉네임은 2~12자로 입력해 주세요.';
  if(/[\u0000-\u001F\u007F]/.test(nickname)) return '사용할 수 없는 문자가 있어요.';
  const normalized = normalizeNicknameForFilter(nickname);
  if (NICKNAME_BLOCKLIST.some((word) => normalized.includes(word))) {
    return '비속어가 포함된 닉네임은 사용할 수 없어요.';
  }
  return '';
}

function openEdit(key, row) {
  const spec = EDITS[key];
  if (!spec || !row) return;
  const box = document.createElement('div');
  box.className = 'edit';
  box.innerHTML = '<input type="' + (spec.type || 'text') + '" maxlength="' + spec.max
    + '" placeholder="' + spec.hint + '" aria-label="' + spec.label + '">'
    + '<button class="act" data-do="edit-save">저장</button>'
    + '<button class="act ghost" data-do="edit-cancel">취소</button>';
  row.replaceWith(box);
  const input = box.querySelector('input');
  input.value = key === 'nickname' ? ROOM.nickname : '';
  if (spec.note) {
    const h = document.createElement('p');
    h.className = 'hint'; h.textContent = spec.note;
    box.after(h);
  }
  input.focus(); input.select();
  box.dataset.key = key;
  const error = document.createElement('p');
  error.className = 'edit-error';
  error.setAttribute('aria-live', 'polite');
  box.append(error);
  const save = box.querySelector('[data-do="edit-save"]');
  const sync = () => {
    const message = spec.error ? spec.error(input.value) : (spec.validate(input.value) ? '' : '입력값을 확인해 주세요.');
    save.disabled = Boolean(message);
    save.style.opacity = save.disabled ? .45 : 1;
    error.textContent = message;
  };
  input.addEventListener('input', sync);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !save.disabled) save.click();
    if (e.key === 'Escape') box.querySelector('[data-do="edit-cancel"]').click();
  });
  sync();
}

/* 창 안의 조작 — 위임 하나로 받습니다 */
panelBody.addEventListener('keydown', (e) => {
  /* 코드를 치고 엔터. 버튼까지 탭으로 옮겨 가게 하면 여섯 자 넣는 일이
     열 번 누르는 일이 됩니다. */
  if (e.key === 'Enter' && e.target.id === 'invite-in') {
    e.preventDefault();
    panelBody.querySelector('[data-do="visit"]')?.click();
    return;
  }
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const tap = e.target.closest('.row.tap');
  if (!tap) return;
  e.preventDefault();
  openEdit(tap.dataset.edit, tap);
});
panelBody.addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (chip) {
    const group = chip.closest('.chips').dataset.group;
    [...chip.parentNode.children].forEach((c) => c.setAttribute('aria-pressed', 'false'));
    chip.setAttribute('aria-pressed', 'true');
    ROOM[group] = chip.dataset.v; saveRoom();
    /* 학교를 고르면 과잠·이름표·강조색이 그 자리에서 바뀝니다.
       인증 여부는 건드리지 않습니다 — 고르는 것과 인증은 다른 일입니다. */
    if (group === 'school') applySchoolColor();
    return;
  }
  /* ---- 상점 ---- */
  const buy = e.target.closest('[data-buy]');
  if (buy) {
    const it = SHOP_BY_ID[buy.dataset.buy];
    if (!it) return;
    if (!spend(it.price)) { sfx('deny'); return; }
    ROOM.owned.push(it.id);
    equip(it.id);                        // 산 것은 바로 입혀 줍니다
    saveRoom(); sfx('buy'); reopenShop();
    return;
  }
  const on = e.target.closest('[data-on]');
  if (on) { equip(on.dataset.on); saveRoom(); sfx('sit'); reopenShop(); return; }
  const off = e.target.closest('[data-off]');
  if (off) { unequip(off.dataset.off); saveRoom(); sfx('sit'); reopenShop(); return; }

  const tog = e.target.closest('[data-toggle]');
  if (tog) {
    const k = tog.dataset.toggle;
    SOUND[k] = !SOUND[k];
    tog.setAttribute('aria-pressed', String(SOUND[k]));
    saveSound(); syncSound();
    /* 켠 순간 소리가 나야 켜진 걸 압니다 */
    if (SOUND[k]) { wakeAudio(); if (k === 'sfx') sfx('door'); }
    return;
  }
  const tap = e.target.closest('.row.tap');
  if (tap) return openEdit(tap.dataset.edit, tap);
  const act = e.target.closest('[data-do]');
  if (!act) return;
  const what = act.dataset.do;
  if (what === 'giraffe-restart') {
    startGiraffeNeck();
    return;
  }
  if (what === 'edit-save' || what === 'edit-cancel') {
    const box = act.closest('.edit');
    if (what === 'edit-save') {
      const spec = EDITS[box.dataset.key];
      const v = box.querySelector('input').value;
      if (!spec.validate(v)) return;
      spec.apply(v); saveRoom();
    }
    /* 값이 여러 탭에 걸쳐 있으므로 탭 전체를 다시 그립니다 */
    const tabs = panelTabs.querySelectorAll('button');
    const active = [...tabs].findIndex((b) => b.getAttribute('aria-selected') === 'true');
    openPanel('settings');
    if (active > 0) panelTabs.querySelectorAll('button')[active].click();
    return;
  }
  if (what === 'close') closePanel();
  else if (what === 'sit') {
    closePanel();
    const spot = zone.sitSpots[0];
    if (spot) sit(spot);
  } else if (what === 'new-session') { newSession();
  } else if (what === 'copy') {
    navigator.clipboard?.writeText(ROOM.invite);
    act.textContent = '복사됨';
    setTimeout(() => { act.textContent = '복사'; }, 1400);
  } else if (what === 'regen') {
    /* 옛 코드는 끊습니다. 새로 만들었는데 옛 코드로도 들어와지면
       "새로 만들기" 가 아무 뜻이 없습니다. */
    if (ROOM.invite) INVITE.revoke(ROOM.invite);
    ROOM.invite = null; saveRoom(); INVITE.mine();
    openPanel('settings');
    panelTabs.querySelectorAll('button')[2].click();
  } else if (what === 'visit') {
    const input = panelBody.querySelector('#invite-in');
    const msg = panelBody.querySelector('#invite-msg');
    const r = visitRoom(input ? input.value : '');
    if (!r.ok && msg) {
      msg.textContent = r.msg;
      msg.style.color = 'var(--warn)';
      input?.focus(); input?.select();
      sfx('deny');
    }
  }
});

/* 같은 칸의 다른 옷을 입으면 앞엣것은 자동으로 벗겨집니다 —
   상의를 두 벌 겹쳐 입을 일이 없습니다. */
function equip(id) {
  const it = SHOP_BY_ID[id];
  if (!it || !owns(id)) return;
  if (it.cat === 'egg') ROOM.character = EGG_CHARACTER[id] || ROOM.character;
  else ROOM.worn[it.cat] = id;
}
function unequip(id) {
  const it = SHOP_BY_ID[id];
  if (!it || it.cat === 'egg') return;   // 알은 벗을 수 없습니다. 다른 알로 바꿀 뿐입니다
  if (ROOM.worn[it.cat] === id) delete ROOM.worn[it.cat];
}
/** 산 뒤에도 보던 칸에 그대로 남아야 합니다 — 매번 상의로 튕기면
    신발 세 켤레를 사는 데 열 번을 눌러야 합니다. */
function reopenShop() {
  const tabs = [...panelTabs.querySelectorAll('button')];
  const active = Math.max(0, tabs.findIndex((b) => b.getAttribute('aria-selected') === 'true'));
  openPanel('shop');
  panelTabs.querySelectorAll('button')[active]?.click();
}

/* ---- 친구 방으로 ----
   코드를 확인하고, 맞으면 그 사람의 기숙사로 넘어갑니다. 틀린 이유마다
   다른 문장을 돌려줍니다 — "잘못된 코드입니다" 하나로 묶으면 오타인지
   없는 코드인지 사용자가 알 수 없습니다. */
function visitRoom(code) {
  const c = String(code || '').toUpperCase().trim();
  if (!c) return { ok: false, msg: '코드를 넣어 주세요.' };
  if (!INVITE.valid(c))
    return { ok: false, msg: '코드는 영문·숫자 6자예요. 0·O·1·I 는 쓰지 않습니다.' };
  if (c === ROOM.invite)
    return { ok: false, msg: '내 코드예요. 친구에게 받은 코드를 넣어 주세요.' };
  const p = INVITE.lookup(c);
  if (!p)
    return { ok: false, msg: '그런 코드가 없어요. 오타이거나, 친구가 코드를 새로 만들었을 수 있어요.' };

  VISIT.host = p; VISIT.code = c;
  applySchoolColor();                    // 방 소품이 친구 학교 색으로
  closePanel();
  enterZone('dorm', 3, 5);
  return { ok: true, msg: p.nickname + '님의 기숙사' };
}
function leaveVisit() {
  if (!VISIT.host) return;
  VISIT.host = null; VISIT.code = null;
  applySchoolColor();
  enterZone('dorm', 3, 5);
}
document.getElementById('visit-out').addEventListener('click', leaveVisit);

/* 설정 버튼 — 미니룸에서만 */
/* 코인 — 값이 바뀌면 한 번 튕겨서 알려 줍니다. 숫자만 조용히 바뀌면
   모았다는 느낌이 없습니다. */
const coinBtn = document.getElementById('coin');
const coinNum = coinBtn.querySelector('b');
function paintCoins(pop) {
  coinNum.textContent = ROOM.coins;
  if (!pop) return;
  coinBtn.classList.remove('pop'); void coinBtn.offsetWidth; coinBtn.classList.add('pop');
}
/* 왜 받았는지를 그 자리에서 한 줄로 말합니다. 숫자만 늘면 어디서 받은
   건지 모르고, 모르면 다시 하게 만들지 못합니다. */
function coinToast(amount, why) {
  const t = document.createElement('div');
  t.className = 'coin-toast';
  t.innerHTML = '<b>+' + amount + '</b>' + esc(why);
  document.body.append(t);
  setTimeout(() => t.remove(), 2200);
}
coinBtn.addEventListener('click', () => openPanel('coins'));
paintCoins(false);

/* 세션 종료 — 카메라를 내리고 회고를 엽니다. 다시 시작하려면 명시적으로
   눌러야 합니다: 끝냈다는 감각이 있어야 다음 세션이 새로 시작됩니다. */
const sessEnd = document.getElementById('sess-end');
const sessBox = document.getElementById('hud-session');
const sessTime = document.getElementById('sess-time');
function endSession() {
  if (SESSION.ended) return;
  if (player.sitting) stand();
  SESSION.ended = true;
  /* 보상·출석은 월드 체류 시간이 아니라 실제로 의자에 앉아 있던 시간으로 계산합니다. */
  const mins = Math.floor(SESSION.seatedMs / 60000);
  const completionCoins = sessionCompletionCoins(mins);
  if (completionCoins) earn(completionCoins, `${mins}분 세션 완주`);
  if (mins >= 10) {
    const attendance = markAttendance();
    if (attendance.milestone) {
      earn(attendance.milestone.points, `${attendance.streak}일 연속 출석`);
    }
  }
  /* 이번 세션을 기록에 남깁니다 — 마이페이지·명예의 전당이 이걸 읽습니다 */
  const rows = loadJSON('girin.sessions', []);
  rows.push({ at: Date.now(), minutes: Math.round(mins),
              seated: Math.round(SESSION.seatedMs / 60000), recoveries: LIVE.recoveries });
  saveJSON('girin.sessions', rows.slice(-200));
  sessBox.classList.add('done');
  sessEnd.textContent = '회고 보기';
  openPanel('retro');
}
function newSession() {
  SESSION.startedAt = Date.now();
  SESSION.seatedMs = 0; SESSION.seatedAt = 0; SESSION.ended = false;
  LIVE.goodMs = 0; LIVE.warnMs = 0; LIVE.badMs = 0;
  LIVE.recoveries = 0; LIVE.wasBad = false;
  LIVE.rewardedRecoveries = 0;
  sessBox.classList.remove('done');
  sessEnd.textContent = '세션 종료';
  closePanel();
}

sessEnd.addEventListener('click', () => (SESSION.ended ? openPanel('retro') : endSession()));

const gearBtn = document.getElementById('gear');
gearBtn.addEventListener('click', () => openPanel('settings'));

/* ================== 루프 ================== */
let last = performance.now(), gameFrames = 0, gameFps = 0, fpsClock = last, drawCount = 0;

function update(dt) {
  if (portalCooldown > 0) portalCooldown -= dt;
  if (!player.sitting && !dialogOpen && !panelOpen) {
    const run = keys.has('shift');
    const speed = (run ? 92 : 54) * dt;
    let dx = 0, dy = 0;
    if (keys.has('w') || keys.has('arrowup')) dy -= 1;
    if (keys.has('s') || keys.has('arrowdown')) dy += 1;
    if (keys.has('a') || keys.has('arrowleft')) dx -= 1;
    if (keys.has('d') || keys.has('arrowright')) dx += 1;
    player.moving = dx !== 0 || dy !== 0;
    if (player.moving) {
      const len = Math.hypot(dx, dy);
      dx = dx / len * speed; dy = dy / len * speed;
      if (canStand(player.x + dx, player.y)) player.x += dx;
      if (canStand(player.x, player.y + dy)) player.y += dy;
      if (Math.abs(dx) > Math.abs(dy)) { player.dir = 'side'; player.flip = dx < 0; }
      else if (dy !== 0) player.dir = dy < 0 ? 'up' : 'down';
      player.anim += dt * (run ? 11 : 7);
      player.frame = Math.floor(player.anim);
    } else { player.anim = 0; player.frame = 0; }

    if (portalCooldown <= 0) {
      const tx = Math.floor(player.x / T), ty = Math.floor((player.y - 1) / T);
      for (const p of zone.portals)
        if (tx >= p.x && tx < p.x + p.w && ty >= p.y && ty < p.y + p.h) {
          enterZone(p.to, p.sx, p.sy); break;
        }
    }
  }
  nearby = findNearby();

  const maxX = zone.w * T - VIEW_W, maxY = zone.h * T - VIEW_H;
  const tx = player.x - VIEW_W / 2, ty = player.y - VIEW_H / 2 - T;
  camX = Math.round(maxX <= 0 ? maxX / 2 : Math.max(0, Math.min(maxX, tx)));
  camY = Math.round(maxY <= 0 ? maxY / 2 : Math.max(0, Math.min(maxY, ty)));
}

/** y 정렬 키. 발 위치가 먼저, 같으면 x 로 갈라 순서를 고정합니다.
    동점을 그대로 두면 sort 가 불안정해 매 프레임 순서가 뒤집힙니다. */
function sortKey(foot, x) { return foot * 4096 + x; }

const DRAW_ITEMS = [];

function draw() {
  drawCount = 0;
  /* 지도 밖 여백. 페이지가 밝아졌으니 여기도 밝아야 액자가 안 생깁니다. */
  ctx.fillStyle = '#EFE7E2'; ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  const x0 = Math.max(0, Math.floor(camX / T)), y0 = Math.max(0, Math.floor(camY / T));
  const x1 = Math.min(zone.w - 1, Math.ceil((camX + VIEW_W) / T));
  const y1 = Math.min(zone.h - 1, Math.ceil((camY + VIEW_H) / T));

  /* 바닥은 실내든 야외든 한 장입니다 — 야외 포장은 bakeGround 가 잔디 위에
     미리 얹어 둡니다. 예전에는 야외만 칸마다 오토타일을 다시 골라 그렸고,
     그것이 광장이 실내보다 다섯 배 느렸던 이유입니다. */
  const floor = zone.floor || zone.ground;
  if (floor) { ctx.drawImage(floor, -camX, -camY); drawCount++; }

  /* 손으로 그린 실내 벽. 바닥 위, 소품 아래에 깝니다 — Kenney 벽돌
     위를 덮어 겉과 속의 결을 맞춥니다. */
  if (zone.walls) {
    for (const w of zone.walls) {
      ctx.drawImage(w.c, w.x * T - camX, w.y * T - camY);
      drawCount++;
    }
  }

  ctx.save();
  ctx.globalAlpha = 0.24 + Math.sin(performance.now() / 400) * 0.08;
  ctx.fillStyle = '#FF6B52';
  for (const p of zone.portals) ctx.fillRect(p.x * T - camX, p.y * T - camY, p.w * T, p.h * T);
  ctx.restore();

  /* y 로 정렬해 겹칩니다. 없으면 캐릭터가 건물 앞에 붙어 평면이 됩니다.
     배열은 프레임마다 새로 만들지 않고 비워 씁니다. */
  const items = DRAW_ITEMS; items.length = 0;
  for (const p of zone.props) {
    const d = PROP[p.kind];
    if (p.x > x1 + 3 || p.x + d.w < x0 - 1 || p.y > y1 + 3 || p.y + d.h < y0 - 1) continue;
    /* 정렬 기준은 **바닥에 닿는 줄**입니다. d.anchor 를 주면 그 줄을,
       없으면 맨 아랫줄을 씁니다 — 가로등처럼 위가 튀어나온 물건은
       스프라이트 높이와 발 위치가 다릅니다. */
    items.push({ sort: sortKey((p.y + (d.anchor ?? d.h)) * T, p.x * T), kind: 'prop', p, d });
  }
  for (const n of zone.npcs) items.push({ sort: sortKey((n.y + 1) * T, n.x * T), kind: 'npc', n });
  /* 같은 줄에 섰을 때는 플레이어가 앞에 옵니다. 동점이면 정렬이 프레임마다
     뒤바뀌어 캐릭터가 물건 앞뒤로 깜빡였습니다. */
  items.push({ sort: sortKey(player.y, player.x) + 0.5, kind: 'player' });
  if (window.MP) MP.collect(items);   // 다른 플레이어 — multiplayer.js
  items.sort((a, b) => a.sort - b.sort);

  for (const it of items) {
    if (it.kind === 'prop') {
      const { p, d } = it;
      if (d.s === 'img') {
        /* 직접 그린 건물은 한 장이라 drawImage 한 번이면 끝납니다.
           타일로 쌓으면 큰 건물 하나에 100 번이 넘게 듭니다. */
        ctx.drawImage(d.canvas, p.x * T - camX, p.y * T - camY);
        drawCount++;
      } else {
        const blit = BLIT[d.s];
        for (let j = 0; j < d.h; j++) for (let i = 0; i < d.w; i++) {
          blit(d.t[j][i], (p.x + i) * T - camX, (p.y + j) * T - camY);
          drawCount++;
        }
      }
    } else if (it.kind === 'npc') {
      blitU(it.n.sprite, it.n.x * T - camX, it.n.y * T - camY);
      drawCount++;
      if (nearby?.kind === 'talk' && nearby.npc === it.n) {
        ctx.fillStyle = '#FF6B52';
        const bob = Math.sin(performance.now() / 200) * 1.5;
        ctx.fillRect(it.n.x * T - camX + 7, it.n.y * T - camY - 6 + bob, 2, 4);
        ctx.fillRect(it.n.x * T - camX + 7, it.n.y * T - camY - 1 + bob, 2, 2);
      }
    } else if (it.kind === 'mp') { MP.drawOne(it.rp); drawCount++;
    } else { drawPlayer(); drawCount++; }
  }

  /* 벽시계 바늘 — 진짜 시각. 방에 있는 동안 분침이 움직입니다. */
  if (zone.clock) {
    const now = new Date();
    const cx = zone.clock.x * T + 8 - camX;
    const cy = zone.clock.y * T + 22 - camY;
    const mm = (now.getMinutes() + now.getSeconds() / 60) / 60 * Math.PI * 2;
    const hh = ((now.getHours() % 12) + now.getMinutes() / 60) / 12 * Math.PI * 2;
    ctx.strokeStyle = '#2A3440'; ctx.lineCap = 'butt';
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.sin(hh) * 4.2, cy - Math.cos(hh) * 4.2); ctx.stroke();
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.sin(mm) * 6.4, cy - Math.cos(mm) * 6.4); ctx.stroke();
    ctx.fillStyle = '#C2412C';
    ctx.fillRect(cx - 1, cy - 1, 2, 2);
    drawCount++;
  }

}

/* ---- 과잠 ----
   캐릭터 넉 장(아래·미사용·위·옆)이 시트에서 4×3 블록으로 붙어 있습니다.
   그 블록만 한 번 떠서 몸통 줄을 학교 색으로 덮어 둡니다.

   source-atop 을 쓰는 이유는, 사각형으로 덮되 **캐릭터가 그려진 칸에만**
   묻어야 하기 때문입니다. 그냥 칠하면 캐릭터 옆 빈칸까지 색띠가 됩니다.

   학교가 바뀌면 jacketCanvas 를 비우고 다음 프레임에 다시 굽습니다 —
   매 프레임 다시 만들면 광장에서 고친 것을 여기서 도로 까먹습니다. */
const CHAR_SHEET_COL = 23, CHAR_SHEET_W = 4, CHAR_SHEET_H = 3;
let jacketCanvas = null;
function playerSheet() {
  if (jacketCanvas) return jacketCanvas;
  const c = canvasOf(CHAR_SHEET_W, CHAR_SHEET_H), g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.drawImage(urban, CHAR_SHEET_COL * T, 0, c.width, c.height, 0, 0, c.width, c.height);
  g.globalCompositeOperation = 'source-atop';
  const col = schoolColor();
  for (let r = 0; r < CHAR_SHEET_H; r++) {
    px(g, 0, r * T + 8, c.width, 5, col);
    px(g, 0, r * T + 8, c.width, 1, 'rgba(255,255,255,.28)');   // 어깨선
    px(g, 0, r * T + 12, c.width, 1, 'rgba(0,0,0,.22)');        // 밑단 그늘
  }
  g.globalCompositeOperation = 'source-over';
  jacketCanvas = c;
  return c;
}

function drawPlayer() {
  const dx = Math.round(player.x - T / 2 - camX), dy = Math.round(player.y - T - camY);
  ctx.save();
  ctx.globalAlpha = 0.22; ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(dx + T / 2, dy + T - 1, 5, 2.2, 0, 0, 7); ctx.fill();
  ctx.restore();

  const col = DIR_COL[player.dir];
  const rowI = player.moving ? WALK_ROW[player.frame & 3] : 0;
  const idx = CHAR_BASE + rowI * U_COLS + col;
  /* 시트가 아니라 과잠을 입힌 블록에서 뜹니다. 블록이 시트 23열부터라
     가로 자리를 그만큼 당깁니다. */
  const sheet = playerSheet();
  const sx = (idx % U_COLS - CHAR_SHEET_COL) * T, sy = ((idx / U_COLS) | 0) * T;
  const bob = player.moving && !player.sitting ? (Math.floor(player.anim * 2) % 2 ? -1 : 0) : 0;

  if (player.dir === 'side' && player.flip) {
    ctx.save(); ctx.translate(dx + T, dy + bob); ctx.scale(-1, 1);
    ctx.drawImage(sheet, sx, sy, T, T, 0, 0, T, T); ctx.restore();
  } else {
    ctx.drawImage(sheet, sx, sy, T, T, dx, dy + bob, T, T);
  }

}

const promptEl = document.getElementById('prompt');
const nameTagEl = document.getElementById('nameTag');
const headTimerEl = document.getElementById('headTimer');
const headTimerVal = headTimerEl.querySelector('b');
function syncPrompt() {
  /* 캔버스 자리는 창 크기가 바뀔 때만 움직입니다. 매 프레임 재면 그때마다
     레이아웃을 다시 계산하게 만들어, 그림과 상관없는 비용이 붙습니다. */
  const r = canvasRect();
  const hx = r.left + (player.x - camX) * SCALE;
  const hy = r.top + (player.y - T - camY) * SCALE;
  /* 머리 위에 세 겹이 쌓입니다 — 이름표 · 타이머 · 안내.
     아래에서부터 차곡차곡 올려야 서로 안 가립니다. */
  const live = SESSION.startedAt && !SESSION.ended;
  let top = hy - 2;

  nameTagEl.classList.toggle('on', !dialogOpen);
  if (!dialogOpen) {
    if (nameTagEl.textContent !== ROOM.nickname) nameTagEl.textContent = ROOM.nickname;
    nameTagEl.style.left = hx + 'px';
    nameTagEl.style.top = top + 'px';
    top -= 18;
  }

  headTimerEl.classList.toggle('on', !!live && !dialogOpen);
  if (live && !dialogOpen) {
    headTimerVal.textContent = sessionText();
    headTimerEl.style.left = hx + 'px';
    headTimerEl.style.top = top + 'px';
    top -= 18;
  }

  if (!nearby || dialogOpen) { promptEl.classList.remove('on'); return; }
  promptEl.textContent = nearby.kind === 'sit' ? 'Space · 앉기'
    : nearby.kind === 'stand' ? 'Space · 일어나기'
    : 'Space · ' + nearby.npc.name.split(' · ')[0];
  promptEl.style.left = hx + 'px';
  promptEl.style.top = top - 2 + 'px';
  promptEl.classList.add('on');
}

/* ==================================================================
   미니맵

   캠퍼스는 46×42 이고 화면에는 20×12 만 들어옵니다. 즉 **한 번에 보이는
   것이 지도의 8분의 1** 입니다. 그래서 처음 온 사람은 도서관이 동쪽에
   있다는 것을 걸어 보고서야 압니다.

   전체를 한 장으로 미리 그려 두고(bakeMinimap), M 으로 펼칩니다.
   프레임마다 다시 그리는 것은 나와 카메라 상자뿐입니다 — 광장에서 고친
   것을 여기서 도로 까먹지 않으려는 것입니다.

   여기서 장소를 누르면 그리로 갑니다. 지도가 "어디에 뭐가 있나" 만
   말하고 데려다주지는 않으면, 결국 다시 걸어야 합니다.
   ================================================================== */
/* 배율 10 — 46×42 칸이 460×420 이 됩니다. 4 로 뒀더니 지도(184×168)가
   장소 이름표보다 작아서 이름끼리 겹쳐 읽히지 않았습니다. 지도는 이름이
   안 겹칠 만큼은 커야 지도입니다. */
const MINI = { on: false, scale: 10, canvas: null, base: null, spots: [] };
let minimapDirty = true;

/* 장소마다 지도 위의 자리와, 눌렀을 때 갈 곳. */
const PLACES = [
  { id: 'dorm',     to: ['dorm', 3, 5],      x: 22, y: 6,  name: '기숙사', key: '1' },
  { id: 'mainhall', to: ['mainhall', 18, 25], x: 7,  y: 19, name: '본관',   key: '2' },
  { id: 'library',  to: ['library', 18, 25],  x: 38, y: 19, name: '도서관', key: '3' },
  { id: 'union',    to: ['union', 16, 21],    x: 23, y: 33, name: '학생회관', key: '4' },
  { id: 'campus',   to: ['campus', 22, 25],   x: 22, y: 21, name: '중앙 광장', key: '5' },
  { id: 'field',    to: ['campus', 8, 8],     x: 8,  y: 7,  name: '운동장', key: '6' },
  { id: 'arcade',   to: ['campus', 38, 8],    x: 38, y: 7,  name: '미니게임존', key: '7' },
  { id: 'lake',     to: ['campus', 6, 29],    x: 6,  y: 35, name: '호수', key: '8' },
  { id: 'clubs',    to: ['campus', 40, 29],   x: 40, y: 35, name: '동아리 거리', key: '9' },
];

/** 캠퍼스 바닥을 줄여 한 장으로 굽습니다. 한 번만 합니다. */
function bakeMinimap() {
  const m = ZONES.campus;
  const S = MINI.scale;
  const c = document.createElement('canvas');
  c.width = m.w * S; c.height = m.h * S;
  const g = c.getContext('2d');
  /* 여기서만 부드럽게 줄입니다. 월드는 픽셀을 지켜야 하지만 지도는
     축소판이라, 각 잡힌 픽셀보다 형태가 뭉개지지 않는 쪽이 낫습니다. */
  g.imageSmoothingEnabled = true;
  /* 구워 둔 야외 바닥을 그대로 줄입니다 — 지도와 세계가 어긋나지 않습니다 */
  if (m.ground) g.drawImage(m.ground, 0, 0, c.width, c.height);
  g.imageSmoothingEnabled = false;

  /* 건물은 지도 위에서 덩어리로 보여야 합니다. 축소한 그림만으로는
     잔디와 지붕이 같은 얼룩이 됩니다. */
  for (const p of m.props) {
    const d = PROP[p.kind];
    if (!d || d.w < 6) continue;                   // 건물만
    const X = p.x * S, Y = p.y * S, W = d.w * S, H = (d.h - 1) * S;
    g.fillStyle = 'rgba(255,255,255,.62)'; g.fillRect(X, Y, W, H);       // 지붕
    g.fillStyle = 'rgba(42,35,32,.55)'; g.fillRect(X, Y + H, W, S);      // 정면
    g.strokeStyle = 'rgba(42,35,32,.45)'; g.lineWidth = 1;
    g.strokeRect(X + .5, Y + .5, W - 1, H + S - 1);
  }
  MINI.base = c;
}

function toggleMinimap(force) {
  MINI.on = force === undefined ? !MINI.on : force;
  document.getElementById('minimap').classList.toggle('on', MINI.on);
  if (MINI.on) drawMinimap();
}

function drawMinimap() {
  if (!MINI.base) bakeMinimap();
  const cvs = MINI.canvas;
  const g = cvs.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.clearRect(0, 0, cvs.width, cvs.height);
  g.drawImage(MINI.base, 0, 0);

  const S = MINI.scale;
  /* 지금 보고 있는 만큼을 상자로 표시합니다. 캠퍼스 밖(실내)일 때는
     상자가 뜻이 없으므로 건너뜁니다. */
  if (zoneId === 'campus') {
    g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 1;
    g.strokeRect(Math.round(camX / T * S) + .5, Math.round(camY / T * S) + .5,
                 Math.round(VIEW_W / T * S), Math.round(VIEW_H / T * S));
    g.fillStyle = '#FF6B52';
    g.fillRect(Math.round(player.x / T * S) - 2, Math.round(player.y / T * S) - 2, 4, 4);
    g.fillStyle = '#FFF';
    g.fillRect(Math.round(player.x / T * S) - 1, Math.round(player.y / T * S) - 1, 2, 2);
  }
}

const minimapEl = document.getElementById('minimap');
MINI.canvas = document.getElementById('minimap-cv');
{
  const m = ZONES.campus;
  MINI.canvas.width = m.w * MINI.scale;
  MINI.canvas.height = m.h * MINI.scale;
  /* 장소 단추를 지도 위에 얹습니다. 캔버스에 글자를 그리면 누를 수
     없고, 누를 수 없으면 지도가 아니라 그림입니다. */
  const holder = document.getElementById('minimap-spots');
  holder.style.width = MINI.canvas.width + 'px';
  holder.style.height = MINI.canvas.height + 'px';
  PLACES.forEach((p) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'spot';
    b.style.left = (p.x * MINI.scale) + 'px';
    b.style.top = (p.y * MINI.scale) + 'px';
    b.innerHTML = '<i></i><span>' + p.name + '</span><kbd>' + p.key + '</kbd>';
    b.addEventListener('click', () => travel(p));
    holder.append(b);
  });
}

/** 지도에서 고른 곳으로 갑니다. */
function travel(p) {
  toggleMinimap(false);
  enterZone(p.to[0], p.to[1], p.to[2]);
}

document.getElementById('minimap-close').addEventListener('click', () => toggleMinimap(false));
minimapEl.addEventListener('click', (e) => { if (e.target === minimapEl) toggleMinimap(false); });

const el = {
  fpsGame: document.getElementById('fps-game'),
  fpsPose: document.getElementById('fps-pose'),
  draws: document.getElementById('draw-count'),
  sitTime: document.getElementById('sit-time'),
  lm: document.getElementById('lm-count'),
};

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw(); syncPrompt();
  /* 미니맵은 펼쳐져 있을 때만 다시 그립니다 */
  if (MINI.on) drawMinimap();
  gameFrames++;
  if (now - fpsClock >= 500) {
    gameFps = Math.round(gameFrames * 1000 / (now - fpsClock));
    poseFps = Math.round(poseFrames * 1000 / (now - fpsClock));
    gameFrames = 0; poseFrames = 0; fpsClock = now;
    el.fpsGame.textContent = gameFps;
    el.fpsGame.className = gameFps < 50 ? 'warn' : '';
    el.fpsPose.textContent = poseRunning ? poseFps : '–';
    el.fpsPose.className = poseRunning && poseFps < 20 ? 'warn' : '';
    el.draws.textContent = drawCount + ' draws';
    el.lm.textContent = LIVE.recoveries;
  }
  if (SESSION.startedAt) {
    el.sitTime.textContent = sessionText();
    if (!SESSION.ended) sessTime.textContent = sessionText();
  }
  requestAnimationFrame(frame);
}

let ready = 0;
let started = false;
async function maybeStart() {
  if (started || ++ready < 3) return;
  started = true;
  /* 표지판·NPC 이름을 canvas 에 굽기 전에 실제 한글 폰트를 준비합니다.
     폰트가 늦게 도착하면 첫 렌더가 폴백 글꼴로 캐시되어 글자가 깨집니다. */
  if (document.fonts) {
    await Promise.allSettled([
      document.fonts.load('8px Galmuri7'),
      document.fonts.load('10px Galmuri9'),
      document.fonts.load('12px Galmuri11'),
      document.fonts.load('14px "Pretendard Variable"'),
    ]);
    await document.fonts.ready;
  }
  school = downscale3(school48);
  /* 야외 바닥을 굽습니다. 시트가 와야 오토타일을 그릴 수 있어 여기입니다. */
  Object.values(ZONES).forEach(bakeGround);
  applySchoolColor();          // 과잠·이름표·소품·강조색
  document.getElementById('boot').classList.add('gone');
  enterZone('dorm', 3, 5);
  requestAnimationFrame(frame);
}
function failed(name) {
  document.getElementById('boot').textContent =
    'assets/' + name + ' 을 못 읽었습니다. 이 파일과 같은 폴더에 assets/ 가 있어야 합니다.';
}
urban.onload = maybeStart;   urban.onerror = () => failed('urban.png');
city.onload = maybeStart;    city.onerror = () => failed('city.png');
school48.onload = maybeStart; school48.onerror = () => failed('school48.png');
urban.src = 'assets/urban.png';
city.src = 'assets/city.png';
school48.src = 'assets/school48.png';
</script>
