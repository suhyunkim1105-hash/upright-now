   빛은 왼쪽 위에서 옵니다 — 밝은 면은 위·왼쪽, 그림자는 아래·오른쪽.
   이 규칙을 어기면 어느 것이 지붕이고 어느 것이 벽인지 안 보입니다.
   ================================================================== */

function px(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(x | 0, y | 0, w | 0, h | 0); }

/** 원. 픽셀아트라 안티앨리어싱 없이 정수 격자로 채웁니다. */
function disc(g, cx, cy, r, c) {
  g.fillStyle = c;
  for (let y = -r; y <= r; y++) {
    const half = Math.floor(Math.sqrt(r * r - y * y));
    g.fillRect(cx - half, cy + y, half * 2 + 1, 1);
  }
}
/** 원 테두리 한 겹 */
function circleLine(g, cx, cy, r, c) {
  g.fillStyle = c;
  for (let a = 0; a < 360; a += 2) {
    const t = a * Math.PI / 180;
    g.fillRect(Math.round(cx + Math.cos(t) * r), Math.round(cy + Math.sin(t) * r), 1, 1);
  }
}

/* ---- 바닥 모양(plan) ----
   건물 여섯 채가 전부 **꽉 찬 직사각형**이었습니다. 나란히 세워 두니
   지붕 위 기물만 다르고 실루엣이 여섯 다 같아서, 멀리서 보면 색칠만
   바꾼 같은 상자였습니다. 그래서 겉모양을 덩이 여러 개로 짭니다.

   plan 은 타일 단위 사각형 목록입니다. 없으면 지금까지대로 꽉 찬 상자.
     x,y,w,h  자리와 크기 (소수 가능 — 그림은 픽셀 단위라 문제없습니다)
     r        모서리 둥글리기(px). 충돌은 타일 단위라 안 바뀝니다
     lift     이 덩이가 몇 층 높은가. 처마와 그림자 방향을 정합니다

   **규칙 하나**: 모든 덩이는 맨 아랫줄까지 내려와야 합니다(y + h === spec.h).
   위에서 내려다보는 그림이라 정면은 맨 아래 두 줄뿐인데, 덩이가 중간에서
   끝나면 그 덩이는 벽 없이 지붕만 떠 있게 됩니다. 실루엣의 변화는
   **뒤쪽과 옆쪽**에서 만듭니다 — 뒤로 튀어나온 덩이, 물러선 어깨, 둥근 모서리. */
function planRects(spec) {
  return spec.plan || [{ x: 0, y: 0, w: spec.w, h: spec.h }];
}
function planPath(spec) {
  const p = new Path2D();
  for (const r of planRects(spec)) {
    if (r.r) p.roundRect(r.x * TS, r.y * TS, r.w * TS, r.h * TS, r.r);
    else p.rect(r.x * TS, r.y * TS, r.w * TS, r.h * TS);
  }
  return p;
}
/** 타일 격자 — 충돌과 처마가 씁니다. 값은 lift+1, 빈 칸은 0.
    타일 한가운데가 덩이 안에 들면 그 타일은 건물입니다. 둥근 모서리는
    바깥 12px 만 깎으므로 32px 타일의 한가운데는 여전히 안쪽입니다 —
    그래서 둥글려도 충돌이 안 바뀝니다. */
function planOcc(spec) {
  const rs = planRects(spec), occ = [];
  for (let j = 0; j < spec.h; j++) {
    occ.push([]);
    for (let i = 0; i < spec.w; i++) {
      let v = 0;
      for (const r of rs) {
        if (i + 0.5 > r.x && i + 0.5 < r.x + r.w && j + 0.5 > r.y && j + 0.5 < r.y + r.h)
          v = Math.max(v, (r.lift || 0) + 1);
      }
      occ[j].push(v);
    }
  }
  return occ;
}

/**
 * 건물 한 채를 캔버스에 그립니다.
 * 맨 아래 두 줄이 정면이고 나머지가 지붕입니다.
 */
function paintBuilding(spec) {
  const W = spec.w * TS, H = spec.h * TS;
  const c = document.createElement('canvas');
  c.width = W; c.height = H; c.__cell = TS;
  const g = c.getContext('2d');
  const P = spec.pal;
  const faceY = H - TS * 2;          // 정면이 시작하는 줄
  const occ = planOcc(spec);

  /* 이 아래로 그리는 것은 전부 바닥 모양 안에서만 보입니다. 덩이마다
     따로 칠하는 대신 한 번 오려 두면, 지붕·이음선·기물·정면이 전부
     같은 실루엣을 자동으로 따릅니다 — 새 모양을 넣을 때 고칠 데가
     plan 한 줄뿐이 됩니다. */
  g.save();
  g.clip(planPath(spec));

  /* ---- 지붕 ---- */
  px(g, 0, 0, W, faceY, P.roof);
  /* 높은 덩이는 아주 옅게 밝힙니다. 색을 따로 주면 딴 건물처럼 갈라져
     보여서, 같은 지붕색 위에 흰 막만 한 겹 씌웁니다. */
  planRects(spec).forEach((r) => {
    if (!r.lift) return;
    px(g, r.x * TS, r.y * TS, r.w * TS, Math.min(r.h * TS, faceY - r.y * TS),
       'rgba(255,255,255,' + Math.min(0.16, 0.07 * r.lift) + ')');
  });
  /* 처마 — 타일 하나하나의 이웃을 보고 두릅니다. 상자였을 때는 바깥
     네 변에 띠 넉 장이면 됐지만, 덩이가 여럿이면 안쪽에도 모서리가
     생깁니다. 빛은 왼쪽 위 — 위·왼쪽이 밝고 아래·오른쪽이 어둡습니다.
     이웃이 나보다 높으면 그쪽에서 그림자를 받습니다. */
  for (let j = 0; j < spec.h; j++) {
    for (let i = 0; i < spec.w; i++) {
      const me = occ[j][i];
      if (!me) continue;
      const x = i * TS, y = j * TS;
      if (y >= faceY) continue;                     // 정면 줄은 벽이 맡습니다
      const up = j ? occ[j - 1][i] : 0;
      const lf = i ? occ[j][i - 1] : 0;
      const rt = i < spec.w - 1 ? occ[j][i + 1] : 0;
      const dn = j < spec.h - 1 ? occ[j + 1][i] : 0;
      const hCap = Math.min(TS, faceY - y);
      if (up < me) px(g, x, y, TS, 2, P.lit);
      if (lf < me) px(g, x, y, 2, hCap, P.lit);
      if (rt < me) px(g, x + TS - 3, y, 3, hCap, P.dark);
      if (dn < me && y + TS < faceY) px(g, x, y + TS - 3, TS, 3, P.dark);
      /* 더 높은 이웃이 위나 왼쪽에 있으면 그 덩이의 그림자가 여기로
         떨어집니다. 이 한 겹이 없으면 높낮이가 색 차이로만 남습니다. */
      if (up > me) px(g, x, y, TS, 5, 'rgba(0,0,0,.20)');
      if (lf > me) px(g, x, y, 5, hCap, 'rgba(0,0,0,.16)');
    }
  }
  px(g, 0, faceY - 3, W, 3, P.dark);                // 지붕이 벽에 닿는 줄
  /* 지붕 패널 이음선 — 밋밋한 색면을 지붕으로 만듭니다 */
  g.fillStyle = P.dark;
  for (let x = 10; x < W - 4; x += 12) g.fillRect(x, 3, 1, faceY - 6);
  g.fillStyle = P.lit;
  for (let x = 11; x < W - 4; x += 12) g.fillRect(x, 3, 1, faceY - 6);

  if (spec.ridge) {
    /* 박공 마룻대 — 길이 방향으로 밝은 띠 하나. 도서관처럼 긴 동에 씁니다. */
    const my = Math.floor(faceY * 0.42);
    px(g, 4, my - 3, W - 8, 3, P.lit);
    px(g, 4, my, W - 8, 2, P.dark);
  }

  /* ---- 옥상 기물 ---- */
  (spec.features || []).forEach((f) => {
    const fx = f.x * TS, fy = f.y * TS;
    if (f.k === 'dome') {
      /* 돔 — 위에서 보면 동심원입니다. 왼쪽 위가 밝습니다. */
      disc(g, fx, fy, f.r + 2, P.dark);
      disc(g, fx, fy, f.r, f.c);
      disc(g, fx - Math.round(f.r * 0.22), fy - Math.round(f.r * 0.22),
           Math.round(f.r * 0.62), f.lit);
      disc(g, fx - Math.round(f.r * 0.3), fy - Math.round(f.r * 0.3),
           Math.round(f.r * 0.3), f.hi || '#FFFFFF');
      /* 살 — 격자가 없으면 공으로 보입니다 */
      g.fillStyle = f.rib || P.dark;
      for (let a = 0; a < 8; a++) {
        const t = a * Math.PI / 4;
        /* 살은 가장자리에서 시작해 안쪽으로 들어옵니다. 중심까지 그으면
           한 점에 여덟 줄이 몰려 검은 얼룩이 됩니다. */
        for (let d = Math.round(f.r * 0.3); d < f.r - 1; d++) {
          const px_ = Math.round(fx + Math.cos(t) * d), py_ = Math.round(fy + Math.sin(t) * d);
          g.fillRect(px_, py_, 2, 2);
        }
      }
      circleLine(g, fx, fy, Math.round(f.r * 0.66), f.rib || P.dark);
      if (f.icon) roofIcon(g, f.icon, fx, fy);
      else disc(g, fx, fy, 3, f.lantern || '#F4F7C8');
    }
    else if (f.k === 'cone') {
      /* 원뿔 — 위에서 보면 동심원이고, 꼭짓점만 위로 올라갑니다.
         좌우로도 밀면 나선으로 보입니다.
         올리는 양이 반지름의 1/3 이었을 때는 지붕에 앉은 원뿔이 아니라
         **지붕에 생긴 물때**로 보였습니다 — 같은 갈색 위에 같은 갈색
         동심원이라 높이 차이가 하나도 안 읽혔습니다. 반지름의 0.9 배로
         올리고, 밑동에 그림자를 깔고, 꼭대기에 구슬을 달았습니다. */
      const R = f.r, up = Math.round(R * 0.9);
      shadow(g, fx + 2, fy + 2, R, Math.max(2, R >> 2));
      disc(g, fx, fy, R + 2, P.dark);
      for (let d = R; d >= 1; d--) {
        const t = 1 - d / R;
        const shade = t < 0.28 ? f.c : t < 0.64 ? f.lit : (f.hi || '#FFE7C8');
        disc(g, fx, fy - Math.round(t * up), d, shade);
        /* 왼쪽 위 능선 한 겹 — 이게 없으면 층이 색 띠로만 남습니다 */
        if (t > 0.25 && t < 0.8)
          px(g, fx - d + 1, fy - Math.round(t * up) - Math.round(d * 0.34), 2, 2,
             f.hi || '#FFE7C8');
      }
      /* 꼭짓점과 첨탑 구슬 */
      disc(g, fx, fy - up, 2, '#FFF3DC');
      px(g, fx, fy - up - 6, 1, 6, P.dark);
      disc(g, fx, fy - up - 7, 2, f.lit);
      if (f.icon) roofIcon(g, f.icon, fx, fy - up - 13, f.hi || '#FFE7C8');
    }
    else if (f.k === 'spire') {
      /* 시계탑 — 사각 탑 위에 계단식 피라미드 지붕, 꼭대기에 라임 시계판.
         캠퍼스에서 브랜드색이 나오는 유일한 건축 요소입니다. */
      const s = f.r;
      px(g, fx - s - 2, fy - s - 2, s * 2 + 4, s * 2 + 4, P.dark);
      px(g, fx - s, fy - s, s * 2, s * 2, f.c);
      px(g, fx - s, fy - s, s * 2, 3, f.lit);
      px(g, fx - s, fy - s, 3, s * 2, f.lit);
      /* 계단식 지붕 — 층마다 한 칸씩 좁아지며 밝아집니다 */
      const steps = Math.floor(s / 2.4);
      for (let k = 0; k < steps; k++) {
        const q = s - 3 - k * 2.2;
        if (q < 3) break;
        px(g, fx - q, fy - q - k, q * 2, q * 2, k % 2 ? f.lit : f.c);
        px(g, fx - q, fy - q - k, q * 2, 2, '#93B4D6');
      }
      /* 시계판 — 지난 판은 코랄 원판에 막대 둘이라 접시였습니다.
         눈금 열둘과 두 바늘이 있어야 시계로 읽힙니다. */
      roofIcon(g, 'clock', fx, fy - steps + 1, 11);
      /* 피뢰침 */
      px(g, fx - 1, fy - s - 8, 2, 8, '#C8D2DC');
      disc(g, fx, fy - s - 9, 2, '#FF6B52');
    }
    else if (f.k === 'deck') {
      px(g, fx, fy, f.w * TS, f.h * TS, P.dark);
      px(g, fx + 2, fy + 2, f.w * TS - 4, f.h * TS - 4, f.c);
      g.fillStyle = f.lit;
      for (let x = fx + 4; x < fx + f.w * TS - 4; x += 5) g.fillRect(x, fy + 3, 1, f.h * TS - 6);
    }
    else if (f.k === 'medal') {
      /* 지붕에 바로 얹는 상징. 돔이나 원뿔이 없는 건물도 문패를
         달 수 있어야 합니다. */
      roofIcon(g, f.icon, fx, fy, f.r);
    }
    else if (f.k === 'tank') {
      disc(g, fx, fy, f.r + 1, P.dark);
      disc(g, fx, fy, f.r, '#B9C2C8');
      disc(g, fx - 1, fy - 2, Math.max(1, f.r - 3), '#E2E8EC');
    }
    else if (f.k === 'cube') {
      /* 지붕에 얹은 주사위 조형물 — 미니게임관. 돔·원뿔·시계탑이 전부
         둥근 것이라, 다섯째 건물은 각진 것 하나로 갈라집니다.

         윗면을 **눌러서** 그립니다(가로 2s, 세로 1.3s). 정사각으로 두면
         전체 실루엣이 세로로 길어져 벽에 걸린 액자가 됩니다 — 눌러야
         위에서 내려다본 상자가 됩니다. */
      const s = f.r, th = Math.round(s * 0.66), dep = Math.round(s * 0.72);
      const ink = '#2A2036';
      shadow(g, fx + 3, fy + th + dep + 1, s - 3, 3);
      px(g, fx - s - 1, fy - th - 1, s * 2 + 2, th * 2 + dep + 2, ink);   // 테는 1px
      px(g, fx - s, fy + th, s * 2, dep, '#D6CAB0');            // 앞면
      px(g, fx - s, fy + th, s * 2, 2, '#B6A98E');              // 윗면과의 접힘
      px(g, fx - s, fy + th + dep - 2, s * 2, 2, '#B6A98E');
      px(g, fx - s, fy - th, s * 2, th * 2, '#F6F1E2');         // 윗면
      px(g, fx - s, fy - th, s * 2, 2, '#FFFDF4');
      px(g, fx - s, fy - th, 2, th * 2, '#FFFDF4');
      px(g, fx + s - 3, fy - th + 3, 3, th * 2 - 3, '#E2DAC6');
      /* 귀 — 두 칸씩 깎습니다. 한 칸이면 이 크기에서 안 보입니다. */
      [[-s, -th], [s - 2, -th], [-s, th - 2], [s - 2, th - 2]]
        .forEach(([dx, dy]) => px(g, fx + dx, fy + dy, 2, 2, ink));
      /* 눈 다섯. 윗면이 눌렸으니 눈도 같이 눌립니다 — 동그란 눈을 그대로
         찍으면 면만 기울고 무늬는 안 기운 그림이 됩니다. */
      const pw = Math.max(2, Math.round(s * 0.17)), ph = Math.max(1, Math.round(pw * 0.7));
      const qx = Math.round(s * 0.5), qy = Math.round(th * 0.5);
      const pip = (dx, dy, c) => {
        px(g, fx + dx - pw, fy + dy - ph, pw * 2, ph * 2 + 1, c);
        px(g, fx + dx - pw + 1, fy + dy - ph - 1, pw * 2 - 2, ph * 2 + 3, c);
      };
      pip(-qx, -qy, ink); pip(qx, -qy, ink);
      pip(0, 0, '#D8442C');                                     // 가운데만 빨강
      pip(-qx, qy, ink); pip(qx, qy, ink);
      /* 앞면은 둘. 다섯을 또 새기면 이 높이에서 줄무늬가 됩니다. */
      px(g, fx - qx - 1, fy + th + 4, 3, 3, ink);
      px(g, fx + qx - 2, fy + th + dep - 7, 3, 3, ink);
    }
    else if (f.k === 'sky') {
      /* 채광창 — 열람실 위에 줄지어 앉습니다 */
      for (let i = 0; i < f.n; i++) {
        const sx = fx + i * (f.gap * TS);
        px(g, sx, fy, 10, 14, P.dark);
        px(g, sx + 1, fy + 1, 8, 12, '#8FC6D8');
        px(g, sx + 1, fy + 1, 8, 4, '#C4E4EE');
      }
    }
  });

  /* ---- 정면 ----
     위 한 줄은 창문 층, 아래 한 줄은 출입구. */
  const wallY = faceY;
  px(g, 0, wallY, W, TS * 2, P.wall);
  px(g, 0, wallY, W, 3, P.trim);                 // 지붕과 벽 사이 띠
  px(g, 0, wallY + 3, W, 1, P.lit);
  /* 주춧돌 — 벽이 잔디에서 바로 솟으면 세워 둔 종잇장으로 보입니다 */
  px(g, 0, H - 8, W, 8, P.wallDark);
  px(g, 0, H - 8, W, 1, P.trim);
  px(g, 0, H - 3, W, 3, 'rgba(0,0,0,.28)');
  /* 모서리 벽기둥 — 벽의 양 끝을 잡아 줍니다 */
  [0, W - 7].forEach((x) => {
    px(g, x, wallY, 7, TS * 2 - 8, P.wallDark);
    px(g, x + 1, wallY + 4, 5, TS * 2 - 12, P.wall);
    for (let y = wallY + 6; y < H - 10; y += 6) px(g, x + 1, y, 5, 1, P.wallDark);
  });

  const doorX = ((spec.w >> 1) - 1) * TS;
  /* 창문 — 건물마다 양식이 다릅니다. 색보다 형태가 성격을 말합니다. */
  const step = spec.win === 'shop' ? 16 : spec.win === 'grid' ? 11
             : spec.win === 'round' ? 18 : 13;
  let wi = 0;
  for (let x = 9; x < W - 14; x += step) {
    if (x + 10 > doorX - 12 && x < doorX + TS * 2 + 14) continue;
    paintWindow(g, spec.win, x, wallY, P);
    /* 셋 중 하나는 불이 켜져 있습니다. 전부 같은 유리면 벽지입니다. */
    if (wi % 3 === 1) {
      if (spec.win === 'round') {
        disc(g, x + 5, wallY + 10, 4, 'rgba(255,214,138,.72)');
        disc(g, x + 5, wallY + 9, 3, 'rgba(255,240,200,.82)');
      } else {
        px(g, x + 2, wallY + 6, 6, 9, 'rgba(255,214,138,.72)');
        px(g, x + 2, wallY + 6, 6, 3, 'rgba(255,240,200,.82)');
      }
    }
    wi++;
  }
  /* ---- 출입구 ----
     들어가는 곳은 **한눈에** 보여야 합니다. 캐노피 한 겹으로는
     창 사이의 빈칸과 구분이 안 갑니다. 차양 · 유리문 · 계단 · 등,
     넷을 겹쳐 문 주변만 다른 리듬을 갖게 했습니다. */
  const dW = TS * 2, dL = doorX - 8, dR = doorX + dW + 8;
  /* 벽감 — 문 둘레를 한 단 들여 그림자를 만듭니다 */
  px(g, dL, wallY + 3, dR - dL, TS * 2 - 5, P.wallDark);
  px(g, dL + 1, wallY + 4, dR - dL - 2, TS * 2 - 7, P.wall);
  /* 청록 차양 — 캠퍼스에서 브랜드색이 벽에 닿는 유일한 자리입니다.
     밝은 청록은 어느 바닥과도 1.2~1.9 밖에 안 갈라져서, 어두운 청록을
     한 겹 깔고 그 위에 얹습니다. 테두리가 형태를 책임집니다. */
  px(g, dL - 2, wallY + 4, dR - dL + 4, 9, '#0C5A4F');
  for (let x = dL - 1; x < dR + 1; x += 6) {
    px(g, x, wallY + 5, 3, 7, '#2DD4BF');
    px(g, x + 3, wallY + 5, 3, 7, '#EFFBF9');
  }
  px(g, dL - 2, wallY + 4, dR - dL + 4, 2, 'rgba(255,255,255,.34)');
  /* 차양 아랫단 — 물결이 있어야 천입니다 */
  for (let x = dL - 2; x < dR + 2; x += 6) {
    disc(g, x + 3, wallY + 13, 3, '#0C5A4F');
    disc(g, x + 3, wallY + 12, 3, (x - dL) % 12 ? '#2DD4BF' : '#EFFBF9');
  }
  /* 유리문 두 짝 */
  px(g, doorX - 2, wallY + 16, dW + 4, TS * 2 - 22, P.frame);
  px(g, doorX, wallY + 18, dW, TS * 2 - 25, '#24384C');
  px(g, doorX, wallY + 18, dW, 4, '#4E6C88');
  g.fillStyle = 'rgba(255,255,255,.30)';
  for (let i = 0; i < 9; i++) g.fillRect(doorX + 3 + i, wallY + 27 - i, 2, 1);
  for (let i = 0; i < 9; i++) g.fillRect(doorX + dW / 2 + 3 + i, wallY + 27 - i, 2, 1);
  px(g, doorX + TS - 1, wallY + 18, 2, TS * 2 - 25, P.frame);
  px(g, doorX + TS - 4, wallY + 24, 2, 4, '#D8DEE4');
  px(g, doorX + TS + 2, wallY + 24, 2, 4, '#D8DEE4');
  /* 계단 — 문 아래 두 단. 바닥에 닿는 곳이 있어야 서 있는 건물입니다. */
  px(g, doorX - 5, H - 8, dW + 10, 4, '#D8D2C6');
  px(g, doorX - 7, H - 4, dW + 14, 4, '#C2BBAE');
  px(g, doorX - 5, H - 8, dW + 10, 1, '#EDE8DE');
  /* 문 옆 등 — 어디로 들어가는지 밤에도 보입니다 */
  [dL - 4, dR + 1].forEach((x) => {
    px(g, x, wallY + 16, 4, 3, '#3A4652');
    px(g, x, wallY + 19, 4, 5, '#FFD98A');
    px(g, x + 1, wallY + 20, 2, 3, '#FFF6DC');
    px(g, x + 1, wallY + 24, 2, 4, '#3A4652');
  });

  /* 기둥 — 도서관 포르티코 */
  if (spec.portico) {
    const n = spec.portico;
    const step = W / (n + 1);
    for (let i = 1; i <= n; i++) {
      const cx = Math.round(i * step) - 3;
      if (cx > doorX - 8 && cx < doorX + TS * 2 + 4) continue;
      px(g, cx, wallY + 4, 6, TS * 2 - 7, P.wallDark);
      px(g, cx, wallY + 4, 4, TS * 2 - 7, '#F2EDE0');
      px(g, cx - 1, wallY + 3, 8, 3, P.trim);
    }
  }

  /* ---- 정면 윗머리 ----
     바닥 모양(plan)이 바뀌면 **지붕**은 달라지지만 정면은 그대로 여섯 채가
     같은 벽 한 장입니다. 위에서 내려다보는 그림이라 정면에 쓸 수 있는
     높이는 32px 뿐이고 차양·유리문·계단이 이미 다 쓰고 있어서, 성격은
     벽이 아니라 **벽과 지붕이 만나는 줄**에서 냅니다.
     넷은 서로 다른 건축 어휘를 하나씩 씁니다 — 박공 · 난간 · 지붕창 ·
     곡선 차양. 한 채에 하나씩만 둬야 그것이 그 건물의 이름표가 됩니다. */
  if (spec.front) {
    const cx = W >> 1, ink = P.dark, lit = P.lit;
    if (spec.front === 'pediment') {
      /* 박공 — 기둥 위에 얹는 삼각형. 도서관이 신전을 흉내 내는 이유는
         기둥(portico)이 이미 있어서입니다. 기둥만 있고 박공이 없으면
         기둥이 벽에 붙은 장식으로 보입니다. */
      const hw = 46, hh = 24, by = faceY + 2;
      for (let k = 0; k <= hh; k++) {
        const w2 = Math.round(hw * (1 - k / hh));
        px(g, cx - w2, by - k, w2 * 2, 1, k > hh - 3 ? lit : P.roof);
      }
      for (let k = 0; k <= hh; k++) {                 // 두 빗변
        const w2 = Math.round(hw * (1 - k / hh));
        px(g, cx - w2, by - k, 3, 1, lit);
        px(g, cx + w2 - 3, by - k, 3, 1, ink);
      }
      px(g, cx - hw - 4, by, (hw + 4) * 2, 5, ink);   // 처마돌림
      px(g, cx - hw - 4, by, (hw + 4) * 2, 2, lit);
      px(g, cx - hw - 2, by - 3, (hw + 2) * 2, 3, P.wall);
      disc(g, cx, by - 10, 6, ink);                   // 장미창
      disc(g, cx, by - 10, 5, '#9FD3E4');
      disc(g, cx - 1, by - 11, 3, '#EAF7FB');
      px(g, cx - 5, by - 11, 11, 2, ink);             // 창살 — 없으면 접시입니다
      px(g, cx - 1, by - 15, 2, 11, ink);
    }
    else if (spec.front === 'parapet') {
      /* 난간 — 벽 윗머리를 계단 모양으로 올립니다. 본관은 가운데가
         가장 높아야 하는 건물이라(시계탑이 거기 있습니다) 윗머리도
         가운데에서 한 단 더 올라갑니다.
         동자(기둥) 사이가 뚫려 보이는 것이 핵심입니다 — 통짜로 채우면
         난간이 아니라 그냥 두꺼운 벽이 되고, 처음 그렸을 때 실제로
         빈 회색 판 두 장으로 보였습니다. */
      const by = faceY + 1;
      const rail = (rx, rw2, up) => {
        const top = by - 7 - up, hgt = 7 + up;
        px(g, rx, top, rw2, hgt, P.wallDark);         // 뒷면 — 기둥 사이 그늘
        px(g, rx, top, rw2, 2, P.wall);               // 갓돌
        for (let x = rx + 3; x < rx + rw2 - 4; x += 7)
          px(g, x, top + 2, 4, hgt - 4, P.trim);      // 동자
        px(g, rx, by - 3, rw2, 4, P.wallDark);        // 밑돌
        px(g, rx, by - 3, rw2, 1, P.wall);
      };
      rail(0, W, 0);
      rail(cx - 46, 92, 7);
      rail(cx - 22, 44, 14);
    }
    else if (spec.front === 'dormer') {
      /* 지붕창 — 사는 집이라는 표시입니다. 기숙사만 사람이 자는
         건물이라, 지붕에 방이 하나씩 더 있는 것으로 보이게 합니다. */
      [cx - 74, cx - 28, cx + 28, cx + 74].forEach((dx) => {
        const by = faceY - 2;
        px(g, dx - 12, by - 17, 24, 19, P.dark);
        px(g, dx - 10, by - 15, 20, 17, P.wall);
        px(g, dx - 10, by - 15, 20, 3, P.trim);
        for (let k = 0; k < 7; k++)                   // 작은 모임지붕
          px(g, dx - 12 + k, by - 18 - k, 24 - k * 2, 1, k > 4 ? lit : P.roof);
        px(g, dx - 6, by - 10, 12, 11, P.frame);
        px(g, dx - 5, by - 9, 10, 9, '#FFD98A');
        px(g, dx - 5, by - 9, 10, 3, '#FFF3D2');
        px(g, dx - 1, by - 9, 2, 9, P.frame);
      });
    }
    else if (spec.front === 'marquee') {
      /* 곡선 차양 — 강당에 들어가는 문입니다. 여섯 채 중 여기만
         **행사**를 하는 집이라, 극장 입구의 문법을 씁니다.
         지붕색으로 칠했더니 지붕이 한 겹 흘러내린 것처럼 보였습니다.
         차양은 지붕이 아니라 **매달린 것**이라, 초록에서 빼서 금빛으로
         갑니다 — 여섯 채에서 금빛이 나오는 자리는 여기뿐입니다. */
      const by = faceY + 3, rw = 52, GD = '#8E6A2E', GM = '#E8C77A', GL = '#FFF0C8';
      for (let k = 0; k < 13; k++) {
        const w2 = Math.round(rw * Math.sqrt(1 - (k / 13) ** 2));
        px(g, cx - w2, by - k, w2 * 2, 1, k < 2 ? GD : k > 9 ? GL : GM);
      }
      px(g, cx - rw - 3, by, (rw + 3) * 2, 5, GD);
      px(g, cx - rw - 3, by, (rw + 3) * 2, 2, GM);
      /* 아랫단 물결 — 곧은 단으로 두면 금색 언덕입니다. 천이라는 것은
         가장자리가 말합니다(문 위 청록 차양도 같은 이유로 물결입니다). */
      for (let x = cx - rw - 2; x < cx + rw + 2; x += 6) {
        disc(g, x + 3, by + 5, 3, GD);
        disc(g, x + 3, by + 4, 3, ((x / 6) | 0) % 2 ? GM : GL);
      }
      /* 전구 한 줄 — 밤에 여기만 극장처럼 보입니다 */
      for (let x = cx - rw; x < cx + rw; x += 8)
        px(g, x, by + 1, 2, 3, ((x / 8) | 0) % 2 ? '#FFF3C4' : '#FFD16B');
    }
  }

  /* ---- 처마 위 간판 ----
     정면 두 줄은 32px 뿐이고 차양·유리문·계단이 이미 다 씁니다. 그래서
     이름판은 지붕 앞머리에 세웁니다 — 위에서 내려다보는 그림에서 판이
     정면으로 서는 자리가 여기뿐입니다.
     전구를 두르는 이유는 밤입니다. 창은 셋 중 하나만 켜지지만 간판은
     통째로 켜져서, 어두워지면 이 건물만 멀리서 눈에 띕니다
     (windowLights 가 __signY 를 보고 여기에 빛을 답니다). */
  if (spec.sign) {
    const sw = Math.min(W - 44, 136), sh = 26;
    const sx = Math.round((W - sw) / 2), sy = faceY - sh - 3;
    [sx + 9, sx + sw - 13].forEach((lx) => px(g, lx, sy + sh - 2, 4, 7, P.dark));  // 다리 둘
    px(g, sx + 3, sy + 4, sw, sh, 'rgba(0,0,0,.26)');
    px(g, sx, sy, sw, sh, P.dark);
    px(g, sx + 3, sy + 3, sw - 6, sh - 6, spec.sign.c);
    px(g, sx + 3, sy + 3, sw - 6, 1, 'rgba(255,255,255,.20)');
    /* 전구는 하나 걸러 색을 바꿉니다. 전부 같은 색이면 점선이 됩니다. */
    for (let i = 4; i < sw - 5; i += 7) {
      const warm = ((i / 7) | 0) % 2;
      px(g, sx + i, sy + 1, 2, 2, warm ? '#FFF3C4' : '#FFD16B');
      px(g, sx + i, sy + sh - 3, 2, 2, warm ? '#FFD16B' : '#FFF3C4');
    }
    stamp(g, spec.sign.text, 9, 'rgba(0,0,0,.55)', (W >> 1) + 1, sy + 9, 'center');
    stamp(g, spec.sign.text, 9, '#FFFFFF', W >> 1, sy + 8, 'center');
    c.__signY = sy + (sh >> 1);
  }

  g.restore();
  return c;
}

/** 그린 캔버스를 소품으로 등록합니다. 충돌 격자는 문만 뚫어 둡니다. */
function buildingProp(spec) {
  const canvas = paintBuilding(spec);
  const doorX = (spec.w >> 1) - 1;
  /* 충돌은 **그린 모양을 그대로** 따릅니다. 상자였을 때는 전부 1 이면
     됐지만, 이제 바닥 모양 밖은 잔디입니다 — 여기를 1 로 두면 안 보이는
     벽이 되고, 0 으로 두면 건물 뒤 빈터로 돌아 들어갈 수 있습니다.
     후자가 맞습니다. 눈에 보이는 것과 걸리는 것이 같아야 합니다. */
  const occ = planOcc(spec);
  const c = [];
  for (let j = 0; j < spec.h; j++) {
    c.push([]);
    for (let i = 0; i < spec.w; i++) {
      const isDoor = j === spec.h - 1 && (i === doorX || i === doorX + 1);
      c[j].push(isDoor || !occ[j][i] ? 0 : 1);
    }
  }
  /* signY 는 밤에 간판을 켜는 자리입니다(windowLights). 그림을 그린
     쪽이 알려 준 값을 그대로 물려받습니다 — 여기서 다시 계산하면
     간판 높이를 두 군데에 적게 되고, 언젠가 둘이 어긋납니다. */
  return { s: 'img', canvas, w: spec.w, h: spec.h, c, t: null, doorX, signY: canvas.__signY };
}

/* ==================================================================
   건물 상징 · 창문 · 실내

   겉과 속의 결이 다르면 문을 지날 때마다 다른 게임에 들어간 것 같습니다.
   그래서 실내 벽도 같은 팔레트, 같은 손으로 그립니다.

   그리고 건물마다 **말하는 물건**을 하나씩 얹습니다 — 도서관 돔 위에는
   책, 학생회관 돔 위에는 트로피. 색과 지붕 모양만으로는 "저기가 무슨
   건물인지"까지 말하지 못합니다.
   ================================================================== */

/** 지붕 꼭대기 상징. 8~14px 안에서 실루엣만으로 읽혀야 합니다. */
/* ---- 지붕 상징 ----
   지붕 색만으로 건물을 가리면 사용자가 색을 외워야 합니다. 상징이 있으면
   처음 온 사람도 압니다. 그러려면 **멀리서 읽혀야** 하고, 지붕색이
   주황이든 청록이든 같은 대비가 나와야 합니다.

   그래서 상징을 맨살에 그리지 않고 메달에 얹습니다 — 어두운 테 · 밝은
   바탕 · 상징. 지붕이 무엇이든 상징은 늘 밝은 바탕 위 검정입니다.
   지난 판은 상징을 지붕에 바로 그려서, 도서관 책은 청록 위 흰색이라
   보였지만 기숙사 달은 주황 위 아이보리라 뭉개져 있었습니다. */
function roofIcon(g, kind, cx, cy, R) {
  R = R || 13;
  const ink = '#22303F';
  /* 메달 */
  disc(g, cx, cy + 2, R + 1, 'rgba(0,0,0,.28)');
  disc(g, cx, cy, R, ink);
  disc(g, cx, cy, R - 2, '#EFE7D6');
  disc(g, cx - 1, cy - 1, R - 3, '#FBF7EC');
  circleLine(g, cx, cy, R - 4, 'rgba(34,48,63,.14)');

  if (kind === 'book') {
    /* 펼친 책 — 위에서 봅니다. 등이 가운데서 꺾이고, 바깥쪽 세 겹이
       종이 두께입니다. 두께가 없으면 종이 두 장으로 보입니다. */
    const w = 9, hh = 7;
    px(g, cx - w - 1, cy - hh, w * 2 + 2, hh * 2, ink);
    [-1, 1].forEach((s) => {
      const x0 = s < 0 ? cx - w : cx + 1;
      px(g, x0, cy - hh + 1, w, hh * 2 - 2, '#FFFDF6');
      px(g, x0, cy - hh + 1, w, 2, '#E4DBC6');            // 위쪽 그늘
      /* 종이 두께 — 바깥 모서리에 층을 셋 */
      for (let k = 0; k < 3; k++)
        px(g, s < 0 ? x0 - 1 + k : x0 + w - k, cy - hh + 2 + k, 1, hh * 2 - 4 - k * 2, '#CFC4AB');
      /* 글줄 */
      g.fillStyle = '#9AA7B4';
      for (let k = 0; k < 4; k++) g.fillRect(x0 + 2, cy - 3 + k * 2, w - 4, 1);
    });
    px(g, cx - 1, cy - hh - 1, 3, hh * 2 + 2, ink);       // 등
    px(g, cx, cy - hh, 1, hh * 2, '#4A5C6E');
    /* 청록 갈피끈 — 브랜드색이 상징 안에서 한 번 나옵니다 */
    px(g, cx + 4, cy + hh - 2, 2, 6, '#2DD4BF');
    px(g, cx + 4, cy + hh + 3, 2, 2, '#D8442C');
  }
  else if (kind === 'bag') {
    /* 장바구니 — 동아리 상점. 여섯 건물 중 유일하게 장사하는 집이라
       상징도 기관의 것(책·우승컵·달)이 아니라 물건 파는 집의 것입니다.
       손잡이를 먼저 그려 자루 뒤로 넣습니다 — 앞에 그리면 붙어 있는
       고리가 아니라 위에 얹힌 반지가 됩니다. */
    px(g, cx - 5, cy - 9, 2, 5, ink);                    // 손잡이 왼쪽
    px(g, cx + 3, cy - 9, 2, 5, ink);                    // 손잡이 오른쪽
    px(g, cx - 4, cy - 10, 8, 2, ink);                   // 손잡이 위
    px(g, cx - 3, cy - 9, 6, 1, '#F2C64A');
    /* 자루 — 위가 넓고 아래로 아주 조금 좁아집니다 */
    px(g, cx - 8, cy - 5, 16, 13, ink);
    px(g, cx - 7, cy - 4, 14, 11, '#E0776C');
    px(g, cx - 7, cy - 4, 14, 3, '#F0A096');             // 빛 받는 윗면
    px(g, cx - 7, cy + 5, 14, 2, '#B3453C');             // 바닥 그늘
    /* 접힌 자국 둘 — 없으면 빨간 상자입니다 */
    px(g, cx - 3, cy - 3, 1, 9, 'rgba(0,0,0,.18)');
    px(g, cx + 2, cy - 3, 1, 9, 'rgba(0,0,0,.18)');
  }
  else if (kind === 'trophy') {
    /* 우승컵 — 명예의 전당. 손잡이가 없으면 화분입니다. */
    /* 손잡이 먼저 — 컵 뒤로 들어가야 붙어 보입니다 */
    [-1, 1].forEach((s) => {
      const x = cx + s * 8;
      px(g, x - 1, cy - 7, 3, 8, ink);
      px(g, x + (s < 0 ? 1 : -1), cy - 6, 1, 6, '#C8A33A');
      px(g, cx + s * 5, cy - 8, 4, 2, ink);
      px(g, cx + s * 5, cy - 2, 4, 2, ink);
    });
    /* 잔 — 위가 넓고 아래로 좁아집니다 */
    px(g, cx - 7, cy - 9, 14, 3, ink);
    px(g, cx - 6, cy - 8, 12, 2, '#FFE9A0');
    for (let k = 0; k < 6; k++)
      px(g, cx - 6 + k, cy - 6 + k, 12 - k * 2, 1, k < 2 ? '#F2C64A' : k < 4 ? '#D9A82F' : '#B8891F');
    px(g, cx - 5, cy - 6, 2, 4, '#FFF3C4');              // 광
    /* 별 — 잔 한가운데 */
    px(g, cx - 1, cy - 5, 3, 3, '#FFFBE8');
    px(g, cx - 2, cy - 4, 5, 1, '#FFFBE8');
    px(g, cx, cy - 6, 1, 5, '#FFFBE8');
    /* 자루와 받침 */
    px(g, cx - 1, cy, 3, 4, '#B8891F');
    px(g, cx - 4, cy + 4, 9, 2, '#D9A82F');
    px(g, cx - 6, cy + 6, 13, 3, ink);
    px(g, cx - 5, cy + 6, 11, 2, '#C8A33A');
  }
  else if (kind === 'moon') {
    /* 초승달과 별 — 기숙사. 잠드는 곳입니다.
       달은 원 두 개의 차이입니다. 바탕이 메달 안쪽 색이므로 그 색으로
       덮으면 깨끗하게 깎입니다 — 캔버스를 뚫으면 지붕이 비칩니다. */
    const bg = '#FBF7EC';
    disc(g, cx - 2, cy, 8, ink);
    disc(g, cx - 2, cy, 7, '#E0A526');
    disc(g, cx - 2, cy - 1, 6, '#FFCE55');
    disc(g, cx - 4, cy - 2, 4, '#FFE9A8');
    /* 깎아 냅니다. 바탕색으로 덮어야 합니다 — 캔버스를 뚫으면
       그 자리에 지붕이 비칩니다. */
    disc(g, cx + 4, cy - 2, 7, bg);
    disc(g, cx + 5, cy - 3, 7, bg);
    /* 곰보 — 없으면 손톱 조각입니다 */
    disc(g, cx - 5, cy + 2, 2, '#E0A526');
    disc(g, cx - 3, cy + 5, 1, '#E0A526');
    /* 별 셋, 크기를 다르게 */
    const star = (x, y, s) => {
      px(g, x, y - s, 1, s * 2 + 1, ink);
      px(g, x - s, y, s * 2 + 1, 1, ink);
      px(g, x, y - s + 1, 1, s * 2 - 1, '#FFF6D2');
      px(g, x - s + 1, y, s * 2 - 1, 1, '#FFF6D2');
    };
    star(cx + 7, cy - 5, 2);
    star(cx + 6, cy + 4, 1);
    star(cx + 2, cy + 8, 1);
  }
  else if (kind === 'clock') {
    /* 시계 — 본관. 열두 눈금 중 넷은 굵게. 눈금이 없으면 접시입니다. */
    disc(g, cx, cy, R - 3, '#FBF7EC');
    circleLine(g, cx, cy, R - 3, '#3C5C82');
    g.fillStyle = '#3C5C82';
    for (let k = 0; k < 12; k++) {
      const t = k * Math.PI / 6, big = k % 3 === 0;
      const r0 = R - 4, r1 = R - (big ? 8 : 6);
      for (let d = r1; d <= r0; d++)
        g.fillRect(Math.round(cx + Math.sin(t) * d), Math.round(cy - Math.cos(t) * d), big ? 2 : 1, big ? 2 : 1);
    }
    /* 바늘 — 10시 10분. 두 바늘이 겹치지 않는 각도라 시계로 읽힙니다. */
    const hand = (ang, len, wdt, col) => {
      g.fillStyle = col;
      for (let d = 0; d <= len; d++)
        g.fillRect(Math.round(cx + Math.sin(ang) * d) - (wdt >> 1),
                   Math.round(cy - Math.cos(ang) * d) - (wdt >> 1), wdt, wdt);
    };
    hand(-Math.PI / 3, R - 7, 3, '#22303F');   // 시침 — 10시
    hand(Math.PI / 6, R - 5, 2, '#22303F');    // 분침 — 10분
    disc(g, cx, cy, 2, '#FF6B52');
    disc(g, cx, cy, 1, '#8E2E1C');
  }
  else if (kind === 'dice') {
    /* 주사위 — 미니게임관. 넷(달·책·시계·우승컵)과 겹치지 않으면서
       설명 없이 "놀이" 로 읽히는 것이 이것뿐이었습니다.
       면이 14px 은 돼야 눈 다섯이 격자로 안 뭉칩니다 — 메달 안지름이
       22px 이라 딱 들어갑니다. */
    const s = 7;
    px(g, cx - s - 1, cy - s - 1, s * 2 + 2, s * 2 + 2, ink);
    px(g, cx - s, cy - s, s * 2, s * 2, '#F6F1E2');
    px(g, cx - s, cy - s, s * 2, 2, '#FFFDF4');                 // 빛은 왼쪽 위
    px(g, cx - s, cy - s, 2, s * 2, '#FFFDF4');
    px(g, cx + s - 2, cy - s + 2, 2, s * 2 - 2, '#DCD3BE');
    px(g, cx - s + 2, cy + s - 2, s * 2 - 4, 2, '#DCD3BE');
    /* 귀를 한 점씩 깎습니다. 안 깎으면 주사위가 아니라 각설탕입니다. */
    [[-s, -s], [s - 1, -s], [-s, s - 1], [s - 1, s - 1]]
      .forEach(([dx, dy]) => px(g, cx + dx, cy + dy, 1, 1, ink));
    /* 눈 다섯. 가운데만 빨강입니다 — 다섯이 전부 검으면 이 크기에서
       점 다섯이 아니라 격자무늬로 읽힙니다. */
    const pip = (dx, dy, c) => px(g, cx + dx - 1, cy + dy - 1, 3, 3, c);
    pip(-4, -4, ink); pip(4, -4, ink);
    pip(0, 0, '#D8442C');
    pip(-4, 4, ink); pip(4, 4, ink);
  }
}

/** 창문. 건물의 성격이 가장 많이 드러나는 자리입니다.

    유리는 **반투명**입니다. 뒤에 진짜 하늘을 그리고 이 장을 다시 덮으면
    틀과 창살이 하늘을 가려 주고 유리만 비칩니다 - 창을 벽에서 오려내는
    것보다 이 편이 짧습니다. 유리에 앉은 빛(glassLit)만 불투명하게
    남깁니다. 그건 밖이 아니라 유리 표면에 붙은 반사입니다.

    비치는 유리 자리를 사각형으로 돌려줍니다. 하늘을 그리는 쪽이 씁니다. */
const GLASS_A = 0.42;

function paintWindow(g, style, x, y, P, cut) {
  /* cut — 유리 자리를 **뚫고** 나서 반투명 유리를 얹습니다.

     틀을 통째로 칠한 위에 42% 유리를 덮으면 그 자리의 합성 알파가 1 이
     됩니다. 그러면 drawWindows 가 뒤에 그려 둔 하늘이 한 점도 안 비쳐,
     위 주석이 말하는 "유리만 비친다" 가 실제로는 안 되고 있었습니다.
     실내 벽(paintTopWall)만 뚫습니다 — 건물 겉면은 유리 뒤에 아무것도
     없어서, 뚫으면 벽에 구멍이 납니다. */
  const glass = (fn) => {
    if (cut) { g.save(); g.globalCompositeOperation = 'destination-out'; fn(); g.restore(); }
    g.globalAlpha = GLASS_A; fn(); g.globalAlpha = 1;
  };
  if (style === 'arch') {
    /* 아치창 — 도서관. 위가 둥글면 오래된 열람실이 됩니다. */
    px(g, x, y + 3, 10, 14, P.frame);
    disc(g, x + 5, y + 4, 5, P.frame);
    glass(() => {
      px(g, x + 1, y + 4, 8, 12, P.glass);
      disc(g, x + 5, y + 4, 4, P.glass);
    });
    px(g, x + 1, y + 4, 8, 3, P.glassLit);
    px(g, x + 4, y, 2, 17, P.frame);
    px(g, x + 1, y + 9, 8, 1, P.frame);
    return [[x + 1, y, 8, 16]];
  }
  if (style === 'tall') {
    /* 격자 큰창 — 본관. 관공서처럼 반듯합니다. */
    px(g, x - 1, y + 1, 12, 17, P.frame);
    glass(() => px(g, x, y + 2, 10, 15, P.glass));
    px(g, x, y + 2, 10, 4, P.glassLit);
    px(g, x + 4, y + 2, 2, 15, P.frame);
    px(g, x, y + 8, 10, 1, P.frame);
    px(g, x - 2, y, 14, 2, P.trim);
    return [[x, y + 2, 10, 15]];
  }
  if (style === 'grid') {
    /* 기숙사 개인방 창 — 여닫이 두 짝에 유리 넷.
       전에는 8×7 짜리 작은 창 둘이었습니다. 벽에 붙은 갈색 사각형 둘로
       보였고, 그 아래 창가 선반이 '창밖 날씨' 를 여는 자리가 되면서
       무엇을 보는 자리인지가 안 읽혔습니다. 창은 이 방에서 밖이
       보이는 유일한 자리라 크게 냅니다. 밑에 창턱을 대야 벽에 뚫린
       구멍이 아니라 창이 됩니다. */
    px(g, x - 1, y - 3, 18, 25, P.frame);
    glass(() => px(g, x, y - 2, 16, 22, P.glass));
    px(g, x, y - 2, 16, 3, P.glassLit);            // 유리에 앉은 빛 — 얇게, 하늘을 덜 덮게
    px(g, x + 7, y - 2, 2, 22, P.frame);           // 세로 창살
    px(g, x, y + 8, 16, 2, P.frame);               // 가로 창살
    px(g, x - 3, y + 22, 22, 3, P.trim);           // 창턱
    px(g, x - 3, y + 22, 22, 1, '#FFFFFF');
    return [[x, y - 2, 16, 22]];
  }
  if (style === 'round') {
    /* 동그란 창 — 미니게임관. 나머지 넷이 전부 네모라, 색을 외우지 않아도
       형태 하나로 "다른 집" 이 됩니다. 테두리 볼트 넷이 있어야 뚫린
       구멍이 아니라 끼워 넣은 창이 됩니다. */
    disc(g, x + 5, y + 10, 8, P.frame);       // 바깥 테 — 어두워야 벽에서 떨어집니다
    disc(g, x + 5, y + 10, 7, P.trim);        // 창틀 몸 — 두 겹이라야 테로 읽힙니다
    px(g, x + 1, y + 18, 9, 2, P.trim);       // 받침 — 없으면 벽에 뚫린 구멍입니다
    px(g, x + 1, y + 18, 9, 1, 'rgba(255,255,255,.45)');
    glass(() => disc(g, x + 5, y + 10, 5, P.glass));
    /* 유리에 앉은 빛 — 위쪽 초승달. 원으로 깎으면 아랫유리까지 불투명해져
       하늘이 안 비치므로, 줄 셋으로 직접 놓습니다. */
    px(g, x + 2, y + 6, 6, 1, P.glassLit);
    px(g, x + 1, y + 7, 8, 1, P.glassLit);
    px(g, x + 1, y + 8, 4, 1, P.glassLit);
    px(g, x - 2, y + 9, 14, 1, P.frame);                       // 가운데 창살
    [[0, -7], [0, 7], [-7, 0], [7, 0]].forEach(([dx, dy]) =>
      px(g, x + 4 + dx, y + 9 + dy, 2, 2, P.trim));            // 볼트 넷
    return [[x, y + 5, 11, 11]];
  }
  if (style === 'shop') {
    /* 넓은 상점 창에 차양 — 학생회관 */
    px(g, x - 2, y + 6, 14, 12, P.frame);
    glass(() => px(g, x - 1, y + 7, 12, 10, P.glass));
    px(g, x - 1, y + 7, 12, 3, P.glassLit);
    for (let i = 0; i < 4; i++) {
      px(g, x - 2 + i * 4, y + 2, 2, 4, i % 2 ? '#E8EDF2' : '#C96C4E');
    }
    px(g, x - 3, y + 1, 16, 2, '#8E5A42');
    return [[x - 1, y + 7, 12, 10]];
  }
  px(g, x, y + 6, 8, 11, P.frame);
  glass(() => px(g, x + 1, y + 7, 6, 9, P.glass));
  px(g, x + 1, y + 7, 6, 3, P.glassLit);
  return [[x + 1, y + 7, 6, 9]];
}

/* ---------------- 실내 벽 ----------------
   위 세 줄이 벽면입니다. 천장 몰딩 · 벽 · 굽도리 세 켜로 나눠야
   평평한 색면이 벽으로 보입니다. */
function paintTopWall(w, P, decor) {
  const c = document.createElement('canvas');
  c.width = w * TS; c.height = TS * 3; c.__cell = TS;
  const g = c.getContext('2d');
  const W = c.width;

  px(g, 0, 0, W, TS * 3, P.iWall);
  g.fillStyle = P.iWallLit;
  for (let x = 3; x < W; x += 7) g.fillRect(x, 10, 1, TS * 2 + 2);
  px(g, 0, 0, W, 6, P.iCeil);
  px(g, 0, 6, W, 2, P.iTrim);
  px(g, 0, 8, W, 1, P.iWallLit);
  px(g, 0, TS * 3 - 9, W, 4, P.iTrim);
  px(g, 0, TS * 3 - 5, W, 5, P.iBase);
  px(g, 0, TS * 3 - 1, W, 1, P.iShadow);

  const wins = [];
  (decor || []).forEach((d) => {
    const x = d.x * TS, y = 12;
    if (d.k === 'win') {
      /* 창만 따로 한 장에 그려 벽에 붙입니다. 같은 장을 그릴 때 하늘
         위에 한 번 더 덮어 - 틀과 창살이 하늘을 가리고 유리만 비칩니다.
         양옆 여백 8px 은 상점 차양이 창틀 밖으로 나가기 때문입니다. */
      const wc = document.createElement('canvas');
      wc.width = TS * 2; wc.height = TS * 3; wc.__cell = TS;
      const wg = wc.getContext('2d');
      const gl = paintWindow(wg, d.style, 8, y, P, true);
      const ox = x - 8;
      g.drawImage(wc, ox, 0);
      wins.push({ c: wc, x: ox, glass: gl.map((r) => [r[0] + ox, r[1], r[2], r[3]]) });
    }
    else if (d.k === 'shelf') {
      /* 벽 책장 — 도서관. 책등 폭·높이·기울기가 갈려야 책으로 읽힙니다. */
      const W = TS * 2, SH = 3;
      /* 통 — 바깥 테두리, 옆널, 뒤판 */
      px(g, x - 3, y - 3, W + 6, 32, P.iTrim);
      px(g, x - 2, y - 2, W + 4, 30, '#4A3323');
      px(g, x - 2, y - 2, W + 4, 1, '#6B4A32');
      px(g, x - 2, y - 2, 2, 30, '#5C4029');
      px(g, x + W, y - 2, 2, 30, '#3A2718');
      for (let r = 0; r < SH; r++) {
        const ry = y + 1 + r * 9;
        /* 단 안쪽 그늘 — 책이 떠 보이지 않게 */
        px(g, x, ry, W, 8, '#3A2718');
        let bx = x + 1;
        let k = r * 7 + x;                       // 자리마다 다른 씨앗
        while (bx < x + W - 1) {
          k = (k * 1103515245 + 12345) & 0x7fffffff;
          const w = 2 + (k >> 8) % 3;            // 2~4px
          if (bx + w > x + W - 1) break;
          const h = 5 + ((k >> 16) % 3);         // 5~7px
          const col = ['#B75B4C', '#52739F', '#8B9C48', '#CDC2B1', '#9C6BA0',
                       '#C08A3E', '#4E7F6B', '#8A4F6D'][(k >> 20) % 8];
          const top = ry + (8 - h);
          if ((k >> 24) % 11 === 0 && w >= 3) {
            /* 기댄 책 — 계단으로 한 칸씩 밀어 기울입니다 */
            for (let i = 0; i < h; i++) px(g, bx + ((i / 3) | 0), top + i, w - 1, 1, col);
          } else {
            px(g, bx, top, w, h, col);
            px(g, bx, top, w, 1, 'rgba(255,255,255,.30)');   // 책등 윗면
            px(g, bx, top + 1, 1, h - 1, 'rgba(255,255,255,.14)');
            if (w >= 3) px(g, bx + 1, top + 2, w - 2, 1, 'rgba(0,0,0,.28)');  // 제목 띠
          }
          px(g, bx + w, top, 1, h, 'rgba(0,0,0,.30)');       // 책 사이 그늘
          bx += w + 1;
        }
        /* 선반 — 앞코가 있어야 판이 됩니다 */
        px(g, x - 1, ry + 8, W + 2, 2, '#6B4A32');
        px(g, x - 1, ry + 8, W + 2, 1, '#96693F');
      }
    }
    else if (d.k === 'board') {
      /* 칠판 — 본관 강의동 */
      px(g, x - 2, y - 2, TS * 3 + 4, 28, '#8A6A44');
      px(g, x, y, TS * 3, 24, '#2C4034');
      px(g, x + 1, y + 1, TS * 3 - 2, 4, '#3A5343');
      g.fillStyle = 'rgba(230,240,235,.5)';
      g.fillRect(x + 5, y + 8, 22, 1);
      g.fillRect(x + 5, y + 12, 30, 1);
      g.fillRect(x + 5, y + 16, 16, 1);
      px(g, x + TS * 3 - 12, y + 20, 8, 2, '#E8EDF2');
    }
    else if (d.k === 'notice') {
      /* 게시판 — 학생회관 */
      px(g, x - 2, y - 1, TS * 2 + 4, 26, '#7A5B3C');
      px(g, x, y + 1, TS * 2, 22, '#C9A87C');
      const cols = ['#F2F4F7', '#FF6B52', '#F2C9C4', '#C4DDF2'];
      for (let i = 0; i < 6; i++) {
        const ax = x + 3 + (i % 3) * 9, ay = y + 4 + Math.floor(i / 3) * 9;
        px(g, ax, ay, 7, 7, cols[i % 4]);
        px(g, ax, ay, 7, 2, 'rgba(0,0,0,.14)');
      }
    }
    else if (d.k === 'cork') {
      /* 코르크판 — 기숙사. 여기 걸려 있던 현수막은 세로로 긴 갈색 천이라
         화면에서 **문으로 읽혔습니다.** 벽 오른쪽 끝, 옷장 바로 위라
         더 그랬습니다("저 문은 어디로 가지").
         현수막은 강당에 거는 것이고, 방에 거는 것은 코르크판입니다.
         가로로 눕혀 문 비율(세로 긴 네모)에서 벗어납니다. */
      const W2 = TS * 2 - 4;
      px(g, x + 2, y - 2, W2, 26, '#7A5A3C');            // 나무 테
      px(g, x + 2, y - 2, W2, 2, '#A07A54');
      px(g, x + 4, y, W2 - 4, 22, '#C69A66');            // 코르크
      px(g, x + 4, y, W2 - 4, 1, 'rgba(255,255,255,.22)');
      /* 붙여 둔 쪽지 넷. 색이 갈리고 살짝 어긋나야 붙인 것으로 보입니다. */
      const notes = [['#F4EDE0', 0, 0], ['#CFE8E2', 9, 2], ['#F6DCC8', 18, 1], ['#E4DCF0', 27, 3]];
      for (const [c, dx, dy] of notes) {
        px(g, x + 6 + dx, y + 3 + dy, 7, 9, c);
        px(g, x + 6 + dx, y + 3 + dy, 7, 1, 'rgba(0,0,0,.10)');
        px(g, x + 9 + dx, y + 2 + dy, 2, 2, '#C4544A');   // 압정
      }
      px(g, x + 2, y + 24, W2, 2, 'rgba(0,0,0,.26)');    // 벽에 지는 그림자
    }
    else if (d.k === 'banner') {
      /* 현수막 */
      px(g, x, 8, TS, 30, d.c || '#3C5C82');
      px(g, x, 8, TS, 3, 'rgba(255,255,255,.28)');
      px(g, x + 3, 16, TS - 6, 3, '#FF6B52');
      px(g, x + 4, 23, TS - 8, 2, 'rgba(255,255,255,.55)');
      px(g, x, 38, TS, 3, 'rgba(0,0,0,.3)');
    }
    else if (d.k === 'clock' || d.k === 'clockFace') {
      /* 판만 그립니다. 바늘은 매 프레임 진짜 시각으로 덧그립니다
         (zone.clock). 벽 캔버스는 한 번만 그려지니 여기 바늘을 넣으면
         멈춘 시계가 됩니다. */
      disc(g, x + 8, y + 10, 10, P.iTrim);
      disc(g, x + 8, y + 10, 8, '#FFFDF8');
      g.fillStyle = P.iTrim;
      for (let h = 0; h < 12; h++) {
        const t = h * Math.PI / 6;
        const r = h % 3 === 0 ? 6 : 7;
        g.fillRect(Math.round(x + 8 + Math.sin(t) * r),
                   Math.round(y + 10 - Math.cos(t) * r), 1, 1);
      }
      if (d.k === 'clock') {  // 정지 시계(다른 방)는 바늘까지 그립니다
        px(g, x + 7, y + 5, 2, 6, '#2A3440');
        px(g, x + 8, y + 9, 5, 2, '#2A3440');
      }
    }
    else if (d.k === 'guide') {
      /* 벽에 붙인 안내판. 광장 표지판과 달리 실내라 작아야 합니다 —
         같은 크기로 두면 방 안에 도로표지판이 서 있는 꼴이 됩니다. */
      const w = TS * 2, h = 22;
      px(g, x - 1, y - 2, w + 2, h + 2, '#8A6039');
      px(g, x, y - 1, w, h, '#FFF6F3');
      px(g, x, y - 1, w, 2, '#FFFFFF');
      px(g, x, y + h - 3, w, 2, '#E4D3CC');
      px(g, x + 3, y + 2, w - 6, 3, '#2DD4BF');
      /* 광장 표지판과 **같은 글자**입니다. 실내라 한 급 작을 뿐입니다. */
      stamp(g, '안내', 9, '#2A2320', x + w / 2, y + 7, 'center');
      /* 못 두 개 */
      px(g, x + 2, y - 3, 2, 2, '#6B5F5A');
      px(g, x + w - 4, y - 3, 2, 2, '#6B5F5A');
    }
    else if (d.k === 'art') {
      /* ---- 액자 ----
         방마다 벽에 걸 것이 서로 다른데, 걸 것을 방마다 새로 그리면
         종류가 여섯 개 늘어납니다. 대신 **액자 하나에 그림 세 장**을
         담습니다(pic) — 테와 매트는 같고 안의 그림만 갈립니다.
         실제 벽이 그렇습니다: 액자는 다 비슷하고 그림만 다릅니다.

           scene   창밖 같은 풍경 — 오래 앉는 방(도서관)에 겁니다
           chart   막대가 오르는 그림 — 배우는 방(본관)·기록을 재는 방
           poster  큰 색면 한 장 — 노는 방(미니게임관)·파는 방(상점)·내 방

         매트(속테)를 두는 것이 요점입니다. 테 바로 안에 그림을 붙이면
         액자가 아니라 벽에 붙인 종이가 됩니다. */
      const FW = TS * 2 - 6, FH = 26;
      px(g, x + 3, y - 4, FW, FH, '#6B4A2E');                 // 나무 테
      px(g, x + 3, y - 4, FW, 2, '#9A6C42');
      px(g, x + 3, y + FH - 6, FW, 2, '#4A3323');
      px(g, x + 5, y - 2, FW - 4, FH - 4, '#F2ECE1');         // 매트
      const ix = x + 7, iy = y, iw = FW - 8, ih = FH - 8;
      const pic = d.pic || 'scene';
      if (pic === 'scene') {
        px(g, ix, iy, iw, ih, '#BFDCEE');                     // 하늘
        px(g, ix, iy, iw, 3, '#9BC7E4');
        /* 해 — disc 로 그리면 반지름 3 에서 별표가 됩니다(정수 격자에
           원을 채우면 지름이 홀수 줄로 튑니다). 네모 둘을 겹쳐 둥글게. */
        px(g, ix + iw - 7, iy + 3, 5, 3, '#FFE9A8');
        px(g, ix + iw - 6, iy + 2, 3, 5, '#FFE9A8');
        px(g, ix, iy + ih - 8, iw, 5, '#6FA36A');             // 먼 언덕
        px(g, ix, iy + ih - 9, iw, 1, '#8CBC80');
        px(g, ix, iy + ih - 4, iw, 4, '#4E8352');             // 앞 들판
        px(g, ix + 3, iy + ih - 12, 3, 5, '#3F6E48');         // 나무 둘
        px(g, ix + 8, iy + ih - 10, 2, 3, '#3F6E48');
      } else if (pic === 'chart') {
        px(g, ix, iy, iw, ih, '#FBF7EE');
        px(g, ix + 1, iy + ih - 2, iw - 2, 1, '#8A8378');     // 축
        px(g, ix + 1, iy + 1, 1, ih - 2, '#8A8378');
        [4, 7, 10, 13].forEach((h, i) => px(g, ix + 3 + i * 4, iy + ih - 2 - h, 3, h,
          ['#E8695A', '#E8A33C', '#4E9E63', '#3C7CC4'][i]));
      } else {
        px(g, ix, iy, iw, ih, '#2F2A3E');                     // 어두운 판에 색면
        px(g, ix + 2, iy + 2, iw - 4, ih - 8, d.c || '#E8695A');
        px(g, ix + 2, iy + 2, iw - 4, 2, 'rgba(255,255,255,.34)');
        px(g, ix + 4, iy + ih - 5, iw - 8, 2, '#F2ECE1');
        px(g, ix + 4, iy + ih - 12, 4, 4, '#FFFFFF');
      }
      /* 걸린 줄 — 없으면 벽에 파묻힌 네모입니다 */
      px(g, x + TS - 1, y - 7, 2, 3, '#8E827C');
      /* 벽에 지는 그림자. 액자 폭 그대로 깔면 밑에 선반이 하나 더
         있는 것으로 보입니다 — 양옆을 두 칸씩 좁혀 그늘로만 남깁니다. */
      px(g, x + 5, y + FH - 4, FW - 4, 1, 'rgba(0,0,0,.22)');
    }
    else if (d.k === 'trophy') {
      /* ---- 트로피 선반 ----
         "여기가 무엇을 하는 창구인가" 를 벽이 말하게 합니다. 학생회관
         랭킹전 창구 위에 걸면, 판을 읽기 전에 이미 무슨 자리인지 압니다.
         선반은 앞코가 있어야 판으로 보이고, 그 위에 놓인 것은 셋 —
         가운데가 크고 양옆이 작아야 시상대로 읽힙니다. */
      const SW = TS * 2;
      /* 가운데 금컵 — 대접 · 손잡이 둘 · 목 · 받침. 넷이 다 있어야
         컵이지, 네모에 손잡이만 붙이면 냄비가 됩니다. */
      px(g, x + 13, y + 3, 6, 4, '#E8C34A');
      px(g, x + 13, y + 3, 6, 1, '#FFE9A8');
      px(g, x + 14, y + 7, 4, 1, '#D8B03A');                  // 대접 바닥
      px(g, x + 11, y + 3, 2, 1, '#C9A02E');                  // 손잡이 둘
      px(g, x + 11, y + 4, 1, 2, '#C9A02E');
      px(g, x + 19, y + 3, 2, 1, '#C9A02E');
      px(g, x + 20, y + 4, 1, 2, '#C9A02E');
      px(g, x + 15, y + 8, 2, 3, '#C9A02E');                  // 목
      px(g, x + 12, y + 11, 8, 2, '#7A5A3C');                 // 받침
      px(g, x + 12, y + 11, 8, 1, '#96693F');
      /* 왼쪽 은컵 — 금컵보다 한 급 작고 한 칸 낮습니다 */
      px(g, x + 5, y + 6, 4, 3, '#C6CDD6');
      px(g, x + 5, y + 6, 4, 1, '#E4E9EF');
      px(g, x + 4, y + 6, 1, 2, '#AAB2BC');
      px(g, x + 9, y + 6, 1, 2, '#AAB2BC');
      px(g, x + 6, y + 9, 2, 2, '#AAB2BC');
      px(g, x + 4, y + 11, 6, 2, '#7A5A3C');
      px(g, x + 4, y + 11, 6, 1, '#96693F');
      /* 오른쪽 상장. 컵을 셋 세우면 셋이 같은 물건이 되어 "많다" 밖에
         안 남습니다. 종류가 갈려야 시상대가 아니라 **기록이 쌓인 선반**
         으로 읽힙니다. */
      px(g, x + 22, y + 5, 8, 8, '#8A6039');
      px(g, x + 23, y + 6, 6, 6, '#FBF7EE');
      px(g, x + 24, y + 7, 4, 1, '#9AA0A8');
      px(g, x + 24, y + 9, 3, 1, '#9AA0A8');
      px(g, x + 27, y + 10, 2, 2, '#C4544A');                 // 도장
      /* 선반 널은 **나중에** 깝니다 — 놓인 것들의 밑동을 덮어야
         물건이 판 위에 얹힌 것으로 보입니다. */
      px(g, x, y + 13, SW, 3, '#6B4A2E');
      px(g, x, y + 13, SW, 1, '#96693F');
      px(g, x + 3, y + 16, 2, 3, '#4A3323');                  // 받침대 둘
      px(g, x + SW - 5, y + 16, 2, 3, '#4A3323');
      px(g, x + 2, y + 16, SW - 4, 1, 'rgba(0,0,0,.18)');     // 널 밑 그늘
    }
  });
  return { c, wins };
}

/** 좌우·아래 테두리 벽. 얇지만 색이 이어져야 방이 닫힙니다. */
function paintEdgeWall(w, h, P, vertical) {
  const c = document.createElement('canvas');
  c.width = w * TS; c.height = h * TS; c.__cell = TS;
  const g = c.getContext('2d');
  px(g, 0, 0, c.width, c.height, P.iWall);
  if (vertical) {
    px(g, 0, 0, 4, c.height, P.iCeil);
    px(g, 4, 0, 2, c.height, P.iTrim);
    px(g, c.width - 5, 0, 5, c.height, P.iBase);
    g.fillStyle = P.iWallLit;
    for (let y = 4; y < c.height; y += 9) g.fillRect(7, y, 1, 5);
  } else {
    /* 가로 벽 — 위에서 아래로 몰딩 · 벽면 · 굽도리. 한 줄짜리 띠로
       두면 벽이 아니라 선으로 보입니다. */
    px(g, 0, 0, c.width, c.height, P.iWall);
    px(g, 0, 0, c.width, 4, P.iTrim);
    px(g, 0, 4, c.width, 1, P.iWallLit);
    g.fillStyle = P.iWallLit;
    for (let x = 3; x < c.width; x += 7) g.fillRect(x, 6, 1, c.height - 12);
    px(g, 0, c.height - 7, c.width, 3, P.iTrim);
    px(g, 0, c.height - 4, c.width, 4, P.iBase);
    px(g, 0, c.height - 1, c.width, 1, P.iShadow);
  }
  return c;
}

/** 방 하나에 벽 넉 장을 두릅니다. 그리기 전용이라 충돌은 그대로 둡니다. */
function dressRoom(m, P, decor) {
  /* 위쪽 벽에는 '안내' 판이 붙습니다 — 글꼴이 오면 그 한 장만 다시
     그립니다. dressRoom 전체를 다시 부르면 바닥까지 덧칠됩니다.

     paintTopWall 은 캔버스가 아니라 { c, wins } 를 돌려줍니다. 통째로
     넣으면 그리는 쪽에서 drawImage 가 캔버스가 아닌 값을 받습니다. */
  TEXT_ART.push(() => { m.walls[0].c = paintTopWall(m.w, P, decor).c; });
  const top = paintTopWall(m.w, P, decor);
  /* 창은 벽 위에 한 번 더 덮습니다. 사이에 하늘이 들어갑니다. */
  m.wins = top.wins;
  m.walls = [
    { c: top.c, x: 0, y: 0 },
    { c: paintEdgeWall(1, m.h - 5, P, true), x: 0, y: 3 },
    { c: paintEdgeWall(1, m.h - 5, P, true), x: m.w - 1, y: 3 },
    { c: paintEdgeWall(m.w, 2, P, false), x: 0, y: m.h - 2 },
  ];
  /* 아래 두 줄이 벽입니다. 문이 그 안에 들어갑니다. */
  fillBase(m, 0, m.h - 2, m.w, 2, m.base[at(m, 0, 0)]);
}

/* 미니게임관은 여기서 안 굽습니다 — 간판에 글자가 있고, 픽셀 글자
   (PXTEXT)는 이 줄보다 아래에서 만들어집니다. paintGates 바로 뒤에서

/* ==================================================================
   기물과 바닥

   벤치·가로등·자판기를 시트에서 꺼내 쓰면 캠퍼스 색과 따로 놉니다.
   건물을 손으로 그린 이상 그 위에 놓이는 물건도 같은 손이어야 합니다.

   공통 규칙은 건물과 같습니다 — 빛은 왼쪽 위, 밝은 면은 위·왼쪽,
   그림자는 아래·오른쪽. 그리고 **바닥에 닿는 면을 어둡게** 깔아야
   물건이 떠 있지 않고 놓여 있는 것으로 보입니다.
   ================================================================== */

const FURN = {
  /* 바닥을 올리면서 나무도 같이 올립니다. 기물만 두면 밝아진 마루에
     책상이 묻힙니다 — 바닥(66%)보다 조금 어두운 자리(56%)를 지켜야
     기물이 바닥 위에 놓인 것으로 읽힙니다. 색상·채도는 그대로입니다. */
  wood:  '#BE854F', woodLit: '#DCA96E', woodDark: '#8E5C2E',
  metal: '#98A2AD', metalLit: '#C2CAD2', metalDark: '#5F6874',
  ink:   '#1B2430', lime: '#FF6B52',
  glass: '#3A5568', glassLit: '#8FB0C6',
  leaf:  '#4E9E63', leafLit: '#6FBE7F', soil: '#6B4C33',
};

/* 그림은 TS(16) 눈금으로 그립니다 — 월드 타일이 32 로 커져도 그리는
   코드는 한 줄도 안 바뀝니다. 얹는 쪽(blitArt)이 __cell 을 보고 늘립니다. */
function canvasOf(wTiles, hTiles) {
  const c = document.createElement('canvas');
  c.width = wTiles * TS; c.height = hTiles * TS;
  c.__cell = TS;
  return c;
}
/** 바닥 그림자. 이게 없으면 모든 기물이 공중에 뜹니다. */
function shadow(g, cx, y, rx, ry) {
  g.fillStyle = 'rgba(0,0,0,.20)';
  for (let dy = -ry; dy <= ry; dy++) {
    const half = Math.floor(rx * Math.sqrt(1 - (dy * dy) / (ry * ry || 1)));
    g.fillRect(cx - half, y + dy, half * 2 + 1, 1);
  }
}

/* ---- 픽셀 글자 ----
   6px 한글을 그대로 4배로 키우면 안티에일리어싱이 같이 커져 글자가
   번집니다. 크게 그린 다음 **알파를 1비트로 잘라** 냅니다 — 반투명
   픽셀이 하나도 안 남으므로 확대해도 계단만 보이고 흐려지지 않습니다.
   본문은 프리텐다드지만 여기만 맑은 고딕을 먼저 씁니다. 작은 크기에
   맞춰 힌팅된 글꼴이라 자르고 나서 획이 덜 끊깁니다. */
/* ---- 손으로 그린 한글 7×8 ----
   맑은 고딕을 잘라 쓰는 방식은 9px 이 바닥입니다. 8px 로 내리면 "도서관"
   이 "도서리" 가 되고 "본관" 이 "른관" 이 됩니다 — 획 사이가 반투명
   한 겹뿐이라, 자르면 그 겹이 통째로 사라집니다. 무게와 문턱값을 여섯
   조합 시험해도 마찬가지였습니다.

   더 작게 가려면 획을 직접 놓는 수밖에 없습니다. 표지판에 쓰는 열두
   글자만 7×8 격자에 그렸습니다. 자간은 1px 이라 "학생회관" 이 31px —
   같은 글을 잘라 쓰면 34px 입니다. 작아지고 또렷해졌습니다. */
const GLYPH8 = {
  '기': ['#####.#', '....#.#', '....#.#', '......#', '......#', '......#', '......#', '.......'],
  '숙': ['...#...', '..#.#..', '.#...#.', '#######', '...#...', '.#####.', '.....#.', '.......'],
  '사': ['.#...#.', '.#...#.', '#.#..#.', '#.#..##', '#..#.#.', '#..#.#.', '.....#.', '.......'],
  '도': ['.#####.', '.#.....', '.#.....', '.#####.', '.......', '...#...', '...#...', '#######'],
  '서': ['.#....#', '.#....#', '#.#...#', '#.#.###', '#..#..#', '#..#..#', '......#', '.......'],
  '관': ['####..#.', '...#..#.', '......##', '..#...#.', '#####.#.', '........', '#.......', '######..'],
  '본': ['#..#...', '####...', '#..#...', '####...', '..#....', '#######', '#......', '######.'],
  '학': ['..#...#.', '#####.#.', '.####.##', '.#..#.#.', '.####.#.', '......#.', '####....', '...#....'],
  '생': ['.#...#.#', '#.#..#.#', '#.#..###', '#.#..#.#', '.....#.#', '####.#.#', '#..#.#.#', '####.#.#'],
  '회': ['..#...#', '#####.#', '.###..#', '.#.#..#', '.###..#', '..#...#', '..#...#', '#####.#'],
  '안': ['.###..#.', '#...#.#.', '#...#.##', '.###..#.', '......#.', '........', '#.......', '######..'],
  '내': ['#...#.#', '#...#.#', '#...#.#', '#...###', '#...#.#', '#...#.#', '###.#.#', '.......'],
};
/** 손글자를 한 장으로 이어 붙입니다. 없는 글자는 잘라 쓰기로 넘깁니다. */
function handText(text, color) {
  const rows = 8, gap = 1;
  const cells = [...text].map((ch) => GLYPH8[ch]);
  if (cells.some((c) => !c)) return null;
  /* 글자마다 실제로 쓴 폭만 씁니다 — 오른쪽 빈 칸을 그대로 두면
     "기" 와 "관" 사이가 벌어져 자간이 들쭉날쭉해집니다. */
  const widths = cells.map((c) => {
    let w = 0;
    c.forEach((r) => { const i = r.lastIndexOf('#'); if (i + 1 > w) w = i + 1; });
    return w;
  });
  const c = document.createElement('canvas');
  c.width = widths.reduce((a, b) => a + b, 0) + gap * (cells.length - 1);
  c.height = rows;
  const g = c.getContext('2d');
  g.fillStyle = color;
  let ox = 0;
  cells.forEach((cell, k) => {
    cell.forEach((row, y) => {
      for (let x = 0; x < row.length; x++) if (row[x] === '#') g.fillRect(ox + x, y, 1, 1);
    });
    ox += widths[k] + gap;
  });
  return c;
}

/* ---- 갈무리 크기표 ----
   크기는 **그 글꼴이 정한 크기의 정수배로만** 씁니다. 어긋나면 획이 칸
   사이에 걸쳐 번지고, 그러면 갈무리를 쓸 이유가 없어집니다.

   주의 — 이름의 숫자가 곧 px 이 아닙니다. 갈무리 README 가 정한 크기는
   갈무리7=8px, 갈무리9=10px, 갈무리11=12px 입니다(이름은 글자 획의
   높이고, px 은 줄 높이라 하나씩 큽니다). */
const GALMURI = [
  { upTo: 8,        family: 'Galmuri7',  unit: 8  },
  { upTo: 10,       family: 'Galmuri9',  unit: 10 },
  { upTo: Infinity, family: 'Galmuri11', unit: 12 },
];
/** 부르는 쪽 크기를 갈무리 한 종과 그 정수배 크기로 맞춥니다. */
function galmuriFont(size) {
  const f = GALMURI.find((f) => size <= f.upTo);
  return { px: f.unit * Math.max(1, Math.round(size / f.unit)), family: f.family };
}

const PXTEXT = new Map();
const hexRGB = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
function pixelText(text, size, color) {
  const key = text + '|' + size + '|' + color;
  if (PXTEXT.has(key)) return PXTEXT.get(key);
  /* 8px 이하는 손글자가 있으면 손글자를 씁니다. 자른 글자는 여기서
     이미 무너져 있습니다. */
  if (size <= 8) {
    const hand = handText(text, color);
    if (hand) { PXTEXT.set(key, hand); return hand; }
  }
  const pad = 4;
  const t = document.createElement('canvas');
  const g = t.getContext('2d');
  /* 갈무리로 찍습니다. 맑은고딕을 1비트로 자르면 획이 부스러지는데,
     갈무리는 애초에 픽셀 격자 위에 그려진 글꼴이라 자를 것이 없습니다. */
  const gm = galmuriFont(size);
  const font = `${gm.px}px "${gm.family}", "Malgun Gothic", sans-serif`;
  g.font = font;
  t.width = Math.ceil(g.measureText(text).width) + pad * 2;
  t.height = gm.px + pad * 2;
  g.font = font;                       // 크기를 바꾸면 컨텍스트가 초기화됩니다
  g.textBaseline = 'top'; g.fillStyle = '#000';
  g.fillText(text, pad, pad);
  const d = g.getImageData(0, 0, t.width, t.height), a = d.data;
  const [r, gg, b] = hexRGB(color);
  /* 알파를 1비트로 자르면서 잉크가 실제로 닿은 칸을 함께 잽니다 */
  let x0 = t.width, y0 = t.height, x1 = -1, y1 = -1;
  for (let y = 0; y < t.height; y++) for (let x = 0; x < t.width; x++) {
    const i2 = (y * t.width + x) * 4;
    const on = a[i2 + 3] > 96;
    a[i2] = r; a[i2 + 1] = gg; a[i2 + 2] = b; a[i2 + 3] = on ? 255 : 0;
    if (on) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  g.putImageData(d, 0, 0);
  if (x1 < 0) { PXTEXT.set(key, t); return t; }
  /* 딱 맞게 잘라 냅니다. 안 자르면 판 안에서 글자가 어디쯤 있는지 알 수
     없어, 위아래 여백을 눈대중으로 맞추게 됩니다. */
  const c = document.createElement('canvas');
  c.width = x1 - x0 + 1; c.height = y1 - y0 + 1;
  c.getContext('2d').drawImage(t, x0, y0, c.width, c.height, 0, 0, c.width, c.height);
  PXTEXT.set(key, c);
  return c;
}
/** 잘라 낸 글자를 찍습니다. x 는 left/center/right, y 는 top/middle 기준점. */
function stamp(g, text, size, color, x, y, align = 'left', valign = 'top') {
  const t = pixelText(text, size, color);
  const dx = align === 'center' ? x - t.width / 2 : align === 'right' ? x - t.width : x;
  const dy = valign === 'middle' ? y - t.height / 2 : y;
  g.drawImage(t, Math.round(dx), Math.round(dy));
  return t.width;
}

/* ---- 글꼴이 늦게 오는 문제 ----
   글자가 든 그림은 스크립트를 읽는 순간 한 번 그려 캐시에 넣습니다.
   그런데 웹폰트는 그때 아직 안 와 있습니다 — 첫 판이 폴백으로 찍히고,
   캐시에 들어갔으니 영영 그대로 남습니다. 갈무리를 쓰기 전에는 시스템
   글꼴이라 이 문제가 없었습니다.

   그래서 다시 그리는 방법을 여기 모아 두고, 글꼴이 온 뒤 한 번 더
   돌립니다. 글자가 든 그림을 새로 만들 때는 여기에 등록하세요. */
const TEXT_ART = [];
function repaintTextArt() {
  PXTEXT.clear();              // 폴백으로 찍힌 글자를 버립니다
  TEXT_ART.forEach((f) => f());
  /* 그리고 **다시 가리킵니다.** 여기 등록된 함수 중 몇은 캔버스를 새로
     만들어 PAINTED 에 넣는데, PROP 은 만들어질 때의 캔버스를 붙들고
     있습니다. 안 바꿔 끼우면 다시 그린 그림이 PAINTED 에만 남습니다. */
  for (const d of Object.values(PROP)) {
    if (d && d.key && PAINTED[d.key]) d.canvas = PAINTED[d.key];
  }
}
/* 캔버스에 글꼴 이름을 적는 것만으로는 브라우저가 내려받지 않는 경우가
   있습니다. 쓸 글자를 주며 명시적으로 부릅니다. 못 읽어도 넘어갑니다 —
   폴백으로 찍힌 그림이 이미 있으니 앱은 그대로 돕니다. */
Promise.all(GALMURI.map((f) =>
  document.fonts.load(`${f.unit}px "${f.family}"`, '기숙사도서관본관학생회안내방탈출기린목펴쌓알합치러너출발낚시반납')
    .catch(() => null)
)).then(() => document.fonts.ready).then(repaintTextArt);

const PAINTED = {};

/* ---- 벤치 2×2 — 등받이가 뒤, 앉는 면이 앞 ---- */
{
  const c = canvasOf(2, 2), g = c.getContext('2d');
  shadow(g, 16, 29, 15, 3);
  /* 뒷다리 — 등받이보다 먼저 깔아야 뒤로 넘어갑니다 */
  [5, 25].forEach((x) => px(g, x, 8, 2, 6, FURN.metalDark));
  /* 등받이 기둥 둘 */
  [4, 26].forEach((x) => {
    px(g, x, 3, 3, 13, FURN.metalDark);
    px(g, x, 3, 1, 13, FURN.metal);
  });
  /* 등받이 살 셋 — 사이가 비어야 벤치로 보입니다 */
  for (let i = 0; i < 3; i++) {
    const y = 4 + i * 4;
    px(g, 4, y, 24, 3, FURN.wood);
    px(g, 4, y, 24, 1, FURN.woodLit);
    px(g, 4, y + 2, 24, 1, FURN.woodDark);
  }
  /* 팔걸이 — 좌면보다 한 칸 위에서 앞으로 뻗습니다 */
  [2, 27].forEach((x) => {
    px(g, x, 15, 3, 8, FURN.woodLit);
    px(g, x, 15, 3, 1, '#D8A66C');
    px(g, x, 22, 3, 1, FURN.woodDark);
  });
  /* 앉는 면 — 널 셋, 이음새가 보여야 나무입니다 */
  for (let i = 0; i < 3; i++) {
    const y = 16 + i * 3;
    px(g, 3, y, 26, 3, i === 0 ? FURN.woodLit : FURN.wood);
    px(g, 3, y + 2, 26, 1, FURN.woodDark);
  }
  px(g, 3, 25, 26, 2, '#6B4423');            // 앞코 그늘
  /* 앞다리 */
  [5, 25].forEach((x) => {
    px(g, x, 26, 3, 5, FURN.metalDark);
    px(g, x, 26, 1, 5, FURN.metal);
  });

}

/* ---- 알과 받침 2×3 ----
   부화장은 없앴습니다. 알은 학생회관 상점에서 가장 비싼 물건으로 팔
   예정이라 그림만 남깁니다 — 상점 진열대에 그대로 올라갑니다.
   알만 놓으면 바닥에 굴러다니는 것으로 보입니다. 받침 위에 올려야
   "가져가도 되는 것" 이 아니라 "고르는 것" 이 됩니다. */
function eggCanvas(key, shell, shellLit, shellDark, spot) {
  const c = canvasOf(2, 3), g = c.getContext('2d');
  shadow(g, 16, 45, 12, 3);
  /* 돌받침 — 위가 둥근 원기둥 */
  px(g, 4, 36, 24, 9, '#7B8590');
  px(g, 5, 37, 22, 7, '#A3ADB8');
  disc(g, 16, 37, 11, '#BAC4CE');
  disc(g, 16, 36, 10, '#D2DAE2');
  disc(g, 14, 35, 6, '#E8EEF3');
  g.fillStyle = '#8A939E';
  for (let x = 6; x < 27; x += 5) g.fillRect(x, 40, 1, 4);
  /* 알 — 아래가 넓은 타원. 위아래 반지름을 다르게 줘야 공이 안 됩니다. */
  for (let y = -15; y <= 13; y++) {
    const t = y < 0 ? y / 15 : y / 13;
    const w = Math.round(Math.sqrt(Math.max(0, 1 - t * t)) * (y < 0 ? 8.5 : 10));
    if (!w) continue;
    px(g, 16 - w, 20 + y, w * 2, 1, shellDark);
    px(g, 16 - w + 1, 20 + y, w * 2 - 2, 1, shell);
  }
  /* 왼쪽 위 광 */
  disc(g, 12, 14, 4, shellLit);
  disc(g, 11, 13, 2, '#FFFFFF');
  /* 무늬 — 종마다 다릅니다. 이게 없으면 알 넷이 색만 다른 같은 알입니다. */
  g.fillStyle = spot;
  [[15, 9, 4, 3], [10, 18, 5, 4], [19, 15, 4, 5], [14, 26, 6, 3], [21, 24, 3, 3]]
    .forEach(([x, y, w, h]) => g.fillRect(x, y, w, h));
  PAINTED[key] = c;
}
eggCanvas('eggTurtle', '#63B87A', '#8FD9A2', '#3D8A55', '#3F8F5C');
eggCanvas('eggGiraffe', '#F0C566', '#FFE1A0', '#C39338', '#B5762E');
eggCanvas('eggMeerkat', '#D8AE84', '#F2D2AE', '#A87F58', '#8E6440');
eggCanvas('eggPig', '#F2A6B2', '#FFCBD4', '#C4737F', '#B95F6E');

/* ---- 천막 부스 3×3 — 동아리 거리 ----
   지붕 · 기둥 · 판매대 셋이 다 있어야 부스입니다. 지붕만 그리면
   땅에 떠 있는 우산이 됩니다. */
const BEND = [-2, -1, 0, 1, 2];        // 천이 눕는 다섯 자세, 픽셀
const FLUTTER = {};                    // key -> 자세 다섯 장

function tentCanvas(key, cloth, clothLit, clothDark) {
  /* 뼈대와 천을 따로 굽습니다. 천만 바람에 눕고 기둥과 판매대는
     제자리에 있어야 합니다. */
  const frame = canvasOf(3, 3), fg = frame.getContext('2d');
  shadow(fg, 24, 45, 20, 4);
  /* 기둥 넷 — 지붕보다 먼저 */
  [4, 41].forEach((x) => { px(fg, x, 20, 3, 24, '#8A6039'); px(fg, x, 20, 1, 24, '#A87B4C'); });
  /* 판매대 */
  px(fg, 6, 30, 36, 12, '#8A6039');
  px(fg, 7, 31, 34, 10, '#B08050');
  px(fg, 7, 31, 34, 2, '#C99A64');
  px(fg, 6, 40, 36, 3, '#6B4423');
  fg.fillStyle = '#9A6C3E';
  for (let x = 10; x < 41; x += 7) fg.fillRect(x, 33, 1, 7);

  /* 지붕 — 줄무늬 차양. 아래 가장자리가 물결이어야 천으로 보입니다. */
  const roof = canvasOf(3, 3), g = roof.getContext('2d');
  px(g, 0, 8, 48, 14, clothDark);
  px(g, 1, 9, 46, 12, cloth);
  for (let x = 1; x < 47; x += 8) px(g, x, 9, 4, 12, clothLit);
  px(g, 1, 9, 46, 2, 'rgba(255,255,255,.28)');
  for (let x = 0; x < 48; x += 6) {
    disc(g, x + 3, 22, 3, clothDark);
    disc(g, x + 3, 21, 3, x % 12 ? cloth : clothLit);
  }
  /* 용마루 */
  px(g, 0, 6, 48, 3, '#6B4423');
  px(g, 22, 0, 4, 8, '#8A6039');
  disc(g, 24, 2, 3, '#FF6B52');

  /* 자세마다 지붕을 한 줄씩 밀어 붙입니다. 용마루(y<9)는 묶여 있으니
     안 밀고, 아래로 갈수록 제곱으로 더 밀립니다 - 천은 매달린 쪽이
     고정이고 자락이 가장 많이 날립니다.

     프레임마다 잘라 붙이지 않고 미리 굽는 이유는 이음매입니다. 실시간
     전단은 띠 경계마다 1px 틈이 생기고, 16px 그림에서 그건 찢어진
     천으로 보입니다. 다섯 장을 미리 구우면 그런 게 없습니다. */
  const Y0 = 9, Y1 = 26;
  FLUTTER[key] = BEND.map((b) => {
    const c = canvasOf(3, 3), cg = c.getContext('2d');
    cg.drawImage(frame, 0, 0);
    cg.drawImage(roof, 0, 0, 48, Y0, 0, 0, 48, Y0);
    for (let y = Y0; y < Y1; y++) {
      const k = (y - Y0) / (Y1 - Y0);
      cg.drawImage(roof, 0, y, 48, 1, Math.round(b * k * k), y, 48, 1);
    }
    cg.drawImage(roof, 0, Y1, 48, 48 - Y1, 0, Y1, 48, 48 - Y1);
    return c;
  });
  PAINTED[key] = FLUTTER[key][2];      // 바람 없을 때가 기준입니다
}

/* ---- 관문 4×4 ----
   미니게임존의 문입니다. 넷이 나란히 서므로 **서로 달라야** 하고, 동시에
   한 식구로 보여야 합니다. 그래서 뼈대(돌기둥·처마·문간)는 같게 두고
   천 색 · 안쪽 빛 · 문장(紋章) 셋만 바꿉니다.

   문 안쪽을 벽처럼 막지 않고 어둡게 파서 빛을 물렸습니다 — 관문은
   지나가는 곳이라 안이 안 보이면 그냥 벽에 붙인 장식이 됩니다. */
function gateEmblem(g, kind, cx, cy, ink) {
  /* 문장은 어두운 문간 위에 한 색으로만 얹힙니다. 채울 수 없으니
     테두리로 그립니다 — 속을 칠하면 안쪽 빛이 죽습니다. */
  const rect = (x, y, w, h) => {
    px(g, x, y, w, 1, ink); px(g, x, y + h - 1, w, 1, ink);
    px(g, x, y, 1, h, ink); px(g, x + w - 1, y, 1, h, ink);
  };
  if (kind === 'key') {
    /* 열쇠 — 동물 달리기 */
    circleLine(g, cx - 4, cy, 4, ink);
    circleLine(g, cx - 4, cy, 3, ink);
    px(g, cx - 1, cy - 1, 10, 2, ink);
    px(g, cx + 5, cy + 1, 2, 3, ink);
    px(g, cx + 8, cy + 1, 2, 3, ink);
  } else if (kind === 'up') {
    /* 위로 뻗는 화살표 — 기린 목 펴기. 기린을 이 크기에 그리면 실루엣이
       뭉개지므로, 생김새 대신 **하는 일**을 그립니다. */
    px(g, cx - 2, cy - 3, 4, 11, ink);
    for (let k = 0; k < 6; k++) px(g, cx - k, cy - 4 - k, k * 2 + 1, 1, ink);
    px(g, cx - 8, cy + 9, 16, 2, ink);            // 바닥 — 어디서부터 펴는지
  } else if (kind === 'card') {
    /* 카드 두 장 — 기억력 카드. 한 장만 무늬가 보입니다(짝을 찾는 중). */
    rect(cx - 10, cy - 8, 9, 15);
    rect(cx + 1, cy - 8, 9, 15);
    px(g, cx + 4, cy - 3, 3, 4, ink);
  } else if (kind === 'match3') {
    /* 블록 셋이 한 줄 — 동물 매칭 퍼즐. 가로로 셋이 맞으면 지워지는 것이
       이 놀이의 전부라, 그 순간을 그대로 그립니다. 가운데만 속을 채워
       "이제 맞았다" 를 보이고, 셋의 간격은 같게 둡니다 — 어긋나게 두면
       옆 문의 쌓기 문장과 헷갈립니다.

       (연우님 판본은 여기에 'shell' 을 넘겼는데 그런 문장이 없어서
        물음표가 그려지고 있었습니다.) */
    rect(cx - 11, cy - 4, 7, 7);
    rect(cx - 3, cy - 4, 7, 7);
    rect(cx + 5, cy - 4, 7, 7);
    px(g, cx - 1, cy - 2, 3, 3, ink);
  } else {
    /* 물음표 — 아직 정하지 않은 놀이 */
    px(g, cx - 4, cy - 7, 8, 2, ink);
    px(g, cx + 3, cy - 6, 2, 4, ink);
    px(g, cx - 1, cy - 3, 5, 2, ink);
    px(g, cx - 2, cy - 1, 2, 4, ink);
    px(g, cx - 2, cy + 5, 2, 2, ink);
  }
}
function gateCanvas(key, name, base, lit, dark, glow, emblem) {
  const c = canvasOf(4, 4), g = c.getContext('2d');
  shadow(g, 32, 60, 26, 4);

  /* ---- 문간 ---- */
  px(g, 14, 20, 36, 38, '#131A24');
  disc(g, 32, 24, 18, '#131A24');
  /* 안쪽 빛 — 다섯 겹으로 번집니다 */
  for (let k = 5; k >= 1; k--) {
    g.fillStyle = 'rgba(' + glow + ',' + (0.07 * (6 - k)).toFixed(2) + ')';
    g.beginPath(); g.ellipse(32, 42, 3 * k, 3.4 * k, 0, 0, 7); g.fill();
  }
  gateEmblem(g, emblem, 32, 40, 'rgba(' + glow + ',.85)');
  /* 아치 테두리 */
  circleLine(g, 32, 24, 18, dark);
  circleLine(g, 32, 24, 17, base);

  /* ---- 기둥 둘 ---- */
  [0, 48].forEach((x) => {
    px(g, x, 16, 16, 42, '#5E5449');
    px(g, x + 1, 17, 14, 40, '#A79A85');
    px(g, x + 1, 17, 5, 40, '#C6BAA3');
    px(g, x + 12, 17, 3, 40, '#877C6A');
    g.fillStyle = '#8B7F6C';
    for (let y = 22; y < 56; y += 7) g.fillRect(x + 1, y, 14, 1);
    /* 주두 · 초석 */
    px(g, x - 1, 12, 18, 6, '#5E5449');
    px(g, x, 13, 16, 4, '#C6BAA3');
    px(g, x - 1, 54, 18, 5, '#5E5449');
    px(g, x, 54, 16, 2, '#B3A791');
    /* 등 — 색이 문마다 달라, 멀리서도 넷을 셀 수 있습니다 */
    px(g, x + 4, 22, 8, 3, '#3A4652');
    px(g, x + 4, 25, 8, 7, dark);
    px(g, x + 5, 26, 6, 5, lit);
    px(g, x + 6, 27, 4, 3, '#FFFFFF');
    px(g, x + 4, 32, 8, 2, '#3A4652');
  });

  /* ---- 처마와 이름 판 ---- */
  px(g, 0, 10, 64, 6, '#5E5449');
  px(g, 1, 11, 62, 4, '#B3A791');
  px(g, 1, 11, 62, 1, '#D2C8B4');
  /* 박공 — 계단으로 쌓아 올립니다 */
  for (let k = 0; k < 4; k++) {
    px(g, 4 + k * 3, 10 - k * 3, 56 - k * 6, 3, k % 2 ? '#5E5449' : '#877C6A');
  }
  /* 이름 천 */
  px(g, 6, 0, 52, 12, dark);
  px(g, 7, 1, 50, 10, base);
  px(g, 7, 1, 50, 2, lit);
  px(g, 7, 9, 50, 2, dark);
  stamp(g, name, 7, dark, 32, 7, 'center', 'middle');
  stamp(g, name, 7, '#FFFFFF', 32, 6, 'center', 'middle');

  /* ---- 문지방 ---- */
  px(g, 10, 57, 44, 5, dark);
  px(g, 11, 57, 42, 3, base);
  px(g, 11, 57, 42, 1, lit);
  PAINTED[key] = c;
}
/* 문에 붙는 이름은 **표에서** 읽습니다(MINIGAMES). 여기에 다시 적어 두면
   표를 고쳐도 문패는 옛 이름인 채로 남습니다 — 실제로 그랬습니다.

   관문을 얻는 기준은 **3분**입니다. 이 방이 파는 것이 "세션을 끊는 대신
   3분 놀고 돌아가기" 라, 3분 안에 끝이 나는 것만 문을 얻습니다.
   거북이 알 합치기(2048)와 동물 매칭 퍼즐(24수, 제한 시간 없음)은
   그래서 뺐습니다 — 패널은 그대로 살아 있습니다. */
function paintGates() {
  for (const g of MINIGAMES) {
    const st = GATE_STYLE[g.prop];
    if (st) gateCanvas(g.prop, g.name, st.base, st.lit, st.dark, st.glow, st.emblem);
  }
}
paintGates();

/* ---- 서가 3×2 ----
   책등 색을 무작위로 흩되 폭은 2~4px 로 묶습니다. 폭까지 무작위면
   책이 아니라 색 얼룩이 됩니다. */
{
  const c = canvasOf(3, 2), g = c.getContext('2d');
  shadow(g, 24, 30, 22, 3);
  const spines = ['#B8523F', '#3E6E96', '#C89A3C', '#4E8A5C', '#8E5A9E',
                  '#C2705A', '#3F7F84', '#A8483F', '#5C6EA8', '#B08050'];
  /* 통 — 옆널 둘과 등판 */
  px(g, 1, 2, 46, 26, '#5E4128');
  px(g, 2, 3, 44, 24, '#7A5637');
  px(g, 2, 3, 44, 2, '#96693F');
  /* 두 단 */
  for (let s2 = 0; s2 < 2; s2++) {
    const y = 6 + s2 * 11;
    px(g, 4, y, 40, 9, '#4A3220');
    let x = 5;
    while (x < 43) {
      const w = 2 + Math.floor(rnd(x, y, s2) * 3);
      const h = 7 - Math.floor(rnd(x, y, s2 + 5) * 2);
      const col = spines[Math.floor(rnd(x, y, s2 + 9) * spines.length)];
      if (x + w > 43) break;
      px(g, x, y + 1 + (7 - h), w, h, col);
      px(g, x, y + 1 + (7 - h), w, 1, 'rgba(255,255,255,.28)');
      px(g, x, y + 8, w, 1, 'rgba(0,0,0,.30)');
      x += w + 1;
    }
    px(g, 3, y + 9, 42, 2, '#6B4A2E');       // 선반 앞코
    px(g, 3, y + 9, 42, 1, '#96693F');
  }
  px(g, 1, 27, 46, 2, '#3E2A18');
  PAINTED.stack = c;
}

/* ---- 캐럴 2×2 — 칸막이 1인 열람석 ----
   위 칸은 칸막이(뒤판과 날개), 아래 칸은 책상면. 의자는 따로 남쪽에
   놓습니다 — 책상 줄 + 의자 줄이 이 월드의 앉는 문법이고, 캐럴이라고
   문법을 바꾸면 앉는 법을 다시 배워야 합니다. 색은 서가(stack)와
   같은 나무 계열 — 도서관 목가구는 한 식구여야 합니다. */
{
  const c = canvasOf(2, 2), g = c.getContext('2d');
  shadow(g, 16, 30, 14, 3);
  /* 뒤판 */
  px(g, 2, 2, 28, 14, '#5E4128');
  px(g, 3, 3, 26, 12, '#7A5637');
  px(g, 3, 3, 26, 1, '#96693F');
  /* 날개 둘 — 책상까지 내려와 자리를 감쌉니다. 이게 없으면 그냥 책상입니다 */
  [2, 27].forEach((x) => {
    px(g, x, 2, 3, 24, '#5E4128');
    px(g, x + 1, 3, 1, 22, '#7A5637');
  });
  /* 책상면 */
  px(g, 5, 16, 22, 8, FURN.woodLit);
  px(g, 5, 16, 22, 1, '#D8A66C');
  px(g, 5, 23, 22, 1, FURN.woodDark);
  /* 놓인 것 — 펼친 책과 작은 스탠드 */
  px(g, 8, 18, 7, 4, '#EFE8D8');
  px(g, 11, 18, 1, 4, '#B8A98C');
  px(g, 20, 11, 2, 7, FURN.metalDark);
  px(g, 18, 8, 6, 3, '#F2E3B2');
  px(g, 18, 10, 6, 1, '#E0C878');
  /* 앞면 */
  px(g, 5, 24, 22, 4, '#6B4A2E');
  PAINTED.carrel = c;
}

/* ---- 대출 카운터 4×3 — ㄱ자 통짜 ----
   왼팔이 손님을 가르고 안이 사서 자리입니다. 카운터가 사람을 가르는
   것이 상점·카운터 문법의 전부이고(스타듀), 치수는 카날라베 도서관
   U자 실측 — 팔 두께 1칸, 안 2칸 — 을 그대로 씁니다. */
{
  const c = canvasOf(4, 3), g = c.getContext('2d');
  shadow(g, 32, 44, 28, 4);
  const top = '#C99257', face = '#A8703F', dark = '#7A4C25', edge = '#D8A66C';
  /* 가로 바 — 윗줄 전체 */
  px(g, 0, 2, 64, 8, top);
  px(g, 0, 2, 64, 1, edge);
  px(g, 0, 10, 64, 5, face);
  px(g, 0, 15, 64, 1, dark);
  /* 세로 팔 — 왼 열, 손님(서쪽)과 사서(동쪽)를 가릅니다.
     이 월드의 원근 문법은 윗면 + 남쪽 면입니다. 처음에 면을 동쪽에
     2px 로 그렸더니 카운터가 아니라 세워 둔 판자로 읽혔습니다 —
     윗면을 꽉 채우고 남쪽 끝에만 면을 줍니다. */
  px(g, 1, 2, 14, 38, top);
  px(g, 1, 2, 1, 38, edge);
  px(g, 14, 2, 1, 38, dark);
  px(g, 1, 40, 14, 5, face);
  px(g, 1, 45, 14, 1, dark);
  /* 팔 위 — 널 이음새 두 줄. 민무늬 윗면은 재질이 없습니다 */
  px(g, 1, 14, 14, 1, 'rgba(0,0,0,.10)');
  px(g, 1, 27, 14, 1, 'rgba(0,0,0,.10)');
  /* 바 위 — 종과 책 무더기. 카운터가 비어 있으면 닫힌 창구입니다 */
  px(g, 46, 4, 6, 4, '#E0C878');
  px(g, 48, 2, 2, 2, '#B89A48');
  px(g, 22, 3, 8, 2, '#3E6E96');
  px(g, 23, 5, 8, 2, '#B8523F');
  PAINTED.circDesk = c;
}

/* ---- 검색대 1×2 — 기둥 위 화면 ----
   화면 색은 도서관 벽 팔레트(IPAL.library)의 청록 유리 계열 — 새 색을
   만들지 않습니다. */
{
  const c = canvasOf(1, 2), g = c.getContext('2d');
  shadow(g, 8, 30, 6, 2);
  px(g, 6, 13, 4, 15, FURN.metalDark);
  px(g, 6, 13, 1, 15, FURN.metal);
  px(g, 2, 2, 12, 10, '#32524F');
  px(g, 3, 3, 10, 8, '#BFE0DC');
  px(g, 4, 4, 8, 1, '#507C78');
  px(g, 4, 6, 6, 1, '#507C78');
  px(g, 4, 8, 7, 1, '#507C78');
  px(g, 4, 28, 8, 3, FURN.metalDark);
  PAINTED.searchPC = c;

/* ---- 신간 진열대 2×1 — 표지가 정면을 봅니다 ----

  /* 매트 판 — 모서리를 한 픽셀씩 깎아 둥글게 */

  px(g, 3, 4, 26, 25, '#0D7769');
  px(g, 3, 5, 26, 22, '#2DD4BF');
  px(g, 4, 4, 24, 1, '#2DD4BF');
  /* 윗면 하이라이트 한 줄 */

  /* 안쪽 테두리 — 매트의 가장자리 선 */

  /* 발자국 둘 — 여기 서라는 뜻. 이게 없으면 그냥 깔개입니다 */

  /* 아래쪽 결 — 미끄럼 방지 무늬 */

/* ---- 화단 1×2 — 세로로 섭니다 ----
   가로로 눕히면 벤치와 헷갈립니다. 돌 테두리 안에 흙을 담고 줄기를
   세워야 화단으로 보입니다 — 꽃만 흩뿌리면 얼룩입니다. */
{
  const c = canvasOf(1, 2), g = c.getContext('2d');
  shadow(g, 8, 30, 7, 2);
  /* 돌 테두리 */
  px(g, 1, 8, 14, 23, '#7E8590');
  px(g, 2, 9, 12, 21, '#9BA3AE');
  px(g, 2, 9, 12, 2, '#B8C0C9');
  px(g, 2, 9, 2, 21, '#B0B8C2');
  g.fillStyle = '#6E757F';
  for (let y = 12; y < 30; y += 5) g.fillRect(2, y, 12, 1);
  for (let y = 9; y < 30; y += 5)
    g.fillRect(((y / 5) | 0) % 2 ? 6 : 10, y, 1, 5);
  /* 흙 */
  px(g, 3, 11, 10, 17, '#5E4230');
  px(g, 3, 11, 10, 2, '#74523B');
  /* 줄기와 잎 — 뒤가 크고 앞이 작아야 깊이가 생깁니다 */
  const stems = [[5, 12, 9], [8, 11, 11], [11, 13, 8], [6, 18, 7], [10, 19, 6]];
  stems.forEach(([sx, sy, h], i) => {
    px(g, sx, sy, 1, h, i % 2 ? '#3F8A4E' : '#4E9E63');
    px(g, sx - 2, sy + h - 4, 2, 2, '#5AAE6E');
    px(g, sx + 1, sy + h - 6, 2, 2, '#3F8A4E');
  });
  /* 꽃 — 다섯 송이만. 많으면 흙이 안 보여 덤불이 됩니다. */
  const blooms = ['#E8D45C', '#E0708A', '#F2F4F7', '#FF6B52', '#C87ED8'];
  stems.forEach(([sx, sy], i) => {
    const by = sy - 1;
    px(g, sx - 1, by, 3, 3, blooms[i]);
    px(g, sx, by - 1, 1, 1, blooms[i]);
    px(g, sx, by + 1, 1, 1, '#B8942E');
    px(g, sx - 1, by, 2, 1, 'rgba(255,255,255,.35)');
  });
  PAINTED.planter = c;
}

/* ---- 방향 표지판 5×5 — 광장 한가운데 ----
   메이플의 안내 NPC가 하던 일을 물건이 합니다. 스타듀밸리처럼 나무
   팻말이지만 판 색이 그 건물 지붕색과 같아서, 표지판만 보면 어디에
   뭐가 있는지 압니다.

   3×4 에서 5×5 로 키웁니다. 전 판은 광장 한가운데에서 **평평한 널판
   한 장**으로 보였습니다 — 폭 39px 짜리 판에 이름만 얹으니 색 띠 넷이
   포개진 것이 되고, 사람이 앞에 서면 아래 두 장이 통째로 가렸습니다.
   ZEP·개더의 길잡이 표지는 사람 키보다 높은 곳에 판을 답니다. 여기도
   판을 사람 머리 위(y13~64)로 올리고 받침만 발밑에 남깁니다.

   막는 칸은 한 칸(받침돌) 그대로입니다 — 커진 것은 그림뿐이라 광장을
   걸어 다니는 느낌은 전과 같습니다.

   상징을 되살립니다. 전에 뺀 이유는 18px 짜리 책과 글자가 같은 판
   안에서 겹쳤기 때문인데, 판 안폭이 60px 이 되면서 상징 10px · 이름 ·
   화살표가 각자 제 칸을 갖습니다. 상징은 **지붕에 이미 있는 것과 같은
   것**을 씁니다(달·책·시계·우승컵) — 지붕에서 본 그림을 표지판에서 다시
   보면 두 번째부터는 글자를 안 읽어도 됩니다.

   블록이 아니라 함수인 이유 — 갈무리가 웹폰트라 스크립트를 읽는 시점에
   아직 안 와 있습니다. 글꼴이 도착하면 이 함수를 한 번 더 부릅니다. */
function signIcon(g, kind, x, y, ink, lit) {
  /* 10×10 안에 들어가는 상징. 지붕 상징(roofIcon)의 뼈대만 남긴 것이라
     같은 것으로 읽히면서 이 크기에서 안 뭉갭니다. 획이 둘로 갈리는
     그림(펼친 책·눈금 있는 시계)은 10px 에서 격자무늬가 되므로,
     **덩어리 하나 + 표시 하나**로 줄였습니다. */
  if (kind === 'moon') {
    /* 초승달 — 원 두 개를 겹쳐 깎으면 이 크기에서 가장자리가 울퉁불퉁해져
       고래처럼 보입니다. 획을 직접 놓습니다. */
    px(g, x + 4, y, 2, 1, lit);
    px(g, x + 3, y + 1, 2, 1, lit);
    px(g, x + 2, y + 2, 3, 4, lit);
    px(g, x + 3, y + 6, 2, 1, lit);
    px(g, x + 4, y + 7, 2, 1, lit);
    px(g, x + 8, y + 2, 1, 1, lit);          // 별 하나
    px(g, x + 7, y + 3, 3, 1, lit);
    px(g, x + 8, y + 4, 1, 1, lit);
  } else if (kind === 'book') {
    px(g, x + 1, y, 8, 10, lit);             // 표지
    px(g, x + 3, y + 1, 5, 8, '#FFFFFF');    // 책배
    px(g, x + 3, y + 1, 1, 8, 'rgba(0,0,0,.22)');
    px(g, x + 6, y + 6, 2, 4, '#D8442C');    // 갈피끈 — 판이 청록이라 붉은색이어야 보입니다
  } else if (kind === 'clock') {
    disc(g, x + 5, y + 5, 5, lit);
    disc(g, x + 5, y + 5, 4, ink);           // 테만 남깁니다
    px(g, x + 5, y + 2, 1, 4, lit);          // 분침
    px(g, x + 5, y + 5, 3, 1, lit);          // 시침
  } else if (kind === 'cup') {
    px(g, x + 2, y + 1, 6, 4, lit);          // 잔
    px(g, x + 3, y + 5, 4, 1, lit);
    px(g, x + 1, y + 1, 1, 3, lit); px(g, x + 8, y + 1, 1, 3, lit);   // 손잡이
    px(g, x + 4, y + 6, 2, 2, lit);          // 자루
    px(g, x + 2, y + 8, 6, 1, lit);          // 받침
  } else if (kind === 'dice') {
    /* 주사위 — 눈을 1px 로 찍으면 이 크기에서 안 보입니다. 2px 로 놓고
       대신 네 귀를 한 점씩 깎아 실루엣으로 주사위를 말합니다. */
    px(g, x + 1, y, 8, 9, lit);
    [[1, 0], [8, 0], [1, 8], [8, 8]].forEach(([dx, dy]) => px(g, x + dx, y + dy, 1, 1, ink));
    px(g, x + 2, y + 1, 2, 2, ink); px(g, x + 6, y + 1, 2, 2, ink);
    px(g, x + 4, y + 4, 2, 2, ink);
    px(g, x + 2, y + 6, 2, 2, ink); px(g, x + 6, y + 6, 2, 2, ink);
  }
}

/** 판 끝에 다는 화살촉. 5×5 삼각형 하나 — 뾰족한 쪽이 가려는 쪽입니다.

    **흰색**입니다. 지붕색으로 그렸더니 같은 색인 상징과 한 덩어리로
    보여서, 우승컵 옆의 ▼ 가 컵 두 개로 읽혔습니다. 화살표는 글자와
    같은 층(흰색), 상징은 색의 층(지붕색)으로 갈라 둡니다. */
function signArrow(g, dir, x, y) {
  const c = '#FFFFFF';
  for (let k = 0; k < 3; k++) {
    if (dir === 'r') px(g, x + 4 - k, y + 2 - k, 1, k * 2 + 1, c);
    else if (dir === 'l') px(g, x + k, y + 2 - k, 1, k * 2 + 1, c);
    else if (dir === 'u') px(g, x + 2 - k, y + k, k * 2 + 1, 1, c);
    else px(g, x + 2 - k, y + 4 - k, k * 2 + 1, 1, c);
  }
}

function paintSignpost() {
  /* 판이 다섯이 되면서 5×5 로는 마지막 판이 받침돌을 밟습니다. 판을
     얇게 눌러 다섯을 욱여넣는 대신 기둥을 한 칸 늘였습니다 — 판 높이를
     줄이면 그 안의 글자가 먼저 잘립니다. 대신 광장에 세울 때 한 칸 위에
     놓아(prop 20,18) 받침돌은 전과 같은 자리에 섭니다. */
  const c = canvasOf(5, 6), g = c.getContext('2d');
  const CX = 40;
  shadow(g, CX, 93, 15, 3);

  /* 받침돌 — 다듬은 돌 세 켜. 한 덩이로 두면 나무 기둥이 땅에 꽂힌
     것으로 보입니다. 켜가 보여야 사람이 쌓은 것이 됩니다. */
  px(g, CX - 15, 86, 30, 8, '#5F6874');
  px(g, CX - 14, 87, 28, 6, '#96A0AA');
  px(g, CX - 14, 87, 28, 2, '#BDC6CE');
  px(g, CX - 12, 81, 24, 6, '#6E757F');
  px(g, CX - 11, 82, 22, 4, '#A6AFB8');
  px(g, CX - 11, 82, 22, 1, '#C6CED5');
  g.fillStyle = '#7C848E';
  for (let x = CX - 9; x < CX + 10; x += 6) g.fillRect(x, 88, 1, 4);
  /* 발밑 풀 — 돌과 포석 사이가 붙어 보이지 않게 두 포기만 */
  px(g, CX - 17, 90, 1, 4, '#5FA855'); px(g, CX - 16, 92, 1, 2, '#5FA855');
  px(g, CX + 16, 91, 1, 3, '#4E9E63'); px(g, CX + 17, 92, 1, 2, '#4E9E63');

  /* 기둥 — 왼쪽이 밝고 오른쪽이 어둡습니다(빛은 왼쪽 위) */
  px(g, CX - 4, 10, 8, 74, '#6B4A2E');
  px(g, CX - 4, 10, 3, 74, '#8A6039');
  px(g, CX + 2, 10, 2, 74, '#523821');
  g.fillStyle = 'rgba(82,56,33,.5)';
  for (let y = 16; y < 82; y += 7) g.fillRect(CX - 2, y, 3, 1);

  /* 꼭대기 — 작은 박공지붕과 등. 광장에서 가장 높은 물건이므로 여기만
     청록(브랜드색)이 한 번 나오고, 밤에는 등이 켜집니다(LAMPS.signpost). */
  px(g, CX - 13, 12, 26, 3, '#0C5A4F');
  for (let k = 0; k < 6; k++) px(g, CX - 12 + k * 2, 11 - k, 24 - k * 4, 2, k < 3 ? '#12A592' : '#2DD4BF');
  px(g, CX - 12, 13, 24, 1, 'rgba(255,255,255,.20)');
  px(g, CX - 1, 2, 2, 4, '#5F6874');
  disc(g, CX, 2, 3, '#8A6039');
  disc(g, CX, 2, 2, '#FFE9A8');
  px(g, CX - 1, 1, 1, 1, '#FFFFFF');

  /* ---- 판 한 장 ----
     방향은 **네 겹으로** 말합니다 — 판이 어느 쪽으로 뻗었는가, 끝이
     어느 쪽으로 뾰족한가, 화살촉이 어디를 보는가, 그리고 상징이
     무엇인가. 하나만 쓰면 북과 남을 화살표 모양으로만 구분해야 해서
     흘깃 봐서는 안 읽힙니다.

     이름은 판마다 **같은 자리에서 시작**합니다(상징 다음 칸). 넷을
     세로로 쌓으면 그 줄이 목록처럼 읽힙니다. */
  function board(y, dir, color, dark, label, icon) {
    const w = 62, h = 12;
    /* **다섯 판이 같은 자리에서 시작합니다.** 전에는 방향마다 x 를 6·9·12 로
       어긋나게 놓아 "판이 그쪽으로 뻗은" 느낌을 냈는데, 다섯을 세로로
       쌓으니 목록이 아니라 어질러 놓은 것으로 보였습니다. 방향은 화살촉과
       뾰족한 끝이 이미 말하고 있으므로, 자리까지 어긋날 필요가 없습니다.
       기둥(CX=40) 기준으로 정확히 가운데입니다 — (80-62)/2 = 9. */
    const x = 9;
    const vert = dir === 'u' || dir === 'd';

    px(g, x + 2, y + 2, w, h, 'rgba(0,0,0,.24)');   // 드리운 그림자
    px(g, x, y, w, h, color);                       // 테두리 = 밝은 지붕색
    px(g, x + 1, y + 1, w - 2, h - 2, dark);        // 판 = 어두운 쪽
    px(g, x + 1, y + 1, w - 2, 1, 'rgba(255,255,255,.18)');
    px(g, x + 1, y + h - 2, w - 2, 1, 'rgba(0,0,0,.30)');
    /* 못 둘 — 판이 기둥에 박혀 있다는 표시. 없으면 떠 있는 색띠입니다 */
    px(g, x + 3, y + 3, 1, 1, 'rgba(0,0,0,.45)');
    px(g, x + w - 4, y + h - 4, 1, 1, 'rgba(0,0,0,.45)');

    if (!vert) {
      const right = dir === 'r', tip = right ? x + w : x - 1;
      for (let k = 0; k < 6; k++) {
        const t = right ? tip + k : tip - k;
        px(g, t, y + k, 1, h - k * 2, dark);
        px(g, t, y + k, 1, 1, color);
        px(g, t, y + h - k - 1, 1, 1, color);
      }
    }

    /* 상징 · 이름 · 화살촉.

       위·아래 판은 뾰족할 옆이 없습니다. 전 판본은 판 밖으로 삼각
       갈매기를 세워 붙였는데, 위쪽은 지붕이 아래쪽은 받침돌이 그 자리를
       덮어 화면에서 한 번도 안 보였습니다. 대신 **화살촉을 양끝에**
       답니다 — 판 안이라 아무것도 안 가리고, 둘이면 하나보다 세게
       "이쪽" 이라고 말합니다. */
    /* 상징은 **가리키지 않는 쪽 끝**, 화살촉은 가리키는 쪽 끝.
       위·아래 판은 뾰족할 옆이 없어 오른쪽 끝에 답니다 — 양끝에 둘씩
       달던 것을 하나로 줄였습니다. 왼쪽 끝은 이제 상징 자리이고,
       화살촉을 거기 또 두면 상징과 겹칩니다. */
    const ax = dir === 'l' ? x + 3 : x + w - 10;                   // 화살촉 자리
    const ix = dir === 'l' ? x + w - 12 : x + 3;                   // 상징 자리
    signIcon(g, icon, ix, y + 1, dark, color);
    signArrow(g, dir, ax, y + 4);
    /* 이름은 **판 한가운데**입니다. 상징(왼쪽 8px)과 화살촉(오른쪽 8px)
       사이가 46px 이고, 세 글자 이름이 24px 이라 양옆에 11px 씩 남습니다 —
       네 글자('학생회관' 32px)도 7px 씩 남아 안 겹칩니다.
       밝은 지붕색 위에서도 읽히도록 한 픽셀 아래에 그림자를 깝니다. */
    const cx2 = x + w / 2;
    stamp(g, label, 8, 'rgba(0,0,0,.55)', cx2 + 1, y + 3, 'center');
    stamp(g, label, 8, '#FFFFFF', cx2, y + 2, 'center');
  }

  /* 위에서 아래로 북 · 동 · 동 · 서 · 남. 판 높이 순서가 곧 지도입니다.
     미니게임관은 표지판에서 보면 오른쪽 위 — 가로로 열일곱 칸, 세로로
     여덟 칸이라 동쪽이 더 멉니다. 그래서 도서관 바로 아래, 같은 오른쪽
     묶음에 답니다. 같은 방향 판이 둘이면 실제 이정표가 그렇듯 위아래로
     붙습니다. */
  board(15, 'u', '#E79C6E', '#8A461F', '기숙사', 'moon');
  board(28, 'r', '#5FB0A3', '#1F544C', '도서관', 'book');
  board(41, 'r', '#9E80D2', '#3E2A63', '미니게임', 'dice');
  board(54, 'l', '#5A7FA8', '#1E3550', '본관', 'clock');
  board(67, 'd', '#7FCE96', '#2E6B45', '학생회관', 'cup');

  PAINTED.signpost = c;
}
paintSignpost();
TEXT_ART.push(paintSignpost);

/** 그린 캔버스를 소품으로 등록합니다. */
function paintedProp(key, w, h, solidRows) {
  const c = [];
  for (let j = 0; j < h; j++) {
    c.push([]);
    for (let i = 0; i < w; i++) c[j].push(solidRows ? (solidRows[j] ? 1 : 0) : 1);
  }
  /* key 를 남깁니다 — 글꼴이 온 뒤 repaintTextArt 가 이걸 보고 캔버스를
     다시 가리킵니다. 없으면 표지판이 폴백 글자인 채로 굳습니다. */
  return { s: 'img', key, canvas: PAINTED[key], w, h, c, t: null };
}

/* ---- 러너 안내판 2×3 — 운동장 남쪽 입구 ----
   글자를 넣는 이유: 표시는 ▼ 하나뿐이라 무엇을 여는 자리인지 그림만으로는
   안 읽힙니다. 관문 넷이 이름 천을 다는 것과 같은 이유입니다.
   판 안의 그림은 **위로 뻗는 화살표**입니다 — 이 게임에서 하는 동작이
   그것 하나라서, 조작을 그림 한 장으로 말할 수 있습니다. */
function paintRunBoard() {
  const c = canvasOf(2, 3), g = c.getContext('2d');
  g.clearRect(0, 0, c.width, c.height);
  shadow(g, 16, 46, 12, 3);
  [8, 21].forEach((x) => { px(g, x, 36, 3, 11, '#6B4A2E'); px(g, x, 36, 1, 11, '#8B6540'); });
  px(g, 0, 2, 32, 36, '#5E4128');
  px(g, 1, 3, 30, 34, '#8A6039');
  px(g, 2, 4, 28, 32, '#FFF6F3');
  px(g, 2, 4, 28, 2, '#FFFFFF');
  /* 이름 띠 — 코랄. 미니게임관 관문 색과 짝을 맞춥니다 */
  px(g, 2, 5, 28, 9, '#E8695A');
  px(g, 2, 5, 28, 1, '#FFA694');
  stamp(g, '러너', 7, '#8E2E1C', 16, 11, 'center', 'middle');
  stamp(g, '러너', 7, '#FFFFFF', 16, 10, 'center', 'middle');
  /* 위로 뻗는 화살표 — 뾰족한 쪽이 **위**입니다. 이 게임에서 하는 동작이
     그것 하나라, 조작을 그림 한 장으로 말할 수 있습니다. */
  const ink = '#2A2320';
  for (let k = 0; k < 6; k++) px(g, 16 - k, 17 + k, k * 2 + 1, 1, ink);
  px(g, 14, 23, 4, 10, ink);
  px(g, 8, 34, 16, 2, '#B9A99F');                 // 바닥 — 어디서부터 드는지
  PAINTED.runBoard = c;
}

    px(g, 4, y - 1, 24, 10, '#4A3323');

    for (let i = 0; i < 7 && x < 27; i++) {
      const w = 2 + ((i + row * 3) % 3);
      px(g, x, y, w, 8, spines[(i + row * 4) % spines.length]);
      px(g, x, y, w, 1, 'rgba(255,255,255,.45)');
      x += w + 1;
    }
  });
  px(g, 1, 2, 30, 3, '#B08050');                 // 손잡이
  px(g, 1, 2, 30, 1, '#D6A165');
  px(g, 3, 30, 4, 2, '#3A332C'); px(g, 25, 30, 4, 2, '#3A332C');   // 바퀴
  PAINTED.bookCart = c;
}

/* ---- 안내소 게시판 2×3 — 미니게임관 ----
   여기 있던 것은 코르크 게시판(board)이었습니다. 게시판은 "붙여 둔 것을
   읽는 곳" 이라 벽 아무 데나 있어도 되는 물건인데, 이 방의 성격이
   **어디에 무엇이 있는지 알려 주고 데려다주는 곳**으로 바뀌었으니
   물건도 바뀌어야 합니다. 지도 핀 넷과 이름표 하나. */
function paintDirBoard() {
  const c = canvasOf(2, 3), g = c.getContext('2d');
  g.clearRect(0, 0, c.width, c.height);
  shadow(g, 16, 46, 12, 3);
  px(g, 13, 34, 6, 13, '#5E5449');
  px(g, 13, 34, 2, 13, '#877C6A');
  px(g, 8, 44, 16, 3, '#4A443C');
  px(g, 0, 1, 32, 36, '#4E3480');
  px(g, 1, 2, 30, 34, '#8A6BC4');
  px(g, 2, 3, 28, 32, '#F4EDE4');
  /* 이름 띠 — 자주. 이 방의 지붕 색입니다 */
  px(g, 2, 3, 28, 9, '#6B52A8');
  px(g, 2, 3, 28, 1, '#B79BE8');
  stamp(g, '안내소', 7, '#3A2568', 16, 9, 'center', 'middle');
  stamp(g, '안내소', 7, '#FFFFFF', 16, 8, 'center', 'middle');
  /* 작은 지도 — 네모 하나에 핀 넷. 어디에 무엇이 있는지가 이 물건입니다 */
  px(g, 5, 15, 22, 17, '#CDE3D2');
  px(g, 5, 15, 22, 1, '#E4F1E7');
  px(g, 5, 23, 22, 2, '#9AA3AE');
  px(g, 14, 15, 2, 17, '#9AA3AE');
  [[7, 17, '#E8695A'], [21, 18, '#2DD4BF'], [8, 27, '#E0AE3C'], [22, 27, '#8A6BC4']]
    .forEach(([x, y, col]) => {
      px(g, x, y, 4, 4, col);
      px(g, x + 1, y + 4, 2, 3, '#4A443C');
    });
  PAINTED.dirBoard = c;
}
paintDirBoard();

PAINTED.pennant = canvasOf(1, 2);
PAINTED.schoolCushion = canvasOf(1, 1);
function paintSchoolProps() {
  const col = roomColor();
  const [r, g_, b] = hexRGB(col);
  const lit = 'rgba(255,255,255,.30)', dark = 'rgba(0,0,0,.26)';

  /* 삼각 응원기 — 벽에 거는 페넌트 */
  {
    const c = PAINTED.pennant, g = c.getContext('2d');
    g.clearRect(0, 0, c.width, c.height);
    px(g, 2, 2, 2, 26, '#8E827C');                     // 걸이 끈
    px(g, 2, 2, 1, 26, '#B4AAA4');
    /* 깃발 — 오른쪽으로 갈수록 좁아지는 삼각형 */
    for (let y = 0; y < 14; y++) {
      const w = 13 - Math.round(y * 0.55);
      px(g, 4, 5 + y, w, 1, y < 3 ? lit : col);
    }
    g.fillStyle = dark;
    for (let y = 10; y < 14; y++) g.fillRect(4, 5 + y, 13 - Math.round(y * 0.55), 1);
    px(g, 4, 5, 13, 1, 'rgba(255,255,255,.5)');
    px(g, 6, 9, 5, 2, readableOn(col) === '#FFFFFF' ? '#FFFFFF' : '#2A2320');
  }

  /* 방석 — 학교 색 천에 흰 테두리 */
  {
    const c = PAINTED.schoolCushion, g = c.getContext('2d');
    g.clearRect(0, 0, c.width, c.height);
    shadow(g, 8, 14, 6, 2);
    px(g, 2, 5, 12, 8, 'rgb(' + Math.round(r * .78) + ',' + Math.round(g_ * .78) + ',' + Math.round(b * .78) + ')');
    px(g, 3, 6, 10, 6, col);
    px(g, 3, 6, 10, 2, lit);
    px(g, 3, 12, 10, 1, dark);
    px(g, 7, 8, 2, 2, 'rgba(255,255,255,.55)');
  }
}
/* 벽에 거는 것이라 anchor 0 입니다 — 방석과 이유는 다릅니다. 응원기 앞에
   서면 사람이 앞에 와야 하는데, 발 줄로 정렬하면 깃발이 사람을 덮습니다. */
PROP.pennant   = { ...paintedProp('pennant', 1, 2, [0, 0]), anchor: 0 };
/* 방석은 밟고 지나갑니다. anchor 0 이라야 캐릭터가 그 위에 서고,
   안 그러면 방석이 사람을 가립니다(스트레칭 매트에서 겪은 것과 같은 것). */
PROP.schoolCushion = { ...paintedProp('schoolCushion', 1, 1, [0]), anchor: 0 };
PROP.reed      = paintedProp('reed', 1, 2, [0, 0]);
/* ---- 벤치도 앉는 자리입니다 ----
   길가에 벤치를 세워 놓고 앉지 못하게 두면, 그건 벤치 그림이지 벤치가
   아닙니다. **앉기는 어디서나** 되게 하고, 세션·웹캠은 여전히
   도서관·본관에서만 돌립니다(sit 참고). 쉬는 것과 집중하는 것은 다른
   일이고, 다른 일이라야 둘 다 제자리를 지킵니다.

   seats 는 **앉는 칸의 어긋남**입니다. 의자는 그림 한 칸이 곧 자리라
   기본값 [[0,0]] 으로 충분한데, 벤치는 2×2 라 윗줄이 등받이이고 아랫줄이
   좌면입니다. 윗줄에 앉히면 발 줄이 좌면보다 위에 서고, 정렬 기준이 발
   줄이라 **벤치가 사람 앞에 그려집니다** — 앉은 사람이 좌면 뒤로 사라집니다.
   아랫줄 두 칸에 앉히면 등받이를 등지고 앉은 그림이 되고, 2인용 벤치가
   실제로 둘이 앉는 자리가 됩니다.

   sitDir 이 아래인 이유 — 등받이가 뒤(위)에 있으니 앉은 사람은 앞을 봅니다.
   bake 의 책상 규칙은 책상을 보고 방향을 정하는데 벤치에는 책상이 없어서,
   그 규칙에 맡기면 등받이를 마주 보고 앉습니다. */
const BENCH_SEATS = { sit: true, seats: [[0, 1], [1, 1]], sitDir: 'down' };
PROP.bench     = { ...paintedProp('bench', 2, 2, [0, 1]), ...BENCH_SEATS };

/* 막는 것은 받침돌뿐입니다 — 판 밑으로는 지나갈 수 있습니다.
