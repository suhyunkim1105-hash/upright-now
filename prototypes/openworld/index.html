<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>기린캠퍼스 — 오픈월드 프로토타입</title>

<style>
  /* ==================================================================
     기린캠퍼스 — 화면 색

     제품은 밝은 서비스이고, 그 안에 픽셀 세계가 들어 있습니다. ZEP 이
     그렇듯 UI 는 흰 판이고 월드만 그림입니다. 예전 다크라임은 월드와
     UI 가 같은 어둠이라 어디까지가 게임인지 흐렸습니다.

     **코랄 위에 흰 글자는 쓰지 않습니다.** 대비가 2.81 로 AA 에 못
     미칩니다(재서 확인했습니다). 코랄은 채움으로 쓰고 글자는 잉크를
     얹으며(5.50), 코랄로 글자를 쓸 때는 700 단계를 씁니다(5.14).
     ================================================================== */
  @font-face {
    font-family: 'Pretendard Variable';
    src: url('assets/fonts/PretendardVariable.woff2') format('woff2-variations');
    font-weight: 45 920;
    font-style: normal;
    font-display: swap;
  }

  /* 갈무리 — 픽셀 격자에 맞춰 설계된 한글 글꼴입니다. 세 종을 쓰는 이유는
     크기마다 획이 따로 그려져 있기 때문입니다. 7 을 키워 11 자리에 쓰면
     갈무리를 쓰는 뜻이 없어집니다.
     SIL Open Font License 1.1 — assets/fonts/Galmuri-OFL.md */
  @font-face {
    font-family: 'Galmuri7';
    src: url('assets/fonts/Galmuri7.woff2') format('woff2');
    font-weight: 400; font-style: normal; font-display: block;
  }
  @font-face {
    font-family: 'Galmuri9';
    src: url('assets/fonts/Galmuri9.woff2') format('woff2');
    font-weight: 400; font-style: normal; font-display: block;
  }
  @font-face {
    font-family: 'Galmuri11';
    src: url('assets/fonts/Galmuri11.woff2') format('woff2');
    font-weight: 400; font-style: normal; font-display: block;
  }

  :root {
    /* 코랄 — 서비스 주색 */
    --coral-50:  #FFF5F2;
    --coral-100: #FFE7E1;
    --coral-200: #FFCCC1;
    --coral-300: #FFAA99;
    --coral-400: #FF8A73;
    --coral:     #FF6B52;
    --coral-600: #F0523A;
    --coral-700: #C2412C;   /* 흰 바탕 위 코랄 글자 — AA */

    /* 중성 — 코랄 쪽으로 살짝 기울인 따뜻한 회색.
       순회색은 고른 티가 안 나고 코랄 옆에서 파랗게 보입니다. */
    --ink:       #2A2320;
    --ink-2:     #6B5F5A;
    --ink-3:     #9A8E88;
    --line:      #EFE6E2;
    --line-2:    #E4D8D2;
    --surface:   #FFFFFF;
    --surface-2: #FBF7F5;
    --surface-3: #F4ECE8;

    --on-coral:  #2A2320;
    --good: #2E9E5B;
    --warn: #D98324;

    --sh:    0 8px 24px rgba(78, 47, 38, .12);
    --sh-lg: 0 24px 56px rgba(78, 47, 38, .20);
    --r:  10px;
    --r-lg: 16px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--surface-2);
    color: var(--ink);
    font: 14px/1.6 'Pretendard Variable', Pretendard, -apple-system,
          'Segoe UI', 'Malgun Gothic', sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  #stage {
    position: fixed; inset: 0; display: grid; place-items: center;
    background:
      radial-gradient(120% 90% at 50% 42%, #FFFFFF 0%, var(--surface-2) 58%, var(--surface-3) 100%);
  }
  canvas#world {
    image-rendering: pixelated; display: block;
    border-radius: 12px;
    box-shadow: 0 1px 0 rgba(255,255,255,.9), var(--sh-lg);
    outline: 1px solid var(--line);
  }

  /* ---------- HUD ---------- */
  .hud { position: fixed; pointer-events: none; font-variant-numeric: tabular-nums; }

  #hud-zone {
    left: 20px; top: 18px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); padding: 9px 14px 10px;
    box-shadow: var(--sh);
  }
  #hud-zone em {
    display: block; font-style: normal; font-size: 10px; font-weight: 700;
    letter-spacing: .18em; color: var(--coral-700); margin-bottom: 1px;
  }
  #hud-zone b { font-size: 17px; font-weight: 700; letter-spacing: -.02em; }
  #hud-zone span { font-size: 12px; color: var(--ink-3); margin-left: 7px; }

  #hud-perf {
    right: 20px; top: 62px; text-align: right;
    font: 11px/1.5 ui-monospace, 'Consolas', monospace;
    color: var(--ink-3);
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); padding: 8px 11px; box-shadow: var(--sh);
  }
  #hud-perf b { color: var(--coral-700); font-weight: 700; }
  #hud-perf .warn { color: var(--warn); }

  #hud-help {
    left: 20px; bottom: 18px; font-size: 12px; color: var(--ink-2);
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); padding: 9px 13px; box-shadow: var(--sh);
  }
  #hud-help kbd {
    display: inline-block; min-width: 20px; text-align: center;
    padding: 2px 6px; margin: 0 1px;
    background: var(--surface-3); border: 1px solid var(--line-2);
    border-bottom-width: 2px; border-radius: 5px;
    font: 700 11px/1.4 ui-monospace, monospace; color: var(--ink);
  }

  /* 상호작용 안내 — 코랄 알약. 글자는 잉크입니다. */
  #prompt {
    position: fixed; pointer-events: none;
    padding: 7px 14px; border-radius: 999px;
    background: var(--coral); color: var(--on-coral);
    font-size: 12.5px; font-weight: 700; white-space: nowrap;
    transform: translate(-50%, -100%);
    opacity: 0; transition: opacity .16s ease;
    box-shadow: 0 6px 16px rgba(255, 107, 82, .38);
  }
  #prompt.on { opacity: 1; }

  /* 머리 위 세션 타이머. 상호작용 안내와 같은 층에 있는 작은 칩입니다.
     캔버스에 그리면 월드 배율을 그대로 받아 사람보다 커집니다. */
  #headTimer {
    position: fixed; pointer-events: none; display: none;
    align-items: center; gap: 4px;
    padding: 2px 7px 2px 5px; border-radius: 999px;
    background: #fff; color: var(--ink-1);
    font-size: 10.5px; font-weight: 700; line-height: 1;
    font-variant-numeric: tabular-nums; white-space: nowrap;
    transform: translate(-50%, -100%);
    box-shadow: 0 2px 5px rgba(78, 47, 38, .18), 0 0 0 1px rgba(78, 47, 38, .07);
  }
  #headTimer.on { display: inline-flex; }

  /* 이름표 — 머리 바로 위. 바탕이 학교 색이고, 글자는 그 색 위에서
     대비가 큰 쪽(잉크 또는 흰색)을 재서 고릅니다. 코랄 위 흰 글자를
     금지한 것과 같은 이유입니다. */
  #nameTag {
    position: fixed; pointer-events: none; display: none;
    padding: 2px 7px; border-radius: 999px;
    background: var(--school, #5A6472); color: #FFF;
    font-size: 10px; font-weight: 700; line-height: 1.4; white-space: nowrap;
    transform: translate(-50%, -100%);
    box-shadow: 0 2px 5px rgba(78, 47, 38, .22);
  }
  #nameTag.on { display: block; }
  #headTimer i {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--coral); flex: none;
  }

  #banner {
    position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%);
    text-align: center; pointer-events: none; opacity: 0;
  }
  #banner b {
    display: block; font-size: 44px; font-weight: 800;
    letter-spacing: -.035em; color: var(--ink);
    text-shadow: 0 2px 0 #FFF, 0 6px 26px rgba(255, 255, 255, .95);
  }
  #banner span {
    font-size: 12px; color: var(--coral-700);
    letter-spacing: .2em; font-weight: 700;
  }
  @keyframes bannerIn {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(.94); }
    16%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    70%  { opacity: 1; }
    100% { opacity: 0; }
  }
  #banner.play { animation: bannerIn 2.1s ease both; }

  /* ---------- 집중 세션 ---------- */
  #session {
    position: fixed; right: 20px; bottom: 20px; width: 300px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-lg); padding: 15px; box-shadow: var(--sh-lg);
    transform: translateY(16px); opacity: 0; pointer-events: none;
    transition: opacity .22s ease, transform .22s ease;
  }
  #session.on { transform: none; opacity: 1; pointer-events: auto; }
  #session h3 {
    margin: 0 0 2px; font-size: 14px; font-weight: 700;
    display: flex; align-items: center; gap: 8px; letter-spacing: -.01em;
  }
  #session h3 i {
    width: 8px; height: 8px; border-radius: 50%; flex: none;
    background: var(--ink-3);
  }
  #session h3 i.live { background: var(--good); box-shadow: 0 0 0 3px rgba(46,158,91,.16); }
  #session p.sub { margin: 0 0 12px; font-size: 11.5px; color: var(--ink-3); }
  #cam-wrap {
    position: relative; width: 100%; aspect-ratio: 4 / 3;
    background: var(--surface-3); border-radius: 11px; overflow: hidden;
    border: 1px solid var(--line); display: grid; place-items: center;
  }
  #cam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  #cam-overlay { position: absolute; inset: 0; width: 100%; height: 100%; transform: scaleX(-1); }
  #cam-msg {
    position: absolute; inset: 0; display: grid; place-items: center;
    padding: 16px; text-align: center; font-size: 11.5px; line-height: 1.65;
    color: var(--ink-2); background: var(--surface-3);
  }
  #session .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  #session .stat { background: var(--coral-50); border-radius: 10px; padding: 8px 10px; }
  #session .stat u {
    display: block; text-decoration: none; font-size: 10.5px;
    color: var(--ink-3); letter-spacing: .02em;
  }
  #session .stat b { font-size: 18px; font-weight: 800; }
  #session .state {
    margin: 10px 0 0; font-size: 12.5px; font-weight: 700; text-align: center;
    color: var(--ink-3);
  }
  #session button {
    margin-top: 12px; width: 100%; padding: 10px;
    background: var(--surface-3); border: 1px solid var(--line-2); border-radius: 9px;
    color: var(--ink-2); font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
    transition: background .16s ease, color .16s ease;
  }
  #session button:hover { background: var(--coral-100); color: var(--ink); }
  #session button:focus-visible { outline: 2px solid var(--coral-600); outline-offset: 2px; }

  /* ---------- NPC 대화 ---------- */
  #dialog {
    position: fixed; left: 50%; bottom: 26px;
    transform: translateX(-50%) translateY(14px);
    width: min(560px, calc(100vw - 48px));
    background: var(--surface); border: 1px solid var(--line);
    border-left: 3px solid var(--coral);
    border-radius: var(--r-lg); padding: 15px 18px;
    opacity: 0; pointer-events: none; box-shadow: var(--sh-lg);
    transition: opacity .18s ease, transform .18s ease;
  }
  #dialog.on { opacity: 1; transform: translateX(-50%); }
  #dialog b {
    display: block; font-size: 13px; color: var(--coral-700);
    margin-bottom: 3px; font-weight: 700;
  }
  #dialog p { margin: 0; font-size: 13.5px; line-height: 1.7; color: var(--ink); }
  #dialog small { display: block; margin-top: 9px; font-size: 11.5px; color: var(--ink-3); }

  /* ---------- 설정 버튼 · 미니룸에서만 ---------- */
  #gear {
    position: fixed; right: 20px; top: 18px; z-index: 6;
    display: none; align-items: center; gap: 7px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); padding: 9px 14px;
    color: var(--ink-2); font: inherit; font-size: 12.5px; font-weight: 600;
    cursor: pointer; box-shadow: var(--sh);
    transition: color .16s ease, border-color .16s ease, background .16s ease;
  }
  #gear.on { display: flex; }
  #gear:hover { color: var(--ink); background: var(--coral-50); border-color: var(--coral-200); }
  #gear:focus-visible { outline: 2px solid var(--coral-600); outline-offset: 3px; }
  #gear i {
    width: 15px; height: 15px; border-radius: 50%; flex: none;
    border: 2px solid var(--coral); position: relative;
  }
  #gear i::after {
    content: ''; position: absolute; inset: 3px;
    border-radius: 50%; background: var(--coral);
  }

  /* ---------- 남의 방에 와 있을 때 ----------
     설정 버튼 자리에 대신 섭니다. 여기가 내 방이 아니라는 사실과 나가는
     길이 늘 같이 보여야 합니다. */
  #visit {
    position: fixed; right: 20px; top: 18px; z-index: 6;
    display: none; align-items: center; gap: 9px;
    background: var(--surface); border: 1px solid var(--line);
    border-left: 3px solid var(--school, var(--coral));
    border-radius: var(--r); padding: 8px 9px 8px 13px;
    font-size: 12.5px; font-weight: 600; color: var(--ink-2); box-shadow: var(--sh);
  }
  #visit.on { display: flex; }
  #visit i {
    width: 8px; height: 8px; border-radius: 50%; flex: none;
    background: var(--school, var(--coral));
  }
  #visit b { color: var(--ink); font-weight: 700; }
  #visit button {
    background: var(--surface-3); border: 1px solid var(--line-2); border-radius: 999px;
    color: var(--ink-2); font: inherit; font-size: 12px; font-weight: 600;
    padding: 5px 12px; cursor: pointer;
  }
  #visit button:hover { background: var(--coral-100); color: var(--ink); }
  #visit button:focus-visible { outline: 2px solid var(--coral-600); outline-offset: 2px; }

  /* ---------- 창 ---------- */
  #panel {
    position: fixed; inset: 0; z-index: 8;
    display: grid; place-items: center; padding: 24px;
    background: rgba(42, 35, 32, .34);
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease;
    backdrop-filter: blur(3px);
  }
  #panel.on { opacity: 1; pointer-events: auto; }
  #panel .box {
    width: min(560px, 100%); max-height: min(78vh, 620px);
    display: flex; flex-direction: column;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 20px; overflow: hidden; box-shadow: var(--sh-lg);
    transform: scale(.96) translateY(10px);
    transition: transform .22s cubic-bezier(.2, .9, .3, 1);
  }
  #panel.on .box { transform: none; }
  #panel header {
    display: flex; align-items: center; gap: 9px;
    padding: 17px 18px 15px; border-bottom: 1px solid var(--line);
    background: linear-gradient(var(--coral-50), var(--surface));
  }
  #panel header b { font-size: 16px; font-weight: 800; letter-spacing: -.02em; }
  #panel header u {
    text-decoration: none; font-size: 10px; color: var(--coral-700);
    letter-spacing: .16em; font-weight: 700;
  }
  #panel header u:empty { display: none; }
  #panel header button {
    margin-left: auto; width: 30px; height: 30px; flex: none;
    background: var(--surface-3); border: 1px solid var(--line); border-radius: 9px;
    color: var(--ink-2); font: 600 16px/1 sans-serif; cursor: pointer;
    transition: background .16s ease, color .16s ease;
  }
  #panel header button:hover { background: var(--coral-100); color: var(--ink); }
  #panel header button:focus-visible { outline: 2px solid var(--coral-600); outline-offset: 2px; }
  #panel .body { padding: 17px 18px 22px; overflow-y: auto; }

  #panel .tabs { display: flex; gap: 4px; padding: 10px 14px 0; }
  #panel .tabs button {
    flex: 1; background: none; border: 0; border-bottom: 2px solid transparent;
    color: var(--ink-3); font: inherit; font-size: 13px; font-weight: 600;
    padding: 9px 4px 10px; cursor: pointer;
  }
  #panel .tabs button[aria-selected="true"] {
    color: var(--coral-700); border-bottom-color: var(--coral);
  }
  #panel .tabs button:focus-visible { outline: 2px solid var(--coral-600); outline-offset: -3px; border-radius: 7px; }

  #panel h4 {
    margin: 0 0 9px; font-size: 11px; font-weight: 700;
    letter-spacing: .1em; color: var(--ink-3);
  }
  #panel p { margin: 0 0 12px; font-size: 13.5px; line-height: 1.78; color: var(--ink-2); }
  #panel p b { color: var(--ink); font-weight: 700; }
  #panel p:last-child { margin-bottom: 0; }
  #panel .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
  #panel .stat { background: var(--coral-50); border-radius: 12px; padding: 11px 13px; }
  #panel .stat u { display: block; text-decoration: none; font-size: 10.5px; color: var(--ink-3); }
  #panel .stat b {
    display: block; margin-top: 2px; font-size: 21px; font-weight: 800;
    color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -.02em;
  }
  #panel ol { margin: 0; padding-left: 0; list-style: none; counter-reset: s; }
  #panel ol li {
    counter-increment: s; position: relative; padding-left: 31px;
    margin-bottom: 12px; font-size: 13.5px; line-height: 1.72; color: var(--ink-2);
  }
  #panel ol li b { color: var(--ink); }
  #panel ol li::before {
    content: counter(s); position: absolute; left: 0; top: 1px;
    width: 21px; height: 21px; border-radius: 7px;
    background: var(--coral); color: var(--on-coral);
    display: grid; place-items: center; font-size: 11px; font-weight: 800;
  }
  #panel .rows { display: flex; flex-direction: column; }
  #panel .row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 2px; border-bottom: 1px solid var(--line);
  }
  #panel .row:last-child { border-bottom: 0; }
  #panel .row span { font-size: 13.5px; font-weight: 600; }
  #panel .row em {
    font-style: normal; font-size: 11.5px; color: var(--ink-3);
    display: block; margin-top: 1px; font-weight: 400;
  }
  #panel .row .val {
    margin-left: auto; color: var(--ink-2); font-size: 13px; font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  /* 누를 수 있는 행 — 업라이트 마이페이지의 setrow 를 그대로 옮겼습니다.
     값 옆에 꺾쇠가 있어야 "눌러서 바꾸는 것" 으로 읽힙니다. */
  #panel .row.tap {
    cursor: pointer; border-radius: 10px; margin: 0 -8px; padding-left: 8px; padding-right: 8px;
    transition: background .14s ease;
  }
  #panel .row.tap:hover { background: var(--coral-50); }
  #panel .row.tap:focus-visible { outline: 2px solid var(--coral-600); outline-offset: -2px; }
  #panel .row .chev { margin-left: 6px; color: var(--ink-3); flex: none; }
  /* 켜고 끄는 스위치. 값 자리에 앉으므로 행 오른쪽 끝입니다. */
  #panel .toggle {
    margin-left: auto; flex: none; width: 42px; height: 24px; padding: 0;
    background: var(--surface-3); border: 1px solid var(--line-2);
    border-radius: 999px; cursor: pointer;
    transition: background .16s ease, border-color .16s ease;
  }
  #panel .toggle i {
    display: block; width: 18px; height: 18px; border-radius: 50%;
    background: var(--surface); margin-left: 2px;
    box-shadow: 0 1px 3px rgba(78,47,38,.28);
    transition: transform .16s ease;
  }
  #panel .toggle[aria-pressed="true"] { background: var(--coral); border-color: var(--coral-600); }
  #panel .toggle[aria-pressed="true"] i { transform: translateX(18px); }
  #panel .toggle:focus-visible { outline: 2px solid var(--coral-600); outline-offset: 2px; }

  #panel .edit {
    display: flex; gap: 8px; align-items: center; padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  #panel .edit input {
    flex: 1; min-width: 0; padding: 10px 12px;
    background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 9px;
    color: var(--ink); font: inherit; font-size: 13.5px;
  }
  #panel .edit input:focus { outline: 2px solid var(--coral-600); outline-offset: 1px; }
  #panel .edit-error { margin: 6px 0 0; font-size: 11.5px; color: var(--coral-700); }
  #panel .hint { margin: 8px 0 0; font-size: 11.5px; color: var(--ink-3); }

  #panel .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 15px; }
  #panel .chip {
    background: var(--surface-2); border: 1px solid var(--line-2);
    border-radius: 999px; padding: 8px 14px;
    color: var(--ink-2); font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
    transition: background .14s ease, border-color .14s ease, color .14s ease;
  }
  #panel .chip:hover { border-color: var(--coral-300); }
  #panel .chip[aria-pressed="true"] {
    background: var(--coral); border-color: var(--coral-600); color: var(--on-coral);
  }
  /* 학교 칩의 색점. 이름만 있으면 무슨 색이 붙는지 눌러 봐야 압니다. */
  #panel .chip i {
    display: inline-block; width: 9px; height: 9px; border-radius: 3px;
    margin-right: 6px; vertical-align: -1px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.18);
  }

  /* ---------- 학교 강조 ----------
     색이 닿는 곳은 여기까지입니다. 버튼·글자·배경은 무채색으로 둡니다. */
  #panel header { background: linear-gradient(var(--school-soft, var(--coral-50)), var(--surface)); }
  #panel .stat { background: var(--school-soft, var(--coral-50)); }
  #panel .school-val { color: var(--school, var(--ink-2)); font-weight: 700; }
  #panel .chip:focus-visible { outline: 2px solid var(--coral-600); outline-offset: 2px; }
  #panel .code {
    display: flex; align-items: center; gap: 10px;
    background: var(--coral-50); border: 1px dashed var(--coral-300);
    border-radius: 14px; padding: 15px 17px; margin-bottom: 14px;
  }
  #panel .code b {
    font: 800 23px/1 ui-monospace, 'Consolas', monospace;
    letter-spacing: .18em; color: var(--coral-700);
  }
  #panel .act {
    margin-left: auto; background: var(--coral); border: 1px solid var(--coral-600);
    border-radius: 9px; color: var(--on-coral);
    font: inherit; font-size: 12.5px; font-weight: 700;
    padding: 9px 15px; cursor: pointer;
    transition: filter .14s ease;
  }
  #panel .act:hover { filter: brightness(1.04); }
  #panel .act.ghost {
    background: var(--surface); border-color: var(--line-2); color: var(--ink-2);
  }
  #panel .act.ghost:hover { background: var(--coral-50); color: var(--ink); }
  #panel .act:focus-visible { outline: 2px solid var(--coral-600); outline-offset: 2px; }
  #panel .note {
    margin-top: 15px; padding: 12px 14px; border-radius: 12px;
    background: var(--coral-50); border-left: 3px solid var(--coral);
    font-size: 12.5px; line-height: 1.72; color: var(--ink-2);
  }
  #panel .bar {
    height: 8px; border-radius: 999px; background: var(--surface-3);
    overflow: hidden; margin-top: 8px;
  }
  #panel .bar i { display: block; height: 100%; background: var(--coral); border-radius: 999px; }

  /* ---------- 상점 ----------
     왼쪽 미리보기 · 오른쪽 목록. 좁은 창에서는 위아래로 접힙니다. */
  #panel .shop { display: grid; grid-template-columns: 168px 1fr; gap: 16px; }
  @media (max-width: 560px) { #panel .shop { grid-template-columns: 1fr; } }
  #panel .shop-prev {
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px 12px; align-self: start;
  }
  /* 종이 인형 — 스프라이트가 오기 전까지 칸의 자리를 보여 줍니다 */
  #panel .doll {
    width: 74px; height: 108px; margin: 0 auto 10px; position: relative;
  }
  #panel .doll span { position: absolute; left: 50%; transform: translateX(-50%); border-radius: 4px; }
  #panel .doll .hat    { top: 0;   width: 40px; height: 12px; border-radius: 7px 7px 2px 2px; }
  #panel .doll .head   { top: 12px; width: 30px; height: 30px; border-radius: 50%; background: #E8D2B4; }
  #panel .doll .top    { top: 44px; width: 52px; height: 34px; }
  #panel .doll .bottom { top: 79px; width: 44px; height: 22px; }
  #panel .doll .shoes  { top: 101px; width: 50px; height: 7px; border-radius: 3px; }
  #panel .shop-prev .who { text-align: center; margin-bottom: 10px; }
  #panel .shop-prev .who b { display: block; font-size: 13.5px; font-weight: 700; }
  #panel .shop-prev .who em { font-style: normal; font-size: 11.5px; color: var(--ink-3); }
  #panel .lays { display: flex; flex-direction: column; gap: 5px; }
  #panel .lay { display: flex; align-items: center; gap: 7px; font-size: 11.5px; }
  #panel .lay i {
    width: 12px; height: 12px; border-radius: 3px; flex: none;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.14);
  }
  #panel .lay span { color: var(--ink-3); }
  #panel .lay em { font-style: normal; margin-left: auto; color: var(--ink-2); font-weight: 600; }
  #panel .shop-prev .hint { margin-top: 10px; font-size: 10.5px; line-height: 1.5; }

  #panel .shop-list { display: flex; flex-direction: column; gap: 6px; }
  #panel .shop-coin {
    font-size: 11.5px; color: var(--ink-3); text-align: right; margin-bottom: 2px;
  }
  #panel .shop-coin b { color: var(--ink); font-size: 13px; font-variant-numeric: tabular-nums; }
  #panel .item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; border: 1px solid var(--line); border-radius: 11px;
    background: var(--surface);
  }
  #panel .item.on { border-color: var(--school, var(--coral)); background: var(--school-soft, var(--coral-50)); }
  #panel .item > i {
    width: 26px; height: 26px; border-radius: 7px; flex: none;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.14);
  }
  #panel .item > span { font-size: 13px; font-weight: 600; }
  #panel .item > span em {
    display: block; font-style: normal; font-size: 11px; color: var(--ink-3); font-weight: 400;
  }
  #panel .item > u {
    margin-left: auto; text-decoration: none; font-size: 11px; color: var(--ink-3);
  }
  #panel .item .act { margin-left: auto; min-width: 62px; text-align: center; }
  #panel .item > u + .act { margin-left: 8px; }
  #panel .item .act[disabled] { opacity: .4; cursor: not-allowed; }

  /* ---------- 명예의 전당 ---------- */
  #panel .ranks { display: flex; flex-direction: column; }
  #panel .rank {
    display: flex; align-items: center; gap: 9px;
    padding: 9px 6px; border-bottom: 1px solid var(--line);
  }
  #panel .rank.me { background: var(--school-soft, var(--coral-50)); border-radius: 9px; }
  #panel .rank u {
    text-decoration: none; width: 20px; flex: none; text-align: center;
    font-size: 12px; font-weight: 800; color: var(--ink-3); font-variant-numeric: tabular-nums;
  }
  #panel .rank:nth-child(1) u { color: #B8860B; }
  #panel .rank i {
    width: 10px; height: 18px; border-radius: 3px; flex: none;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.16);
  }
  #panel .rank span { font-size: 13px; font-weight: 600; flex: 1; min-width: 0; }
  #panel .rank span em {
    font-style: normal; font-size: 10.5px; color: var(--school, var(--ink-3)); font-weight: 700;
  }
  #panel .rank b {
    font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right;
    min-width: 62px;
  }
  #panel .rank b.sub { color: var(--ink-3); font-weight: 600; min-width: 62px; }
  #panel .rank b small { font-size: 10px; color: var(--ink-3); font-weight: 400; margin-left: 3px; }

  /* 역대 1위 — 액자 셋이 나란히 */
  #panel .frames { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
  #panel .frame {
    border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 9px 11px;
    background: var(--surface-2); text-align: center;
    box-shadow: inset 0 0 0 3px var(--surface);
  }
  #panel .frame .plate {
    display: inline-block; border-radius: 999px; padding: 2px 9px; margin-bottom: 7px;
    font-size: 10px; font-weight: 800; letter-spacing: .06em;
  }
  #panel .frame b { display: block; font-size: 12px; font-weight: 700; }
  #panel .frame em {
    font-style: normal; font-size: 10.5px; color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }

  /* 세션 표시 — 좌측 하단. 지금 세션이 돌고 있다는 사실과 얼마나
     됐는지가 늘 보여야 합니다. 종료 버튼을 옆에 두는 이유는, 회고를
     보려면 반드시 여기를 눌러야 하기 때문입니다. */
  #hud-session {
    left: 20px; bottom: 62px; z-index: 6; pointer-events: auto;
    display: flex; align-items: center; gap: 9px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 999px; padding: 7px 8px 7px 14px; box-shadow: var(--sh);
  }
  #hud-session .dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--coral);
    box-shadow: 0 0 0 3px rgba(255,107,82,.20);
    animation: sessPulse 2.4s ease-in-out infinite;
  }
  @keyframes sessPulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
  #hud-session b { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #hud-session button {
    background: var(--surface-3); border: 1px solid var(--line-2); border-radius: 999px;
    color: var(--ink-2); font: inherit; font-size: 12px; font-weight: 600;
    padding: 6px 13px; cursor: pointer;
    transition: background .14s ease, color .14s ease;
  }
  #hud-session button:hover { background: var(--coral); color: var(--on-coral); }
  #hud-session button:focus-visible { outline: 2px solid var(--coral-600); outline-offset: 2px; }
  #hud-session.done .dot { background: var(--ink-3); animation: none; box-shadow: none; }

  /* 코인 — 우측 하단. Lucide "coins" 아이콘(ISC).
     재화는 항상 보여야 합니다. 마이페이지를 열어야만 알 수 있으면
     "얼마나 모았나"가 동기가 되지 못합니다. */
  #coin {
    position: fixed; right: 20px; bottom: 20px; z-index: 6;
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 999px; padding: 9px 16px 9px 12px;
    color: var(--ink); font: inherit; font-size: 14px; font-weight: 700;
    cursor: pointer; box-shadow: var(--sh);
    transition: transform .16s ease, border-color .16s ease;
  }
  #coin:hover { border-color: #E8B93A; transform: translateY(-1px); }
  #coin:focus-visible { outline: 2px solid var(--coral-600); outline-offset: 3px; }
  #coin svg { width: 19px; height: 19px; flex: none; color: #E0A21E; }
  #coin b { font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  /* 세션 패널이 뜨면 겹치므로 비켜 줍니다 */
  #coin.shifted { transform: translateY(-374px); }
  @keyframes coinPop { 0%,100% { transform: scale(1); } 40% { transform: scale(1.18); } }
  #coin.pop svg { animation: coinPop .42s ease; }

  /* ---------- 미니맵 ----------
     캠퍼스를 4배로 줄여 통째로 보여 줍니다. 지도 위의 이름표가 곧
     이동 단추입니다. */
  #minimap {
    position: fixed; inset: 0; z-index: 8;
    display: grid; place-items: center; padding: 24px;
    background: rgba(42, 35, 32, .34); backdrop-filter: blur(3px);
    opacity: 0; pointer-events: none; transition: opacity .18s ease;
  }
  #minimap.on { opacity: 1; pointer-events: auto; }
  #minimap .mini-box {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 18px; overflow: hidden; box-shadow: var(--sh-lg);
    transform: scale(.97); transition: transform .2s cubic-bezier(.2,.9,.3,1);
  }
  #minimap.on .mini-box { transform: none; }
  #minimap header {
    display: flex; align-items: center; gap: 9px;
    padding: 13px 14px 12px; border-bottom: 1px solid var(--line);
    background: linear-gradient(var(--school-soft, var(--coral-50)), var(--surface));
  }
  #minimap header b { font-size: 14px; font-weight: 800; letter-spacing: -.02em; }
  #minimap header u {
    text-decoration: none; font-size: 10px; color: var(--ink-3);
    letter-spacing: .1em; font-weight: 700;
  }
  #minimap header button {
    margin-left: auto; width: 26px; height: 26px; flex: none;
    background: var(--surface-3); border: 1px solid var(--line); border-radius: 8px;
    color: var(--ink-2); font: 600 15px/1 sans-serif; cursor: pointer;
  }
  #minimap header button:hover { background: var(--coral-100); color: var(--ink); }
  .mini-wrap { position: relative; padding: 12px; }
  #minimap-cv { display: block; border-radius: 10px; outline: 1px solid var(--line-2); }
  #minimap-spots { position: absolute; left: 12px; top: 12px; pointer-events: none; }
  #minimap-spots .spot {
    position: absolute; transform: translate(-50%, -50%); pointer-events: auto;
    display: flex; align-items: center; gap: 5px; white-space: nowrap;
    background: rgba(255,255,255,.94); border: 1px solid var(--line-2);
    border-radius: 999px; padding: 3px 7px 3px 6px; cursor: pointer;
    font: 700 10.5px/1.3 inherit; color: var(--ink);
    box-shadow: 0 2px 6px rgba(78,47,38,.22);
    transition: transform .12s ease, border-color .12s ease;
  }
  #minimap-spots .spot:hover {
    transform: translate(-50%, -50%) scale(1.07); border-color: var(--coral);
  }
  #minimap-spots .spot:focus-visible { outline: 2px solid var(--coral-600); outline-offset: 2px; }
  #minimap-spots .spot i {
    width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--coral);
  }
  #minimap-spots .spot kbd {
    background: var(--surface-3); border: 1px solid var(--line-2); border-radius: 4px;
    padding: 0 4px; font: 700 9.5px/1.5 ui-monospace, monospace; color: var(--ink-2);
  }

  /* 코인을 받은 이유 — 코인 칩 위로 한 줄 떠올랐다 사라집니다 */
  .coin-toast {
    position: fixed; right: 20px; bottom: 62px; z-index: 7;
    display: flex; align-items: center; gap: 7px; pointer-events: none;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 999px; padding: 7px 14px 7px 11px; box-shadow: var(--sh);
    font-size: 12px; font-weight: 600; color: var(--ink-2);
    animation: coinToast 2.2s ease both;
  }
  .coin-toast b { color: #B8860B; font-weight: 800; font-variant-numeric: tabular-nums; }
  @keyframes coinToast {
    0%   { opacity: 0; transform: translateY(8px); }
    12%  { opacity: 1; transform: none; }
    76%  { opacity: 1; transform: none; }
    100% { opacity: 0; transform: translateY(-10px); }
  }

  #boot {
    position: fixed; inset: 0; z-index: 9; display: grid; place-items: center;
    background: var(--surface-2); font-size: 13px; color: var(--ink-3);
    transition: opacity .4s ease;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
</style>

</head>
<body>

</div>

    <path d="M18.09 10.37A6 6 0 1 1 10.34 18"/>

    <video id="cam" playsinline muted hidden></video>

    <div id="cam-msg">카메라를 여는 중이에요</div>
  </div>

</div>

      <button type="button" id="minimap-close" aria-label="닫기">×</button></header>

<script>
/* ==================================================================
   기린캠퍼스 — 캠퍼스 오픈월드

   세 벌의 타일을 씁니다.
     urban.png    Kenney RPG Urban Pack (CC0) · 16px · 야외·캐릭터
     city.png     Kenney Roguelike Modern City (CC0) · 16px · 건물 외벽·지붕
     school48.png Cool School (CC0) · 48px · 학교 실내 가구

   Cool School 만 해상도가 다릅니다. 48 을 3 으로 나누면 정확히 16 이라,
   불러온 뒤 브라우저에서 한 번 줄여 같은 격자에 올립니다. 파일을 미리
   변환해 두지 않는 이유는 원본을 남겨야 다른 배율로 다시 뽑을 수
   있기 때문입니다.

   축소는 평균이 아니라 **최빈색**으로 합니다. 픽셀아트는 1px 외곽선이
   형태를 만드는데, 평균을 내면 그 선이 배경과 섞여 흐려집니다.
   ================================================================== */

const T = 16;        // 월드 타일 한 변
const SCALE = 4;     // 화면 확대 — 3 에서는 책상·의자가 너무 작았습니다
const U_COLS = 27;   // urban.png
const C_COLS = 37;   // city.png
const K_COLS = 16;   // school (축소 후)

/* ---------------- 바닥 ----------------
   시트를 픽셀 단위로 훑어 "완전히 채워지고 색 변화가 적은" 칸만
   골라낸 값입니다. 짐작한 숫자가 아닙니다. */
const F = { grass: 28, plaza: 36, beige: 109, gray: 117, water: 198,
            asphalt: 441, brickR: 72, brickO: 180 };

/* ---------------- 자동 타일 ----------------
   재질마다 3×3 테두리 세트가 시트에 들어 있습니다.
   [좌상 상 우상 / 좌 중앙 우 / 좌하 하 우하].

   이게 없으면 잔디에 회색 사각형을 오려 붙인 것처럼 보입니다. */
const AUTO = [
  null,
  { t: [  8,  9, 10,  35,  36,  37,  62,  63,  64] },  // 1 광장 포장
  { t: [ 81, 82, 83, 108, 109, 110, 135, 136, 137] },  // 2 베이지
  { t: [ 89, 90, 91, 116, 117, 118, 143, 144, 145] },  // 3 회색
  { t: [170,171,172, 197, 198, 199, 224, 225, 226] },  // 4 물
  { t: [  0,  1,  2,  27,  28,  29,  54,  55,  56] },  // 5 잔디
];
const M = { PLAZA: 1, BEIGE: 2, GRAY: 3, WATER: 4, GRASS: 5 };

const K = (c, r) => r * K_COLS + c;   // 학교 시트 색인

/* ==================================================================
   건물 픽셀 그리기

   Kenney 타일로는 돔도 첨탑도 만들 수 없습니다. 시트에 없는 형태라
   조합으로는 안 나옵니다. 그래서 건물은 **한 장씩 직접 그립니다** —
   조감도(campus-map.html)와 같은 팔레트, 같은 실루엣으로.

   위에서 내려다보는 건물은 지붕이 대부분이고 아래 두 줄만 정면입니다.
   빛은 왼쪽 위에서 옵니다 — 밝은 면은 위·왼쪽, 그림자는 아래·오른쪽.
   이 규칙을 어기면 어느 것이 지붕이고 어느 것이 벽인지 안 보입니다.
   ================================================================== */

function px(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(x | 0, y | 0, w | 0, h | 0); }

/** 원. 픽셀아트라 안티앨리어싱 없이 정수 격자로 채웁니다. */
function disc(g, cx, cy, r, c) {
  g.fillStyle = c;
  for (let y = -r; y <= r; y++) {
    const half = Math.floor(Math.sqrt(r * r - y * y));
    g.fillRect(cx - half, cy + y, half * 2 + 1, 1);
  }
}
/** 원 테두리 한 겹 */
function circleLine(g, cx, cy, r, c) {
  g.fillStyle = c;
  for (let a = 0; a < 360; a += 2) {
    const t = a * Math.PI / 180;
    g.fillRect(Math.round(cx + Math.cos(t) * r), Math.round(cy + Math.sin(t) * r), 1, 1);
  }
}

/**
 * 건물 한 채를 캔버스에 그립니다.
 * spec.roofRows 만큼 지붕, 나머지 두 줄이 정면입니다.
 */
function paintBuilding(spec) {
  const W = spec.w * T, H = spec.h * T;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const P = spec.pal;
  const faceY = H - T * 2;          // 정면이 시작하는 줄

  /* ---- 지붕 ---- */
  px(g, 0, 0, W, faceY, P.roof);
  /* 처마 — 바깥 한 겹을 어둡게 두르면 건물이 바닥에서 떨어져 보입니다 */
  px(g, 0, 0, W, 2, P.lit);
  px(g, 0, 0, 2, faceY, P.lit);
  px(g, W - 3, 0, 3, faceY, P.dark);
  px(g, 0, faceY - 3, W, 3, P.dark);
  /* 지붕 패널 이음선 — 밋밋한 색면을 지붕으로 만듭니다 */
  g.fillStyle = P.dark;
  for (let x = 10; x < W - 4; x += 12) g.fillRect(x, 3, 1, faceY - 6);
  g.fillStyle = P.lit;
  for (let x = 11; x < W - 4; x += 12) g.fillRect(x, 3, 1, faceY - 6);

  if (spec.ridge) {
    /* 박공 마룻대 — 길이 방향으로 밝은 띠 하나. 도서관처럼 긴 동에 씁니다. */
    const my = Math.floor(faceY * 0.42);
    px(g, 4, my - 3, W - 8, 3, P.lit);
    px(g, 4, my, W - 8, 2, P.dark);
  }

  /* ---- 옥상 기물 ---- */
  (spec.features || []).forEach((f) => {
    const fx = f.x * T, fy = f.y * T;
    if (f.k === 'dome') {
      /* 돔 — 위에서 보면 동심원입니다. 왼쪽 위가 밝습니다. */
      disc(g, fx, fy, f.r + 2, P.dark);
      disc(g, fx, fy, f.r, f.c);
      disc(g, fx - Math.round(f.r * 0.22), fy - Math.round(f.r * 0.22),
           Math.round(f.r * 0.62), f.lit);
      disc(g, fx - Math.round(f.r * 0.3), fy - Math.round(f.r * 0.3),
           Math.round(f.r * 0.3), f.hi || '#FFFFFF');
      /* 살 — 격자가 없으면 공으로 보입니다 */
      g.fillStyle = f.rib || P.dark;
      for (let a = 0; a < 8; a++) {
        const t = a * Math.PI / 4;
        /* 살은 가장자리에서 시작해 안쪽으로 들어옵니다. 중심까지 그으면
           한 점에 여덟 줄이 몰려 검은 얼룩이 됩니다. */
        for (let d = Math.round(f.r * 0.3); d < f.r - 1; d++) {
          const px_ = Math.round(fx + Math.cos(t) * d), py_ = Math.round(fy + Math.sin(t) * d);
          g.fillRect(px_, py_, 2, 2);
        }
      }
      circleLine(g, fx, fy, Math.round(f.r * 0.66), f.rib || P.dark);
      if (f.icon) roofIcon(g, f.icon, fx, fy);
      else disc(g, fx, fy, 3, f.lantern || '#F4F7C8');
    }
    else if (f.k === 'cone') {
      /* 원뿔 — 위에서 보면 동심원이고, 꼭짓점만 위로 올라갑니다.
         좌우로도 밀면 나선으로 보입니다. */
      disc(g, fx, fy, f.r + 2, P.dark);
      disc(g, fx, fy, f.r, f.c);
      for (let d = f.r; d >= 1; d--) {
        const t = 1 - d / f.r;
        const shade = t < 0.3 ? f.c : t < 0.62 ? f.lit : (f.hi || '#FFE7C8');
        disc(g, fx, fy - Math.round(t * f.r * 0.34), d, shade);
      }
      /* 꼭짓점 */
      disc(g, fx, fy - Math.round(f.r * 0.34), 2, '#FFF3DC');
      if (f.icon) roofIcon(g, f.icon, fx, fy - Math.round(f.r * 0.34) - 9, f.hi || '#FFE7C8');
    }
    else if (f.k === 'spire') {
      /* 시계탑 — 사각 탑 위에 계단식 피라미드 지붕, 꼭대기에 라임 시계판.
         캠퍼스에서 브랜드색이 나오는 유일한 건축 요소입니다. */
      const s = f.r;
      px(g, fx - s - 2, fy - s - 2, s * 2 + 4, s * 2 + 4, P.dark);
      px(g, fx - s, fy - s, s * 2, s * 2, f.c);
      px(g, fx - s, fy - s, s * 2, 3, f.lit);
      px(g, fx - s, fy - s, 3, s * 2, f.lit);
      /* 계단식 지붕 — 층마다 한 칸씩 좁아지며 밝아집니다 */
      const steps = Math.floor(s / 2.4);
      for (let k = 0; k < steps; k++) {
        const q = s - 3 - k * 2.2;
        if (q < 3) break;
        px(g, fx - q, fy - q - k, q * 2, q * 2, k % 2 ? f.lit : f.c);
        px(g, fx - q, fy - q - k, q * 2, 2, '#93B4D6');
      }
      /* 시계판 — 지난 판은 코랄 원판에 막대 둘이라 접시였습니다.
         눈금 열둘과 두 바늘이 있어야 시계로 읽힙니다. */
      roofIcon(g, 'clock', fx, fy - steps + 1, 11);
      /* 피뢰침 */
      px(g, fx - 1, fy - s - 8, 2, 8, '#C8D2DC');
      disc(g, fx, fy - s - 9, 2, '#FF6B52');
    }
    else if (f.k === 'deck') {
      px(g, fx, fy, f.w * T, f.h * T, P.dark);
      px(g, fx + 2, fy + 2, f.w * T - 4, f.h * T - 4, f.c);
      g.fillStyle = f.lit;
      for (let x = fx + 4; x < fx + f.w * T - 4; x += 5) g.fillRect(x, fy + 3, 1, f.h * T - 6);
    }
    else if (f.k === 'medal') {
      /* 지붕에 바로 얹는 상징. 돔이나 원뿔이 없는 건물도 문패를
         달 수 있어야 합니다. */
      roofIcon(g, f.icon, fx, fy, f.r);
    }
    else if (f.k === 'tank') {
      disc(g, fx, fy, f.r + 1, P.dark);
      disc(g, fx, fy, f.r, '#B9C2C8');
      disc(g, fx - 1, fy - 2, Math.max(1, f.r - 3), '#E2E8EC');
    }
    else if (f.k === 'sky') {
      /* 채광창 — 열람실 위에 줄지어 앉습니다 */
      for (let i = 0; i < f.n; i++) {
        const sx = fx + i * (f.gap * T);
        px(g, sx, fy, 10, 14, P.dark);
        px(g, sx + 1, fy + 1, 8, 12, '#8FC6D8');
        px(g, sx + 1, fy + 1, 8, 4, '#C4E4EE');
      }
    }
  });

  /* ---- 정면 ----
     위 한 줄은 창문 층, 아래 한 줄은 출입구. */
  const wallY = faceY;
  px(g, 0, wallY, W, T * 2, P.wall);
  px(g, 0, wallY, W, 3, P.trim);                 // 지붕과 벽 사이 띠
  px(g, 0, wallY + 3, W, 1, P.lit);
  /* 주춧돌 — 벽이 잔디에서 바로 솟으면 세워 둔 종잇장으로 보입니다 */
  px(g, 0, H - 8, W, 8, P.wallDark);
  px(g, 0, H - 8, W, 1, P.trim);
  px(g, 0, H - 3, W, 3, 'rgba(0,0,0,.28)');
  /* 모서리 벽기둥 — 벽의 양 끝을 잡아 줍니다 */
  [0, W - 7].forEach((x) => {
    px(g, x, wallY, 7, T * 2 - 8, P.wallDark);
    px(g, x + 1, wallY + 4, 5, T * 2 - 12, P.wall);
    for (let y = wallY + 6; y < H - 10; y += 6) px(g, x + 1, y, 5, 1, P.wallDark);
  });

  const doorX = ((spec.w >> 1) - 1) * T;
  /* 창문 — 건물마다 양식이 다릅니다. 색보다 형태가 성격을 말합니다. */
  const step = spec.win === 'shop' ? 16 : spec.win === 'grid' ? 11 : 13;
  let wi = 0;
  for (let x = 9; x < W - 14; x += step) {
    if (x + 10 > doorX - 12 && x < doorX + T * 2 + 14) continue;
    paintWindow(g, spec.win, x, wallY, P);
    /* 셋 중 하나는 불이 켜져 있습니다. 전부 같은 유리면 벽지입니다. */
    if (wi % 3 === 1) {
      px(g, x + 2, wallY + 6, 6, 9, 'rgba(255,214,138,.72)');
      px(g, x + 2, wallY + 6, 6, 3, 'rgba(255,240,200,.82)');
    }
    wi++;
  }
  /* ---- 출입구 ----
     들어가는 곳은 **한눈에** 보여야 합니다. 캐노피 한 겹으로는
     창 사이의 빈칸과 구분이 안 갑니다. 차양 · 유리문 · 계단 · 등,
     넷을 겹쳐 문 주변만 다른 리듬을 갖게 했습니다. */
  const dW = T * 2, dL = doorX - 8, dR = doorX + dW + 8;
  /* 벽감 — 문 둘레를 한 단 들여 그림자를 만듭니다 */
  px(g, dL, wallY + 3, dR - dL, T * 2 - 5, P.wallDark);
  px(g, dL + 1, wallY + 4, dR - dL - 2, T * 2 - 7, P.wall);
  /* 코랄 차양 — 캠퍼스에서 브랜드색이 벽에 닿는 유일한 자리입니다 */
  px(g, dL - 2, wallY + 4, dR - dL + 4, 9, '#B93E2A');
  for (let x = dL - 1; x < dR + 1; x += 6) {
    px(g, x, wallY + 5, 3, 7, '#FF6B52');
    px(g, x + 3, wallY + 5, 3, 7, '#FFF2EE');
  }
  px(g, dL - 2, wallY + 4, dR - dL + 4, 2, 'rgba(255,255,255,.34)');
  /* 차양 아랫단 — 물결이 있어야 천입니다 */
  for (let x = dL - 2; x < dR + 2; x += 6) {
    disc(g, x + 3, wallY + 13, 3, '#B93E2A');
    disc(g, x + 3, wallY + 12, 3, (x - dL) % 12 ? '#FF6B52' : '#FFF2EE');
  }
  /* 유리문 두 짝 */
  px(g, doorX - 2, wallY + 16, dW + 4, T * 2 - 22, P.frame);
  px(g, doorX, wallY + 18, dW, T * 2 - 25, '#24384C');
  px(g, doorX, wallY + 18, dW, 4, '#4E6C88');
  g.fillStyle = 'rgba(255,255,255,.30)';
  for (let i = 0; i < 9; i++) g.fillRect(doorX + 3 + i, wallY + 27 - i, 2, 1);
  for (let i = 0; i < 9; i++) g.fillRect(doorX + dW / 2 + 3 + i, wallY + 27 - i, 2, 1);
  px(g, doorX + T - 1, wallY + 18, 2, T * 2 - 25, P.frame);
  px(g, doorX + T - 4, wallY + 24, 2, 4, '#D8DEE4');
  px(g, doorX + T + 2, wallY + 24, 2, 4, '#D8DEE4');
  /* 계단 — 문 아래 두 단. 바닥에 닿는 곳이 있어야 서 있는 건물입니다. */
  px(g, doorX - 5, H - 8, dW + 10, 4, '#D8D2C6');
  px(g, doorX - 7, H - 4, dW + 14, 4, '#C2BBAE');
  px(g, doorX - 5, H - 8, dW + 10, 1, '#EDE8DE');
  /* 문 옆 등 — 어디로 들어가는지 밤에도 보입니다 */
  [dL - 4, dR + 1].forEach((x) => {
    px(g, x, wallY + 16, 4, 3, '#3A4652');
    px(g, x, wallY + 19, 4, 5, '#FFD98A');
    px(g, x + 1, wallY + 20, 2, 3, '#FFF6DC');
    px(g, x + 1, wallY + 24, 2, 4, '#3A4652');
  });

  /* 기둥 — 도서관 포르티코 */
  if (spec.portico) {
    const n = spec.portico;
    const step = W / (n + 1);
    for (let i = 1; i <= n; i++) {
      const cx = Math.round(i * step) - 3;
      if (cx > doorX - 8 && cx < doorX + T * 2 + 4) continue;
      px(g, cx, wallY + 4, 6, T * 2 - 7, P.wallDark);
      px(g, cx, wallY + 4, 4, T * 2 - 7, '#F2EDE0');
      px(g, cx - 1, wallY + 3, 8, 3, P.trim);
    }
  }

  return c;
}

/** 그린 캔버스를 소품으로 등록합니다. 충돌 격자는 문만 뚫어 둡니다. */
function buildingProp(spec) {
  const canvas = paintBuilding(spec);
  const doorX = (spec.w >> 1) - 1;
  const c = [];
  for (let j = 0; j < spec.h; j++) {
    c.push([]);
    for (let i = 0; i < spec.w; i++) {
      const isDoor = j === spec.h - 1 && (i === doorX || i === doorX + 1);
      c[j].push(isDoor ? 0 : 1);
    }
  }
  return { s: 'img', canvas, w: spec.w, h: spec.h, c, t: null, doorX };
}

/* ==================================================================
   건물 상징 · 창문 · 실내

   겉과 속의 결이 다르면 문을 지날 때마다 다른 게임에 들어간 것 같습니다.
   그래서 실내 벽도 같은 팔레트, 같은 손으로 그립니다.

   그리고 건물마다 **말하는 물건**을 하나씩 얹습니다 — 도서관 돔 위에는
   책, 학생회관 돔 위에는 트로피. 색과 지붕 모양만으로는 "저기가 무슨
   건물인지"까지 말하지 못합니다.
   ================================================================== */

/** 지붕 꼭대기 상징. 8~14px 안에서 실루엣만으로 읽혀야 합니다. */
/* ---- 지붕 상징 ----
   지붕 색만으로 건물을 가리면 사용자가 색을 외워야 합니다. 상징이 있으면
   처음 온 사람도 압니다. 그러려면 **멀리서 읽혀야** 하고, 지붕색이
   주황이든 청록이든 같은 대비가 나와야 합니다.

   그래서 상징을 맨살에 그리지 않고 메달에 얹습니다 — 어두운 테 · 밝은
   바탕 · 상징. 지붕이 무엇이든 상징은 늘 밝은 바탕 위 검정입니다.
   지난 판은 상징을 지붕에 바로 그려서, 도서관 책은 청록 위 흰색이라
   보였지만 기숙사 달은 주황 위 아이보리라 뭉개져 있었습니다. */
function roofIcon(g, kind, cx, cy, R) {
  R = R || 13;
  const ink = '#22303F';
  /* 메달 */
  disc(g, cx, cy + 2, R + 1, 'rgba(0,0,0,.28)');
  disc(g, cx, cy, R, ink);
  disc(g, cx, cy, R - 2, '#EFE7D6');
  disc(g, cx - 1, cy - 1, R - 3, '#FBF7EC');
  circleLine(g, cx, cy, R - 4, 'rgba(34,48,63,.14)');

  if (kind === 'book') {
    /* 펼친 책 — 위에서 봅니다. 등이 가운데서 꺾이고, 바깥쪽 세 겹이
       종이 두께입니다. 두께가 없으면 종이 두 장으로 보입니다. */
    const w = 9, hh = 7;
    px(g, cx - w - 1, cy - hh, w * 2 + 2, hh * 2, ink);
    [-1, 1].forEach((s) => {
      const x0 = s < 0 ? cx - w : cx + 1;
      px(g, x0, cy - hh + 1, w, hh * 2 - 2, '#FFFDF6');
      px(g, x0, cy - hh + 1, w, 2, '#E4DBC6');            // 위쪽 그늘
      /* 종이 두께 — 바깥 모서리에 층을 셋 */
      for (let k = 0; k < 3; k++)
        px(g, s < 0 ? x0 - 1 + k : x0 + w - k, cy - hh + 2 + k, 1, hh * 2 - 4 - k * 2, '#CFC4AB');
      /* 글줄 */
      g.fillStyle = '#9AA7B4';
      for (let k = 0; k < 4; k++) g.fillRect(x0 + 2, cy - 3 + k * 2, w - 4, 1);
    });
    px(g, cx - 1, cy - hh - 1, 3, hh * 2 + 2, ink);       // 등
    px(g, cx, cy - hh, 1, hh * 2, '#4A5C6E');
    /* 코랄 갈피끈 — 브랜드색이 상징 안에서 한 번 나옵니다 */
    px(g, cx + 4, cy + hh - 2, 2, 6, '#FF6B52');
    px(g, cx + 4, cy + hh + 3, 2, 2, '#D8442C');
  }
  else if (kind === 'trophy') {
    /* 우승컵 — 명예의 전당. 손잡이가 없으면 화분입니다. */
    /* 손잡이 먼저 — 컵 뒤로 들어가야 붙어 보입니다 */
    [-1, 1].forEach((s) => {
      const x = cx + s * 8;
      px(g, x - 1, cy - 7, 3, 8, ink);
      px(g, x + (s < 0 ? 1 : -1), cy - 6, 1, 6, '#C8A33A');
      px(g, cx + s * 5, cy - 8, 4, 2, ink);
      px(g, cx + s * 5, cy - 2, 4, 2, ink);
    });
    /* 잔 — 위가 넓고 아래로 좁아집니다 */
    px(g, cx - 7, cy - 9, 14, 3, ink);
    px(g, cx - 6, cy - 8, 12, 2, '#FFE9A0');
    for (let k = 0; k < 6; k++)
      px(g, cx - 6 + k, cy - 6 + k, 12 - k * 2, 1, k < 2 ? '#F2C64A' : k < 4 ? '#D9A82F' : '#B8891F');
    px(g, cx - 5, cy - 6, 2, 4, '#FFF3C4');              // 광
    /* 별 — 잔 한가운데 */
    px(g, cx - 1, cy - 5, 3, 3, '#FFFBE8');
    px(g, cx - 2, cy - 4, 5, 1, '#FFFBE8');
    px(g, cx, cy - 6, 1, 5, '#FFFBE8');
    /* 자루와 받침 */
    px(g, cx - 1, cy, 3, 4, '#B8891F');
    px(g, cx - 4, cy + 4, 9, 2, '#D9A82F');
    px(g, cx - 6, cy + 6, 13, 3, ink);
    px(g, cx - 5, cy + 6, 11, 2, '#C8A33A');
  }
  else if (kind === 'moon') {
    /* 초승달과 별 — 기숙사. 잠드는 곳입니다.
       달은 원 두 개의 차이입니다. 바탕이 메달 안쪽 색이므로 그 색으로
       덮으면 깨끗하게 깎입니다 — 캔버스를 뚫으면 지붕이 비칩니다. */
    const bg = '#FBF7EC';
    disc(g, cx - 2, cy, 8, ink);
    disc(g, cx - 2, cy, 7, '#E0A526');
    disc(g, cx - 2, cy - 1, 6, '#FFCE55');
    disc(g, cx - 4, cy - 2, 4, '#FFE9A8');
    /* 깎아 냅니다. 바탕색으로 덮어야 합니다 — 캔버스를 뚫으면
       그 자리에 지붕이 비칩니다. */
    disc(g, cx + 4, cy - 2, 7, bg);
    disc(g, cx + 5, cy - 3, 7, bg);
    /* 곰보 — 없으면 손톱 조각입니다 */
    disc(g, cx - 5, cy + 2, 2, '#E0A526');
    disc(g, cx - 3, cy + 5, 1, '#E0A526');
    /* 별 셋, 크기를 다르게 */
    const star = (x, y, s) => {
      px(g, x, y - s, 1, s * 2 + 1, ink);
      px(g, x - s, y, s * 2 + 1, 1, ink);
      px(g, x, y - s + 1, 1, s * 2 - 1, '#FFF6D2');
      px(g, x - s + 1, y, s * 2 - 1, 1, '#FFF6D2');
    };
    star(cx + 7, cy - 5, 2);
    star(cx + 6, cy + 4, 1);
    star(cx + 2, cy + 8, 1);
  }
  else if (kind === 'clock') {
    /* 시계 — 본관. 열두 눈금 중 넷은 굵게. 눈금이 없으면 접시입니다. */
    disc(g, cx, cy, R - 3, '#FBF7EC');
    circleLine(g, cx, cy, R - 3, '#3C5C82');
    g.fillStyle = '#3C5C82';
    for (let k = 0; k < 12; k++) {
      const t = k * Math.PI / 6, big = k % 3 === 0;
      const r0 = R - 4, r1 = R - (big ? 8 : 6);
      for (let d = r1; d <= r0; d++)
        g.fillRect(Math.round(cx + Math.sin(t) * d), Math.round(cy - Math.cos(t) * d), big ? 2 : 1, big ? 2 : 1);
    }
    /* 바늘 — 10시 10분. 두 바늘이 겹치지 않는 각도라 시계로 읽힙니다. */
    const hand = (ang, len, wdt, col) => {
      g.fillStyle = col;
      for (let d = 0; d <= len; d++)
        g.fillRect(Math.round(cx + Math.sin(ang) * d) - (wdt >> 1),
                   Math.round(cy - Math.cos(ang) * d) - (wdt >> 1), wdt, wdt);
    };
    hand(-Math.PI / 3, R - 7, 3, '#22303F');   // 시침 — 10시
    hand(Math.PI / 6, R - 5, 2, '#22303F');    // 분침 — 10분
    disc(g, cx, cy, 2, '#FF6B52');
    disc(g, cx, cy, 1, '#8E2E1C');
  }
}

/** 창문. 건물의 성격이 가장 많이 드러나는 자리입니다. */
function paintWindow(g, style, x, y, P) {
  if (style === 'arch') {
    /* 아치창 — 도서관. 위가 둥글면 오래된 열람실이 됩니다. */
    px(g, x, y + 3, 10, 14, P.frame);
    disc(g, x + 5, y + 4, 5, P.frame);
    px(g, x + 1, y + 4, 8, 12, P.glass);
    disc(g, x + 5, y + 4, 4, P.glass);
    px(g, x + 1, y + 4, 8, 3, P.glassLit);
    px(g, x + 4, y, 2, 17, P.frame);
    px(g, x + 1, y + 9, 8, 1, P.frame);
  } else if (style === 'tall') {
    /* 격자 큰창 — 본관. 관공서처럼 반듯합니다. */
    px(g, x - 1, y + 1, 12, 17, P.frame);
    px(g, x, y + 2, 10, 15, P.glass);
    px(g, x, y + 2, 10, 4, P.glassLit);
    px(g, x + 4, y + 2, 2, 15, P.frame);
    px(g, x, y + 8, 10, 1, P.frame);
    px(g, x - 2, y, 14, 2, P.trim);
  } else if (style === 'grid') {
    /* 작은 창이 규칙적으로 — 기숙사 */
    px(g, x, y + 4, 8, 7, P.frame);
    px(g, x + 1, y + 5, 6, 5, P.glass);
    px(g, x, y + 12, 8, 7, P.frame);
    px(g, x + 1, y + 13, 6, 5, P.glass);
  } else if (style === 'shop') {
    /* 넓은 상점 창에 차양 — 학생회관 */
    px(g, x - 2, y + 6, 14, 12, P.frame);
    px(g, x - 1, y + 7, 12, 10, P.glass);
    px(g, x - 1, y + 7, 12, 3, P.glassLit);
    for (let i = 0; i < 4; i++) {
      px(g, x - 2 + i * 4, y + 2, 2, 4, i % 2 ? '#E8EDF2' : '#C96C4E');
    }
    px(g, x - 3, y + 1, 16, 2, '#8E5A42');
  } else {
    px(g, x, y + 6, 8, 11, P.frame);
    px(g, x + 1, y + 7, 6, 9, P.glass);
    px(g, x + 1, y + 7, 6, 3, P.glassLit);
  }
}

/* ---------------- 실내 벽 ----------------
   위 세 줄이 벽면입니다. 천장 몰딩 · 벽 · 굽도리 세 켜로 나눠야
   평평한 색면이 벽으로 보입니다. */
function paintTopWall(w, P, decor) {
  const c = document.createElement('canvas');
  c.width = w * T; c.height = T * 3;
  const g = c.getContext('2d');
  const W = c.width;

  px(g, 0, 0, W, T * 3, P.iWall);
  g.fillStyle = P.iWallLit;
  for (let x = 3; x < W; x += 7) g.fillRect(x, 10, 1, T * 2 + 2);
  px(g, 0, 0, W, 6, P.iCeil);
  px(g, 0, 6, W, 2, P.iTrim);
  px(g, 0, 8, W, 1, P.iWallLit);
  px(g, 0, T * 3 - 9, W, 4, P.iTrim);
  px(g, 0, T * 3 - 5, W, 5, P.iBase);
  px(g, 0, T * 3 - 1, W, 1, P.iShadow);

  (decor || []).forEach((d) => {
    const x = d.x * T, y = 12;
    if (d.k === 'win') paintWindow(g, d.style, x, y, P);
    else if (d.k === 'shelf') {
      /* 벽 책장 — 도서관 */
      px(g, x - 2, y - 2, T * 2 + 4, 30, P.iTrim);
      px(g, x, y, T * 2, 26, '#4A3323');
      for (let r = 0; r < 3; r++) {
        const ry = y + 2 + r * 9;
        for (let bx = x + 2; bx < x + T * 2 - 2; bx += 3) {
          const h = 5 + ((bx + r) % 3);
          const col = ['#B75B4C', '#52739F', '#8B9C48', '#CDC2B1', '#9C6BA0'][(bx + r * 2) % 5];
          px(g, bx, ry + (7 - h), 2, h, col);
        }
        px(g, x + 1, ry + 7, T * 2 - 2, 2, '#6B4A32');
      }
    }
    else if (d.k === 'board') {
      /* 칠판 — 본관 강의동 */
      px(g, x - 2, y - 2, T * 3 + 4, 28, '#8A6A44');
      px(g, x, y, T * 3, 24, '#2C4034');
      px(g, x + 1, y + 1, T * 3 - 2, 4, '#3A5343');
      g.fillStyle = 'rgba(230,240,235,.5)';
      g.fillRect(x + 5, y + 8, 22, 1);
      g.fillRect(x + 5, y + 12, 30, 1);
      g.fillRect(x + 5, y + 16, 16, 1);
      px(g, x + T * 3 - 12, y + 20, 8, 2, '#E8EDF2');
    }
    else if (d.k === 'notice') {
      /* 게시판 — 학생회관 */
      px(g, x - 2, y - 1, T * 2 + 4, 26, '#7A5B3C');
      px(g, x, y + 1, T * 2, 22, '#C9A87C');
      const cols = ['#F2F4F7', '#FF6B52', '#F2C9C4', '#C4DDF2'];
      for (let i = 0; i < 6; i++) {
        const ax = x + 3 + (i % 3) * 9, ay = y + 4 + Math.floor(i / 3) * 9;
        px(g, ax, ay, 7, 7, cols[i % 4]);
        px(g, ax, ay, 7, 2, 'rgba(0,0,0,.14)');
      }
    }
    else if (d.k === 'banner') {
      /* 현수막 */
      px(g, x, 8, T, 30, d.c || '#3C5C82');
      px(g, x, 8, T, 3, 'rgba(255,255,255,.28)');
      px(g, x + 3, 16, T - 6, 3, '#FF6B52');
      px(g, x + 4, 23, T - 8, 2, 'rgba(255,255,255,.55)');
      px(g, x, 38, T, 3, 'rgba(0,0,0,.3)');
    }
    else if (d.k === 'clock' || d.k === 'clockFace') {
      /* 판만 그립니다. 바늘은 매 프레임 진짜 시각으로 덧그립니다
         (zone.clock). 벽 캔버스는 한 번만 그려지니 여기 바늘을 넣으면
         멈춘 시계가 됩니다. */
      disc(g, x + 8, y + 10, 10, P.iTrim);
      disc(g, x + 8, y + 10, 8, '#FFFDF8');
      g.fillStyle = P.iTrim;
      for (let h = 0; h < 12; h++) {
        const t = h * Math.PI / 6;
        const r = h % 3 === 0 ? 6 : 7;
        g.fillRect(Math.round(x + 8 + Math.sin(t) * r),
                   Math.round(y + 10 - Math.cos(t) * r), 1, 1);
      }
      if (d.k === 'clock') {  // 정지 시계(다른 방)는 바늘까지 그립니다
        px(g, x + 7, y + 5, 2, 6, '#2A3440');
        px(g, x + 8, y + 9, 5, 2, '#2A3440');
      }
    }
    else if (d.k === 'guide') {
      /* 벽에 붙인 안내판. 광장 표지판과 달리 실내라 작아야 합니다 —
         같은 크기로 두면 방 안에 도로표지판이 서 있는 꼴이 됩니다. */
      const w = T * 2, h = 22;
      px(g, x - 1, y - 2, w + 2, h + 2, '#8A6039');
      px(g, x, y - 1, w, h, '#FFF6F3');
      px(g, x, y - 1, w, 2, '#FFFFFF');
      px(g, x, y + h - 3, w, 2, '#E4D3CC');
      px(g, x + 3, y + 2, w - 6, 3, '#FF6B52');
      /* 광장 표지판과 **같은 글자**입니다. 실내라 한 급 작을 뿐입니다. */
      stamp(g, '안내', 9, '#2A2320', x + w / 2, y + 7, 'center');
      /* 못 두 개 */
      px(g, x + 2, y - 3, 2, 2, '#6B5F5A');
      px(g, x + w - 4, y - 3, 2, 2, '#6B5F5A');
    }
    else if (d.k === 'moonwin') {
      /* 기숙사 — 창밖에 달 */
      paintWindow(g, 'grid', x, y, P);
      disc(g, x + 4, y + 7, 2, '#F4F0D8');
    }
  });
  return c;
}

/** 좌우·아래 테두리 벽. 얇지만 색이 이어져야 방이 닫힙니다. */
function paintEdgeWall(w, h, P, vertical) {
  const c = document.createElement('canvas');
  c.width = w * T; c.height = h * T;
  const g = c.getContext('2d');
  px(g, 0, 0, c.width, c.height, P.iWall);
  if (vertical) {
    px(g, 0, 0, 4, c.height, P.iCeil);
    px(g, 4, 0, 2, c.height, P.iTrim);
    px(g, c.width - 5, 0, 5, c.height, P.iBase);
    g.fillStyle = P.iWallLit;
    for (let y = 4; y < c.height; y += 9) g.fillRect(7, y, 1, 5);
  } else {
    /* 가로 벽 — 위에서 아래로 몰딩 · 벽면 · 굽도리. 한 줄짜리 띠로
       두면 벽이 아니라 선으로 보입니다. */
    px(g, 0, 0, c.width, c.height, P.iWall);
    px(g, 0, 0, c.width, 4, P.iTrim);
    px(g, 0, 4, c.width, 1, P.iWallLit);
    g.fillStyle = P.iWallLit;
    for (let x = 3; x < c.width; x += 7) g.fillRect(x, 6, 1, c.height - 12);
    px(g, 0, c.height - 7, c.width, 3, P.iTrim);
    px(g, 0, c.height - 4, c.width, 4, P.iBase);
    px(g, 0, c.height - 1, c.width, 1, P.iShadow);
  }
  return c;
}

/** 방 하나에 벽 넉 장을 두릅니다. 그리기 전용이라 충돌은 그대로 둡니다. */
function dressRoom(m, P, decor) {
  /* 위쪽 벽에는 '안내' 판이 붙습니다 — 글꼴이 오면 그 한 장만 다시
     그립니다. dressRoom 전체를 다시 부르면 바닥까지 덧칠됩니다. */
  TEXT_ART.push(() => { m.walls[0].c = paintTopWall(m.w, P, decor); });
  m.walls = [
    { c: paintTopWall(m.w, P, decor), x: 0, y: 0 },
    { c: paintEdgeWall(1, m.h - 5, P, true), x: 0, y: 3 },
    { c: paintEdgeWall(1, m.h - 5, P, true), x: m.w - 1, y: 3 },
    { c: paintEdgeWall(m.w, 2, P, false), x: 0, y: m.h - 2 },
  ];
  /* 아래 두 줄이 벽입니다. 문이 그 안에 들어갑니다. */
  fillBase(m, 0, m.h - 2, m.w, 2, m.base[at(m, 0, 0)]);
}

/** 실내 팔레트 — 건물 겉색에서 뽑아 씁니다. 겉과 속이 같은 집이 됩니다. */

/* ---- 네 건물. 조감도(campus-map.html)의 팔레트·실루엣을 그대로 옮깁니다 ---- */
const BSPEC = {
  /* 본관 — 남색 모임지붕, 가운데 시계탑. 캠퍼스에서 가장 높은 곳에

/* ==================================================================
   기물과 바닥

   벤치·가로등·자판기를 시트에서 꺼내 쓰면 캠퍼스 색과 따로 놉니다.
   건물을 손으로 그린 이상 그 위에 놓이는 물건도 같은 손이어야 합니다.

   공통 규칙은 건물과 같습니다 — 빛은 왼쪽 위, 밝은 면은 위·왼쪽,
   그림자는 아래·오른쪽. 그리고 **바닥에 닿는 면을 어둡게** 깔아야
   물건이 떠 있지 않고 놓여 있는 것으로 보입니다.
   ================================================================== */

const FURN = {
  wood:  '#A8703F', woodLit: '#C99257', woodDark: '#7A4C25',
  metal: '#98A2AD', metalLit: '#C2CAD2', metalDark: '#5F6874',
  ink:   '#1B2430', lime: '#FF6B52',
  glass: '#3A5568', glassLit: '#8FB0C6',
  leaf:  '#4E9E63', leafLit: '#6FBE7F', soil: '#6B4C33',
};

function canvasOf(wTiles, hTiles) {
  const c = document.createElement('canvas');
  c.width = wTiles * T; c.height = hTiles * T;
  return c;
}
/** 바닥 그림자. 이게 없으면 모든 기물이 공중에 뜹니다. */
function shadow(g, cx, y, rx, ry) {
  g.fillStyle = 'rgba(0,0,0,.20)';
  for (let dy = -ry; dy <= ry; dy++) {
    const half = Math.floor(rx * Math.sqrt(1 - (dy * dy) / (ry * ry || 1)));
    g.fillRect(cx - half, y + dy, half * 2 + 1, 1);
  }
}

/* ---- 픽셀 글자 ----
   갈무리는 픽셀 격자 위에 획을 직접 놓아 만든 한글 글꼴입니다. 맑은
   고딕처럼 윤곽선 글꼴을 작게 줄여 쓰는 것이 아니라서, 제 크기로 찍으면
   획이 이미 칸에 맞습니다. 남은 반투명 픽셀만 1비트로 잘라 냅니다 —
   반투명이 하나도 안 남으므로 확대해도 계단만 보이고 흐려지지 않습니다.

   크기는 **그 글꼴이 정한 크기의 정수배로만** 씁니다. 어긋나면 획이
   칸 사이에 걸쳐 번지고, 그러면 갈무리를 쓸 이유가 없어집니다.

   주의 — 이름의 숫자가 곧 px 이 아닙니다. 갈무리 README 가 정한 크기는
   갈무리7=8px, 갈무리9=10px, 갈무리11=12px 입니다(이름은 글자 획의
   높이고, px 은 줄 높이라 하나씩 큽니다). 이름 그대로 7·9·11 로 찍으면
   반투명 픽셀이 95% 나오고, 제 크기로 찍으면 80% 대로 떨어집니다. */
const GALMURI = [
  { upTo: 8,        family: 'Galmuri7',  unit: 8  },
  { upTo: 10,       family: 'Galmuri9',  unit: 10 },
  { upTo: Infinity, family: 'Galmuri11', unit: 12 },
];
/** 부르는 쪽 크기를 갈무리 한 종과 그 정수배 크기로 맞춥니다. */
function galmuriFont(size) {
  const f = GALMURI.find((f) => size <= f.upTo);
  return { px: f.unit * Math.max(1, Math.round(size / f.unit)), family: f.family };
}

const PXTEXT = new Map();
const hexRGB = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
function pixelText(text, size, color) {
  const key = text + '|' + size + '|' + color;
  if (PXTEXT.has(key)) return PXTEXT.get(key);
  const pad = 4;
  const t = document.createElement('canvas');
  const g = t.getContext('2d');
  const gm = galmuriFont(size);
  /* 폴백을 남겨 둡니다. 글꼴을 못 읽어도 글자는 나와야 합니다 — 흐릴
     뿐이지 표지판이 비지는 않습니다. 프리텐다드로 받는 이유는 이 파일이
     이미 싣고 있고 한글이 다 들어 있어서입니다. monospace 로 두면 맑은
     고딕이 없는 기계에서 두부가 뜹니다. */
  const font = `${gm.px}px "${gm.family}", 'Pretendard Variable', sans-serif`;
  g.font = font;
  t.width = Math.ceil(g.measureText(text).width) + pad * 2;
  /* 글꼴의 행간이 글자 크기보다 큽니다. 넉넉히 잡고 아래 잘라내기에
     맡깁니다 — 모자라면 받침이 잘립니다. */
  t.height = gm.px * 2 + pad * 2;
  g.font = font;                       // 크기를 바꾸면 컨텍스트가 초기화됩니다
  /* 자간은 손대지 않습니다. 갈무리는 자간까지 격자에 맞춰 놓았고,
     여기서 밀면 그 격자가 깨집니다. */
  g.textBaseline = 'top'; g.fillStyle = '#000';
  g.fillText(text, pad, pad);
  const d = g.getImageData(0, 0, t.width, t.height), a = d.data;
  const [r, gg, b] = hexRGB(color);
  /* 알파를 1비트로 자르면서 잉크가 실제로 닿은 칸을 함께 잽니다.
     캔버스 fillText 는 글꼴이 격자에 맞아도 가장자리를 부드럽게 그립니다 —
     끄는 방법이 없습니다. 그래서 자르는 일 자체는 갈무리로 바꿔도 남습니다.

     문턱은 112 입니다. 위 크기를 지키면 80~160 어디로 잘라도 결과가
     **한 픽셀도 다르지 않습니다**(표지판 넉 장과 안내판으로 확인).
     제 크기의 갈무리는 획 안쪽이 꽉 차고 바깥만 옅게 남아서, 중간값이
     아예 안 생기기 때문입니다. 그래서 이 값은 예민하지 않습니다.

     예민해지는 건 크기가 어긋났을 때입니다. 7·9·11px 로 찍으면 획이
     칸 사이에 걸쳐 중간 알파가 잔뜩 생기고, 그때는 문턱 64 에서 "학생"
     이 한 덩어리가 되고 160 에서 "기숙사" 가 끊깁니다. 문턱을 만지고
     싶어지면 크기부터 의심하세요. */
  let x0 = t.width, y0 = t.height, x1 = -1, y1 = -1;
  for (let y = 0; y < t.height; y++) for (let x = 0; x < t.width; x++) {
    const i2 = (y * t.width + x) * 4;
    const on = a[i2 + 3] > 112;
    a[i2] = r; a[i2 + 1] = gg; a[i2 + 2] = b; a[i2 + 3] = on ? 255 : 0;
    if (on) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  g.putImageData(d, 0, 0);
  if (x1 < 0) { PXTEXT.set(key, t); return t; }
  /* 딱 맞게 잘라 냅니다. 안 자르면 판 안에서 글자가 어디쯤 있는지 알 수
     없어, 위아래 여백을 눈대중으로 맞추게 됩니다. */
  const c = document.createElement('canvas');
  c.width = x1 - x0 + 1; c.height = y1 - y0 + 1;
  c.getContext('2d').drawImage(t, x0, y0, c.width, c.height, 0, 0, c.width, c.height);
  PXTEXT.set(key, c);
  return c;
}
/** 잘라 낸 글자를 찍습니다. x 는 left/center/right, y 는 top/middle 기준점. */
function stamp(g, text, size, color, x, y, align = 'left', valign = 'top') {
  const t = pixelText(text, size, color);
  const dx = align === 'center' ? x - t.width / 2 : align === 'right' ? x - t.width : x;
  const dy = valign === 'middle' ? y - t.height / 2 : y;
  g.drawImage(t, Math.round(dx), Math.round(dy));
  return t.width;
}

/* ---- 글꼴이 늦게 오는 문제 ----
   글자가 든 그림은 스크립트를 읽는 순간 한 번 그려 캐시에 넣습니다.
   그런데 웹폰트는 그때 아직 안 와 있습니다 — 첫 판이 폴백으로 찍히고,
   캐시에 들어갔으니 영영 그대로 남습니다.

   그래서 다시 그리는 방법을 여기 모아 두고, 글꼴이 온 뒤 한 번 더
   돌립니다. 글자가 든 그림을 새로 만들 때는 여기에 등록하세요. */
const TEXT_ART = [];
function repaintTextArt() {
  PXTEXT.clear();              // 폴백으로 찍힌 글자를 버립니다
  TEXT_ART.forEach((f) => f());
  /* 그리고 **다시 가리킵니다.**

     여기 등록된 함수 중 몇은 캔버스를 새로 만들어 PAINTED 에 넣습니다
     (표지판·관문). 그런데 PROP 은 만들어질 때 그 시점의 캔버스를 붙들어
     둡니다. 그러면 다시 그린 그림은 PAINTED 에만 있고, 화면에는 글꼴이
     오기 전 폴백으로 찍힌 판이 영영 남습니다.

     광장 표지판 넉 장이 그랬습니다 — 8px 프리텐다드를 1비트로 자른
     글자라 획이 부스러져 있었습니다. 방 안내판만 멀쩡했던 이유는
     dressRoom 이 캔버스가 아니라 **참조를** 바꿔 끼우기 때문입니다. */
  for (const d of Object.values(PROP)) {
    if (d && d.key && PAINTED[d.key]) d.canvas = PAINTED[d.key];
  }
}
/* 캔버스에 글꼴 이름을 적는 것만으로는 브라우저가 내려받지 않는 경우가
   있습니다. 쓸 글자를 주며 명시적으로 부릅니다. 못 읽어도 넘어갑니다 —
   폴백으로 찍힌 그림이 이미 있으니 앱은 그대로 돕니다. */
Promise.all(GALMURI.map((f) =>
  document.fonts.load(`${f.unit}px "${f.family}"`, '기숙사도서관본관학생회안내')
    .catch(() => null)
)).then(() => document.fonts.ready).then(repaintTextArt);

const PAINTED = {};

/* ---- 벤치 2×2 — 등받이가 뒤, 앉는 면이 앞 ---- */
{
  const c = canvasOf(2, 2), g = c.getContext('2d');
  shadow(g, 16, 29, 15, 3);
  /* 뒷다리 — 등받이보다 먼저 깔아야 뒤로 넘어갑니다 */
  [5, 25].forEach((x) => px(g, x, 8, 2, 6, FURN.metalDark));
  /* 등받이 기둥 둘 */
  [4, 26].forEach((x) => {
    px(g, x, 3, 3, 13, FURN.metalDark);
    px(g, x, 3, 1, 13, FURN.metal);
  });
  /* 등받이 살 셋 — 사이가 비어야 벤치로 보입니다 */
  for (let i = 0; i < 3; i++) {
    const y = 4 + i * 4;
    px(g, 4, y, 24, 3, FURN.wood);
    px(g, 4, y, 24, 1, FURN.woodLit);
    px(g, 4, y + 2, 24, 1, FURN.woodDark);
  }
  /* 팔걸이 — 좌면보다 한 칸 위에서 앞으로 뻗습니다 */
  [2, 27].forEach((x) => {
    px(g, x, 15, 3, 8, FURN.woodLit);
    px(g, x, 15, 3, 1, '#D8A66C');
    px(g, x, 22, 3, 1, FURN.woodDark);
  });
  /* 앉는 면 — 널 셋, 이음새가 보여야 나무입니다 */
  for (let i = 0; i < 3; i++) {
    const y = 16 + i * 3;
    px(g, 3, y, 26, 3, i === 0 ? FURN.woodLit : FURN.wood);
    px(g, 3, y + 2, 26, 1, FURN.woodDark);
  }
  px(g, 3, 25, 26, 2, '#6B4423');            // 앞코 그늘
  /* 앞다리 */
  [5, 25].forEach((x) => {
    px(g, x, 26, 3, 5, FURN.metalDark);
    px(g, x, 26, 1, 5, FURN.metal);
  });
  PAINTED.bench = c;
}

/* ---- 알과 받침 2×3 ----
   부화장은 없앴습니다. 알은 학생회관 상점에서 가장 비싼 물건으로 팔
   예정이라 그림만 남깁니다 — 상점 진열대에 그대로 올라갑니다.
   알만 놓으면 바닥에 굴러다니는 것으로 보입니다. 받침 위에 올려야
   "가져가도 되는 것" 이 아니라 "고르는 것" 이 됩니다. */
function eggCanvas(key, shell, shellLit, shellDark, spot) {
  const c = canvasOf(2, 3), g = c.getContext('2d');
  shadow(g, 16, 45, 12, 3);
  /* 돌받침 — 위가 둥근 원기둥 */
  px(g, 4, 36, 24, 9, '#7B8590');
  px(g, 5, 37, 22, 7, '#A3ADB8');
  disc(g, 16, 37, 11, '#BAC4CE');
  disc(g, 16, 36, 10, '#D2DAE2');
  disc(g, 14, 35, 6, '#E8EEF3');
  g.fillStyle = '#8A939E';
  for (let x = 6; x < 27; x += 5) g.fillRect(x, 40, 1, 4);
  /* 알 — 아래가 넓은 타원. 위아래 반지름을 다르게 줘야 공이 안 됩니다. */
  for (let y = -15; y <= 13; y++) {
    const t = y < 0 ? y / 15 : y / 13;
    const w = Math.round(Math.sqrt(Math.max(0, 1 - t * t)) * (y < 0 ? 8.5 : 10));
    if (!w) continue;
    px(g, 16 - w, 20 + y, w * 2, 1, shellDark);
    px(g, 16 - w + 1, 20 + y, w * 2 - 2, 1, shell);
  }
  /* 왼쪽 위 광 */
  disc(g, 12, 14, 4, shellLit);
  disc(g, 11, 13, 2, '#FFFFFF');
  /* 무늬 — 종마다 다릅니다. 이게 없으면 알 넷이 색만 다른 같은 알입니다. */
  g.fillStyle = spot;
  [[15, 9, 4, 3], [10, 18, 5, 4], [19, 15, 4, 5], [14, 26, 6, 3], [21, 24, 3, 3]]
    .forEach(([x, y, w, h]) => g.fillRect(x, y, w, h));
  PAINTED[key] = c;
}
eggCanvas('eggTurtle', '#63B87A', '#8FD9A2', '#3D8A55', '#3F8F5C');
eggCanvas('eggGiraffe', '#F0C566', '#FFE1A0', '#C39338', '#B5762E');
eggCanvas('eggMeerkat', '#D8AE84', '#F2D2AE', '#A87F58', '#8E6440');
eggCanvas('eggPig', '#F2A6B2', '#FFCBD4', '#C4737F', '#B95F6E');

/* ---- 천막 부스 3×3 — 동아리 거리 ----
   지붕 · 기둥 · 판매대 셋이 다 있어야 부스입니다. 지붕만 그리면
   땅에 떠 있는 우산이 됩니다. */
function tentCanvas(key, cloth, clothLit, clothDark) {
  const c = canvasOf(3, 3), g = c.getContext('2d');
  shadow(g, 24, 45, 20, 4);
  /* 기둥 넷 — 지붕보다 먼저 */
  [4, 41].forEach((x) => { px(g, x, 20, 3, 24, '#8A6039'); px(g, x, 20, 1, 24, '#A87B4C'); });
  /* 판매대 */
  px(g, 6, 30, 36, 12, '#8A6039');
  px(g, 7, 31, 34, 10, '#B08050');
  px(g, 7, 31, 34, 2, '#C99A64');
  px(g, 6, 40, 36, 3, '#6B4423');
  g.fillStyle = '#9A6C3E';
  for (let x = 10; x < 41; x += 7) g.fillRect(x, 33, 1, 7);
  /* 지붕 — 줄무늬 차양. 아래 가장자리가 물결이어야 천으로 보입니다. */
  px(g, 0, 8, 48, 14, clothDark);
  px(g, 1, 9, 46, 12, cloth);

/* ---- 관문 4×4 ----
   미니게임존의 문입니다. 넷이 나란히 서므로 **서로 달라야** 하고, 동시에
   한 식구로 보여야 합니다. 그래서 뼈대(돌기둥·처마·문간)는 같게 두고
   천 색 · 안쪽 빛 · 문장(紋章) 셋만 바꿉니다.

   문 안쪽을 벽처럼 막지 않고 어둡게 파서 빛을 물렸습니다 — 관문은
   지나가는 곳이라 안이 안 보이면 그냥 벽에 붙인 장식이 됩니다. */
function gateEmblem(g, kind, cx, cy, ink) {
  if (kind === 'key') {
    /* 열쇠 — 방탈출 */
    circleLine(g, cx - 4, cy, 4, ink);
    circleLine(g, cx - 4, cy, 3, ink);
    px(g, cx - 1, cy - 1, 10, 2, ink);
    px(g, cx + 5, cy + 1, 2, 3, ink);
    px(g, cx + 8, cy + 1, 2, 3, ink);
  } else {
    /* 기린 — 고개 숙인 기린 목 펴기 */
    if (kind === 'shell') {
      circleLine(g, cx, cy, 8, ink);
      px(g, cx - 6, cy - 1, 12, 2, ink);
      px(g, cx - 1, cy - 7, 2, 14, ink);
      return;
    }
    /* 물음표 — 아직 정하지 않은 놀이 */
    px(g, cx - 4, cy - 7, 8, 2, ink);
    px(g, cx + 3, cy - 6, 2, 4, ink);
    px(g, cx - 1, cy - 3, 5, 2, ink);
    px(g, cx - 2, cy - 1, 2, 4, ink);
    px(g, cx - 2, cy + 5, 2, 2, ink);
  }
}
function gateCanvas(key, name, base, lit, dark, glow, emblem) {
  const c = canvasOf(4, 4), g = c.getContext('2d');
  shadow(g, 32, 60, 26, 4);

  /* ---- 문간 ---- */
  px(g, 14, 20, 36, 38, '#131A24');
  disc(g, 32, 24, 18, '#131A24');
  /* 안쪽 빛 — 다섯 겹으로 번집니다 */
  for (let k = 5; k >= 1; k--) {
    g.fillStyle = 'rgba(' + glow + ',' + (0.07 * (6 - k)).toFixed(2) + ')';
    g.beginPath(); g.ellipse(32, 42, 3 * k, 3.4 * k, 0, 0, 7); g.fill();
  }
  gateEmblem(g, emblem, 32, 40, 'rgba(' + glow + ',.85)');
  /* 아치 테두리 */
  circleLine(g, 32, 24, 18, dark);
  circleLine(g, 32, 24, 17, base);

  /* ---- 기둥 둘 ---- */
  [0, 48].forEach((x) => {
    px(g, x, 16, 16, 42, '#5E5449');
    px(g, x + 1, 17, 14, 40, '#A79A85');
    px(g, x + 1, 17, 5, 40, '#C6BAA3');
    px(g, x + 12, 17, 3, 40, '#877C6A');
    g.fillStyle = '#8B7F6C';
    for (let y = 22; y < 56; y += 7) g.fillRect(x + 1, y, 14, 1);
    /* 주두 · 초석 */
    px(g, x - 1, 12, 18, 6, '#5E5449');
    px(g, x, 13, 16, 4, '#C6BAA3');
    px(g, x - 1, 54, 18, 5, '#5E5449');
    px(g, x, 54, 16, 2, '#B3A791');
    /* 등 — 색이 문마다 달라, 멀리서도 넷을 셀 수 있습니다 */
    px(g, x + 4, 22, 8, 3, '#3A4652');
    px(g, x + 4, 25, 8, 7, dark);
    px(g, x + 5, 26, 6, 5, lit);
    px(g, x + 6, 27, 4, 3, '#FFFFFF');
    px(g, x + 4, 32, 8, 2, '#3A4652');
  });

  /* ---- 처마와 이름 판 ---- */
  px(g, 0, 10, 64, 6, '#5E5449');
  px(g, 1, 11, 62, 4, '#B3A791');
  px(g, 1, 11, 62, 1, '#D2C8B4');
  /* 박공 — 계단으로 쌓아 올립니다 */
  for (let k = 0; k < 4; k++) {
    px(g, 4 + k * 3, 10 - k * 3, 56 - k * 6, 3, k % 2 ? '#5E5449' : '#877C6A');
  }
  /* 이름 천 */
  px(g, 6, 0, 52, 12, dark);
  px(g, 7, 1, 50, 10, base);
  px(g, 7, 1, 50, 2, lit);
  px(g, 7, 9, 50, 2, dark);
  stamp(g, name, 9, dark, 32, 7, 'center', 'middle');
  stamp(g, name, 9, '#FFFFFF', 32, 6, 'center', 'middle');

  /* ---- 문지방 ---- */
  px(g, 10, 57, 44, 5, dark);
  px(g, 11, 57, 42, 3, base);
  px(g, 11, 57, 42, 1, lit);
  PAINTED[key] = c;
}

/* ---- 서가 3×2 ----
   책등 색을 무작위로 흩되 폭은 2~4px 로 묶습니다. 폭까지 무작위면
   책이 아니라 색 얼룩이 됩니다. */
{
  const c = canvasOf(3, 2), g = c.getContext('2d');
  shadow(g, 24, 30, 22, 3);
  const spines = ['#B8523F', '#3E6E96', '#C89A3C', '#4E8A5C', '#8E5A9E',
                  '#C2705A', '#3F7F84', '#A8483F', '#5C6EA8', '#B08050'];
  /* 통 — 옆널 둘과 등판 */
  px(g, 1, 2, 46, 26, '#5E4128');
  px(g, 2, 3, 44, 24, '#7A5637');
  px(g, 2, 3, 44, 2, '#96693F');
  /* 두 단 */
  for (let s2 = 0; s2 < 2; s2++) {
    const y = 6 + s2 * 11;
    px(g, 4, y, 40, 9, '#4A3220');
    let x = 5;
    while (x < 43) {
      const w = 2 + Math.floor(rnd(x, y, s2) * 3);
      const h = 7 - Math.floor(rnd(x, y, s2 + 5) * 2);
      const col = spines[Math.floor(rnd(x, y, s2 + 9) * spines.length)];
      if (x + w > 43) break;
      px(g, x, y + 1 + (7 - h), w, h, col);
      px(g, x, y + 1 + (7 - h), w, 1, 'rgba(255,255,255,.28)');
      px(g, x, y + 8, w, 1, 'rgba(0,0,0,.30)');
      x += w + 1;
    }
    px(g, 3, y + 9, 42, 2, '#6B4A2E');       // 선반 앞코
    px(g, 3, y + 9, 42, 1, '#96693F');
  }
  px(g, 1, 27, 46, 2, '#3E2A18');
  PAINTED.stack = c;
}

function vendingCanvas(bodyC, bodyLit) {

  for (let r = 0; r < 4; r++) {
    for (let i = 0; i < 3; i++) {
      px(g, 4 + i * 3, 8 + r * 4, 2, 3, cans[(r * 3 + i) % 5]);
      px(g, 4 + i * 3, 8 + r * 4, 2, 1, '#FFFFFF');

  px(g, 3, 7, 8, 2, 'rgba(255,255,255,.22)');

/* ---- 화단 1×2 — 세로로 섭니다 ----
   가로로 눕히면 벤치와 헷갈립니다. 돌 테두리 안에 흙을 담고 줄기를
   세워야 화단으로 보입니다 — 꽃만 흩뿌리면 얼룩입니다. */
{
  const c = canvasOf(1, 2), g = c.getContext('2d');
  shadow(g, 8, 30, 7, 2);
  /* 돌 테두리 */
  px(g, 1, 8, 14, 23, '#7E8590');
  px(g, 2, 9, 12, 21, '#9BA3AE');
  px(g, 2, 9, 12, 2, '#B8C0C9');
  px(g, 2, 9, 2, 21, '#B0B8C2');
  g.fillStyle = '#6E757F';
  for (let y = 12; y < 30; y += 5) g.fillRect(2, y, 12, 1);
  for (let y = 9; y < 30; y += 5)
    g.fillRect(((y / 5) | 0) % 2 ? 6 : 10, y, 1, 5);
  /* 흙 */
  px(g, 3, 11, 10, 17, '#5E4230');
  px(g, 3, 11, 10, 2, '#74523B');
  /* 줄기와 잎 — 뒤가 크고 앞이 작아야 깊이가 생깁니다 */
  const stems = [[5, 12, 9], [8, 11, 11], [11, 13, 8], [6, 18, 7], [10, 19, 6]];
  stems.forEach(([sx, sy, h], i) => {
    px(g, sx, sy, 1, h, i % 2 ? '#3F8A4E' : '#4E9E63');
    px(g, sx - 2, sy + h - 4, 2, 2, '#5AAE6E');
    px(g, sx + 1, sy + h - 6, 2, 2, '#3F8A4E');
  });
  /* 꽃 — 다섯 송이만. 많으면 흙이 안 보여 덤불이 됩니다. */
  const blooms = ['#E8D45C', '#E0708A', '#F2F4F7', '#FF6B52', '#C87ED8'];
  stems.forEach(([sx, sy], i) => {
    const by = sy - 1;
    px(g, sx - 1, by, 3, 3, blooms[i]);
    px(g, sx, by - 1, 1, 1, blooms[i]);
    px(g, sx, by + 1, 1, 1, '#B8942E');
    px(g, sx - 1, by, 2, 1, 'rgba(255,255,255,.35)');
  });
  PAINTED.planter = c;
}

/* ---- 방향 표지판 6×4 — 광장 한가운데 ----
   메이플의 안내 NPC가 하던 일을 물건이 합니다. 스타듀밸리처럼 나무
   팻말이지만 판 색이 그 건물 지붕색과 같아서, 표지판만 보면 어디에
   뭐가 있는지 압니다.

   판에 상징을 넣어 봤다가 뺐습니다 — 18px 짜리 책과 글자가 같은 판
   안에서 겹쳐 둘 다 안 읽혔습니다. 상징은 지붕이 이미 맡고 있으니
   여기서는 **색 · 이름 · 화살표** 셋이면 충분합니다. */
function paintSignpost() {
  const c = canvasOf(3, 4), g = c.getContext('2d');
  const CX = 24;
  shadow(g, CX, 63, 10, 3);

  /* 돌 받침 */
  px(g, CX - 8, 54, 16, 8, '#6E757F');
  px(g, CX - 7, 55, 14, 6, '#96A0AA');
  px(g, CX - 7, 55, 14, 2, '#B6BFC7');
  px(g, CX - 7, 55, 3, 6, '#AAB3BC');
  g.fillStyle = '#7C848E';
  for (let x = CX - 5; x < CX + 6; x += 4) g.fillRect(x, 57, 1, 4);

  /* 기둥 */
  px(g, CX - 2, 3, 4, 53, '#6B4A2E');
  px(g, CX - 2, 3, 2, 53, '#8A6039');
  px(g, CX + 1, 3, 1, 53, '#523821');
  g.fillStyle = 'rgba(82,56,33,.5)';
  for (let y = 7; y < 55; y += 6) g.fillRect(CX - 1, y, 2, 1);


  /* 판 하나.
     방향은 **세 겹으로** 말합니다 — 판이 어느 쪽으로 뻗었는가, 끝이
     어느 쪽으로 뾰족한가, 화살촉이 어디를 보는가. 하나만 쓰면 북과 남을
     화살표 모양으로만 구분해야 해서 흘깃 봐서는 안 읽힙니다. */
  function board(y, dir, color, dark, label) {
    const w = 39, h = 10;
    const x = dir === 'r' ? 1 : dir === 'l' ? 8 : 4;
    const vert = dir === 'u' || dir === 'd';
    px(g, x + 1, y + 2, w, h, 'rgba(0,0,0,.26)');
    px(g, x, y, w, h, color);                      // 테두리 = 밝은 지붕색
    px(g, x + 1, y + 1, w - 2, h - 2, dark);       // 판 = 어두운 쪽
    px(g, x + 1, y + 1, w - 2, 1, 'rgba(255,255,255,.16)');
    px(g, x + 1, y + h - 2, w - 2, 1, 'rgba(0,0,0,.28)');

    if (!vert) {
      /* 뾰족한 끝 */
      const right = dir === 'r', tip = right ? x + w : x - 1;
      for (let k = 0; k < 6; k++) {
        const t = right ? tip + k : tip - k;
        px(g, t, y + k, 1, h - k * 2, dark);
        px(g, t, y + k, 1, 1, color);
        px(g, t, y + h - k - 1, 1, 1, color);
      }
    } else {
      /* 위·아래는 뾰족할 옆이 없습니다. 판 밖으로 삼각 갈매기를 세워
         붙입니다 — 판 위에 솟았으면 북, 아래로 늘어졌으면 남입니다. */
      const up = dir === 'u', cx = x + (w >> 1);
      for (let k = 0; k < 5; k++) {
        const yy = up ? y - 5 + k : y + h + 4 - k;
        px(g, cx - k, yy, k * 2 + 1, 1, k === 0 ? color : dark);
      }
      px(g, cx - 4, up ? y - 1 : y + h, 9, 1, color);
    }

    /* 이름 — 밝은 지붕색 위에서도 읽히도록 한 픽셀 아래에 그림자를 깝니다 */
    stamp(g, label, 8, '#FFFFFF', x + w / 2, y + h / 2, 'center', 'middle');
  }

  /* 위에서 아래로 북 · 동 · 서 · 남. 판 높이 순서가 곧 지도입니다. */
  board(7,  'u', '#D07A4C', '#8A461F', '기숙사');
  board(18, 'r', '#3E8D82', '#1F544C', '도서관');
  board(29, 'l', '#3C5C82', '#1E3550', '본관');
  board(40, 'd', '#5CB177', '#2E6B45', '학생회관');

  PAINTED.signpost = c;
}

function paintedProp(key, w, h, solidRows) {
  const c = [];
  for (let j = 0; j < h; j++) {
    c.push([]);
    for (let i = 0; i < w; i++) c[j].push(solidRows ? (solidRows[j] ? 1 : 0) : 1);
  }
  /* key 를 들고 있어야 글꼴이 온 뒤 다시 그린 캔버스로 갈아 끼울 수
     있습니다 (repaintTextArt). */
  return { s: 'img', key, canvas: PAINTED[key], w, h, c, t: null };
}

PAINTED.pennant = canvasOf(1, 2);
PAINTED.schoolCushion = canvasOf(1, 1);
function paintSchoolProps() {
  const col = roomColor();
  const [r, g_, b] = hexRGB(col);
  const lit = 'rgba(255,255,255,.30)', dark = 'rgba(0,0,0,.26)';

  /* 삼각 응원기 — 벽에 거는 페넌트 */
  {
    const c = PAINTED.pennant, g = c.getContext('2d');
    g.clearRect(0, 0, c.width, c.height);
    px(g, 2, 2, 2, 26, '#8E827C');                     // 걸이 끈
    px(g, 2, 2, 1, 26, '#B4AAA4');
    /* 깃발 — 오른쪽으로 갈수록 좁아지는 삼각형 */
    for (let y = 0; y < 14; y++) {
      const w = 13 - Math.round(y * 0.55);
      px(g, 4, 5 + y, w, 1, y < 3 ? lit : col);
    }
    g.fillStyle = dark;
    for (let y = 10; y < 14; y++) g.fillRect(4, 5 + y, 13 - Math.round(y * 0.55), 1);
    px(g, 4, 5, 13, 1, 'rgba(255,255,255,.5)');
    px(g, 6, 9, 5, 2, readableOn(col) === '#FFFFFF' ? '#FFFFFF' : '#2A2320');
  }

  /* 방석 — 학교 색 천에 흰 테두리 */
  {
    const c = PAINTED.schoolCushion, g = c.getContext('2d');
    g.clearRect(0, 0, c.width, c.height);
    shadow(g, 8, 14, 6, 2);
    px(g, 2, 5, 12, 8, 'rgb(' + Math.round(r * .78) + ',' + Math.round(g_ * .78) + ',' + Math.round(b * .78) + ')');
    px(g, 3, 6, 10, 6, col);
    px(g, 3, 6, 10, 2, lit);
    px(g, 3, 12, 10, 1, dark);
    px(g, 7, 8, 2, 2, 'rgba(255,255,255,.55)');
  }
}

/* ==================================================================
   앉는 자리와 문 — 직접 그립니다

   Cool School 의자는 48px 원본을 3으로 나눈 것이라 등받이 살이 뭉개져
   "잘린 상자" 로 보였습니다. 16px 에서 의자로 읽히려면 **등받이 · 앉는
   면 · 다리** 세 덩이가 각각 최소 4px 은 되어야 하는데, 축소로는 그
   경계가 남지 않습니다. 그래서 16px 격자에 맞춰 처음부터 그립니다.

   빛은 언제나 왼쪽 위. 바닥에 닿는 자리에는 그림자를 깔아야 물건이
   떠 있지 않습니다.
   ================================================================== */

const DESKPAL = {
  wood:    '#A9773F', woodLit: '#C99A5C', woodDark: '#7E5526', woodDeep: '#5E3D19',
  seat:    '#4E6E8E', seatLit: '#6E8FAE', seatDark: '#35506B',
  metal:   '#9AA3AD', metalLit: '#C4CBD2', metalDark: '#616974',
  glass:   '#BFD9E4', glassLit: '#E2F0F5', glassDark: '#6E93A4',
  mat:     '#C2412C', matLit: '#E0604A',
};

/* ---- 의자 1×1 — 등받이 · 앉는 면 · 다리 ---- */
function chairCanvas(seatCol, seatLit, seatDark) {
  const c = canvasOf(1, 1), g = c.getContext('2d');
  const P = DESKPAL;
  shadow(g, 8, 15, 6, 2);
  /* 등받이 — 위쪽. 살 두 개가 있어야 의자로 읽힙니다. */
  px(g, 3, 0, 10, 6, P.woodDark);
  px(g, 4, 1, 8, 4, P.wood);
  px(g, 4, 1, 8, 1, P.woodLit);
  px(g, 6, 2, 1, 3, P.woodDark);
  px(g, 9, 2, 1, 3, P.woodDark);
  /* 앉는 면 — 좌우로 조금 넓어야 등받이와 구분됩니다. */
  px(g, 2, 6, 12, 6, P.woodDeep);
  px(g, 2, 6, 12, 5, seatCol);
  px(g, 2, 6, 12, 2, seatLit);
  px(g, 3, 10, 10, 1, seatDark);
  /* 다리 넷 — 앞 둘만 보이고 뒤 둘은 그림자로 */
  px(g, 3, 12, 2, 4, P.woodDark);
  px(g, 3, 12, 1, 4, P.wood);
  px(g, 11, 12, 2, 4, P.woodDark);
  px(g, 11, 12, 1, 4, P.wood);
  px(g, 5, 12, 6, 1, 'rgba(0,0,0,.18)');
  return c;
}

/* ---- 책상 ----
   상판 · 앞면 · 다리 세 켜. 상판만 그리면 판때기로 보입니다. */
function deskCanvas(wTiles, topCol, topLit) {
  const c = canvasOf(wTiles, 1), g = c.getContext('2d');
  const P = DESKPAL, W = wTiles * T;
  shadow(g, W / 2, 15, W / 2 - 2, 2);
  /* 상판 */
  px(g, 0, 1, W, 10, P.woodDeep);
  px(g, 1, 2, W - 2, 8, topCol);
  px(g, 1, 2, W - 2, 2, topLit);
  /* 나뭇결 */
  g.fillStyle = 'rgba(94,61,25,.20)';
  for (let x = 3; x < W - 3; x += 7) g.fillRect(x, 5, 5, 1);
  /* 앞면 — 상판보다 어두워야 두께가 보입니다 */
  px(g, 1, 10, W - 2, 3, P.woodDark);
  px(g, 1, 10, W - 2, 1, P.wood);
  /* 다리 */
  px(g, 2, 13, 2, 3, P.woodDeep);
  px(g, W - 4, 13, 2, 3, P.woodDeep);
  return c;
}

/* ---- 큰 출입문 3×2 ----
   건물마다 문이 다르면 "여기가 나가는 곳" 을 매번 새로 배워야 합니다.
   전부 같은 문을 씁니다 — 윗창 · 유리 두 짝 · 손잡이 · 발판. */
{
  const c = canvasOf(3, 2), g = c.getContext('2d');
  const P = DESKPAL;
  const W = 48;
  /* 문틀 */
  px(g, 0, 0, W, 32, P.metalDark);
  px(g, 1, 1, W - 2, 30, P.metal);
  px(g, 1, 1, W - 2, 2, P.metalLit);
  /* 윗창 */
  px(g, 4, 3, W - 8, 6, P.glassDark);
  px(g, 5, 4, W - 10, 4, P.glass);
  px(g, 5, 4, W - 10, 2, P.glassLit);
  /* 유리 두 짝 */
  [5, 25].forEach((x) => {
    px(g, x, 11, 18, 19, P.metalDark);
    px(g, x + 1, 12, 16, 17, P.glass);
    px(g, x + 1, 12, 16, 5, P.glassLit);
    /* 비스듬한 반사 — 한 줄이면 유리가 됩니다 */
    g.fillStyle = 'rgba(255,255,255,.42)';
    for (let i = 0; i < 12; i++) g.fillRect(x + 3 + i, 26 - i, 2, 1);
    px(g, x + 1, 27, 16, 2, P.glassDark);
  });
  /* 가운데 기둥과 손잡이 */
  px(g, 22, 11, 4, 19, P.metalDark);
  px(g, 22, 11, 1, 19, P.metal);
  px(g, 19, 19, 3, 5, P.metalLit);
  px(g, 26, 19, 3, 5, P.metalLit);
  /* 발판 — 코랄. 나가는 곳이라는 표시입니다. */
  px(g, 6, 30, 36, 2, P.mat);
  px(g, 6, 30, 36, 1, P.matLit);
  PAINTED.exitDoor = c;
}

/* 문은 통과할 수 있어야 합니다 — 아랫줄만 뚫습니다 */
/* 문은 **통로**입니다. 그림에 충돌을 주면 문 앞에서 막혀 영영 못
   나갑니다 — 막는 것은 문이 아니라 그 옆의 벽입니다. */

PROP.chairC   = { ...paintedProp('chairC', 1, 1), sit: true };
PROP.chairD   = { ...paintedProp('chairD', 1, 1), sit: true };
