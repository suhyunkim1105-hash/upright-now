  { id: 'moss',     name: '이끼',   hex: '#5C7043' },
  { id: 'mustard',  name: '겨자',   hex: '#C08A2E' },
  { id: 'brick',    name: '벽돌',   hex: '#B0503C' },
  { id: 'plum',     name: '자두',   hex: '#7A3E5C' },
];
const TINT_BY_HEX = Object.fromEntries(TINTS.map((t) => [t.hex, t]));
/* 색을 고를 수 있는 아이템만. 과잠은 학교 색이고 학사모는 졸업식 규정이라
   고르는 것이 아닙니다. 청바지는 데님이고 구두는 가죽입니다. 안경테는
   2px 라 색을 바꿔도 테두리 색과 싸우기만 합니다. */
const tintable = (it) => !!(it && it.tint);
/* map 을 받는 이유: 남을 그릴 때는 그 사람이 고른 색이어야 합니다.
   안 넘기면 내 옷장 색으로 칠해집니다. */
const tintOf = (it, map) => (tintable(it) ? (map || ROOM.tint)[it.id] || null : null);

/* 예전 판에서 산 아이템(니트·워커·안경)은 이제 없습니다. 그대로 두면
   `SHOP_BY_ID[id]` 가 undefined 라 입은 칸을 그릴 때 터집니다. 들어오는
   길목 하나에서 걸러야 뒤에 있는 모든 곳이 안전합니다. */
function pruneUnknownItems() {
  ROOM.owned = (ROOM.owned || []).filter((id) => SHOP_BY_ID[id]);
  for (const cat of Object.keys(ROOM.worn || {}))
    if (!SHOP_BY_ID[ROOM.worn[cat]] || isFurniture(SHOP_BY_ID[ROOM.worn[cat]])) delete ROOM.worn[cat];
  ROOM.tint = ROOM.tint || {};
  for (const id of Object.keys(ROOM.tint))
    if (!tintable(SHOP_BY_ID[id]) || !TINT_BY_HEX[ROOM.tint[id]]) delete ROOM.tint[id];
  /* 저장된 가구는 세 가지로 깨질 수 있습니다 — 없어진 상품, 안 산 것,
     방 크기가 바뀌어 지도 밖으로 나간 좌표. 셋 다 여기서 거릅니다.
     같은 것을 두 번 놓은 기록도 앞엣것만 남깁니다(하나씩만 삽니다). */
  const seen = new Set();
  ROOM.decor = (Array.isArray(ROOM.decor) ? ROOM.decor : []).filter((d) => {
    const it = d && SHOP_BY_ID[d.id];
    if (!isFurniture(it) || !ROOM.owned.includes(d.id) || seen.has(d.id)) return false;
    const p = PROP[it.prop];
    if (!p || !Number.isInteger(d.x) || !Number.isInteger(d.y)) return false;
    if (d.x < 0 || d.y < 0 || d.x + p.w > DORM.w || d.y + p.h > DORM.h) return false;
    seen.add(d.id);
    return true;
  }).map((d) => ({ id: d.id, x: d.x, y: d.y }));   // 남는 필드는 버립니다
}
pruneUnknownItems();

/* ==================================================================
   방 꾸미기

   싸이월드 미니룸이 기준입니다 — 칸이 정해진 진열장이 아니라, 방 안
   아무 데나 끌어다 놓는 것. 그래서 **자유 배치**입니다.

   자유 배치의 값은 "내가 정했다" 이고, 값은 두 가지입니다.
     · 검사를 해야 합니다. 정해진 칸이면 애초에 못 막지만, 자유 배치는
       문 앞에 옷장을 놓아 스스로를 가둘 수 있습니다.
     · 놓는 동안 보여 줘야 합니다. 목록에서 고르고 끝나면 어디에 놓일지
       모르는 채로 확인을 누르게 됩니다.

   **끌어다 놓기.** 앞 판은 방향키로 유령을 밀고 Space 로 놓았습니다.
   그 모드에서는 배치 중에 걸을 수 없어서, 내가 서 있는 자리에는 영영 못
   놓았습니다 — 방이 열한 칸 세로인데 그중 한 칸이 늘 막혀 있는 셈입니다.
   마우스로 끌면 서 있는 자리와 놓는 자리가 갈라집니다.

   방향키는 **지우지 않고 같은 드래그의 두 번째 입력으로 접었습니다.**
   서랍에서 Enter 를 누르면 마우스와 똑같은 드래그가 시작되고, 방향키가
   커서 대신 유령을 옮깁니다. 마우스만 남기면 자판만 쓰는 사람이 가구를
   영영 못 놓습니다.

   **놓을 수 있는 칸을 전부 켭니다.** 커서 밑 한 칸만 색이 바뀌면 어디가
   되는지 한 칸씩 찍어 봐야 압니다. 끌기 시작할 때 방 전체를 한 번 재서
   되는 칸을 통째로 켜 둡니다(decorSpots) — 동물의 숲이 좋은 이유가
   이것이고, 우리 방은 14x11 이라 한 번 재는 값이 쌉니다.

   막히는지 검사 —
     bake(m) 이 m.solid 를 통째로 새로 만드므로(확인함: 함수 첫 줄이
     new Uint8Array), 후보를 props 에 넣고 굽고 재 보고 아니면 되돌리면
     됩니다. 판정 규칙을 두 벌 쓰지 않는 것이 요점입니다 — 걸을 수 있나
     없나를 여기서 따로 계산하면 언젠가 bake 와 달라집니다.

   저장 —
     ROOM.decor 는 [{ id, x, y }] 납작한 배열입니다. 나중에 서버로 갈 때
     그대로 (room_id, item_id, x, y) 한 줄씩이 됩니다.
   ================================================================== */

const DORM_SPAWN = { x: 7, y: 8 };          // 문으로 들어오면 서는 자리
/* 놓을 자리 표시와 서랍이 같은 색을 씁니다 — CSS 의 --mint 와 같은 값
   입니다. 캔버스에서는 CSS 변수를 못 읽으므로 여기 한 번 더 적습니다. */
const MINT = '#40DDCA';
const DECOR = {
  drawer: false,  // 오른쪽 서랍이 열려 있나
  tab: 'all',     // 서랍 칸막이 — all · set · box
  it: null,       // 끌고 있는 상품
  x: 0, y: 0,     // 유령 왼쪽 위 칸
  gx: 0, gy: 0,   // 잡은 지점 — 커서가 물건 어디를 쥐고 있나
  back: null,     // 원래 자리. 거절하면 여기로 되돌립니다
  ok: false, why: '',
  came: false,    // 끄는 동안 커서가 방 안까지 왔나
  spots: null,    // 놓을 수 있는 칸 (Uint8Array, 지도와 같은 크기)
  byKey: false,   // 자판으로 끌고 있나 — 안내 문구가 달라집니다
  hold: 0,        // 거절 문구를 남겨 둘 시각
};

const decorEntry = (id) => (ROOM.decor || []).find((d) => d.id === id) || null;
const decorProp = (d) => ({ kind: SHOP_BY_ID[d.id].prop, x: d.x, y: d.y });

/** ROOM.decor(또는 넘긴 목록)를 지도에 얹고 다시 굽습니다. */
function applyDecor(list) {
  const m = DORM;
  m.props = m.baseProps.concat((list || ROOM.decor).map(decorProp));
  bake(m);
}
/* 가구 없이 한 번 구워 "원래 방" 의 막힌 칸을 떠 둡니다. 놓을 자리를
   고를 때 이걸 봅니다 — 지금 solid 를 보면 이미 놓은 가구 위에 또
   놓이거나, 옮기는 중인 자기 자신 때문에 자기 자리에 못 돌아옵니다. */
applyDecor([]);
DORM.baseSolid = DORM.solid.slice();
/* 방 배치를 바꾸면 예전에 놓아 둔 가구가 새 가구 **안**에 들어갑니다.
   그대로 두면 겹쳐 그려지고 방이 막힐 수도 있으므로, 겹치는 것만
   보관함으로 되돌립니다 — 산 것은 그대로 남고 자리만 잃습니다. */
{
  const before = (ROOM.decor || []).length;
  ROOM.decor = (ROOM.decor || []).filter((d) => {
    const q = PROP[SHOP_BY_ID[d.id].prop];
    for (let j = 0; j < q.h; j++) for (let i = 0; i < q.w; i++) {
      if (!inMap(DORM, d.x + i, d.y + j)) return false;
      if (DORM.baseSolid[at(DORM, d.x + i, d.y + j)]) return false;
    }
    return true;
  });
  if (ROOM.decor.length !== before) saveRoom();
}
applyDecor();

/** 가구가 덮는 칸들 */
function decorTiles(it, x, y) {
  const d = PROP[it.prop], out = [];
  for (let j = 0; j < d.h; j++) for (let i = 0; i < d.w; i++) out.push({ x: x + i, y: y + j });
  return out;
}

/** 방이 통째로 이어져 있는지. 문·초인종·안내까지 걸어서 닿아야 합니다. */
function dormConnected() {
  const m = DORM;
  const seen = new Uint8Array(m.w * m.h);
  const start = at(m, DORM_SPAWN.x, DORM_SPAWN.y);
  if (m.solid[start]) return false;                 // 들어오는 자리부터 막혔습니다
  const q = [start];
  seen[start] = 1;
  let n = 1;
  while (q.length) {
    const i = q.pop(), x = i % m.w, y = (i / m.w) | 0;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy;
      if (!inMap(m, nx, ny)) continue;
      const j = at(m, nx, ny);
      if (seen[j] || m.solid[j]) continue;
      seen[j] = 1; n++; q.push(j);
    }
  }
  /* 걸을 수 있는 칸이 하나라도 남으면 주머니가 생긴 것입니다 —
     화면으로는 안 보이고 걸어 들어가야만 알 수 있는 구멍입니다. */
  let free = 0;
  for (let i = 0; i < m.solid.length; i++) if (!m.solid[i]) free++;
  if (n !== free) return false;
  /* 물건은 한 칸 옆에서 만집니다(findNearby). 옆이 다 막히면 창이
     영영 안 열립니다. */
  for (const t of m.things || []) {
    const d = PROP[m.props.find((q2) => q2.x === t.x && q2.y === t.y)?.kind];
    const tw = d ? d.w : 1, th = d ? d.h : 1;
    let reach = false;
    for (let y = t.y - 1; y <= t.y + th && !reach; y++)
      for (let x = t.x - 1; x <= t.x + tw && !reach; x++)
        if (inMap(m, x, y) && seen[at(m, x, y)]) reach = true;
    if (!reach) return false;
  }
  return true;
}

/** 여기 놓아도 되나. 되면 ok, 안 되면 왜 안 되는지까지 돌려줍니다. */
function decorCheck(it, x, y) {
  const m = DORM, d = PROP[it.prop];
  if (x < 0 || y < 0 || x + d.w > m.w || y + d.h > m.h) return { ok: false, why: '방 밖입니다' };
  const tiles = decorTiles(it, x, y);

  /* 원래 방에서 걸을 수 있던 칸에만 놓습니다. 벽·붙박이 가구 위에
     겹쳐 놓으면 그림이 서로를 자릅니다. */
  for (const t of tiles)
    if (m.baseSolid[at(m, t.x, t.y)]) return { ok: false, why: '벽이나 원래 있던 가구 자리입니다' };

  /* 문간. bake 가 포탈 칸을 무조건 뚫으므로, 여기서 안 막으면 문 위에
     옷장을 놓고 그 옷장을 뚫고 지나가게 됩니다. */
  for (const po of m.portals)
    for (const t of tiles)
      if (t.x >= po.x && t.x < po.x + po.w && t.y >= po.y && t.y < po.y + po.h)
        return { ok: false, why: '문 앞은 비워 둡니다' };

  /* 초인종·안내 같은 물건 칸 */
  for (const t of m.things || [])
    if (tiles.some((q) => q.x === t.x && q.y === t.y)) return { ok: false, why: t.name + ' 자리입니다' };

  /* 이미 놓은 가구 (옮기는 중인 자기 자신은 뺍니다) */
  for (const o of ROOM.decor) {
    if (o.id === it.id) continue;
    const od = PROP[SHOP_BY_ID[o.id].prop];
    for (const t of tiles)
      if (t.x >= o.x && t.x < o.x + od.w && t.y >= o.y && t.y < o.y + od.h)
        return { ok: false, why: SHOP_BY_ID[o.id].name + ' 과 겹칩니다' };
  }

  /* 사람 발밑. 자기 발 아래 옷장을 놓으면 그 자리에서 못 빠져나옵니다.
     배치 모드에서는 걸을 수 없으므로 비키는 법까지 적어 줍니다 —
     "안 됩니다" 만 뜨면 왜 안 되는지 알아도 어떻게 해야 할지 모릅니다. */
  if (zoneId === 'dorm') {
    const ptx = Math.floor(player.x / T), pty = Math.floor((player.y - 1) / T);
    if (tiles.some((t) => t.x === ptx && t.y === pty) && PROP[it.prop].c.some((r) => r.some(Boolean)))
      return { ok: false, why: '내가 서 있어요 · Esc 로 나가 비켜 주세요' };
  }

  /* 마지막으로 실제로 놓아 보고 방이 이어져 있는지 봅니다. 앞의 규칙을
     다 지켜도 통로 한 칸을 막으면 방이 두 조각이 납니다. */
  const trial = ROOM.decor.filter((o) => o.id !== it.id).concat([{ id: it.id, x, y }]);
  applyDecor(trial);
  const fine = dormConnected();
  applyDecor();                                     // 무조건 되돌립니다
  if (!fine) return { ok: false, why: '여기 놓으면 방이 막힙니다' };
  return { ok: true, why: '' };
}

/* ---- 놓을 수 있는 칸 ----
   끌기 시작할 때 한 번만 잽니다. 프레임마다 다시 재면 방 하나에
   decorCheck 를 154번 부르는 일을 초당 60번 하게 됩니다.
   끄는 동안에는 걷기를 막으므로(사람 자리도 판정에 들어갑니다) 답이
   바뀌지 않습니다. */
function decorSpots(it) {
  const m = DORM, d = PROP[it.prop];
  const out = new Uint8Array(m.w * m.h);
  for (let y = 0; y + d.h <= m.h; y++)
    for (let x = 0; x + d.w <= m.w; x++)
      if (decorCheck(it, x, y).ok) out[at(m, x, y)] = 1;
  return out;
}

/* ---- 끌기 ---- */
/** 끌기를 시작합니다. gx gy 는 물건의 어디를 쥐었는지 — 이미 놓인 것을
    집어 들 때 그림이 커서로 튀지 않게 하는 값입니다. */
function decorPick(id, gx, gy, byKey) {
  const it = SHOP_BY_ID[id];
  if (!isFurniture(it) || !owns(id) || zoneId !== 'dorm' || DECOR.it) return false;
  if (player.sitting) stand();
  const had = decorEntry(id);
  const d = PROP[it.prop];
  /* 집어 든 순간 지도에서 뺍니다. 남겨 두면 자기 자신 위에 유령이 겹쳐
     보이고, 되는 칸을 셀 때도 제 그림자를 밟습니다. */
  DECOR.back = had ? { x: had.x, y: had.y } : null;
  if (had) {
    ROOM.decor = ROOM.decor.filter((q) => q.id !== id);
    applyDecor();
  }
  DECOR.it = it;
  DECOR.byKey = !!byKey;
  DECOR.gx = Math.max(0, Math.min(d.w - 1, gx | 0));
  DECOR.gy = Math.max(0, Math.min(d.h - 1, gy | 0));
  /* 시작 자리 — 놓여 있던 것은 그 자리, 새 것은 사람 앞입니다. */
  const px0 = Math.floor(player.x / T), py0 = Math.floor((player.y - 1) / T);
  DECOR.x = had ? had.x : px0 - DECOR.gx;
  DECOR.y = had ? had.y : py0 - DECOR.gy;
  DECOR.spots = decorSpots(it);
  DECOR.came = false;
  keys.clear();                                     // 걷다가 집어도 안 미끄러집니다
  pathClear();                                      // 클릭으로 가던 길도 같은 이유로 놓습니다
  decorMoveTo(DECOR.x, DECOR.y);
  paintDrawer();
  return true;
}

/** 유령을 이 칸으로. 지도 밖으로는 안 나갑니다. */
function decorMoveTo(x, y) {
  if (!DECOR.it) return;
  const d = PROP[DECOR.it.prop];
  DECOR.x = Math.max(0, Math.min(DORM.w - d.w, x));
  DECOR.y = Math.max(0, Math.min(DORM.h - d.h, y));
  const r = decorCheck(DECOR.it, DECOR.x, DECOR.y);
  DECOR.ok = r.ok; DECOR.why = r.why;
  decorBar();
}

/** 커서가 가리키는 칸으로. 화면 좌표를 월드 칸으로 옮깁니다.
    방 밖(서랍 위)에 있는 동안은 아무것도 안 합니다 — 서랍에서 누르기만
    하고 떼는 것은 '잘못 놓았다' 가 아니라 '아직 안 끌었다' 입니다. */
function decorMoveToPointer(e) {
  const r = cv.getBoundingClientRect();
  if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) return;
  DECOR.came = true;
  const tx = Math.floor(((e.clientX - r.left) / SCALE + camX) / T);
  const ty = Math.floor(((e.clientY - r.top) / SCALE + camY) / T);
  decorMoveTo(tx - DECOR.gx, ty - DECOR.gy);
}

/** 놓습니다. 안 되면 왜 안 되는지를 남기고 원래 자리로 되돌립니다 —
    조용히 제자리로 돌아가면 "왜 안 놓였지" 만 남습니다. */
function decorDrop() {
  if (!DECOR.it) return;
  if (!DECOR.ok) {
    SFX.deny && SFX.deny();
    const why = DECOR.why;
    decorCancel();
    decorBar(why, true);
    return;
  }
  const it = DECOR.it;
  ROOM.decor = ROOM.decor.filter((d) => d.id !== it.id);
  ROOM.decor.push({ id: it.id, x: DECOR.x, y: DECOR.y });
  saveRoom();
  pushDecor();
  applyDecor();
  /* 'once:decorate' 를 쓰지 않습니다 — 그 열쇠는 openPanel('settings') 가
     이미 씁니다(마이페이지를 열면 '첫 꾸미기' 가 들어옵니다). 같이 쓰면
     마이페이지를 먼저 연 사람은 정작 가구를 놓고 아무것도 못 받습니다. */
  award('once:roomDecor', '첫 방 꾸미기');
  SFX.chair && SFX.chair(false);
  decorClear();
  decorBar(it.name + ' 놓았어요', false);
  paintDrawer();
}

/** 집어 든 것을 원래 자리로 돌려놓고 끌기를 끝냅니다. */
function decorCancel() {
  if (!DECOR.it) return;
  if (DECOR.back) {
    ROOM.decor.push({ id: DECOR.it.id, x: DECOR.back.x, y: DECOR.back.y });
    applyDecor();
  }
  decorClear();
  paintDrawer();
}

function decorClear() {
  DECOR.it = null; DECOR.back = null; DECOR.spots = null;
  DECOR.byKey = false; DECOR.ok = false; DECOR.why = '';
  keys.clear();
}

/** 보관함으로. 우클릭이 부르는 길입니다. */
function decorTake(id) {
  const had = decorEntry(id);
  if (!had) return;
  ROOM.decor = ROOM.decor.filter((d) => d.id !== id);
  saveRoom();
  pushDecor();
  applyDecor();
  decorBar((SHOP_BY_ID[id] || {}).name + ' 치웠어요', false);
  paintDrawer();
}

/** 이 칸을 덮고 있는, 내가 놓은 가구. 우클릭·집어 들기가 씁니다. */
function decorAt(tx, ty) {
  for (const o of ROOM.decor) {
    const d = PROP[SHOP_BY_ID[o.id].prop];
    if (tx >= o.x && tx < o.x + d.w && ty >= o.y && ty < o.y + d.h) return o;
  }
  return null;
}
/** 화면 좌표가 가리키는 월드 칸 */
function tileAtPointer(e) {
  const r = cv.getBoundingClientRect();
  return { x: Math.floor(((e.clientX - r.left) / SCALE + camX) / T),
           y: Math.floor(((e.clientY - r.top) / SCALE + camY) / T) };
}

/* 위쪽 안내줄. 끄는 동안에는 지금 놓을 수 있는지를, 놓거나 거절된
   뒤에는 그 결과를 적습니다 — 거절 이유를 안 적으면 물건이 제자리로
   돌아간 것만 보이고 왜인지는 안 남습니다. */
function decorBar(msg, bad) {
  const el = document.getElementById('decor-bar');
  if (!el) return;
  if (msg !== undefined) {
    /* 끄는 중이 아닐 때 뜬 글은 잠깐 남깁니다. 바로 지우면 놓자마자
       사라져서 읽을 시간이 없습니다. */
    DECOR.hold = Date.now() + 2600;
    el.querySelector('b').textContent = msg;
    el.querySelector('u').textContent = '';
    el.querySelector('em').textContent = '';
    el.classList.toggle('bad', !!bad);
    el.classList.add('on');
    clearTimeout(decorBar.timer);
    decorBar.timer = setTimeout(() => { if (!DECOR.it) el.classList.remove('on'); }, 2600);
    return;
  }
  if (!DECOR.it) { if (Date.now() > DECOR.hold) el.classList.remove('on'); return; }
  el.classList.add('on');
  el.querySelector('b').textContent = DECOR.it.name;
  el.querySelector('u').textContent = DECOR.ok ? '여기 놓을 수 있어요' : DECOR.why;
  el.querySelector('em').textContent = DECOR.byKey
    ? '방향키로 옮기고 · Enter 놓기 · Esc 취소'
    : '놓을 자리에서 손을 떼세요 · Esc 취소';
  el.classList.toggle('bad', !DECOR.ok);
}

/* ==================================================================
   가구 서랍

   동물의 숲 수납 서랍을 우리 격자로 옮긴 것입니다. 창이 아니라 오른쪽에
   붙는 서랍인 이유는 §방 꾸미기 머리말에 적었습니다 — 열어 둔 채로
   방을 걸어 다닐 수 있어야 합니다.
   ================================================================== */
const furnEl = document.getElementById('furn');
const furnTabsEl = document.getElementById('furn-tabs');
const furnGridEl = document.getElementById('furn-grid');
const furnHintEl = document.getElementById('furn-hint');
const furnPillEl = document.getElementById('furn-pill');

/* 칸막이 셋. 동물의 숲은 여기가 가구 종류인데 우리는 가구가 한 종류라
   나눌 것이 없어서, 지금 어디 있는지로 나눕니다. */
const FURN_TABS = [
  { id: 'all', name: '전체' },
  { id: 'set', name: '놓은 것' },
  { id: 'box', name: '보관함' },
];

function decorDrawer(on) {
  if (on && zoneId !== 'dorm') return;
  DECOR.drawer = !!on;
  if (!DECOR.drawer && DECOR.it) decorCancel();
  furnEl.classList.toggle('on', DECOR.drawer);
  furnPillEl.classList.remove('on');
  if (DECOR.drawer) { closePanel(); paintDrawer(); }
}

function paintDrawer() {
  if (!DECOR.drawer) return;
  const mine = SHOP.filter((i) => isFurniture(i) && owns(i.id));
  const set = new Set((ROOM.decor || []).map((d) => d.id));
  /* role 을 붙이는 이유 — aria-selected 는 tab 에만 뜻이 있습니다.
     역할 없이 붙이면 화면 낭독기가 무시하거나 잘못 읽습니다. */
  furnTabsEl.setAttribute('role', 'tablist');
  furnTabsEl.innerHTML = FURN_TABS
    .map((t) => `<button type="button" role="tab" data-tab="${t.id}" aria-selected="${t.id === DECOR.tab}">${t.name}</button>`)
    .join('');
  const list = mine.filter((i) =>
    DECOR.tab === 'set' ? set.has(i.id) : DECOR.tab === 'box' ? !set.has(i.id) : true);
  furnGridEl.innerHTML = list.length
    ? list.map((it) => {
        const cls = 'cell' + (set.has(it.id) ? ' set' : '')
                  + (DECOR.it && DECOR.it.id === it.id ? ' dragging' : '');
        return `<button type="button" class="${cls}" data-furn="${it.id}"
          aria-label="${esc(it.name)}${set.has(it.id) ? ' · 놓여 있음' : ''}">
          <canvas class="thumb furn" data-item="${it.id}" width="48" height="48"></canvas></button>`;
      }).join('')
    : `<p class="empty">${mine.length
        ? '이 칸은 비어 있어요.'
        : '아직 가진 가구가 없어요.<br><b>동아리 상점</b>의 가구 가게에서 살 수 있어요.'}</p>`;
  for (const c of furnGridEl.querySelectorAll('canvas[data-item]')) {
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    g.clearRect(0, 0, c.width, c.height);
    drawFurnThumb(g, c.width, c.height, PROP[SHOP_BY_ID[c.dataset.item].prop]);
  }
  furnHintEl.innerHTML = '끌어서 놓기 · 놓은 것도 다시 끌면 옮겨져요<br>'
    + '<b>우클릭</b>으로 치우기 · 자판만 쓸 때는 <b>Enter</b>';
}

/** 이름표. 동물의 숲의 그 알약입니다 — 칸 위에 뜨고 칸을 안 가립니다. */
function furnPill(cell) {
  if (!cell) { furnPillEl.classList.remove('on'); return; }
  const it = SHOP_BY_ID[cell.dataset.furn];
  if (!it) return;
  const placed = !!decorEntry(it.id);
  furnPillEl.textContent = it.name + (placed ? ' · 놓임' : '');
  furnPillEl.classList.add('on');
  const r = cell.getBoundingClientRect();
  const w = furnPillEl.offsetWidth;
  furnPillEl.style.left = Math.round(Math.max(8, r.left + r.width / 2 - w / 2)) + 'px';
  furnPillEl.style.top = Math.round(r.top - furnPillEl.offsetHeight - 7) + 'px';
}

furnEl.addEventListener('pointerdown', (e) => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { DECOR.tab = tab.dataset.tab; paintDrawer(); return; }
  const cell = e.target.closest('[data-furn]');
  if (!cell) return;
  /* 오른쪽 단추는 치우기입니다. 방에서 우클릭하는 것과 같은 일이라
     같은 손버릇으로 됩니다. */
  if (e.button === 2) { e.preventDefault(); decorTake(cell.dataset.furn); return; }
  if (e.button !== 0) return;
  e.preventDefault();
  const d = PROP[SHOP_BY_ID[cell.dataset.furn].prop];
  /* 서랍에서 꺼낸 것은 가운데를 쥔 것으로 칩니다 — 어디를 눌렀는지가
     아니라 어디에 놓을지가 관심입니다. */
  decorPick(cell.dataset.furn, (d.w - 1) >> 1, (d.h - 1) >> 1, false);
  furnPillEl.classList.remove('on');
});
furnEl.addEventListener('contextmenu', (e) => {
  if (e.target.closest('[data-furn]')) e.preventDefault();
});
furnEl.addEventListener('pointermove', (e) => {
  if (DECOR.it) return;
  furnPill(e.target.closest('[data-furn]'));
});
furnEl.addEventListener('pointerleave', () => furnPill(null));
furnEl.addEventListener('focusin', (e) => furnPill(e.target.closest('[data-furn]')));
furnEl.addEventListener('focusout', () => furnPill(null));
/* 자판만 쓰는 길 — Enter 로 집어 들면 그 다음은 마우스와 같은 드래그라,
   방향키가 커서 노릇을 합니다(keydown). */
furnEl.addEventListener('keydown', (e) => {
  const cell = e.target.closest('[data-furn]');
  if (!cell) return;
  if (e.key === 'Enter' || e.key === ' ') {
    /* 여기서 전파를 끊습니다. 안 끊으면 같은 keydown 이 window 까지 올라가
       DECOR.it 가 방금 생겼다는 이유로 곧바로 '놓기' 가 됩니다 —
       집자마자 제자리에 떨어집니다. */
    e.preventDefault(); e.stopPropagation();
    const d = PROP[SHOP_BY_ID[cell.dataset.furn].prop];
    decorPick(cell.dataset.furn, (d.w - 1) >> 1, (d.h - 1) >> 1, true);
  }
  if (e.key === 'Delete' || e.key === 'Backspace') {
    e.preventDefault(); e.stopPropagation(); decorTake(cell.dataset.furn);
  }
});
document.getElementById('furn-close').addEventListener('click', () => decorDrawer(false));

/* ---- 방 안에서 직접 집기 ----
   서랍을 거치지 않고 놓여 있는 가구를 바로 끌 수 있어야 합니다. 서랍에서
   찾아 누르는 것보다 눈에 보이는 것을 잡는 편이 짧습니다. */
cv.addEventListener('pointerdown', (e) => {
  if (e.button !== 0 || zoneId !== 'dorm' || panelOpen || MINI.on || DECOR.it) return;
  const t = tileAtPointer(e);
  const o = decorAt(t.x, t.y);
  if (!o) return;
  e.preventDefault();
  decorPick(o.id, t.x - o.x, t.y - o.y, false);
});
cv.addEventListener('contextmenu', (e) => {
  if (zoneId !== 'dorm') return;
  e.preventDefault();
  if (DECOR.it) { decorCancel(); return; }
  const t = tileAtPointer(e);
  const o = decorAt(t.x, t.y);
  if (o) decorTake(o.id);
});
window.addEventListener('pointermove', (e) => {
  if (!DECOR.it || DECOR.byKey) return;
  decorMoveToPointer(e);
});
window.addEventListener('pointerup', (e) => {
  if (!DECOR.it || DECOR.byKey || e.button !== 0) return;
  decorMoveToPointer(e);
  /* 방까지 끌고 오지도 않고 뗐으면 조용히 되돌립니다. 여기서 거절
     문구를 띄우면 서랍을 잘못 눌렀을 뿐인데 야단맞은 것이 됩니다. */
  if (!DECOR.came) { decorCancel(); return; }
  decorDrop();
});
/* 창 밖으로 끌고 나갔다 놓는 경우. 안 받으면 물건이 커서에 붙은 채로
   남습니다. */
window.addEventListener('pointercancel', () => { if (DECOR.it && !DECOR.byKey) decorCancel(); });

/* ---- 스프라이트 한 장씩 — 다 뜨면 열린 상점을 다시 그립니다 ---- */
const ITEM_IMG = {};
let itemsPending = 0;
function loadItemImg(path) {
  if (ITEM_IMG[path]) return ITEM_IMG[path];
  const img = new Image();
  itemsPending++;
  /* 그림이 늦게 오면 그 전에 구워 둔 시트는 '깎기 전' 판입니다. 구운 것을
     버려야 다음 프레임에 제대로 다시 굽습니다 — 안 그러면 종 실루엣에 안 맞는
     소매가 캐시에 눌러앉아 새로고침 전까지 그대로 남습니다. */
  img.onload = () => { invalidateDressed(); if (--itemsPending === 0) repaintOpenPanel(); };
  img.onerror = () => { itemsPending--; };            // 그림이 없으면 색 블록으로 물러납니다
  img.src = ITEM_BASE + path;
  ITEM_IMG[path] = img;
  return img;
}
const itemReady = (img) => !!img && img.complete && img.naturalWidth > 0;

const MANNEQUIN = loadItemImg('_test/mannequin.png');

/* ==================================================================
   캐릭터 — 32x48 시트

   월드 타일이 32px 이므로 캐릭터는 가로 한 칸 세로 한 칸 반을 차지합니다.
   젭(1.5x2)과 스타듀(1x2) 사이이고, 타일 격자와도 어긋나지 않습니다.
   그림은 한 픽셀도 안 건드렸습니다 — 타일 쪽을 16 에서 32 로 올렸습니다.

   시트 한 장에 right / up / left / down 네 프레임이 가로로 붙어 있고,
   아이템(assets/items)과 프레임 순서가 같습니다 — 순서가 다르면 옷만
   반대쪽을 보게 됩니다.

   발바닥은 프레임 안에서 y45 입니다(y46-47 은 예전 바닥 그림자 자리로
   비워 둡니다). 그래서 그릴 때 player.y 에서 45 를 빼고 얹습니다.
   ================================================================== */
const CHAR_W = 32, CHAR_H = 48;
/* sitSquash 는 이 판본에 이미 있습니다(위 캐릭터 상태 쪽). 여기서 다시
   선언하면 스크립트가 통째로 안 돕니다. */
const CHAR_GROUND_Y = 45;                       // 프레임 안에서 발바닥이 닿는 줄
const CHAR_BASE_PATH = 'assets/characters/';

/* 종마다 다른 것은 셋뿐입니다.
     line  — 테두리 색. 아이템 테두리(#2b2438)를 이 색으로 바꿔 그립니다.
             안 바꾸면 머리·다리는 종 색 테두리인데 옷만 검은 테두리가 되어
             이음매가 보입니다.
     hatDy — 정수리 높이 차이. 모자를 이만큼 올리거나 내립니다.
     eyeDy — 눈높이 차이. 안경이 씁니다.
   숫자는 시안 8장을 32x48 격자에서 직접 재서 나온 값입니다. */
const CHAR_SPECIES = {
  '거북이':   { slug: 'turtle',   line: '#142814', hatDy: 0,  eyeDy: 0 },
  '기린':     { slug: 'giraffe',  line: '#82461e', hatDy: 0,  eyeDy: 0 },
  '펭귄':     { slug: 'penguin',  line: '#1a1a24', hatDy: -1, eyeDy: 0 },
  '햄스터':   { slug: 'hamster',  line: '#6b3d18', hatDy: -1, eyeDy: 0 },
  /* 개구리는 눈이 머리 꼭대기(y10-14)라 모자가 눈을 덮습니다. 4방향 x 모자
     석 장을 재 보면 0 은 눈 71px 중 45~59px 만 남고, -2 는 71px 전부
     남으면서 모자 밑에 빈 줄도 안 생깁니다(-3 은 모자가 뜹니다).
     학사모만 판 모서리가 머리 밖으로 나오는데, 학사모는 원래 그런 모양입니다. */
  '개구리':   { slug: 'frog',     line: '#1e5a1e', hatDy: -2, eyeDy: -4 },
  '고슴도치': { slug: 'hedgehog', line: '#28140a', hatDy: -2, eyeDy: 0 },
  '알파카':   { slug: 'alpaca',   line: '#785a46', hatDy: -1, eyeDy: 0 },
  '백조':     { slug: 'swan',     line: '#6e6e78', hatDy: 0,  eyeDy: 0 },
};
const CHAR_IMG = {};
for (const sp of Object.values(CHAR_SPECIES)) {
  const img = new Image();
  itemsPending++;
  img.onload = () => { dressedCache = null; if (--itemsPending === 0) repaintOpenPanel(); };
  img.onerror = () => { itemsPending--; };
  img.src = CHAR_BASE_PATH + sp.slug + '.png';
  CHAR_IMG[sp.slug] = img;
}
const speciesOf = (name) => CHAR_SPECIES[name] || CHAR_SPECIES['거북이'];

/* 아이템 테두리를 종 테두리 색으로 바꾼 사본. 종·아이템 쌍마다 한 번만 굽습니다.
   file:// 로 열면 픽셀을 읽을 수 없어(보안 제약) 원본을 그대로 씁니다 —
   색이 조금 어긋날 뿐 그림은 나옵니다. */
const OUTLINE_SRC = [0x2b, 0x24, 0x38];
const tintCache = new Map();
function tintedItem(sheet, line) {
  if (!sheet) return null;
  const key = (sheet.src || sheet.__id || '') + '|' + line;
  if (tintCache.has(key)) return tintCache.get(key);
  let out = sheet;
  try {
    const c = document.createElement('canvas');
    c.width = sheet.width || sheet.naturalWidth; c.height = sheet.height || sheet.naturalHeight;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.imageSmoothingEnabled = false;
    g.drawImage(sheet, 0, 0);
    const d = g.getImageData(0, 0, c.width, c.height);
    const r = parseInt(line.slice(1, 3), 16), gg = parseInt(line.slice(3, 5), 16), b = parseInt(line.slice(5, 7), 16);
    for (let i = 0; i < d.data.length; i += 4) {
      if (d.data[i + 3] === 0) continue;
      if (d.data[i] === OUTLINE_SRC[0] && d.data[i + 1] === OUTLINE_SRC[1] && d.data[i + 2] === OUTLINE_SRC[2]) {
        d.data[i] = r; d.data[i + 1] = gg; d.data[i + 2] = b;
      }
    }
    g.putImageData(d, 0, 0);
    out = c;
  } catch { /* 픽셀을 못 읽으면 원본 그대로 */ }
  tintCache.set(key, out);
  return out;
}

/* 상의·가방은 종마다 몸 실루엣에 맞춰 깎아 둔 판본이 따로 있습니다.
   시안 8종은 어깨 높이가 제각각이라(거북이 y25, 백조 y33) 한 벌을 그대로
   얹으면 소매가 몸 밖으로 튀어나옵니다. */
const FITTED_CATS = { top: 'tops', bag: 'bags' };
function fittedPath(it, slug) {
  const folder = FITTED_CATS[it.cat];
  if (!folder || !it.sprite) return null;
  return 'fitted/' + slug + '/' + it.sprite;
}
/* 과잠은 sprite 가 없고 base+mask 로 그때그때 굽습니다. 그래서 위 fittedPath
   가 null 을 돌려주고, 종별로 깎은 판을 못 탑니다 — 백조·펭귄처럼 몸이 좁은
   종에서 소매만 몸 밖으로 나갑니다. base·mask 도 종별로 깎아 둔 것을 씁니다. */
function fittedRecolor(it, slug) {
  if (!it.recolor || !FITTED_CATS[it.cat]) return null;
  const b = loadItemImg('fitted/' + slug + '/' + it.recolor.base);
  const m = loadItemImg('fitted/' + slug + '/' + it.recolor.mask);
  return itemReady(b) && itemReady(m) ? { base: b, mask: m } : null;
}
function itemSheetFor(it, sp, col, tintMap) {
  if (it.recolor) return varsitySheet(col, sp.slug);
  const chosen = tintOf(it, tintMap);
  if (chosen) {
    const t = tintedSheet(it, chosen, sp.slug);
    if (t) return t;                     // 아직 안 왔으면 아래 원래 색으로 물러납니다
  }
  const fp = fittedPath(it, sp.slug);
  if (fp) {
    const img = loadItemImg(fp);
    if (itemReady(img)) return img;
  }
  return itemSheet(it, col, sp.slug);
}

/** 모자·안경은 머리를 따라 올라갑니다(item-spec §5). 나머지는 몸에 붙습니다. */
/* 상점의 안경 칸은 cat 이 'face' 입니다('glasses' 는 그림 폴더 이름일 뿐).
   여기서 'glasses' 를 보고 있어서 안경은 언제나 followsHead 가 거짓이었고,
   종별 eyeDy 가 한 번도 안 먹었습니다. */
const followsHead = (it) => it.cat === 'hat' || it.cat === 'face';

/* 옷을 입힌 시트 한 장. 종·입은 것·학교색이 그대로면 다시 굽지 않습니다 —
   60fps 로 매 프레임 합성하면 그리는 것보다 합성이 비쌉니다. */
let dressedCache = null, dressedKey = '';
/** 구워 둔 캐릭터 시트를 전부 버립니다. 그림이 늦게 도착했을 때 부릅니다. */
function invalidateDressed() {
  dressedCache = null;
  otherCache.clear();
  varsityCache.clear();
  tintCanvasCache.clear();
}
/* 이미지가 늦게 도착해도 상점 패널을 다시 그리는 호출이 안전하게
   끝나야 합니다. 현재 프로토타입에는 별도의 캔버스 페인터가 없으므로
   해당 함수가 존재할 때만 실행합니다. */
function repaintOpenPanel() {
  if (panelOpen && typeof paintItemCanvases === 'function') paintItemCanvases();
}
function dressedSheet() {
  const sp = speciesOf(ROOM.character);
  const key = sp.slug + '|' + JSON.stringify(ROOM.worn || {}) + '|' + JSON.stringify(ROOM.tint || {}) + '|' + schoolColor();
  if (dressedCache && dressedKey === key) return dressedCache;
  const base = CHAR_IMG[sp.slug];
  if (!itemReady(base)) return null;
  const c = document.createElement('canvas');
  c.width = CHAR_W * 4; c.height = CHAR_H;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.drawImage(base, 0, 0);
  const on = Object.values(ROOM.worn || {}).map((id) => SHOP_BY_ID[id]).filter(Boolean);
  for (const it of on.sort((a, b) => a.z - b.z)) {
    const sheet = tintedItem(itemSheetFor(it, sp, schoolColor()), sp.line);
    if (!sheet) continue;
    g.drawImage(sheet, 0, followsHead(it) ? (it.cat === 'hat' ? sp.hatDy : sp.eyeDy) : 0);
  }
  dressedCache = c; dressedKey = key;
  return c;
}

/* ==================================================================
   자세 — 걷기 네 박자와 앉기를 **구운 시트에서 잘라 만듭니다**

   시트에는 방향마다 그림이 한 장뿐입니다. 그래서 지금까지 걷기는 몸 전체를
   1px 올렸다 내리는 것(bob)이 전부였고, 앉기는 세로로 눌린 것이 전부였습니다.
   팔다리가 안 움직이니 걷는 게 아니라 떠는 것으로 보였습니다.

   시트에 프레임을 더 그리지 않고, **입은 것까지 구운 한 장을 띠로 잘라**
   자세를 만듭니다. 이유가 셋입니다.
     · 아이템 23종이 캐릭터와 프레임을 1:1 로 맞춰 구워져 있습니다. 시트를
       128x48 에서 늘리면 아이템 23종 x 8종 맞춤판을 전부 다시 그려야 하고,
       ITEM_DIR 을 읽는 곳이 여섯 군데입니다.
     · 자른 것이 **옷을 입은 뒤의 그림**이라, 다리를 들면 바지가 같이 들립니다.
       시트를 늘리는 쪽은 옷에도 같은 프레임을 그려 넣어야 합니다.
     · 자세는 종·옷 조합마다 **한 번만** 굽습니다. 그리는 순간에는 여전히
       drawImage 한 번이라 프레임당 비용이 안 늘어납니다.

   대신 한계도 분명합니다 — 없는 픽셀은 못 만듭니다. 팔다리를 1~2px 옮기고
   구부리는 것까지가 이 방법의 천장입니다. 32x48 에서 걷기 한 바퀴가
   대체로 그 정도이긴 합니다.
   ================================================================== */

/** 자세 시트의 줄 번호. 0 서 있기 · 1-4 걷기 네 박자 · 5 앉기 */
const STANCE_ROWS = 6;
const STANCE_SIT = 5;
/* 앉을 때 몸을 이만큼 올립니다. 의자(chairCanvas)는 16눈금으로 그려서
   32px 타일에서 **앉는 면 윗줄이 타일 위에서 12px** 입니다. 발끝이 타일
   바닥(=바닥선)에 있는 채로 그리면 엉덩이가 앉는 면보다 13px 아래라,
   앉은 게 아니라 의자 앞에 선 것으로 보였습니다. */
const SIT_LIFT = 12;
/** 앉은 몸이 서 있는 몸보다 이만큼 짧습니다(무릎에서 접힘).
    바꾼 앉기 자세는 종아리를 안 그리고 발을 무릎 밑에 붙이므로,
    실루엣 바닥이 legTop+LAP+FOOT = legTop+8 입니다. 종마다 legTop 이
    달라 상수로 못 박지 않고, 그리는 쪽에서 sitLift 로 받아 씁니다. */
const SIT_KNEE = 4;

/* 종마다 다리가 시작하는 줄이 다릅니다 — 개구리 y39, 백조 y40, 거북이·기린·
   햄스터·고슴도치·알파카 y41, 펭귄 y42. 한 값으로 밀면 펭귄은 배를 자르고
   개구리는 다리를 반만 듭니다. 그래서 시트에서 직접 잽니다. */
const gaitCache = new Map();
function gaitOf(slug) {
  const hit = gaitCache.get(slug);
  if (hit) return hit;
  const img = CHAR_IMG[slug];
  if (!itemReady(img)) return null;              // 아직 안 왔으면 다음 프레임에 다시
  const c = document.createElement('canvas');
  c.width = CHAR_W * 4; c.height = CHAR_H;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.drawImage(img, 0, 0);
  let px = null;
  try { px = g.getImageData(0, 0, c.width, c.height).data; } catch { px = null; }
  /* file:// 로 열면 픽셀을 못 읽습니다(tintedItem 과 같은 제약). 그때는 여덟
     종의 가운뎃값으로 물러납니다 — 걷기가 조금 뻣뻣해질 뿐 안 깨집니다. */
  const G = { legTop: [41, 41, 41, 41], arm: [[5, 9], [22, 26]] };
  if (px) {
    const on = (x, y) => px[(y * c.width + x) * 4 + 3] > 0;
    for (let d = 0; d < 4; d++) {
      const X = d * CHAR_W;
      for (let y = 36; y <= 44; y++) {
        /* 가랑이가 벌어지는 첫 줄. 가운데(x15·x16)가 비고 양옆에 몸이
           있으면 그 줄부터 다리 둘입니다. */
        const gap = !on(X + 15, y) || !on(X + 16, y);
        let l = false, r = false;
        for (let x = 8; x < 15; x++) if (on(X + x, y)) l = true;
        for (let x = 17; x < 24; x++) if (on(X + x, y)) r = true;
        if (gap && l && r) { G.legTop[d] = y; break; }
      }
    }
    /* 팔은 몸통에서 가장 넓은 줄(y34)의 바깥 네 칸입니다 — item-spec 이
       재 둔 값과 같은 자리이고, 종마다 몸 폭이 달라 여기서 다시 잽니다. */
    let x0 = CHAR_W, x1 = -1;
    for (let x = 0; x < CHAR_W; x++) if (on(3 * CHAR_W + x, 34)) { if (x < x0) x0 = x; x1 = x; }
    if (x1 > x0) G.arm = [[x0, x0 + 4], [x1 - 4, x1]];
  }
  gaitCache.set(slug, G);
  return G;
}

/* 자세 시트는 **구운 시트 한 장에 하나**입니다. WeakMap 이라 옷을 갈아입어
   시트가 새로 구워지면 옛 자세도 같이 버려집니다. */
const stanceCache = new WeakMap();

/**
 * 128 x (48*6) — 방향 넷 x 자세 여섯.
 * 시트가 아직 없거나 종을 못 재면 null. 부르는 쪽은 원래 시트로 물러납니다.
 */
function stanceSheet(sheet, slug) {
  if (!sheet) return null;
  const hit = stanceCache.get(sheet);
  if (hit) return hit;
  const G = gaitOf(slug);
  if (!G) return null;
  const c = document.createElement('canvas');
  c.width = CHAR_W * 4; c.height = CHAR_H * STANCE_ROWS;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  for (let d = 0; d < 4; d++) for (let r = 0; r < STANCE_ROWS; r++) bakeStance(g, sheet, G, d, r);
  stanceCache.set(sheet, c);
  return c;
}

/**
 * 자세 한 칸을 굽습니다.
 *
 * 걷기 네 박자 — 딛기 · 지나기 · 딛기 · 지나기.
 *   딛기(0·2)  두 발 다 바닥. 팔이 가장 크게 벌어지는 순간이라 여기서 앞뒤가
 *              뒤바뀝니다. 옆모습에서는 발끝이 앞뒤로 1px 벌어집니다.
 *   지나기(1·3) 몸이 1px 뜨고 한쪽 다리가 따라 뜹니다. **붙어 있는 다리는
 *              그대로 두고 윗줄만 한 줄 늘여** 발바닥을 y45 에 붙여 둡니다.
 *              이게 없으면 걸을 때마다 두 발이 같이 떠서 뜁니다.
 */
function bakeStance(g, sheet, G, d, row) {
  const ox = d * CHAR_W, oy = row * CHAR_H;
  const blit = (sx, sy, w, h, dx, dy) =>
    g.drawImage(sheet, d * CHAR_W + sx, sy, w, h, ox + dx, oy + dy, w, h);
  const legTop = G.legTop[d];
  const side = d === 0 || d === 2;               // right / left
  const face = d === 0 ? 1 : d === 2 ? -1 : 0;   // 바라보는 쪽
  /* 다리 한 짝. up 은 발이 뜨는 높이, slide 는 발끝이 앞뒤로 밀리는 거리,
     hip 은 몸이 뜬 만큼 엉덩이를 늘일지. */
  const leg = (left, { up = 0, slide = 0, hip = 0, dy = 0, dx = 0 } = {}) => {
    const x = left ? 0 : 16;
    if (slide) {
      /* 발끝만 밉니다. 통째로 밀면 엉덩이가 몸에서 뜯어집니다.
         한 칸 밀린 줄은 **밀기 전 자리에도 한 번 더** 찍습니다. 백조 다리는
         y40-41 이 1px 짜리 막대라, 위아래 줄이 대각선으로만 닿으면 발이
         다리에서 떨어져 나갑니다(덩이 검사에서 백조만 걸렸습니다). */
      let prev = 0;
      for (let y = legTop; y < CHAR_H; y++) {
        const t = (y - legTop) / (CHAR_H - 1 - legTop);
        const s = Math.round(slide * t);
        if (s !== prev) blit(x, y, 16, 1, x + dx + prev, y + dy - up);
        blit(x, y, 16, 1, x + dx + s, y + dy - up);
        prev = s;
      }
    } else {
      blit(x, legTop, 16, CHAR_H - legTop, x + dx, legTop + dy - up);
    }
    for (let k = 1; k <= hip; k++) blit(x, legTop, 16, 1, x + dx, legTop + dy - k);
  };
  /* 팔 한 짝. 앞으로 나온 팔은 1px 올라가고 뒤로 간 팔은 1px 내려갑니다.
     내려갈 때는 어깨가 뜯어지지 않게 윗줄을 한 줄 다시 얹습니다.

     움직이는 것은 **팔뚝과 손(y32-36)뿐**입니다. 어깨(y29-31)까지 같이
     올렸다 내리면 몸 옆선이 통째로 1px 씩 흔들려서, 고슴도치는 가시가,
     백조는 날개 끝이 프레임마다 덜컹거렸습니다. 사람도 어깨보다 손이
     훨씬 많이 흔들립니다. */
  const ARM0 = 32, ARM1 = 37;
  const arm = (i, swing, dy) => {
    const [a, b] = G.arm[i];
    blit(a, ARM0, b - a + 1, ARM1 - ARM0, 0 + a, ARM0 + dy + swing);
    if (swing > 0) blit(a, ARM0, b - a + 1, 1, a, ARM0 + dy);
  };
  /* 팔을 옮기려면 몸통을 팔 빼고 먼저 그려야 합니다 — 통째로 그린 뒤 팔만
     다시 얹으면, 옮기기 전 팔이 밑에 남습니다. */
  const bodyNoArms = (dy) => {
    blit(0, 0, CHAR_W, ARM0, 0, dy);                                   // 어깨 위
    const [l, r] = G.arm;
    blit(l[1] + 1, ARM0, r[0] - l[1] - 1, ARM1 - ARM0, l[1] + 1, ARM0 + dy);  // 팔 사이 몸통
    blit(0, ARM1, CHAR_W, legTop - ARM1, 0, ARM1 + dy);                // 허리
  };

  if (row === STANCE_SIT) {
    /* ---- 앉기 ----
       앞 판은 몸통을 4px 올리고 종아리를 한 칸 벌린 것이 전부였습니다.
       실루엣이 서 있기와 거의 같아서 **의자 앞에 서 있는 것**으로 보였습니다
       (실제로 그 지적을 받았습니다). 다시 짭니다.

       앉은 사람의 앞모습에서 눈에 남는 것은 셋입니다.
         1. 키가 준다      — 다리가 접혀 몸 아래로 들어갑니다
         2. 무릎이 앞으로  — 허벅지가 화면 쪽으로 누워 **넓적한 무릎**이 생깁니다
         3. 발이 무릎 밑   — 종아리는 거의 안 보이고 발끝만 남습니다

       그래서 종아리를 통째로 버리고, 그 자리를 허벅지(엉덩이 줄을 늘인 띠)로
       채운 뒤 발만 그 밑에 붙입니다. 없는 픽셀을 만들지 않는다는 규칙은
       그대로입니다 — 전부 시트에 있는 줄을 옮겨 쓴 것입니다.

       LAP 은 무릎의 두께입니다. 5 를 넘기면 앉은 게 아니라 주저앉은 것이
       되고, 3 아래면 다시 서 있기와 구별이 안 갑니다. */
    const LAP = 4;
    const FOOT = 3;                                   // 발끝 몇 줄을 남길지
    /* 몸통 — 무릎이 접힌 만큼 내려옵니다. **위로 올리지 않습니다.**
       앞 판은 올렸는데, 그러면 앉았을 때 머리가 서 있을 때보다 높아집니다. */
    blit(0, 0, CHAR_W, legTop, 0, 0);
    /* 무릎 — 엉덩이 줄(legTop)을 LAP 만큼 늘여 앞으로 누운 허벅지를 만듭니다.
       옆모습은 앞쪽으로 한 칸씩 밀어 무릎이 나온 것을 보탭니다. */
    for (let k = 0; k < LAP; k++)
      blit(0, legTop, CHAR_W, 1, side ? Math.round(face * (k / 2)) : 0, legTop + k);
    /* 발 — 다리 맨 아랫줄 몇 개만 무릎 바로 밑에 붙입니다. 양옆으로 벌려
       두 짝으로 읽히게 하고, 옆모습은 벌릴 곳이 없어 앞으로 냅니다. */
    for (const left of [true, false]) {
      const x = left ? 0 : 16;
      const dx = side ? face * 2 : (left ? -1 : 1);
      for (let k = 0; k < FOOT; k++) {
        const dy = legTop + LAP + k;
        /* 칸 밖으로 새면 아틀라스의 **다음 줄**에 그려집니다. legTop 이
           42 인 펭귄은 legTop+LAP+FOOT 가 50 이라 실제로 넘습니다. */
        if (dy >= CHAR_H) break;
        blit(x, CHAR_H - FOOT + k, 16, 1, x + dx, dy);
      }
    }
  } else if (row === 0) {
    blit(0, 0, CHAR_W, CHAR_H, 0, 0);
  } else {
    const p = row - 1;                 // 0 딛기 · 1 지나기 · 2 딛기 · 3 지나기
    const step = p === 1 || p === 3;
    const dy = step ? -1 : 0;          // 지나는 박자에 몸이 1px 뜹니다
    const lead = p < 2 ? 1 : -1;       // 딛기 두 박자의 앞뒤가 반대입니다
    bodyNoArms(dy);
    arm(0, step ? 0 : -lead, dy);
    arm(1, step ? 0 : lead, dy);
    if (step) {
      /* 지나기 — 든 다리는 몸을 따라 1px 올라가고(그래서 발이 바닥에서
         떨어지고), 딛고 있는 다리는 제자리에 두고 엉덩이만 한 줄 늘입니다.
         둘 다 올리면 두 발이 같이 떠서 걷기가 아니라 뜀뛰기가 됩니다. */
      const liftLeft = p === 1;
      leg(liftLeft, { dy });
      leg(!liftLeft, { hip: 1 });
    } else {
      /* 딛기 — 두 발 다 바닥에 있고 앞뒤로 한 칸씩 벌어집니다. 발끝만
         밀리므로 바닥선(y45)은 그대로입니다. 정면·뒷모습에는 앞뒤가
         없어서, 벌어지는 것이 곧 보폭으로 읽힙니다. */
      leg(true, { slide: -lead });
      leg(false, { slide: lead });
    }
  }

  /* 옆모습은 **먼 쪽 팔다리를 한 톤 죽입니다**. 안 하면 정면 몸에 눈만 옮긴
     그림이라 팔 둘이 나란히 보입니다. 시트가 아니라 여기서 하는 이유 —
     옷을 입고 구운 뒤라야 소매·바짓단도 같이 어두워집니다. */
  if (side) {
    const [l, r] = G.arm;
    const far = face > 0 ? l : r;      // 뒤쪽 = 먼 쪽
    const sit = row === STANCE_SIT;
    const armDy = sit ? -SIT_KNEE : 0, legDy = 0;
    g.save();
    g.globalCompositeOperation = 'source-atop';
    g.fillStyle = 'rgba(20,16,32,.26)';
    g.fillRect(ox + far[0], oy + ARM0 - 2 + armDy, far[1] - far[0] + 1, ARM1 - ARM0 + 2);
    g.fillRect(ox + (face > 0 ? 0 : 16), oy + legTop - 1 + legDy, 16, CHAR_H - legTop + 1);
    g.restore();
  }
}

/* ==================================================================
   다른 사람도 같은 그림으로 — multiplayer.js 가 쓰는 창구

   내 캐릭터만 32x48 이면 화면에 두 크기가 섞입니다. 남을 그리는 쪽은
   파일이 달라서(multiplayer.js) 여기 전역 하나만 열어 둡니다.

   sheetFor(종 이름, 입은 것) -> 128x48 캔버스 (right/up/left/down)
     · 종·입은 것이 같으면 구운 것을 돌려줍니다. 사람이 여럿이어도
       종류만큼만 굽습니다 — 사람마다 구우면 100명이 100장이 됩니다.
     · 시트가 아직 안 왔으면 null. 부르는 쪽이 예전 그림으로 물러나면 됩니다.
   ================================================================== */
const otherCache = new Map();
window.GIRIN_CHAR = {
  W: CHAR_W, H: CHAR_H, groundY: CHAR_GROUND_Y,
  dirIndex: ITEM_DIR,                       // { right:0, up:1, left:2, down:3 }
  species: CHAR_SPECIES,
  names: Object.keys(CHAR_SPECIES),
  /** 앉으면 발 위치보다 이만큼 위에 그립니다 — 이름표·시계도 같이 올라갑니다. */
  /* 앉은 실루엣 바닥이 대체로 legTop+7(≈48) 이라 서 있을 때(groundY 45)보다
     3px 아래입니다. 그 3 을 먼저 되돌리고, 의자 앉는 면(타일 바닥에서 12px)
     까지 올립니다. 12-3 = 9. 앞 판(8)보다 1px 높습니다. */
  sitLift: SIT_LIFT - 3,
  /** 내 캐릭터 — 입은 것이 바뀌면 알아서 다시 굽습니다. */
  mine: () => dressedSheet(),
  /**
   * 자세 한 칸이 어디 있는지 — 나도 남도 NPC 도 이 창구 하나만 씁니다.
   *   sheet  sheetFor / mine 이 준 128x48 시트
   *   slug   종 이름표(turtle …). 다리 시작 줄을 종마다 재야 해서 필요합니다
   *   dir    'right' | 'up' | 'left' | 'down'
   *   p      { sitting, moving, frame } — frame 은 반 보폭마다 1 씩 오르는 수
   * 돌려주는 lift 는 **발 위치보다 더 올려 그려야 하는 픽셀**입니다. 앉을 때만
   * 0 이 아니고, 그 값이 곧 의자 앉는 면의 높이입니다.
   */
  pose(sheet, species, dir, p) {
    const d = ITEM_DIR[dir] ?? ITEM_DIR.down;
    /* 종은 이름표('거북이')로도 이름('turtle')으로도 받습니다 — 부르는 쪽마다
       들고 있는 것이 달라서, 여기서 한 번에 풉니다. */
    const st = stanceSheet(sheet, CHAR_SPECIES[species] ? CHAR_SPECIES[species].slug : species);
    if (!st) return { img: sheet, sx: d * CHAR_W, sy: 0, lift: 0 };
    /* 앉은 높이는 sitLift 한 곳에서만 정합니다. 여기와 GIRIN_CHAR.sitLift 가
       따로 계산하고 있어서, 한쪽만 고치면 남의 캐릭터와 내 캐릭터가
       다른 높이로 앉습니다. */
    if (p && p.sitting) return { img: st, sx: d * CHAR_W, sy: STANCE_SIT * CHAR_H, lift: SIT_LIFT - 3 };
    /* 걷기는 반 보폭마다 한 박자입니다 — 네 박자에 두 걸음, 사람이 걷는 것과
       같습니다(player.anim 이 이미 그 눈금입니다). */
    const row = p && p.moving ? 1 + ((p.frame | 0) & 3) : 0;
    return { img: st, sx: d * CHAR_W, sy: row * CHAR_H, lift: 0 };
  },
  /**
   * 남의 캐릭터.
   *   worn   { top, bottom, shoes, hat, face, bag } 꼴. 없으면 맨몸.
   *   colors { 아이템 id: '#rrggbb' } 그 사람이 상점에서 고른 옷 색.
   *          안 넘기면 그려진 원래 색입니다 — 내 색이 새지는 않습니다.
   *   school 그 사람의 학교. **안 넘기면 내 학교 색으로 칠해집니다** —
   *          홍익대 사람이 내 학교 과잠을 입게 되므로 남을 그릴 때는 넘기세요.
   *          multiplayer.js 가 이름표에 쓰는 값 그대로면 됩니다.
   */
  sheetFor(name, worn, school, colors) {
    const sp = speciesOf(name);
    const base = CHAR_IMG[sp.slug];
    if (!itemReady(base)) return null;
    const tint = school ? schoolColorOf(school) : schoolColor();
    const key = sp.slug + '|' + JSON.stringify(worn || {}) + '|' + JSON.stringify(colors || {}) + '|' + tint;
    const hit = otherCache.get(key);
    if (hit) return hit;
    const c = document.createElement('canvas');
    c.width = CHAR_W * 4; c.height = CHAR_H;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    g.drawImage(base, 0, 0);
    const on = Object.values(worn || {}).map((id) => SHOP_BY_ID[id]).filter(Boolean);
    for (const it of on.sort((a, b) => a.z - b.z)) {
      /* 과잠만 학교 색을 탑니다 — 남을 그릴 때는 그 사람 학교 색이어야 합니다. */
      const sheet = tintedItem(itemSheetFor(it, sp, tint, colors || {}), sp.line);
      if (sheet) g.drawImage(sheet, 0, followsHead(it) ? (it.cat === 'hat' ? sp.hatDy : sp.eyeDy) : 0);
    }
    /* 종류가 아무리 많아도 24장이면 충분합니다 — 8종 x 자주 쓰는 조합 몇 개.
       넘치면 가장 오래된 것부터 버립니다. */
    if (otherCache.size >= 24) otherCache.delete(otherCache.keys().next().value);
    otherCache.set(key, c);
    return c;
  },
};

/* 종별로 깎은 판까지 미리 받습니다. 예전엔 처음 입는 순간에야 요청이
   나가서, 그 프레임에는 안 깎인 판이 캐시에 들어갔고 새로고침 전까지
   소매가 몸 밖으로 튀어나온 채였습니다. 한 장이 수백 바이트라 다 받아도
   가볍습니다. */
for (const it of SHOP) {
  if (it.sprite) loadItemImg(it.sprite);
  if (it.recolor) { loadItemImg(it.recolor.base); loadItemImg(it.recolor.mask); }
  if (it.tint) { loadItemImg(it.tint.base); loadItemImg(it.tint.mask); }
  if (!FITTED_CATS[it.cat]) continue;
  for (const sp of Object.values(CHAR_SPECIES)) {
    const pre = 'fitted/' + sp.slug + '/';
    if (it.sprite) loadItemImg(fittedPath(it, sp.slug));
    if (it.recolor) { loadItemImg(pre + it.recolor.base); loadItemImg(pre + it.recolor.mask); }
    if (it.tint) { loadItemImg(pre + it.tint.base); loadItemImg(pre + it.tint.mask); }
  }
}

/* 과잠 — 무채색 마스크에 학교 색을 곱하면 회색 2단계가 그대로 명암이
   됩니다(item-spec §7). 학교를 바꾸기 전까지는 같은 그림이라 캐시합니다. */
/* 화면에 학교가 여럿일 수 있어 (종+색) 별로 담습니다. 한 칸짜리로 두면
   학교가 다른 두 사람이 매 프레임 서로를 밀어내며 다시 굽습니다. */
/**
 * base(색을 안 타는 부분) 위에 mask(무채색 천)를 색과 곱해 얹습니다.
 * 과잠의 학교 색도 상점 팔레트도 같은 방법입니다 — 다른 것은 어느 픽셀을
 * 천으로 볼 것인가뿐이고, 그 구분은 굽는 단계(build-items.mjs)에서 끝납니다.
 *
 * id 를 붙이는 이유: tintedItem 의 열쇠는 sheet.src 인데 캔버스에는 그것이
 * 없습니다. 이름이 없으면 색이 달라도 전부 '' 한 칸을 나눠 써서, 처음 구운
 * 색이 모두에게 돌아갑니다.
 */
function bakeRecolor(base, mask, col, id) {
  if (!itemReady(base) || !itemReady(mask)) return null;
  const c = document.createElement('canvas');
  c.width = ITEM_W * 4; c.height = ITEM_H;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.drawImage(mask, 0, 0);
  g.globalCompositeOperation = 'multiply';
  g.fillStyle = col; g.fillRect(0, 0, c.width, c.height);
  g.globalCompositeOperation = 'destination-in';      // 곱하면서 번진 알파를 되돌립니다
  g.drawImage(mask, 0, 0);
  g.globalCompositeOperation = 'source-over';
  g.drawImage(base, 0, 0);
  c.__id = id;
  return c;
}

const varsityCache = new Map();
function varsitySheet(col, slug) {
  col = col || schoolColor();
  const key = (slug || '-') + '|' + col;
  const hit = varsityCache.get(key);
  if (hit) return hit;
  const it = SHOP_BY_ID['top-varsity'], r = it.recolor;
  const fit = slug ? fittedRecolor(it, slug) : null;
  const base = fit ? fit.base : ITEM_IMG[r.base];
  const mask = fit ? fit.mask : ITEM_IMG[r.mask];
  const c = bakeRecolor(base, mask, col, 'varsity|' + key);
  if (!c) return null;
  /* 종별로 깎은 판을 달라고 했는데 아직 안 왔으면 담아 두지 않습니다 —
     담으면 이 프레임의 임시 그림이 영영 남아 실루엣이 안 맞습니다. */
  if (slug && !fit) return c;
  if (varsityCache.size >= 16) varsityCache.delete(varsityCache.keys().next().value);
  varsityCache.set(key, c);
  return c;
}

/* 팔레트로 고른 색을 입힌 한 벌. 종·아이템·색이 그대로면 다시 굽지 않습니다. */
const tintCanvasCache = new Map();
function tintedSheet(it, col, slug) {
  const key = it.id + '|' + col + '|' + (slug || '-');
  const hit = tintCanvasCache.get(key);
  if (hit) return hit;
  const pre = slug && FITTED_CATS[it.cat] ? 'fitted/' + slug + '/' : '';
  const c = bakeRecolor(loadItemImg(pre + it.tint.base), loadItemImg(pre + it.tint.mask), col, 'tint|' + key);
  if (!c) return null;
  if (tintCanvasCache.size >= 24) tintCanvasCache.delete(tintCanvasCache.keys().next().value);
  tintCanvasCache.set(key, c);
  return c;
}

/** 아이템 하나의 그림 한 장 — 깎지도 색을 갈지도 않은 원래 판입니다. */
function itemSheet(it, col, slug) {
  if (it.recolor) return varsitySheet(col, slug);
  const img = it.sprite && ITEM_IMG[it.sprite];
  return itemReady(img) ? img : null;
}

/** 마네킹 위에 입은 것을 z 순서로 쌓아 한 방향을 그립니다. */
function drawDoll(g, worn, dir, zoom) {
  const sx = ITEM_DIR[dir] * ITEM_W;
  const sp = speciesOf(ROOM.character);
  const put = (src, dy) => g.drawImage(src, sx, 0, ITEM_W, ITEM_H, 0, (dy || 0) * zoom, ITEM_W * zoom, ITEM_H * zoom);
  g.imageSmoothingEnabled = false;
  /* 몸은 검사용 마네킹이 아니라 지금 고른 종입니다. 시트가 아직 안 왔으면
     마네킹으로 물러납니다 — 빈 화면보다 낫습니다. */
  const body = CHAR_IMG[sp.slug];
  if (itemReady(body)) put(body);
  else if (itemReady(MANNEQUIN)) put(MANNEQUIN);
  const on = Object.values(worn || {}).map((id) => SHOP_BY_ID[id]).filter(Boolean);
  for (const it of on.sort((a, b) => a.z - b.z)) {
    const sheet = tintedItem(itemSheetFor(it, sp), sp.line);
    if (sheet) put(sheet, followsHead(it) ? (it.cat === 'hat' ? sp.hatDy : sp.eyeDy) : 0);
  }
}
/* 알은 입는 게 아니라 캐릭터가 바뀌는 것이라 칸이 아니라 이름으로 갑니다 */
const EGG_CHARACTER = {
  'egg-turtle': '거북이', 'egg-giraffe': '기린', 'egg-penguin': '펭귄',
  'egg-hamster': '햄스터', 'egg-frog': '개구리', 'egg-hedgehog': '고슴도치',
  'egg-alpaca': '알파카', 'egg-swan': '백조',
};

const itemColor = (it) => (it.school ? schoolColor() : tintOf(it) || it.color);
const owns = (id) => ROOM.owned.includes(id);
const wearing = (id) => {
  const it = SHOP_BY_ID[id];
  /* 가구에게 '입었나' 는 '방에 놓았나' 입니다. 칸(cat) 이 아니라
     ROOM.decor 를 봅니다 — 가구는 ROOM.worn 에 절대 안 들어갑니다. */
  if (isFurniture(it)) return !!decorEntry(id);
  return it.cat === 'egg' ? ROOM.character === EGG_CHARACTER[id] : ROOM.worn[it.cat] === id;
};

/* 팔레트는 **지금 보고 있는 칸에 입은 옷**의 색을 바꿉니다.
   칸마다 옷 하나만 입으므로 '무엇을 칠할지' 를 따로 고를 필요가 없습니다.
   젭·게더도 미리보기 옆에 색을 두고 지금 입은 것에 바로 먹입니다. */
function paletteHtml(cat) {
  if (cat === 'egg') return ''; // 알은 입는 게 아니라 캐릭터가 바뀌는 것입니다
  if (isFurnCat(cat)) return ''; // 가구는 그려진 색 그대로입니다
  const it = SHOP_BY_ID[ROOM.worn[cat]];
  if (!it) return `<div class="pal"><b>색</b><p class="hint">이 칸에 입은 것이 없습니다.</p></div>`;
  if (!tintable(it)) {
    const why = it.school ? '학교 색을 씁니다'
      : it.cat === 'egg' ? '알은 색을 고르지 않습니다'
      : '이 아이템은 색이 정해져 있습니다';
    return `<div class="pal"><b>${esc(it.name)} 색</b><p class="hint">${why}.</p></div>`;
  }
  const now = tintOf(it);
  const chip = (hex, name, on) =>
    `<button class="sw${on ? ' on' : ''}" data-tint="${it.id}" data-hex="${hex}"
       style="--sw:${hex}" title="${esc(name)}" aria-pressed="${on}"
       aria-label="${esc(it.name)} ${esc(name)}"></button>`;
  return `<div class="pal">
    <b>${esc(it.name)} 색</b>
    <div class="sws">
      ${chip('', '원래 색', !now)}
      ${TINTS.map((t) => chip(t.hex, t.name, now === t.hex)).join('')}
    </div>
  </div>`;
}

/** 왼쪽 미리보기 — 입은 것을 마네킹에 실제로 겹쳐 보여 줍니다. */
function shopPreviewHtml(cat) {
  /* 가구는 종이인형에 얹을 것이 아닙니다. 이 자리에 마네킹을 두면
     "가구를 입는다" 로 읽히므로, 대신 방이 지금 어떤 상태인지 씁니다. */
  if (isFurnCat(cat)) {
    const mine = SHOP.filter((i) => i.cat === cat);
    const have = mine.filter((i) => owns(i.id)).length;
    const put = (ROOM.decor || []).length;
    return `
      <div class="shop-prev">
        <div class="who"><b>내 방</b><em>기숙사 · 1인실</em></div>
        <div class="rows" style="margin-bottom:10px">
          <div class="row"><span>가진 가구</span><span class="val">${have}/${mine.length}</span></div>
          <div class="row"><span>방에 놓음</span><span class="val">${put}</span></div>
        </div>
        <p class="hint">사면 <b>보관</b>에 들어갑니다. 놓는 곳은 기숙사 방
          <b>옷장</b>이에요 — 옷장 앞에서 Space 를 누르면 꾸미기가 열립니다.</p>
      </div>`;
  }
  const layer = (cat, label) => {
    const id = ROOM.worn[cat];
    const it = id && SHOP_BY_ID[id];
    return `<div class="lay">
      <i style="background:${it ? itemColor(it) || 'var(--line-2)' : 'var(--surface-3)'}"></i>
      <span>${label}</span><em>${it ? esc(it.name) : '없음'}</em></div>`;
  };
  const Z = 3;
  return `
    <div class="shop-prev">
      <canvas class="doll" data-doll="down" data-zoom="${Z}"
        width="${ITEM_W * Z}" height="${ITEM_H * Z}"></canvas>
      <div class="who"><b>${esc(ROOM.nickname)}</b><em>${esc(ROOM.character)}</em></div>
      <div class="lays">
        ${layer('hat', '모자')}${layer('face', '안경')}${layer('top', '상의')}
        ${layer('bottom', '하의')}${layer('shoes', '신발')}${layer('bag', '가방')}
      </div>
      <p class="hint">지금 고른 캐릭터 몸에 그대로 겹쳐 보여 줍니다.
        옷은 종마다 몸 실루엣에 맞춰 깎인 판을 씁니다.</p>
    </div>`;
}

/* 상점 맨 위 한 줄. 없는 상태를 지어내지 않으려고 세 가지만 말합니다 —
   방금 못 산 이유 · 아직 못 보낸 저장 · 서버가 아예 없는 판본.
   평소(다 잘 되는 때)에는 아무것도 안 뜹니다.

   let 을 여기 두는 이유: 이 값을 읽는 곳이 closePanel 에도 있는데, 그쪽이
   이 파일에서 더 위입니다. 선언을 아래(서버 동기화 묶음)에 두면 부팅 중에
   창이 한 번이라도 닫힐 때 TDZ 로 터집니다. */
let shopNote = '';          // 못 산 이유 한 줄. 비어 있으면 안 뜹니다

function shopStateHtml() {
  const lines = [];
  if (shopNote) lines.push(esc(shopNote));
  if (serverShop()) {
    const n = WORLD_SAVE.pending ? WORLD_SAVE.pending() : 0;
    if (n) lines.push('아직 서버에 못 보낸 저장이 ' + n + '개 있어요. 연결되면 저절로 갑니다.');
  } else {
    lines.push('서버가 없는 판본이라 산 것이 이 브라우저에만 남아요.');
  }
  return lines.length ? `<p class="shop-state">${lines.join('<br>')}</p>` : '';
}

function shopTabHtml(cat) {
  const items = SHOP.filter((i) => i.cat === cat);
  const card = (it) => {
    const have = owns(it.id), on = wearing(it.id);
    const afford = ROOM.coins >= it.price;
    /* 가구는 상점에서 사기만 합니다 — 놓는 것은 방에서 하는 일이고,
       상점에 '놓기' 를 두면 학생회관에서 기숙사 바닥을 고르게 됩니다. */
    const action = !have
      ? `<button class="act" data-buy="${it.id}"${afford ? '' : ' disabled'}>${it.price}</button>`
      : isFurniture(it)
        ? `<span class="act ghost" aria-hidden="true">${on ? '방에 있음' : '보관 중'}</span>`
        : on
          ? `<button class="act ghost" data-off="${it.id}">벗기</button>`
          : `<button class="act" data-on="${it.id}">입기</button>`;
    /* zoom 2 — 격자 칸의 그림을 두 배로 키웁니다. 캔버스 자체를 크게
       잡아야(64x96) 확대해도 픽셀이 또렷합니다. CSS 로만 늘리면
       image-rendering 이 있어도 브라우저마다 결과가 다릅니다.
       가구는 세로로 긴 종이인형 칸이 필요 없어서 칸을 낮게 씁니다. */
    const thumb = isFurniture(it)
      ? `<canvas class="thumb furn" data-item="${it.id}" width="64" height="64"></canvas>`
      : `<canvas class="thumb" data-item="${it.id}" data-zoom="2"
           width="${ITEM_W * 2}" height="${ITEM_H * 2}"></canvas>`;
    return `<div class="item${on ? ' on' : ''}">
      ${thumb}
      <span>${esc(it.name)}${it.desc ? `<em>${esc(it.desc)}</em>` : ''}</span>
      ${have && !on ? '<u>보유</u>' : ''}
      ${action}</div>`;
  };
  const pal = paletteHtml(cat);
  return `<div class="shop${pal ? '' : ' nopal'}">
    <div class="shop-list">
      <div class="shop-coin">가진 코인 <b>${ROOM.coins}</b></div>
      ${shopStateHtml()}
      <div class="shop-grid">${items.map(card).join('')}</div>
    </div>
    ${pal}
    ${shopPreviewHtml(cat)}
  </div>`;
}


/* ================== 미니게임 ==================
   연우 판본(feat/openworld-develop)에서 그대로 옮겼습니다. 관문 넷이
   서 있기만 하던 자리에 실제로 할 것이 생깁니다.

   보상은 이 판본의 award() 를 거칩니다 — 연우 쪽 earn() 은 별도 코인
   장부를 쓰는데, 두 장부가 같은 잔액을 건드리면 상한이 무의미해집니다. */
/* 게임 보상. 게임마다 하루 한 번입니다 — 같은 판을 돌려 코인을 모으면
   미니게임존이 쉬는 곳이 아니라 일하는 곳이 됩니다.
   어느 게임인지는 열려 있는 패널이 압니다. */
/* 게임 아홉 개가 저마다 '멋져요! 포인트 5P를 받았어요.' 라고 적어 두었는데,
   실제로는 코인이고 액수도 COIN_MINIGAME(10)이었습니다. 아홉 군데를 각자
   고치면 다음에 또 어긋나므로, 지급하는 쪽이 문구도 만듭니다. */
let lastEarned = 0;
const gameWinMsg = () =>
  lastEarned
    ? '오늘 몫 ' + lastEarned + '코인이 들어왔어요.'
    : '오늘은 이 게임 코인을 이미 받았어요. 기록만 남습니다.';

/* which 를 주면 그 게임 칸에 셉니다. 안 주면 열려 있는 창이 곧 게임이라는
   기존 규칙 그대로입니다 — 그런데 창을 안 거치고 판을 시작하는 길(다시
   하기·안내소의 바로 가기)이 생기면서, 'game' 이라는 엉뚱한 칸에 하루
   한 번이 쌓인 적이 있습니다. 새 게임은 자기 이름을 직접 넘깁니다. */
function earn(amount, why, which) {
  rwRoll();
  const key = which || activePanelKey || 'game';
  RW.daily.games = RW.daily.games || [];
  if (RW.daily.games.includes(key)) { lastEarned = 0; return 0; }   // 오늘 이미 받았습니다
  RW.daily.games.push(key); saveRW();
  /* 서버도 게임별 하루 1회를 따로 셉니다. 로컬은 표시를 즉시 맞추는
     용도이고, 돌아온 잔액이 정답입니다. */
  if (window.WORLD_SAVE && WORLD_SAVE.configured) WORLD_SAVE.earnMinigame(key).then(applyServerBalance);
  lastEarned = COIN_MINIGAME;
  return grant(COIN_MINIGAME, why || '미니게임');
}

/* ==================================================================
   판을 그리는 두 가지 공용 도구

   ---- 1. fitGameCanvas — 창 너비에 맞춘 캔버스 ----
   지금까지 게임 캔버스는 `width="480"` 에 CSS 로 `width:100%` 였습니다.
   상자가 560px 이던 동안은 480 -> 524px, 거의 1:1 이라 티가 안 났습니다.
   상자를 940px 로 넓히자 그 480px 이 892px 로 늘어나는데, 늘리는 쪽은
   브라우저이고 늘어나는 것은 **다 그려 놓은 그림**입니다. image-rendering:
   pixelated 라 도형은 버티지만 fillText 로 쓴 글자는 1.86배로 계단이 집니다
   ("한 바퀴 완주!" 34px -> 63px).

   그래서 그리는 좌표계(논리 880x…)와 실제 픽셀 수를 나눕니다. 그리는
   코드는 늘 880 폭으로 그리고, 여기서 캔버스의 실제 폭을 CSS 폭 x dpr 로
   맞춘 뒤 그만큼 setTransform 으로 확대합니다. 결과가 892px 이든 784px 이든
   글자는 그 해상도로 **새로 그려집니다** — 늘린 그림이 아닙니다.

   dpr 은 2 에서 자릅니다. 3배 화면에서 880x330 을 그대로 받으면 캔버스
   하나가 2640x990 = 260만 픽셀이고, 그걸 60fps 로 다시 칠합니다. 그림이
   픽셀아트라 2배 위로는 눈에 차이가 없습니다.

   ---- 2. JUICE — 판 위의 부스러기 ----
   월드의 FX 를 그대로 못 씁니다. FX 는 월드 캔버스에 **카메라 좌표**로
   그리고(FX.draw(g, camX, camY)), 단위도 그림 눈금(AS)입니다 — 창 안의
   게임에는 카메라가 없습니다. 게임마다 배열을 하나씩 두는 방법도 봤는데
   다섯 벌이 되므로, 창은 한 번에 하나만 열린다는 사실을 이용해 **하나**를
   돌려 씁니다. 시작할 때 reset() 이 비웁니다.
   움직임 줄이기 설정은 FX 와 같은 기준으로 따릅니다.
   ================================================================== */
function fitGameCanvas(cv, logicalW, logicalH) {
  if (!cv) return null;
  const cssW = cv.clientWidth || logicalW;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.max(1, Math.round(cssW * dpr));
  const h = Math.max(1, Math.round(w * logicalH / logicalW));
  /* 크기를 다시 넣으면 캔버스가 통째로 지워집니다. 안 바뀌었으면 그냥 둡니다 —
     매 프레임 넣으면 그리기 전에 한 번씩 흰 판이 됩니다. */
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  const g = cv.getContext('2d');
  const s = w / logicalW;
  g.setTransform(s, 0, 0, s, 0, 0);
  return g;
}

const JUICE = {
  list: [],
  reduced: matchMedia('(prefers-reduced-motion: reduce)').matches,
  reset() { this.list.length = 0; },
  /** 한 점에서 터지는 부스러기. 맞았다·먹었다를 눈으로 알리는 자리에만. */
  burst(x, y, col, n, spd) {
    if (this.reduced) return;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = (spd || 90) * (0.45 + Math.random() * 0.75);
      this.list.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40,
                       t: 0, life: 0.34 + Math.random() * 0.3,
                       r: 2 + Math.random() * 2.4, col, g: 380 });
    }
  },
  /** 발밑 먼지. 뜨기·닿기처럼 **땅에서** 나는 것들. */
  puff(x, y, col, n) {
    if (this.reduced) return;
    for (let i = 0; i < (n || 5); i++) {
      this.list.push({ x: x + (Math.random() - 0.5) * 12, y,
                       vx: (Math.random() - 0.5) * 70, vy: -20 - Math.random() * 40,
                       t: 0, life: 0.3 + Math.random() * 0.25,
                       r: 2 + Math.random() * 3, col: col || 'rgba(244,237,228,.9)', g: 90 });
    }
  },
  /** 위로 떠오르며 사라지는 글자. 점수·판정을 그 자리에 붙입니다.
      여기만 `reduced` 를 안 봅니다 — 부스러기는 장식이지만 이 글자는
      "완벽" · "같은 발" 같은 **판정**이고, 판정을 지우면 왜 그렇게 됐는지
      알 길이 없어집니다(FX.goal 이 같은 이유로 예외입니다). 대신 튀거나
      흔들리지 않고 제자리에서 위로만 뜹니다. */
  say(x, y, text, col, size) {
    this.list.push({ k: 'txt', x, y, vx: 0, vy: -46, t: 0, life: 0.85,
                     text, col: col || '#FFFFFF', size: size || 18, g: 0 });
  },
  update(dt) {
    const L = this.list;
    for (let i = L.length - 1; i >= 0; i--) {
      const f = L[i];
      f.t += dt;
      f.x += f.vx * dt; f.y += f.vy * dt; f.vy += f.g * dt;
      if (f.t >= f.life) L.splice(i, 1);
    }
    if (L.length > 220) L.splice(0, L.length - 220);
  },
  draw(g) {
    for (const f of this.list) {
      const k = f.t / f.life;
      g.globalAlpha = Math.max(0, 1 - k * k);
      if (f.k === 'txt') {
        g.fillStyle = f.col;
        g.font = '800 ' + f.size + 'px system-ui, sans-serif';
        g.textAlign = 'center';
        /* 밝은 판 위에서도 읽히도록 어두운 테를 한 겹 두릅니다 */
        g.lineWidth = 3; g.strokeStyle = 'rgba(24,16,12,.55)';
        g.strokeText(f.text, f.x, f.y);
        g.fillText(f.text, f.x, f.y);
        g.textAlign = 'left';
      } else {
        g.fillStyle = f.col;
        const r = Math.max(1, f.r * (1 - k * 0.6));
        g.fillRect(f.x - r, f.y - r, r * 2, r * 2);
      }
    }
    g.globalAlpha = 1;
  },
};

/* ==================================================================
   미니게임 1 — 기린 목 펴기

   ---- 무엇이 문제였나 ----
   고쳐 쓰기 전의 판은 3분(GAME_MS) 동안 Space 를 누르는 것이 전부였습니다.
   재어 보니 목이 다 펴지는 데 필요한 두드림이 **48번**, 초당 네 번이면
   12초입니다. 남은 2분 48초는 아무 일도 안 일어나는 시간이었습니다.
   시간이 남으니 긴장이 없고, 긴장이 없으니 두드릴 이유도 없습니다.
   화면에는 목 각도(42도 -> 4도)가 있었지만 사람이 보는 것은 각도가 아니라
   "얼마나 남았나" 입니다.

   ---- 무엇을 바꿨나 ----
   1) 시간을 45초로 줄였습니다. 위 12초의 네 배 — 처음 해 보는 사람이
      손이 느려도 되고, 아무것도 안 하면 확실히 집니다.
   2) 목이 **다시 처집니다**. 처지는 속도는 위로 갈수록 빨라집니다
      (초당 0.075 -> 0.275). 그래서 아래는 쉽고 끝이 어렵습니다.
   3) 대신 **걸쇠**를 둘 답니다(34% · 67%). 한 번 넘으면 그 아래로는
      안 내려갑니다. 처지기만 하면 끝에서 무한히 미끄러지는 판이 되고,
      그건 사람이 진 게 아니라 게임이 안 끝나는 것입니다. 걸쇠 덕에
      "여기까지는 내 것" 이 셋 생기고, 걸릴 때마다 찰칵 소리가 납니다.
   4) 목표를 화면에 그렸습니다. 오른쪽 나무 꼭대기 잎사귀가 목표이고,
      머리가 거기 닿으면 끝입니다. 진행 막대 하나로 "몇 퍼센트" 라고
      적어 두는 것보다, 닿을 것이 보이는 쪽이 읽기 쉽습니다.
   5) 기록을 남깁니다(girin.giraffe.best). 코인은 하루 한 번이므로
      두 번째 판부터는 **기록**이 다시 하는 이유입니다. 별 셋은 12초,
      둘은 20초 — 위에서 잰 12초가 그대로 만점 기준입니다.

   ---- 안 한 것 ----
   박자 게임(정해진 타이밍에만 눌리는 것)을 만들어 봤다가 접었습니다.
   여기는 한 시간 앉아 있다가 쉬러 오는 자리이고, 박자를 요구하면 쉬는
   게 아니라 시험이 됩니다. 두드리는 것은 누구나 되고, 잘하면 빨라지는
   정도가 이 자리에 맞습니다.
   ================================================================== */
/** 남은 시간을 3:00 꼴로. 초만 쓰면 180초가 얼마인지 세어 봐야 압니다.
    (책 정리도 같은 표기를 씁니다) */
function mmss(ms) {
  const t = Math.max(0, Math.ceil(ms / 1000));
  return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
}

const NECK_W = 880, NECK_H = 330;   // 그리는 좌표계. 실제 픽셀은 fitGameCanvas 가 맞춥니다
const NECK_MS = 45000;              // 한 판. 위 머리말의 12초 x 약 4
const NECK_LOCKS = [0.34, 0.67];    // 걸쇠 — 넘으면 그 아래로 안 처집니다
const NECK_STAR3 = 12, NECK_STAR2 = 20;   // 별 기준(초)
const NECK_COMBO_MS = 420;          // 이 안에 다시 누르면 이어집니다
const GIRAFFE_NECK = {
  active: false, raf: 0, last: 0, startedAt: 0, over: false, won: false,
  p: 0, vp: 0, kick: 0, lock: 0, combo: 0, bestCombo: 0, taps: 0,
  lastTapAt: 0, rewarded: false, time: 0, shake: 0, overAt: 0,
};

function giraffeBest() {
  const v = Number(loadJSON('girin.giraffe.best', 0)) || 0;
  return v > 0 ? v : 0;
}
/** 별 셋 · 둘 · 하나. 완주 자체가 별 하나입니다 — 다 하고도 0개면
    이긴 판이 진 것처럼 보입니다. */
function giraffeStars(sec) {
  return sec <= NECK_STAR3 ? 3 : sec <= NECK_STAR2 ? 2 : 1;
}

function giraffeNeckHtml() {
  const best = giraffeBest();
  return `
    <p>굽은 목을 펴서 <b>나무 꼭대기 잎사귀</b>까지 닿게 해 주세요.
    두드리면 펴지고, 놓으면 다시 처집니다.</p>
    <div class="rows">
      <div class="row"><span>남은 시간</span><span class="val" id="giraffe-time">0:45</span></div>
      <div class="row"><span>연속</span><span class="val" id="giraffe-combo">0</span></div>
      <div class="row"><span>내 최고 기록</span><span class="val" id="giraffe-best">${best ? best.toFixed(1) + '초' : '아직 없음'}</span></div>
    </div>
    <canvas id="giraffe-cv" data-do="giraffe-tap" role="button" tabindex="0"
      aria-label="목이 굽은 기린. 누르면 목이 펴집니다."
      style="width:100%;aspect-ratio:${NECK_W}/${NECK_H};margin:12px 0 10px;border-radius:14px;border:1px solid var(--line-2);display:block;cursor:pointer;user-select:none;touch-action:manipulation"></canvas>
    <button class="act" data-do="giraffe-tap" style="width:100%;padding:14px">목 펴기 (Space · 클릭)</button>
    <p class="hint" id="giraffe-message" aria-live="polite">여기를 두드려 주세요.</p>
    <button class="act ghost" data-do="giraffe-restart" style="margin-top:10px">다시 하기</button>
    <div class="note">빠르게 이어 두드리면 <b>연속</b>이 쌓여 한 번에 더 많이 펴집니다.
    <b>34% · 67%</b>에는 걸쇠가 있어서, 한 번 넘으면 그 아래로는 안 처져요.
    코인은 하루 한 번이지만 <b>기록</b>은 계속 갱신할 수 있어요 —
    ${NECK_STAR3}초 안이면 별 셋이에요.</div>`;
}

/** 지금 걸려 있는 걸쇠 높이. 0 이면 아직 하나도 안 걸렸습니다. */
function giraffeFloor() {
  return GIRAFFE_NECK.lock > 0 ? NECK_LOCKS[GIRAFFE_NECK.lock - 1] : 0;
}

function giraffeSay(t) {
  const el = panelBody.querySelector('#giraffe-message');
  if (el) el.textContent = t;
}

function tapGiraffeNeck() {
  const G = GIRAFFE_NECK;
  if (!G.active || G.over) return;
  const now = performance.now();
  G.combo = now - G.lastTapAt <= NECK_COMBO_MS ? G.combo + 1 : 1;
  G.bestCombo = Math.max(G.bestCombo, G.combo);
  G.lastTapAt = now; G.taps++;
  /* 한 번에 펴지는 양. 연속 열둘까지만 세어 줍니다 — 그 위를 열어 두면
     연타 매크로가 2초에 끝냅니다. */
  const gain = 0.035 + Math.min(12, G.combo) * 0.0035;
  G.p = Math.min(1, G.p + gain);
  G.kick = Math.min(1, G.kick + 0.5);        // 목이 튕기는 정도(그림에서만 씁니다)
  /* 소리는 두 번에 한 번. 초당 여섯 번 두드리면 여섯 번 다 울려서
     소리가 아니라 잡음이 됩니다. */
  if (G.taps % 2 === 0) SFX.step(SURF.GRASS, G.combo > 6);
  const el = panelBody.querySelector('#giraffe-combo');
  if (el) el.textContent = G.combo > 1 ? G.combo + '연속' : '0';
  if (G.combo > 1 && G.combo % 5 === 0) {
    JUICE.say(giraffeHeadX() + 40, giraffeHeadY() - 16, G.combo + ' 연속!', '#FFD98A', 20);
  }
  giraffeCheckLock();
  if (G.p >= 1) finishGiraffeNeck(true);
}

/** 걸쇠를 넘었는지 봅니다. 넘는 순간이 이 게임에서 기분 좋은 자리라
    소리·부스러기·문구를 여기 한 곳에 모읍니다. */
function giraffeCheckLock() {
  const G = GIRAFFE_NECK;
  while (G.lock < NECK_LOCKS.length && G.p >= NECK_LOCKS[G.lock]) {
    G.lock++;
    G.shake = 0.32;
    SFX.chair(true);
    JUICE.burst(giraffeHeadX(), giraffeHeadY(), '#FFE9A8', 14, 130);
    JUICE.say(giraffeHeadX(), giraffeHeadY() - 30, '찰칵! ' + G.lock + '단 고정', '#FFFFFF', 22);
    giraffeSay(G.lock + '단 걸쇠에 걸렸어요 — 여기부터는 안 처져요.');
  }
}

function giraffeNeckTick(now) {
  const G = GIRAFFE_NECK;
  if (!G.active) return;
  G.raf = requestAnimationFrame(giraffeNeckTick);
  const dt = Math.min(0.05, (now - G.last) / 1000);
  G.last = now;
  if (dt <= 0) return;

  /* 처짐 — 위로 갈수록 빨라집니다. 아래에서는 두드리는 법을 배우고,
     위에서는 그 손을 유지해야 합니다. */
  const sag = 0.075 + 0.20 * G.p;
  G.p = Math.max(giraffeFloor(), G.p - sag * dt);
  if (now - G.lastTapAt > NECK_COMBO_MS) {
    if (G.combo) {
      G.combo = 0;
      const el = panelBody.querySelector('#giraffe-combo');
      if (el) el.textContent = '0';
    }
  }
  /* 그림은 값을 **따라갑니다**. 두드린 자리로 목이 순간이동하면 손맛이
     없고, 처지는 것도 안 보입니다. 0.18초쯤 뒤에 붙는 속도입니다. */
  G.vp += (G.p - G.vp) * Math.min(1, dt * 14);
  G.kick = Math.max(0, G.kick - dt * 3.4);
  G.shake = Math.max(0, G.shake - dt * 2);
  JUICE.update(dt);

  const left = NECK_MS - (Date.now() - G.startedAt);
  const t = panelBody.querySelector('#giraffe-time');
  if (t) t.textContent = mmss(left);
  if (left <= 0) return finishGiraffeNeck(false);
  drawGiraffeNeck();
}

/* ---- 그림 ----
   월드의 기린과 같은 색입니다(#E8AD50 몸 · #9B5B2B 테두리 · #B66D31 무늬).
   빛은 왼쪽 위 — 목 마디마다 왼쪽에 밝은 줄, 오른쪽에 어두운 줄을 넣고,
   발밑에는 어두운 접지 그림자를 깝니다. 이 두 규칙이 없으면 색만 같고
   월드에서 튀어나온 것으로는 안 보입니다. */
const NECK_SEGS = 14;              // 목 마디 수
const NECK_SEG_LEN = 10;           // 마디 길이 — 목 전체 140px
/* 목이 몸에서 시작하는 자리. 다 펴면 머리 끝이 (300, 66) 에 서고,
   그 위에 목표 잎을 매답니다(giraffeGoalY). */
const NECK_BASE_X = 300, NECK_BASE_Y = 206;
const NECK_GROUND = 240;           // 지평선

/** 목 마디의 자리. 굽은 정도는 (1 - 펴짐) 에 비례합니다 — 다 펴면
    마디가 전부 수직이고, 안 펴면 앞으로 둥글게 말립니다. */
function giraffeNeckPath(vp) {
  const bend = (1 - vp) * 2.5;                  // 라디안. 다 굽으면 약 143도 — 머리가 등 높이까지 내려옵니다
  const pts = [];
  let x = NECK_BASE_X, y = NECK_BASE_Y, a = -Math.PI / 2;
  pts.push({ x, y, a });
  for (let i = 0; i < NECK_SEGS; i++) {
    a = -Math.PI / 2 + bend * ((i + 1) / NECK_SEGS);
    x += Math.cos(a) * NECK_SEG_LEN;
    y += Math.sin(a) * NECK_SEG_LEN;
    pts.push({ x, y, a });
  }
  return pts;
}
function giraffeHeadX() { return giraffeNeckPath(GIRAFFE_NECK.vp).at(-1).x; }
function giraffeHeadY() { return giraffeNeckPath(GIRAFFE_NECK.vp).at(-1).y; }

function drawGiraffeNeck() {
  const cv = panelBody.querySelector('#giraffe-cv');
  const g = fitGameCanvas(cv, NECK_W, NECK_H);
  if (!g) return;
  const G = GIRAFFE_NECK;
  const W = NECK_W, H = NECK_H;

  /* 걸쇠에 걸리는 순간만 화면이 흔들립니다. 늘 흔들면 멀미가 나고,
     안 흔들면 걸린 줄 모릅니다. */
  if (G.shake > 0) {
    g.translate((Math.random() - 0.5) * G.shake * 9, (Math.random() - 0.5) * G.shake * 6);
  }

  /* ---- 하늘 · 땅 ---- */
  const sky = g.createLinearGradient(0, 0, 0, NECK_GROUND);
  sky.addColorStop(0, '#BFE3EF'); sky.addColorStop(1, '#EAF3E4');
  g.fillStyle = sky; g.fillRect(0, 0, W, NECK_GROUND);
  /* 먼 언덕 — 뒤가 비면 기린이 색종이처럼 떠 보입니다 */
  for (let i = 0; i < 5; i++) disc(g, 40 + i * 200, NECK_GROUND + 44, 74 + (i % 2) * 24, '#C3DEC0');
  for (let i = 0; i < 4; i++) disc(g, 140 + i * 220, NECK_GROUND + 52, 56, '#AFD3AE');
  g.fillStyle = '#8FBF7A'; g.fillRect(0, NECK_GROUND, W, H - NECK_GROUND);
  g.fillStyle = '#A3CE8B'; g.fillRect(0, NECK_GROUND, W, 3);
  g.fillStyle = '#79AE68';
  for (let i = 0; i < 90; i++) {
    const x = (i * 97) % W, y = NECK_GROUND + 8 + ((i * 37) % (H - NECK_GROUND - 10));
    g.fillRect(x, y, 3, 4 + (i % 3));
  }

  /* ---- 목표 나무 ----
     줄기는 오른쪽, 가지는 기린 머리 위까지 뻗습니다. 열매를 오른쪽 끝에
     달아 두면 목을 펴도 안 닿는 자리라, 화면이 시키는 것과 조작이 하는
     것이 어긋납니다. 닿을 자리에 답니다. */
  const treeX = 742, goalY = giraffeGoalY();
  g.fillStyle = '#6B4A2E'; g.fillRect(treeX - 15, 70, 30, H - 70);
  g.fillStyle = '#8A6039'; g.fillRect(treeX - 15, 70, 8, H - 70);
  g.fillStyle = '#4A3323'; g.fillRect(treeX + 8, 70, 7, H - 70);
  /* 껍질 결 — 통짜 갈색 기둥은 나무로 안 읽힙니다 */
  g.fillStyle = '#5A3D25';
  for (let y = 96; y < H; y += 26) g.fillRect(treeX - 6, y, 3, 14);
  disc(g, treeX + 8, 56, 66, '#3F8F5C');
  disc(g, treeX - 40, 68, 46, '#4E9E63');
  disc(g, treeX + 62, 72, 40, '#357C4E');
  disc(g, treeX - 30, 28, 32, '#6FBE7F');
  /* 가지 — 줄기에서 목표까지. 곧은 막대로 그렸더니 장대처럼 보여서,
     아래로 처졌다가 끝에서 다시 들리는 이차 곡선으로 바꿨습니다. */
  const bez = (t, a, b, c) => (1 - t) * (1 - t) * a + 2 * (1 - t) * t * b + t * t * c;
  for (let t = 0; t <= 1.001; t += 0.014) {
    const x = bez(t, treeX - 14, 520, NECK_BASE_X + 4);
    const y = bez(t, 104, 96, goalY + 8);
    const th = 13 - t * 8;
    g.fillStyle = '#6B4A2E'; g.fillRect(x - th / 2, y - th / 2, th, th);
    g.fillStyle = '#8A6039'; g.fillRect(x - th / 2, y - th / 2, th, 2);
  }
  /* 잎 덩이 — 가지가 맨살이면 죽은 나뭇가지로 보입니다. 한 덩이가
     원 셋이라야 잎으로 보이고, 하나면 사탕이 됩니다. */
  [0.2, 0.42, 0.64, 0.84].forEach((t, i) => {
    const x = bez(t, treeX - 14, 520, NECK_BASE_X + 4);
    const y = bez(t, 104, 96, goalY + 8) + Math.sin(performance.now() / 900 + i) * 2;
    disc(g, x + 7, y + 5, 16, '#357C4E');
    disc(g, x - 11, y + 1, 14, '#4E9E63');
    disc(g, x - 3, y - 7, 11, '#6FBE7F');
  });
  /* 목표 잎 — 머리가 닿아야 하는 자리. 흔들려서 눈에 띕니다. */
  const wob = Math.sin(performance.now() / 260) * 3;
  const done = G.p >= 1;
  disc(g, NECK_BASE_X + 2 + wob, goalY + 10, 27, 'rgba(255,255,255,.34)');
  disc(g, NECK_BASE_X + 4 + wob, goalY + 12, 22, done ? '#C98536' : '#2F6B45');
  disc(g, NECK_BASE_X - 2 + wob, goalY + 7, 18, done ? '#E0AE3C' : '#4E9E63');
  disc(g, NECK_BASE_X - 8 + wob, goalY + 2, 12, done ? '#FFD98A' : '#7BD68F');
  disc(g, NECK_BASE_X - 12 + wob, goalY - 2, 6, done ? '#FFF3C8' : '#C2ECC9');
  if (!done) {
    g.fillStyle = 'rgba(42,35,32,.72)';
    g.fillRect(NECK_BASE_X - 148, goalY - 4, 88, 26);
    g.fillStyle = '#FFF6F3'; g.font = '700 14px system-ui, sans-serif';
    g.textBaseline = 'middle'; g.fillText('여기까지!', NECK_BASE_X - 138, goalY + 9);
    g.textBaseline = 'alphabetic';
    g.fillStyle = 'rgba(42,35,32,.72)';
    g.fillRect(NECK_BASE_X - 60, goalY + 6, 12, 3);          // 말풍선 꼬리
  }

  /* ---- 기린 ---- */
  const pts = giraffeNeckPath(G.vp + G.kick * 0.02);
  /* 접지 그림자 먼저. 이게 없으면 기린이 잔디 위에 붙지 않습니다. */
  g.fillStyle = 'rgba(60,40,24,.22)';
  g.beginPath(); g.ellipse(NECK_BASE_X + 8, 296, 82, 11, 0, 0, 7); g.fill();
  /* 다리 넷. 뒤 둘이 어둡고 조금 안쪽입니다 — 넷을 같은 색으로 두면
     판자 넷이 서 있는 것으로 보입니다. 발굽은 접지선입니다. */
  const leg = (x, top, w, back) => {
    g.fillStyle = back ? '#B66D31' : '#9B5B2B';
    g.fillRect(x - 1, top, w + 2, 294 - top);
    g.fillStyle = back ? '#C98536' : '#D7953F';
    g.fillRect(x, top, w, 292 - top);
    if (!back) { g.fillStyle = '#E8AD50'; g.fillRect(x, top, 4, 292 - top); }
    g.fillStyle = back ? '#7A4520' : '#6B4A2E';
    g.fillRect(x - 1, 286, w + 2, 8);
  };
  leg(NECK_BASE_X - 38, 240, 14, true); leg(NECK_BASE_X + 36, 240, 14, true);
  leg(NECK_BASE_X - 22, 244, 16, false); leg(NECK_BASE_X + 18, 244, 16, false);
  /* 몸통 — 앞가슴과 엉덩이를 원으로 잡고 사이를 채웁니다. 네모로 두면
     상자에 다리를 꽂아 놓은 그림이 됩니다. */
  const bodyPaint = (inset, col) => {
    disc(g, NECK_BASE_X - 26 + inset, 226 + inset * 0.4, 30 - inset, col);
    disc(g, NECK_BASE_X + 38 - inset, 228 + inset * 0.4, 32 - inset, col);
    g.fillStyle = col;
    g.fillRect(NECK_BASE_X - 26, 196 + inset, 64, 62 - inset * 2);
  };
  bodyPaint(0, '#9B5B2B');
  bodyPaint(3, '#E8AD50');
  /* 빛은 왼쪽 위 — 등이 밝고 배가 어둡습니다 */
  g.save();
  g.beginPath(); g.rect(NECK_BASE_X - 58, 199, 130, 12); g.clip();
  bodyPaint(3, '#F0C378');
  g.restore();
  g.save();
  g.beginPath(); g.rect(NECK_BASE_X - 58, 242, 130, 18); g.clip();
  bodyPaint(3, '#C98536');
  g.restore();
  g.fillStyle = '#B66D31';
  [[-30, 214], [-4, 208], [24, 218], [-18, 232], [14, 236], [36, 236]].forEach(([a, b]) =>
    g.fillRect(NECK_BASE_X + a, b, 14, 11));
  /* 꼬리 — 살랑입니다. 안 움직이면 정지 화면으로 보입니다. */
  const tail = Math.sin(performance.now() / 320) * 5;
  g.fillStyle = '#9B5B2B';
  g.fillRect(NECK_BASE_X + 66, 208, 6, 28);
  g.fillRect(NECK_BASE_X + 64 + tail, 232, 9, 12);

  /* 목 — 마디를 따라 그립니다. 왼쪽 위가 밝은 규칙을 마디마다 지킵니다. */
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i], p1 = pts[i + 1];
    const wSeg = 27 - i * 0.7;
    g.save();
    g.translate(p0.x, p0.y); g.rotate(p1.a + Math.PI / 2);
    g.fillStyle = '#9B5B2B'; g.fillRect(-wSeg / 2 - 2, -NECK_SEG_LEN, wSeg + 4, NECK_SEG_LEN + 4);
    g.fillStyle = '#E8AD50'; g.fillRect(-wSeg / 2, -NECK_SEG_LEN, wSeg, NECK_SEG_LEN + 3);
    g.fillStyle = '#F0C378'; g.fillRect(-wSeg / 2, -NECK_SEG_LEN, 5, NECK_SEG_LEN + 3);
    g.fillStyle = '#C98536'; g.fillRect(wSeg / 2 - 5, -NECK_SEG_LEN, 5, NECK_SEG_LEN + 3);
    if (i % 2 === 0 && i < pts.length - 3) {
      g.fillStyle = '#B66D31'; g.fillRect(-wSeg / 2 + 5, -NECK_SEG_LEN + 1, wSeg - 11, 6);
    }
    /* 갈기 — 뒤쪽에 짧은 털. 목이 어느 쪽을 보는지 알려 줍니다. */
    g.fillStyle = '#8A5024'; g.fillRect(wSeg / 2 - 1, -NECK_SEG_LEN + 1, 4, 7);
    g.restore();
  }
  /* 머리 */
  const head = pts[pts.length - 1];
  g.save();
  g.translate(head.x, head.y); g.rotate(head.a + Math.PI / 2);
  g.fillStyle = '#9B5B2B'; g.fillRect(-16, -28, 32, 32);
  g.fillStyle = '#E8AD50'; g.fillRect(-13, -25, 26, 26);
  g.fillStyle = '#F0C378'; g.fillRect(-13, -25, 26, 6);
  g.fillStyle = '#E8AD50'; g.fillRect(-23, -20, 11, 12);      // 주둥이
  g.fillStyle = '#9B5B2B'; g.fillRect(-25, -20, 3, 12);
  g.fillStyle = '#2A2520'; g.fillRect(-5, -18, 5, 5);          // 눈
  g.fillStyle = '#FFFFFF'; g.fillRect(-5, -18, 2, 2);
  g.fillStyle = '#9B5B2B';                                     // 뿔 둘
  g.fillRect(-8, -38, 4, 11); g.fillRect(4, -38, 4, 11);
  g.fillStyle = '#6B4A2E'; g.fillRect(-9, -41, 6, 5); g.fillRect(3, -41, 6, 5);
  g.fillStyle = '#E8AD50'; g.fillRect(11, -24, 13, 8);         // 귀
  g.fillStyle = '#C98536'; g.fillRect(13, -22, 9, 4);
  g.restore();

  /* ---- 펴짐 막대 — 걸쇠가 보이는 자리 ---- */
  const bx = 30, by = 38, bh = 232, bw = 20;
  g.fillStyle = 'rgba(255,255,255,.8)'; g.fillRect(bx - 5, by - 6, bw + 10, bh + 12);
  g.fillStyle = '#D8D2CC'; g.fillRect(bx, by, bw, bh);
  const fill = bh * G.vp;
  const grad = g.createLinearGradient(0, by + bh - fill, 0, by + bh);
  grad.addColorStop(0, '#56DCCA'); grad.addColorStop(1, '#12A592');
  g.fillStyle = grad; g.fillRect(bx, by + bh - fill, bw, fill);
  NECK_LOCKS.forEach((L, i) => {
    const y = by + bh - bh * L;
    g.fillStyle = G.lock > i ? '#2E9E5B' : '#9A8E88';
    g.fillRect(bx - 5, y - 2, bw + 10, 4);
  });
  g.fillStyle = '#2B3230'; g.font = '700 12px system-ui, sans-serif';
  g.textAlign = 'center';
  g.fillText(Math.round(G.vp * 100) + '%', bx + bw / 2, by - 12);
  g.textAlign = 'left';

  JUICE.draw(g);

  /* ---- 끝난 뒤 ---- */
  if (G.over) {
    /* 띠는 **아래쪽**입니다. 한가운데에 두면 방금 잎에 닿은 머리를
       가리는데, 이 게임에서 보고 싶은 그림이 바로 그것입니다. */
    g.fillStyle = G.won ? 'rgba(47,158,91,.92)' : 'rgba(42,35,32,.86)';
    g.fillRect(0, H - 122, W, 112);
    g.fillStyle = '#FFFFFF'; g.textAlign = 'center';
    g.font = '800 40px system-ui, sans-serif';
    g.fillText(G.won ? '목을 다 폈어요!' : '시간이 끝났어요', W / 2, H - 74);
    g.font = '700 18px system-ui, sans-serif';
    if (G.won) {
      const st = giraffeStars(G.time);
      g.fillText('★'.repeat(st) + '☆'.repeat(3 - st) + '   ' + G.time.toFixed(1) + '초 · 최고 '
                 + G.bestCombo + '연속', W / 2, H - 34);
    } else {
      g.fillText(Math.round(G.p * 100) + '% 까지 폈어요 · 조금 더 빠르게 이어서', W / 2, H - 34);
    }
    g.textAlign = 'left';
  }
  g.setTransform(1, 0, 0, 1, 0, 0);
}

/** 목표 잎의 높이 — 다 폈을 때 **뿔 끝**이 오는 자리입니다. 눈으로
    맞춰 두면 마디 수나 길이를 건드릴 때마다 어긋나므로 경로에서 뽑습니다.
    머리 그림이 머리 끝에서 위로 41px(뿔)이라 그만큼 올립니다. */
function giraffeGoalY() {
  return giraffeNeckPath(1).at(-1).y - 41;
}

function finishGiraffeNeck(won) {
  const G = GIRAFFE_NECK;
  if (G.over) return;
  G.active = false; G.over = true; G.won = won;
  cancelAnimationFrame(G.raf);
  G.time = Math.max(0, (Date.now() - G.startedAt) / 1000);
  G.overAt = performance.now();
  if (won) {
    if (!G.rewarded) { G.rewarded = true; earn(COIN_MINIGAME, '기린 목 펴기 성공', 'giraffeNeck'); }
    const prev = giraffeBest();
    if (!prev || G.time < prev) saveJSON('girin.giraffe.best', Math.round(G.time * 10) / 10);
    const bestEl = panelBody.querySelector('#giraffe-best');
    if (bestEl) bestEl.textContent = giraffeBest().toFixed(1) + '초';
    SFX.door();
    JUICE.burst(giraffeHeadX(), giraffeHeadY(), '#FFE9A8', 26, 190);
    giraffeSay(gameWinMsg() + ' ' + G.time.toFixed(1) + '초 · 별 ' + giraffeStars(G.time) + '개.');
  } else {
    giraffeSay('시간이 끝났어요. 걸쇠(34% · 67%)까지만 넘겨 두면 그 아래로는 안 처져요.');
  }
  G.last = performance.now();
  G.raf = requestAnimationFrame(giraffeOutro);
}

/** 끝난 뒤 1.4초. 터진 부스러기가 떨어지는 것까지 보여 주려고 잠깐 더
    돕니다 — 마지막 프레임에서 그림이 얼어붙으면 이긴 순간이 안 남습니다. */
function giraffeOutro(now) {
  const G = GIRAFFE_NECK;
  if (!G.over) return;
  const dt = Math.min(0.05, (now - G.last) / 1000);
  G.last = now;
  JUICE.update(dt);
  G.vp += (G.p - G.vp) * Math.min(1, dt * 14);
  G.shake = Math.max(0, G.shake - dt * 2);
  drawGiraffeNeck();
  if (now - G.overAt < 1400) G.raf = requestAnimationFrame(giraffeOutro);
}

function startGiraffeNeck() {
  const G = GIRAFFE_NECK;
  cancelAnimationFrame(G.raf);
  panelBody.innerHTML = giraffeNeckHtml();
  JUICE.reset();
  G.active = true; G.over = false; G.won = false; G.rewarded = false;
  G.p = 0; G.vp = 0; G.kick = 0; G.lock = 0; G.combo = 0; G.bestCombo = 0;
  G.taps = 0; G.lastTapAt = 0; G.time = 0; G.shake = 0;
  G.startedAt = Date.now(); G.last = performance.now();
  drawGiraffeNeck();
  G.raf = requestAnimationFrame(giraffeNeckTick);
}

/* ==================================================================
   미니게임 2 — 거북이 알 받기

   바구니를 좌우로 움직여 떨어지는 알을 받습니다. 20초 안에 8개 중
   5개 이상 받으면 성공합니다.
   ================================================================== */
const TURTLE_EGG = {
  active: false, timer: 0, startedAt: 0, basketX: 50, eggs: [],
  spawned: 0, caught: 0, missed: 0, lastSpawn: 0, rewarded: false,
};
function turtleEggHtml() {
  return `
    <p>바구니를 움직여 떨어지는 거북이 알을 받아 주세요.</p>
    <div class="rows">
      <div class="row"><span>남은 시간</span><span class="val" id="egg-time">20초</span></div>
      <div class="row"><span>받은 알</span><span class="val" id="egg-score">0 / 5</span></div>
      <div class="row"><span>조작</span><span class="val">A/D · ←/→</span></div>
    </div>
    <div class="egg-stage" style="position:relative;height:300px;margin:14px 0;border-radius:14px;background:linear-gradient(180deg,#dce9ef,#f4dfb9);overflow:hidden">
      <div id="egg-sky-hint" style="position:absolute;top:8px;left:0;right:0;text-align:center;color:#8a6b50;font-size:12px">알이 떨어지고 있어요!</div>
      <div id="egg-basket" style="position:absolute;left:50%;bottom:12px;width:42px;height:24px;transform:translateX(-50%);border:4px solid #8f572b;border-top:0;border-radius:0 0 18px 18px;background:#d7953f;transition:left .08s ease"></div>
    </div>
    <div style="display:flex;justify-content:center;gap:8px;margin-top:-6px">
      <button class="act" data-do="egg-left" aria-label="왼쪽으로 이동">←</button>
      <button class="act" data-do="egg-right" aria-label="오른쪽으로 이동">→</button>
    </div>
    <p class="hint" id="egg-message" aria-live="polite">알 5개를 받아야 성공이에요.</p>
    <button class="act" data-do="egg-restart">다시 시작</button>`;
}
function renderTurtleEgg() {
  const stage = panelBody.querySelector('.egg-stage');
  const basket = panelBody.querySelector('#egg-basket');
  const time = panelBody.querySelector('#egg-time');
  const score = panelBody.querySelector('#egg-score');
  if (!stage || !basket || !time || !score) return;
  const elapsed = TURTLE_EGG.active ? Date.now() - TURTLE_EGG.startedAt : 0;
  time.textContent = TURTLE_EGG.active ? `${Math.max(0, 20 - Math.ceil(elapsed / 1000))}초` : time.textContent;
  score.textContent = `${TURTLE_EGG.caught} / 5`;
  basket.style.left = `${TURTLE_EGG.basketX}%`;
  stage.querySelectorAll('.falling-egg').forEach((egg) => egg.remove());
  TURTLE_EGG.eggs.forEach((egg) => {
    const el = document.createElement('span');
    el.className = 'falling-egg';
    el.textContent = '🥚';
    el.style.cssText = `position:absolute;left:${egg.x}%;top:${egg.y}px;font-size:22px;line-height:1;transform:translateX(-50%)`;
    stage.append(el);
  });
}
function moveTurtleBasket(direction) {
  if (!TURTLE_EGG.active) return;
  TURTLE_EGG.basketX = Math.max(10, Math.min(90, TURTLE_EGG.basketX + direction * 7));
  renderTurtleEgg();
}
function finishTurtleEgg(success, message) {
  TURTLE_EGG.active = false;
  clearInterval(TURTLE_EGG.timer);
  const stage = panelBody.querySelector('.egg-stage');
  const messageEl = panelBody.querySelector('#egg-message');
  if (success) {
    if (!TURTLE_EGG.rewarded) {
      TURTLE_EGG.rewarded = true;
      earn(COIN_MINIGAME, '거북이 알 받기 성공');
    }
    if (stage) stage.innerHTML = '<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(145deg,#5cb177,#3f9960);color:#fff;text-align:center"><strong style="font-size:42px;line-height:1">성공!</strong><span style="margin-top:12px;font-size:16px;font-weight:700">거북이 알을 잘 받았어요</span><b style="margin-top:18px;padding:7px 14px;border-radius:999px;background:#fff;color:#3f9960;font-size:15px">+' + COIN_MINIGAME + '코인</b></div>';
    if (messageEl) messageEl.textContent = gameWinMsg();
  } else if (messageEl) messageEl.textContent = message || '알을 충분히 받지 못했어요. 다시 도전해 보세요.';
  renderTurtleEgg();
}
function tickTurtleEgg() {
  if (!TURTLE_EGG.active) return;
  const now = Date.now();
  if (now - TURTLE_EGG.lastSpawn >= 1100 && TURTLE_EGG.spawned < 8) {
    TURTLE_EGG.eggs.push({ x: 12 + Math.random() * 76, y: 24 });
    TURTLE_EGG.spawned++;
    TURTLE_EGG.lastSpawn = now;
  }
  TURTLE_EGG.eggs.forEach((egg) => { egg.y += 3.1; });
  const basketY = 152;
  TURTLE_EGG.eggs = TURTLE_EGG.eggs.filter((egg) => {
    if (egg.y >= basketY) {
      if (Math.abs(egg.x - TURTLE_EGG.basketX) <= 10) TURTLE_EGG.caught++;
      else TURTLE_EGG.missed++;
      return false;
    }
    return true;
  });
  const elapsed = now - TURTLE_EGG.startedAt;
  if (TURTLE_EGG.caught >= 5) return finishTurtleEgg(true);
  if (elapsed >= 20000) return finishTurtleEgg(false);
  if (TURTLE_EGG.spawned >= 8 && TURTLE_EGG.eggs.length === 0) return finishTurtleEgg(false);
  renderTurtleEgg();
}
function startTurtleEgg() {
  clearInterval(TURTLE_EGG.timer);
  if (!panelBody.querySelector('.egg-stage')) panelBody.innerHTML = turtleEggHtml();
  TURTLE_EGG.active = true;
  TURTLE_EGG.startedAt = Date.now();
  TURTLE_EGG.basketX = 50;
  TURTLE_EGG.eggs = [];
  TURTLE_EGG.spawned = 0;
  TURTLE_EGG.caught = 0;
  TURTLE_EGG.missed = 0;
  TURTLE_EGG.lastSpawn = Date.now();
  TURTLE_EGG.rewarded = false;
  TURTLE_EGG.timer = setInterval(tickTurtleEgg, 100);
  renderTurtleEgg();
}

/* ==================================================================
   미니게임 2 — 거북이 알 합치기

   2048 방식의 4×4 블록 퍼즐입니다. 같은 알을 합치면 다음 동물로
   진화하고, 왕관 알을 만들면 성공합니다.
   ================================================================== */
const EGG_MERGE = {
  active: false, board: [], score: 0, rewarded: false,
};
const EGG_TILES = ['','🥚','🐢','🌿','🦒','✨','👑'];
function eggMergeHtml() {
  return `
    <p>같은 알을 합쳐 왕관 알을 만들어 보세요.</p>
    <div class="rows">
      <div class="row"><span>점수</span><span class="val" id="egg-merge-score">0</span></div>
      <div class="row"><span>목표</span><span class="val">👑 왕관 알</span></div>
      <div class="row"><span>조작</span><span class="val">방향키 · WASD</span></div>
    </div>
    <div id="egg-merge-board" style="display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:8px;margin:14px 0;background:#a78360;border-radius:14px;aspect-ratio:1">
