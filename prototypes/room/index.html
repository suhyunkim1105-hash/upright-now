<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deskfit — 초대 세션</title>
<link rel="icon" href="../landing/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../public/fonts/wanted-sans/WantedSansVariable.css">
<style>
/* ==================================================================
   초대 세션 — 아는 사람끼리 코드로 들어오는 방

   흐름은 라임 시절 방 만들기 마법사(room-flow)를 그대로 가져왔습니다.
   그때 다섯 단계였던 것을 셋으로 줄였습니다 — "공개/비공개" 는 여기
   들어온 순간 이미 정해졌고, "확인" 화면은 대기실이 그 일을 합니다.

     인원 → 시간 → 말하기 → 대기실 → 세션 → 끝

   문을 안 잠급니다. 자세 기준도 학교 인증도 안 물어봅니다. 친구가 코드를
   보냈는데 카메라부터 10초 맞추라고 하면 그 사람은 안 들어옵니다.
   기준은 방 안에서 원할 때 잡습니다.

   목소리는 **켜져 있는 것이 기본** 입니다. 같이 앉는 자리에서 아무도
   말을 못 하면 혼자 앉는 것과 같습니다. 대신 들어오자마자 말이 나가는
   것은 곤란하므로 대기실에서 미리 켜고 끕니다.

   카메라는 다릅니다. 이 제품의 카메라는 **자세를 보는 장치** 이고
   얼굴을 띄우는 장치가 아닙니다. 영상은 어디로도 안 나가고 타일에
   뜨는 것은 캐릭터입니다.
   ================================================================== */

:root {
  --teal:      #2DD4BF;
  --teal-50:   #EFFBF9;
  --teal-100:  #CFF2ED;
  --teal-700:  #0D7769;
  --ink:       #17201E;
  --ink-2:     #55605D;
  --ink-3:     #646E6B;
  --ink-toss:  #191F28;
  --paper:     #FFFFFF;
  --wash:      #F4F7F6;
  --line:      #E3E8E7;
  --warn-700:  #9A5B14;
  --bad-700:   #A8352A;

  --s-1: 8px;  --s-2: 14px; --s-3: 22px;
  --s-4: 34px; --s-5: 52px;

  --r-win: 28px;  --r: 20px;  --r-sm: 12px;  --r-pill: 999px;

  /* ---- 클레이 ---- 로비·마이페이지·랭킹전과 같은 값입니다. */
  --clay:
    inset 0 3px 6px rgba(255,255,255,.60),
    inset 0 -5px 9px rgba(13,60,52,.11),
    0 9px 20px rgba(23,32,30,.13),
    0 2px 5px rgba(23,32,30,.07);
  --clay-lift:
    inset 0 3px 6px rgba(255,255,255,.66),
    inset 0 -5px 9px rgba(13,60,52,.11),
    0 15px 30px rgba(23,32,30,.17),
    0 3px 7px rgba(23,32,30,.08);
  --clay-press:
    inset 0 4px 9px rgba(13,60,52,.17),
    inset 0 -2px 5px rgba(255,255,255,.50),
    0 2px 5px rgba(23,32,30,.10);
  --clay-sm:
    inset 0 2px 4px rgba(255,255,255,.58),
    inset 0 -3px 6px rgba(13,60,52,.10),
    0 5px 12px rgba(23,32,30,.11);
  --clay-well:
    inset 0 3px 7px rgba(13,60,52,.12),
    inset 0 -2px 4px rgba(255,255,255,.85);

  --ease: cubic-bezier(.16, 1, .3, 1);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--wash);
  color: var(--ink);
  font: 500 15px/1.7 'Wanted Sans Variable', 'Wanted Sans', 'Pretendard Variable',
        -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.008em;
  display: grid; place-items: start center;
  padding: var(--s-4) 100px var(--s-5);
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--teal-700); outline-offset: 3px; border-radius: 6px; }

/* ---------------- 창 ---------------- */
.win {
  width: min(1140px, 100%);
  background: var(--paper);
  border: 0; border-radius: var(--r-win);
  box-shadow: var(--clay);
  overflow: hidden;
}
.titlebar {
  display: flex; align-items: center; gap: var(--s-2);
  padding: 16px var(--s-3);
  background: linear-gradient(180deg, #46DCC9 0%, var(--teal) 58%, #23C4B0 100%);
  box-shadow: inset 0 -3px 6px rgba(12,90,79,.16);
}
.titlebar h1 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -0.025em; }
.titlebar .sub { font-size: 12px; font-weight: 600; color: var(--ink); opacity: .72; letter-spacing: 0.12em; }
.titlebar .x {
  position: relative;
  margin-left: auto; width: 30px; height: 30px; display: grid; place-items: center;
  background: var(--paper); border: 0; border-radius: 50%;
  cursor: pointer; box-shadow: var(--clay-sm);
  transition: background .14s var(--ease), transform .14s var(--ease), box-shadow .14s var(--ease);
}
.titlebar .x::after {
  content: ""; position: absolute; top: 50%; left: 50%;
  width: 40px; height: 40px; transform: translate(-50%, -50%);
}
.titlebar .x:hover { background: var(--teal-50); transform: translateY(-1px); }
.titlebar .x:active { transform: translateY(1px); box-shadow: var(--clay-press); }

.body { padding: var(--s-4) var(--s-4) var(--s-5); }
.view[hidden] { display: none; }

h2 { margin: 0 0 6px; font-size: 22px; font-weight: 800; letter-spacing: -0.028em; }
.lede { margin: 0 0 var(--s-3); font-size: 14.5px; font-weight: 500; color: var(--ink-2); }

/* ================= 마법사 =================
   한 화면에 물음 하나. 라임 시절 다섯 단계를 셋으로 줄였습니다 —
   공개/비공개는 여기 들어온 순간 정해졌고, 확인은 대기실이 합니다. */
.wiz { max-width: 620px; margin: 0 auto; text-align: center; }
.wiz-track {
  display: flex; justify-content: center; gap: 6px; margin-bottom: var(--s-4);
}
.wiz-track i {
  width: 34px; height: 5px; border-radius: 3px;
  background: var(--wash); box-shadow: var(--clay-well);
  transition: background .2s var(--ease), width .2s var(--ease);
}
.wiz-track i.on { width: 52px; background: var(--teal); box-shadow: var(--clay-sm); }

/* 고르는 칸 — 파인 홈 위에 솟은 알약. 마이페이지 탭·랭킹전 기간 탭과
   같은 문법입니다. 고른 것은 색만이 아니라 **두께**로도 말합니다. */
.picks {
  display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
  margin-top: var(--s-3);
}
.pick {
  min-width: 118px; min-height: 88px; padding: 14px 20px;
  border: 0; border-radius: 18px; cursor: pointer;
  background: var(--wash); color: var(--ink-2);
  display: grid; place-items: center; gap: 2px;
  box-shadow: var(--clay-well);
  transition: transform .18s var(--ease), box-shadow .18s var(--ease),
              background .18s var(--ease), color .18s var(--ease);
}
.pick b { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.pick span { font-size: 12.5px; font-weight: 600; }
.pick:hover { transform: translateY(-3px); box-shadow: var(--clay); background: var(--paper); }
.pick:active { transform: translateY(1px); box-shadow: var(--clay-press); }
.pick[aria-pressed="true"] {
  background: var(--teal); color: var(--ink);
  box-shadow: var(--clay);
}
/* 색을 못 보는 사람도 알 수 있게 체크를 답니다. */
.pick[aria-pressed="true"] b::after { content: ' ✓'; font-size: 15px; }

.wiz-acts { margin-top: var(--s-5); display: flex; gap: 10px; justify-content: center; }

.go {
  padding: 16px 40px; border: 0; border-radius: 16px;
  background: var(--teal); color: var(--ink);
  font-size: 16px; font-weight: 800; letter-spacing: -0.015em; cursor: pointer;
  box-shadow: var(--clay);
  transition: transform .16s var(--ease), box-shadow .16s var(--ease);
}
.go:hover { transform: translateY(-2px); box-shadow: var(--clay-lift); }
.go:active { transform: translateY(1px); box-shadow: var(--clay-press); }
.go.wide { width: 100%; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 11px 20px; min-height: 44px;
  border: 0; border-radius: var(--r-pill);
  background: var(--paper); font-size: 14px; font-weight: 700; cursor: pointer;
  box-shadow: var(--clay-sm);
  transition: transform .16s var(--ease), box-shadow .16s var(--ease), background .16s var(--ease);
}
.btn:hover { background: var(--wash); transform: translateY(-2px); box-shadow: var(--clay-lift); }
.btn:active { transform: translateY(1px); box-shadow: var(--clay-press); }
.btn.ghost { background: none; box-shadow: none; color: var(--ink-3); }
.btn.ghost:hover { background: var(--wash); box-shadow: var(--clay-sm); color: var(--ink-2); }

/* ================= 대기실 ================= */
.wait { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: var(--s-4); align-items: start; }
@media (max-width: 940px) { .wait { grid-template-columns: minmax(0, 1fr); } }

/* 초대 코드 — 이 화면에서 제일 먼저 할 일이라 제일 크게. */
.code-box {
  padding: var(--s-3); border-radius: var(--r);
  background: var(--teal-50); box-shadow: var(--clay-well);
  display: flex; align-items: center; gap: var(--s-3); flex-wrap: wrap;
}
.code {
  font-size: 34px; font-weight: 800; letter-spacing: .16em;
  font-variant-numeric: tabular-nums; color: var(--teal-700);
  padding-left: .16em;
}
.code-box .who { flex: 1 1 140px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); }

/* 참가자 — 얼굴이 아니라 캐릭터가 뜹니다. */
.tiles {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(142px, 1fr));
  gap: var(--s-2); margin-top: var(--s-3);
}
.tile {
  position: relative; padding: var(--s-2) var(--s-2) 12px;
  border-radius: var(--r); background: var(--wash);
  box-shadow: var(--clay-sm);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  transition: box-shadow .18s var(--ease);
}
/* 말하는 사람은 테두리로 알립니다 — 소리는 안 보이니까. */
.tile.talking { box-shadow: var(--clay-sm), 0 0 0 3px var(--teal); }
.tile.empty { justify-content: center; color: var(--ink-3); box-shadow: var(--clay-well); background: none; }
.tile img { width: 66px; height: auto; display: block; }
.tile .nm { font-size: 13.5px; font-weight: 700; }
.tile .st { font-size: 11.5px; font-weight: 600; color: var(--ink-3); text-align: center; }
.tile .st.on { color: var(--teal-700); }
.tile .mic {
  position: absolute; top: 8px; right: 8px;
  width: 24px; height: 24px; display: grid; place-items: center;
  border-radius: 50%; background: var(--paper); box-shadow: var(--clay-sm);
  color: var(--ink-2);
}
.tile .mic.off { color: var(--bad-700); }

.side { padding: var(--s-3); border-radius: var(--r); background: var(--paper); box-shadow: var(--clay); }
.side h3 { margin: 0 0 var(--s-2); font-size: 15px; font-weight: 800; letter-spacing: -0.02em; }
.setrow {
  display: flex; align-items: center; justify-content: space-between; gap: var(--s-2);
  padding: 13px 0; border-bottom: 1px solid var(--line);
}
.setrow:last-of-type { border-bottom: 0; }
.setrow .k { font-size: 14.5px; font-weight: 600; }
.setrow .k small { display: block; font-size: 11.5px; font-weight: 500; color: var(--ink-3); }

.sw { position: relative; flex: none; width: 52px; height: 30px; }
.sw input { position: absolute; inset: -5px 0; width: 100%; height: 40px; margin: 0; opacity: 0; cursor: pointer; }
.sw .track {
  display: block; width: 100%; height: 100%; border-radius: var(--r-pill);
  background: var(--wash); box-shadow: var(--clay-well);
  transition: background .18s var(--ease); pointer-events: none;
}
.sw .knob {
  position: absolute; top: 4px; left: 4px; width: 22px; height: 22px;
  border-radius: 50%; background: var(--paper); box-shadow: var(--clay-sm);
  transition: transform .18s var(--ease); pointer-events: none;
}
.sw input:checked ~ .track { background: var(--teal); }
.sw input:checked ~ .knob { transform: translateX(22px); }
.sw input:focus-visible ~ .track { outline: 3px solid var(--teal-700); outline-offset: 3px; }

.say { min-height: 20px; margin: 10px 0 0; font-size: 13px; font-weight: 600; color: var(--teal-700); }
.say.bad { color: var(--bad-700); }

/* ================= 세션 ================= */
.sess { text-align: center; }
.timer {
  margin: var(--s-2) 0 0; font-size: 78px; font-weight: 800;
  letter-spacing: -0.04em; font-variant-numeric: tabular-nums;
  color: var(--ink-toss); line-height: 1;
  text-shadow:
    0 1px 0 rgba(255,255,255,.92),
    0 2px 2px rgba(25,31,40,.18),
    0 10px 20px rgba(25,31,40,.16);
}
.sess .of { margin: 8px 0 0; font-size: 14px; font-weight: 600; color: var(--ink-3); }

/* 아래 조작 줄 — 세션 중에 할 수 있는 것은 셋뿐입니다. */
.bar { margin-top: var(--s-4); display: flex; justify-content: center; gap: var(--s-3); flex-wrap: wrap; }
.lab { display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; color: var(--ink-2); }
.round {
  width: 62px; height: 62px; border: 0; border-radius: 50%;
  display: grid; place-items: center; cursor: pointer;
  background: var(--paper); color: var(--ink);
  box-shadow: var(--clay);
  transition: transform .16s var(--ease), box-shadow .16s var(--ease), background .16s var(--ease), color .16s var(--ease);
}
.round:hover { transform: translateY(-2px); box-shadow: var(--clay-lift); }
.round:active { transform: translateY(1px); box-shadow: var(--clay-press); }
/* 꺼진 상태는 색만으로 말하지 않습니다 — 아이콘이 사선 그어진 것으로
   바뀌고 아래 이름표도 "마이크 켜기" 로 바뀝니다. */
.round[aria-pressed="true"] { background: var(--bad-700); color: #fff; }
.round.leave { background: var(--wash); color: var(--bad-700); }

/* ================= 끝 ================= */
.done { max-width: 560px; margin: 0 auto; text-align: center; }
.done .big {
  margin: var(--s-3) 0 0; font-size: 46px; font-weight: 800;
  letter-spacing: -0.035em; color: var(--teal-700);
  font-variant-numeric: tabular-nums;
}
.done .sub2 { margin: 8px 0 0; font-size: 15px; font-weight: 500; color: var(--ink-2); }
.stats {
  margin: var(--s-4) 0 0; padding: var(--s-3) var(--s-1);
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-2);
  border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
}
.stats dt { font-size: 12.5px; font-weight: 500; color: var(--ink-3); }
.stats dd { margin: 3px 0 0; font-size: 21px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.stats dd small { font-size: 13px; font-weight: 700; margin-left: 1px; }
.done-acts { margin-top: var(--s-4); display: grid; gap: 10px; }

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: .001ms !important; animation-duration: .001ms !important; }
}
</style>
</head>
<body>

<div class="win">

  <header class="titlebar">
    <h1 id="title">초대 세션</h1>
    <span class="sub">PRIVATE ROOM</span>
    <button class="x" type="button" id="close" aria-label="로비로 돌아가기">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </header>

  <main class="body">

    <!-- ============ 1. 방 만들기 (인원 → 시간 → 말하기) ============ -->
    <section class="view wiz" id="v-wiz" aria-labelledby="wiz-h">
      <span class="wiz-track" role="progressbar" aria-valuemin="1" aria-valuemax="3" aria-valuenow="1"
            aria-label="방 만들기 진행" id="wiz-track"><i class="on"></i><i></i><i></i></span>

      <h2 id="wiz-h"></h2>
      <p class="lede" id="wiz-p"></p>
      <div class="picks" id="wiz-picks" role="group" aria-labelledby="wiz-h"></div>

      <div class="wiz-acts">
        <button class="btn ghost" type="button" id="wiz-back">이전</button>
        <button class="go" type="button" id="wiz-next">다음</button>
      </div>
    </section>

    <!-- ============ 2. 대기실 ============ -->
    <section class="view wait" id="v-wait" aria-labelledby="wait-h" hidden>
      <div>
        <h2 id="wait-h">초대 코드를 나눠 주세요</h2>
        <p class="lede">코드를 아는 사람만 들어와요. 학교 인증은 필요 없어요.</p>

        <div class="code-box">
          <span class="code" id="code" aria-label="초대 코드"></span>
          <span class="who" id="who"></span>
          <button class="btn" type="button" id="copy">코드 복사</button>
        </div>

        <h2 style="margin-top:var(--s-4);font-size:17px">지금 방에 있는 사람</h2>
        <div class="tiles" id="tiles"></div>
      </div>

      <aside class="side" aria-labelledby="me-h">
        <h3 id="me-h">들어가기 전에</h3>

        <div class="setrow">
          <span class="k" id="k-mic">마이크 켜기<small>같이 앉는 자리라 기본은 켜짐이에요</small></span>
          <span class="sw">
            <input type="checkbox" id="s-mic" role="switch" aria-labelledby="k-mic" checked>
            <span class="track"></span><span class="knob"></span>
          </span>
        </div>

        <div class="setrow">
          <span class="k" id="k-cam">자세 보기 켜기<small>영상은 어디로도 안 나가요. 이 브라우저 안에서만 봐요</small></span>
          <span class="sw">
            <input type="checkbox" id="s-cam" role="switch" aria-labelledby="k-cam">
            <span class="track"></span><span class="knob"></span>
          </span>
        </div>

        <p class="lede" id="recap" style="margin:var(--s-3) 0 0;font-size:13.5px"></p>
        <button class="go wide" type="button" id="start" style="margin-top:var(--s-3)">모두 준비되면 시작</button>
        <button class="btn ghost" type="button" id="back-wiz" style="width:100%;margin-top:8px">방 설정 다시</button>
        <p class="say" id="say" role="status"></p>
      </aside>
    </section>

    <!-- ============ 3. 세션 ============ -->
    <section class="view sess" id="v-sess" aria-labelledby="sess-h" hidden>
      <h2 id="sess-h" style="margin:0;font-size:17px">함께 집중하는 중</h2>
      <p class="timer" id="timer">50:00</p>
      <p class="of" id="of"></p>

      <div class="tiles" id="tiles2" style="max-width:720px;margin:var(--s-4) auto 0"></div>

      <div class="bar">
        <span class="lab">
          <button class="round" type="button" id="b-mic" aria-pressed="false" aria-label="마이크 끄기">
            <svg id="mic-ico" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
          </button>
          <span id="mic-lab">마이크 끄기</span>
        </span>
        <span class="lab">
          <button class="round leave" type="button" id="b-leave" aria-label="세션 끝내기">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 4.5h3.5a1.5 1.5 0 0 1 1.5 1.5v12a1.5 1.5 0 0 1-1.5 1.5H15"/>
              <path d="M10.5 8 14.5 12l-4 4"/><path d="M14.5 12H4"/>
            </svg>
          </button>
          <span>끝내기</span>
        </span>
      </div>
    </section>

    <!-- ============ 4. 끝 ============ -->
    <section class="view done" id="v-done" aria-labelledby="done-h" hidden>
      <h2 id="done-h">오늘의 집중을 마쳤어요</h2>
      <p class="big" id="done-min">0분</p>
      <p class="sub2" id="done-sub"></p>

      <dl class="stats">
        <div><dt>집중</dt><dd id="d-min">0<small>분</small></dd></div>
        <div><dt>함께한 친구</dt><dd id="d-mates">0<small>명</small></dd></div>
        <div><dt>자세 회복</dt><dd id="d-rec">0<small>회</small></dd></div>
      </dl>

      <div class="done-acts">
        <button class="go" type="button" id="d-card">오늘의 집중 장면 보기</button>
        <button class="btn" type="button" id="d-again">한 번 더 앉기</button>
        <button class="btn ghost" type="button" id="d-home">로비로 나가기</button>
      </div>
    </section>

  </main>
</div>

<script>
/* ==================================================================
   지금은 화면 흐름과 시계만 진짜입니다. 목소리와 참가자 동기화는 월드가
   쓰는 Realtime 채널에 붙일 자리입니다 — 여기서 흉내로 만들어 두면
   나중에 진짜와 어긋납니다. 흉내인 것은 화면에 적습니다.
   ================================================================== */
const $ = (id) => document.getElementById(id);
const read = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const ROOM = read('girin.room', null) || {};

/* 코드는 여섯 자리입니다. 헷갈리는 글자(0·O·1·I)는 뺍니다 — 말로
   불러 주는 코드라 그 넷이 섞이면 매번 되묻게 됩니다. */
function makeCode() {
  const A = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
  let out = '';
  for (let i = 0; i < 6; i++) out += A[Math.floor(Math.random() * A.length)];
  return out;
}

const S = Object.assign(
  { code: '', seats: 4, minutes: 50, talk: true, mic: true, cam: false },
  read('girin.inviteroom', null) || {});
if (!S.code) S.code = makeCode();
write('girin.inviteroom', S);

/* ---------------- 마법사 ----------------
   한 화면에 물음 하나. 라임 시절 다섯 단계에서 "공개/비공개"(여기 들어온
   순간 정해짐)와 "확인"(대기실이 함)을 뺐습니다. */
const STEPS = [
  {
    key: 'seats', h: '몇 명이 앉을까요', p: '나를 포함한 자리 수예요. 나중에 바꿀 수 없어요.',
    opts: [[2, '나 포함'], [4, '나 포함'], [6, '나 포함']], unit: '명',
  },
  {
    key: 'minutes', h: '얼마나 앉을까요', p: '끝나면 오늘의 집중 장면이 남아요.',
    opts: [[25, '짧게'], [50, '기본'], [90, '길게']], unit: '분',
  },
  {
    key: 'talk', h: '말하면서 할까요', p: '조용히를 고르면 모두의 마이크가 꺼진 채로 시작해요.',
    opts: [[true, '자유롭게'], [false, '집중만']], labels: ['이야기하며', '조용히'],
  },
];
let step = 0;

function wizPaint() {
  const st = STEPS[step];
  $('wiz-h').textContent = st.h;
  $('wiz-p').textContent = st.p;
  $('wiz-track').setAttribute('aria-valuenow', String(step + 1));
  [...$('wiz-track').children].forEach((el, i) => el.classList.toggle('on', i <= step));
  $('wiz-back').hidden = step === 0;
  $('wiz-next').textContent = step === STEPS.length - 1 ? '방 만들기' : '다음';

  $('wiz-picks').innerHTML = st.opts.map(([v, note], i) => {
    const label = st.labels ? st.labels[i] : v + (st.unit || '');
    return '<button class="pick" type="button" data-v="' + esc(String(v)) + '"'
      + ' aria-pressed="' + String(S[st.key] === v) + '">'
      + '<b>' + esc(label) + '</b><span>' + esc(note) + '</span></button>';
  }).join('');

  $('wiz-picks').querySelectorAll('.pick').forEach((b) => {
    b.addEventListener('click', () => {
      const raw = b.dataset.v;
      S[st.key] = raw === 'true' ? true : raw === 'false' ? false : Number(raw);
      write('girin.inviteroom', S);
      wizPaint();
    });
  });
}

/* 단계도 화면입니다. 자국을 안 남기면 2단계에서 뒤로가기를 누를 때
   1단계가 아니라 이전 페이지로 갑니다. */
const VIEW_HASH = ['#seats', '#minutes', '#talk', '#room', '#focus', '#done'];
function mark(i) {
  if (location.hash !== VIEW_HASH[i]) history.pushState({ v: i }, '', VIEW_HASH[i]);
}
addEventListener('popstate', () => {
  const i = Math.max(0, VIEW_HASH.indexOf(location.hash));
  /* 세션 중에는 뒤로 못 갑니다 — 시계가 도는 중에 화면만 물러나면
     시간이 어디로 갔는지 알 수 없습니다. */
  if (!$('v-sess').hidden || !$('v-done').hidden) { mark(!$('v-done').hidden ? 5 : 4); return; }
  if (i <= 2) { $('v-wait').hidden = true; $('v-wiz').hidden = false; step = i; wizPaint(); }
});

$('wiz-next').addEventListener('click', () => {
  if (step < STEPS.length - 1) { step += 1; mark(step); wizPaint(); return; }
  /* 조용히를 골랐으면 마이크가 꺼진 채로 시작합니다 — 고른 것과 다르게
     켜져 있으면 첫 마디가 나가고 나서야 압니다. */
  if (!S.talk) S.mic = false;
  write('girin.inviteroom', S);
  toWait();
});
$('wiz-back').addEventListener('click', () => { if (step > 0) history.back(); });
$('back-wiz').addEventListener('click', () => {
  $('v-wait').hidden = true; $('v-wiz').hidden = false;
  step = 0; wizPaint(); $('wiz-next').focus();
});

/* ---------------- 참가자 ----------------
   지금은 나 혼자입니다. 다른 사람은 코드로 들어와야 생깁니다 — 아무도
   없는데 친구 셋을 그려 두면 그게 진짜인 줄 압니다. */
const CHAR = { turtle: '거북이', penguin: '펭귄', frog: '개구리' };
const PEOPLE = [{ me: true, nick: ROOM.nickname || '나', ch: 'turtle', mic: S.mic, ready: true }];

const MIC_ON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.6" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5v3.9"/></svg>';
const MIC_OFF = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5.6a3 3 0 0 1 6 0V11"/><path d="M5.5 11a6.5 6.5 0 0 0 9.3 5.9"/><path d="M12 17.5v3.9"/><path d="m3.5 3.5 17 17"/></svg>';

function paintTiles(el) {
  const empties = Math.max(0, S.seats - PEOPLE.length);
  el.innerHTML = PEOPLE.map((p) => `
    <div class="tile${p.talking ? ' talking' : ''}">
      <span class="mic${p.mic ? '' : ' off'}" aria-hidden="true">${p.mic ? MIC_ON : MIC_OFF}</span>
      <img src="../lobby/assets/char-${p.ch}.png" alt="${esc(CHAR[p.ch])} 캐릭터">
      <span class="nm">${esc(p.nick)}${p.me ? ' (나)' : ''}</span>
      <span class="st${p.ready ? ' on' : ''}">${p.ready ? '준비됨' : '준비 중'}</span>
    </div>`).join('')
    + Array.from({ length: empties }, () => `
    <div class="tile empty">
      <span style="font-size:24px;font-weight:800">+</span>
      <span class="st">코드로 들어오면 여기 떠요</span>
    </div>`).join('');
}

function toWait() {
  mark(3);
  $('v-wiz').hidden = true;
  $('v-wait').hidden = false;
  $('code').textContent = S.code;
  $('who').textContent = (ROOM.nickname || '나') + ' 님의 방';
  $('recap').textContent = S.seats + '명 · ' + S.minutes + '분 · ' + (S.talk ? '이야기하며' : '조용히');
  $('s-mic').checked = S.mic;
  $('s-cam').checked = S.cam;
  PEOPLE[0].mic = S.mic;
  paintTiles($('tiles'));
  $('code').focus?.();
}

/* ---------------- 대기실 조작 ---------------- */
$('copy').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(S.code);
    say('코드를 복사했어요');
  } catch {
    /* 클립보드가 막힌 곳에서는 고르게 해 줍니다 — 실패만 알리면 손으로
       옮겨 적을 방법이 없습니다. */
    const r = document.createRange();
    r.selectNodeContents($('code'));
    getSelection().removeAllRanges(); getSelection().addRange(r);
    say('코드를 골라 뒀어요. 직접 복사해 주세요', 'bad');
  }
});

function bindSwitch(id, key) {
  const el = $(id);
  el.addEventListener('change', () => {
    S[key] = el.checked;
    write('girin.inviteroom', S);
    if (key === 'mic') { PEOPLE[0].mic = el.checked; paintTiles($('tiles')); }
  });
}
bindSwitch('s-mic', 'mic');
bindSwitch('s-cam', 'cam');

let sayTimer = 0;
function say(msg, tone) {
  const el = $('say');
  el.textContent = msg;
  el.className = 'say' + (tone ? ' ' + tone : '');
  clearTimeout(sayTimer);
  sayTimer = setTimeout(() => { el.textContent = ''; }, 2600);
}

/* ---------------- 세션 ---------------- */
let tick = 0, startedAt = 0, left = 0;

const fmt = (sec) => String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');

$('start').addEventListener('click', () => {
  mark(4);
  $('v-wait').hidden = true;
  $('v-sess').hidden = false;
  $('title').textContent = '집중 중';
  PEOPLE[0].mic = S.mic;
  paintTiles($('tiles2'));
  paintMic();
  $('of').textContent = S.minutes + '분 중 · ' + (S.talk ? '이야기하며' : '조용히');
  left = S.minutes * 60;
  startedAt = Date.now();
  $('timer').textContent = fmt(left);
  /* 남은 시간은 시계에서 다시 계산합니다. 1초마다 빼기만 하면 탭이
     뒤로 가 있는 동안 브라우저가 타이머를 늦춰서 실제보다 길어집니다. */
  clearInterval(tick);
  tick = setInterval(() => {
    left = Math.max(0, S.minutes * 60 - Math.floor((Date.now() - startedAt) / 1000));
    $('timer').textContent = fmt(left);
    if (left === 0) { clearInterval(tick); finish(); }
  }, 500);
  $('b-mic').focus();
});

function paintMic() {
  const off = !PEOPLE[0].mic;
  $('b-mic').setAttribute('aria-pressed', String(off));
  $('b-mic').setAttribute('aria-label', off ? '마이크 켜기' : '마이크 끄기');
  $('mic-lab').textContent = off ? '마이크 켜기' : '마이크 끄기';
  $('mic-ico').innerHTML = off
    ? '<path d="M9 5.6a3 3 0 0 1 6 0V11"/><path d="M5.5 11a6.5 6.5 0 0 0 9.3 5.9"/><path d="M12 17.5v3.9"/><path d="m3.5 3.5 17 17"/>'
    : '<rect x="9" y="2.6" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5v3.9"/>';
}

$('b-mic').addEventListener('click', () => {
  PEOPLE[0].mic = !PEOPLE[0].mic;
  S.mic = PEOPLE[0].mic;
  write('girin.inviteroom', S);
  paintMic();
  paintTiles($('tiles2'));
});

/* ---------------- 끝 ----------------
   끝내자마자 공유 화면을 들이밀지 않습니다. 나가려던 사람을 붙잡는 것이
   됩니다. 얼마나 앉았는지만 보여 주고, 카드는 고를 수 있게 둡니다. */
let lastMinutes = 0;

function finish() {
  clearInterval(tick);
  const done = Math.floor((Date.now() - startedAt) / 1000);
  lastMinutes = Math.max(1, Math.round(done / 60));
  const mates = PEOPLE.length - 1;

  const list = read('girin.sessions', []) || [];
  list.push({
    at: Date.now(), minutes: lastMinutes, recoveries: 0,
    seatedMs: done * 1000, detectableMinutes: S.cam ? lastMinutes : 0,
    mates: mates,
  });
  write('girin.sessions', list);

  mark(5);
  $('v-sess').hidden = true;
  $('v-done').hidden = false;
  $('title').textContent = '초대 세션';
  $('done-min').textContent = lastMinutes >= 60
    ? Math.floor(lastMinutes / 60) + '시간 ' + (lastMinutes % 60) + '분'
    : lastMinutes + '분';
  $('done-sub').textContent = mates > 0
    ? PEOPLE[0].nick + ' 외 ' + mates + '명과 함께 집중했어요.'
    : '오늘의 집중 장면을 남겼어요.';
  $('d-min').innerHTML = lastMinutes + '<small>분</small>';
  $('d-mates').innerHTML = mates + '<small>명</small>';
  $('d-rec').innerHTML = '0<small>회</small>';
  $('d-card').focus();
}

$('b-leave').addEventListener('click', finish);
$('d-card').addEventListener('click', () => { location.href = '../mypage/index.html#sessions'; });
$('d-again').addEventListener('click', () => {
  $('v-done').hidden = true; $('v-wiz').hidden = false;
  step = 0; wizPaint();
  S.code = makeCode(); write('girin.inviteroom', S);
  $('wiz-next').focus();
});
$('d-home').addEventListener('click', () => { location.href = '../lobby/index.html'; });

$('close').addEventListener('click', () => {
  clearInterval(tick);
  location.href = '../lobby/index.html';
});

wizPaint();
</script>

<!-- 오른쪽 세로 레일. 로비는 제목줄 × 가 맡습니다. -->
<script src="../shared/corner-nav.js" data-page="room"></script>
</body>
