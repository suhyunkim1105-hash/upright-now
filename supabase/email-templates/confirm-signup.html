<!-- Supabase 대시보드 → Authentication → Emails → Confirm signup 에 붙입니다.
     제목(Subject): Deskfit 인증번호 {{ .Token }}
     원본은 저장소의 이 파일입니다. 대시보드에서 직접 고치지 말고 여기서
     고쳐서 다시 붙이세요 — 대시보드 쪽은 되돌릴 이력이 없습니다.

     메일 클라이언트는 <style> 블록과 웹폰트를 자주 버립니다. 그래서 모든
     스타일이 인라인이고 서체는 기기에 있는 것만 씁니다. -->
<table width="100%" cellpadding="0" cellspacing="0" border="0"
       style="background:#F7F8F8;padding:40px 16px;margin:0;">
  <tr>
    <td align="center">
      <table width="100%" cellpadding="0" cellspacing="0" border="0"
             style="max-width:440px;background:#FFFFFF;border-radius:20px;padding:36px 32px;
                    font-family:'Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif;">
        <tr>
          <td style="font-size:15px;font-weight:800;color:#0D7769;letter-spacing:-.01em;
                     padding-bottom:22px;">Deskfit</td>
        </tr>
        <tr>
          <td style="font-size:21px;font-weight:800;color:#2B3230;letter-spacing:-.02em;
                     line-height:1.4;padding-bottom:10px;">아래 번호를 입력해 주세요</td>
        </tr>
        <tr>
          <td style="font-size:14px;color:#5F6764;line-height:1.65;padding-bottom:26px;">
            학교 메일이 맞는지 확인하는 절차예요.<br>
            메일을 받은 그 화면으로 돌아가서 입력하면 돼요.
          </td>
        </tr>
        <tr>
          <td align="center"
              style="background:#EFFBF9;border-radius:14px;padding:22px 16px;">
            <div style="font-size:34px;font-weight:800;color:#0D7769;
                        letter-spacing:.22em;text-indent:.22em;
                        font-variant-numeric:tabular-nums;">{{ .Token }}</div>
          </td>
        </tr>
        <tr>
          <td style="font-size:13px;color:#5F6764;line-height:1.65;padding-top:24px;">
            1시간 안에 입력해 주세요. 지나면 다시 받으면 돼요.
          </td>
        </tr>
        <tr>
          <td style="border-top:1px solid rgba(43,50,48,.10);
                     padding-top:20px;font-size:12px;color:#5F6764;line-height:1.65;">
            요청한 적이 없다면 이 메일은 그냥 두셔도 돼요. 번호를 입력하지
            않으면 아무 일도 일어나지 않습니다.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
